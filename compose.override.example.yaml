# Drop-in extension for compose.yaml that mounts the dist/ of a sibling
# zonventure-web checkout as the marketing override surface — replaces
# the embedded brand-neutral landing/pricing with whatever
# zonventure-web ships.
#
# To enable:
#   1. Clone zonventure-web alongside this repo.
#   2. cp compose.override.example.yaml compose.override.yaml
#   3. docker compose up -d   (Compose auto-merges *.override.yaml)
#
# Edit compose.override.yaml — not this example — so future
# `git pull`s don't clobber local tweaks.

services:
  app:
    environment:
      ZV_WEB_OVERRIDE_DIR: /var/zv/web-override
      ZV_LANDING_ENABLED: "1"
    volumes:
      - ../zonventure-web/dist:/var/zv/web-override:ro
