<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zonventure Studio | Live</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<!-- Public-but-unguessable URL: a leaked /live/{token} should still
     show *something* sensible if pasted into Slack. Generic copy
     keeps team data out of social previews. -->
<meta property="og:title" content="Zonventure Studio | Live Event">
<meta property="og:description" content="Live leaderboard for an in-progress Zonventure event.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aclonica&family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="/i18n.js"></script>
<style>
:root {
  --accent:       #e24080;  /* raspberry lifted for dark bg */
  --accent-2:     #ad1357;
  --accent-secondary: #e24080; /* per-adventure brand override; defaults to --accent */
  --gold:         #f5c452;
  --silver:       #cbd5e1;
  --bronze:       #d48a4a;
  --ink:          #0b1220;
  --bg-1:         #0b1220;
  --bg-2:         #182238;
  --surface:      #131c2e;
  --surface-2:    #1b2640;
  --text:         #f1f5f9;
  --muted:        #94a3b8;
  --danger:       #f87171;
  --success:      #34d399;
  --radius:       12px;
  --radius-sm:    8px;
  --space-1: .25rem;
  --space-2: .5rem;
  --space-3: .75rem;
  --space-4: 1rem;
  --space-5: 1.25rem;
  --space-6: 1.75rem;
  --ts-xs: .75rem;
  --ts-sm: .85rem;
  --ts-md: 1rem;
  --ts-lg: 1.15rem;
  --tap-target: 2.75rem;
  --font-body:    'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-brand:   'Aclonica', 'Vollkorn', Georgia, serif;
}
.visually-hidden {
  position: absolute !important;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent);
  outline-offset: 2px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  color: var(--text);
  font-family: var(--font-body);
  background:
    radial-gradient(ellipse at 20% -20%, rgba(226,64,128,.18), transparent 55%),
    radial-gradient(ellipse at 110% 120%, rgba(66,154,63,.15), transparent 55%),
    linear-gradient(180deg, #0b1220 0%, #101a33 100%);
  background-attachment: fixed;
  overflow-x: hidden;
}

.app {
  /* Cap at the viewport so the leaderboard's soft-fade mask can do
     its thing — without a fixed outer height, flex:1 children grow to
     fit their content and there's nothing to mask. */
  height: 100vh;
  display: flex; flex-direction: column;
  padding: clamp(1rem, 2.5vw, 2.5rem);
  gap: clamp(1rem, 2vw, 2rem);
  overflow: hidden;
}

/* ---------- Header ---------- */
.topline {
  display: grid; grid-template-columns: auto 1fr auto; gap: 1.25rem;
  align-items: center;
}
.brand {
  font-family: var(--font-brand);
  font-size: clamp(1.4rem, 2.6vw, 2.2rem);
  color: var(--accent-secondary);
  line-height: 1;
}
.title {
  text-align: center; line-height: 1;
}
.title h1 {
  font-weight: 800;
  font-size: clamp(1.6rem, 4vw, 3rem);
  letter-spacing: -.01em;
}
.title .slug {
  font-size: clamp(.8rem, 1vw, 1rem);
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .25em;
  margin-top: .35rem;
  font-weight: 700;
}
.clockwrap {
  display: flex; align-items: center; gap: .75rem;
  justify-content: flex-end;
}
.clock {
  font-variant-numeric: tabular-nums;
  font-size: clamp(1.3rem, 2.2vw, 1.9rem);
  font-weight: 700;
  letter-spacing: .05em;
}
.clock small {
  display: block; font-size: .55em; font-weight: 600;
  color: var(--muted); text-transform: uppercase; letter-spacing: .18em;
}
.state-pill {
  display: inline-flex; align-items: center; gap: .4rem;
  padding: .35rem 1rem; border-radius: 999px;
  font-size: clamp(.7rem, 1vw, .9rem);
  font-weight: 800; text-transform: uppercase; letter-spacing: .14em;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.08);
}
.state-pill.running { color: var(--success); background: rgba(52,211,153,.12); border-color: rgba(52,211,153,.25); }
.state-pill.paused  { color: var(--gold);    background: rgba(245,196,82,.14); border-color: rgba(245,196,82,.3); }
.state-pill.completed, .state-pill.scheduled { color: var(--muted); }
.state-pill.cancelled { color: var(--danger, #f47171); background: rgba(244,113,113,.12); border-color: rgba(244,113,113,.3); }
.cancelled-banner { padding: 1rem 1.4rem; text-align: center; font-size: 1.4rem; }
.state-pill .dot { width: .6rem; height: .6rem; border-radius: 50%; background: currentColor; }
.state-pill.running .dot { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: .4; } }

.fs-btn {
  background: rgba(255,255,255,.08);
  color: var(--text);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 999px;
  padding: .5rem .9rem; font: inherit; font-weight: 700;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: .4rem;
}
.fs-btn:hover { background: rgba(255,255,255,.14); }
.fs-btn svg { width: 16px; height: 16px; }

/* ---------- Leaderboard ---------- */
.board {
  display: grid; gap: clamp(.5rem, 1vw, 1rem);
  flex: 1;
  align-content: start;
  min-height: 0;       /* allow flex track to shrink past content size */
  overflow: hidden;    /* clip tail rows that don't fit the viewport */
}
/* When the board can't fit every row, fade the bottom so the cut-off
   doesn't look broken. JS toggles .overflow based on scrollHeight. */
.board.overflow {
  -webkit-mask-image: linear-gradient(to bottom, black 58%, transparent 100%);
  mask-image: linear-gradient(to bottom, black 58%, transparent 100%);
}
/* Rank 4+ rows are less emphasised — the podium keeps the spotlight.
   The team-colour left stripe is swapped for a muted gray so only
   the top three carry the team tint. */
.row.rank-tail {
  opacity: .72;
  padding: clamp(.5rem, 1vw, .95rem) clamp(.85rem, 1.75vw, 1.6rem);
  border-left-color: rgba(255, 255, 255, .12);
}
.row.rank-tail .rank { font-size: clamp(1.3rem, 2.5vw, 2.4rem); }
.row.rank-tail .team-name { font-size: clamp(.95rem, 1.5vw, 1.4rem); }
.row.rank-tail .row-avatar { width: clamp(3rem, 5vw, 4.5rem); }
.row.rank-tail .members { font-size: clamp(.7rem, .9vw, .9rem); }

/* Split layout when the run's show_map flag is on. On wide screens the
   map sits to the right of the leaderboard; below 900px they stack. */
.split {
  display: grid; gap: clamp(1rem, 2vw, 2rem);
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  /* Cap the split track at the flex space the .app gives it so the
     map's intrinsic height doesn't push the row past the viewport
     when the leaderboard has many teams. */
  grid-template-rows: minmax(0, 1fr);
  flex: 1;
  min-height: 0;
  align-content: stretch;
}
.split > .board { grid-column: 1 / 2; }
.split > .mapwrap { grid-column: 2 / 3; }
@media (max-width: 900px) {
  .split { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
  .split > .mapwrap { grid-column: 1; }
}
.mapwrap {
  display: flex; flex-direction: column;
  border-radius: 18px; overflow: hidden;
  border: 1px solid rgba(255,255,255,.08);
  background: rgba(255,255,255,.02);
  min-height: 0;
}
.mapwrap .mapinner { flex: 1; min-height: 0; }
.mapwrap .maphint {
  padding: .6rem 1rem; color: var(--muted); font-size: var(--ts-sm);
  text-align: center; border-top: 1px solid rgba(255,255,255,.05);
}
.puzzle-marker {
  width: 28px; height: 28px;
  background: rgba(0,0,0,.8); color: #fff;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: .8rem;
  border: 2px solid #fff;
}
.puzzle-marker.gated { background: var(--accent); }
.puzzle-marker > span { transform: rotate(45deg); }
.team-dot {
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid #fff;
  box-shadow: 0 0 0 1px rgba(0,0,0,.25);
}

.row {
  display: grid;
  /* rank | avatar | main content | optional right-side stat */
  grid-template-columns: auto auto 1fr auto;
  gap: clamp(.75rem, 1.5vw, 1.5rem);
  align-items: center;
  padding: clamp(.75rem, 1.5vw, 1.4rem) clamp(1rem, 2vw, 2rem);
  background: linear-gradient(180deg, rgba(255,255,255,.045) 0%, rgba(255,255,255,.02) 100%);
  border: 1px solid rgba(255,255,255,.07);
  border-left: 6px solid var(--team-color, var(--accent));
  border-radius: 18px;
  box-shadow: 0 4px 20px rgba(0,0,0,.35);
  transition: transform .5s cubic-bezier(.2,.8,.2,1), background .3s, border-color .3s;
  will-change: transform;
}
/* Avatar cell sits left of the main text block. Fixed-width cell
   scales with viewport; the avatar inside forces aspect-ratio 1 so
   it's always a perfect circle (rounded squares are reserved for
   adventure surfaces). */
.row-avatar {
  align-self: center;
  display: flex;
  align-items: center;
  justify-content: center;
  width: clamp(4rem, 7vw, 6.5rem);
}
.row-avatar > .team-avatar-lv {
  width: 100%;
  height: auto;
  aspect-ratio: 1;
  font-size: clamp(1.4rem, 2.4vw, 2.2rem);
  border-radius: 50%;
  border-width: 3px;
}
.row.rank-1 {
  border-color: rgba(245,196,82,.35);
  background: linear-gradient(180deg, rgba(245,196,82,.14) 0%, rgba(245,196,82,.04) 100%);
  box-shadow: 0 8px 36px rgba(245,196,82,.18), 0 2px 10px rgba(0,0,0,.35);
}
.row.rank-2 {
  border-color: rgba(203,213,225,.35);
  background: linear-gradient(180deg, rgba(203,213,225,.10) 0%, rgba(203,213,225,.02) 100%);
}
.row.rank-3 {
  border-color: rgba(212,138,74,.35);
  background: linear-gradient(180deg, rgba(212,138,74,.10) 0%, rgba(212,138,74,.02) 100%);
}
.row.finished { outline: 2px solid rgba(52,211,153,.4); }
.row.new { animation: slideIn .4s ease; }
@keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.rank {
  font-family: var(--font-brand);
  font-size: clamp(2rem, 4vw, 3.6rem);
  line-height: 1;
  width: clamp(3rem, 5vw, 5rem);
  text-align: center;
  color: var(--muted);
}
.rank-1 .rank { color: var(--gold); text-shadow: 0 0 18px rgba(245,196,82,.35); }
.rank-2 .rank { color: var(--silver); }
.rank-3 .rank { color: var(--bronze); }
.rank-1 .rank::before { content: '🏆 '; font-family: var(--font-body); font-size: .7em; }

.main { display: grid; gap: .35rem; min-width: 0; }
.team-name {
  font-size: clamp(1.2rem, 2.2vw, 2rem);
  font-weight: 800;
  letter-spacing: -.01em;
  display: flex; align-items: center; gap: .75rem;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.team-dot {
  display: inline-block;
  width: .9em; height: .9em; border-radius: 50%;
  background: var(--team-color, var(--accent));
  box-shadow: 0 0 0 3px rgba(255,255,255,.08);
  flex-shrink: 0;
}
/* Leaderboard team avatar: circular, same size as the old dot's em
   box so the layout doesn't shift. Coloured border acts as the team's
   identity swatch even when an uploaded picture fills the inside. */
.team-avatar-lv {
  display: inline-flex; align-items: center; justify-content: center;
  width: 2.1em; height: 2.1em; border-radius: 50%;
  overflow: hidden; flex-shrink: 0;
  border: 2px solid rgba(255,255,255,.15);
  color: #fff; font-weight: 800; font-size: .65em;
  text-transform: uppercase; letter-spacing: .04em;
  box-shadow: 0 0 0 3px rgba(255,255,255,.06);
}
.team-avatar-lv img { width: 100%; height: 100%; object-fit: cover; display: block; }
/* Map marker counterpart: slightly larger than the leaderboard to
   stay legible at TV viewing distance. */
.team-marker-lv {
  width: 100%; height: 100%; border-radius: 50%;
  overflow: hidden;
  border: 3px solid var(--team-col, #e24080);
  background: var(--team-col, #e24080);
  box-shadow: 0 0 0 2px #fff, 0 4px 12px rgba(0,0,0,.5);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 800; font-size: 13px;
}
.team-marker-lv img { width: 100%; height: 100%; object-fit: cover; display: block; }
.members {
  color: var(--muted);
  font-size: clamp(.75rem, 1vw, 1rem);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.progress {
  display: grid; gap: .4rem; margin-top: .3rem;
}
.progress .bar {
  height: 10px; border-radius: 999px;
  background: rgba(255,255,255,.08);
  overflow: hidden;
}
.progress .fill {
  height: 100%;
  background: linear-gradient(90deg, var(--team-color, var(--accent)), var(--accent));
  border-radius: 999px;
  /* A straight CSS transition on width. The bar is re-rendered on
     every snapshot, so to make the transition actually fire (and only
     when the value changes) renderRow paints the previous pct first,
     then flips to the new pct on the next frame — see lastPct below. */
  transition: width .9s cubic-bezier(.2, .8, .2, 1);
}
.progress .label {
  display: flex; justify-content: space-between;
  color: var(--muted);
  font-size: clamp(.7rem, .95vw, .9rem);
  font-weight: 600;
}
.progress .label strong { color: var(--text); font-weight: 800; }

.stat {
  text-align: right; min-width: 6ch;
}
.stat .value {
  font-size: clamp(1.4rem, 2.5vw, 2.4rem);
  font-weight: 800; line-height: 1;
  font-variant-numeric: tabular-nums;
}
.stat .unit {
  font-size: clamp(.7rem, .85vw, .85rem);
  color: var(--muted);
  text-transform: uppercase; letter-spacing: .12em; font-weight: 700;
  margin-top: .2rem;
}
.stat.finished .value { color: var(--success); font-family: var(--font-brand); font-size: clamp(1.1rem, 1.8vw, 1.6rem); }

.empty-board {
  text-align: center; padding: 4rem 1rem;
  color: var(--muted); font-size: 1.2rem;
}

/* Pre-start card: shown while the run is scheduled/unstarted. Big
   countdown digits when a start time is set, calmer copy otherwise.
   Fills the leaderboard slot so the TV has something worth watching
   before the flag drops. */
.prestart {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  gap: 1rem;
  padding: 2rem 1rem;
}
.prestart .banner {
  font-family: var(--font-brand);
  color: var(--accent-secondary);
  font-size: clamp(1.2rem, 2.5vw, 2rem);
  letter-spacing: .08em; text-transform: uppercase;
}
.prestart .countdown {
  font-variant-numeric: tabular-nums;
  font-weight: 800;
  font-size: clamp(3.5rem, 12vw, 10rem);
  line-height: 1;
  color: var(--text);
  letter-spacing: -.02em;
}
.prestart .countdown small {
  display: block;
  font-size: clamp(.7rem, 1vw, 1rem);
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .22em;
  margin-top: .6rem;
}
.prestart .whenline {
  font-size: clamp(.9rem, 1.2vw, 1.2rem);
  color: var(--muted);
}

/* Start animation: full-screen burst when the run flips from
   scheduled → running. Similar feel to play.html's celebrate but
   uses the adventure accent instead of success green. */
.startfx {
  position: fixed; inset: 0; z-index: 9999;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  pointer-events: none;
  background: radial-gradient(ellipse at center, rgba(0,0,0,.35) 0%, rgba(0,0,0,.65) 100%);
  animation: startFxFade .3s ease;
}
.startfx.gone { animation: startFxFadeOut .5s ease forwards; }
@keyframes startFxFade    { from { opacity: 0 } to { opacity: 1 } }
@keyframes startFxFadeOut { from { opacity: 1 } to { opacity: 0 } }
.startfx .ring {
  width: 200px; height: 200px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, color-mix(in srgb, var(--accent) 80%, #fff), var(--accent));
  display: grid; place-items: center;
  color: #fff;
  font-family: var(--font-brand);
  font-size: 3rem; line-height: 1;
  box-shadow: 0 0 0 10px color-mix(in srgb, var(--accent) 30%, transparent),
              0 14px 50px rgba(0,0,0,.45);
  transform: scale(0);
  animation: startFxPop .65s cubic-bezier(.2,1.6,.4,1) .05s forwards;
}
@keyframes startFxPop { to { transform: scale(1) } }
.startfx .head {
  font-family: var(--font-brand); color: #fff;
  font-size: clamp(2.2rem, 7vw, 4rem);
  letter-spacing: .02em;
  margin-top: 1.2rem;
  opacity: 0; animation: startFxRise .45s .55s ease forwards;
}
.startfx .sub {
  color: rgba(255,255,255,.85); font-weight: 700;
  margin-top: .3rem; text-transform: uppercase; letter-spacing: .18em;
  font-size: clamp(.8rem, 1vw, 1rem);
  opacity: 0; animation: startFxRise .45s .8s ease forwards;
}
@keyframes startFxRise {
  from { opacity: 0; transform: translateY(10px) }
  to   { opacity: 1; transform: translateY(0) }
}
.startfx .piece {
  position: absolute; top: -30px;
  width: 12px; height: 20px; border-radius: 2px;
  background: var(--c, var(--accent));
  animation: startFxConfetti 2.6s var(--d, 0ms) cubic-bezier(.25,.75,.45,1) forwards;
  will-change: transform, opacity;
}
@keyframes startFxConfetti {
  0%   { opacity: 0; transform: translate(0, -50px) rotate(0) }
  6%   { opacity: 1 }
  100% { opacity: 0; transform: translate(var(--dx, 0), 110vh) rotate(var(--rot, 360deg)) }
}

.footer {
  color: var(--muted);
  font-size: clamp(.7rem, .95vw, .9rem);
  text-align: center;
  letter-spacing: .1em; text-transform: uppercase; font-weight: 700;
}

/* Trailing "thanks for watching" line on the post-event TV frame.
   Slightly faded so the winner's name carries the eye, not this. */
.prestart .whenline.thanks { margin-top: 1rem; opacity: .65; }

/* Finished-team pill on the leaderboard. Glanceable from across a
   venue: ✓ + label so the cue isn't color-only (WCAG AA). */
.team-name .finished-pill {
  display: inline-flex; align-items: center; gap: .25em;
  margin-left: .7em;
  padding: .05em .55em;
  border-radius: 999px;
  background: color-mix(in srgb, var(--success) 28%, transparent);
  color: var(--success);
  font-size: .55em; font-weight: 800;
  text-transform: uppercase; letter-spacing: .18em;
}

/* Connection status: a thin stripe across the top of the live view so
   anyone glancing at the TV knows the leaderboard might be stale.
   Hidden by default; toggled by setLiveStatus() based on WS state. */
.ws-status {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 4000;
  padding: .35rem .75rem;
  text-align: center;
  font-size: clamp(.75rem, 1vw, .9rem);
  font-weight: 800;
  letter-spacing: .08em; text-transform: uppercase;
  background: rgba(245, 196, 82, .92);
  color: #1a0f00;
  transform: translateY(-100%);
  transition: transform 200ms ease;
}
.ws-status.show { transform: translateY(0); }
.ws-status.err  { background: rgba(255, 95, 95, .94); color: #160000; }
</style>
</head>
<body>
<main id="root" class="app" aria-label="Live leaderboard"><div class="empty-board" id="initial-loading">Loading…</div></main>

<script>
// Localise the initial loading placeholder that's baked into the
// HTML — the script runs after i18n.js loads, so t() is available.
const initialLoading = document.getElementById('initial-loading');
if (initialLoading) initialLoading.textContent = t('Loading…');

const TEAM_COLORS = ['#e24080', '#7fd17b', '#60a5fa', '#f5c452', '#a78bfa', '#22d3ee', '#fb7185', '#34d399'];

// lastPct remembers the last progress-bar percentage rendered per
// team id, so on the next snapshot we can paint the fill at the OLD
// value first and then animate to the NEW one via the CSS transition.
// Without this the bar would either replay from 0 every tick (if we
// used keyframes) or snap instantly to the new width (fresh node →
// no transition). Entries are kept across snapshots; a team id that
// disappears just leaves a stale entry behind, which is harmless.
const lastPct = new Map();
function teamColor(i) { return TEAM_COLORS[i % TEAM_COLORS.length]; }

function teamInitials(name) {
  const parts = (name || '').trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return '?';
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

// applyColors overrides the CSS palette from a per-adventure brand. Same
// logic as play.html — kept duplicated (~30 lines) rather than extracted
// into a shared script, because these two pages intentionally have no
// shared runtime bundle.
function applyColors(c) {
  const root = document.documentElement;
  if (!c) {
    for (const v of ['--accent', '--accent-secondary', '--bg-1', '--bg-2', '--text', '--ink']) {
      root.style.removeProperty(v);
    }
    document.body && (document.body.style.background = '');
    return;
  }
  if (c.accent) root.style.setProperty('--accent', c.accent); else root.style.removeProperty('--accent');
  root.style.setProperty('--accent-secondary', c.accent_secondary || c.accent || '');
  if (!c.accent_secondary && !c.accent) root.style.removeProperty('--accent-secondary');
  if (c.background) {
    // live.html paints a multi-layer gradient onto <body>; overriding
    // --bg-1 alone leaves the accents of the gradient dominant. Replace
    // the body background entirely for a brand-solid look.
    document.body.style.background = c.background;
  } else {
    document.body.style.background = '';
  }
  if (c.text) root.style.setProperty('--text', c.text); else root.style.removeProperty('--text');
}

const LIVE_TOKEN = location.pathname.split('/').pop();

// Latest payloads from the server. render() reads from these; the WS
// onmessage handler writes to them.
let latestSnapshot = null;
let latestTracks = [];

function h(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'on') for (const [ev, fn] of Object.entries(v)) e.addEventListener(ev, fn);
    else if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else e.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c === null || c === undefined || c === false) continue;
    e.append(c?.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}

const knownTeams = new Set();

// Server timestamps are stored as 'YYYY-MM-DD HH:MM:SS' UTC text
// (now_text()), with no trailing Z. Without forcing UTC, new Date()
// parses them as local time and the elapsed clock skews by the
// browser's UTC offset.
function parseServerTime(s) {
  if (!s) return null;
  return new Date(s.includes('T') ? s : s.replace(' ', 'T') + 'Z');
}

function formatElapsed(startISO, nowISO) {
  if (!startISO) return '—';
  const start = parseServerTime(startISO);
  const now = nowISO ? parseServerTime(nowISO) : new Date();
  const sec = Math.max(0, Math.round((now.getTime() - start.getTime()) / 1000));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const pad = (n) => String(n).padStart(2, '0');
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}

function formatFinishTime(startISO, completedAt) {
  if (!startISO || !completedAt) return '';
  const start = parseServerTime(startISO);
  const end = parseServerTime(completedAt);
  const sec = Math.max(0, Math.round((end.getTime() - start.getTime()) / 1000));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const pad = (n) => String(n).padStart(2, '0');
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}

// formatFinishGap renders the delta between the winner's finish time
// and a later finisher's finish time as "+MM:SS" (or "+H:MM:SS" when
// the gap is an hour or more). Used on the live leaderboard for
// positions 2+, so viewers see at a glance how close the chase was.
function formatFinishGap(winnerCompletedAt, completedAt) {
  if (!winnerCompletedAt || !completedAt) return '';
  const sec = Math.max(0, Math.round((parseServerTime(completedAt).getTime() - parseServerTime(winnerCompletedAt).getTime()) / 1000));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const pad = (n) => String(n).padStart(2, '0');
  return h ? `+${h}:${pad(m)}:${pad(s)}` : `+${pad(m)}:${pad(s)}`;
}

// mapShown is a client-side override. null → follow the server's
// show_map flag; true/false → override it (the `m` shortcut flips it).
let mapShown = null;

function showMapEffective(data) {
  return mapShown !== null ? mapShown : !!data?.show_map;
}

// isPreStart reports whether the run is visible on the TV but hasn't
// begun yet — scheduled (with or without an auto-start time) and
// nothing yet in started_at.
function isPreStart(data) {
  return !data?.started_at && (data?.state === 'scheduled' || data?.state === 'waiting');
}

// prevState tracks the previous snapshot's state code across renders
// so we can fire the start animation exactly once when the flag drops.
let prevState = null;

function render() {
  const data = latestSnapshot;
  if (!data) return;
  applyColors(data.colors);

  // Detect scheduled → running so the start animation fires exactly
  // once. prevState starts null so a fresh tab that lands on an
  // already-running board doesn't trigger the burst.
  if (prevState && prevState !== 'running' && data.state === 'running' && data.started_at) {
    playStartAnimation();
  }
  prevState = data.state || prevState;

  const root = document.getElementById('root');
  // FLIP: snapshot the pre-render position of every team row so we can
  // animate surviving rows from their old spot to the new one after the
  // DOM rebuild. Rows that are new or gone are skipped naturally (no
  // prior rect / no new node).
  const priorRowRects = captureBoardPositions(root);
  root.replaceChildren();

  root.append(buildHeader(data));
  if (isPreStart(data)) {
    root.append(buildPreStart(data));
    root.append(h('div', { class: 'footer' },
      t('Live · push updates · '),
      t('server time {{time}}', { time: data.server_now || '' })));
    return;
  }
  // A cancelled event freezes the leaderboard in place — useful so an
  // audience that arrived after the announcement still sees what was
  // going on — and prepends a clear banner so it's not mistaken for a
  // running board. No timeline / puzzle markers; just the stop sign.
  if (data.state === 'cancelled') {
    root.append(h('div', { class: 'cancelled-banner' },
      h('span', { class: 'state-pill cancelled' }, '✕ ' + t('cancelled'))));
    root.append(buildBoard(data));
    root.append(h('div', { class: 'footer' },
      t('Event cancelled by the arranger · '),
      t('server time {{time}}', { time: data.server_now || '' })));
    return;
  }
  // After the run has been complete for COMPLETION_DWELL_MS, swap the
  // leaderboard for a celebration frame so the TV doesn't sit pinned
  // on the same image indefinitely. The leaderboard stays visible
  // during the dwell window so audience members arriving late still
  // see the final standings; press 'b' to bring it back.
  if (data.state === 'completed' && data.completed_at && !showBoardOverride) {
    const completedAt = new Date(data.completed_at.includes('T') ? data.completed_at : data.completed_at.replace(' ', 'T') + 'Z').getTime();
    const dwell = Date.now() - completedAt;
    if (Number.isFinite(completedAt) && dwell > COMPLETION_DWELL_MS) {
      root.append(buildCompletionFrame(data));
      root.append(h('div', { class: 'footer' },
        t('Event complete · press B to show the leaderboard again · '),
        t('server time {{time}}', { time: data.server_now || '' })));
      return;
    }
  }
  if (showMapEffective(data)) {
    const split = h('div', { class: 'split' });
    split.append(buildBoard(data));
    split.append(buildMapSlot());
    root.append(split);
    // Initialise / refresh Leaflet AFTER the map container is in the DOM
    // (else Leaflet sees a 0x0 viewport and loads wrong tiles).
    renderLiveMap(mapInnerEl, mapHintEl, data);
  } else {
    root.append(buildBoard(data));
  }
  root.append(h('div', { class: 'footer' },
    t('Live · push updates · '),
    data.puzzles?.length
      ? (data.puzzles.length === 1
          ? t('{{n}} puzzle · ', { n: data.puzzles.length })
          : t('{{n}} puzzles · ', { n: data.puzzles.length }))
      : '',
    t('server time {{time}}', { time: data.server_now || '' })));

  // After the DOM mounts, see if the leaderboard overflows the
  // viewport. If it does, apply the soft bottom fade. Runs in an rAF
  // so the flex/grid tracks have resolved before we measure.
  requestAnimationFrame(() => {
    updateBoardOverflow();
    playBoardFlip(root, priorRowRects);
  });
}

// captureBoardPositions takes a snapshot of every team row's bounding
// rect before the DOM is replaced. Keyed by team id (set via the
// data-team-id attribute each row carries).
function captureBoardPositions(root) {
  const out = new Map();
  const rows = root.querySelectorAll('.row[data-team-id]');
  for (const r of rows) {
    out.set(r.getAttribute('data-team-id'), r.getBoundingClientRect());
  }
  return out;
}

// playBoardFlip runs the classic First-Last-Invert-Play pattern: each
// surviving row starts off translated to its previous position, then
// transitions back to its natural spot. Rows whose id didn't exist
// before (new team joined) are left alone — the `.new` CSS already
// styles them distinctly.
function playBoardFlip(root, prior) {
  if (!prior || prior.size === 0) return;
  const rows = root.querySelectorAll('.row[data-team-id]');
  for (const row of rows) {
    const id = row.getAttribute('data-team-id');
    const before = prior.get(id);
    if (!before) continue;
    const after = row.getBoundingClientRect();
    const dy = before.top - after.top;
    const dx = before.left - after.left;
    // Sub-pixel jitter from layout rounding isn't worth animating; gates
    // the work so unchanged renders don't thrash the compositor.
    if (Math.abs(dy) < 0.5 && Math.abs(dx) < 0.5) continue;
    row.style.transition = 'none';
    row.style.transform = `translate(${dx}px, ${dy}px)`;
    // Force layout so the starting transform is committed before we
    // swap the transition back in.
    row.offsetWidth;
    row.style.transition = 'transform 600ms cubic-bezier(.2,.8,.2,1)';
    row.style.transform = '';
  }
}

function updateBoardOverflow() {
  const board = document.querySelector('.board');
  if (!board) return;
  // scrollHeight > clientHeight means the grid contents are taller
  // than the flex track — any tail row is off-screen and the fade
  // should kick in.
  if (board.scrollHeight > board.clientHeight + 1) {
    board.classList.add('overflow');
  } else {
    board.classList.remove('overflow');
  }
}
window.addEventListener('resize', () => requestAnimationFrame(updateBoardOverflow));

// buildMapSlot returns a stable <div> for the Leaflet map so the outer
// render can reparent it on every poll without destroying Leaflet's
// container. The first call creates it and kicks off the initial render;
// subsequent calls hand back the same node (already wired up) and we
// just refresh overlays.
let mapWrapEl = null;
let mapInnerEl = null;
let mapHintEl = null;
let liveMapInstance = null;

function buildMapSlot() {
  if (!mapWrapEl) {
    mapInnerEl = document.createElement('div');
    mapInnerEl.className = 'mapinner';
    mapHintEl = document.createElement('div');
    mapHintEl.className = 'maphint';
    mapHintEl.textContent = t('Loading map…');
    mapWrapEl = document.createElement('div');
    mapWrapEl.className = 'mapwrap';
    mapWrapEl.append(mapInnerEl, mapHintEl);
  }
  return mapWrapEl;
}

// mapLayers caches the Leaflet overlays across renders so we can
// update-in-place instead of wiping everything each snapshot. That
// makes team marker positions animateable (no flicker from
// remove→add) and stops the puzzle pins from strobing.
const mapLayers = {
  puzzles: new Map(),               // puzzle index -> marker
  teamMarkers: new Map(),           // team_id -> { marker, lastLL }
  teamPolylines: new Map(),         // team_id -> polyline
  teamTweens: new Map(),            // team_id -> rAF handle
};

// tweenMarker glides a team marker from its current position to the
// new one over ~600ms. The `fitBounds` call underneath triggers its own
// map pan; that moves the marker's *screen* position for free, while
// this animation handles the *map* position change.
function tweenMarker(teamID, marker, target) {
  const existing = mapLayers.teamTweens.get(teamID);
  if (existing) cancelAnimationFrame(existing);
  const start = marker.getLatLng();
  // Skip tween for microscopic deltas (subpixel GPS jitter) — also a
  // guard against first-frame positioning since we want the marker to
  // appear at the authoritative location right away.
  const dLat = Math.abs(target.lat - start.lat);
  const dLng = Math.abs(target.lng - start.lng);
  if (dLat < 1e-7 && dLng < 1e-7) {
    marker.setLatLng(target);
    return;
  }
  const duration = 600;
  const t0 = performance.now();
  const step = (now) => {
    const u = Math.min(1, (now - t0) / duration);
    // Cubic ease-in-out keeps the motion calm on a big TV display.
    const eased = u < 0.5 ? 4*u*u*u : 1 - Math.pow(-2*u + 2, 3) / 2;
    const lat = start.lat + (target.lat - start.lat) * eased;
    const lng = start.lng + (target.lng - start.lng) * eased;
    marker.setLatLng([lat, lng]);
    if (u < 1) {
      mapLayers.teamTweens.set(teamID, requestAnimationFrame(step));
    } else {
      mapLayers.teamTweens.delete(teamID);
    }
  };
  mapLayers.teamTweens.set(teamID, requestAnimationFrame(step));
}

async function renderLiveMap(inner, hint, data) {
  if (typeof L === 'undefined') {
    hint.textContent = t('Map library still loading…');
    setTimeout(() => renderLiveMap(inner, hint, data), 300);
    return;
  }
  // The map wrapper is memoized across polls — initialise Leaflet on it
  // exactly once. After reparenting into the new split container Leaflet
  // needs invalidateSize() to recalculate the viewport.
  //
  // The Leaflet CDN occasionally fails (network outage, blocked by a
  // corporate WiFi). Catch the failure and degrade to a clear "map
  // unavailable" message so the leaderboard half of the view still
  // works — the audience seeing the TV doesn't have to wonder if
  // they're staring at a frozen page.
  if (!liveMapInstance) {
    try {
      liveMapInstance = L.map(inner, { scrollWheelZoom: false }).setView([59.3293, 18.0686], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        maxZoom: 19,
      }).addTo(liveMapInstance);
    } catch (e) {
      console.warn('live map init failed', e);
      hint.textContent = t('Map unavailable — leaderboard still live.');
      inner.style.display = 'none';
      return;
    }
  }
  const map = liveMapInstance;
  try { map.invalidateSize(); } catch { /* harmless */ }

  // puzzleBounds is the fall-back fit when no teams have pinged yet —
  // at that point the puzzle pins are all we've got to orient against.
  const puzzleBounds = L.latLngBounds([]);

  // Puzzle pins are set-once. Reconcile against mapLayers.puzzles so a
  // mid-run adventure edit still surfaces added/removed puzzles, but
  // already-placed pins don't flicker on every snapshot.
  const seenPuzzleKeys = new Set();
  for (const p of (data.puzzles || [])) {
    if (!p.lat && !p.lng) continue;
    const key = p.index;
    seenPuzzleKeys.add(key);
    let marker = mapLayers.puzzles.get(key);
    if (!marker) {
      marker = L.marker([p.lat, p.lng], {
        icon: L.divIcon({
          className: '',
          html: `<div class="puzzle-marker ${p.gated ? 'gated' : ''}"><span>${p.index + 1}</span></div>`,
          iconSize: [28, 28], iconAnchor: [14, 28],
        }),
      }).addTo(map);
      marker.bindPopup(`<strong>${p.index + 1}. ${p.title || t('Puzzle')}</strong>${p.gated ? `<br><em>${t('gated')}</em>` : ''}`);
      mapLayers.puzzles.set(key, marker);
    }
    puzzleBounds.extend([p.lat, p.lng]);
  }
  for (const [key, marker] of mapLayers.puzzles) {
    if (!seenPuzzleKeys.has(key)) {
      map.removeLayer(marker);
      mapLayers.puzzles.delete(key);
    }
  }

  // Team tracks come from the most recent {kind:"tracks"} WS frame, which
  // the server pushes alongside the snapshot whenever show_map is on.
  const tracks = latestTracks || [];

  const teamColourByID = new Map();
  (data.teams || []).forEach((t, i) => teamColourByID.set(t.id, teamColor(i)));

  const seenTeamIDs = new Set();
  for (const track of tracks) {
    if (!track.points?.length) continue;
    const colour = teamColourByID.get(track.team_id) || '#e24080';
    const latlngs = track.points.map((p) => [p.lat, p.lng]);
    const last = track.points[track.points.length - 1];
    seenTeamIDs.add(track.team_id);

    // Polyline: update in place if we've seen this team before so the
    // stroke doesn't flash; otherwise create one.
    let poly = mapLayers.teamPolylines.get(track.team_id);
    if (!poly) {
      poly = L.polyline(latlngs, { color: colour, weight: 3, opacity: .85 }).addTo(map);
      mapLayers.teamPolylines.set(track.team_id, poly);
    } else {
      poly.setLatLngs(latlngs);
      poly.setStyle({ color: colour });
    }

    // Team marker: on first sight create it at the latest position; on
    // subsequent renders tween to the new position so movement reads as
    // movement rather than teleporting.
    let entry = mapLayers.teamMarkers.get(track.team_id);
    if (!entry) {
      const initials = teamInitials(track.team_name);
      const size = 34;
      const html = track.avatar_url
        ? `<div class="team-marker-lv" style="--team-col:${colour}; width:${size}px; height:${size}px;">`
            + `<img src="${track.avatar_url}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:${JSON.stringify(initials)}}))"/>`
            + `</div>`
        : `<div class="team-marker-lv no-img" style="--team-col:${colour}; width:${size}px; height:${size}px;">`
            + `<span>${initials}</span></div>`;
      const marker = L.marker([last.lat, last.lng], {
        icon: L.divIcon({
          className: '',
          html,
          iconSize: [size, size], iconAnchor: [size / 2, size / 2],
        }),
      }).bindPopup(`<strong>${track.team_name}</strong>`).addTo(map);
      entry = { marker };
      mapLayers.teamMarkers.set(track.team_id, entry);
    } else {
      tweenMarker(track.team_id, entry.marker, L.latLng(last.lat, last.lng));
    }
  }
  // Drop teams that fell out of the track set (unlikely mid-run, but
  // keeps the cache honest between adventures).
  for (const [tid, entry] of mapLayers.teamMarkers) {
    if (!seenTeamIDs.has(tid)) {
      map.removeLayer(entry.marker);
      mapLayers.teamMarkers.delete(tid);
      const t = mapLayers.teamTweens.get(tid);
      if (t) { cancelAnimationFrame(t); mapLayers.teamTweens.delete(tid); }
    }
  }
  for (const [tid, poly] of mapLayers.teamPolylines) {
    if (!seenTeamIDs.has(tid)) {
      map.removeLayer(poly);
      mapLayers.teamPolylines.delete(tid);
    }
  }

  // Choose what the viewport frames: all teams' latest positions when
  // the spread is tight enough to show everyone, otherwise the top
  // three so a single wayward team doesn't zoom the board uselessly
  // far out. Puzzles stay visible on the map layer but don't drive
  // the fit — their geographic spread can be arbitrary and is less
  // important than the racing teams.
  const MAX_SPAN_METERS = 5000;
  // Rank already baked in by the server (data.teams is sorted),
  // so we just index into it to find "top 3" team ids.
  const rankIdx = new Map((data.teams || []).map((t, i) => [t.id, i]));
  const teamLatLngs = [];
  for (const track of tracks) {
    if (!track.points?.length) continue;
    const last = track.points[track.points.length - 1];
    teamLatLngs.push({
      rank: rankIdx.has(track.team_id) ? rankIdx.get(track.team_id) : Infinity,
      ll: L.latLng(last.lat, last.lng),
    });
  }
  teamLatLngs.sort((a, b) => a.rank - b.rank);

  let fitTarget = null;
  if (teamLatLngs.length) {
    const all = L.latLngBounds(teamLatLngs.map((t) => t.ll));
    const span = all.getNorthEast().distanceTo(all.getSouthWest());
    if (span <= MAX_SPAN_METERS || teamLatLngs.length <= 3) {
      fitTarget = all;
    } else {
      fitTarget = L.latLngBounds(teamLatLngs.slice(0, 3).map((t) => t.ll));
    }
  } else if (puzzleBounds.isValid()) {
    fitTarget = puzzleBounds;
  }

  if (fitTarget && fitTarget.isValid()) {
    // Fast animation duration so the re-fit doesn't feel laggy when
    // a team's position update drags the viewport — Leaflet's default
    // (0.25s) already runs inside a longer pan/zoom transition, the
    // explicit duration here just pins it tight. noMoveStart keeps
    // other subscribers (marker tweens) from thinking the user
    // panned manually.
    map.fitBounds(fitTarget, {
      padding: [24, 24], maxZoom: 17,
      animate: true, duration: 0.35, easeLinearity: 0.35, noMoveStart: true,
    });
  }
  // Hide the hint strip entirely once teams have sent at least one
  // position — the count text was noisy and duplicated the leaderboard.
  // The "waiting for the first position" line stays so a fresh run
  // doesn't render as a blank map.
  if (tracks.length) {
    hint.textContent = '';
    hint.style.display = 'none';
  } else {
    hint.textContent = t('Waiting for the first position…');
    hint.style.display = '';
  }
}

function buildHeader(data) {
  return h('header', { class: 'topline' },
    h('div', { class: 'brand' }, 'zonventure'),
    h('div', { class: 'title' },
      h('h1', {}, data.adventure_title || t('Event')),
      h('div', { class: 'slug' },
        h('span', { class: `state-pill ${data.state}` },
          h('span', { class: 'dot' }),
          // Glyph alongside the colour-coded dot so a colourblind
          // viewer (or a TV with a faulty colour calibration) still
          // gets a non-colour cue for the event state.
          (data.state === 'running' ? '▶ '
            : data.state === 'paused'    ? '⏸ '
            : data.state === 'completed' ? '✓ '
            : data.state === 'cancelled' ? '✕ '
            : data.state === 'scheduled' ? '⏰ '
            : ''),
          t(data.state || '')),
        ' · ', data.adventure_slug),
    ),
    h('div', { class: 'clockwrap' },
      h('div', { class: 'clock' },
        // On a completed run we freeze the clock at finish time — the
        // elapsed value comes from completed_at instead of the ticking
        // server_now, and the label flips from "Elapsed" to "Finished"
        // so the TV viewer knows it's the final number rather than
        // a stalled stream.
        formatElapsed(data.started_at, data.state === 'completed' ? data.completed_at : data.server_now),
        h('small', {},
          data.state === 'completed' ? t('Finished')
          : data.started_at ? t('Elapsed')
          : t('Not started'))),
      h('button', {
        class: 'fs-btn', type: 'button',
        title: t('Fullscreen (f)'),
        'aria-label': t('Toggle fullscreen'),
        on: { click: toggleFullscreen },
      },
        h('span', { html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 8 4 4 8 4"/><polyline points="16 4 20 4 20 8"/><polyline points="20 16 20 20 16 20"/><polyline points="8 20 4 20 4 16"/></svg>' }),
        t('Fullscreen'),
      ),
    ),
  );
}

// toggleFullscreen mirrors the `f` keyboard shortcut so the TV operator
// can go fullscreen from the UI when they don't have a keyboard handy.
function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
}

// COMPLETION_DWELL_MS — how long to keep the leaderboard up after the
// last team finishes before swapping to the celebration frame. Tuned
// so a passer-by has plenty of time to see who won, but the TV doesn't
// freeze on the same image for hours after the venue empties.
const COMPLETION_DWELL_MS = 5 * 60 * 1000;
// showBoardOverride lets the operator press 'b' to bring the
// leaderboard back after the celebration frame has been shown. Set
// once and respected for the rest of the page's lifetime.
let showBoardOverride = false;

function buildCompletionFrame(data) {
  // Sort teams by completion time so the audience sees the final
  // ranking front and centre, not the live-tick rank carried over
  // from the running state.
  const teams = (data.teams || []).slice().sort((a, b) => {
    const aDone = a.completed_at ? new Date(a.completed_at).getTime() : Infinity;
    const bDone = b.completed_at ? new Date(b.completed_at).getTime() : Infinity;
    return aDone - bDone;
  });
  const winner = teams[0];
  const card = h('div', { class: 'prestart' });
  card.append(h('div', { class: 'banner' }, t('Event complete')));
  if (data.adventure_title) {
    card.append(h('div', { class: 'whenline' }, data.adventure_title));
  }
  if (winner && winner.completed_at) {
    const total = formatFinishTime(data.started_at, winner.completed_at);
    card.append(
      h('div', { class: 'countdown' },
        h('div', { class: 'digits' }, winner.name || t('—')),
        h('small', {}, total
          ? t('crossed the line in {{time}}', { time: total })
          : t('finished first'))));
  } else {
    card.append(h('div', { class: 'countdown' },
      h('div', { class: 'digits' }, t('—')),
      h('small', {}, t('no winner recorded'))));
  }
  if (teams.length > 1) {
    card.append(h('div', { class: 'whenline' },
      teams.length === 2
        ? t('1 other team played.')
        : t('{{n}} other teams played.', { n: teams.length - 1 })));
  }
  card.append(h('div', { class: 'whenline thanks' }, t('Thanks for watching.')));
  return card;
}

// buildPreStart renders the large countdown card shown before the
// run starts. When scheduled_at is set we show a live countdown; with
// no schedule the copy flips to "Waiting for the arranger to start".
// The clock interval already running at 1 s cadence updates the
// .countdown .digits text in place so the digits tick smoothly.
function buildPreStart(data) {
  const card = h('div', { class: 'prestart' });
  card.append(h('div', { class: 'banner' }, t('Starting soon')));
  // Adventure title + team count framing — gives the audience context
  // about what they're about to watch even before the run begins, so a
  // bystander walking past the TV can pick up the event in seconds.
  const teamCount = (data.teams || []).length;
  const titleLine = data.adventure_title || data.run_name;
  if (titleLine) card.append(h('div', { class: 'whenline' }, titleLine));
  if (teamCount > 0) {
    card.append(h('div', { class: 'whenline' },
      teamCount === 1 ? t('1 team ready')
                      : t('{{n}} teams ready', { n: teamCount })));
  }
  if (data.scheduled_at) {
    const digits = h('div', { class: 'digits' }, countdownText(data.scheduled_at, data.server_now));
    card.append(h('div', { class: 'countdown' }, digits,
      h('small', {}, t('until the flag drops'))));
    card.append(h('div', { class: 'whenline' },
      t('Scheduled for {{when}}', { when: formatScheduled(data.scheduled_at) })));
  } else {
    // No schedule = manual start. Tell the audience the run is queued
    // and the arranger will trigger it instead of leaving the screen
    // pinned on a vague "—" forever.
    card.append(h('div', { class: 'countdown' },
      h('div', { class: 'digits' }, t('Ready')),
      h('small', {}, t("waiting on the arranger's signal"))));
  }
  return card;
}

function countdownText(scheduledISO, serverNowISO) {
  const when = parseServerTime(scheduledISO);
  const now = serverNowISO ? parseServerTime(serverNowISO) : new Date();
  const sec = Math.round((when.getTime() - now.getTime()) / 1000);
  // Flip to a big "Go!" the instant the scheduled time lands. The
  // actual state transition may lag a moment (scheduler sweep / WS
  // push), so this gives the TV audience an immediate beat.
  if (sec <= 0) return t('Go!');
  const d = Math.floor(sec / 86400);
  const h = Math.floor((sec % 86400) / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  const pad = (n) => String(n).padStart(2, '0');
  if (d > 0) return `${d}d ${pad(h)}:${pad(m)}:${pad(s)}`;
  if (h > 0) return `${pad(h)}:${pad(m)}:${pad(s)}`;
  return `${pad(m)}:${pad(s)}`;
}

function formatScheduled(iso) {
  const d = parseServerTime(iso);
  if (!d || Number.isNaN(d.getTime())) return iso;
  // 24h clock so the TV never displays ambiguous AM/PM during a race.
  return d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short', hour12: false });
}

// playStartAnimation drops a full-screen accent burst the moment the
// run flips from scheduled → running. Mirrors the shape of the
// player-side celebrate() but themed as "race start" rather than
// "puzzle correct". Respects prefers-reduced-motion: a user (or a
// venue's accessibility policy) opted out of motion shouldn't be
// jumpscared by a full-screen confetti drop on the TV.
function playStartAnimation() {
  try {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  } catch { /* matchMedia missing on ancient browsers — fall through. */ }
  const overlay = document.createElement('div');
  overlay.className = 'startfx';
  const ring = document.createElement('div');
  ring.className = 'ring';
  ring.textContent = 'GO';
  const head = document.createElement('div');
  head.className = 'head';
  head.textContent = t("We're live!");
  const sub = document.createElement('div');
  sub.className = 'sub';
  sub.textContent = t('Teams are on the move');
  overlay.append(ring, head, sub);
  const colours = ['#e24080', '#f5c452', '#7fd17b', '#60a5fa', '#a78bfa', '#22d3ee'];
  for (let i = 0; i < 60; i++) {
    const p = document.createElement('div');
    p.className = 'piece';
    p.style.left = Math.random() * 100 + '%';
    p.style.setProperty('--c', colours[i % colours.length]);
    p.style.setProperty('--dx', ((Math.random() * 2 - 1) * 450) + 'px');
    p.style.setProperty('--rot', (Math.random() * 1440 - 720) + 'deg');
    p.style.setProperty('--d', (Math.random() * 250) + 'ms');
    overlay.append(p);
  }
  document.body.append(overlay);
  setTimeout(() => overlay.classList.add('gone'), 3200);
  setTimeout(() => overlay.remove(), 3800);
}

function buildBoard(data) {
  const board = h('div', { class: 'board' });
  if (!data.teams || data.teams.length === 0) {
    board.append(h('div', { class: 'empty-board' }, t('No teams yet.')));
    return board;
  }
  const seen = new Set();
  data.teams.forEach((t, i) => {
    const row = renderRow(t, i, data);
    seen.add(t.id);
    if (!knownTeams.has(t.id)) row.classList.add('new');
    board.append(row);
  });
  knownTeams.clear(); seen.forEach((id) => knownTeams.add(id));
  return board;
}

function renderRow(team, idx, data) {
  const colour = teamColor(idx);
  const pct = data.page_count > 0 ? Math.min(100, Math.round((team.page_index / data.page_count) * 100)) : 0;
  const finished = !!team.completed_at || (data.page_count > 0 && team.page_index >= data.page_count);
  const rankCls = team.rank <= 3 ? ` rank-${team.rank}` : ' rank-tail';
  const row = h('div', {
    class: `row rank-${team.rank}${rankCls}${finished ? ' finished' : ''}`,
    style: `--team-color:${colour}`,
    'data-team-id': String(team.id),
  });

  row.append(h('div', { class: 'rank' }, team.rank));

  // Avatar is its own row-level cell now so it can stretch to the full
  // row height (square-ish block on the left). Uploaded picture when
  // set, otherwise initials on the team colour.
  const avatarInner = h('span', {
    class: 'team-avatar-lv',
    style: `background:${colour}`,
  }, teamInitials(team.name));
  if (team.avatar_url) {
    avatarInner.replaceChildren();
    const img = document.createElement('img');
    img.src = team.avatar_url;
    img.alt = '';
    img.onerror = () => { avatarInner.textContent = teamInitials(team.name); };
    avatarInner.append(img);
  }
  row.append(h('div', { class: 'row-avatar' }, avatarInner));

  const main = h('div', { class: 'main' });
  main.append(h('div', { class: 'team-name' },
    team.name,
    // Glanceable finished badge: ✓ + label, sized so it carries from
    // across a venue. Color alone is WCAG-failing for color-blind
    // viewers; the checkmark + word together give a redundant cue.
    finished ? h('span', { class: 'finished-pill' }, '✓', t('Finished')) : null,
  ));
  if ((team.members || []).length) {
    main.append(h('div', { class: 'members' }, team.members.map((m) => m.username).join(' · ')));
  }
  const currentPuzzle = data.puzzles?.[team.page_index];
  main.append(h('div', { class: 'progress' },
    h('div', { class: 'label' },
      h('span', {},
        finished ? t('Complete') : t('Puzzle {{i}} of {{n}}', { i: team.page_index + 1, n: data.page_count }),
        currentPuzzle && !finished ? h('strong', { style: 'margin-left:.6rem' }, currentPuzzle.title) : null),
      h('span', {}, `${finished ? 100 : pct}%`),
    ),
    h('div', { class: 'bar' },
      (() => {
        const target = finished ? 100 : pct;
        const prev = lastPct.has(team.id) ? lastPct.get(team.id) : target;
        lastPct.set(team.id, target);
        // Paint the fill at the PREVIOUS width first so the CSS
        // transition has a real starting value to animate from. Once
        // the element is in the DOM (queued via microtask so parent
        // attachment has completed), force a layout read with
        // offsetWidth — that commits the initial width — then flip to
        // the new width. The transition on .progress .fill picks it up.
        const fill = h('div', { class: 'fill', style: `width:${prev}%` });
        if (prev !== target) {
          queueMicrotask(() => {
            // offsetWidth read only makes the browser commit layout
            // once the element is actually connected.
            if (!fill.isConnected) {
              requestAnimationFrame(() => {
                void fill.offsetWidth;
                fill.style.width = target + '%';
              });
              return;
            }
            void fill.offsetWidth;
            fill.style.width = target + '%';
          });
        }
        return fill;
      })()),
  ));
  row.append(main);

  if (finished) {
    // Every finisher shows their own total (start → finish) as the
    // big value so runs read as comparable times. Below, rank 1 gets
    // the "Finish time" caption; everyone behind gets the gap to the
    // winner ("+MM:SS") in that same caption slot — no redundant "Gap"
    // label, the + sign already says what it is.
    const winner = (data.teams || []).find((x) => x.completed_at);
    const isWinner = winner && winner.id === team.id;
    const total   = formatFinishTime(data.started_at, team.completed_at);
    const caption = isWinner
      ? t('Finish time')
      : formatFinishGap(winner && winner.completed_at, team.completed_at);
    row.append(h('div', { class: 'stat finished' },
      h('div', { class: 'value' }, total || t('Done')),
      h('div', { class: 'unit' }, caption),
    ));
  } else {
    row.append(h('div', { class: 'stat' },
      h('div', { class: 'value' }, `${team.page_index}/${data.page_count}`),
      h('div', { class: 'unit' }, t('Solved')),
    ));
  }
  return row;
}

// WebSocket: the server pushes {kind:"snapshot"} on every run change and
// {kind:"tracks"} alongside it when show_map is enabled. No polling.
let ws = null;
let wsBackoff = 500;

// Connection-status banner. Mounted lazily; the live view often runs
// for hours on a TV, so a long network blip needs to be visible at a
// glance without disturbing the leaderboard layout.
let liveStatusEl = null;
let liveStatusTimer = null;
function setLiveStatus(level, text) {
  if (!liveStatusEl) {
    liveStatusEl = document.createElement('div');
    liveStatusEl.className = 'ws-status';
    document.body.append(liveStatusEl);
  }
  liveStatusEl.classList.remove('err', 'show');
  if (!level) return;
  if (level === 'err') liveStatusEl.classList.add('err');
  liveStatusEl.classList.add('show');
  liveStatusEl.textContent = text;
}

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws/live/${encodeURIComponent(LIVE_TOKEN)}`);
  ws.onopen = () => {
    wsBackoff = 500;
    if (liveStatusTimer) { clearTimeout(liveStatusTimer); liveStatusTimer = null; }
    setLiveStatus('', '');
  };
  ws.onmessage = (ev) => {
    let msg; try { msg = JSON.parse(ev.data); } catch { return; }
    if (!msg || !msg.kind) return;
    if (msg.kind === 'snapshot') {
      latestSnapshot = msg.data;
      render();
    } else if (msg.kind === 'tracks') {
      latestTracks = msg.data?.tracks || [];
      // Only re-render if the map is currently shown — saves a full rebuild
      // of the leaderboard DOM when only map overlays changed.
      if (latestSnapshot?.show_map) render();
    }
  };
  ws.onclose = () => {
    const delay = Math.min(wsBackoff, 10000);
    wsBackoff = Math.min(wsBackoff * 2, 10000);
    setTimeout(connectWS, delay);
    // Tier the feedback: short blips (pings, restarts) shouldn't yank
    // attention onto a TV banner, but a real outage absolutely should.
    if (liveStatusTimer) clearTimeout(liveStatusTimer);
    liveStatusTimer = setTimeout(() => {
      setLiveStatus('warn', t('Reconnecting…'));
      liveStatusTimer = setTimeout(() => {
        setLiveStatus('err', t('Disconnected — leaderboard may be stale.'));
      }, 13000);
    }, 2000);
  };
}

// Keep the elapsed clock ticking between pushes so long-running races
// don't look frozen while waiting for the next state change. Skipped
// once the run has completed — the clock is pinned to completed_at
// and mutating it on every tick would visibly jitter the digits.
setInterval(() => {
  if (!latestSnapshot) return;
  if (latestSnapshot.state !== 'completed') {
    const clockEl = document.querySelector('.clock');
    if (clockEl) {
      const firstLine = formatElapsed(latestSnapshot.started_at);
      const firstChild = clockEl.firstChild;
      if (firstChild && firstChild.nodeType === 3) firstChild.nodeValue = firstLine;
    }
  }
  // Pre-start countdown digit tick — read against a local clock rather
  // than server_now (which only updates on push) so the digits don't
  // hop. Gate on isPreStart: buildCompletionFrame reuses the .prestart
  // shell + .countdown .digits selector to display the winner's name,
  // so without this guard the ticker would overwrite that name with
  // "Go!" the moment it fired (scheduled_at is in the past for a
  // completed event).
  if (isPreStart(latestSnapshot)) {
    const digitsEl = document.querySelector('.prestart .countdown .digits');
    if (digitsEl && latestSnapshot.scheduled_at) {
      digitsEl.textContent = countdownText(latestSnapshot.scheduled_at, new Date().toISOString());
    }
  }
  // After completion, the dwell window expires without a new WS push
  // (nothing more is happening on the server), so the swap to the
  // celebration frame has to be driven from this tick. Cheap check:
  // re-render once when the threshold is crossed.
  if (latestSnapshot.state === 'completed'
      && latestSnapshot.completed_at
      && !showBoardOverride
      && !document.querySelector('.prestart')) {
    const ca = latestSnapshot.completed_at;
    const completedAt = new Date(ca.includes('T') ? ca : ca.replace(' ', 'T') + 'Z').getTime();
    if (Number.isFinite(completedAt) && Date.now() - completedAt > COMPLETION_DWELL_MS) {
      render();
    }
  }
}, 1000);

// Keyboard shortcuts for the TV:
//   m — toggle the map card (overrides the server show_map setting)
//   f — toggle browser fullscreen
//   b — bring the leaderboard back after the post-event celebration
//       frame has taken over (sticky for the rest of the session)
// Ignore when focus is in a form field so typing doesn't steal hotkeys
// (not that there are any inputs on the live view today, but be safe).
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (e.key === 'm' || e.key === 'M') {
    mapShown = !showMapEffective(latestSnapshot);
    render();
    e.preventDefault();
  } else if (e.key === 'f' || e.key === 'F') {
    toggleFullscreen();
    e.preventDefault();
  } else if (e.key === 'b' || e.key === 'B') {
    showBoardOverride = true;
    render();
    e.preventDefault();
  }
});

connectWS();

// Tiny legal-link strip pinned to the corner. The live view runs on
// a TV with no real interaction surface, so visibility is enough —
// any human who needs the policies can pull them up on a phone.
(function mountLegalFooter() {
  const f = document.createElement('div');
  f.style.cssText = 'position:fixed; bottom:.35rem; right:.5rem; font-size:.65rem; color:rgba(255,255,255,.45); z-index:5;';
  const linkStyle = 'color:inherit; text-decoration:underline;';
  const a1 = document.createElement('a');
  a1.href = '/privacy'; a1.target = '_blank'; a1.rel = 'noopener';
  a1.style.cssText = linkStyle; a1.textContent = t('Privacy');
  const a2 = document.createElement('a');
  a2.href = '/terms'; a2.target = '_blank'; a2.rel = 'noopener';
  a2.style.cssText = linkStyle; a2.textContent = t('Terms');
  f.append(a1, document.createTextNode(' · '), a2);
  document.body.append(f);
})();
</script>
</body>
</html>
