  // Runbar layout: [☰] [progress] [hint?]. Hamburger on the left
  // (matches GitHub / Slack mobile patterns); progress in the
  // middle via flex space-between distribution; hint on the right.
  // The state pill was removed earlier — main content already
  // conveys state (waiting card / paused paragraph / completion
  // summary). Title + team moved into the hamburger drawer.
  //
  // Progress guard: page_index / page_count can briefly arrive as
  // null/undefined during a fresh state push (the server rebuilds
  // the snapshot after a puzzle reorder, and the field arrives a
  // tick later than `status: running`). Without this guard the
  // template substituted "NaN/2" for the missing index.
  const idx = Number.isFinite(s.page_index) ? s.page_index : null;
  const total = Number.isFinite(s.page_count) ? s.page_count : null;
  const showProgress = playing && idx !== null && total !== null && total > 0;
  const progress = showProgress
    ? el('span', { class: 'progress' }, t('Puzzle {{i}}/{{n}}', { i: idx + 1, n: total }))
    : el('span', { class: 'progress empty' }, '');
  const actions = el('div', { class: 'actions' });
  if (hintBtn) actions.append(hintBtn);
  const bar = el('div', { class: 'runbar' }, buildMenuButton(s), progress, actions);
  app.append(bar);

  // Welcome screen shown once per (adventure, team, slot).
  maybeShowWelcome(s);

  if (s.status === 'waiting')  { hideSubmitDock(); app.append(buildWaitingCard(s)); return; }
  if (s.status === 'paused')   { hideSubmitDock(); app.append(buildPausedCard()); return; }
  if (s.status === 'completed'){ hideSubmitDock(); renderCompleted(s); return; }
  if (s.status === 'cancelled' || s.status === 'canceled') {
    hideSubmitDock();
    app.append(el('div', { class: 'card' },
      el('h3', {}, t('Event cancelled')),
      el('p', { class: 'muted' },
        t('The arranger cancelled this event. Reach out to them for next steps; nothing more to do here.'))));
    return;
  }

  if (s.title) app.append(el('h3', {}, s.title));
  if (Array.isArray(s.images)) {
    // im.alt is the author's text alternative; empty string keeps
    // decorative semantics (screen readers skip the <img>).
    for (const im of s.images) app.append(el('img', { class: 'puzzle-img', src: im.url, alt: im.alt || '' }));
  }
  // Prompt comes from the server already rendered to HTML (goldmark,
  // raw HTML escaped). Nested p/ul/ol/etc inherit typography from
  // the .prompt wrapper.
  app.append(el('div', { class: 'prompt', html: s.prompt || '' }));

  // Hints sit behind a small "?" affordance (runbar, top-right).
  // No countdown on the main view — tapping it opens a sheet with
  // already-revealed hints and a "reveal next" action when the
  // next one is ready.

  // Gated puzzles don't get a separate "walk to location" card — the
  // sticky submit dock at the bottom is the only action surface. For
  // no-answer gated puzzles the dock already shows "I'm here" instead
  // of "Continue"; for text-answer puzzles the player just submits and
  // gets a rebuff if they aren't close enough.
  renderSubmitDock(s);
}

// renderSubmitDock always renders into the same sticky container at the
// bottom so the input field and button stay in a fixed spot between
// puzzles. When the puzzle has no accept list (state.no_answer) the
// dock collapses to a single Continue button that tells the server to
// advance without an answer-match attempt.
// previewHintCounts is an in-memory per-page counter used ONLY in
// preview mode. The live game persists reveals server-side via
// /api/play/hint; a module-level Map keeps the preview's clean-slate
// behaviour without touching localStorage.
const previewHintCounts = new Map();

// localHintCount mirrors the server's count between WS pushes so a
// reveal click immediately repaints the sheet rather than waiting
// for the next state push. Keyed by page_index because pages can
// change underneath us when a team-mate finishes a puzzle.
const localHintCount = new Map();

function hintsRevealedFor(s) {
  if (s && s.preview) {
    return previewHintCounts.get(s.page_index || 0) || 0;
  }
  const local = localHintCount.get(s.page_index || 0);
  const server = s.hints_revealed || 0;
  // Keep whichever is higher: server is authoritative post-WS-push,
  // but a just-clicked Reveal might not yet have pulled state back.
  return Math.max(local || 0, server);
}

function setHintsRevealed(s, n) {
  if (s && s.preview) {
    previewHintCounts.set(s.page_index || 0, n);
    return;
  }
  localHintCount.set(s.page_index || 0, n);
}

// revealNextHint POSTs to the server and updates the local mirror.
// Returns the new count (or null on failure so the caller can keep
// the sheet open with the previous state intact).
async function revealNextHint(s, hintIndex) {
  if (s && s.preview) {
    const next = (previewHintCounts.get(s.page_index || 0) || 0) + 1;
    previewHintCounts.set(s.page_index || 0, next);
    return next;
  }
  const r = await api('/api/player/hint', {
    method: 'POST', body: JSON.stringify({ hint_index: hintIndex }),
  });
  if (r.status === 200 && typeof r.body?.hints_revealed === 'number') {
    setHintsRevealed(s, r.body.hints_revealed);
    // Subtle cue to confirm the reveal landed — same toggle as the
    // celebrate fanfare, quieter so a hint doesn't compete with the
    // reveal-card content the player is about to read.
    playHintCue();
    return r.body.hints_revealed;
  }
  return null;
}

// renderHintButton builds the small "?" affordance shown in the
// top-right of the puzzle area. Tapping it opens a bottom-sheet
// listing already-revealed hints and — if a further hint is
// currently unlocked — a single button to reveal the next one.
// No countdown appears on the main puzzle view; the button itself
// is the only hint UI visible until the player asks for help.
function renderHintButton(s) {
  const hints = s.hints || [];
  if (hints.length === 0) return null;
  const btn = el('button', { class: 'hint-toggle', title: t('Hints'), 'aria-label': t('Hints') });
  btn.append(el('span', { class: 'hint-toggle-glyph' }, '?'));
  const badge = el('span', { class: 'hint-toggle-badge' });
  btn.append(badge);
  // Refresh the badge on every render + every second to reflect
  // "how many hints are ready but unrevealed right now". We don't
  // render the countdown anywhere — only the availability delta.
  const refreshBadge = () => {
    const revealed = hintsRevealedFor(s);
    const elapsed = Math.max(0, Math.floor((Date.now() - hintTickerAnchor) / 1000));
    let ready = 0;
    for (let i = revealed; i < hints.length; i++) {
      if ((hints[i].unlocks_in_seconds || 0) - elapsed <= 0) ready++;
    }
    if (ready > 0) {
      badge.textContent = String(ready);
      badge.classList.add('ready');
    } else {
      badge.textContent = '';
      badge.classList.remove('ready');
    }
  };
  refreshBadge();
  const tick = () => {
    if (!btn.isConnected) return;
    refreshBadge();
    setTimeout(tick, 1000);
  };
  setTimeout(tick, 1000);
  btn.addEventListener('click', () => openHintSheet(s));
  return btn;
}

// openHintSheet mounts a bottom-sheet overlay with the revealed
// hints and (when a new one is ready) a Reveal button. Dismisses on
// backdrop click, close button, or Esc. Kept plain DOM to avoid a
// dependency on a modal library.
function openHintSheet(s) {
  document.querySelectorAll('.hint-sheet-back').forEach((n) => n.remove());
  const hints = s.hints || [];
  let revealed = Math.min(hintsRevealedFor(s), hints.length);

  const back = el('div', { class: 'hint-sheet-back' });
  const sheet = el('div', { class: 'hint-sheet' });
  back.append(sheet);
  const close = () => { back.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  back.addEventListener('click', (e) => { if (e.target === back) close(); });

  const drawBody = () => {
    sheet.replaceChildren();
    sheet.append(el('div', { class: 'hint-sheet-head' },
      el('h3', {}, hints.length > 1 ? t('Hints') : t('Hint')),
      el('button', { class: 'hint-sheet-close', 'aria-label': t('Close'), on: { click: close } }, '×')));

    const body = el('div', { class: 'hint-sheet-body' });
    if (revealed === 0) {
      body.append(el('p', { class: 'muted' },
        t('Tap below to reveal your first hint. Use them sparingly — you can always come back.')));
    }
    for (let i = 0; i < revealed; i++) {
      const h = hints[i];
      const card = el('div', { class: 'hint-revealed' });
      card.append(el('div', { class: 'hint-label' },
        hints.length > 1 ? t('Hint {{i}}/{{n}}', { i: i + 1, n: hints.length }) : t('Hint')));
      card.append(el('div', { class: 'hint-body', html: h.text_html || '' }));
      // Per-hint images, only painted on revealed cards. The serve
      // route also enforces the reveal gate server-side, so a player
      // who hand-rolls the URL still gets a 403 on locked hints.
      if (h.images && h.images.length) {
        const grid = el('div', { class: 'hint-images' });
        for (const im of h.images) {
          grid.append(el('img', { src: im.url, alt: im.alt || '' }));
        }
        card.append(grid);
      }
      body.append(card);
    }
    sheet.append(body);

    // Footer action: reveal next if available.
    if (revealed < hints.length) {
      const next = hints[revealed];
      const elapsed = Math.max(0, Math.floor((Date.now() - hintTickerAnchor) / 1000));
      const remaining = Math.max(0, (next.unlocks_in_seconds || 0) - elapsed);
      if (remaining <= 0) {
        const cta = el('button', { class: 'hint-sheet-cta' },
          revealed === 0 ? t('Reveal hint') : t('Reveal next hint'));
        cta.addEventListener('click', async () => {
          const targetIndex = revealed;
          cta.disabled = true;
          const n = await revealNextHint(s, targetIndex);
          cta.disabled = false;
          if (n === null) {
            // Server refused (event paused mid-reveal, etc.). Surface
            // a soft hint without aborting the sheet — the next state
            // push or a retry will recover.
            cta.textContent = t('Couldn\'t reveal — tap to retry');
            return;
          }
          revealed = n;
          drawBody();
        });
        sheet.append(cta);
      } else {
        // Locked: tell the player another one's coming without a loud
        // countdown. Plain sentence, muted.
        sheet.append(el('p', { class: 'muted hint-sheet-locked' },
          t('The next hint isn\'t ready yet. Keep trying for a little longer.')));
      }
    }
  };
  drawBody();
  document.body.append(back);
}

// hintTickerAnchor is the wall-clock time of the last state snapshot;
// we subtract it from Date.now() to decrement the server-supplied
// unlocks_in_seconds locally so downstream computations (badge
// refresh, sheet button gating) tick without waiting for the next
// WebSocket push. Reset on every render() call.
let hintTickerAnchor = Date.now();

function renderSubmitDock(s) {
  let dock = document.getElementById('submit-dock');
  if (!dock) {
    dock = document.createElement('div');
    dock.id = 'submit-dock';
    dock.className = 'submit-dock';
    document.body.append(dock);
    applyBrandToScope(dock);
  }
  dock.replaceChildren();
  submitInputEl = null;
  currentGatedButton = null;
  currentGatedRadius = 0;
  currentGpsHelpEl = null;

  if (s && s.no_answer) {
    // No-answer puzzles advance with a single button tap instead of a
    // typed answer. Gated ones need the team to be within the radius,
    // so the label flips to "I'm here" and the click also force-pings
    // the latest GPS fix so the server's gate check sees fresh data.
    const gatedUnreached = s.gate && !s.gate.reached;
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = gatedUnreached ? t("Check location · I'm here") : t('Continue');
    const result = document.createElement('p');
    result.className = 'result muted';
    result.setAttribute('role', 'status');
    result.setAttribute('aria-live', 'polite');
    const wrap = document.createElement('div');
    wrap.className = 'dock-single';
    wrap.append(button, result);
    // GPS freshness indicator — only meaningful when the puzzle is
    // gated, where staleness directly explains why the gate isn't
    // unlocking. A small line under the button refreshes every
    // second via a self-stopping ticker.
    if (gatedUnreached) {
      const fresh = document.createElement('p');
      fresh.className = 'result muted';
      fresh.style.fontSize = '.75rem';
      fresh.style.margin = '.15rem 0 0';
      wrap.append(fresh);
      currentGpsFreshnessEl = fresh;
      const tick = () => {
        if (!fresh.isConnected) return;
        renderGpsFreshness();
        setTimeout(tick, 1000);
      };
      tick();
    } else {
      currentGpsFreshnessEl = null;
    }
    // Empty by default — populated by renderGpsHelp when a permission /
    // signal error lands. Outside .dock-single so its full-width retry
    // button doesn't squeeze the result line.
    const gpsHelp = document.createElement('div');
    gpsHelp.className = 'gps-help';
    gpsHelp.style.display = 'none';
    dock.append(wrap, gpsHelp);
    submitResultEl = result;
    currentGpsHelpEl = gpsHelp;
    // Lock the gated advance button until the fix is precise enough
    // for the server's gate check to produce a meaningful answer.
    if (gatedUnreached) {
      currentGatedButton = button;
      currentGatedRadius = s.gate.radius_m || 0;
      updateGateLock();
    } else {
      // Non-gated continue still benefits from the help surface (the
      // gated button branch above already calls it).
      renderGpsHelp();
    }
    button.addEventListener('click', () => {
      if (previewState) {
        // Preview mode: advance locally as if the server said yes,
        // without any animations (per the no-answer rule).
        advanceMode = 'silent';
        onAnswerResult({
          accepted: true,
          completed: previewState.pageIndex + 1 >= previewState.pageCount,
        });
        return;
      }
      // Gated: send the latest fix first so the server's gate check
      // doesn't race a stale ping cycle. Silent advance mode for clean
      // gates, "gated" mode so a 403 triggers the rebuff animation.
      if (gatedUnreached) {
        advanceMode = 'gated';
        if (lastFix) sendPing();
      } else {
        advanceMode = 'silent';
      }
      const sent = wsSendOrQueue('advance', {});
      if (!sent) {
        // Queued — let the player know the press registered. The
        // advance mode stays so the rebuff/celebrate path fires once
        // the server replies after the reconnect.
        result.className = 'result muted';
        result.textContent = t('Offline — will send the moment you reconnect.');
      }
    });
    return;
  }

  const input = document.createElement('input');
  input.name = 'a';
  input.placeholder = previewState ? t('Try an answer (preview)') : t('Your answer');
  input.autocomplete = 'off';
  input.required = true;
  // Screen-reader users hear the placeholder, but a real label is
  // strictly correct + survives placeholder localisation if any
  // assistive tech ever ignores it.
  input.setAttribute('aria-label', t('Your answer'));
  const button = document.createElement('button');
  button.type = 'submit';
  button.textContent = t('Submit');
  const result = document.createElement('p');
  result.className = 'result muted';
  // aria-live so the rate-limit countdown / "saved while offline" /
  // gate rejection lines are announced when they appear, not silently
  // updated under the user's nose.
  result.setAttribute('role', 'status');
  result.setAttribute('aria-live', 'polite');
  const form = document.createElement('form');
  // Optional QR-scan button. Only added when the browser exposes the
  // BarcodeDetector API (Chrome 83+, Edge, Safari 17+, Android Chrome).
  // The button submits the decoded text as if it were typed — the
  // server-side answer matcher then evaluates it against the puzzle's
  // accept list, so a scan is "an immediate guess".
  const qrBtn = qrSupported() ? createQrButton(input, result) : null;
  if (qrBtn) {
    form.classList.add('has-qr');
    form.append(input, button, qrBtn, result);
  } else {
    form.append(input, button, result);
  }
  dock.append(form);
  submitInputEl = input;
  submitResultEl = result;
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (previewState) { handlePreviewSubmit(input.value); return; }
    if (!wsSendOrQueue('answer', { answer: input.value })) {
      // Queued — clear the input optimistically so the player can
      // tell their press landed, and surface a status line so the
      // disappearing input doesn't read as a silent failure.
      result.className = 'result muted';
      result.textContent = t('Offline — will send the moment you reconnect.');
      input.value = '';
    }
  });
  // Push the dock's measured height into the body padding reserve.
  // RAF defers the read until after layout settles so a freshly-
  // mounted dock isn't measured as 0×0.
  requestAnimationFrame(updateDockHeightVar);
}

// One-shot listener: orientation changes / browser-chrome auto-hide
// resize the viewport without re-rendering the dock, so re-measure.
window.addEventListener('resize', () => requestAnimationFrame(updateDockHeightVar));

// Orientation change forces a full re-render. The state-keyed
// dedupe in render() correctly suppresses redundant repaints on
// every WebSocket push, but it also suppresses an explicit
// re-render after rotation (the state didn't change — only the
// viewport did). Without this, a player who rotates mid-puzzle
// keeps the layout that was baked at the previous orientation
// until the next server push lands. Clear lastRenderKey and
// re-paint with whatever state we last received.
//
// requestAnimationFrame defers one frame so the browser's viewport
// + CSS env(safe-area-inset-*) update lands before render measures
// against it. Both event names are wired because Safari < 16.4
// only fires the legacy `orientationchange` while modern browsers
// expose `screen.orientation.change`; calling render twice is a
// cheap no-op past the second tick (lastRenderKey rebuilds).
function reflowAfterOrientationChange() {
  if (!lastState) return;
  lastRenderKey = '';
  requestAnimationFrame(() => render(lastState));
}
window.addEventListener('orientationchange', reflowAfterOrientationChange);
if (window.screen?.orientation?.addEventListener) {
  screen.orientation.addEventListener('change', reflowAfterOrientationChange);
}

// handlePreviewSubmit routes a preview answer through the same
// onAnswerResult the real player uses — arrangers see the real celebrate
// overlay on a correct answer (or the finale copy on the last puzzle)
// and the rebuff animation on a wrong one. With ?debug=1 the accept list
// is served alongside the puzzle so the match is real; without debug
// we let any non-empty answer through so the arranger can walk the
// adventure in order without knowing the answers. After a correct
// answer we auto-advance to the next puzzle once celebrate finishes,
// mirroring the WebSocket state push a real player would receive.
function handlePreviewSubmit(answer) {
  const needle = (answer || '').trim().toLowerCase();
  if (!needle) return;
  // Mirror the real applyAnswer normalisation: trim + lowercase, and
  // collapse internal whitespace runs so "  HELLO  world" matches
  // "hello world". Regex entries are anchored ^...$ + case-insensitive
  // to match the server's CheckAnswer; bad patterns silently miss
  // since the server already rejects them at save time.
  const norm = (s) => (s || '').trim().toLowerCase().replace(/\s+/g, ' ');
  const accept = Array.isArray(previewState.accept) ? previewState.accept : [];
  const dec = norm(needle);
  const accepted = accept.length > 0 && accept.some((a) => {
    if (!a) return false;
    if (a.regex) {
      try { return new RegExp('^(?:' + a.text + ')$', 'i').test(dec); }
      catch { return false; }
    }
    return norm(a.text || '') === dec;
  });
  const completed = accepted && previewState.pageIndex + 1 >= previewState.pageCount;
  onAnswerResult({ accepted, completed });
  if (accepted && !completed) {
    // Wait until the inter-puzzle celebrate overlay has settled (~1.8s)
    // before swapping the page so the arranger sees the win land.
    const nextIdx = previewState.pageIndex + 1;
    setTimeout(() => loadPreviewPage(nextIdx), 1400);
  }
}

// loadPreviewPage refetches a different puzzle from the preview endpoint
// and re-renders in place. Used by the auto-advance after a correct
// answer; the chrome's Prev/Next buttons still do a full reload because
// a debug-toggle or slug change needs a fresh bootstrap anyway.
async function loadPreviewPage(pageIdx) {
  const qs = new URLSearchParams(location.search);
  const slug = qs.get('preview');
  if (!slug) return;
  const apiQs = new URLSearchParams({ page: String(pageIdx) });
  if (qs.get('debug') === '1') apiQs.set('debug', '1');
  const r = await api(`/api/admin/adventures/${encodeURIComponent(slug)}/preview?${apiQs}`);
  if (r.status !== 200) return;
  qs.set('page', String(pageIdx));
  history.replaceState(null, '', '?' + qs.toString());
  previewState = {
    // Top-level accept ships on every preview response (admin-only
    // endpoint, so the author already owns the list). Without it the
    // client-side check defaulted to "always correct", masking real
    // answer bugs during adventure QA.
    accept: Array.isArray(r.body.accept) ? r.body.accept : [],
    pageIndex: r.body.page_index ?? 0,
    pageCount: r.body.page_count ?? 0,
  };
  lastRenderKey = null; // force render() past its dedupe check
  render(r.body);
  renderPreviewChrome(r.body);
}

// onAnswerResult handles the server's reply to an {kind:"answer"} push.
// The state refresh that follows a correct answer arrives as a separate
// "state" frame (pushed because the hub fires on answer); the celebrate
// overlay covers the re-render while it plays.
function onAnswerResult(r) {
  // Consume the advance-mode flag so only the matching result branch
  // animates (or suppresses).
  const mode = advanceMode;
  advanceMode = 'none';
  if (submitResultEl) {
    // Verdict text would be redundant now that celebrate/rebuff carry
    // the feedback — leave the line blank and let the overlay speak.
    // The element still exists for network errors ("Disconnected…").
    submitResultEl.className = 'result muted';
    submitResultEl.textContent = '';
  }
  if (r.accepted) {
    if (submitInputEl) { submitInputEl.value = ''; submitInputEl.blur(); }
    // Plain Continue button on a no-answer puzzle advances silently —
    // no celebrate, just the state frame that follows.
    if (mode !== 'silent') celebrate(r.completed);
  } else {
    // Wrong-answer guidance: nudge toward a hint when one is unlocked
    // but not yet revealed. Avoids "Not quite" being the only feedback
    // a stuck team gets.
    rebuff(wrongAnswerGuidance(lastState));
    // Return focus to the input + select all so the player can
    // immediately retype without a tap. Mobile keyboards re-open
    // automatically on focus, which is the desired flow.
    if (submitInputEl) {
      submitInputEl.focus();
      try { submitInputEl.select(); } catch { /* element type may not support */ }
    }
  }
}

// wrongAnswerGuidance returns a short hint-toward-hint message when
// the puzzle has unrevealed unlocked hints, or '' otherwise. The
// rebuff overlay subtitles itself with whichever string this returns.
function wrongAnswerGuidance(s) {
  if (!s || !Array.isArray(s.hints) || s.hints.length === 0) return '';
  const revealed = hintsRevealedFor(s);
  if (revealed >= s.hints.length) return '';
  const elapsed = Math.max(0, Math.floor((Date.now() - hintTickerAnchor) / 1000));
  const next = s.hints[revealed];
  const remaining = Math.max(0, (next.unlocks_in_seconds || 0) - elapsed);
  if (remaining > 0) return '';
  return revealed === 0
    ? t('Stuck? Tap the ? for a hint.')
    : t('Stuck? There\'s another hint ready.');
}

// celebrate renders a full-screen success overlay with a popped ring, a
// drawn checkmark, and a burst of confetti. The `finished` flag tweaks
// copy so the final puzzle lands differently from the intermediate ones.
function celebrate(finished) {
  // Audio + haptic cue lands at overlay-mount so the tone reaches
  // the player's ear during the pop animation, not after it. Gated
  // on the "Sound & vibration" preference; silent otherwise.
  playCorrectCue();
  const overlay = document.createElement('div');
  overlay.className = 'celebrate';
  // Screen-reader path: head + sub are already on screen, but without
  // role/aria-live the overlay's celebratory animation is silent for
  // a non-sighted player. role="status" with polite live region
  // queues "Correct! Next puzzle coming up…" after whatever the
  // reader was already saying.
  overlay.setAttribute('role', 'status');
  overlay.setAttribute('aria-live', 'polite');
  overlay.setAttribute('aria-atomic', 'true');
  const ring = document.createElement('div');
  ring.className = 'ring';
  ring.setAttribute('aria-hidden', 'true');
  ring.innerHTML = '<svg class="check" viewBox="0 0 100 100"><path d="M22 52 l18 18 l38 -38"/></svg>';
  const head = document.createElement('div');
  head.className = 'head';
  head.textContent = finished ? t('Adventure complete!') : t('Correct!');
  const sub = document.createElement('div');
  sub.className = 'sub';
  sub.textContent = finished ? t('Great work — you made it to the end.') : t('Next puzzle coming up…');
  overlay.append(ring, head, sub);

  // Confetti.
  const colours = ['#e24080', '#f5c452', '#7fd17b', '#60a5fa', '#a78bfa', '#22d3ee'];
  const count = finished ? 80 : 48;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'piece';
    const dx = (Math.random() * 2 - 1) * 380;
    const rot = (Math.random() * 1440 - 720);
    p.style.left = Math.random() * 100 + '%';
    p.style.setProperty('--c', colours[i % colours.length]);
    p.style.setProperty('--dx', dx + 'px');
    p.style.setProperty('--rot', rot + 'deg');
    p.style.setProperty('--d', (Math.random() * 250) + 'ms');
    overlay.append(p);
  }
  document.body.append(overlay);
  // Dismiss: short for inter-puzzle, longer when the adventure ends.
  const total = finished ? 3500 : 1800;
  setTimeout(() => overlay.classList.add('gone'), total);
  setTimeout(() => overlay.remove(), total + 500);
}

// rebuff is celebrate's mirror for a wrong guess — shorter and smaller
// so the player isn't punished by a long overlay between tries. pointer
// events stay off, so the submit dock is usable again the instant the
// overlay fades.
function rebuff(guidance) {
  const overlay = document.createElement('div');
  overlay.className = 'rebuff';
  overlay.setAttribute('role', 'status');
  overlay.setAttribute('aria-live', 'polite');
  overlay.setAttribute('aria-atomic', 'true');
  const disc = document.createElement('div');
  disc.className = 'disc';
  disc.setAttribute('aria-hidden', 'true');
  disc.innerHTML = '<svg class="cross" viewBox="0 0 100 100">'
    + '<path d="M28 28 L72 72"/><path d="M72 28 L28 72"/>'
    + '</svg>';
  const head = document.createElement('div');
  head.className = 'head';
  head.textContent = t('Not quite');
  overlay.append(disc, head);
  if (guidance) {
    const sub = document.createElement('div');
    sub.className = 'sub';
    sub.textContent = guidance;
    overlay.append(sub);
  }
  document.body.append(overlay);
  const total = 900;
  setTimeout(() => overlay.classList.add('gone'), total);
  setTimeout(() => overlay.remove(), total + 300);
}

// Debug shortcut: Alt+S pops the celebration so you can tweak the visuals
// without actually solving a puzzle. Alt+W re-shows the welcome overlay,
// Alt+C renders the completion summary with placeholder numbers.
document.addEventListener('keydown', (e) => {
  if (!e.altKey) return;
  if (e.key === 'S' || e.key === 's') {
    e.preventDefault();
    celebrate(e.shiftKey);
    return;
  }
  if (e.key === 'W' || e.key === 'w') {
    e.preventDefault();
    showWelcomeDialog({
      team_name: 'Team Alfa',
      adventure_title: 'Debug preview',
      page_count: 3,
    }, { force: true });
    return;
  }
  if (e.key === 'C' || e.key === 'c') {
    e.preventDefault();
    showDebugSummary();
  }
});

// maybeShowWelcome pops the welcome overlay the first time this slot
// opens this adventure, remembered in localStorage so a refresh doesn't
// re-show it.
function maybeShowWelcome(s) {
  if (!s.adventure_title || !s.team_name || !s.slot_name) return;
  // During pre-start we already show a countdown card in the main view.
  // Stacking the welcome overlay on top would duplicate the same
  // "waiting" message; defer until the event actually starts so the
  // intro + Let's go button lands when the player can act on it.
  if (s.status === 'waiting') return;
  const key = 'zv_welcome_' + [s.adventure_slug || s.adventure_title, s.team_name, s.slot_name].join('|');
  if (localStorage.getItem(key) === '1') return;
  showWelcomeDialog(s, { storageKey: key });
}

function showWelcomeDialog(s, opts = {}) {
  // Drop any leftover overlay (Alt+W pressed twice, etc.).
  document.querySelectorAll('.welcome').forEach((n) => n.remove());

  const dismiss = () => {
    if (opts.storageKey) localStorage.setItem(opts.storageKey, '1');
    overlay.remove();
  };

  // maybeShowWelcome suppresses the overlay during the 'waiting' state,
  // so by the time we get here the event is live and the CTA can just
  // dismiss. The pre-start countdown lives on buildWaitingCard instead.
  const cta = document.createElement('button');
  cta.textContent = t("Let's go");
  cta.addEventListener('click', dismiss);

  const overlay = el('div', { class: 'welcome' });
  const panel = el('div', { class: 'panel' });
  // First-join name override: arrangers often pre-set generic
  // placeholder names ("Player 3"). The welcome dialog is the
  // natural place to let the player introduce themselves before
  // they start playing. Renames flow through /api/player/me/name
  // and Hub-publish so team-mates and the arranger console see the
  // new name on the next state push.
  const whoLine = el('div', { class: 'who' });
  const renderWho = (slotName) => {
    whoLine.replaceChildren();
    const team = s.team_name || t('your team');
    const slot = slotName || s.slot_name || '';
    if (slot) {
      whoLine.append(
        document.createTextNode(team + ' · '),
        el('span', { class: 'who-slot' }, slot),
        document.createTextNode(' '),
        (() => {
          const renameBtn = document.createElement('button');
          renameBtn.type = 'button';
          renameBtn.className = 'who-rename';
          renameBtn.textContent = t('rename');
          renameBtn.addEventListener('click', async () => {
            const next = (prompt(t('Choose your name:'), slot) || '').trim();
            if (!next || next === slot) return;
            const r = await api('/api/player/me/name', {
              method: 'POST', body: JSON.stringify({ name: next }),
            });
            if (r.status === 200 && r.body?.name) {
              s.slot_name = r.body.name;
              renderWho(r.body.name);
            }
          });
          return renameBtn;
        })());
    } else {
      whoLine.textContent = team;
    }
  };
  renderWho();
  panel.append(
    el('button', {
      class: 'panel-close', type: 'button',
      'aria-label': t('Close'),
      on: { click: dismiss },
    }, '×'),
    el('h2', {}, s.adventure_title || t('Adventure')),
    whoLine);
  // If the adventure author supplied intro text, use it verbatim
  // instead of the built-in welcome paragraph + tips list. Newlines
  // are preserved via the CSS pre-wrap on .intro-custom.
  if (s.intro_text && s.intro_text.trim()) {
    panel.append(el('div', { class: 'intro-custom', html: s.intro_text }));
  } else {
    panel.append(
      el('p', {},
        t('Your team has '), el('strong', {}, String(s.page_count || '?')),
        t(' puzzles to solve. Good luck!')),
      el('h3', { style: 'margin-top:.5rem' }, t('A few quick tips')),
      el('ul', {},
        el('li', {}, t('Read each puzzle carefully — the answer is usually a short word or phrase.')),
        el('li', {}, t('Some puzzles only unlock when you reach a specific place. Your device will show a pin and prompt you to go there.')),
        el('li', {}, t('The submit button is always in the same spot at the bottom of the screen.')),
        el('li', {}, t('Whoever in your team has this link installed can type answers — pick one phone and keep it handy.')),
        el('li', {}, t('Wrong answers don\'t cost you anything — keep trying.'))));
  }
  panel.append(el('div', { class: 'cta' }, cta));
  overlay.append(panel);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) dismiss();
  });
  document.body.append(overlay);
}

// buildPausedCard distinguishes a mid-event pause from the pre-start
// waiting state. The waiting card carries a countdown / "Ready"
// label in the accent colour; pause uses a warning-toned glyph + a
// different headline so a player glancing at the screen doesn't
// confuse "we haven't started yet" with "we paused 3 minutes in".
function buildPausedCard() {
  const card = el('div', { class: 'prestart-card paused' });
  card.append(
    el('div', { class: 'banner' }, t('Paused')),
    el('div', { class: 'digits soft', style: 'color:var(--gold,#c98a14)' }, '⏸'),
    el('small', {}, t('The arranger paused the event. Stand by.')));
  return card;
}

// buildTeamRemovedCard is shown when the server pushes a "removed"
// frame — the team this slot belongs to was deleted mid-event by
// the arranger. Distinct from the slot-expired and event-cancelled
// cards because the recovery path is different: there's no link to
// retry, the player has to ask the arranger to be re-added.
function buildTeamRemovedCard() {
  const card = el('div', { class: 'prestart-card' });
  card.append(
    el('div', { class: 'banner' }, t('Team removed')),
    el('div', { class: 'digits soft' }, '⊘'),
    el('small', {}, t('The arranger removed your team. Ask them to add you back if this was a mistake.')));
  return card;
}

// buildWaitingCard renders the main-content view for a scheduled run.
// If we know the start time it ticks down in-place; otherwise it
// shows the softer "waiting for the arranger" copy.
function buildWaitingCard(s) {
  const card = el('div', { class: 'prestart-card' });
  card.append(el('div', { class: 'banner' }, t('Starting soon')));
  if (s.scheduled_at) {
    const digits = el('div', { class: 'digits' },
      preStartCountdownText(s.scheduled_at, s.server_now));
    card.append(digits, el('small', {}, t('until the flag drops')));
    // Self-refreshing countdown — stops when the card leaves the DOM.
    // We anchor every tick on the server-side clock so a phone whose
    // system time is ahead of the server doesn't see "0:00" before the
    // event actually starts. serverOffsetMs is updated on every state
    // push (ws.onmessage) so even long pre-event waits stay accurate.
    const target = parsePreStartTarget(s.scheduled_at);
    const tick = () => {
      if (!digits.isConnected) return;
      const now = Date.now() + serverOffsetMs;
      if (now >= target) {
        digits.textContent = t('any moment…');
        return;
      }
      const fakeServerNow = new Date(now).toISOString();
      digits.textContent = preStartCountdownText(s.scheduled_at, fakeServerNow);
      setTimeout(tick, 1000);
    };
    setTimeout(tick, 1000);
  } else {
    // No scheduled_at means the arranger left the start time blank
    // and will press Start when everyone's gathered. The em-dash
    // placeholder is replaced with explanatory copy so the player
    // doesn't read the empty digits as "something is broken".
    card.append(el('div', { class: 'digits soft' }, t('Ready')),
      el('small', {}, t('The event hasn\'t started yet. The arranger will start it when everyone\'s here.')));
  }
  return card;
}

function parsePreStartTarget(scheduledISO) {
  const d = new Date(scheduledISO.includes('T') ? scheduledISO : scheduledISO.replace(' ', 'T') + 'Z');
  return Number.isNaN(d.getTime()) ? 0 : d.getTime();
}

function preStartCountdownText(scheduledISO, serverNowISO) {
  const target = parsePreStartTarget(scheduledISO);
  const now = serverNowISO ? new Date(serverNowISO).getTime() : Date.now();
  const sec = Math.round((target - now) / 1000);
  if (sec <= 0) return t('any moment…');
  const d = Math.floor(sec / 86400);
  const h = Math.floor((sec % 86400) / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  const pad = (n) => String(n).padStart(2, '0');
  if (d > 0) return `${d}d ${pad(h)}:${pad(m)}:${pad(s)}`;
  if (h > 0) return `${pad(h)}:${pad(m)}:${pad(s)}`;
  return `${pad(m)}:${pad(s)}`;
}

// renderCompleted replaces the simple "Adventure complete!" line with a
// richer end-of-run card: team stats, distance, time, right/wrong.
async function renderCompleted(s) {
  const host = el('div', { class: 'summary' });
  // Paint the full layout immediately with em-dash placeholders so
  // the card lands stable behind the celebrate fade-out. The /summary
  // fetch resolves a moment later and we patch the stat values in
  // place. No "Loading your event stats…" intermediate state, no
  // second layout shift, and on a network failure the card stays
  // dignified — the celebration is still the point; the numbers
  // are a bonus.
  const placeholderStats = {
    team_name:        s.team_name || '',
    adventure_title:  s.adventure_title || '',
    distance_m:       NaN, // → formatDistance returns '—'
    duration_seconds: NaN, // → formatDuration returns '—'
    answers_right:    '—',
    answers_wrong:    '—',
    page_count:       0,   // → suppresses the "Solved all N…" caption
  };
  fillSummaryHost(host, placeholderStats, s);
  app.append(host);

  let stats = null;
  try {
    const r = await api('/api/player/summary');
    if (r.status === 200) stats = r.body;
  } catch { /* ignore — keep placeholders */ }
  if (stats) fillSummaryHost(host, stats, s);
}

function fillSummaryHost(host, stats, s) {
  // A custom outro replaces the default "Solved all N puzzles" caption
  // so authors can say something specific — a thank you, a pointer to
  // the next event, etc. Newlines preserved via .outro-custom CSS.
  const customOutro = s && s.outro_text && s.outro_text.trim();
  // The share button is only meaningful once the real stats arrive
  // — gating on a numeric answers_right keeps it hidden during the
  // em-dash placeholder pass. Hide entirely when neither share nor
  // clipboard APIs exist; we don't want a button that never works.
  const hasRealStats = typeof stats.answers_right === 'number';
  const canShare = !!(navigator.share || navigator.clipboard?.writeText);
  const shareBtn = (hasRealStats && canShare) ? buildShareButton(stats, s) : null;
  host.replaceChildren(
    el('h2', {}, t('Adventure complete!'), ' 🎉'),
    el('div', { class: 'who' }, `${stats.team_name} · ${stats.adventure_title}`),
    el('div', { class: 'stats-grid' },
      statBox(formatDistance(stats.distance_m),       t('Distance')),
      statBox(formatDuration(stats.duration_seconds), t('Time')),
      statBox(`${stats.answers_right}`,               t('Correct answers')),
      statBox(`${stats.answers_wrong}`,               t('Misses')),
    ),
    shareBtn,
    customOutro
      ? el('div', { class: 'outro-custom', html: s.outro_text })
      : (stats.page_count
          ? el('p', { class: 'muted', style: 'font-size:.85rem; margin-top:.75rem' },
              stats.page_count === 1
                ? t('Solved all {{n}} puzzle.', { n: stats.page_count })
                : t('Solved all {{n}} puzzles.', { n: stats.page_count }))
          : null),
  );
}

// Compose a multi-line share text from the player's stats. Lines are
// separate so a paste into Slack or iMessage reads top-down with the
// headline as the first line — share-target previews on most apps
// quote only the first line, which is exactly the brag we want.
function shareResultText(stats, s) {
  const title = (s && s.adventure_title) || t('Adventure complete!');
  const lines = [t('I finished {{title}}!', { title })];
  if (typeof stats.answers_right === 'number' && stats.page_count) {
    lines.push(t('Solved {{n}} of {{m}} puzzles', { n: stats.answers_right, m: stats.page_count }));
  }
  if (Number.isFinite(stats.duration_seconds) && stats.duration_seconds > 0) {
    lines.push(t('Time: {{t}}', { t: formatDuration(stats.duration_seconds) }));
  }
  if (Number.isFinite(stats.distance_m) && stats.distance_m > 0) {
    lines.push(t('Distance: {{d}}', { d: formatDistance(stats.distance_m) }));
  }
  return { title, text: lines.join('\n') };
}

function buildShareButton(stats, s) {
  // Recap URL when the server has minted one (post-completion).
  // Falls back to text-only share when the token is missing — old
  // teams from before the recap feature shipped, or events still
  // running; the share is degraded but the button still works.
  const recapURL = stats.recap_token
    ? location.origin + '/recap/' + encodeURIComponent(stats.recap_token)
    : '';
  const label = recapURL ? t('Share recap') : t('Share result');
  const btn = el('button', { class: 'btn primary',
    style: 'margin-top:1rem; width:100%' }, label);
  btn.addEventListener('click', async () => {
    const { title, text } = shareResultText(stats, s);
    const payload = recapURL
      ? { title, text, url: recapURL }
      : { title, text };
    // Native share sheet first — best UX on mobile (one tap to any
    // installed app). AbortError just means the user dismissed the
    // sheet, which we treat as a successful no-op rather than
    // falling through to clipboard.
    if (navigator.share) {
      try { await navigator.share(payload); return; }
      catch (e) {
        if (e && e.name === 'AbortError') return;
        // Fall through on real errors (Permission, NotAllowed, …).
      }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try {
        // Clipboard fallback: the URL is the most useful single
        // string for pasting into chat. When there's no recap
        // URL, fall back to the multi-line stats summary.
        await navigator.clipboard.writeText(recapURL || text);
        flashBtnLabel(btn, t('Copied!'));
        return;
      } catch { /* fall through */ }
    }
    flashBtnLabel(btn, t('Sharing not available'));
  });
  return btn;
}

// flashBtnLabel temporarily swaps a button's text so the click feedback
// is visible without toasting (play.html doesn't have a toast surface).
// Restores after 1.8s, which is long enough to read on a phone.
function flashBtnLabel(btn, msg) {
  if (!btn.dataset.origLabel) btn.dataset.origLabel = btn.textContent;
  btn.textContent = msg;
  btn.disabled = true;
  setTimeout(() => {
    btn.textContent = btn.dataset.origLabel;
    btn.disabled = false;
  }, 1800);
}

function statBox(value, label) {
  return el('div', { class: 'stat' },
    el('div', { class: 'v' }, value),
    el('div', { class: 'l' }, label));
}

function formatDistance(m) {
  if (!Number.isFinite(m) || m <= 0) return '—';
  // Locale-aware decimal separator: a Swedish player sees "1,2 km",
  // an English one sees "1.2 km". The unit suffix stays explicit
  // because km / m abbreviations are consistent across the locales
  // we ship.
  if (m < 1000) {
    return new Intl.NumberFormat(undefined, { maximumFractionDigits: 0 })
      .format(Math.round(m)) + ' m';
  }
  const km = m / 1000;
  const digits = m >= 10000 ? 0 : 1;
  return new Intl.NumberFormat(undefined, {
    minimumFractionDigits: digits, maximumFractionDigits: digits,
  }).format(km) + ' km';
}

function formatDuration(sec) {
  if (!Number.isFinite(sec) || sec <= 0) return '—';
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  const pad = (n) => String(n).padStart(2, '0');
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}

// QR-scan answer path. Players can tap the camera button next to the
// answer input to open a fullscreen camera modal; the first decoded
// QR value is submitted as if it were typed. The server-side answer
// matcher then evaluates it against the puzzle's accept list — so
// arrangers print a QR encoding any string that's in the accept list
// (e.g. an opaque token like "fountain-2026") and stick it at the
// physical location. No backend change needed; QR is purely an
// alternate input path on the player UI.
//
// Decode path:
//   1. Native BarcodeDetector if the browser exposes it (Chrome,
//      Edge, Safari 17+) — zero JS payload, fastest.
//   2. Vendored jsQR (~130 KB, ~40 KB gzipped) loaded lazily as a
//      fallback for Firefox / older iOS Safari. Loaded on first
//      tap so the cost only lands when the player actually uses the
//      feature.
// qrSupported is always true now — getUserMedia is the real gate
// (HTTPS + camera permission). The button is shown unconditionally;
// failures surface via the in-modal status line.
function qrSupported() {
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
}

// loadJsqr returns a promise resolving to the global jsQR function,
// loading the vendored script once and reusing it on subsequent
// calls. Resolves immediately if BarcodeDetector is available so
// callers don't pay the network cost for a fallback they never use.
let jsqrLoading = null;
function loadJsqr() {
  if (typeof window.jsQR === 'function') return Promise.resolve(window.jsQR);
  if (jsqrLoading) return jsqrLoading;
  jsqrLoading = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = '/assets/jsqr.js';
    s.async = true;
    s.onload = () => resolve(window.jsQR);
    s.onerror = () => { jsqrLoading = null; reject(new Error('jsqr load failed')); };
    document.head.append(s);
  });
  return jsqrLoading;
}

// createQrButton builds the small camera-icon button that lives next
// to the answer input. The submission flow is shared with the typed
// path — preview mode goes through handlePreviewSubmit, real play
// goes through wsSendOrQueue('answer', ...) — so a QR scan IS an
// immediate guess (no extra confirmation step).
function createQrButton(input, result) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'qr-btn';
  btn.setAttribute('aria-label', t('Scan QR code'));
  btn.title = t('Scan QR code');
  // Inline SVG so the icon scales with the button's font-size and
  // inherits currentColor (white on pink). Three corner finder
  // patterns + a few inner cells — the universal QR silhouette.
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    + '<rect x="3" y="3" width="5" height="5" rx="1"/>'
    + '<rect x="3" y="16" width="5" height="5" rx="1"/>'
    + '<rect x="16" y="3" width="5" height="5" rx="1"/>'
    + '<path d="M21 16h-3a2 2 0 0 0-2 2v3"/>'
    + '<path d="M21 21v.01"/>'
    + '<path d="M12 7v3a2 2 0 0 1-2 2H7"/>'
    + '<path d="M3 12h.01"/>'
    + '<path d="M12 3h.01"/>'
    + '<path d="M12 16v.01"/>'
    + '<path d="M16 12h1"/>'
    + '<path d="M21 12v.01"/>'
    + '<path d="M12 21v-1"/>'
    + '</svg>';
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    try {
      const decoded = await openQrScanner();
      if (!decoded) return; // user cancelled or camera failed
      // Mirror the typed path: feed the decoded value back through
      // the same submission as if the player had typed it. Do NOT
      // mutate input.value before the WS send — submitInputEl is
      // tracked elsewhere for offline-queue / countdown UI; setting
      // it here would interfere if the player had something half-
      // typed when they tapped Scan.
      if (previewState) {
        handlePreviewSubmit(decoded);
        return;
      }
      if (!wsSendOrQueue('answer', { answer: decoded })) {
        result.className = 'result muted';
        result.textContent = t('Offline — will send the moment you reconnect.');
      }
    } catch (err) {
      result.className = 'result err';
      result.textContent = t('Camera unavailable.');
    } finally {
      btn.disabled = false;
    }
  });
  return btn;
}

// openQrScanner builds a fullscreen modal showing the rear-camera
// feed and resolves with the first decoded QR value, or null if the
// user cancelled / the camera was denied. Two decode paths — native
// BarcodeDetector when the browser exposes it, jsQR (vendored) as
// a canvas-based fallback. Frame sampling runs via
// requestAnimationFrame so it pauses when the tab backgrounds.
function openQrScanner() {
  return new Promise((resolve) => {
    const modal = document.createElement('div');
    modal.className = 'qr-modal';
    const video = document.createElement('video');
    video.setAttribute('playsinline', '');
    video.muted = true;
    video.autoplay = true;
    const frame = document.createElement('div');
    frame.className = 'qr-frame';
    const status = document.createElement('p');
    status.className = 'qr-status';
    status.textContent = t('Point the camera at a QR code');
    const cancel = document.createElement('button');
    cancel.type = 'button';
    cancel.className = 'qr-cancel';
    cancel.textContent = t('Cancel');
    modal.append(video, frame, status, cancel);
    document.body.append(modal);

    let stream = null;
    let stopped = false;
    const cleanup = (value) => {
      if (stopped) return;
      stopped = true;
      if (stream) stream.getTracks().forEach((tk) => tk.stop());
      modal.remove();
      resolve(value);
    };
    cancel.addEventListener('click', () => cleanup(null));
    const onKey = (e) => { if (e.key === 'Escape') cleanup(null); };
    document.addEventListener('keydown', onKey);
    modal.addEventListener('remove', () => document.removeEventListener('keydown', onKey));

    (async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
        });
        if (stopped) { stream.getTracks().forEach((tk) => tk.stop()); return; }
        video.srcObject = stream;
        await video.play().catch(() => { /* autoplay rejection is benign */ });
      } catch {
        status.textContent = t('Camera permission denied.');
        return;
      }
      // Pick a decode strategy. Native is preferred (cheaper); jsQR is
      // loaded on demand if it isn't available.
      const native = (typeof window.BarcodeDetector === 'function')
        ? new BarcodeDetector({ formats: ['qr_code'] }) : null;
      let jsqr = null;
      if (!native) {
        try { jsqr = await loadJsqr(); }
        catch { status.textContent = t('Camera unavailable.'); return; }
      }
      // jsQR needs a 2D canvas to inspect pixels; native reads the
      // <video> directly. Allocate the canvas only on the fallback
      // path so native scans don't pay the GC churn.
      const canvas = jsqr ? document.createElement('canvas') : null;
      const ctx = canvas ? canvas.getContext('2d', { willReadFrequently: true }) : null;
      const tick = async () => {
        if (stopped) return;
        if (video.readyState >= 2) {
          try {
            if (native) {
              const codes = await native.detect(video);
              if (codes && codes.length > 0) {
                cleanup(codes[0].rawValue || '');
                return;
              }
            } else if (jsqr && video.videoWidth > 0) {
              canvas.width = video.videoWidth;
              canvas.height = video.videoHeight;
              ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
              const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
              const code = jsqr(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
              if (code && code.data) {
                cleanup(code.data);
                return;
              }
            }
          } catch { /* per-frame failures are benign */ }
        }
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    })();
  });
}

// Debug helper bound to Alt+C — renders a summary card with made-up numbers
// so the visual layout can be iterated on without finishing an event.
function showDebugSummary() {
  app.replaceChildren();
  const host = el('div', { class: 'summary' });
  app.append(host);
  fillSummaryHost(host, {
    team_name: 'Team Alfa',
    adventure_title: 'Demo: First Steps',
    page_count: 3,
    answers_right: 3,
    answers_wrong: 1,
    distance_m: 1742,
    duration_seconds: 48 * 60 + 12,
  });
}
function hideSubmitDock() {
  const dock = document.getElementById('submit-dock');
  if (dock) dock.remove();
  document.documentElement.style.removeProperty('--dock-height');
}

// updateDockHeightVar measures the rendered dock and pushes its
// height into a CSS custom property. The body's bottom padding reads
// that property so a tall gated dock (button + GPS freshness + help
// block) doesn't bury images behind itself.
function updateDockHeightVar() {
  const dock = document.getElementById('submit-dock');
  if (!dock) return;
  const h = dock.getBoundingClientRect().height;
  if (h > 0) {
    document.documentElement.style.setProperty('--dock-height', Math.ceil(h) + 'px');
  }
}

// Multi-tab guard. Two browser tabs sharing the same slot cookie can
// race each other — both burn answer-attempt budget, both ping
// location, neither knows the other exists. We resolve it by claiming
// the slot in localStorage with a periodic heartbeat. A second tab
// detects the active claim, blocks itself, and tells the player to
// close one of the windows.
//
// We don't know the slot id from the cookie (HttpOnly), so the key
// hashes the URL path — which is "/play" for everyone, fine because a
// device only has one player session at a time. Coarser than per-slot
// but does the job.
const TAB_LOCK_KEY = 'zv_player_active_tab';
const TAB_LOCK_TIMEOUT_MS = 8000; // claim is stale after this long.
const TAB_LOCK_HEARTBEAT_MS = 3000;
const tabId = Math.random().toString(36).slice(2) + Date.now().toString(36);
let tabLockTimer = null;

function claimTabLock() {
  try {
    localStorage.setItem(TAB_LOCK_KEY, JSON.stringify({ id: tabId, ts: Date.now() }));
  } catch { /* localStorage may be disabled — fall through, no-op */ }
}

function tabLockHolder() {
  try {
    const raw = localStorage.getItem(TAB_LOCK_KEY);
    if (!raw) return null;
    const v = JSON.parse(raw);
    if (!v || typeof v.ts !== 'number') return null;
    if (Date.now() - v.ts > TAB_LOCK_TIMEOUT_MS) return null;
    return v;
  } catch { return null; }
}

function showTabConflict() {
  document.querySelectorAll('.tab-conflict').forEach((n) => n.remove());
  const overlay = el('div', { class: 'tab-conflict' },
    el('div', { class: 'panel' },
      el('h3', {}, t('Already open in another tab')),
      el('p', { class: 'muted' },
        t("This game is already running in another tab on this device. Close this one and continue there to keep your answers and location in sync.")),
      el('button', {
        on: { click: () => {
          // Force-claim from this tab — useful if the other tab
          // was closed without releasing cleanly.
          overlay.remove();
          startTabHeartbeat();
          bootstrapAfterClaim();
        } },
      }, t('Use this tab instead'))));
  document.body.append(overlay);
}

function startTabHeartbeat() {
  claimTabLock();
  if (tabLockTimer) clearInterval(tabLockTimer);
  tabLockTimer = setInterval(claimTabLock, TAB_LOCK_HEARTBEAT_MS);
  // Releasing on unload lets the *other* tab take over without waiting
  // out the staleness window.
  window.addEventListener('pagehide', () => {
    try {
      const cur = tabLockHolder();
      if (cur && cur.id === tabId) localStorage.removeItem(TAB_LOCK_KEY);
    } catch { /* ignore */ }
  }, { once: true });
}

// Bootstrap: a single HTTP probe decides auth (WebSocket upgrade failures
// can't be distinguished from network errors in the browser) and seeds the
// initial render. Afterwards the WebSocket takes over entirely.
//
// Preview mode (?preview=<slug>&page=<N>[&debug=1]) takes a different
// path — no slot session, no WebSocket, no GPS pings. An arranger
// reviews the puzzle rendered exactly as a player would see it.
async function bootstrap() {
  const qs = new URLSearchParams(location.search);
  if (qs.get('preview')) {
    await bootstrapPreview(qs.get('preview'), parseInt(qs.get('page') || '0', 10), qs.get('debug') === '1');
    return;
  }
  const holder = tabLockHolder();
  if (holder && holder.id !== tabId) {
    showTabConflict();
    return;
  }
  startTabHeartbeat();
  await bootstrapAfterClaim();
}

async function bootstrapAfterClaim() {
  const s = await api('/api/player/state');
  if (s.status === 401) { renderNoSession(); return; }
  if (s.status !== 200) {
    app.replaceChildren(el('p', { class: 'err' }, s.body?.error || t('error')));
    return;
  }
  if (s.body && s.body.server_now) {
    const sn = new Date(s.body.server_now).getTime();
    if (Number.isFinite(sn)) serverOffsetMs = sn - Date.now();
  }
  hadActiveSession = true;
  startGPS();
  render(s.body);
  connectWS();
}

async function bootstrapPreview(slug, pageIdx, debug) {
  const qs = new URLSearchParams({ page: String(pageIdx) });
  if (debug) qs.set('debug', '1');
  const r = await api(`/api/admin/adventures/${encodeURIComponent(slug)}/preview?${qs}`);
  if (r.status === 401) {
    app.replaceChildren(el('p', { class: 'err' },
      t('Preview requires an arranger login. Open '),
      el('a', { href: '/arrange' }, '/arrange'), t(' first, then retry.')));
    return;
  }
  if (r.status !== 200) {
    app.replaceChildren(el('p', { class: 'err' }, r.body?.error || t('error {{status}}', { status: r.status })));
    return;
  }
  previewState = {
    // Top-level accept ships on every preview response (admin-only
    // endpoint, so the author already owns the list). Without it the
    // client-side check defaulted to "always correct", masking real
    // answer bugs during adventure QA.
    accept: Array.isArray(r.body.accept) ? r.body.accept : [],
    pageIndex: r.body.page_index ?? 0,
    pageCount: r.body.page_count ?? 0,
  };
  render(r.body);
  renderPreviewChrome(r.body);
}

// renderPreviewChrome overlays a top ribbon with adventure-level
// navigation so the arranger can jump between puzzles, toggle the debug
// panel, and exit without hunting for tab close. Rebuilt on every
// render() so the "N of M" stays in sync with the fetched page.
function renderPreviewChrome(s) {
  document.getElementById('preview-chrome')?.remove();
  document.getElementById('preview-debug')?.remove();
  const qs = new URLSearchParams(location.search);
  const slug = qs.get('preview');
  const pageIdx = s.page_index ?? 0;
  const count = s.page_count ?? 0;
  const debug = qs.get('debug') === '1';
  const go = (patch) => {
    const next = new URLSearchParams(location.search);
    for (const [k, v] of Object.entries(patch)) {
      if (v === null) next.delete(k); else next.set(k, String(v));
    }
    location.search = '?' + next.toString();
  };
  const chrome = el('div', { id: 'preview-chrome', class: 'preview-chrome' },
    el('strong', {}, t('Preview')),
    el('span', { class: 'sep' }, '·'),
    el('span', {}, s.adventure_title || slug),
    el('span', { class: 'sep' }, '·'),
    el('span', {}, t('Puzzle {{i}}/{{n}}', { i: pageIdx + 1, n: count })),
    el('span', { style: 'flex:1' }),
    el('button', { class: 'chip', disabled: pageIdx <= 0 ? '' : null,
      on: { click: () => go({ page: pageIdx - 1 }) } }, t('◀ Prev')),
    el('button', { class: 'chip', disabled: pageIdx >= count - 1 ? '' : null,
      on: { click: () => go({ page: pageIdx + 1 }) } }, t('Next ▶')),
    el('button', { class: 'chip' + (debug ? ' on' : ''),
      on: { click: () => go({ debug: debug ? null : 1 }) } }, t('Debug')),
    el('button', { class: 'chip', on: { click: () => window.close() } }, t('Close')),
  );
  document.body.prepend(chrome);
  if (s.preview_debug) renderPreviewDebug(s.preview_debug, chrome);
}

// renderPreviewDebug builds a single-row strip with the author-side
// fields (accepted answers, gate location, notes) that a player never
// sees, and inserts it directly after the preview-chrome ribbon so
// the two read as one paired arranger header. Long notes truncate
// with ellipsis (full text in the title attribute) so the strip stays
// a one-liner in the common case.
function renderPreviewDebug(d, anchor) {
  // Accepted answers as inline chips. Regex entries are flagged with a
  // `re:` prefix so a literal-looking answer like `(yes|ja)` doesn't
  // read as a string the player must type verbatim.
  const accept = d.accept || [];
  const acceptCell = el('span', { class: 'cell' },
    el('strong', {}, t('Accepted answers: ')));
  if (!accept.length) {
    acceptCell.append(el('span', { class: 'muted' }, t('(none)')));
  } else {
    accept.forEach((a, i) => {
      const text = (a && typeof a === 'object') ? (a.text || '') : String(a || '');
      const isRegex = !!(a && typeof a === 'object' && a.regex);
      acceptCell.append(el('code', {}, isRegex ? 're: ' + text : text));
      if (i < accept.length - 1) acceptCell.append(document.createTextNode(' '));
    });
  }
  const coords = `${d.lat.toFixed(5)}, ${d.lng.toFixed(5)}`;
  const locSuffix = d.radius_m
    ? t(' · gate radius {{r}} m', { r: d.radius_m })
    : t(' · not gated');
  // Coord cell is a link-styled button that opens the same fullscreen
  // map overlay arrange.html uses for "Open map" — saves the arranger
  // from copy-pasting coords into a separate tool to confirm a gate
  // sits where they meant.
  const locCell = el('button', {
    class: 'cell mono linklike',
    type: 'button',
    'aria-label': t('Open this puzzle\'s location on the map'),
    on: { click: () => openFullscreenMap({
      title: t('Puzzle location'),
      pins: [{
        lat: d.lat,
        lng: d.lng,
        gated: !!d.radius_m,
        radiusM: d.radius_m || 0,
      }],
    }) },
  }, t('Location: {{coords}}', { coords }) + locSuffix);
  const cells = [acceptCell, locCell];
  if (d.notes) {
    cells.push(el('span', { class: 'cell notes muted', title: d.notes },
      t('Notes: ') + d.notes));
  }
  const panel = el('div', { id: 'preview-debug', class: 'preview-debug' }, ...cells);
  anchor.after(panel);
}

// ensureLeaflet pulls Leaflet's CSS + JS from unpkg the first time
// any caller asks for it, and returns a cached promise on subsequent
// calls so multiple open-map clicks don't duplicate-load. Lazy on
// purpose: 99% of play.html visits are real players who never need
// a map — we don't want to ship ~150 KB of mapping code to every
// phone just so the arranger preview can open a coord overlay.
let leafletReady = null;
function ensureLeaflet() {
  if (leafletReady) return leafletReady;
  leafletReady = new Promise((resolve, reject) => {
    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    css.integrity = 'sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=';
    css.crossOrigin = '';
    document.head.append(css);
    const js = document.createElement('script');
    js.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    js.integrity = 'sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=';
    js.crossOrigin = '';
    js.onload = () => resolve();
    js.onerror = () => reject(new Error('leaflet load failed'));
    document.head.append(js);
  });
  return leafletReady;
}

// openFullscreenMap drops a chromeless overlay with a Leaflet map
// covering the viewport. Mirrors arrange.html's same-named helper so
// the two surfaces feel identical when an arranger crosses between
// "edit puzzle" and "preview puzzle". Single pin centres at zoom 17;
// many pins auto-fit to bounds.
//
// opts: { title?, pins?, accent? }
//   pins[]: { lat, lng, label?, gated?, radiusM? }
//     gated:   fills the marker (matches the run-detail legend).
//     radiusM: draws a translucent gate circle around the pin.
function openFullscreenMap(opts) {
  const { title, pins, accent } = opts || {};
  const list = Array.isArray(pins) ? pins : [];
  let removed = false;
  let map = null;
  const close = () => {
    if (removed) return;
    removed = true;
    document.removeEventListener('keydown', onKey);
    try { if (map) map.remove(); } catch { /* leaflet teardown is best-effort */ }
    back.remove();
  };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  const mapEl = el('div', { class: 'fsmap-host' });
  const back = el('div', {
    class: 'fsmap-back',
    role: 'dialog',
    'aria-modal': 'true',
    on: { click: (e) => { if (e.target === back) close(); } },
  },
    el('div', { class: 'fsmap-chrome' },
      el('div', { class: 'fsmap-title' }, title || ''),
      el('button', {
        class: 'fsmap-close',
        type: 'button',
        'aria-label': t('Close'),
        on: { click: close },
      }, '×')),
    mapEl,
  );
  document.body.append(back);
  document.addEventListener('keydown', onKey);
  // Loading placeholder for the first-call Leaflet fetch; subsequent
  // opens resolve synchronously from the cached promise so this
  // flashes too briefly to notice.
  mapEl.replaceChildren(el('div', { class: 'empty' },
    t('Loading map…')));
  ensureLeaflet().then(() => {
    if (removed) return;
    mapEl.replaceChildren();
    map = L.map(mapEl).setView([59.3293, 18.0686], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 19,
    }).addTo(map);
    const fillColour = accent ||
      getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() ||
      '#ad1357';
    const pts = [];
    for (const pin of list) {
      if (!pin || (!pin.lat && !pin.lng)) continue;
      const m = L.circleMarker([pin.lat, pin.lng], {
        radius: 9,
        color: fillColour,
        weight: 2,
        fillColor: pin.gated ? fillColour : 'transparent',
        fillOpacity: pin.gated ? 1 : 0,
      }).addTo(map);
      if (pin.label) m.bindTooltip(pin.label);
      if (pin.radiusM > 0) {
        L.circle([pin.lat, pin.lng], {
          radius: pin.radiusM,
          color: fillColour,
          weight: 1,
          fillOpacity: .12,
        }).addTo(map);
      }
      pts.push([pin.lat, pin.lng]);
    }
    if (pts.length === 1) {
      map.setView(pts[0], 17);
    } else if (pts.length > 1) {
      map.fitBounds(L.latLngBounds(pts), { padding: [40, 40] });
    }
    // Drop a "you are here" marker if the browser hands one over.
    // Mirrors arrange.html's openFullscreenMap so the two surfaces
    // behave the same when an arranger crosses between editor and
    // preview. Distinct blue keeps it visually separable from the
    // brand-accent puzzle pins. Errors (denied, no sensor) are
    // silently swallowed; the map is still useful without it.
    if ('geolocation' in navigator) {
      navigator.geolocation.getCurrentPosition((pos) => {
        if (removed) return;
        const { latitude, longitude, accuracy } = pos.coords;
        L.circleMarker([latitude, longitude], {
          radius: 6,
          color: '#fff',
          weight: 2,
          fillColor: '#1976d2',
          fillOpacity: 1,
        }).addTo(map).bindTooltip(t('You are here'));
        if (accuracy && accuracy > 0) {
          L.circle([latitude, longitude], {
            radius: accuracy,
            color: '#1976d2',
            weight: 1,
            fillOpacity: .1,
          }).addTo(map);
        }
      }, () => { /* denied or no fix — silent */ },
        { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 });
    }
    // Leaflet measures its container at init; the overlay is freshly
    // mounted so the size is correct, but invalidateSize after the
    // browser commits the layout is the standard belt-and-braces call
    // for map-in-flex setups.
    setTimeout(() => { try { map.invalidateSize(); } catch { /* torn down */ } }, 30);
  }).catch(() => {
    if (removed) return;
    mapEl.replaceChildren(el('div', { class: 'empty' },
      t('Map library failed to load.')));
  });
}

// buildMenuButton returns the small hamburger button placed at the
// right of the runbar. Clicking it opens a slide-in drawer with
// adventure context, language picker, sign-out, "forget me", and the
// privacy / terms links. Replaces three previous floating affordances
// (lang-fab, more-fab, legal-footer) which all competed for the
// top-right corner and overlapped the puzzle content on narrow phones.
// openTeamShareSheet displays the public /team/{token} URL as a QR
// code (server-rendered PNG via /qr/team/{token}) plus a Copy button.
// Used to bring a teammate online whose magic link didn't reach them
// — they scan the QR, get the team page, pick their slot, play.
function openTeamShareSheet(token) {
  const url = location.origin + '/team/' + encodeURIComponent(token);
  const overlay = document.createElement('div');
  overlay.className = 'team-share';
  const panel = document.createElement('div');
  panel.className = 'panel';
  const xBtn = document.createElement('button');
  xBtn.type = 'button';
  xBtn.className = 'panel-close';
  xBtn.setAttribute('aria-label', t('Close'));
  xBtn.textContent = '×';
  const h = document.createElement('h3');
  h.textContent = t('Team join link');
  const hint = document.createElement('p');
  hint.className = 'hint';
  hint.textContent = t('Scan to join this team. Each teammate picks their own name on the page.');
  const qrWrap = document.createElement('div');
  qrWrap.className = 'qr';
  const img = document.createElement('img');
  img.src = '/qr/team/' + encodeURIComponent(token);
  img.alt = t('Team join QR code');
  qrWrap.append(img);
  const urlEl = document.createElement('p');
  urlEl.className = 'url';
  urlEl.textContent = url;
  const row = document.createElement('div');
  row.className = 'row';
  const copyBtn = document.createElement('button');
  copyBtn.type = 'button';
  copyBtn.className = 'secondary';
  copyBtn.textContent = t('Copy link');
  copyBtn.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(url); copyBtn.textContent = t('Copied'); }
    catch { /* clipboard refused — leave the URL on screen, user can long-press to copy */ }
  });
  const closeBtn = document.createElement('button');
  closeBtn.type = 'button';
  closeBtn.textContent = t('Close');
  const close = () => {
    overlay.remove();
    document.removeEventListener('keydown', onKey);
  };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  closeBtn.addEventListener('click', close);
  xBtn.addEventListener('click', close);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  document.addEventListener('keydown', onKey);
  row.append(copyBtn, closeBtn);
  panel.append(xBtn, h, hint, qrWrap, urlEl, row);
  overlay.append(panel);
  document.body.append(overlay);
}

function buildMenuButton(s) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'menu-btn';
  btn.setAttribute('aria-label', t('Menu'));
  btn.title = t('Menu');
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    + '<line x1="4" y1="6" x2="20" y2="6"/>'
    + '<line x1="4" y1="12" x2="20" y2="12"/>'
    + '<line x1="4" y1="18" x2="20" y2="18"/>'
    + '</svg>';
  btn.addEventListener('click', () => openMenuDrawer(s));
  return btn;
}

// openMenuDrawer mounts the slide-in side panel. The drawer is built
// fresh on each open so the language picker (rendered through
// zvI18n.makeLangPicker) reflects whichever language is currently
// active without us having to re-sync state.
function openMenuDrawer(s) {
  const drawer = document.createElement('div');
  drawer.className = 'menu-drawer';
  const panel = document.createElement('div');
  panel.className = 'menu-panel';

  const head = document.createElement('div');
  head.className = 'menu-head';
  const headText = document.createElement('div');
  headText.style.cssText = 'min-width:0; flex:1';
  if (s?.adventure_title) {
    const h = document.createElement('h2');
    h.className = 'menu-title';
    h.textContent = s.adventure_title;
    headText.append(h);
  } else {
    const h = document.createElement('h2');
    h.className = 'menu-title';
    h.textContent = 'Zonventure';
    headText.append(h);
  }
  if (s?.team_name) {
    const team = document.createElement('p');
    team.className = 'menu-team';
    team.textContent = s.team_name;
    headText.append(team);
  }
  const closeBtn = document.createElement('button');
  closeBtn.type = 'button';
  closeBtn.className = 'menu-close';
  closeBtn.setAttribute('aria-label', t('Close'));
  closeBtn.textContent = '×';
  head.append(headText, closeBtn);
  panel.append(head);

  // Language picker. The shared zvI18n helper renders a native <select>
  // with flag + name labels; styling here just gives it a comfortable
  // tap target inside the drawer row.
  const langSection = document.createElement('div');
  langSection.className = 'menu-section';
  const langLabel = document.createElement('p');
  langLabel.className = 'menu-section-label';
  langLabel.textContent = t('Language');
  const langPicker = zvI18n.makeLangPicker({ title: t('Language') });
  // Explicit color + color-scheme on the <select>: native form
  // controls don't inherit `color` reliably across browsers, and
  // without `color-scheme` the dropdown chrome ignores our --ink /
  // --surface vars and falls back to the OS default — which in light
  // mode against a dark theme picker rendered the option text
  // invisibly white-on-white.
  langPicker.style.cssText = 'width:100%; padding:.6rem .75rem; font:inherit; font-weight:600; border:1px solid var(--border-soft); border-radius:8px; background:var(--surface); color:var(--ink); color-scheme:light dark;';
  langSection.append(langLabel, langPicker);
  panel.append(langSection);

  // Theme picker. Three options — Light / Dark / Auto — using the
  // shared `data-theme` attribute pattern. "Auto" clears the
  // attribute so the OS preference takes over again. The active
  // button repaints in place when tapped; the drawer doesn't close
  // so the player can verify the visual change before dismissing.
  const themeSection = document.createElement('div');
  themeSection.className = 'menu-section';
  const themeLabel = document.createElement('p');
  themeLabel.className = 'menu-section-label';
  themeLabel.textContent = t('Theme');
  themeSection.append(themeLabel);
  const seg = document.createElement('div');
  seg.className = 'menu-seg';
  const themeButtons = {};
  const repaintTheme = () => {
    let saved = null;
    try { saved = localStorage.getItem('zv-theme'); } catch {}
    const sel = (saved === 'light' || saved === 'dark') ? saved : 'system';
    for (const [v, b] of Object.entries(themeButtons)) {
      const active = v === sel;
      b.classList.toggle('active', active);
      b.setAttribute('aria-pressed', active ? 'true' : 'false');
    }
  };
  const makeThemeBtn = (value, label) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'menu-seg-btn';
    b.textContent = label;
    themeButtons[value] = b;
    b.addEventListener('click', () => { setTheme(value); repaintTheme(); });
    return b;
  };
  seg.append(
    makeThemeBtn('light', t('Light')),
    makeThemeBtn('dark', t('Dark')),
    makeThemeBtn('system', t('Auto')),
  );
  repaintTheme();
  themeSection.append(seg);
  panel.append(themeSection);

  // Team share — show a QR + URL of the public team page so a
  // teammate whose magic link didn't reach them can scan, pick
  // their slot, and join. Only rendered when we have the team's
  // share token (real session; preview mode skips it).
  if (s?.team_token) {
    const teamSection = document.createElement('div');
    teamSection.className = 'menu-section';
    const teamLabel = document.createElement('p');
    teamLabel.className = 'menu-section-label';
    teamLabel.textContent = t('Team');
    teamSection.append(teamLabel);
    const shareBtn = document.createElement('button');
    shareBtn.type = 'button';
    shareBtn.className = 'menu-row';
    shareBtn.append(document.createTextNode(t('Show team join link')));
    const shareSub = document.createElement('span');
    shareSub.className = 'menu-row-sub';
    shareSub.textContent = t('A QR code for this team\'s join page. A teammate without a magic link can scan it, pick their name, and start playing.');
    shareBtn.append(shareSub);
    shareBtn.addEventListener('click', () => { close(); openTeamShareSheet(s.team_token); });
    teamSection.append(shareBtn);

    // Player-driven team rename. Same prompt() pattern the slot
    // rename uses on the welcome screen — minimal UI surface and the
    // same "any member can do it" model. The server enforces the
    // UNIQUE(event_id, name) constraint; on conflict we surface
    // "name already used" inline rather than silently swallowing.
    const renameBtn = document.createElement('button');
    renameBtn.type = 'button';
    renameBtn.className = 'menu-row';
    renameBtn.append(document.createTextNode(t('Rename team')));
    const renameSub = document.createElement('span');
    renameSub.className = 'menu-row-sub';
    renameSub.textContent = t('Pick a name everyone on your team agrees on. Updates immediately for the arranger and your team-mates.');
    renameBtn.append(renameSub);
    renameBtn.addEventListener('click', async () => {
      const current = s.team_name || '';
      const next = (prompt(t('New team name:'), current) || '').trim();
      if (!next || next === current) return;
      const r = await api('/api/player/team/name', {
        method: 'POST', body: JSON.stringify({ name: next }),
      });
      if (r.status === 200 && r.body?.name) {
        s.team_name = r.body.name;
        // Re-open the drawer so the section heading + welcome card
        // both reflect the new name on next paint. Cheap; the panel
        // is rebuilt on every open anyway.
        close();
        openMenuDrawer(s);
      } else if (r.status === 409) {
        alert(t('That name is already taken in this event. Try another.'));
      } else {
        alert(r.body?.error || t('Could not rename — try again.'));
      }
    });
    teamSection.append(renameBtn);
    panel.append(teamSection);
  }

  // Privacy & feedback toggles — the player-side opt-out switches.
  // Both flip a localStorage flag and re-apply the corresponding
  // runtime state immediately (clear/restart the GPS watcher; mute
  // future cues). Persistence is per-device on purpose: a player
  // who wants quiet at one venue and sound at another shouldn't
  // sync that preference across team-mates.
