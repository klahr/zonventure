  // are a bonus.
  const placeholderStats = {
    team_name:        s.team_name || '',
    adventure_title:  s.adventure_title || '',
    distance_m:       NaN, // → formatDistance returns '—'
    duration_seconds: NaN, // → formatDuration returns '—'
    answers_right:    '—',
    answers_wrong:    '—',
    page_count:       0,   // → suppresses the "Solved all N…" caption
  };
  fillSummaryHost(host, placeholderStats, s);
  app.append(host);

  let stats = null;
  try {
    const r = await api('/api/player/summary');
    if (r.status === 200) stats = r.body;
  } catch { /* ignore — keep placeholders */ }
  if (stats) fillSummaryHost(host, stats, s);
}

function fillSummaryHost(host, stats, s) {
  // A custom outro replaces the default "Solved all N puzzles" caption
  // so authors can say something specific — a thank you, a pointer to
  // the next event, etc. Newlines preserved via .outro-custom CSS.
  const customOutro = s && s.outro_text && s.outro_text.trim();
  // The share button is only meaningful once the real stats arrive
  // — gating on a numeric answers_right keeps it hidden during the
  // em-dash placeholder pass. Hide entirely when neither share nor
  // clipboard APIs exist; we don't want a button that never works.
  const hasRealStats = typeof stats.answers_right === 'number';
  const canShare = !!(navigator.share || navigator.clipboard?.writeText);
  const shareBtn = (hasRealStats && canShare) ? buildShareButton(stats, s) : null;
  host.replaceChildren(
    el('h2', {}, t('Adventure complete!'), ' 🎉'),
    el('div', { class: 'who' }, `${stats.team_name} · ${stats.adventure_title}`),
    el('div', { class: 'stats-grid' },
      statBox(formatDistance(stats.distance_m),       t('Distance')),
      statBox(formatDuration(stats.duration_seconds), t('Time')),
      statBox(`${stats.answers_right}`,               t('Correct answers')),
      statBox(`${stats.answers_wrong}`,               t('Misses')),
    ),
    shareBtn,
    customOutro
      ? el('div', { class: 'outro-custom', html: s.outro_text })
      : (stats.page_count
          ? el('p', { class: 'muted', style: 'font-size:.85rem; margin-top:.75rem' },
              stats.page_count === 1
                ? t('Solved all {{n}} puzzle.', { n: stats.page_count })
                : t('Solved all {{n}} puzzles.', { n: stats.page_count }))
          : null),
  );
}

// Compose a multi-line share text from the player's stats. Lines are
// separate so a paste into Slack or iMessage reads top-down with the
// headline as the first line — share-target previews on most apps
// quote only the first line, which is exactly the brag we want.
function shareResultText(stats, s) {
  const title = (s && s.adventure_title) || t('Adventure complete!');
  const lines = [t('I finished {{title}}!', { title })];
  if (typeof stats.answers_right === 'number' && stats.page_count) {
    lines.push(t('Solved {{n}} of {{m}} puzzles', { n: stats.answers_right, m: stats.page_count }));
  }
  if (Number.isFinite(stats.duration_seconds) && stats.duration_seconds > 0) {
    lines.push(t('Time: {{t}}', { t: formatDuration(stats.duration_seconds) }));
  }
  if (Number.isFinite(stats.distance_m) && stats.distance_m > 0) {
    lines.push(t('Distance: {{d}}', { d: formatDistance(stats.distance_m) }));
  }
  return { title, text: lines.join('\n') };
}

function buildShareButton(stats, s) {
  // Recap URL when the server has minted one (post-completion).
  // Falls back to text-only share when the token is missing — old
  // teams from before the recap feature shipped, or events still
  // running; the share is degraded but the button still works.
  const recapURL = stats.recap_token
    ? location.origin + '/recap/' + encodeURIComponent(stats.recap_token)
    : '';
  const label = recapURL ? t('Share recap') : t('Share result');
  const btn = el('button', { class: 'btn primary',
    style: 'margin-top:1rem; width:100%' }, label);
  btn.addEventListener('click', async () => {
    const { title, text } = shareResultText(stats, s);
    const payload = recapURL
      ? { title, text, url: recapURL }
      : { title, text };
    // Native share sheet first — best UX on mobile (one tap to any
    // installed app). AbortError just means the user dismissed the
    // sheet, which we treat as a successful no-op rather than
    // falling through to clipboard.
    if (navigator.share) {
      try { await navigator.share(payload); return; }
      catch (e) {
        if (e && e.name === 'AbortError') return;
        // Fall through on real errors (Permission, NotAllowed, …).
      }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try {
        // Clipboard fallback: the URL is the most useful single
        // string for pasting into chat. When there's no recap
        // URL, fall back to the multi-line stats summary.
        await navigator.clipboard.writeText(recapURL || text);
        flashBtnLabel(btn, t('Copied!'));
        return;
      } catch { /* fall through */ }
    }
    flashBtnLabel(btn, t('Sharing not available'));
  });
  return btn;
}

// flashBtnLabel temporarily swaps a button's text so the click feedback
// is visible without toasting (play.html doesn't have a toast surface).
// Restores after 1.8s, which is long enough to read on a phone.
function flashBtnLabel(btn, msg) {
  if (!btn.dataset.origLabel) btn.dataset.origLabel = btn.textContent;
  btn.textContent = msg;
  btn.disabled = true;
  setTimeout(() => {
    btn.textContent = btn.dataset.origLabel;
    btn.disabled = false;
  }, 1800);
}

function statBox(value, label) {
  return el('div', { class: 'stat' },
    el('div', { class: 'v' }, value),
    el('div', { class: 'l' }, label));
}

function formatDistance(m) {
  if (!Number.isFinite(m) || m <= 0) return '—';
  // Locale-aware decimal separator: a Swedish player sees "1,2 km",
  // an English one sees "1.2 km". The unit suffix stays explicit
  // because km / m abbreviations are consistent across the locales
  // we ship.
  if (m < 1000) {
    return new Intl.NumberFormat(undefined, { maximumFractionDigits: 0 })
      .format(Math.round(m)) + ' m';
  }
  const km = m / 1000;
  const digits = m >= 10000 ? 0 : 1;
  return new Intl.NumberFormat(undefined, {
    minimumFractionDigits: digits, maximumFractionDigits: digits,
  }).format(km) + ' km';
}

function formatDuration(sec) {
  if (!Number.isFinite(sec) || sec <= 0) return '—';
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  const pad = (n) => String(n).padStart(2, '0');
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}

// QR-scan answer path. Players can tap the camera button next to the
// answer input to open a fullscreen camera modal; the first decoded
// QR value is submitted as if it were typed. The server-side answer
// matcher then evaluates it against the puzzle's accept list — so
// arrangers print a QR encoding any string that's in the accept list
// (e.g. an opaque token like "fountain-2026") and stick it at the
// physical location. No backend change needed; QR is purely an
// alternate input path on the player UI.
//
// Decode path:
//   1. Native BarcodeDetector if the browser exposes it (Chrome,
//      Edge, Safari 17+) — zero JS payload, fastest.
//   2. Vendored jsQR (~130 KB, ~40 KB gzipped) loaded lazily as a
//      fallback for Firefox / older iOS Safari. Loaded on first
//      tap so the cost only lands when the player actually uses the
//      feature.
// qrSupported is always true now — getUserMedia is the real gate
// (HTTPS + camera permission). The button is shown unconditionally;
// failures surface via the in-modal status line.
function qrSupported() {
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
}

// loadJsqr returns a promise resolving to the global jsQR function,
// loading the vendored script once and reusing it on subsequent
// calls. Resolves immediately if BarcodeDetector is available so
// callers don't pay the network cost for a fallback they never use.
let jsqrLoading = null;
function loadJsqr() {
  if (typeof window.jsQR === 'function') return Promise.resolve(window.jsQR);
  if (jsqrLoading) return jsqrLoading;
  jsqrLoading = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = '/assets/jsqr.js';
    s.async = true;
    s.onload = () => resolve(window.jsQR);
    s.onerror = () => { jsqrLoading = null; reject(new Error('jsqr load failed')); };
    document.head.append(s);
  });
  return jsqrLoading;
}

// createQrButton builds the small camera-icon button that lives next
// to the answer input. The submission flow is shared with the typed
// path — preview mode goes through handlePreviewSubmit, real play
// goes through wsSendOrQueue('answer', ...) — so a QR scan IS an
// immediate guess (no extra confirmation step).
function createQrButton(input, result) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'qr-btn';
  btn.setAttribute('aria-label', t('Scan QR code'));
  btn.title = t('Scan QR code');
  // Inline SVG so the icon scales with the button's font-size and
  // inherits currentColor (white on pink). Three corner finder
  // patterns + a few inner cells — the universal QR silhouette.
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    + '<rect x="3" y="3" width="5" height="5" rx="1"/>'
    + '<rect x="3" y="16" width="5" height="5" rx="1"/>'
    + '<rect x="16" y="3" width="5" height="5" rx="1"/>'
    + '<path d="M21 16h-3a2 2 0 0 0-2 2v3"/>'
    + '<path d="M21 21v.01"/>'
    + '<path d="M12 7v3a2 2 0 0 1-2 2H7"/>'
    + '<path d="M3 12h.01"/>'
    + '<path d="M12 3h.01"/>'
    + '<path d="M12 16v.01"/>'
    + '<path d="M16 12h1"/>'
    + '<path d="M21 12v.01"/>'
    + '<path d="M12 21v-1"/>'
    + '</svg>';
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    try {
      const decoded = await openQrScanner();
      if (!decoded) return; // user cancelled or camera failed
      // Mirror the typed path: feed the decoded value back through
      // the same submission as if the player had typed it. Do NOT
      // mutate input.value before the WS send — submitInputEl is
      // tracked elsewhere for offline-queue / countdown UI; setting
      // it here would interfere if the player had something half-
      // typed when they tapped Scan.
      if (previewState) {
        handlePreviewSubmit(decoded);
        return;
      }
      if (!wsSendOrQueue('answer', { answer: decoded })) {
        result.className = 'result muted';
        result.textContent = t('Offline — will send the moment you reconnect.');
      }
    } catch (err) {
      result.className = 'result err';
      result.textContent = t('Camera unavailable.');
    } finally {
      btn.disabled = false;
    }
  });
  return btn;
}

// openQrScanner builds a fullscreen modal showing the rear-camera
// feed and resolves with the first decoded QR value, or null if the
// user cancelled / the camera was denied. Two decode paths — native
// BarcodeDetector when the browser exposes it, jsQR (vendored) as
// a canvas-based fallback. Frame sampling runs via
// requestAnimationFrame so it pauses when the tab backgrounds.
function openQrScanner() {
  return new Promise((resolve) => {
    const modal = document.createElement('div');
    modal.className = 'qr-modal';
    const video = document.createElement('video');
    video.setAttribute('playsinline', '');
    video.muted = true;
    video.autoplay = true;
    const frame = document.createElement('div');
    frame.className = 'qr-frame';
    const status = document.createElement('p');
    status.className = 'qr-status';
    // aria-live="polite" so a screen-reader user hears "Camera
    // permission denied" / "Camera unavailable" when the async
    // getUserMedia path updates the message — without it the
    // failure is silent for non-sighted users.
    status.setAttribute('role', 'status');
    status.setAttribute('aria-live', 'polite');
    status.textContent = t('Point the camera at a QR code');
    const cancel = document.createElement('button');
    cancel.type = 'button';
    cancel.className = 'qr-cancel';
    cancel.textContent = t('Cancel');
    modal.append(video, frame, status, cancel);
    document.body.append(modal);
    // Dialog scaffolding — the modal IS the dialog (no nested panel).
    // Initial focus on Cancel since it's the only keyboard-actionable
    // control and keeps the user one Esc/Enter from dismissing.
    const undoModal = wireModal(modal, {
      label: t('QR scanner'),
      initialFocus: cancel,
    });

    let stream = null;
    let stopped = false;
    const cleanup = (value) => {
      if (stopped) return;
      stopped = true;
      if (stream) stream.getTracks().forEach((tk) => tk.stop());
      undoModal();
      document.removeEventListener('keydown', onKey);
      modal.remove();
      resolve(value);
    };
    cancel.addEventListener('click', () => cleanup(null));
    const onKey = (e) => { if (e.key === 'Escape') cleanup(null); };
    document.addEventListener('keydown', onKey);

    (async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
        });
        if (stopped) { stream.getTracks().forEach((tk) => tk.stop()); return; }
        video.srcObject = stream;
        await video.play().catch(() => { /* autoplay rejection is benign */ });
      } catch {
        status.textContent = t('Camera permission denied.');
        return;
      }
      // Pick a decode strategy. Native is preferred (cheaper); jsQR is
      // loaded on demand if it isn't available.
      const native = (typeof window.BarcodeDetector === 'function')
        ? new BarcodeDetector({ formats: ['qr_code'] }) : null;
      let jsqr = null;
      if (!native) {
        try { jsqr = await loadJsqr(); }
        catch { status.textContent = t('Camera unavailable.'); return; }
      }
      // jsQR needs a 2D canvas to inspect pixels; native reads the
      // <video> directly. Allocate the canvas only on the fallback
      // path so native scans don't pay the GC churn.
      const canvas = jsqr ? document.createElement('canvas') : null;
      const ctx = canvas ? canvas.getContext('2d', { willReadFrequently: true }) : null;
      const tick = async () => {
        if (stopped) return;
        if (video.readyState >= 2) {
          try {
            if (native) {
              const codes = await native.detect(video);
              if (codes && codes.length > 0) {
                cleanup(codes[0].rawValue || '');
                return;
              }
            } else if (jsqr && video.videoWidth > 0) {
              canvas.width = video.videoWidth;
              canvas.height = video.videoHeight;
              ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
              const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
              const code = jsqr(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
              if (code && code.data) {
                cleanup(code.data);
                return;
              }
            }
          } catch { /* per-frame failures are benign */ }
        }
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    })();
  });
}

// Debug helper bound to Alt+C — renders a summary card with made-up numbers

}
function hideSubmitDock() {
  const dock = document.getElementById('submit-dock');
  if (dock) dock.remove();
  document.documentElement.style.removeProperty('--dock-height');
}

// updateDockHeightVar measures the rendered dock and pushes its
// height into a CSS custom property. The body's bottom padding reads
// that property so a tall gated dock (button + GPS freshness + help
// block) doesn't bury images behind itself.
function updateDockHeightVar() {
  const dock = document.getElementById('submit-dock');
  if (!dock) return;
  const h = dock.getBoundingClientRect().height;
  if (h > 0) {
    document.documentElement.style.setProperty('--dock-height', Math.ceil(h) + 'px');
  }

// Multi-tab guard. Two browser tabs sharing the same slot cookie can
// race each other — both burn answer-attempt budget, both ping
// location, neither knows the other exists. We resolve it by claiming
// the slot in localStorage with a periodic heartbeat. A second tab
// detects the active claim, blocks itself, and tells the player to
// close one of the windows.
//
// We don't know the slot id from the cookie (HttpOnly), so the key
// hashes the URL path — which is "/play" for everyone, fine because a
// device only has one player session at a time. Coarser than per-slot
// but does the job.
const TAB_LOCK_KEY = 'zv_player_active_tab';
const TAB_LOCK_TIMEOUT_MS = 8000; // claim is stale after this long.
const TAB_LOCK_HEARTBEAT_MS = 3000;
const tabId = Math.random().toString(36).slice(2) + Date.now().toString(36);
let tabLockTimer = null;

function claimTabLock() {
  try {
    localStorage.setItem(TAB_LOCK_KEY, JSON.stringify({ id: tabId, ts: Date.now() }));
  } catch { /* localStorage may be disabled — fall through, no-op */ }
}

function tabLockHolder() {
  try {
    const raw = localStorage.getItem(TAB_LOCK_KEY);
    if (!raw) return null;
    const v = JSON.parse(raw);
    if (!v || typeof v.ts !== 'number') return null;
    if (Date.now() - v.ts > TAB_LOCK_TIMEOUT_MS) return null;
    return v;
  } catch { return null; }
}

function showTabConflict() {
  document.querySelectorAll('.tab-conflict').forEach((n) => n.remove());
  const overlay = el('div', { class: 'tab-conflict' },
    el('div', { class: 'panel' },
      el('h3', {}, t('Already open in another tab')),
      el('p', { class: 'muted' },
        t("This game is already running in another tab on this device. Close this one and continue there to keep your answers and location in sync.")),
      el('button', {
        on: { click: () => {
          // Force-claim from this tab — useful if the other tab
          // was closed without releasing cleanly.
          overlay.remove();
          startTabHeartbeat();
          bootstrapAfterClaim();
        } },
      }, t('Use this tab instead'))));
  document.body.append(overlay);
}

function startTabHeartbeat() {
  claimTabLock();
  if (tabLockTimer) clearInterval(tabLockTimer);
  tabLockTimer = setInterval(claimTabLock, TAB_LOCK_HEARTBEAT_MS);
  // Releasing on unload lets the *other* tab take over without waiting
  // out the staleness window.
  window.addEventListener('pagehide', () => {
    try {
      const cur = tabLockHolder();
      if (cur && cur.id === tabId) localStorage.removeItem(TAB_LOCK_KEY);
    } catch { /* ignore */ }
  }, { once: true });
}

// Bootstrap: a single HTTP probe decides auth (WebSocket upgrade failures
// can't be distinguished from network errors in the browser) and seeds the
// initial render. Afterwards the WebSocket takes over entirely.
//
// Preview mode (?preview=<slug>&page=<N>[&debug=1]) takes a different
// path — no slot session, no WebSocket, no GPS pings. An arranger
// reviews the puzzle rendered exactly as a player would see it.
async function bootstrap() {
  const qs = new URLSearchParams(location.search);
  if (qs.get('preview')) {
    await bootstrapPreview(qs.get('preview'), parseInt(qs.get('page') || '0', 10), qs.get('debug') === '1');
    return;
  }
  const holder = tabLockHolder();
  if (holder && holder.id !== tabId) {
    showTabConflict();
    return;
  }
  startTabHeartbeat();
  await bootstrapAfterClaim();
}

async function bootstrapAfterClaim() {
  const s = await api('/api/player/state');
  if (s.status === 401) { renderNoSession(); return; }
  if (s.status !== 200) {
    app.replaceChildren(el('p', { class: 'err' }, s.body?.error || t('error')));
    return;
  }
  if (s.body && s.body.server_now) {
    const sn = new Date(s.body.server_now).getTime();
    if (Number.isFinite(sn)) serverOffsetMs = sn - Date.now();
  }
  hadActiveSession = true;
  startGPS();
  render(s.body);
  connectWS();
  // Resume the WS when the tab comes back to the foreground after
  // having been hidden long enough for the reconnect path above to
  // park itself (wsReconnectTimer === null and ws.readyState !== 1).
  // No-op when the WS is already open.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    if (ws && ws.readyState === 1) return;
    if (wsReconnectTimer) return; // a deferred retry is already armed
    wsBackoff = 500; // foreground recovery: don't carry stale backoff
    connectWS();
  });
  // Fire-and-forget: register the service worker and ask it to
  // prefetch the team's adventure assets so they're cached for
  // offline play (dead spots, woods, patchy 4G). The SW handles
  // failures silently — a 403 on a reveal-gated hint asset just
  // means we'll re-fetch when the hint reveals.
  registerOfflineCache().catch(() => {});
}

// registerOfflineCache installs the player-side service worker and
// pushes the asset manifest for cache.addAll. Safe to call multiple
// times — subsequent registrations are no-ops in the browser. Bails
// silently when SWs aren't supported (older browsers, file://, etc.)
// so the play UX never depends on this succeeding.
async function registerOfflineCache() {
  if (!('serviceWorker' in navigator)) return;
  try {
    const reg = await navigator.serviceWorker.register('/play-sw.js', { scope: '/' });
    // Wait for the active SW so postMessage actually reaches a
    // controller. New registrations need an `activated` controller
    // before message-driven prefetch will do anything.
    if (!navigator.serviceWorker.controller) {
      await new Promise((resolve) => {
        const t = setTimeout(resolve, 2000);
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          clearTimeout(t); resolve();
        }, { once: true });
      });
    }
    const m = await api('/api/player/manifest');
    if (m.status !== 200 || !m.body?.urls) return;
    const sw = navigator.serviceWorker.controller || reg.active;
    // team_id partitions the SW's asset cache so a shared device
    // (kiosk, family iPad, sequential teams in the same browser)
    // can't serve Team A's prefetched bytes to Team B and bypass the
    // server-side canViewPageImage gate.
    if (sw) sw.postMessage({ type: 'prefetch', team_id: m.body.team_id, urls: m.body.urls });
  } catch (_) { /* offline already, or SW disallowed — ignore */ }
}

// loadPreviewAllLocations populates previewAllLocations for the given
// slug from the catalog detail endpoint. Cached — re-entrancy on the
// same slug skips the fetch. Failures leave the cache untouched, so
// the spoof map quietly falls back to the single-pin default rather
// than blocking the preview itself on a transient network blip.
async function loadPreviewAllLocations(slug) {
  if (previewAllLocations && previewAllLocations.slug === slug) return;
  try {
    const detail = await api(`/api/admin/adventures/${encodeURIComponent(slug)}`);
    if (detail.status !== 200 || !Array.isArray(detail.body?.pages)) return;
    previewAllLocations = {
      slug,
      pins: detail.body.pages
        .filter((p) => !p.disabled && p.location && typeof p.location.lat === 'number')
        .map((p, i) => ({
          lat: p.location.lat,
          lng: p.location.lng,
          gated: !!p.gated,
          radiusM: p.location.radius_m || 0,
          label: `${i + 1}. ${p.title || ''}`,
        })),
    };
  } catch (_) { /* leave cache as-is */ }
}

async function bootstrapPreview(slug, pageIdx, debug) {
  const qs = new URLSearchParams({ page: String(pageIdx) });
  if (debug) qs.set('debug', '1');
  // Fire the catalog-detail fetch in parallel with the preview
  // request so the all-puzzle pins are ready when the user opens
  // the spoof map. Awaited together below.
  const allLocsPromise = loadPreviewAllLocations(slug);
  const r = await api(`/api/admin/adventures/${encodeURIComponent(slug)}/preview?${qs}`);
  if (r.status === 401) {
    app.replaceChildren(el('p', { class: 'err' },
      t('Preview requires an arranger login. Open '),
      el('a', { href: '/arrange' }, '/arrange'), t(' first, then retry.')));
    return;
  }
  if (r.status !== 200) {
    app.replaceChildren(el('p', { class: 'err' }, r.body?.error || t('error {{status}}', { status: r.status })));
    return;
  }
  previewState = {
    // Authors get an accept list; buyers / share-holders get a
    // spoiler-free walkthrough where accept is omitted server-side.
    // The submit dock branches on spoilerFree to swap the typed
    // answer dock for a "Next puzzle" walkthrough — see
    // renderSubmitDock's spoiler-free guard.
    accept: Array.isArray(r.body.accept) ? r.body.accept : [],
    spoilerFree: !!r.body.spoiler_free,
    pageIndex: r.body.page_index ?? 0,
    pageCount: r.body.page_count ?? 0,
  };
  // Wait on the parallel fetch — best-effort, errors leave the cache
  // untouched and the spoof map degrades to single-pin mode.
  await allLocsPromise;
  render(r.body);
  renderPreviewChrome(r.body);
}

// renderPreviewChrome overlays a top ribbon with adventure-level
// navigation so the arranger can jump between puzzles, toggle the debug
// panel, and exit without hunting for tab close. Rebuilt on every
// render() so the "N of M" stays in sync with the fetched page.
function renderPreviewChrome(s) {
  document.getElementById('preview-chrome')?.remove();
  document.getElementById('preview-debug')?.remove();
  const qs = new URLSearchParams(location.search);
  const slug = qs.get('preview');
  const pageIdx = s.page_index ?? 0;
  const count = s.page_count ?? 0;
  const debug = qs.get('debug') === '1';
  const go = (patch) => {
    const next = new URLSearchParams(location.search);
    for (const [k, v] of Object.entries(patch)) {
      if (v === null) next.delete(k); else next.set(k, String(v));
    }
    location.search = '?' + next.toString();
  };
  const chrome = el('div', { id: 'preview-chrome', class: 'preview-chrome' },
    el('strong', {}, t('Preview')),
    el('span', { class: 'sep' }, '·'),
    el('span', {}, s.adventure_title || slug),
    el('span', { class: 'sep' }, '·'),
    el('span', {}, t('Puzzle {{i}}/{{n}}', { i: pageIdx + 1, n: count })),
    el('span', { style: 'flex:1' }),
    el('button', { class: 'chip', disabled: pageIdx <= 0 ? '' : null,
      on: { click: () => go({ page: pageIdx - 1 }) } }, t('◀ Prev')),
    el('button', { class: 'chip', disabled: pageIdx >= count - 1 ? '' : null,
      on: { click: () => go({ page: pageIdx + 1 }) } }, t('Next ▶')),
    el('button', { class: 'chip' + (debug ? ' on' : ''),
      on: { click: () => go({ debug: debug ? null : 1 }) } }, t('Debug')),
    el('button', { class: 'chip', on: { click: () => window.close() } }, t('Close')),
  );
  document.body.prepend(chrome);
  if (s.preview_debug) renderPreviewDebug(s.preview_debug, chrome);
}

// refreshPreviewSpoofUI re-runs render() + renderPreviewChrome with
// the most recent state snapshot so a spoof set/clear from the debug
// strip propagates everywhere that depends on it: the gated submit
// button's enabled state (updateGateLock), the freshness label, and
// the debug strip's own "Test position" cell. Used by the onPick /
// onClear / Clear handlers — they couldn't just call render() alone
// because the debug strip is owned by renderPreviewChrome.
function refreshPreviewSpoofUI() {
  if (!previewState || !lastState) return;
  lastRenderKey = null;
  render(lastState);
  renderPreviewChrome(lastState);
}

// renderPreviewDebug builds a single-row strip with the author-side
// fields (accepted answers, gate location, notes) that a player never
// sees, and inserts it directly after the preview-chrome ribbon so
// the two read as one paired arranger header. Long notes truncate
// with ellipsis (full text in the title attribute) so the strip stays
// a one-liner in the common case.
function renderPreviewDebug(d, anchor) {
  // Accepted answers as inline chips. Regex entries are flagged with a
  // `re:` prefix so a literal-looking answer like `(yes|ja)` doesn't
  // read as a string the player must type verbatim.
  const accept = d.accept || [];
  const acceptCell = el('span', { class: 'cell' },
    el('strong', {}, t('Accepted answers: ')));
  if (!accept.length) {
    acceptCell.append(el('span', { class: 'muted' }, t('(none)')));
  } else {
    accept.forEach((a, i) => {
      const text = (a && typeof a === 'object') ? (a.text || '') : String(a || '');
      const isRegex = !!(a && typeof a === 'object' && a.regex);
      acceptCell.append(el('code', {}, isRegex ? 're: ' + text : text));
      if (i < accept.length - 1) acceptCell.append(document.createTextNode(' '));
    });
  }
  const coords = `${d.lat.toFixed(5)}, ${d.lng.toFixed(5)}`;
  const isGated = !!d.radius_m;
  const locSuffix = isGated
    ? t(' · gate radius {{r}} m', { r: d.radius_m })
    : t(' · not gated');
  // Coord cell is a link-styled button that opens the same fullscreen
  // map overlay arrange.html uses for "Open map" — saves the arranger
  // from copy-pasting coords into a separate tool to confirm a gate
  // sits where they meant. For gated puzzles the map opens in pick
  // mode so the arranger can drop a "test position" the local gate
  // check honours, letting them verify the radius without travelling.
  const openMap = () => {
    // Build the pin list: the puzzle being previewed first (so it
    // sits on top in z-order via Leaflet's add-order rendering),
    // then every other puzzle in the adventure as outline / filled
    // markers. Equal-coord matches are dropped so the current pin
    // doesn't get a duplicate. previewAllLocations is populated by
    // bootstrapPreview's parallel catalog-detail fetch; if that
    // fetch failed we silently degrade to single-pin mode.
    const others = (previewAllLocations && previewAllLocations.slug
      && Array.isArray(previewAllLocations.pins))
      ? previewAllLocations.pins.filter((p) =>
          Math.abs(p.lat - d.lat) > 1e-7 || Math.abs(p.lng - d.lng) > 1e-7)
      : [];
    return openFullscreenMap({
      title: isGated ? t('Set test location') : t('Puzzle location'),
      pins: [
        {
          lat: d.lat,
          lng: d.lng,
          gated: isGated,
          radiusM: d.radius_m || 0,
          label: t('Current puzzle'),
        },
        ...others,
      ],
      pick: isGated ? {
      initial: previewSpoofedFix
        ? { lat: previewSpoofedFix.lat, lng: previewSpoofedFix.lng }
        : null,
      hint: t('Tap the map to drop a test position. Inside the circle counts as on-site.'),
      onPick: (loc) => {
        previewSpoofedFix = {
          lat: loc.lat,
          lng: loc.lng,
          accuracy: 0,
          ts: Date.now(),
        };
        refreshPreviewSpoofUI();
      },
      onClear: previewSpoofedFix ? () => {
        previewSpoofedFix = null;
        refreshPreviewSpoofUI();
      } : null,
    } : null,
    });
  };
  const locCell = el('button', {
    class: 'cell mono linklike',
    type: 'button',
    'aria-label': isGated
      ? t('Open the gate map and set a test location')
      : t('Open this puzzle\'s location on the map'),
    on: { click: openMap },
  }, t('Location: {{coords}}', { coords }) + locSuffix);
  const cells = [acceptCell, locCell];
  // Surface the current spoof inline so the arranger knows what
  // "I'm here" will evaluate against, with an explicit clear shortcut
  // — they're often iterating "inside the radius / outside the radius"
  // back-to-back to verify the gate.
  if (isGated && previewSpoofedFix) {
    const distM = haversineMeters(
      previewSpoofedFix.lat, previewSpoofedFix.lng, d.lat, d.lng);
    const inside = distM <= d.radius_m;
    const spoofCoords = `${previewSpoofedFix.lat.toFixed(5)}, ${previewSpoofedFix.lng.toFixed(5)}`;
    const cell = el('span', { class: 'cell' },
      el('strong', {}, t('Test position: ')),
      el('code', {}, spoofCoords),
      document.createTextNode(' '),
      el('span', { class: inside ? 'pill ok' : 'pill warn' },
        inside
          ? t('inside · {{d}} m', { d: Math.round(distM) })
          : t('outside · {{d}} m', { d: Math.round(distM) })),
      document.createTextNode(' '),
      el('button', {
        class: 'linklike',
        type: 'button',
        on: { click: () => {
          previewSpoofedFix = null;
          refreshPreviewSpoofUI();
        } },
      }, t('Clear')),
    );
    cells.push(cell);
  } else if (isGated) {
    // No spoof yet: a one-tap shortcut so the arranger doesn't have to
    // decode that the coord cell secretly opens in pick mode.
    cells.push(el('button', {
      class: 'cell linklike',
      type: 'button',
      on: { click: openMap },
    }, t('Set test location')));
  }
  if (d.notes) {
    cells.push(el('span', { class: 'cell notes muted', title: d.notes },
      t('Notes: ') + d.notes));
  }
  const panel = el('div', { id: 'preview-debug', class: 'preview-debug' }, ...cells);
  anchor.after(panel);
}

// ensureLeaflet pulls Leaflet's CSS + JS from unpkg the first time
// any caller asks for it, and returns a cached promise on subsequent
// calls so multiple open-map clicks don't duplicate-load. Lazy on
// purpose: 99% of play.html visits are real players who never need
// a map — we don't want to ship ~150 KB of mapping code to every
// phone just so the arranger preview can open a coord overlay.
let leafletReady = null;
function ensureLeaflet() {
  if (leafletReady) return leafletReady;
  leafletReady = new Promise((resolve, reject) => {
    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    css.integrity = 'sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=';
    css.crossOrigin = '';
    document.head.append(css);
    const js = document.createElement('script');
    js.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    js.integrity = 'sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=';
    js.crossOrigin = '';
    js.onload = () => resolve();
    js.onerror = () => reject(new Error('leaflet load failed'));
    document.head.append(js);
  });
  return leafletReady;
}

// openFullscreenMap drops a chromeless overlay with a Leaflet map
// covering the viewport. Mirrors arrange.html's same-named helper so
// the two surfaces feel identical when an arranger crosses between
// "edit puzzle" and "preview puzzle". Single pin centres at zoom 17;
// many pins auto-fit to bounds.
//
// opts: { title?, pins?, accent?, pick? }
//   pins[]: { lat, lng, label?, gated?, radiusM? }
//     gated:   fills the marker (matches the run-detail legend).
//     radiusM: draws a translucent gate circle around the pin.
//   pick: { initial?: {lat,lng}, hint?: string, onPick(loc), onClear? }
//     When set, clicking the map drops a draggable "test position"
//     marker and the chrome gains "Use this position" / "Clear" /
//     "Cancel" buttons. Used by the preview-debug GPS spoof so an
//     arranger can verify gated puzzles without travelling.
function openFullscreenMap(opts) {
  const { title, pins, accent, pick } = opts || {};
  const list = Array.isArray(pins) ? pins : [];
  let removed = false;
  let map = null;
  let pickMarker = null;
  let pickPos = pick && pick.initial
    ? { lat: pick.initial.lat, lng: pick.initial.lng }
    : null;
  const close = () => {
    if (removed) return;
    removed = true;
    document.removeEventListener('keydown', onKey);
    try { if (map) map.remove(); } catch { /* leaflet teardown is best-effort */ }
    back.remove();
  };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  const mapEl = el('div', { class: 'fsmap-host' });
  const chromeChildren = [
    el('div', { class: 'fsmap-title' }, title || ''),
  ];
  let useBtn = null;
  if (pick && typeof pick.onPick === 'function') {
    useBtn = el('button', {
      class: 'fsmap-use',
      type: 'button',
      disabled: pickPos ? null : true,
      on: { click: () => {
        if (!pickPos) return;
        try { pick.onPick({ lat: pickPos.lat, lng: pickPos.lng }); }
        finally { close(); }
      } },
    }, t('Use this position'));
    chromeChildren.push(useBtn);
    if (typeof pick.onClear === 'function') {
      chromeChildren.push(el('button', {
        class: 'fsmap-clear',
        type: 'button',
        on: { click: () => {
          try { pick.onClear(); }
          finally { close(); }
        } },
      }, t('Clear')));
    }
  }
  chromeChildren.push(el('button', {
    class: 'fsmap-close',
    type: 'button',
    'aria-label': t('Close'),
    on: { click: close },
  }, '×'));
  const back = el('div', {
    class: 'fsmap-back',
    role: 'dialog',
    'aria-modal': 'true',
    on: { click: (e) => { if (e.target === back) close(); } },
  },
    el('div', { class: 'fsmap-chrome' }, ...chromeChildren),
    mapEl,
  );
  if (pick && pick.hint) {
    back.append(el('div', { class: 'fsmap-hint' }, pick.hint));
  }
  document.body.append(back);
  document.addEventListener('keydown', onKey);
  // Loading placeholder for the first-call Leaflet fetch; subsequent
  // opens resolve synchronously from the cached promise so this
  // flashes too briefly to notice.
  mapEl.replaceChildren(el('div', { class: 'empty' },
    t('Loading map…')));
  ensureLeaflet().then(() => {
    if (removed) return;
    mapEl.replaceChildren();
    map = L.map(mapEl).setView([58.1820, 13.9554], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 19,
    }).addTo(map);
    const fillColour = accent ||
      getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() ||
      '#ad1357';
    const pts = [];
    for (const pin of list) {
      if (!pin || (!pin.lat && !pin.lng)) continue;
      const m = L.circleMarker([pin.lat, pin.lng], {
        radius: 9,
        color: fillColour,
        weight: 2,
        fillColor: pin.gated ? fillColour : 'transparent',
        fillOpacity: pin.gated ? 1 : 0,
      }).addTo(map);
      if (pin.label) m.bindTooltip(pin.label);
      if (pin.radiusM > 0) {
        L.circle([pin.lat, pin.lng], {
          radius: pin.radiusM,
          color: fillColour,
          weight: 1,
          fillOpacity: .12,
        }).addTo(map);
      }
      pts.push([pin.lat, pin.lng]);
    }
    if (pts.length === 1) {
      map.setView(pts[0], 17);
    } else if (pts.length > 1) {
      map.fitBounds(L.latLngBounds(pts), { padding: [40, 40] });
    }
    // Pick mode: click-to-place a draggable "test position" marker.
    // Distinct green so it can't be confused with the brand-accent
    // puzzle pins or the blue "you are here" marker. The Use button
    // in the chrome enables once a point is set; dragging updates it
    // in place without a fresh click.
    if (pick && typeof pick.onPick === 'function') {
      const pickColour = '#2e7d32';
      const placePickMarker = (latlng) => {
        if (pickMarker) {
          pickMarker.setLatLng(latlng);
        } else {
          pickMarker = L.circleMarker(latlng, {
            radius: 8,
            color: '#fff',
            weight: 2,
            fillColor: pickColour,
            fillOpacity: 1,
          }).addTo(map).bindTooltip(t('Test position'));
        }
        pickPos = { lat: latlng.lat, lng: latlng.lng };
        if (useBtn) useBtn.disabled = false;
      };
      if (pickPos) placePickMarker(L.latLng(pickPos.lat, pickPos.lng));
      map.on('click', (e) => placePickMarker(e.latlng));
    }
    // Drop a "you are here" marker if the browser hands one over.
    // Mirrors arrange.html's openFullscreenMap so the two surfaces
    // behave the same when an arranger crosses between editor and
    // preview. Distinct blue keeps it visually separable from the
    // brand-accent puzzle pins. Errors (denied, no sensor) are
    // silently swallowed; the map is still useful without it.
    if ('geolocation' in navigator) {
      navigator.geolocation.getCurrentPosition((pos) => {
        if (removed) return;
        const { latitude, longitude, accuracy } = pos.coords;
        L.circleMarker([latitude, longitude], {
          radius: 6,
          color: '#fff',
          weight: 2,
          fillColor: '#1976d2',
          fillOpacity: 1,
        }).addTo(map).bindTooltip(t('You are here'));
        if (accuracy && accuracy > 0) {
          L.circle([latitude, longitude], {
            radius: accuracy,
            color: '#1976d2',
            weight: 1,
            fillOpacity: .1,
          }).addTo(map);
        }
      }, () => { /* denied or no fix — silent */ },
        { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 });
    }
    // Leaflet measures its container at init; the overlay is freshly
    // mounted so the size is correct, but invalidateSize after the
    // browser commits the layout is the standard belt-and-braces call
    // for map-in-flex setups.
    setTimeout(() => { try { map.invalidateSize(); } catch { /* torn down */ } }, 30);
  }).catch(() => {
    if (removed) return;
    mapEl.replaceChildren(el('div', { class: 'empty' },
      t('Map library failed to load.')));
  });
}

// buildMenuButton returns the small hamburger button placed at the
// right of the runbar. Clicking it opens a slide-in drawer with
// adventure context, language picker, sign-out, "forget me", and the
// privacy / terms links. Replaces three previous floating affordances
// (lang-fab, more-fab, legal-footer) which all competed for the
// top-right corner and overlapped the puzzle content on narrow phones.
// openTeamShareSheet displays the public /team/{token} URL as a QR
// code (server-rendered PNG via /qr/team/{token}) plus a Copy button.
// Used to bring a teammate online whose magic link didn't reach them
// — they scan the QR, get the team page, pick their slot, play.
function openTeamShareSheet(token) {
  const url = location.origin + '/team/' + encodeURIComponent(token);
  const overlay = document.createElement('div');
  overlay.className = 'team-share';
  const panel = document.createElement('div');
  panel.className = 'panel';
  const xBtn = document.createElement('button');
  xBtn.type = 'button';
  xBtn.className = 'panel-close';
  xBtn.setAttribute('aria-label', t('Close'));
  xBtn.textContent = '×';
  const h = document.createElement('h3');
  h.textContent = t('Team join link');
  const hint = document.createElement('p');
  hint.className = 'hint';
  hint.textContent = t('Scan to join this team. Each teammate picks their own name on the page.');
  const qrWrap = document.createElement('div');
  qrWrap.className = 'qr';
  const img = document.createElement('img');
  img.src = '/qr/team/' + encodeURIComponent(token);
  img.alt = t('Team join QR code');
  qrWrap.append(img);
  const urlEl = document.createElement('p');
  urlEl.className = 'url';
  urlEl.textContent = url;
  const row = document.createElement('div');
  row.className = 'row';
  const copyBtn = document.createElement('button');
  copyBtn.type = 'button';
  copyBtn.className = 'secondary';
  copyBtn.textContent = t('Copy link');
  copyBtn.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(url); copyBtn.textContent = t('Copied'); }
    catch { /* clipboard refused — leave the URL on screen, user can long-press to copy */ }
  });
  const closeBtn = document.createElement('button');
  closeBtn.type = 'button';
  closeBtn.textContent = t('Close');
  const close = () => {
    overlay.remove();
    document.removeEventListener('keydown', onKey);
  };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  closeBtn.addEventListener('click', close);
  xBtn.addEventListener('click', close);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  document.addEventListener('keydown', onKey);
  row.append(copyBtn, closeBtn);
  panel.append(xBtn, h, hint, qrWrap, urlEl, row);
  overlay.append(panel);
  document.body.append(overlay);
}

function buildMenuButton(s) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'menu-btn';
  btn.setAttribute('aria-label', t('Menu'));
  btn.title = t('Menu');
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    + '<line x1="4" y1="6" x2="20" y2="6"/>'
    + '<line x1="4" y1="12" x2="20" y2="12"/>'
    + '<line x1="4" y1="18" x2="20" y2="18"/>'
    + '</svg>';
  btn.addEventListener('click', () => openMenuDrawer(s));
  return btn;
}

// openMenuDrawer mounts the slide-in side panel. The drawer is built
// fresh on each open so the language picker (rendered through
// zvI18n.makeLangPicker) reflects whichever language is currently
// active without us having to re-sync state.
function openMenuDrawer(s) {
  const drawer = document.createElement('div');
  drawer.className = 'menu-drawer';
  const panel = document.createElement('div');
  panel.className = 'menu-panel';

  const head = document.createElement('div');
  head.className = 'menu-head';
  const headText = document.createElement('div');
  headText.style.cssText = 'min-width:0; flex:1';
  if (s?.adventure_title) {
    const h = document.createElement('h2');
    h.className = 'menu-title';
    h.textContent = s.adventure_title;
    headText.append(h);
  } else {
    const h = document.createElement('h2');
    h.className = 'menu-title';
    h.textContent = 'Zonventure';
    headText.append(h);
  }
  if (s?.team_name) {
    const team = document.createElement('p');
    team.className = 'menu-team';
    team.textContent = s.team_name;
    headText.append(team);
  }
  const closeBtn = document.createElement('button');
  closeBtn.type = 'button';
  closeBtn.className = 'menu-close';
  closeBtn.setAttribute('aria-label', t('Close'));
  closeBtn.textContent = '×';
  head.append(headText, closeBtn);
  panel.append(head);

  // Language picker. The shared zvI18n helper renders a native <select>
  // with flag + name labels; styling here just gives it a comfortable
  // tap target inside the drawer row.
  const langSection = document.createElement('div');
  langSection.className = 'menu-section';
  const langLabel = document.createElement('p');
  langLabel.className = 'menu-section-label';
  langLabel.textContent = t('Language');
  const langPicker = zvI18n.makeLangPicker({ title: t('Language') });
  // Explicit color + color-scheme on the <select>: native form
  // controls don't inherit `color` reliably across browsers, and
  // without `color-scheme` the dropdown chrome ignores our --ink /
  // --surface vars and falls back to the OS default — which in light
  // mode against a dark theme picker rendered the option text
  // invisibly white-on-white.
  langPicker.style.cssText = 'width:100%; padding:.6rem .75rem; font:inherit; font-weight:600; border:1px solid var(--border-soft); border-radius:8px; background:var(--surface); color:var(--ink); color-scheme:light;';
  langSection.append(langLabel, langPicker);
  panel.append(langSection);

  // Team share — show a QR + URL of the public team page so a
  // teammate whose magic link didn't reach them can scan, pick
  // their slot, and join. Only rendered when we have the team's
  // share token (real session; preview mode skips it).
  if (s?.team_token) {
    const teamSection = document.createElement('div');
    teamSection.className = 'menu-section';
    const teamLabel = document.createElement('p');
    teamLabel.className = 'menu-section-label';
    teamLabel.textContent = t('Team');
    teamSection.append(teamLabel);
    const shareBtn = document.createElement('button');
    shareBtn.type = 'button';
    shareBtn.className = 'menu-row';
    shareBtn.append(document.createTextNode(t('Show team join link')));
    const shareSub = document.createElement('span');
    shareSub.className = 'menu-row-sub';
    shareSub.textContent = t('A QR code for this team\'s join page. A teammate without a magic link can scan it, pick their name, and start playing.');
    shareBtn.append(shareSub);
    shareBtn.addEventListener('click', () => { close(); openTeamShareSheet(s.team_token); });
    teamSection.append(shareBtn);

    // Player-driven team rename. Same prompt() pattern the slot
    // rename uses on the welcome screen — minimal UI surface and the
    // same "any member can do it" model. The server enforces the
    // UNIQUE(event_id, name) constraint; on conflict we surface
    // "name already used" inline rather than silently swallowing.
    const renameBtn = document.createElement('button');
    renameBtn.type = 'button';
    renameBtn.className = 'menu-row';
    renameBtn.append(document.createTextNode(t('Rename team')));
    const renameSub = document.createElement('span');
    renameSub.className = 'menu-row-sub';
    renameSub.textContent = t('Pick a name everyone on your team agrees on. Updates immediately for the arranger and your team-mates.');
    renameBtn.append(renameSub);
    renameBtn.addEventListener('click', async () => {
      const current = s.team_name || '';
      const next = (prompt(t('New team name:'), current) || '').trim();
      if (!next || next === current) return;
      const r = await api('/api/player/team/name', {
        method: 'POST', body: JSON.stringify({ name: next }),
      });
      if (r.status === 200 && r.body?.name) {
        s.team_name = r.body.name;
        // Re-open the drawer so the section heading + welcome card
        // both reflect the new name on next paint. Cheap; the panel
        // is rebuilt on every open anyway.
        close();
        openMenuDrawer(s);
      } else if (r.status === 409) {
        alert(t('That name is already taken in this event. Try another.'));
      } else {
        alert(r.body?.error || t('Could not rename — try again.'));
      }
    });
    teamSection.append(renameBtn);
    panel.append(teamSection);
  }

  // Privacy & feedback toggles — the player-side opt-out switches.
  // Both flip a localStorage flag and re-apply the corresponding
  // runtime state immediately (clear/restart the GPS watcher; mute
  // future cues). Persistence is per-device on purpose: a player
  // who wants quiet at one venue and sound at another shouldn't
  // sync that preference across team-mates.
  const privSection = document.createElement('div');
  privSection.className = 'menu-section';
  const privLabel = document.createElement('p');
  privLabel.className = 'menu-section-label';
  privLabel.textContent = t('Privacy & feedback');
  privSection.append(privLabel);

  const makeToggleRow = (label, sub, getter, onChange) => {
    const row = document.createElement('button');
    row.type = 'button';
    row.className = 'menu-row';
    const main = document.createElement('div');
    main.style.cssText = 'flex:1; min-width:0';
    const labelLine = document.createElement('div');
    labelLine.style.cssText = 'display:flex; align-items:center; justify-content:space-between; gap:.5rem';
    const labelText = document.createElement('span');
    labelText.textContent = label;
    const state = document.createElement('span');
    state.style.cssText = 'flex:0 0 auto; font-weight:700; font-size:.8rem; padding:.1rem .55rem; border-radius:999px; border:1px solid var(--border-soft);';
    const repaint = () => {
      const on = getter();
      state.textContent = on ? t('On') : t('Off');
      state.style.background = on ? 'var(--accent)' : 'var(--surface-2)';
      state.style.color       = on ? 'var(--accent-fg)' : 'var(--muted)';
    };
    repaint();
    labelLine.append(labelText, state);
    main.append(labelLine);
    if (sub) {
      const subEl = document.createElement('span');
      subEl.className = 'menu-row-sub';
      subEl.textContent = sub;
      main.append(subEl);
    }
    row.append(main);
    row.addEventListener('click', () => {
      onChange(!getter());
      repaint();
    });
    return row;
  };

  privSection.append(makeToggleRow(
    t('Share location'),
    t('Off pauses your GPS pings. Gated puzzles need this on to detect arrival.'),
    () => !prefLocationPaused(),
    (on) => applyLocationPause(!on),
  ));
  privSection.append(makeToggleRow(
    t('Sound & vibration'),
    t('Plays a short tone and pulse on a correct answer or a revealed hint.'),
    prefSoundEnabled,
    (on) => {
      setSoundEnabledPref(on);
      // Warm the audio context on the same gesture as the toggle so
      // the next correct-answer cue lands on a context that's
      // already running. Safari otherwise stays suspended until the
      // *next* user tap.
      if (on) audioCtx();
    },
  ));
  panel.append(privSection);

  // Account / event actions. "Forget me" is destructive (wipes
  // location history + answers + slot session) and stays behind a
  // confirm() because an accidental tap mid-event is catastrophic.
  const acctSection = document.createElement('div');
  acctSection.className = 'menu-section';
  const acctLabel = document.createElement('p');
  acctLabel.className = 'menu-section-label';
  acctLabel.textContent = t('Account');
  acctSection.append(acctLabel);

  const forget = document.createElement('button');
  forget.type = 'button';
  forget.className = 'menu-row danger';
  forget.append(document.createTextNode(t('Erase my play data')));
  const forgetSub = document.createElement('span');
  forgetSub.className = 'menu-row-sub';
  forgetSub.textContent = t('Permanently deletes your location pings and answer attempts from this event and revokes your link. Use at end of event or for privacy reasons.');
  forget.append(forgetSub);
  forget.addEventListener('click', async () => {
    close();
    if (!confirm(t('This wipes your location history and your answers from this event. Other team members keep playing. You\'ll be signed out and the link won\'t work again. Continue?'))) return;
    const r = await api('/api/player/forget', { method: 'POST' });
    if (r.status === 204) {
      location.href = '/play';
    } else {
      alert(r.body?.error || t('error {{status}}', { status: r.status }));
    }
  });
  acctSection.append(forget);
  panel.append(acctSection);

  // Legal footer — pinned to the bottom of the drawer instead of the
  // viewport, so it doesn't compete with the submit dock for the
  // safe-area space.
  const foot = document.createElement('div');
  foot.className = 'menu-foot';
  const aPriv = document.createElement('a');
  aPriv.href = '/privacy'; aPriv.target = '_blank'; aPriv.rel = 'noopener';
  aPriv.textContent = t('Privacy');
  const aTerms = document.createElement('a');
  aTerms.href = '/terms'; aTerms.target = '_blank'; aTerms.rel = 'noopener';
  aTerms.textContent = t('Terms');
  foot.append(aPriv, document.createTextNode(' · '), aTerms);
  panel.append(foot);

  drawer.append(panel);
  document.body.append(drawer);

  // Dialog scaffolding — focus moves to the close button on open
  // (predictable for screen-reader users; the drawer's content is
  // long and varies per state). Tab is trapped within the panel
  // until close().
  const undoModal = wireModal(panel, {
    labelledBy: '.menu-title',
    initialFocus: closeBtn,
  });

  let closed = false;
  function close() {
    if (closed) return;
    closed = true;
    drawer.classList.remove('open');
    setTimeout(() => drawer.remove(), 280);
    undoModal();
    document.removeEventListener('keydown', onKey);
  }
  function onKey(e) { if (e.key === 'Escape') close(); }
  drawer.addEventListener('click', (e) => { if (e.target === drawer) close(); });
  closeBtn.addEventListener('click', close);
  document.addEventListener('keydown', onKey);

  // Defer the .open toggle so the transition fires (the element needs
  // to render at translateX(100%) first, then transition to 0).
  requestAnimationFrame(() => drawer.classList.add('open'));
}

bootstrap();
</script>
</body>
</html>
