<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zonventure | Play</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aclonica&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="/i18n.js"></script>
<!-- Apply persisted theme synchronously so a saved-dark user doesn't
     see a light flash before the styles re-cascade. Mirrors arrange's
     initTheme but as an inline pre-script so it lands before any
     stylesheet renders. Same key (zv-theme) shared across the app. -->
<script>(function(){try{var v=localStorage.getItem('zv-theme');if(v==='light'||v==='dark')document.documentElement.setAttribute('data-theme',v);}catch(e){}})();</script>
<style>
  :root {
    color-scheme: light dark;
    --accent:        #ad1357;
    --accent-hover:  #951048;
    --accent-fg:     #ffffff;
    --accent-secondary: #ad1357; /* same as --accent by default; per-adventure brand overrides */
    --ink:           #1f3349;
    --success:       #429a3f;
    --danger:        #ff5252;
    --bg:            #fbfbfd;
    --surface:       #ffffff;
    --surface-2:     #f6f6f6;
    --border:        #c6d2e1;
    --border-soft:   #c6d2e166;
    --text:          var(--ink);
    /* Bumped from #6b7f96 to a darker shade so muted text still
       hits AA contrast under bright outdoor light, where glare
       effectively lifts the page background a step. */
    --muted:         #4f6478;
    --shadow:        0 1px 4px #00000014, 0 2px 8px #00000012;
    --radius:        12px;
    --radius-sm:     8px;
    --radius-pill:   32px;
    --space-1: .25rem;
    --space-2: .5rem;
    --space-3: .75rem;
    --space-4: 1rem;
    --space-5: 1.25rem;
    --space-6: 1.75rem;
    --ts-xs: .75rem;
    --ts-sm: .85rem;
    --ts-md: 1rem;
    --ts-lg: 1.15rem;
    /* 44 px (CSS) tap target — Apple HIG / WCAG 2.5.5. */
    --tap-target: 2.75rem;
    --font-body:     'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --font-brand:    'Aclonica', 'Vollkorn', Georgia, serif;
  }
  /* Theme tokens — same shape as arrange.html. Default (light)
     lives on :root above. An explicit override lands as
     data-theme="light"|"dark" on <html> (set by the menu toggle and
     persisted to localStorage). System dark preference applies only
     when the user hasn't set an explicit theme — so a player who
     wanted dark at home keeps it after stepping outside, and a
     player who wanted light keeps light even at night. */
  [data-theme="dark"] {
    --bg:          #14202e;
    --surface:     #1f3349;
    --surface-2:   #263d56;
    --border:      #3a5172;
    --border-soft: #3a517266;
    --text:        #e7ecf4;
    --ink:         #e7ecf4;
    --muted:       #9db1cc;
    --accent:      #e24080;
    --accent-hover:#ad1357;
    --success:     #7fd17b;
    --danger:      #ff7b7b;
    --shadow:      0 1px 4px #00000066, 0 2px 12px #00000077;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      --bg:          #14202e;
      --surface:     #1f3349;
      --surface-2:   #263d56;
      --border:      #3a5172;
      --border-soft: #3a517266;
      --text:        #e7ecf4;
      --ink:         #e7ecf4;
      --muted:       #9db1cc;
      --accent:      #e24080;
      --accent-hover:#ad1357;
      --success:     #7fd17b;
      --danger:      #ff7b7b;
      --shadow:      0 1px 4px #00000066, 0 2px 12px #00000077;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: var(--font-body);
    font-size: 16px; line-height: 1.5;
    color: var(--text); background: var(--bg);
    margin: 0;
    /* Bottom padding reserves space for the sticky submit dock + the
       device's safe-area inset (notched phones). --dock-height is
       updated from JS after every renderSubmitDock so a tall gated
       dock (button + GPS freshness + help block) doesn't bury image
       content behind itself. Falls back to 144px so a no-JS render
       still has a sane reserve. */
    padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom) + var(--dock-height, 144px));
    max-width: 640px; margin-left: auto; margin-right: auto;
    -webkit-font-smoothing: antialiased;
  }
  .puzzle-img {
    width: 100%; height: auto; display: block;
    border-radius: var(--radius);
    border: 1px solid var(--border-soft);
    margin: .5rem 0;
    box-shadow: var(--shadow);
  }
  /* Sticky submit bar: always at the bottom of the viewport, same place
     for every puzzle so the player builds muscle memory. */
  .submit-dock {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: .75rem 1rem calc(.75rem + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: blur(8px);
    border-top: 1px solid var(--border-soft);
    z-index: 10;
  }
  .submit-dock form {
    max-width: 640px; margin: 0 auto;
    display: grid; grid-template-columns: 1fr auto; gap: .5rem;
    align-items: stretch;
  }
  /* When the QR-scan button is present the form gets a third column.
     Order: [input] [submit] [scan]. Typed-answer pair on the left
     reads as one unit ("type then send"); the brand-pink scan
     button sits at the far right as the visibly-separate
     alternative path. */
  .submit-dock form.has-qr { grid-template-columns: 1fr auto auto; }
  .submit-dock input { margin: 0; }
  .submit-dock button { width: auto; padding: .75rem 1.2rem; }
  .submit-dock .qr-btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0 .85rem;
    border: 0;
    background: var(--accent);
    color: #fff;
    border-radius: .5rem;
    cursor: pointer;
  }
  .submit-dock .qr-btn:hover { opacity: .9; }
  .submit-dock .qr-btn svg { width: 1.4rem; height: 1.4rem; }
  .submit-dock .result { grid-column: 1 / -1; margin: 0; min-height: 1rem; font-size: .9rem; }

  /* Fullscreen QR scanner. Pulled in as an overlay so it can take
     over the viewport for the camera feed without disturbing the
     puzzle behind it. The viewfinder frame is purely decorative —
     BarcodeDetector reads the entire video, not a cropped region —
     but it gives the player a clear "point the QR here" target. */
  .qr-modal {
    position: fixed; inset: 0; z-index: 100;
    background: #000;
    display: flex; flex-direction: column;
    align-items: stretch; justify-content: center;
  }
  .qr-modal video {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .qr-modal .qr-frame {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .qr-modal .qr-frame::before {
    content: '';
    width: min(70vmin, 320px); height: min(70vmin, 320px);
    border: 3px solid rgba(255,255,255,.85);
    border-radius: 16px;
    box-shadow: 0 0 0 9999px rgba(0,0,0,.45);
  }
  .qr-modal .qr-status {
    position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 1rem);
    text-align: center; color: #fff;
    font-weight: 600; text-shadow: 0 2px 8px rgba(0,0,0,.6);
    padding: 0 1rem;
  }
  .qr-modal .qr-cancel {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom) + 1.25rem);
    padding: .75rem 1.5rem;
    background: rgba(255,255,255,.95); color: #111;
    border: 0; border-radius: 999px;
    font-weight: 700;
    cursor: pointer;
  }
  .qr-modal .qr-cancel:hover { background: #fff; }
  /* Solo-button layout for no-answer puzzles (Continue / I'm here).
     Stretch across the full viewport so the dock reads as a single
     CTA instead of a small centered pill — same max-width cap as the
     answer-form so it doesn't run edge-to-edge on a big display. */
  .submit-dock .dock-single {
    max-width: 640px; margin: 0 auto;
    display: flex; flex-direction: column; gap: .35rem;
  }
  .submit-dock .dock-single button {
    width: 100%; padding: .9rem 1.2rem;
  }
  .submit-dock .dock-single .result { margin: 0; min-height: 1rem; font-size: .9rem; }
  /* Compact top strip: adventure title + team + progress + status pill in
     one row. Leaves maximum vertical space for the puzzle itself. */
  /* Runbar = compact toolbar at the top of every play state. Holds
     only the persistent in-event signals: how far through the
     adventure the player is (progress) and the hint affordance.
     Adventure title + team name moved into the hamburger drawer
     because they're set-once context, not in-the-moment info — the
     player already knows what they joined and which team they're on. */
  .runbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: .75rem;
    padding: .5rem 0;
    margin-bottom: .75rem;
    border-bottom: 1px solid var(--border-soft);
    min-height: 2.75rem;
  }
  .runbar .progress {
    color: var(--ink); font-weight: 700;
    font-variant-numeric: tabular-nums;
    font-size: var(--ts-sm);
  }
  .runbar .progress.empty { color: var(--muted); font-weight: 400; }
  .runbar .actions {
    display: flex; align-items: center; gap: .5rem;
    margin-left: auto;
  }
  h2 { font-size: var(--ts-sm); margin: 1.2rem 0 .4rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  h3 { font-size: 1.05rem; margin: 0 0 .5rem; color: var(--accent-secondary); }
  input {
    font: inherit; width: 100%; padding: .75rem .9rem; margin-bottom: .8rem;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
  }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
  /* Universal :focus-visible ring so keyboard users can always see
     where focus is sitting. :focus-visible (not :focus) keeps the
     ring off mouse clicks but on Tab traversal — best-of-both. */
  :focus-visible {
    outline: 3px solid color-mix(in srgb, var(--accent) 50%, transparent);
    outline-offset: 2px;
  }
  button {
    font: inherit; font-weight: 700; width: 100%;
    /* Tap target ≥44 px; padding pushes the button height there
       even when the text is short. */
    min-height: var(--tap-target);
    padding: .75rem 1.2rem; cursor: pointer;
    background: var(--accent); color: var(--accent-fg);
    border: none; border-radius: var(--radius-pill);
    box-shadow: var(--shadow);
    transition: background 120ms, transform 80ms;
  }
  button:hover { background: var(--accent-hover); }
  button:active { transform: translateY(1px); }
  button.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  button.secondary:hover { background: var(--surface-2); }
  .card {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 1.25rem; margin: .75rem 0;
    box-shadow: var(--shadow);
  }
  .muted { color: var(--muted); }
  .err { color: var(--danger); font-weight: 600; }
  .ok  { color: var(--success); font-weight: 600; }
  /* .prompt holds server-rendered markdown. Goldmark emits <p>
     wrappers, <ul>, <a>, etc — style them once so every arranger's
     content picks up the same typography. */
  .prompt { font-size: 1.1rem; line-height: 1.55; color: var(--ink); }
  .prompt p, .intro-custom p, .outro-custom p { margin: 0 0 .75rem; }
  .prompt p:last-child, .intro-custom p:last-child, .outro-custom p:last-child { margin-bottom: 0; }
  .prompt ul, .prompt ol, .intro-custom ul, .intro-custom ol, .outro-custom ul, .outro-custom ol {
    padding-left: 1.25rem; margin: .35rem 0 .75rem;
  }
  .prompt li, .intro-custom li, .outro-custom li { margin: .2rem 0; }
  .prompt a, .intro-custom a, .outro-custom a, .hint-md a {
    color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px;
  }
  .prompt a:hover, .intro-custom a:hover, .outro-custom a:hover, .hint-md a:hover {
    text-decoration-thickness: 2px;
  }
  .prompt code, .intro-custom code, .outro-custom code, .hint-md code {
    background: var(--surface-2); border: 1px solid var(--border-soft);
    padding: .05em .35em; border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em;
  }
  .prompt strong, .intro-custom strong, .outro-custom strong { font-weight: 700; }
  .prompt em, .intro-custom em, .outro-custom em { font-style: italic; }
  /* GFM tables — authors use them for rule summaries or gear lists.
     Full-width on mobile so the columns get their share of a narrow
     viewport; thin borders match the surrounding card chrome. */
  .prompt table, .intro-custom table, .outro-custom table {
    width: 100%; border-collapse: collapse;
    margin: .5rem 0; font-size: .95rem;
  }
  .prompt th, .prompt td,
  .intro-custom th, .intro-custom td,
  .outro-custom th, .outro-custom td {
    border: 1px solid var(--border-soft);
    padding: .35rem .55rem; text-align: left;
  }
  .prompt th, .intro-custom th, .outro-custom th {
    background: var(--surface-2); font-weight: 700;
  }
  /* Hint label + inline markdown on the same line — goldmark wraps
     short spans in a single <p>, so the first <p>'s margin has to
     collapse to keep the label glued. */
  .hint-md { color: var(--muted); }
  .hint-md .hint-label { font-weight: 700; }
  .hint-md p { display: inline; margin: 0; }

  /* Hint toggle: small "?" pill in the runbar, top-right. Badge shows
     how many hints are ready to reveal but haven't been opened yet,
     so the player notices when new help becomes available. No
     countdown is rendered anywhere on the main view — the sheet
     handles details when they ask for them. */
  .runbar .hint-toggle {
    position: relative;
    width: auto; min-width: 0; padding: .2rem .55rem;
    margin-left: auto;
    background: var(--surface); color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px; box-shadow: none;
    font-weight: 800; font-size: var(--ts-sm); line-height: 1;
    cursor: pointer;
  }
  .runbar .hint-toggle:hover { color: var(--accent); border-color: var(--accent); }
  .hint-toggle-glyph {
    font-family: var(--font-brand);
    font-size: 1rem; letter-spacing: 0;
  }
  .hint-toggle-badge {
    display: none;
    position: absolute;
    top: -6px; right: -6px;
    min-width: 18px; height: 18px; padding: 0 5px;
    border-radius: 999px;
    background: var(--accent); color: var(--accent-fg);
    font-size: .65rem; font-weight: 800;
    display: inline-grid; place-items: center;
    line-height: 1;
  }
  .hint-toggle-badge:empty { display: none; }
  /* Slow looped pulse on the badge while a hint is ready and unread.
     Earlier this stopped after 2 cycles; that meant a player who
     looked away the moment the hint unlocked never noticed. The
     animation is gentle enough (5% scale, 3s cycle) that it's not
     distracting once you've seen it. */
  .hint-toggle-badge.ready { animation: hintBadgePulse 3s ease-in-out infinite; }
  @keyframes hintBadgePulse {
    0%,100% { transform: scale(1); }
    50%     { transform: scale(1.12); }
  }
  /* Honour Reduce Motion: a never-stopping pulse violates that
     setting unless we still it. Keep it visible (still drawing
     attention via colour + count) but stop the animation. */
  @media (prefers-reduced-motion: reduce) {
    .hint-toggle-badge.ready { animation: none; }
  }

  /* Hint sheet: modal overlay with the revealed hint(s) and a
     "Reveal next" action when one is ready. */
  .hint-sheet-back {
    position: fixed; inset: 0; z-index: 9800;
    background: rgba(10, 20, 35, .55);
    backdrop-filter: blur(4px);
    display: flex; align-items: flex-end; justify-content: center;
    padding: 1rem;
    animation: hintSheetFade .2s ease;
  }
  @keyframes hintSheetFade { from { opacity: 0; } to { opacity: 1; } }
  .hint-sheet {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    max-width: 520px; width: 100%;
    padding: 1.1rem 1.1rem calc(1.1rem + env(safe-area-inset-bottom));
    box-shadow: var(--shadow);
    animation: hintSheetRise .24s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes hintSheetRise {
    from { transform: translateY(30px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }
  .hint-sheet-head {
    display: flex; align-items: center; justify-content: space-between;
    margin: 0 0 .75rem;
  }
  .hint-sheet-head h3 {
    margin: 0;
    font-family: var(--font-brand);
    color: var(--accent-secondary);
    font-size: 1.25rem;
  }
  .hint-sheet-close {
    width: 32px; height: 32px; padding: 0;
    border: none; background: transparent;
    font-size: 1.4rem; line-height: 1;
    color: var(--muted); cursor: pointer;
    border-radius: 50%;
  }
  .hint-sheet-close:hover { background: var(--surface-2); color: var(--ink); }
  .hint-sheet-body { max-height: 60vh; overflow-y: auto; }
  .hint-revealed {
    background: var(--surface-2); border: 1px solid var(--border-soft);
    border-radius: 10px; padding: .65rem .85rem; margin-bottom: .5rem;
    color: var(--ink);
  }
  .hint-revealed:last-child { margin-bottom: 0; }
  .hint-revealed .hint-label {
    color: var(--muted); font-size: .7rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: .06em; margin-bottom: .25rem;
  }
  .hint-revealed .hint-body p { margin: 0 0 .4rem; }
  .hint-revealed .hint-body p:last-child { margin-bottom: 0; }
  .hint-revealed .hint-images {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: .4rem; margin-top: .55rem;
  }
  .hint-revealed .hint-images img {
    width: 100%; height: auto; border-radius: 8px;
    border: 1px solid var(--border-soft);
    background: var(--surface);
  }
  .hint-sheet-cta { width: 100%; margin-top: .75rem; }
  .hint-sheet-locked {
    margin: .75rem 0 0; padding: .6rem .85rem;
    border-radius: 8px; background: var(--surface-2);
    text-align: center; font-size: .9rem;
  }
  .pill {
    display: inline-block; padding: .15rem .65rem;
    border-radius: 999px; font-size: .7rem; font-weight: 700;
    background: color-mix(in srgb, var(--accent-secondary) 15%, transparent);
    color: var(--accent-secondary);
    text-transform: uppercase; letter-spacing: .06em;
  }
  .topline {
    display: flex; justify-content: space-between; align-items: baseline;
    padding-bottom: .75rem; margin-bottom: .75rem;
    border-bottom: 1px solid var(--border-soft);
  }
  .topline .who { color: var(--muted); font-size: .9rem; }
  .topline .who strong { color: var(--ink); font-weight: 700; }
  .inline-btn { display: inline-block; width: auto; padding: .35rem .85rem; font-size: .8rem; }

  /* ---------- Welcome overlay (first time in the adventure) ---------- */
  .welcome {
    position: fixed; inset: 0; z-index: 1500;
    display: grid; place-items: center;
    padding: 1rem;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(226,64,128,.18), transparent 55%),
      radial-gradient(ellipse at 100% 100%, rgba(66,154,63,.12), transparent 55%),
      var(--bg);
    animation: welcomeFade .3s ease;
  }
  @keyframes welcomeFade { from { opacity: 0; } to { opacity: 1; } }
  .welcome .panel {
    background: var(--surface); border: 1px solid var(--border-soft);
    border-radius: var(--radius); box-shadow: 0 12px 40px rgba(0,0,0,.25);
    max-width: 520px; width: 100%; padding: 1.5rem;
    position: relative;
  }
  .welcome .panel-close {
    position: absolute;
    top: .5rem; right: .5rem;
    width: 2rem; height: 2rem;
    background: transparent;
    border: 0;
    border-radius: 999px;
    padding: 0;
    font-size: 1.5rem;
    line-height: 1;
    color: var(--muted);
    cursor: pointer;
    box-shadow: none;
    min-height: 0;
  }
  .welcome .panel-close:hover { background: var(--surface-2); color: var(--ink); }
  .welcome h2 {
    font-family: var(--font-brand); color: var(--accent);
    font-size: 1.8rem; line-height: 1.1; margin: 0 0 .25rem;
    padding-right: 2rem;
  }
  .welcome .who { color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: var(--ts-xs); margin-bottom: 1rem; }
  .welcome .who-slot { color: var(--ink); }
  .welcome .who-rename {
    background: transparent; border: 0; padding: 0 .15rem;
    color: var(--accent); font: inherit; text-transform: none;
    letter-spacing: 0; cursor: pointer; text-decoration: underline;
  }
  .welcome ul { padding-left: 1.1rem; margin: 1rem 0; }
  .welcome li { margin: .35rem 0; }
  .welcome .cta { margin-top: 1rem; }
  /* Author-supplied welcome copy (markdown, server-rendered). */
  .welcome .intro-custom { line-height: 1.55; margin: .5rem 0 .25rem; }
  /* Completion-screen outro sits below the stats grid. Mildly
     emphasised so it reads as the author's sign-off, not debug text. */
  .summary .outro-custom {
    line-height: 1.55; margin-top: 1rem;
    color: var(--ink); font-size: .95rem;
  }
  .welcome .cta button[disabled] {
    background: var(--surface-2); color: var(--muted);
    cursor: not-allowed; box-shadow: none;
    font-variant-numeric: tabular-nums;
  }
  .welcome .cta button[disabled]:hover { background: var(--surface-2); }

  /* Pre-start card for the main view (shown once the welcome has been
     dismissed but the event still isn't running). Same countdown idea as
     the welcome button — players can't reach the first puzzle until the
     scheduled time; server enforces this too. */
  .prestart-card {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 2rem 1.25rem;
    margin: 1.5rem auto;
    text-align: center;
    max-width: 420px;
  }
  .prestart-card .banner {
    color: var(--muted); font-weight: 700;
    text-transform: uppercase; letter-spacing: .12em; font-size: .8rem;
    margin-bottom: .75rem;
  }
  .prestart-card .digits {
    font-family: var(--font-brand); color: var(--accent);
    font-size: clamp(2.4rem, 10vw, 3.6rem);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  /* When there's no scheduled time, "Ready" stands in for the
     countdown digits — same prominence, but in the muted/ink
     palette so the player reads it as a state label rather than a
     ticking clock. */
  .prestart-card .digits.soft {
    color: var(--text); font-size: clamp(1.6rem, 6vw, 2.4rem);
  }
  .prestart-card small {
    display: block; color: var(--muted); font-size: .8rem;
    margin-top: .6rem;
  }

  /* ---------- Completion stats ---------- */
  .summary {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 1.25rem; margin-top: 1rem;
  }
  .summary h2 {
    font-family: var(--font-brand); color: var(--accent);
    font-size: 1.6rem; line-height: 1.1; margin: 0 0 .25rem;
  }
  .summary .who { color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: var(--ts-xs); margin-bottom: .9rem; }
  .stats-grid {
    display: grid; grid-template-columns: repeat(2, minmax(0,1fr));
    gap: .5rem;
  }
  .stat {
    background: var(--surface-2);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm, 8px);
    padding: .8rem;
    text-align: center;
  }
  .stat .v { font-family: var(--font-brand); color: var(--ink); font-size: 1.4rem; line-height: 1; }
  .stat .l { color: var(--muted); font-size: var(--ts-xs); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; margin-top: .25rem; }

  /* ---------- Puzzle-correct celebration ---------- */
  .celebrate {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(10, 20, 35, .55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    overflow: hidden;
    animation: celebrateFade .25s ease;
  }
  .celebrate.gone { animation: celebrateFadeOut .4s ease forwards; }
  @keyframes celebrateFade    { from { opacity: 0; } to { opacity: 1; } }
  @keyframes celebrateFadeOut { from { opacity: 1; } to { opacity: 0; } }

  .celebrate .ring {
    width: 140px; height: 140px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #7fd17b, var(--success));
    display: grid; place-items: center;
    box-shadow: 0 10px 40px rgba(66,154,63,.45), inset 0 -6px 18px rgba(0,0,0,.18);
    transform: scale(0);
    animation: celebratePop .55s cubic-bezier(.2,1.6,.4,1) .05s forwards;
  }
  @keyframes celebratePop { to { transform: scale(1); } }

  .celebrate .check {
    width: 86px; height: 86px;
  }
  .celebrate .check path {
    fill: none; stroke: #fff; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 80; stroke-dashoffset: 80;
    animation: celebrateDraw .45s .35s ease-out forwards;
  }
  @keyframes celebrateDraw { to { stroke-dashoffset: 0; } }

  .celebrate .head {
    font-family: var(--font-brand);
    color: #fff; font-size: clamp(2rem, 7vw, 3rem);
    margin-top: 1.1rem; letter-spacing: .01em;
    opacity: 0; animation: celebrateRise .4s .55s ease forwards;
  }
  .celebrate .sub {
    color: rgba(255,255,255,.85); font-weight: 600;
    margin-top: .25rem; text-align: center;
    opacity: 0; animation: celebrateRise .4s .75s ease forwards;
  }
  @keyframes celebrateRise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Confetti: small rectangles that drop from above with a horizontal
     drift and a random rotation. Driven by CSS custom properties set
     per-particle from JS. */
  .celebrate .piece {
    position: absolute;
    top: -30px; width: 9px; height: 15px; border-radius: 2px;
    background: var(--c, #e24080);
    transform: translate(0, 0) rotate(0);
    animation: celebrateConfetti 2.2s var(--d, 0ms) cubic-bezier(.25,.75,.45,1) forwards;
    will-change: transform, opacity;
  }
  @keyframes celebrateConfetti {
    0%   { opacity: 0; transform: translate(0, -40px) rotate(0); }
    6%   { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--dx, 0), 110vh) rotate(var(--rot, 360deg)); }
  }

  /* ---------- Puzzle-wrong rebuff ----------
     Shorter and smaller than .celebrate — wrong answers come often, so
     the feedback is quick (~900ms total) and non-blocking (pointer-events
     stays off). Same structural idea: tinted backdrop + pop-in disc with
     a drawn mark, plus a brief horizontal shake to sell the "nope". */
  .rebuff {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(50, 10, 15, .35);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    pointer-events: none;
    animation: rebuffFade .15s ease;
  }
  .rebuff.gone { animation: rebuffFadeOut .25s ease forwards; }
  @keyframes rebuffFade    { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rebuffFadeOut { from { opacity: 1; } to { opacity: 0; } }

  .rebuff .disc {
    width: 110px; height: 110px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ff8787, var(--danger));
    display: grid; place-items: center;
    box-shadow: 0 10px 30px rgba(255,82,82,.45), inset 0 -5px 14px rgba(0,0,0,.18);
    transform: scale(0);
    animation:
      rebuffPop   .35s cubic-bezier(.2,1.6,.4,1) .03s forwards,
      rebuffShake .38s .38s cubic-bezier(.36,.07,.19,.97);
  }
  @keyframes rebuffPop { to { transform: scale(1); } }
  @keyframes rebuffShake {
    0%, 100% { translate: 0 0; }
    15%      { translate: -10px 0; }
    30%      { translate:  10px 0; }
    45%      { translate:  -7px 0; }
    60%      { translate:   7px 0; }
    75%      { translate:  -4px 0; }
    90%      { translate:   4px 0; }
  }

  .rebuff .cross {
    width: 64px; height: 64px;
  }
  .rebuff .cross path {
    fill: none; stroke: #fff; stroke-width: 10; stroke-linecap: round;
    stroke-dasharray: 70; stroke-dashoffset: 70;
    animation: rebuffDraw .22s .25s ease-out forwards;
  }
  @keyframes rebuffDraw { to { stroke-dashoffset: 0; } }

  .rebuff .head {
    font-family: var(--font-brand);
    color: #fff; font-size: clamp(1.4rem, 5vw, 2rem);
    margin-top: .9rem; letter-spacing: .01em;
    opacity: 0; animation: celebrateRise .3s .45s ease forwards;
  }
  /* Wrong-answer guidance subtitle. Lives below the head; smaller
     and softer so it reads as advice, not as the verdict itself. */
  .rebuff .sub {
    color: #fff; opacity: 0;
    font-size: var(--ts-sm); margin-top: .35rem;
    text-shadow: 0 1px 2px rgba(0,0,0,.45);
    animation: celebrateRise .3s .6s ease forwards;
  }

  /* ---------- Hamburger menu + drawer ----------
     Replaces the previous trio of floating buttons (lang picker,
     "more" popover, legal footer) with a single hamburger that
     opens a slide-in side panel. Keeps the play surface clean
     during a session — language, sign out, "forget me", and legal
     links all live one tap away instead of competing with the
     puzzle for attention. */
  .menu-btn {
    width: 2.5rem; height: 2.5rem;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent;
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    cursor: pointer;
    color: var(--ink);
    padding: 0;
    flex: 0 0 auto;
    box-shadow: none;
    min-height: 0;
  }
  .menu-btn:hover { background: var(--surface-2); }
  .menu-btn svg { width: 1.1rem; height: 1.1rem; }

  .menu-drawer {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,.4);
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease;
  }
  .menu-drawer.open { opacity: 1; pointer-events: auto; }
  .menu-panel {
    position: absolute; left: 0; top: 0; bottom: 0;
    width: min(86vw, 22rem);
    background: var(--surface);
    display: flex; flex-direction: column;
    transform: translateX(-100%);
    transition: transform .25s ease;
    overflow-y: auto;
    box-shadow: 4px 0 24px rgba(0,0,0,.12);
  }
  .menu-drawer.open .menu-panel { transform: translateX(0); }
  .menu-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(.85rem + env(safe-area-inset-top)) 1rem .85rem;
    border-bottom: 1px solid var(--border-soft);
  }
  .menu-head .menu-title {
    font-family: var(--font-brand); color: var(--accent-secondary);
    font-size: 1.05rem; line-height: 1.2;
    margin: 0; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .menu-head .menu-team {
    font-size: var(--ts-xs); color: var(--muted);
    margin: .15rem 0 0;
  }
  .menu-close {
    width: 2.25rem; height: 2.25rem;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: 0; color: var(--muted);
    cursor: pointer; padding: 0;
    box-shadow: none; min-height: 0;
    font-size: 1.4rem; line-height: 1;
  }
  .menu-close:hover { color: var(--ink); }
  .menu-section {
    padding: .75rem 1rem;
    border-bottom: 1px solid var(--border-soft);
  }
  .menu-section:last-of-type { border-bottom: 0; }
  .menu-section-label {
    font-size: var(--ts-xs); font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted);
    margin: 0 0 .5rem;
  }
  .menu-row {
    width: 100%;
    display: block;
    text-align: left;
    background: transparent;
    color: var(--ink);
    border: 0;
    border-radius: var(--radius-sm);
    padding: .65rem .5rem;
    font: inherit; font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    box-shadow: none;
    min-height: 0;
  }
  .menu-row:hover { background: var(--surface-2); }
  .menu-row.danger { color: #b03a3a; }
  .menu-row.danger:hover { background: rgba(220,70,70,.1); }
  .menu-row .menu-row-sub {
    display: block;
    margin-top: .15rem;
    font-size: var(--ts-xs); font-weight: 400;
    color: var(--muted);
    line-height: 1.35;
  }
  /* Team-share sheet — fullscreen overlay shown when a player taps
     "Show team join link". Renders the QR (server-side PNG) plus the
     URL text + a copy button so teammates can either scan or just
     read the URL aloud. Same modal shape as the QR scanner so the
     two affordances feel like a pair. */
  .team-share {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,.72);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 1.5rem;
    color: #fff;
  }
  .team-share .panel {
    background: var(--surface);
    color: var(--ink);
    border-radius: var(--radius);
    padding: 1.25rem;
    max-width: 22rem; width: 100%;
    text-align: center;
    box-shadow: var(--shadow);
    position: relative;
  }
  .team-share .panel-close {
    position: absolute;
    top: .5rem; right: .5rem;
    width: 2rem; height: 2rem;
    background: transparent;
    border: 0;
    border-radius: 999px;
    padding: 0;
    font-size: 1.5rem;
    line-height: 1;
    color: var(--muted);
    cursor: pointer;
    box-shadow: none;
    min-height: 0;
  }
  .team-share .panel-close:hover { background: var(--surface-2); color: var(--ink); }
  .team-share h3 {
    margin: 0 0 .25rem;
    font-family: var(--font-brand);
    color: var(--accent-secondary);
    font-size: 1.15rem;
  }
  .team-share .hint {
    color: var(--muted);
    font-size: .85rem;
    margin: 0 0 1rem;
  }
  .team-share .qr {
    background: #fff;
    padding: .75rem;
    border-radius: 12px;
    border: 1px solid var(--border-soft);
    display: inline-block;
    margin-bottom: 1rem;
  }
  .team-share .qr img {
    display: block;
    width: 200px; height: 200px;
    image-rendering: pixelated;
  }
  .team-share .url {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .85rem;
    background: var(--surface-2);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    padding: .5rem .65rem;
    margin: 0 0 .75rem;
    word-break: break-all;
    text-align: left;
    color: var(--ink);
  }
  .team-share .row {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: .5rem;
  }
  .team-share button {
    width: 100%;
    box-shadow: none;
  }
  .team-share button.secondary {
    background: var(--surface-2);
    color: var(--ink);
    border: 1px solid var(--border-soft);
  }
  .team-share button.secondary:hover { background: var(--surface); }

  /* Segmented control for the theme picker. Three equal columns:
     Light / Dark / Auto. Active button raises with surface tint and
     a soft shadow so the selection reads instantly without an extra
     icon. Plain native buttons inside a flat grid — no JS sync,
     no animation library. */
  .menu-seg {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: .25rem;
    background: var(--surface-2);
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    padding: .25rem;
  }
  .menu-seg-btn {
    background: transparent; border: 0;
    color: var(--muted);
    padding: .5rem .25rem;
    border-radius: 6px;
    font: inherit; font-weight: 600; font-size: .85rem;
    cursor: pointer;
    min-height: 0;
    box-shadow: none;
    width: 100%;
  }
  .menu-seg-btn:hover { color: var(--ink); }
  .menu-seg-btn.active {
    background: var(--surface);
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(0,0,0,.08);
  }
  .menu-foot {
    margin-top: auto;
    padding: 1rem;
    padding-bottom: calc(1rem + env(safe-area-inset-bottom));
    color: var(--muted);
    font-size: var(--ts-xs);
    display: flex; gap: .75rem; justify-content: center;
  }
  .menu-foot a { color: inherit; text-decoration: underline; }

  /* ---------- Preview mode ----------
     Slim sticky ribbon for arrangers QA-ing an adventure. The chips
     defeat the global 44 px tap-target on <button>: this surface is
     desktop/admin-side, so a tighter chip keeps the strip a thin
     one-row band that doesn't crowd the puzzle below. */
  .preview-chrome {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: .35rem; flex-wrap: wrap;
    padding: .3rem .55rem;
    margin: 0 0 .35rem;
    background: color-mix(in srgb, var(--accent) 18%, var(--surface));
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    font-size: var(--ts-xs);
  }
  .preview-chrome .sep { color: var(--muted); }
  .preview-chrome .chip {
    font: inherit; font-weight: 600; font-size: var(--ts-xs);
    padding: .15rem .55rem; border-radius: 999px;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--border-soft);
    cursor: pointer; width: auto; box-shadow: none;
    min-height: 0;
  }
  .preview-chrome .chip:hover:not(:disabled) { background: var(--surface-2); }
  .preview-chrome .chip.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .preview-chrome .chip:disabled { opacity: .4; cursor: default; }
  /* Slim single-row debug strip: dense list of author-side fields
     (accepted answers, gate, notes) shown only in `?debug=1` preview.
     Sits directly under the preview-chrome at body level so the two
     read as a paired arranger ribbon rather than two disconnected
     bands. Wraps to multiple lines if a field overflows, but the
     common case fits on one row so the puzzle stays the focus. */
  .preview-debug {
    display: flex; flex-wrap: wrap; align-items: baseline;
    gap: .25rem .9rem;
    padding: .3rem .65rem;
    margin: 0 0 .5rem;
    border-radius: var(--radius-sm);
    border-left: 3px solid var(--accent);
    background: color-mix(in srgb, var(--accent) 4%, var(--surface));
    font-size: var(--ts-xs); line-height: 1.5;
  }
  .preview-debug .cell {
    display: inline-flex; align-items: baseline; gap: .3rem;
    min-width: 0;
  }
  .preview-debug code {
    background: var(--surface-2);
    padding: .05rem .35rem; border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: .95em;
  }
  .preview-debug .mono {
    font-family: ui-monospace, SFMono-Regular, monospace;
  }
  .preview-debug .notes {
    max-width: 36ch;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* Inline link-styled <button> for the coord cell: neutralises the
     global accent-pill button rule so the click target reads as a
     link inside the strip rather than a chunky pink CTA. */
  .preview-debug button.linklike {
    font: inherit; font-size: inherit;
    background: transparent; color: inherit;
    border: 0; padding: 0; margin: 0;
    cursor: pointer; box-shadow: none; min-height: 0; width: auto;
    text-decoration: underline; text-decoration-thickness: 1px;
    text-underline-offset: 2px;
  }
  .preview-debug button.linklike:hover {
    background: transparent; color: var(--accent);
  }

  /* Fullscreen map overlay — opened from the debug-strip coord link
     in preview mode. Mirrors arrange.html's .fsmap-* shape so the two
     surfaces feel identical; Leaflet loads on demand the first time
     this overlay opens (see ensureLeaflet) so players never pay the
     download cost. */
  .fsmap-back {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: flex; flex-direction: column;
    z-index: 2000;
  }
  .fsmap-chrome {
    display: flex; align-items: center; gap: .75rem;
    padding: .5rem .75rem;
    background: var(--surface);
    border-bottom: 1px solid var(--border-soft);
    flex: 0 0 auto;
  }
  .fsmap-title {
    flex: 1 1 auto; min-width: 0;
    font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .fsmap-close {
    width: 2rem; height: 2rem;
    background: transparent; border: 0; border-radius: 999px;
    padding: 0; font-size: 1.5rem; line-height: 1;
    color: var(--muted); cursor: pointer; box-shadow: none;
    min-height: 0; flex: 0 0 auto;
  }
  .fsmap-close:hover { background: var(--surface-2); color: var(--ink); }
  /* min-height:0 lets the flex child shrink so Leaflet sees a definite
     height — without it the map refuses to render below the chrome. */
  .fsmap-host { flex: 1 1 auto; min-height: 0; }
  .fsmap-host .empty {
    padding: 2rem; text-align: center; color: var(--muted);
  }

  /* ---------- Connection status banner ----------
     Shown when the WebSocket has been disconnected for >2s. Sits above
     the submit dock so it's visible while playing without covering the
     puzzle content. Two shades: warn (reconnecting) and err (gave up).
     The banner is mounted once on body and toggled via class. */
  .ws-status {
    position: fixed;
    left: 0; right: 0;
    top: env(safe-area-inset-top);
    z-index: 4000;
    padding: .35rem .75rem;
    text-align: center;
    font-size: .8rem; font-weight: 700;
    letter-spacing: .04em;
    background: var(--surface);
    color: var(--ink);
    border-bottom: 1px solid var(--border-soft);
    transform: translateY(-100%);
    transition: transform 180ms ease;
    pointer-events: none;
  }
  .ws-status.show { transform: translateY(0); }
  .ws-status.warn {
    background: color-mix(in srgb, #f0a000 20%, var(--surface));
    color: #6b4500;
  }
  .ws-status.err {
    background: color-mix(in srgb, var(--danger) 22%, var(--surface));
    color: var(--danger);
  }
  /* Multi-tab takeover banner: a full-screen interstitial shown when a
     second tab notices the slot is already active in another tab. */
  .tab-conflict {
    position: fixed; inset: 0; z-index: 5000;
    background: var(--bg);
    display: grid; place-items: center;
    padding: 1.5rem;
  }
  .tab-conflict .panel {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 1.25rem;
    max-width: 420px; width: 100%;
    text-align: center;
  }
  .tab-conflict h3 { margin: 0 0 .5rem; }

  /* Accessibility utilities (mirrored from arrange.html). */
  .visually-hidden {
    position: absolute !important;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  .skip-link {
    position: fixed;
    top: -40px; left: var(--space-2);
    z-index: 10000;
    padding: var(--space-2) var(--space-4);
    background: var(--accent); color: var(--accent-fg);
    border-radius: var(--radius-sm);
    font-weight: 700; text-decoration: none;
    transition: top 120ms ease;
    min-height: 0;
    width: auto;
    box-shadow: var(--shadow);
  }
  .skip-link:focus, .skip-link:focus-visible { top: var(--space-2); }

  /* GPS recovery surface inside the gated submit dock: short copy on
     why GPS isn't working + a Retry button. Hidden until the
     watchPosition error callback supplies a message; renderGpsHelp()
     paints it in place so the dock can grow without forcing a full
     re-render. */
  .gps-help { padding: 0 .25rem; }
  .gps-help p {
    color: var(--muted); font-size: var(--ts-sm);
    margin: .4rem 0; line-height: 1.45;
  }
  .gps-help button.secondary { margin-top: .15rem; }
  /* Geolocation consent preamble — a fixed-position card shown the
     first time we'd ask the browser for GPS, so the player sees the
     explanation before the system permission prompt fires. */
  .geo-consent-back {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, .35);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 100;
    padding: 1rem;
  }
  .geo-consent-card {
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 1.25rem;
    max-width: 28rem; width: 100%;
    margin-bottom: env(safe-area-inset-bottom);
  }

  .geo-consent-card ul { margin: .4rem 0 .6rem 1.2rem; font-size: var(--ts-sm); }

<body>
<a class="skip-link" href="#app">Skip to main content</a>
<main id="app" data-initial-loading tabindex="-1" aria-label="Player view">loading…</main>

<script>
const app = document.getElementById('app');
// Localise the baked-in loading placeholder now that t() is available.
if (app.hasAttribute('data-initial-loading')) app.textContent = t('loading…');
let gpsWatchID = null;
let pingTimer = null;
let lastFix = null;
// When the browser refuses geolocation (denied permission, kill switch,
// no sensor available), watchPosition's error callback tells us why —
// we stash the message so the gate card can say "GPS denied" instead
// of hanging on "waiting for a fix" forever.
let gpsError = null;
// A shallow fingerprint of the last rendered state. If the state hasn't
// changed between pushes we skip the re-render so the submit dock's input
// keeps its value and focus.
let lastRenderKey = null;

// WebSocket to the server. The server pushes {kind:"state"} frames when
// anything in this event changes; we push {kind:"location"} and
// {kind:"answer"} frames back. Reconnects with exponential backoff so a
// dropped wifi / cellular handover heals itself without user action.
let ws = null;
let wsBackoff = 500;
let wsReconnectTimer = null;
let submitResultEl = null;
let submitInputEl = null;
// previewState is non-null while the page is running in preview mode:
// no WebSocket, no slot session — just a snapshot of one puzzle. The
// submit dock switches to local answer matching when `accept` is set
// (only present when ?debug=1 so the page has the answers).
let previewState = null;
// advanceMode tracks how the most recent "advance" WS message should
// be handled when the server replies. Set by the Continue / Check-
// location CTAs; the answer_result and answer_error listeners read it
// and reset it to 'none'.
//   'none'   — normal answer flow; animations play on result.
//   'silent' — plain no-answer continue; animations suppressed.
//   'gated'  — no-answer gated puzzle; celebrate on pass, rebuff on 403.
let advanceMode = 'none';
// Server clock offset, learned from the first state push that carries
// server_now. The pre-event countdown applies this to Date.now() so a
// phone with a skewed system clock doesn't tick to 0:00 prematurely.
let serverOffsetMs = 0;
// Once we receive at least one state push we treat any later WS close
// as "session expired" rather than "no session yet" — distinct screens.
let hadActiveSession = false;

/* ========== Player preferences (per-device, localStorage-backed) ==========
 *
 * Two opt-out switches surfaced in the hamburger drawer:
 *
 *   zv-loc-paused  — when '1', the GPS watcher and ping timer are
 *                    stopped. The player can re-enable from the menu;
 *                    we don't re-prompt the browser since we never
 *                    revoked its permission, only stopped using it.
 *                    Default off — the gate-detect flow assumes
 *                    location is on, but GDPR requires we let the
 *                    player turn it off mid-event.
 *
 *   zv-sound       — when '0', cue tones + haptic vibrate are
 *                    suppressed on correct-answer and hint-reveal.
 *                    Default on — silent UX reads as broken on a
 *                    phone, and people in quiet contexts are exactly
 *                    who'd reach for the toggle anyway.
 *
 * try/catch wraps every localStorage read/write because Safari in
 * private mode throws on setItem; we'd rather fall back to the
 * default than panic the page.
 */
function prefLocationPaused() {
  try { return localStorage.getItem('zv-loc-paused') === '1'; } catch { return false; }
}
function setLocationPausedPref(v) {
  try { localStorage.setItem('zv-loc-paused', v ? '1' : '0'); } catch {}
}
function prefSoundEnabled() {
  try { return localStorage.getItem('zv-sound') !== '0'; } catch { return true; }
}
function setSoundEnabledPref(v) {
  try { localStorage.setItem('zv-sound', v ? '1' : '0'); } catch {}
}

// Lazily-constructed AudioContext shared by every cue. Browsers
// require a user-gesture-induced resume() before the first audible
// frame; we call resume() on every fetch so a context that started
// suspended (Safari) lights up the moment the player taps anything.
let zvAudioCtx = null;
function audioCtx() {
  const Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) return null;
  if (!zvAudioCtx) zvAudioCtx = new Ctor();
  if (zvAudioCtx.state === 'suspended') {
    try { zvAudioCtx.resume(); } catch { /* ignore — next gesture */ }
  }
  return zvAudioCtx;
}
function playTone(freq, durationMs, peak) {
  const ctx = audioCtx();
  if (!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  // 10ms attack + exponential decay so the tone lands cleanly without
  // a click (instant gain ramp from 0 produces an audible pop).
  const now = ctx.currentTime;
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(peak, now + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + durationMs / 1000);
  osc.connect(gain).connect(ctx.destination);
  osc.start(now);
  osc.stop(now + durationMs / 1000 + 0.05);
}
function playCorrectCue() {
  if (!prefSoundEnabled()) return;
  // Two-tone perfect fifth — short fanfare, lands as "right" rather
  // than "ding" without leaning on a sample asset.
  playTone(660, 140, 0.16);
  setTimeout(() => playTone(990, 200, 0.16), 110);
  if (navigator.vibrate) {
    try { navigator.vibrate(60); } catch { /* unsupported on iOS */ }
  }
}
function playHintCue() {
  if (!prefSoundEnabled()) return;
  // Single soft tone — the hint reveal is a smaller event than a
  // correct answer, so the cue is shorter and quieter.
  playTone(620, 90, 0.12);
  if (navigator.vibrate) {
    try { navigator.vibrate(20); } catch { /* unsupported on iOS */ }
  }
}
// The most recent rate-limit-or-gate error from the server. Used by the
// answer_error path to render a countdown / distinct copy and re-enable
// the input when the cooldown ends.
let answerErrorTimer = null;

// api is kept only for the one-shot auth probe at page load — every
// subsequent state change rides the WebSocket.
function csrfToken() {
  const m = document.cookie.match(/(?:^|;\s*)zv_csrf=([^;]+)/);
  return m ? decodeURIComponent(m[1]) : '';
}
async function api(path, opts = {}) {
  const headers = { ...(opts.body ? { 'Content-Type': 'application/json' } : {}), ...(opts.headers || {}) };
  const method = (opts.method || 'GET').toUpperCase();
  if (method !== 'GET' && method !== 'HEAD' && method !== 'OPTIONS') {

  }

    credentials: 'same-origin',
    ...opts,
    headers,

function wsSend(kind, data) {
  if (!ws || ws.readyState !== 1) return false;
  try { ws.send(JSON.stringify({ kind, data })); return true; }
  catch { return false; }
}

// Outgoing offline queue. Without this an answer typed during a
// reconnect window is silently dropped — the player has no way to
// know whether the server saw it. We FIFO answer/advance frames (cap
// at 5 — players spamming during dead air shouldn't prefill the
// limiter), and dedupe locations to "the last fix" since older pings
// are stale once we reconnect.
const pendingAnswers = [];
const PENDING_ANSWERS_MAX = 5;
let pendingLocation = null;

// Did we lose the WS while typing? Tracked so the "saved while you
// were offline" toast only fires when the user actually queued
// something — a clean reconnect with no traffic stays silent.
let didQueueWhileOffline = false;

function wsSendOrQueue(kind, data) {
  if (ws && ws.readyState === 1) {
    return wsSend(kind, data);
  }
  if (kind === 'answer' || kind === 'advance') {
    if (pendingAnswers.length < PENDING_ANSWERS_MAX) {
      pendingAnswers.push({ kind, data });
      didQueueWhileOffline = true;
    }
    return false;
  }
  if (kind === 'location') {
    pendingLocation = data;
    return false;
  }
  return false;
}

function flushPending() {
  if (!ws || ws.readyState !== 1) return;
  const announce = didQueueWhileOffline;
  didQueueWhileOffline = false;
  while (pendingAnswers.length > 0) {
    const m = pendingAnswers.shift();
    if (!wsSend(m.kind, m.data)) {
      // Re-queue and bail — we'll try again on the next onopen.
      pendingAnswers.unshift(m);
      didQueueWhileOffline = true;
      return;
    }
  }
  if (pendingLocation) {
    if (wsSend('location', pendingLocation)) pendingLocation = null;
  }
  if (announce && submitResultEl) {
    submitResultEl.className = 'result muted';
    submitResultEl.textContent = t('Reconnected — your last answer was sent.');
    setTimeout(() => {
      if (submitResultEl && submitResultEl.textContent === t('Reconnected — your last answer was sent.')) {
        submitResultEl.textContent = '';
      }
    }, 4000);
  }
}

// setWSStatus toggles the top-of-screen connection banner. Idempotent —
// safe to call from open / close / timeout paths without double work.
//   ''     — hide the banner.
//   'warn' — "Reconnecting…" while the WS is still backing off.
//   'err'  — "Disconnected" once we've been offline long enough that
//            the player likely needs to know.
let wsStatusEl = null;
let wsStatusTimer = null;
function setWSStatus(level, text) {
  if (!wsStatusEl) {
    wsStatusEl = document.createElement('div');
    wsStatusEl.className = 'ws-status';
    wsStatusEl.setAttribute('role', 'status');
    wsStatusEl.setAttribute('aria-live', 'polite');
    document.body.append(wsStatusEl);
  }
  wsStatusEl.classList.remove('warn', 'err', 'show');
  if (!level) return;
  wsStatusEl.classList.add(level, 'show');
  wsStatusEl.textContent = text;
}

function connectWS() {
  if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = null; }
  if (wsStatusTimer)    { clearTimeout(wsStatusTimer);    wsStatusTimer    = null; }
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws/play`);
  ws.onopen = () => {
    wsBackoff = 500;
    setWSStatus('', '');
    // Replay anything we queued while the socket was down. Order: any
    // queued answers first (player intent), then the latest location
    // fix so the gate check can fire fresh.
    flushPending();
  };
  ws.onmessage = (ev) => {
    let msg; try { msg = JSON.parse(ev.data); } catch { return; }
    if (!msg || !msg.kind) return;
    if (msg.kind === 'state') {
      hadActiveSession = true;
      // Anchor the server clock offset on every state push so a long
      // pause / drift doesn't accumulate. msg.data.server_now is an
      // RFC3339 string emitted by the server.
      if (msg.data && msg.data.server_now) {
        const sn = new Date(msg.data.server_now).getTime();
        if (Number.isFinite(sn)) serverOffsetMs = sn - Date.now();
      }
      startGPS();
      render(msg.data);
    } else if (msg.kind === 'answer_result') {
      onAnswerResult(msg.data);
    } else if (msg.kind === 'answer_error') {
      handleAnswerError(msg.data || {});
    } else if (msg.kind === 'removed') {
      // Arranger deleted this team mid-event. Stop polling, kill the
      // submit dock, and render an explanatory card so the player
      // doesn't loop on a generic "open your magic link" prompt.
      if (gpsWatchID !== null && navigator.geolocation) {
        try { navigator.geolocation.clearWatch(gpsWatchID); } catch { /* ignore */ }

      }

      hideSubmitDock();
      try { ws.close(); } catch { /* ignore */ }
      app.replaceChildren(buildTeamRemovedCard());

  };

    // 1008 = auth: either we never had a session, or it just expired.
    // The two cases want different copy on the empty screen.
    if (ev.code === 1008) {
      setWSStatus('', '');
      renderNoSession({ expired: hadActiveSession });
      return;
    }
    const delay = Math.min(wsBackoff, 10000);
    wsBackoff = Math.min(wsBackoff * 2, 10000);
    wsReconnectTimer = setTimeout(connectWS, delay);

    // outage doesn't leave the player staring at a stale screen.
    if (wsStatusTimer) clearTimeout(wsStatusTimer);
    wsStatusTimer = setTimeout(() => {
      setWSStatus('warn', t('Reconnecting…'));
      wsStatusTimer = setTimeout(() => {
        setWSStatus('err', t('Disconnected — check your connection.'));
      }, 13000);
    }, 2000);
  };
  ws.onerror = () => { /* handled by onclose */ };
}

// handleAnswerError routes the WS answer_error frame onto the right UI.
// Three shapes worth distinguishing:
//   - 429 with retry_after_secs → too many attempts; show countdown,
//     disable submit/continue until cooldown elapses.
//   - 403 (gate not reached) → play the "rebuff" cue (gated mode only)
//     plus a distinct "Move closer" line, since the answer wasn't
//     wrong, the player just isn't there yet.
//   - everything else → plain error text in the result line.
function handleAnswerError(d) {
  const status = d.status || 0;
  const retry  = Number(d.retry_after_secs) || 0;
  if (answerErrorTimer) { clearInterval(answerErrorTimer); answerErrorTimer = null; }
  // Cancel the gated-advance flag *before* deciding whether to rebuff
  // — only the gated path wants the visual cue on a 403.
  const wasGated = advanceMode === 'gated';
  advanceMode = 'none';

  if (status === 429 && retry > 0) {
    // Disable input/submit while the limiter cools down.
    let secsLeft = retry;
    const setText = () => {
      if (!submitResultEl) return;
      submitResultEl.className = 'result err';
      submitResultEl.textContent = (secsLeft > 0 ? '⏳ ' : '✓ ') + (secsLeft > 0

        : t('Try again now.'));

    setText();
    answerErrorTimer = setInterval(() => {
      secsLeft -= 1;
      if (secsLeft <= 0) {
        clearInterval(answerErrorTimer);
        answerErrorTimer = null;
        setSubmitDisabled(false);
        if (submitResultEl) {
          submitResultEl.className = 'result muted';
          submitResultEl.textContent = '';
        }
        return;
      }
      setText();
    }, 1000);
    return;
  }

  if (status === 403) {
    // 403 from the server's gate check. The "wrong answer" rebuff would
    // mislead the player into thinking they typed the wrong word — show
    // a softer cue + clearer copy instead.
    if (wasGated) rebuff();
    if (submitResultEl) {
      submitResultEl.className = 'result err';
      submitResultEl.textContent = '📍 ' + t("You're not at the location yet — move closer and try again.");
    }
    return;
  }

  // Generic fallback: keep the legacy gated rebuff for parity with the
  // pre-existing flow when the server gives back something we don't
  // specifically classify.
  if (wasGated) rebuff();
  if (submitResultEl) {
    submitResultEl.className = 'result err';
    submitResultEl.textContent = '⚠ ' + (d.error || t('error {{status}}', { status: status || '' }));

}

function setSubmitDisabled(disabled) {
  const dock = document.getElementById('submit-dock');
  if (!dock) return;
  dock.querySelectorAll('button, input').forEach((el) => {
    el.disabled = !!disabled;
  });
}

// applyColors paints the adventure brand accents onto the puzzle scope
// only — never the document root — so the hamburger drawer, language
// picker, theme controls and other app chrome keep the default
// Zonventure palette regardless of how an organiser brands their
// adventure. Accent-fg is derived automatically from accent-luminance
// so admins don't have to pick a legible foreground by hand.
//
// Two scopes carry the override: #app (the puzzle column) and
// #submit-dock (the position:fixed answer bar that lives on <body>,
// outside #app, but is still part of the puzzle interaction). The

// when missing; renderSubmitDock re-applies the cached colours to a

let brandColors = null;
function applyColors(c) {
  brandColors = c || null;
  applyBrandToScope(document.getElementById('app'));
  applyBrandToScope(document.getElementById('submit-dock'));
}
function applyBrandToScope(el) {
  if (!el) return;

    el.style.setProperty('--accent', c.accent);
    el.style.setProperty('--accent-hover', shade(c.accent, -0.12));
    el.style.setProperty('--accent-fg', readableOn(c.accent));

    el.style.removeProperty('--accent');
    el.style.removeProperty('--accent-hover');
    el.style.removeProperty('--accent-fg');
  }

    el.style.setProperty('--accent-secondary', c.accent_secondary || c.accent);
  } else {
    el.style.removeProperty('--accent-secondary');

// shade nudges a hex colour toward black (amount<0) or white (amount>0)
// so the hover state stays automatically legible regardless of the
// admin's chosen accent.
function shade(hex, amount) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex);
  if (!m) return hex;
  const n = parseInt(m[1], 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const mix = amount < 0 ? 0 : 255;
  r = Math.round(r + (mix - r) * Math.abs(amount));
  g = Math.round(g + (mix - g) * Math.abs(amount));
  b = Math.round(b + (mix - b) * Math.abs(amount));
  return '#' + [r, g, b].map((x) => x.toString(16).padStart(2, '0')).join('');
}

// readableOn returns black or white, whichever has better contrast on
// the supplied background. Uses the WCAG relative-luminance formula.
function readableOn(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex);
  if (!m) return '#ffffff';
  const n = parseInt(m[1], 16);
  const srgb = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => {
    const s = v / 255;
    return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
  });
  const L = 0.2126 * srgb[0] + 0.7152 * srgb[1] + 0.0722 * srgb[2];
  return L > 0.5 ? '#000000' : '#ffffff';
}

/* Theme: system default unless the player has explicitly picked one.

(function initTheme() {
  try {
    const saved = localStorage.getItem('zv-theme');
    if (saved === 'light' || saved === 'dark') {
      document.documentElement.setAttribute('data-theme', saved);
    }
  } catch { /* private mode — ignore, defaults still apply */ }
})();

  const attr = document.documentElement.getAttribute('data-theme');
  if (attr) return attr;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

  if (value === 'system') {
    document.documentElement.removeAttribute('data-theme');
    try { localStorage.removeItem('zv-theme'); } catch {}
  } else {
    document.documentElement.setAttribute('data-theme', value);
    try { localStorage.setItem('zv-theme', value); } catch {}
  }

function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {

    // via innerHTML. Only safe because the server renders markdown
    // through goldmark without WithUnsafe(), so raw <script>/<iframe>
    // in the author's source is escaped before it ever gets here.
    else if (k === 'html') e.innerHTML = v;
    else if (v !== null && v !== undefined) e.setAttribute(k, v);

  for (const c of children) e.append(c?.nodeType ? c : document.createTextNode(c ?? ''));

function renderNoSession(opts) {
  const expired = !!(opts && opts.expired);
  lastRenderKey = null;
  hideSubmitDock();

  // stay one tap away even before a magic link exchange. Same
  // [☰] [progress] [actions] order as the playing-state runbar so
  // the hamburger doesn't jump positions between views.
  const bar = el('div', { class: 'runbar' },
    buildMenuButton(null),
    el('span', { class: 'progress empty' }, ''),
    el('div', { class: 'actions' }));

  // session that *was* active (we received at least one state push) is
  // closed by the server, almost always because the slot's expiry
  // passed. The first-time path stays as the soft prompt to open a link.

    app.replaceChildren(bar, el('div', { class: 'card' },
      el('h3', {}, t('Your link expired')),
      el('p', { class: 'muted' },
        t('Magic links expire after a while. Ask your arranger for a fresh link to get back in — your team\'s progress is safe.'))));

  }
  app.replaceChildren(bar, el('div', { class: 'card' },
    el('h3', {}, t('Open your magic link')),
    el('p', { class: 'muted' },
      t('Players receive a personal link via message from their arranger. '),
      t('Open it on this device to join the game.'))));
}

// GPS precision thresholds.
//
//   MAX_UPLOAD_ACC    — don't send a ping whose ±metres exceed this.
//     A cell-tower-only reading (often ±500–2000m) tells the server
//     nothing useful and pollutes the track on the live map.
//

//     one AND the current one is recent, keep the current. Smooths
//     out the transient bad readings that phones occasionally emit
//     when they briefly lose or swap satellites.

//     unreliable regardless of its accuracy, so any new reading is
//     accepted.
const MAX_UPLOAD_ACC       = 150;
const PREFER_LAST_RATIO    = 1.5;
const PREFER_LAST_MAX_AGE_MS = 20_000;

// gpsErrorCode mirrors the W3C GeolocationPositionError enum so the
// recovery UI can branch on it without re-parsing the human string.
//   1 — permission denied (user/browser/OS toggle)
//   2 — position unavailable (no signal)
//   3 — timeout
let gpsErrorCode = 0;

// Geolocation consent preamble. Shows a card explaining what we
// collect and why before the browser's permission prompt fires —
// without it the OS prompt is cold and many players reflex-deny.
// The choice persists in localStorage so a reload doesn't re-prompt.
//   - 'granted'  → startGPS proceeds as today
//   - 'declined' → startGPS is a no-op; the GPS-help dock surfaces a
//                   "permission denied" recovery path with a button
//                   that clears the local choice and re-shows this

const GEO_CONSENT_KEY = 'zv-geo-consent';

function geoConsentStatus() {
  try { return localStorage.getItem(GEO_CONSENT_KEY) || 'unset'; }
  catch { return 'unset'; }
}

function clearGeoConsent() {
  try { localStorage.removeItem(GEO_CONSENT_KEY); } catch { /* ignore */ }
}

let geoConsentHost = null;
function showGeoConsent() {
  return new Promise((resolve) => {
    // Reuse a single host element so a rapid re-call doesn't stack
    // multiple cards on top of each other.
    if (geoConsentHost && geoConsentHost.isConnected) return;
    const back = document.createElement('div');
    back.className = 'geo-consent-back';
    geoConsentHost = back;
    const settle = (choice) => {
      try { localStorage.setItem(GEO_CONSENT_KEY, choice); } catch { /* ignore */ }
      back.remove();
      geoConsentHost = null;
      resolve(choice);
    };

    card.className = 'geo-consent-card';
    card.setAttribute('role', 'dialog');
    card.setAttribute('aria-modal', 'true');
    card.innerHTML = '';

    h2.textContent = t('Use your location?');
    const lead = document.createElement('p');
    lead.textContent = t('This game uses GPS to check that you reach each puzzle\'s location and to show your team\'s position to the arranger.');
    const ul = document.createElement('ul');
    [
      t('Your latitude / longitude is sent while the event runs.'),
      t('It\'s deleted automatically after the event (within 30 days).'),
      t('It\'s never sold or shared with third parties.'),
    ].forEach((line) => {
      const li = document.createElement('li');
      li.textContent = line;
      ul.append(li);
    });
    const note = document.createElement('p');
    const noteSpan = document.createElement('span');
    noteSpan.textContent = t('You can change your mind any time. See ');
    const link = document.createElement('a');
    link.href = '/privacy'; link.target = '_blank'; link.rel = 'noopener';
    link.textContent = t('privacy policy');
    note.append(noteSpan, link, document.createTextNode('.'));
    const row = document.createElement('div');
    row.className = 'row';
    const decline = document.createElement('button');
    decline.type = 'button'; decline.className = 'secondary';
    decline.textContent = t('Not now');
    decline.addEventListener('click', () => settle('declined'));
    const allow = document.createElement('button');
    allow.type = 'button';
    allow.textContent = t('Use my location');
    allow.addEventListener('click', () => settle('granted'));
    row.append(decline, allow);
    card.append(h2, lead, ul, note, row);
    back.append(card);
    document.body.append(back);
    setTimeout(() => allow.focus(), 30);
  });
}

function startGPS() {
  if (!navigator.geolocation) {
    gpsError = t('geolocation not supported on this device');
    gpsErrorCode = 2;
    lastRenderKey = null; // so the gate card picks up the error on next refresh
    updateGateLock();
    return;
  }
  // Player has paused location reporting from the menu drawer. The
  // gate-locked card picks up gpsErrorCode 4 and shows a "paused"
  // message instead of "no signal" — distinct copy so the player
  // doesn't think the browser failed.
  if (prefLocationPaused()) {
    gpsError = t('Location is paused. Open the menu to share again.');
    gpsErrorCode = 4;
    lastRenderKey = null;
    updateGateLock();
    return;
  }
  if (gpsWatchID !== null) return;
  // Consent gate: hold the watchPosition call until we have an
  // explicit yes. A 'declined' surfaces the same error path as a
  // browser-level denial (gpsErrorCode = 1) so the recovery dock copy
  // and Retry button keep working without a second branch.
  const status = geoConsentStatus();
  if (status === 'declined') {
    gpsErrorCode = 1;
    gpsError = t('permission denied — enable location for this site');
    lastRenderKey = null;
    updateGateLock();
    return;
  }
  if (status !== 'granted') {
    showGeoConsent().then((choice) => {
      if (choice === 'granted') startGPS();
      else {
        gpsErrorCode = 1;
        gpsError = t('permission denied — enable location for this site');
        lastRenderKey = null;
        updateGateLock();
      }
    });
    return;
  }
  gpsWatchID = navigator.geolocation.watchPosition(
    (pos) => {
      gpsError = null;
      gpsErrorCode = 0;
      const next = {
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        accuracy: pos.coords.accuracy,
        ts: Date.now(),
      };
      // Prefer-better filter: hold on to an older fix when the new one
      // is notably worse, unless the old one is stale. Without this a
      // phone re-acquiring satellites often reports a worse fix first
      // and then recovers — we don't want to jitter the UI or the
      // server's track with that bad reading in the middle.
      if (lastFix && lastFix.accuracy && next.accuracy > lastFix.accuracy * PREFER_LAST_RATIO
          && (Date.now() - (lastFix.ts || 0)) < PREFER_LAST_MAX_AGE_MS) {
        return;
      }
      lastFix = next;
      updateGateLock();
    },
    (err) => {
      // PERMISSION_DENIED(1), POSITION_UNAVAILABLE(2), TIMEOUT(3) from the
      // W3C GeolocationPositionError enum. Show them verbatim to the
      // player so they know whether to flip the browser toggle, go
      // outdoors, or wait a moment.
      const code = err.code;
      gpsErrorCode = code || 0;
      gpsError = code === 1 ? t('permission denied — enable location for this site')
               : code === 2 ? t('no signal — try moving outdoors')
               : code === 3 ? t('timed out — retrying')
               : err.message || 'unknown';
      lastRenderKey = null;
      updateGateLock();
      console.warn('gps', err.message);
    },
    // maximumAge: 0 forces the freshest reading every call. The default
    // (or a large value) lets the browser hand back a cached fix —
    // harmful while the player is actually walking since the server
    // would think they haven't moved for up to that many seconds.
    { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 },
  );
  if (pingTimer === null) pingTimer = setInterval(sendPing, 15000);
}

// retryGPS re-arms the watcher after the user taps Retry. Clearing
// the existing watch ID is important — the browser may have a stuck
// watcher that won't fire again on its own when permission flipped
// from denied to granted in a different app/tab.
//
// Tapping Retry is also the user's way to undo a prior "Not now" on
// the consent preamble — clear the stored 'declined' so startGPS
// shows the card again instead of immediately dropping into the
// denied-recovery state.
function retryGPS() {
  if (gpsWatchID !== null && navigator.geolocation) {
    try { navigator.geolocation.clearWatch(gpsWatchID); } catch { /* ignore */ }
  }
  if (geoConsentStatus() === 'declined') clearGeoConsent();
  gpsWatchID = null;
  gpsError = null;
  gpsErrorCode = 0;
  startGPS();
  updateGateLock();
}

// applyLocationPause flips the persisted preference and tears down
// the GPS watcher + ping loop (or restarts them) to match. The
// browser-level permission grant is preserved either way: pausing
// here is the player saying "stop using my location for this
// session", not "revoke consent". Un-pausing therefore doesn't
// re-prompt — it just calls startGPS, which finds the consent on
// record and re-arms watchPosition.
function applyLocationPause(paused) {
  setLocationPausedPref(paused);
  if (paused) {
    if (gpsWatchID !== null && navigator.geolocation) {
      try { navigator.geolocation.clearWatch(gpsWatchID); } catch { /* ignore */ }
    }
    gpsWatchID = null;
    if (pingTimer !== null) {
      clearInterval(pingTimer);
      pingTimer = null;
    }
    lastFix = null;
    gpsError = t('Location is paused. Open the menu to share again.');
    gpsErrorCode = 4;
  } else {
    gpsError = null;
    gpsErrorCode = 0;
    startGPS();
  }
  lastRenderKey = null;
  if (lastState) render(lastState);
  updateGateLock();
}

function sendPing() {
  if (!lastFix) return;
  // Drop readings too imprecise to be useful for gate checks or map
  // rendering. The server stores every ping it receives; letting
  // ±500 m fixes in just adds noise to the track.
  if (lastFix.accuracy > MAX_UPLOAD_ACC) return;
  // Queue when the WS is down so the next reconnect carries the
  // freshest fix; older pings dedupe to "last only" since the server
  // doesn't care about the gap, just the current position.
  wsSendOrQueue('location', {
    lat: lastFix.lat, lng: lastFix.lng, accuracy: lastFix.accuracy,
    client_ts: new Date().toISOString(),
  });
}

// currentGatedButton tracks the "Check location · I'm here" button in
// the sticky dock so the GPS callback can enable/disable it live as
// precision changes, without forcing a full re-render.
let currentGatedButton = null;
let currentGatedRadius = 0;
// currentGpsHelpEl is the optional help/retry surface that sits below
// the gated submit button. Built by renderSubmitDock and updated
// reactively here so a permission flip / new fix shows or hides it
// without forcing a render() pass.
let currentGpsHelpEl = null;
// currentGpsFreshnessEl is the small "GPS · 3s ago / ±15m" line
// shown on gated puzzles. Lets a stuck player diagnose why the gate
// isn't unlocking (stale fix, wide accuracy) without a separate tap.
let currentGpsFreshnessEl = null;

// renderGpsFreshness ticks the staleness label. Called on every fix
// update AND once per second by the per-dock ticker so "3s ago"
// keeps counting up while the player isn't moving.
function renderGpsFreshness() {
  if (!currentGpsFreshnessEl) return;
  if (gpsErrorCode || !lastFix) {
    currentGpsFreshnessEl.textContent = '';
    return;
  }
  const ageSec = Math.max(0, Math.round((Date.now() - (lastFix.ts || 0)) / 1000));
  const acc = Math.round(lastFix.accuracy);
  const ageLabel = ageSec < 5
    ? t('just now')
    : ageSec < 60
      ? t('{{n}}s ago', { n: ageSec })
      : t('{{n}}m ago', { n: Math.round(ageSec / 60) });
  currentGpsFreshnessEl.textContent = t('GPS · {{age}} · ±{{acc}} m',
    { age: ageLabel, acc });
}

// updateGateLock reflects the latest fix onto the gated advance
// button: disabled with a "waiting for lock" label until the fix is
// accurate enough relative to the gate's own radius, then enabled.
// Text-answer gated puzzles don't use this — the server's 403 already
// handles the "not there yet" case.
function updateGateLock() {
  if (!currentGatedButton || !currentGatedRadius) return;
  const ok = !gpsErrorCode && lastFix && lastFix.accuracy <= Math.max(currentGatedRadius, 25);
  currentGatedButton.disabled = !ok;
  if (gpsErrorCode === 1) {
    // Permission flipped off — say so on the button itself; recovery
    // hint + retry live in currentGpsHelpEl.
    currentGatedButton.textContent = t('Location off — see below');
  } else if (ok) {
    currentGatedButton.textContent = t("Check location · I'm here");
  } else if (!lastFix) {
    currentGatedButton.textContent = t('Waiting for GPS lock…');
  } else {
    currentGatedButton.textContent = t('GPS ±{{acc}} m — too imprecise',
      { acc: Math.round(lastFix.accuracy) });
  }
  renderGpsFreshness();
  renderGpsHelp();
}

function renderGpsHelp() {
  if (!currentGpsHelpEl) return;
  currentGpsHelpEl.replaceChildren();
  // Code 1 = denied. Code 2 = unavailable. Code 3 = timeout. We only
  // surface a help block when there's something actionable to say —
  // happy path stays uncluttered.
  if (!gpsErrorCode) {
    currentGpsHelpEl.style.display = 'none';
    return;
  }
  currentGpsHelpEl.style.display = '';
  // Code 4 is the player-initiated pause (drawer toggle). Distinct
  // copy + no Retry button because the fix is in the menu, not in
  // the browser permission stack.
  if (gpsErrorCode === 4) {
    const help = document.createElement('p');
    help.textContent = t('Location is paused. Open the menu to share again.');
    currentGpsHelpEl.append(help);
    return;
  }
  const hint = (() => {
    if (gpsErrorCode === 1) {
      return t('Location is blocked. Open your browser or device settings, allow location for this site, then tap Retry.');
    }
    if (gpsErrorCode === 2) {
      return t('No GPS signal. Move to open sky (away from buildings/trees) and tap Retry — usually clears in 30 seconds.');
    }
    return t("GPS hasn't locked yet. Wait a moment and tap Retry, or move outdoors.");
  })();
  const retry = document.createElement('button');
  retry.type = 'button';
  retry.className = 'secondary';
  retry.textContent = t('Retry GPS');
  retry.addEventListener('click', retryGPS);
  const help = document.createElement('p');
  help.textContent = hint;
  currentGpsHelpEl.append(help, retry);
}

// lastState mirrors the most recent snapshot we rendered. Read only
// after render() has run at least once. Used by handlers that fire
// outside the render path (rebuff guidance copy, etc.) and would
// otherwise have to take state by argument from many callers.
let lastState = null;
function render(s) {
  lastState = s;
  applyColors(s.colors);
  const key = JSON.stringify({
    status: s.status, pi: s.page_index, pc: s.page_count,
    t: s.title, p: s.prompt,
    // Rev-count controls which hints show; unlock countdowns tick
    // server-side per snapshot push so re-render is already implied.
    hnts: (s.hints || []).map((h) => h.unlocks_in_seconds),
    rev: hintsRevealedFor(s),
    img: (s.images || []).map((i) => i.url),
    gate: s.gate ? s.gate.reached : null,
    team: s.team_name, adv: s.adventure_title,
    // Include no_answer so a puzzle flipping between answer/no-answer
    // modes rebuilds the submit dock instead of being deduped.
    na: !!s.no_answer,
  });
  if (key === lastRenderKey) return;
  lastRenderKey = key;
  // Anchor for the hint countdown ticker — we use this to decrement
  // server-supplied unlocks_in_seconds locally between snapshots.
  hintTickerAnchor = Date.now();

  app.replaceChildren();
  const playing = s.status === 'running';
  const hintBtn = playing ? renderHintButton(s) : null;
