<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zonventure · play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aclonica&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --accent:        #ad1357;
    --accent-hover:  #951048;
    --accent-fg:     #ffffff;
    --ink:           #1f3349;
    --success:       #429a3f;
    --danger:        #ff5252;
    --bg:            #fbfbfd;
    --surface:       #ffffff;
    --surface-2:     #f6f6f6;
    --border:        #c6d2e1;
    --border-soft:   #c6d2e166;
    --text:          var(--ink);
    --muted:         #6b7f96;
    --shadow:        0 1px 4px #00000014, 0 2px 8px #00000012;
    --radius:        12px;
    --radius-pill:   32px;
    --font-body:     'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --font-brand:    'Aclonica', 'Vollkorn', Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:          #14202e;
      --surface:     #1f3349;
      --surface-2:   #263d56;
      --border:      #3a5172;
      --border-soft: #3a517266;
      --text:        #e7ecf4;
      --ink:         #e7ecf4;
      --muted:       #9db1cc;
      --accent:      #e24080;
      --accent-hover:#ad1357;
      --success:     #7fd17b;
      --danger:      #ff7b7b;
      --shadow:      0 1px 4px #00000066, 0 2px 12px #00000077;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: var(--font-body);
    font-size: 16px; line-height: 1.5;
    color: var(--text); background: var(--bg);
    margin: 0; padding: 1rem;
    max-width: 640px; margin-left: auto; margin-right: auto;
    -webkit-font-smoothing: antialiased;
  }
  h1 {
    font-family: var(--font-brand); font-weight: 400;
    color: var(--accent);
    font-size: 1.8rem; margin: 0 0 .25rem;
  }
  .subtitle { color: var(--muted); font-size: .85rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; margin-bottom: 1rem; }
  h2 { font-size: .85rem; margin: 1.2rem 0 .4rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  h3 { font-size: 1.05rem; margin: 0 0 .5rem; color: var(--ink); }
  input {
    font: inherit; width: 100%; padding: .75rem .9rem; margin-bottom: .8rem;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
  }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
  button {
    font: inherit; font-weight: 700; width: 100%;
    padding: .75rem 1.2rem; cursor: pointer;
    background: var(--accent); color: var(--accent-fg);
    border: none; border-radius: var(--radius-pill);
    box-shadow: var(--shadow);
    transition: background 120ms, transform 80ms;
  }
  button:hover { background: var(--accent-hover); }
  button:active { transform: translateY(1px); }
  button.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  button.secondary:hover { background: var(--surface-2); }
  .card {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 1.25rem; margin: .75rem 0;
    box-shadow: var(--shadow);
  }
  .muted { color: var(--muted); }
  .err { color: var(--danger); font-weight: 600; }
  .ok  { color: var(--success); font-weight: 600; }
  .prompt { white-space: pre-wrap; font-size: 1.1rem; line-height: 1.55; color: var(--ink); }
  .pill {
    display: inline-block; padding: .15rem .65rem;
    border-radius: 999px; font-size: .7rem; font-weight: 700;
    background: color-mix(in srgb, var(--accent) 15%, transparent);
    color: var(--accent);
    text-transform: uppercase; letter-spacing: .06em;
  }
  .topline {
    display: flex; justify-content: space-between; align-items: baseline;
    padding-bottom: .75rem; margin-bottom: .75rem;
    border-bottom: 1px solid var(--border-soft);
  }
  .topline .who { color: var(--muted); font-size: .9rem; }
  .topline .who strong { color: var(--ink); font-weight: 700; }
  .inline-btn { display: inline-block; width: auto; padding: .35rem .85rem; font-size: .8rem; }
</style>
</head>
<body>
<h1>zonventure</h1>
<div class="subtitle">player</div>
<div id="app">loading…</div>

<script>
const app = document.getElementById('app');
let gpsWatchID = null;
let pingTimer = null;
let lastFix = null;

async function api(path, opts = {}) {
  const res = await fetch(path, {
    credentials: 'same-origin',
    headers: opts.body ? { 'Content-Type': 'application/json' } : {},
    ...opts,
  });
  let body = null;
  if (res.status !== 204) { try { body = await res.json(); } catch {} }
  return { status: res.status, body };
}

function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'on') for (const [ev, fn] of Object.entries(v)) e.addEventListener(ev, fn);
    else if (k === 'class') e.className = v;
    else if (v !== null && v !== undefined) e.setAttribute(k, v);
  }
  for (const c of children) e.append(c?.nodeType ? c : document.createTextNode(c ?? ''));
  return e;
}

function renderNoSession() {
  app.replaceChildren(el('div', { class: 'card' },
    el('h3', {}, 'Open your magic link'),
    el('p', { class: 'muted' },
      'Players receive a personal link via message from their arranger. ',
      'Open it on this device to join the game.')));
}

function startGPS() {
  if (gpsWatchID !== null || !navigator.geolocation) return;
  gpsWatchID = navigator.geolocation.watchPosition(
    (pos) => {
      lastFix = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy };
    },
    (err) => { console.warn('gps', err.message); },
    { enableHighAccuracy: true, maximumAge: 10000, timeout: 30000 },
  );
  if (pingTimer === null) pingTimer = setInterval(sendPing, 15000);
}

async function sendPing() {
  if (!lastFix) return;
  await api('/api/player/location', {
    method: 'POST',
    body: JSON.stringify({ ...lastFix, client_ts: new Date().toISOString() }),
  });
  refresh();
}

async function refresh() {
  const s = await api('/api/player/state');
  if (s.status === 401) { renderNoSession(); return; }
  if (s.status !== 200) {
    app.replaceChildren(el('p', { class: 'err' }, s.body?.error || 'error'));
    return;
  }
  startGPS();
  render(s.body);
}

function render(s) {
  app.replaceChildren();
  const header = el('div', { class: 'card' },
    el('div', { class: 'topline' },
      el('span', { class: 'who' },
        el('strong', {}, s.slot_name || 'Player'), ' · ',
        el('span', { class: 'pill' }, s.status)),
      el('button', { class: 'secondary inline-btn', on: { click: logout } }, 'Log out')),
  );
  if (s.adventure_title) header.append(el('p', { class: 'muted' }, `${s.adventure_title} — team ${s.team_name || ''}`));
  app.append(header);

  if (s.status === 'waiting') { app.append(el('p', {}, 'Waiting for the adventure to start…')); return; }
  if (s.status === 'paused')  { app.append(el('p', {}, 'The arranger paused the run. Stand by.')); return; }
  if (s.status === 'completed'){ app.append(el('p', { class: 'ok' }, 'Adventure complete! 🎉')); return; }

  const progress = `Puzzle ${s.page_index + 1} of ${s.page_count}`;
  app.append(el('p', { class: 'muted' }, progress));

  if (s.status === 'gated') {
    const card = el('div', { class: 'card' },
      el('h2', {}, 'Travel to the location'),
      el('p', {}, `Head within ${s.gate.radius_m} m of (${s.gate.lat.toFixed(5)}, ${s.gate.lng.toFixed(5)}).`),
      el('p', { class: 'muted' }, lastFix
        ? `Last fix: ${lastFix.lat.toFixed(5)}, ${lastFix.lng.toFixed(5)} (±${Math.round(lastFix.accuracy)} m)`
        : 'Waiting for a GPS fix…'),
      el('button', { on: { click: sendPing } }, 'Send location now'));
    app.append(card);
    return;
  }

  if (s.title) app.append(el('h2', {}, s.title));
  app.append(el('p', { class: 'prompt' }, s.prompt || ''));
  if (s.hint) app.append(el('p', { class: 'muted' }, `Hint: ${s.hint}`));

  const form = el('form', { class: 'card' },
    el('input', { name: 'a', placeholder: 'Your answer', autocomplete: 'off', required: '' }),
    el('button', { type: 'submit' }, 'Submit'));
  const result = el('p', {});
  form.append(result);
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const r = await api('/api/player/answer', {
      method: 'POST', body: JSON.stringify({ answer: fd.get('a') }),
    });
    if (r.status !== 200) {
      result.className = 'err';
      result.textContent = r.body?.error || `error ${r.status}`;
      return;
    }
    if (r.body.accepted) {
      result.className = 'ok';
      result.textContent = r.body.completed ? 'Correct — adventure complete!' : 'Correct!';
      setTimeout(refresh, 600);
    } else {
      result.className = 'err';
      result.textContent = 'Not quite — try again.';
    }
  });
  app.append(form);
}

async function logout() {
  await api('/api/player/logout', { method: 'POST' });
  if (gpsWatchID !== null) { navigator.geolocation.clearWatch(gpsWatchID); gpsWatchID = null; }
  if (pingTimer) { clearInterval(pingTimer); pingTimer = null; }
  renderNoSession();
}

setInterval(() => { if (gpsWatchID !== null) refresh(); }, 5000);

refresh();
</script>
</body>
</html>
