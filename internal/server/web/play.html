    panelEl.setAttribute('aria-label', opts.label);
  }

  // Move focus into the panel. requestAnimationFrame so the panel is
  // in the layout tree (browsers refuse to focus elements with
  // display:none ancestors).
  requestAnimationFrame(() => {
    let target = null;
    if (opts.initialFocus) {
      target = typeof opts.initialFocus === 'string'
        ? panelEl.querySelector(opts.initialFocus)
        : opts.initialFocus;
    }
    if (!target) target = panelEl.querySelector(FOCUSABLE_SEL);
    if (!target) target = panelEl;
    try { target.focus({ preventScroll: false }); } catch {}
  });

  // Tab-trap: when Tab leaves the last focusable, wrap to first;
  // Shift-Tab from first wraps to last. Outside the panel we
  // refocus into the first focusable so the user can't escape.
  const onKeydown = (e) => {
    if (e.key !== 'Tab') return;
    const focusables = panelEl.querySelectorAll(FOCUSABLE_SEL);
    if (focusables.length === 0) {
      e.preventDefault();
      panelEl.focus();
      return;
    }
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    const active = document.activeElement;
    if (e.shiftKey) {
      if (active === first || !panelEl.contains(active)) {
        e.preventDefault();
        last.focus();
      }
    } else {
      if (active === last || !panelEl.contains(active)) {
        e.preventDefault();
        first.focus();
      }
    }
  };
  panelEl.addEventListener('keydown', onKeydown);

  return function cleanup() {
    panelEl.removeEventListener('keydown', onKeydown);
    if (previouslyFocused && typeof previouslyFocused.focus === 'function') {
      try { previouslyFocused.focus({ preventScroll: true }); } catch {}
    }
  };
}

function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'on') for (const [ev, fn] of Object.entries(v)) e.addEventListener(ev, fn);
    else if (k === 'class') e.className = v;
    // The `html` key takes a pre-rendered HTML string and assigns it
    // via innerHTML. Only safe because the server renders markdown
    // through goldmark without WithUnsafe(), so raw <script>/<iframe>
    // in the author's source is escaped before it ever gets here.
    else if (k === 'html') e.innerHTML = v;
    else if (v !== null && v !== undefined) e.setAttribute(k, v);
  }
  for (const c of children) e.append(c?.nodeType ? c : document.createTextNode(c ?? ''));
  return e;
}

function renderNoSession(opts) {
  const expired = !!(opts && opts.expired);
  lastRenderKey = null;
  hideSubmitDock();
  // Lightweight runbar so the language picker / privacy / terms links
  // stay one tap away even before a magic link exchange. Same
  // [☰] [progress] [actions] order as the playing-state runbar so
  // the hamburger doesn't jump positions between views.
  const bar = el('div', { class: 'runbar' },
    buildMenuButton(null),
    el('span', { class: 'progress empty' }, ''),
    el('div', { class: 'actions' }));
  // Two distinct screens — the "expired" path is reached when a slot
  // session that *was* active (we received at least one state push) is
  // closed by the server, almost always because the slot's expiry
  // passed. The first-time path stays as the soft prompt to open a link.
  if (expired) {
    app.replaceChildren(bar, el('div', { class: 'card' },
      el('h3', {}, t('Your link expired')),
      el('p', { class: 'muted' },
        t('Magic links expire after a while. Ask your arranger for a fresh link to get back in — your team\'s progress is safe.')),
      buildRecoverLinkForm()));
    return;
  }
  app.replaceChildren(bar, el('div', { class: 'card' },
    el('h3', {}, t('Open your magic link')),
    el('p', { class: 'muted' },
      t('Players receive a personal link via message from their arranger. '),
      t('Open it on this device to join the game.')),
    buildRecoverLinkForm()));
}

// buildRecoverLinkForm renders the "I lost my link" form at the
// bottom of the no-session screens. The arranger optionally set a
// team contact email; entering it here triggers the server to mint
// a fresh magic link and email it. Always-204 anti-enumeration
// shape on the server side, so the success copy is the same
// whether or not the email matched any team — pinning that here
// in the UI so a future copy edit doesn't accidentally leak the
// match status through a divergent message.
function buildRecoverLinkForm() {
  const wrap = el('div', { style: 'margin-top:1.25rem; padding-top:1rem; border-top: 1px solid var(--border-soft)' });
  wrap.append(el('p', { class: 'muted' },
    t("Lost your link? Enter the email your arranger gave with the team — we'll send a fresh link.")));
  const input = el('input', {
    type: 'email', placeholder: t('your.email@example.com'),
    autocomplete: 'email', required: 'required',
    style: 'flex:1',
  });
  const btn = el('button', { class: 'btn primary', type: 'submit' }, t('Email me a fresh link'));
  const status = el('p', { class: 'muted', style: 'margin-top:.5rem' });
  const form = el('form', { style: 'display:flex; gap:.5rem; flex-wrap:wrap; align-items:center' },
    input, btn, status);
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true; status.textContent = t('Sending…');
    const r = await api('/api/player/recover-link', {
      method: 'POST',
      body: JSON.stringify({ email: input.value.trim() }),
    });
    btn.disabled = false;
    if (r.status === 204) {
      // Identical message regardless of match — see the handler
      // doc comment for why.
      status.textContent = t("If that email matched any team, a fresh link is on its way. Check your inbox.");
      input.value = '';
    } else {
      status.textContent = r.body?.error || t('error');
    }
  });
  wrap.append(form);
  return wrap;
}

// GPS precision thresholds.
//
//   MAX_UPLOAD_ACC    — don't send a ping whose ±metres exceed this.
//     A cell-tower-only reading (often ±500–2000m) tells the server
//     nothing useful and pollutes the track on the live map.
//
//   PREFER_LAST_RATIO — when a new fix is >1.5× worse than the current
//     one AND the current one is recent, keep the current. Smooths
//     out the transient bad readings that phones occasionally emit
//     when they briefly lose or swap satellites.
//
//   PREFER_LAST_MAX_AGE_MS — after this long a stale fix is considered
//     unreliable regardless of its accuracy, so any new reading is
//     accepted.
const MAX_UPLOAD_ACC       = 150;
const PREFER_LAST_RATIO    = 1.5;
const PREFER_LAST_MAX_AGE_MS = 20_000;

// gpsErrorCode mirrors the W3C GeolocationPositionError enum so the
// recovery UI can branch on it without re-parsing the human string.
//   1 — permission denied (user/browser/OS toggle)
//   2 — position unavailable (no signal)
//   3 — timeout
let gpsErrorCode = 0;

// Geolocation consent preamble. Shows a card explaining what we
// collect and why before the browser's permission prompt fires —
// without it the OS prompt is cold and many players reflex-deny.
// The choice persists in localStorage so a reload doesn't re-prompt.
//   - 'granted'  → startGPS proceeds as today
//   - 'declined' → startGPS is a no-op; the GPS-help dock surfaces a
//                   "permission denied" recovery path with a button
//                   that clears the local choice and re-shows this
//   - unset      → show this card and gate startGPS on the answer
const GEO_CONSENT_KEY = 'zv-geo-consent';

function geoConsentStatus() {
  try { return localStorage.getItem(GEO_CONSENT_KEY) || 'unset'; }
  catch { return 'unset'; }
}

function clearGeoConsent() {
  try { localStorage.removeItem(GEO_CONSENT_KEY); } catch { /* ignore */ }
}

let geoConsentHost = null;
function showGeoConsent() {
  return new Promise((resolve) => {
    // Reuse a single host element so a rapid re-call doesn't stack
    // multiple cards on top of each other.
    if (geoConsentHost && geoConsentHost.isConnected) return;
    const back = document.createElement('div');
    back.className = 'geo-consent-back';
    geoConsentHost = back;
    const settle = (choice) => {
      try { localStorage.setItem(GEO_CONSENT_KEY, choice); } catch { /* ignore */ }
      back.remove();
      geoConsentHost = null;
      resolve(choice);
    };
    const card = document.createElement('div');
    card.className = 'geo-consent-card';
    card.setAttribute('role', 'dialog');
    card.setAttribute('aria-modal', 'true');
    card.innerHTML = '';
    const h2 = document.createElement('h2');
    h2.textContent = t('Use your location?');
    const lead = document.createElement('p');
    lead.textContent = t('This game uses GPS to check that you reach each puzzle\'s location and to show your team\'s position to the arranger.');
    const ul = document.createElement('ul');
    [
      t('Your latitude / longitude is sent while the event runs.'),
      t('It\'s deleted automatically after the event (within 30 days).'),
      t('It\'s never sold or shared with third parties.'),
    ].forEach((line) => {
      const li = document.createElement('li');
      li.textContent = line;
      ul.append(li);
    });
    const note = document.createElement('p');
    const noteSpan = document.createElement('span');
    noteSpan.textContent = t('You can change your mind any time. See ');
    const link = document.createElement('a');
    link.href = '/privacy'; link.target = '_blank'; link.rel = 'noopener';
    link.textContent = t('privacy policy');
    note.append(noteSpan, link, document.createTextNode('.'));
    const row = document.createElement('div');
    row.className = 'row';
    const decline = document.createElement('button');
    decline.type = 'button'; decline.className = 'secondary';
    decline.textContent = t('Not now');
    decline.addEventListener('click', () => settle('declined'));
    const allow = document.createElement('button');
    allow.type = 'button';
    allow.textContent = t('Use my location');
    allow.addEventListener('click', () => settle('granted'));
    row.append(decline, allow);
    card.append(h2, lead, ul, note, row);
    back.append(card);
    document.body.append(back);
    setTimeout(() => allow.focus(), 30);
  });
}

function startGPS() {
  if (!navigator.geolocation) {
    gpsError = t('geolocation not supported on this device');
    gpsErrorCode = 2;
    lastRenderKey = null; // so the gate card picks up the error on next refresh
    updateGateLock();
    return;
  }
  // Player has paused location reporting from the menu drawer. The
  // gate-locked card picks up gpsErrorCode 4 and shows a "paused"
  // message instead of "no signal" — distinct copy so the player
  // doesn't think the browser failed.
  if (prefLocationPaused()) {
    gpsError = t('Location is paused. Open the menu to share again.');
    gpsErrorCode = 4;
    lastRenderKey = null;
    updateGateLock();
    return;
  }
  if (gpsWatchID !== null) return;
  // Consent gate: hold the watchPosition call until we have an
  // explicit yes. A 'declined' surfaces the same error path as a
  // browser-level denial (gpsErrorCode = 1) so the recovery dock copy
  // and Retry button keep working without a second branch.
  const status = geoConsentStatus();
  if (status === 'declined') {
    gpsErrorCode = 1;
    gpsError = t('permission denied — enable location for this site');
    lastRenderKey = null;
    updateGateLock();
    return;
  }
  if (status !== 'granted') {
    showGeoConsent().then((choice) => {
      if (choice === 'granted') startGPS();
      else {
        gpsErrorCode = 1;
        gpsError = t('permission denied — enable location for this site');
        lastRenderKey = null;
        updateGateLock();
      }
    });
    return;
  }
  gpsWatchID = navigator.geolocation.watchPosition(
    (pos) => {
      gpsError = null;
      gpsErrorCode = 0;
      const next = {
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        accuracy: pos.coords.accuracy,
        ts: Date.now(),
      };
      // Prefer-better filter: hold on to an older fix when the new one
      // is notably worse, unless the old one is stale. Without this a
      // phone re-acquiring satellites often reports a worse fix first
      // and then recovers — we don't want to jitter the UI or the
      // server's track with that bad reading in the middle.
      if (lastFix && lastFix.accuracy && next.accuracy > lastFix.accuracy * PREFER_LAST_RATIO
          && (Date.now() - (lastFix.ts || 0)) < PREFER_LAST_MAX_AGE_MS) {
        return;
      }
      lastFix = next;
      updateGateLock();
    },
    (err) => {
      // PERMISSION_DENIED(1), POSITION_UNAVAILABLE(2), TIMEOUT(3) from the
      // W3C GeolocationPositionError enum. Show them verbatim to the
      // player so they know whether to flip the browser toggle, go
      // outdoors, or wait a moment.
      const code = err.code;
      gpsErrorCode = code || 0;
      gpsError = code === 1 ? t('permission denied — enable location for this site')
               : code === 2 ? t('no signal — try moving outdoors')
               : code === 3 ? t('timed out — retrying')
               : err.message || 'unknown';
      lastRenderKey = null;
      updateGateLock();
      console.warn('gps', err.message);
    },
    // maximumAge: 0 forces the freshest reading every call. The default
    // (or a large value) lets the browser hand back a cached fix —
    // harmful while the player is actually walking since the server
    // would think they haven't moved for up to that many seconds.
    { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 },
  );
  if (pingTimer === null) pingTimer = setInterval(sendPing, 15000);
}

// retryGPS re-arms the watcher after the user taps Retry. Clearing
// the existing watch ID is important — the browser may have a stuck
// watcher that won't fire again on its own when permission flipped
// from denied to granted in a different app/tab.
//
// Tapping Retry is also the user's way to undo a prior "Not now" on
// the consent preamble — clear the stored 'declined' so startGPS
// shows the card again instead of immediately dropping into the
// denied-recovery state.
function retryGPS() {
  if (gpsWatchID !== null && navigator.geolocation) {
    try { navigator.geolocation.clearWatch(gpsWatchID); } catch { /* ignore */ }
  }
  if (geoConsentStatus() === 'declined') clearGeoConsent();
  gpsWatchID = null;
  gpsError = null;
  gpsErrorCode = 0;
  startGPS();
  updateGateLock();
}

// applyLocationPause flips the persisted preference and tears down
// the GPS watcher + ping loop (or restarts them) to match. The
// browser-level permission grant is preserved either way: pausing
// here is the player saying "stop using my location for this
// session", not "revoke consent". Un-pausing therefore doesn't
// re-prompt — it just calls startGPS, which finds the consent on
// record and re-arms watchPosition.
function applyLocationPause(paused) {
  setLocationPausedPref(paused);
  if (paused) {
    if (gpsWatchID !== null && navigator.geolocation) {
      try { navigator.geolocation.clearWatch(gpsWatchID); } catch { /* ignore */ }
    }
    gpsWatchID = null;
    if (pingTimer !== null) {
      clearInterval(pingTimer);
      pingTimer = null;
    }
    lastFix = null;
    gpsError = t('Location is paused. Open the menu to share again.');
    gpsErrorCode = 4;
  } else {
    gpsError = null;
    gpsErrorCode = 0;
    startGPS();
  }
  lastRenderKey = null;
  if (lastState) render(lastState);
  updateGateLock();
}

// haversineMeters returns the great-circle distance between two
// lat/lng pairs in metres. Matches the server's gate check
// (internal/player/handlers.go) so a preview-mode spoof verdict
// agrees with what a real player at the same coords would see.
function haversineMeters(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const toRad = (d) => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
    Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
}

function sendPing() {
  if (!lastFix) return;
  // Drop readings too imprecise to be useful for gate checks or map
  // rendering. The server stores every ping it receives; letting
  // ±500 m fixes in just adds noise to the track.
  if (lastFix.accuracy > MAX_UPLOAD_ACC) return;
  // Queue when the WS is down so the next reconnect carries the
  // freshest fix; older pings dedupe to "last only" since the server
  // doesn't care about the gap, just the current position.
  wsSendOrQueue('location', {
    lat: lastFix.lat, lng: lastFix.lng, accuracy: lastFix.accuracy,
    client_ts: new Date().toISOString(),
  });
}

// currentGatedButton tracks the "Check location · I'm here" button in
// the sticky dock so the GPS callback can enable/disable it live as
// precision changes, without forcing a full re-render.
let currentGatedButton = null;
let currentGatedRadius = 0;
// currentGpsHelpEl is the optional help/retry surface that sits below
// the gated submit button. Built by renderSubmitDock and updated
// reactively here so a permission flip / new fix shows or hides it
// without forcing a render() pass.
let currentGpsHelpEl = null;
// currentGpsFreshnessEl is the small "GPS · 3s ago / ±15m" line
// shown on gated puzzles. Lets a stuck player diagnose why the gate
// isn't unlocking (stale fix, wide accuracy) without a separate tap.
let currentGpsFreshnessEl = null;

// renderGpsFreshness ticks the staleness label. Called on every fix
// update AND once per second by the per-dock ticker so "3s ago"
// keeps counting up while the player isn't moving.
function renderGpsFreshness() {
  if (!currentGpsFreshnessEl) return;
  if (gpsErrorCode || !lastFix) {
    currentGpsFreshnessEl.textContent = '';
    return;
  }
  const ageSec = Math.max(0, Math.round((Date.now() - (lastFix.ts || 0)) / 1000));
  const acc = Math.round(lastFix.accuracy);
  const ageLabel = ageSec < 5
    ? t('just now')
    : ageSec < 60
      ? t('{{n}}s ago', { n: ageSec })
      : t('{{n}}m ago', { n: Math.round(ageSec / 60) });
  currentGpsFreshnessEl.textContent = t('GPS · {{age}} · ±{{acc}} m',
    { age: ageLabel, acc });
}

// updateGateLock reflects the latest fix onto the gated advance
// button: disabled with a "waiting for lock" label until the fix is
// accurate enough relative to the gate's own radius, then enabled.
// Text-answer gated puzzles don't use this — the server's 403 already
// handles the "not there yet" case.
function updateGateLock() {
  if (!currentGatedButton || !currentGatedRadius) return;
  // In preview, a spoofed fix from the debug-strip map satisfies the
  // lock with implicit zero accuracy — the arranger placed the point
  // by hand, so it's by definition "as precise as the gate needs".
  if (previewState && previewSpoofedFix) {
    currentGatedButton.disabled = false;
    currentGatedButton.textContent = t("Check location · I'm here");
    renderGpsFreshness();
    renderGpsHelp();
    return;
  }
  const ok = !gpsErrorCode && lastFix && lastFix.accuracy <= Math.max(currentGatedRadius, 25);
  currentGatedButton.disabled = !ok;
  if (gpsErrorCode === 1) {
    // Permission flipped off — say so on the button itself; recovery
    // hint + retry live in currentGpsHelpEl.
    currentGatedButton.textContent = t('Location off — see below');
  } else if (ok) {
    currentGatedButton.textContent = t("Check location · I'm here");
  } else if (previewState) {
    // Preview without a spoofed fix and without a real GPS fix: the
    // dock would otherwise sit at "Waiting for GPS lock…" forever
    // since the preview path doesn't have a real device fix in many
    // cases. Tell the arranger what the affordance is.
    currentGatedButton.textContent = t('Set a test location to continue');
  } else if (!lastFix) {
    currentGatedButton.textContent = t('Waiting for GPS lock…');
  } else {
    currentGatedButton.textContent = t('GPS ±{{acc}} m — too imprecise',
      { acc: Math.round(lastFix.accuracy) });
  }
  renderGpsFreshness();
  renderGpsHelp();
}

function renderGpsHelp() {
  if (!currentGpsHelpEl) return;
  currentGpsHelpEl.replaceChildren();
  // Code 1 = denied. Code 2 = unavailable. Code 3 = timeout. We only
  // surface a help block when there's something actionable to say —
  // happy path stays uncluttered.
  if (!gpsErrorCode) {
    currentGpsHelpEl.style.display = 'none';
    return;
  }
  currentGpsHelpEl.style.display = '';
  // Code 4 is the player-initiated pause (drawer toggle). Distinct
  // copy + no Retry button because the fix is in the menu, not in
  // the browser permission stack.
  if (gpsErrorCode === 4) {
    const help = document.createElement('p');
    help.textContent = t('Location is paused. Open the menu to share again.');
    currentGpsHelpEl.append(help);
    return;
  }
  // Permission-denied is a different recovery shape from "no signal":
  // Retry can't help (browsers don't re-prompt after a denial), so
  // the message has to spell out the OS/browser setting and offer
  // the arranger-override fallback.
  if (gpsErrorCode === 1) {
    const help = document.createElement('p');
    help.textContent = t('Location is blocked for this site.');
    const detail = document.createElement('p');
    detail.style.fontSize = '.85rem';
    detail.style.margin = '.35rem 0 0';
    detail.style.color = 'var(--muted)';
    detail.textContent = t("Most phones: open Settings → Privacy → Location → your browser → While Using. Then come back and reload this page. If you can't change the setting, ask your arranger to unlock this puzzle for your team — they can advance you manually from their dashboard.");
    currentGpsHelpEl.append(help, detail);
    return;
  }
  const hint = (() => {
    if (gpsErrorCode === 2) {
      return t('No GPS signal. Move to open sky (away from buildings/trees) and tap Retry — usually clears in 30 seconds.');
    }
    return t("GPS hasn't locked yet. Wait a moment and tap Retry, or move outdoors.");
  })();
  const retry = document.createElement('button');
  retry.type = 'button';
  retry.className = 'secondary';
  retry.textContent = t('Retry GPS');
  retry.addEventListener('click', retryGPS);
  const help = document.createElement('p');
  help.textContent = hint;
  currentGpsHelpEl.append(help, retry);
}

// renderBrandStrip paints the owning org's identity above the runbar.
// When both a logo and a name are set, the logo anchors the left and
// the name pins to the right — corporate buyers asked for the textual
// brand to stay visible alongside the mark, not get hidden by it.
// When only one is set we fall back to a single-piece strip (logo OR
// name on the left). Returns null when neither is available so an
// unbranded play page stays clean.
// renderRunbarBrand produces the right-aligned org chrome that
// rides on the runbar (hamburger / progress / hint share the same
// row). Keeping logo + name on a single line — instead of the
// previous standalone strip — gives the puzzle ~2rem more vertical
// real estate, which the user explicitly asked for on small
// screens. Returns null when the org has no logo and no name set so
// the runbar doesn't grow an empty trailing slot.
function renderRunbarBrand(s) {
  const logo = s && s.org_logo_url ? s.org_logo_url : '';
  const name = s && s.org_name ? s.org_name.trim() : '';
  if (!logo && !name) return null;
  const hostClass = 'runbar-brand' + (logo ? ' has-logo' : '');
  if (logo && name) {
    return el('div', { class: hostClass },
      el('img', { class: 'runbar-brand-logo', src: logo, alt: name }),
      el('span', { class: 'runbar-brand-name' }, name),
    );
  }
  return el('div', { class: hostClass },
    logo
      ? el('img', {
          class: 'runbar-brand-logo',
          src: logo,
          alt: t('Organization logo'),
        })
      : el('span', { class: 'runbar-brand-name' }, name),
  );
}

// lastState mirrors the most recent snapshot we rendered. Read only
// after render() has run at least once. Used by handlers that fire
// outside the render path (rebuff guidance copy, etc.) and would
// otherwise have to take state by argument from many callers.
let lastState = null;
function render(s) {
  lastState = s;
  applyColors(s.colors);
  // Tab title reflects player position so a player browsing tabs can
  // see "3/8 – Lake Quest" without switching. SPA navigation never
  // updates document.title without help. Falls back to "Zonventure |
  // Play" when no puzzle is active.
  if (s && s.adventure_title) {
    if (s.status === 'playing' && Number.isFinite(s.page_index) && s.page_count) {
      document.title = `${s.page_index + 1}/${s.page_count} – ${s.adventure_title} – Zonventure`;
    } else if (s.status === 'completed') {
      document.title = `✓ ${s.adventure_title} – Zonventure`;
    } else {
      document.title = `${s.adventure_title} – Zonventure`;
    }
  }
  const key = JSON.stringify({
    status: s.status, pi: s.page_index, pc: s.page_count,
    t: s.title, p: s.prompt,
    // Rev-count controls which hints show; unlock countdowns tick
    // server-side per snapshot push so re-render is already implied.
    hnts: (s.hints || []).map((h) => h.unlocks_in_seconds),
    rev: hintsRevealedFor(s),
    img: (s.images || []).map((i) => i.url),
    aud: (s.audio || []).map((a) => a.url),
    gate: s.gate ? s.gate.reached : null,
    team: s.team_name, adv: s.adventure_title,
    // Include no_answer so a puzzle flipping between answer/no-answer
    // modes rebuilds the submit dock instead of being deduped.
    na: !!s.no_answer,
    // Brand strip is part of the rendered chrome — re-render when
    // either the logo URL or the org name changes (e.g. an admin
    // uploads a new logo mid-event).
    olu: s.org_logo_url || '', oan: s.org_name || '',
  });
  if (key === lastRenderKey) return;
  lastRenderKey = key;
  // Anchor for the hint countdown ticker — we use this to decrement
  // server-supplied unlocks_in_seconds locally between snapshots.
  hintTickerAnchor = Date.now();

  app.replaceChildren();
  const playing = s.status === 'running';
  const hintBtn = playing ? renderHintButton(s) : null;
  // Runbar layout: [☰] [progress] [hint?] [brand?]. Hamburger on
  // the left (matches GitHub / Slack mobile patterns); progress in
  // the middle via flex space-between distribution; hint and the
  // owning-org brand chrome (logo + name) on the right. The brand
  // shares this row instead of getting its own strip above so the
  // puzzle content sits ~2rem higher on small screens.
  // The state pill was removed earlier — main content already
  // conveys state (waiting card / paused paragraph / completion
  // summary). Title + team moved into the hamburger drawer.
  //
  // Progress guard: page_index / page_count can briefly arrive as
  // null/undefined during a fresh state push (the server rebuilds
  // the snapshot after a puzzle reorder, and the field arrives a
  // tick later than `status: running`). Without this guard the
  // template substituted "NaN/2" for the missing index.
  const idx = Number.isFinite(s.page_index) ? s.page_index : null;
  const total = Number.isFinite(s.page_count) ? s.page_count : null;
  const showProgress = playing && idx !== null && total !== null && total > 0;
  const progress = showProgress
    ? el('span', { class: 'progress' }, t('Puzzle {{i}}/{{n}}', { i: idx + 1, n: total }))
    : el('span', { class: 'progress empty' }, '');
  const actions = el('div', { class: 'actions' });
  if (hintBtn) actions.append(hintBtn);
  const brand = renderRunbarBrand(s);
  const bar = el('div', { class: 'runbar' },
    buildMenuButton(s),
    progress,
    actions,
    ...(brand ? [brand] : []));
  app.append(bar);

  // Welcome screen shown once per (adventure, team, slot). Runs
  // before the start-beat check so we can defer to it when both
  // would fire on the same waiting → running transition.
  maybeShowWelcome(s);

  // Event-start ceremony: a brief "Starting…" beat the very first
  // time status flips from waiting to running. Skipped in preview
  // (no waiting state ever lands there) and skipped when the
  // welcome overlay is up — welcome is the more substantial
  // ceremony, no need to stack.
  if (
    !startBeatShown
    && lastStatus === 'waiting'
    && s.status === 'running'
    && !s.preview
    && !document.querySelector('.welcome')
  ) {
    startBeatShown = true;
    showStartBeat(s);
  }
  lastStatus = s.status;

  if (s.status === 'waiting')  { hideSubmitDock(); app.append(buildWaitingCard(s)); return; }
  if (s.status === 'paused')   { hideSubmitDock(); app.append(buildPausedCard()); return; }
  if (s.status === 'completed'){ hideSubmitDock(); renderCompleted(s); return; }
  if (s.status === 'cancelled' || s.status === 'canceled') {
    hideSubmitDock();
    app.append(el('div', { class: 'card' },
      el('h3', {}, t('Event cancelled')),
      el('p', { class: 'muted' },
        t('The arranger cancelled this event. Reach out to them for next steps; nothing more to do here.'))));
    return;
  }

  // Wrap the puzzle's body in one block so the entrance animation
  // moves the whole unit together (title, images, audio, prompt).
  // Animating each element separately would stagger and feel busy
  // on a small screen; one cohesive fade + slide reads as a clean
  // page turn.
  const block = el('div', { class: 'puzzle-block' });
  if (s.title) block.append(el('h3', {}, s.title));
  if (Array.isArray(s.images)) {
    // im.alt is the author's text alternative; empty string keeps
    // decorative semantics (screen readers skip the <img>).
    for (const im of s.images) block.append(el('img', { class: 'puzzle-img', src: im.url, alt: im.alt || '', loading: 'lazy', decoding: 'async' }));
  }
  if (Array.isArray(s.audio)) {
    // Native <audio controls> — no autoplay (browsers block silent
    // autoplay on mobile anyway, and surprising audio is hostile UX).
    // The author's description, when present, surfaces as a small
    // caption below the player so users who can't hear still get
    // context.
    for (const au of s.audio) {
      const wrap = el('div', { class: 'puzzle-audio' });
      const a = el('audio', { controls: true, preload: 'metadata' });
      const src = el('source', { src: au.url });
      if (au.mime_type) src.type = au.mime_type;
      a.append(src);
      wrap.append(a);
      if (au.description) wrap.append(el('p', { class: 'puzzle-audio-desc muted' }, au.description));
      block.append(wrap);
    }
  }
  // Prompt comes from the server already rendered to HTML (goldmark,
  // raw HTML escaped). Nested p/ul/ol/etc inherit typography from
  // the .prompt wrapper.
  block.append(el('div', { class: 'prompt', html: s.prompt || '' }));
  app.append(block);
  applyPuzzleEntrance(block, s);

  // Hints sit behind a small "?" affordance (runbar, top-right).
  // No countdown on the main view — tapping it opens a sheet with
  // already-revealed hints and a "reveal next" action when the
  // next one is ready.

  // Gated puzzles don't get a separate "walk to location" card — the
  // sticky submit dock at the bottom is the only action surface. For
  // no-answer gated puzzles the dock already shows "I'm here" instead
  // of "Continue"; for text-answer puzzles the player just submits and
  // gets a rebuff if they aren't close enough.
  renderSubmitDock(s);
}

// applyPuzzleEntrance triggers the one-shot fade+slide on a freshly
// built puzzle block. Two important rules:
//
//   1. Only on a real page-index change. Hint-countdown re-renders,
//      pause/resume, and other in-puzzle state pushes leave the
//      block sitting where it is — replaying the entrance every
//      time would feel jittery.
//   2. Hold behind any covering overlay. If celebrate, welcome, or
//      the start-beat is up at render time, the block is held at
//      .pre-enter (opacity 0) and queued. resolvePendingEntrance()
//      promotes it to .entered the moment the overlay clears, so
//      the entrance plays into view instead of invisibly behind.
function applyPuzzleEntrance(block, s) {
  if (!block || !Number.isFinite(s.page_index)) return;
  if (lastEnteredPageIndex === s.page_index) return;
  if (anyCoveringOverlay()) {
    block.classList.add('pre-enter');
    pendingEntrance = { block, pageIndex: s.page_index };
    return;
  }
  block.classList.add('entered');
  lastEnteredPageIndex = s.page_index;
}

// anyCoveringOverlay returns true while a fullscreen "cover" is
// drawing on top of the puzzle area. Used to decide whether the
// fresh puzzle should defer its entrance animation. .celebrate.gone
// is excluded because that selector is added during the overlay's
// fade-out — by the time it shows up, the cover is on its way out
// and the entrance can run alongside it.
function anyCoveringOverlay() {
  return !!document.querySelector('.celebrate:not(.gone), .welcome, .start-overlay');
}

// resolvePendingEntrance is called from the cleanup path of every
// covering overlay (celebrate dismiss timeout, welcome's Let's-go
// click, start-overlay's removal). If a puzzle block is queued, we
// promote it to .entered so the entrance animation plays as the
// cover finishes lifting.
function resolvePendingEntrance() {
  if (!pendingEntrance) return;
  const { block, pageIndex } = pendingEntrance;
  pendingEntrance = null;
  if (!block.isConnected) return;
  block.classList.remove('pre-enter');
  // Force a reflow so the browser registers the .pre-enter starting
  // state before .entered's keyframe runs. Without this, removing
  // and adding classes in the same frame may collapse to no animation.
  void block.offsetWidth;
  block.classList.add('entered');
  lastEnteredPageIndex = pageIndex;
}

// showStartBeat paints the ~1.2s "Starting…" overlay that runs
// once per session at event start. The CSS handles all the timing
// (title fade, bar fill, overlay fade-out); JS just mounts and
// removes. resolvePendingEntrance fires after the overlay is gone
// so puzzle 1's entrance plays into view as the cover lifts.
function showStartBeat(s) {
  // Defensive: never stack two.
  document.querySelectorAll('.start-overlay').forEach((n) => n.remove());
  const overlay = document.createElement('div');
  overlay.className = 'start-overlay';
  overlay.setAttribute('role', 'status');
  overlay.setAttribute('aria-live', 'polite');
  const head = document.createElement('h1');
  head.textContent = s.adventure_title || t('Starting…');
  const bar = document.createElement('div');
  bar.className = 'start-bar';
  bar.append(document.createElement('i'));
  overlay.append(head, bar);
  document.body.append(overlay);
  // CSS keyframe schedule: title 0.08–0.46s, bar 0.20–0.90s,
  // overlay fade-out starts at 1.0s and runs 0.28s. Total ~1.28s;
  // remove just after the fade-out completes.
  setTimeout(() => {
    overlay.remove();
    resolvePendingEntrance();
  }, 1300);
}

// renderSubmitDock always renders into the same sticky container at the
// bottom so the input field and button stay in a fixed spot between
// puzzles. When the puzzle has no accept list (state.no_answer) the
// dock collapses to a single Continue button that tells the server to
// advance without an answer-match attempt.
// previewHintCounts is an in-memory per-page counter used ONLY in
// preview mode. The live game persists reveals server-side via
// /api/play/hint; a module-level Map keeps the preview's clean-slate
// behaviour without touching localStorage.
const previewHintCounts = new Map();

// localHintCount mirrors the server's count between WS pushes so a
// reveal click immediately repaints the sheet rather than waiting
// for the next state push. Keyed by page_index because pages can
// change underneath us when a team-mate finishes a puzzle.
const localHintCount = new Map();

function hintsRevealedFor(s) {
  if (s && s.preview) {
    return previewHintCounts.get(s.page_index || 0) || 0;
  }
  const local = localHintCount.get(s.page_index || 0);
  const server = s.hints_revealed || 0;
  // Keep whichever is higher: server is authoritative post-WS-push,
  // but a just-clicked Reveal might not yet have pulled state back.
  return Math.max(local || 0, server);
}

function setHintsRevealed(s, n) {
  if (s && s.preview) {
    previewHintCounts.set(s.page_index || 0, n);
    return;
  }
  localHintCount.set(s.page_index || 0, n);
}

// revealNextHint POSTs to the server and updates the local mirror.
// Returns the new count (or null on failure so the caller can keep
// the sheet open with the previous state intact).
async function revealNextHint(s, hintIndex) {
  if (s && s.preview) {
    const next = (previewHintCounts.get(s.page_index || 0) || 0) + 1;
    previewHintCounts.set(s.page_index || 0, next);
    return next;
  }
  // Idempotency: if the request fails mid-flight and the user
  // taps again, the same client_action_id lets the server replay
  // the original response instead of double-counting.
  const r = await api('/api/player/hint', {
    method: 'POST',
    body: JSON.stringify({ hint_index: hintIndex, client_action_id: clientActionId() }),
  });
  if (r.status === 200 && typeof r.body?.hints_revealed === 'number') {
    setHintsRevealed(s, r.body.hints_revealed);
    // Stash the freshly-revealed body locally so the hint sheet
    // re-renders with text immediately. The state DTO doesn't ship
    // text_html for hints below the reveal threshold, so without
    // this merge the card would flash empty until the next WS
    // state push lands. Server will ship the same body via state
    // shortly after; the merge is a redundant-but-fast warmup.
    if (r.body.revealed_text && Array.isArray(s?.hints)) {
      const target = s.hints[hintIndex];
      if (target) target.text_html = r.body.revealed_text;
    }
    // Subtle cue to confirm the reveal landed — same toggle as the
    // celebrate fanfare, quieter so a hint doesn't compete with the
    // reveal-card content the player is about to read.
    playHintCue();
    return r.body.hints_revealed;
  }
  return null;
}

// renderHintButton builds the small "?" affordance shown in the
// top-right of the puzzle area. Tapping it opens a bottom-sheet
// listing already-revealed hints and — if a further hint is
// currently unlocked — a single button to reveal the next one.
// No countdown appears on the main puzzle view; the button itself
// is the only hint UI visible until the player asks for help.
function renderHintButton(s) {
  const hints = s.hints || [];
  if (hints.length === 0) return null;
  const btn = el('button', { class: 'hint-toggle', title: t('Hints'), 'aria-label': t('Hints') });
  btn.append(el('span', { class: 'hint-toggle-glyph' }, '?'));
  const badge = el('span', { class: 'hint-toggle-badge' });
  btn.append(badge);
  // Refresh the badge on every render + every second to reflect
  // "how many hints are ready but unrevealed right now". We don't
  // render the countdown anywhere — only the availability delta.
  //
  // Battery: a previous version pulsed the badge in an infinite
  // 3-second loop while a hint was unread. Players run this for
  // hours outdoors on a single charge, so we replaced the loop
  // with a one-shot pulse fired the moment the ready count first
  // increases. The badge stays prominent via colour + count after
  // the pulse ends.
  let prevReady = 0;
  const refreshBadge = () => {
    const revealed = hintsRevealedFor(s);
    const elapsed = Math.max(0, Math.floor((Date.now() - hintTickerAnchor) / 1000));
    let ready = 0;
    for (let i = revealed; i < hints.length; i++) {
      if ((hints[i].unlocks_in_seconds || 0) - elapsed <= 0) ready++;
    }
    if (ready > 0) {
      badge.textContent = String(ready);
    } else {
      badge.textContent = '';
    }
    if (ready > prevReady) {
      // Restart the one-shot animation by removing then re-adding
      // the class with a forced reflow between. Without this the
      // browser collapses identical class lists into no animation.
      badge.classList.remove('just-ready');
      void badge.offsetWidth;
      badge.classList.add('just-ready');
    }
    prevReady = ready;
  };
  refreshBadge();
  const tick = () => {
    if (!btn.isConnected) return;
    refreshBadge();
    setTimeout(tick, 1000);
  };
  setTimeout(tick, 1000);
  btn.addEventListener('click', () => openHintSheet(s));
  return btn;
}

// openHintSheet mounts a bottom-sheet overlay with the revealed
// hints and (when a new one is ready) a Reveal button. Dismisses on
// backdrop click, close button, or Esc. Kept plain DOM to avoid a
// dependency on a modal library.
function openHintSheet(s) {
  document.querySelectorAll('.hint-sheet-back').forEach((n) => n.remove());
  const hints = s.hints || [];
  let revealed = Math.min(hintsRevealedFor(s), hints.length);

  const back = el('div', { class: 'hint-sheet-back' });
  const sheet = el('div', { class: 'hint-sheet' });
  back.append(sheet);
  let undoModal = null;
  const close = () => {
    if (undoModal) undoModal();
    back.remove();
    document.removeEventListener('keydown', onKey);
  };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  back.addEventListener('click', (e) => { if (e.target === back) close(); });

  const drawBody = () => {
    sheet.replaceChildren();
    sheet.append(el('div', { class: 'hint-sheet-head' },
      el('h3', {}, hints.length > 1 ? t('Hints') : t('Hint')),
      el('button', { class: 'hint-sheet-close', 'aria-label': t('Close'), on: { click: close } }, '×')));

    const body = el('div', { class: 'hint-sheet-body' });
    if (revealed === 0) {
      body.append(el('p', { class: 'muted' },
        t('Tap below to reveal your first hint. Use them sparingly — you can always come back.')));
    }
    for (let i = 0; i < revealed; i++) {
      const h = hints[i];
      const card = el('div', { class: 'hint-revealed' });
      card.append(el('div', { class: 'hint-label' },
        hints.length > 1 ? t('Hint {{i}}/{{n}}', { i: i + 1, n: hints.length }) : t('Hint')));
      card.append(el('div', { class: 'hint-body', html: h.text_html || '' }));
      // Per-hint images, only painted on revealed cards. The serve
      // route also enforces the reveal gate server-side, so a player
      // who hand-rolls the URL still gets a 403 on locked hints.
      if (h.images && h.images.length) {
        const grid = el('div', { class: 'hint-images' });
        for (const im of h.images) {
          grid.append(el('img', { src: im.url, alt: im.alt || '', loading: 'lazy', decoding: 'async' }));
        }
        card.append(grid);
      }
      // Per-hint audio: same reveal gate as the images. Native
      // <audio controls>; the description (when present) renders
      // under the player as a transcript fallback.
      if (h.audio && h.audio.length) {
        for (const au of h.audio) {
          const wrap = el('div', { class: 'hint-audio' });
          const a = el('audio', { controls: true, preload: 'metadata' });
          const src = el('source', { src: au.url });
          if (au.mime_type) src.type = au.mime_type;
          a.append(src);
          wrap.append(a);
          if (au.description) wrap.append(el('p', { class: 'hint-audio-desc muted' }, au.description));
          card.append(wrap);
        }
      }
      body.append(card);
    }
    sheet.append(body);

    // Footer action: reveal next if available.
    if (revealed < hints.length) {
      const next = hints[revealed];
      const elapsed = Math.max(0, Math.floor((Date.now() - hintTickerAnchor) / 1000));
      const remaining = Math.max(0, (next.unlocks_in_seconds || 0) - elapsed);
      if (remaining <= 0) {
        const cta = el('button', { class: 'hint-sheet-cta' },
          revealed === 0 ? t('Reveal hint') : t('Reveal next hint'));
        cta.addEventListener('click', async () => {
          const targetIndex = revealed;
          cta.disabled = true;
          const n = await revealNextHint(s, targetIndex);
          cta.disabled = false;
          if (n === null) {
            // Server refused (event paused mid-reveal, etc.). Surface
            // a soft hint without aborting the sheet — the next state
            // push or a retry will recover.
            cta.textContent = t('Couldn\'t reveal — tap to retry');
            return;
          }
          revealed = n;
          drawBody();
        });
        sheet.append(cta);
      } else {
        // Locked: tell the player another one's coming without a loud
        // countdown. Plain sentence, muted.
        sheet.append(el('p', { class: 'muted hint-sheet-locked' },
          t('The next hint isn\'t ready yet. Keep trying for a little longer.')));
      }
    }
  };
  drawBody();
  document.body.append(back);
  // Dialog scaffolding — focus moves into the sheet, Tab is trapped
  // inside, Esc + backdrop click already handled above. Initial focus
  // lands on the close button (always present); when there's a Reveal
  // CTA, the user can Tab to it. Restores focus to the runbar Hint
  // button on close.
  undoModal = wireModal(sheet, {
    labelledBy: '.hint-sheet-head h3',
    initialFocus: '.hint-sheet-close',
  });
}

// hintTickerAnchor is the wall-clock time of the last state snapshot;
// we subtract it from Date.now() to decrement the server-supplied
// unlocks_in_seconds locally so downstream computations (badge
// refresh, sheet button gating) tick without waiting for the next
// WebSocket push. Reset on every render() call.
let hintTickerAnchor = Date.now();

function renderSubmitDock(s) {
  let dock = document.getElementById('submit-dock');
  if (!dock) {
    dock = document.createElement('div');
    dock.id = 'submit-dock';
    dock.className = 'submit-dock';
    document.body.append(dock);
    applyBrandToScope(dock);
  }
  dock.replaceChildren();
  submitInputEl = null;
  currentGatedButton = null;
  currentGatedRadius = 0;
  currentGpsHelpEl = null;

  // Spoiler-free preview (buyer / share-holder): the server stripped
  // the accept list, so a typed-answer dock would either always reject
  // or always accept — both misleading. Replace it with a single
  // "Next puzzle" button that walks the arranger through the prompts
  // without any answer mechanic. No-answer puzzles render their usual
  // Continue button via the branch below — those don't have an accept
  // list to begin with, so spoiler-free doesn't change them.
  if (previewState && previewState.spoilerFree && !(s && s.no_answer)) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = previewState.pageIndex + 1 >= previewState.pageCount
      ? t('Finish preview')
      : t('Next puzzle');
    const result = document.createElement('p');
    result.className = 'result muted';
    const wrap = document.createElement('div');
    wrap.className = 'dock-single';
    wrap.append(button, result);
    dock.append(wrap);
    submitResultEl = result;
    button.addEventListener('click', () => {
      const nextIdx = previewState.pageIndex + 1;
      if (nextIdx >= previewState.pageCount) {
        renderCompletion({ adventure_title: s?.adventure_title || '', completed: true });
        return;
      }
      loadPreviewPage(nextIdx);
    });
    return;
  }

  if (s && s.no_answer) {
    // No-answer puzzles advance with a single button tap instead of a
    // typed answer. Gated ones need the team to be within the radius,
    // so the label flips to "I'm here" and the click also force-pings
    // the latest GPS fix so the server's gate check sees fresh data.
    const gatedUnreached = s.gate && !s.gate.reached;
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = gatedUnreached ? t("Check location · I'm here") : t('Continue');
    const result = document.createElement('p');
    result.className = 'result muted';
    result.setAttribute('role', 'status');
    result.setAttribute('aria-live', 'polite');
    const wrap = document.createElement('div');
    wrap.className = 'dock-single';
    wrap.append(button, result);
    // GPS freshness indicator — only meaningful when the puzzle is
    // gated, where staleness directly explains why the gate isn't
    // unlocking. A small line under the button refreshes every
    // second via a self-stopping ticker.
    if (gatedUnreached) {
      const fresh = document.createElement('p');
      fresh.className = 'result muted';
      fresh.style.fontSize = '.75rem';
      fresh.style.margin = '.15rem 0 0';
      wrap.append(fresh);
      currentGpsFreshnessEl = fresh;
      const tick = () => {
        if (!fresh.isConnected) return;
        renderGpsFreshness();
        setTimeout(tick, 1000);
      };
      tick();
    } else {
      currentGpsFreshnessEl = null;
    }
    // Empty by default — populated by renderGpsHelp when a permission /
    // signal error lands. Outside .dock-single so its full-width retry
    // button doesn't squeeze the result line.
    const gpsHelp = document.createElement('div');
    gpsHelp.className = 'gps-help';
    gpsHelp.style.display = 'none';
    dock.append(wrap, gpsHelp);
    submitResultEl = result;
    currentGpsHelpEl = gpsHelp;
    // Lock the gated advance button until the fix is precise enough
    // for the server's gate check to produce a meaningful answer.
    if (gatedUnreached) {
      currentGatedButton = button;
      currentGatedRadius = s.gate.radius_m || 0;
      updateGateLock();
    } else {
      // Non-gated continue still benefits from the help surface (the
      // gated button branch above already calls it).
      renderGpsHelp();
    }
    button.addEventListener('click', () => {
      if (previewState) {
        // Preview mode: gated puzzles run a local distance check against
        // either the spoofed test position (debug strip's "Set test
        // location") or, lacking that, the browser's real fix — so the
        // arranger can verify the radius works without travelling. A
        // miss rebuffs (same animation a real 403 would trigger);
        // ungated continues advance silently.
        if (gatedUnreached) {
          const gate = lastState && lastState.gate;
          const fix = previewSpoofedFix || lastFix;
          if (!fix || !gate || typeof gate.lat !== 'number') {
            advanceMode = 'gated';
            onAnswerResult({ accepted: false, completed: false });
            return;
          }
          const distM = haversineMeters(fix.lat, fix.lng, gate.lat, gate.lng);
          const within = distM <= (gate.radius_m || 0);
          advanceMode = 'gated';
          onAnswerResult({
            accepted: within,
            completed: within && previewState.pageIndex + 1 >= previewState.pageCount,
          });
          if (within && previewState.pageIndex + 1 < previewState.pageCount) {
            setTimeout(() => loadPreviewPage(previewState.pageIndex + 1), 1400);
          }
          return;
        }
        // Ungated continue: advance locally as if the server said yes,
        // without any animations (per the no-answer rule). Mirror the
        // gated branch and handlePreviewSubmit by scheduling the
        // next-page load — without it the arranger taps Continue but
        // the page never advances, so they're stuck on whichever
        // no-answer puzzle they're previewing.
        advanceMode = 'silent';
        const completedAll = previewState.pageIndex + 1 >= previewState.pageCount;
        onAnswerResult({ accepted: true, completed: completedAll });
        if (!completedAll) {
          setTimeout(() => loadPreviewPage(previewState.pageIndex + 1), 1400);
        }
        return;
      }
      // Gated: send the latest fix first so the server's gate check
      // doesn't race a stale ping cycle. Silent advance mode for clean
      // gates, "gated" mode so a 403 triggers the rebuff animation.
      if (gatedUnreached) {
        advanceMode = 'gated';
        if (lastFix) sendPing();
      } else {
        advanceMode = 'silent';
      }
      const sent = wsSendOrQueue('advance', {});
      if (!sent) {
        // Queued — let the player know the press registered. The
        // advance mode stays so the rebuff/celebrate path fires once
        // the server replies after the reconnect.
        result.className = 'result muted';
        result.textContent = t('Offline — will send the moment you reconnect.');
      }
    });
    return;
  }

  const input = document.createElement('input');
  input.name = 'a';
  input.placeholder = previewState ? t('Try an answer (preview)') : t('Your answer');
  input.autocomplete = 'off';
  input.required = true;
  // iOS Safari aggressively auto-capitalises and autocorrects free-text
  // input. Puzzle answers are case-insensitive on the server side, but
  // the player sees their typing being mangled mid-attempt — "shed" →
  // "She'd", "rosa" → "Rosa", and the like. Disabling those, plus
  // setting enterkeyhint=send so the soft keyboard's return key
  // labels itself "Send" instead of the default "return".
  input.setAttribute('autocapitalize', 'off');
  input.setAttribute('autocorrect', 'off');
  input.setAttribute('spellcheck', 'false');
  input.setAttribute('enterkeyhint', 'send');
  // Screen-reader users hear the placeholder, but a real label is
  // strictly correct + survives placeholder localisation if any
  // assistive tech ever ignores it.
  input.setAttribute('aria-label', t('Your answer'));
  const button = document.createElement('button');
  button.type = 'submit';
  button.textContent = t('Submit');
  // Initial lockout: the input is freshly created and empty, so the
  // submit button starts disabled. Toggling on every keystroke keeps
  // the lockout honest — paste, IME composition, and cut all fire
  // 'input' events. updateAnswerSubmitState is also called by
  // setSubmitDisabled(false) so a rate-limit cooldown can't re-arm
  // submit while the field stays empty.
  button.disabled = !input.value.trim();
  input.addEventListener('input', updateAnswerSubmitState);
  const result = document.createElement('p');
  result.className = 'result muted';
  // aria-live so the rate-limit countdown / "saved while offline" /
  // gate rejection lines are announced when they appear, not silently
  // updated under the user's nose.
  result.setAttribute('role', 'status');
  result.setAttribute('aria-live', 'polite');
  const form = document.createElement('form');
  // Optional QR-scan button. Only added when the browser exposes the
  // BarcodeDetector API (Chrome 83+, Edge, Safari 17+, Android Chrome).
  // The button submits the decoded text as if it were typed — the
  // server-side answer matcher then evaluates it against the puzzle's
  // accept list, so a scan is "an immediate guess".
  const qrBtn = qrSupported() ? createQrButton(input, result) : null;
  if (qrBtn) {
    form.classList.add('has-qr');
    form.append(input, button, qrBtn, result);
  } else {
    form.append(input, button, result);
  }
  dock.append(form);
  submitInputEl = input;
  submitResultEl = result;
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    // Empty-input guard. The submit button is disabled when the
    // input is empty (see updateAnswerSubmitState), but pressing
    // Enter inside the input can still fire a form submit in some
    // browsers even with the button disabled. Bail before the WS
    // round-trip rather than asking the server to reject a blank.
    if (!input.value.trim()) return;
    if (previewState) { handlePreviewSubmit(input.value); return; }
    if (!wsSendOrQueue('answer', { answer: input.value })) {
      // Queued — clear the input optimistically so the player can
      // tell their press landed, and surface a status line so the
      // disappearing input doesn't read as a silent failure.
      result.className = 'result muted';
      result.textContent = t('Offline — will send the moment you reconnect.');
      input.value = '';
    }
  });
  // Push the dock's measured height into the body padding reserve.
  // RAF defers the read until after layout settles so a freshly-
  // mounted dock isn't measured as 0×0.
  requestAnimationFrame(updateDockHeightVar);
}

// One-shot listener: orientation changes / browser-chrome auto-hide
// resize the viewport without re-rendering the dock, so re-measure.
window.addEventListener('resize', () => requestAnimationFrame(updateDockHeightVar));

// Orientation change forces a full re-render. The state-keyed
// dedupe in render() correctly suppresses redundant repaints on
// every WebSocket push, but it also suppresses an explicit
// re-render after rotation (the state didn't change — only the
// viewport did). Without this, a player who rotates mid-puzzle
// keeps the layout that was baked at the previous orientation
// until the next server push lands. Clear lastRenderKey and
// re-paint with whatever state we last received.
//
// requestAnimationFrame defers one frame so the browser's viewport
// + CSS env(safe-area-inset-*) update lands before render measures
// against it. Both event names are wired because Safari < 16.4
// only fires the legacy `orientationchange` while modern browsers
// expose `screen.orientation.change`; calling render twice is a
// cheap no-op past the second tick (lastRenderKey rebuilds).
function reflowAfterOrientationChange() {
  if (!lastState) return;
  lastRenderKey = '';
  requestAnimationFrame(() => render(lastState));
}
window.addEventListener('orientationchange', reflowAfterOrientationChange);
if (window.screen?.orientation?.addEventListener) {
  screen.orientation.addEventListener('change', reflowAfterOrientationChange);
}

// handlePreviewSubmit routes a preview answer through the same
// onAnswerResult the real player uses — arrangers see the real celebrate
// overlay on a correct answer (or the finale copy on the last puzzle)
// and the rebuff animation on a wrong one. With ?debug=1 the accept list
// is served alongside the puzzle so the match is real; without debug
// we let any non-empty answer through so the arranger can walk the
// adventure in order without knowing the answers. After a correct
// answer we auto-advance to the next puzzle once celebrate finishes,
// mirroring the WebSocket state push a real player would receive.
function handlePreviewSubmit(answer) {
  const needle = (answer || '').trim().toLowerCase();
  if (!needle) return;
  // Mirror the real applyAnswer normalisation: trim + lowercase, and
  // collapse internal whitespace runs so "  HELLO  world" matches
  // "hello world". Regex entries are anchored ^...$ + case-insensitive
  // to match the server's CheckAnswer; bad patterns silently miss
  // since the server already rejects them at save time.
  const norm = (s) => (s || '').trim().toLowerCase().replace(/\s+/g, ' ');
  const accept = Array.isArray(previewState.accept) ? previewState.accept : [];
  const dec = norm(needle);
  const accepted = accept.length > 0 && accept.some((a) => {
    if (!a) return false;
    if (a.regex) {
      try { return new RegExp('^(?:' + a.text + ')$', 'i').test(dec); }
      catch { return false; }
    }
    return norm(a.text || '') === dec;
  });
  const completed = accepted && previewState.pageIndex + 1 >= previewState.pageCount;
  onAnswerResult({ accepted, completed });
  if (accepted && !completed) {
    // Wait until the inter-puzzle celebrate overlay has settled (~1.8s)
    // before swapping the page so the arranger sees the win land.
    const nextIdx = previewState.pageIndex + 1;
    setTimeout(() => loadPreviewPage(nextIdx), 1400);
  }
}

// loadPreviewPage refetches a different puzzle from the preview endpoint
// and re-renders in place. Used by the auto-advance after a correct
// answer; the chrome's Prev/Next buttons still do a full reload because
// a debug-toggle or slug change needs a fresh bootstrap anyway.
async function loadPreviewPage(pageIdx) {
  const qs = new URLSearchParams(location.search);
  const slug = qs.get('preview');
  if (!slug) return;
  const apiQs = new URLSearchParams({ page: String(pageIdx) });
  if (qs.get('debug') === '1') apiQs.set('debug', '1');
  const r = await api(`/api/admin/adventures/${encodeURIComponent(slug)}/preview?${apiQs}`);
  if (r.status !== 200) return;
  qs.set('page', String(pageIdx));
  history.replaceState(null, '', '?' + qs.toString());
  previewState = {
    // Authors get an accept list; buyers / share-holders get a
    // spoiler-free walkthrough where accept is omitted server-side.
    // The submit dock branches on spoilerFree to swap the typed
    // answer dock for a "Next puzzle" walkthrough — see
    // renderSubmitDock's spoiler-free guard.
    accept: Array.isArray(r.body.accept) ? r.body.accept : [],
    spoilerFree: !!r.body.spoiler_free,
    pageIndex: r.body.page_index ?? 0,
    pageCount: r.body.page_count ?? 0,
  };
  lastRenderKey = null; // force render() past its dedupe check
  render(r.body);
  renderPreviewChrome(r.body);
}

// onAnswerResult handles the server's reply to an {kind:"answer"} push.
// The state refresh that follows a correct answer arrives as a separate
// "state" frame (pushed because the hub fires on answer); the celebrate
// overlay covers the re-render while it plays.
function onAnswerResult(r) {
  // Consume any pending advance-mode flag (handleAnswerError reads
  // it on the failure path to decide whether to play the gated
  // rebuff). The success branch celebrates unconditionally — see
  // below.
  advanceMode = 'none';
  if (submitResultEl) {
    // Verdict text would be redundant now that celebrate/rebuff carry
    // the feedback — leave the line blank and let the overlay speak.
    // The element still exists for network errors ("Disconnected…").
    submitResultEl.className = 'result muted';
    submitResultEl.textContent = '';
  }
  if (r.accepted) {
    if (submitInputEl) { submitInputEl.value = ''; submitInputEl.blur(); }
    // Celebrate fires on every accepted advance — typed answers,
    // gated "I'm here" continues, and plain no-answer Continues —
    // so the player gets the same "you moved on" feedback regardless
    // of puzzle shape. We previously suppressed the overlay on the
    // ungated Continue path (advanceMode === 'silent'); arrangers
    // and players found the silent transition jarring.
    celebrate(r.completed);
  } else {
    // Wrong-answer guidance: nudge toward a hint when one is unlocked
    // but not yet revealed. Avoids "Not quite" being the only feedback
    // a stuck team gets.
    rebuff(wrongAnswerGuidance(lastState));
    // Return focus to the input + select all so the player can
    // immediately retype without a tap. Mobile keyboards re-open
    // automatically on focus, which is the desired flow.
    if (submitInputEl) {
      submitInputEl.focus();
      try { submitInputEl.select(); } catch { /* element type may not support */ }
    }
  }
}

// wrongAnswerGuidance returns a short hint-toward-hint message when
// the puzzle has unrevealed unlocked hints, or '' otherwise. The
// rebuff overlay subtitles itself with whichever string this returns.
function wrongAnswerGuidance(s) {
  if (!s || !Array.isArray(s.hints) || s.hints.length === 0) return '';
  const revealed = hintsRevealedFor(s);
  if (revealed >= s.hints.length) return '';
  const elapsed = Math.max(0, Math.floor((Date.now() - hintTickerAnchor) / 1000));
  const next = s.hints[revealed];
  const remaining = Math.max(0, (next.unlocks_in_seconds || 0) - elapsed);
  if (remaining > 0) return '';
  return revealed === 0
    ? t('Stuck? Tap the ? for a hint.')
    : t('Stuck? There\'s another hint ready.');
}

// celebrate renders a full-screen success overlay with a popped ring, a
// drawn checkmark, and a burst of confetti. The `finished` flag tweaks
// copy so the final puzzle lands differently from the intermediate ones.
function celebrate(finished) {
  // Audio + haptic cue lands at overlay-mount so the tone reaches
  // the player's ear during the pop animation, not after it. Gated
  // on the "Sound & vibration" preference; silent otherwise.
  playCorrectCue();
  const overlay = document.createElement('div');
  overlay.className = 'celebrate';
  // Screen-reader path: head + sub are already on screen, but without
  // role/aria-live the overlay's celebratory animation is silent for
  // a non-sighted player. role="status" with polite live region
  // queues "Correct! Next puzzle coming up…" after whatever the
  // reader was already saying.
  overlay.setAttribute('role', 'status');
  overlay.setAttribute('aria-live', 'polite');
  overlay.setAttribute('aria-atomic', 'true');
  const ring = document.createElement('div');
  ring.className = 'ring';
  ring.setAttribute('aria-hidden', 'true');
  ring.innerHTML = '<svg class="check" viewBox="0 0 100 100"><path d="M22 52 l18 18 l38 -38"/></svg>';
  const head = document.createElement('div');
  head.className = 'head';
  head.textContent = finished ? t('Adventure complete!') : t('Correct!');
  const sub = document.createElement('div');
  sub.className = 'sub';
  sub.textContent = finished ? t('Great work — you made it to the end.') : t('Next puzzle coming up…');
  overlay.append(ring, head, sub);

  // Confetti.
  const colours = ['#e24080', '#f5c452', '#7fd17b', '#60a5fa', '#a78bfa', '#22d3ee'];
  const count = finished ? 80 : 48;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'piece';
    const dx = (Math.random() * 2 - 1) * 380;
    const rot = (Math.random() * 1440 - 720);
    p.style.left = Math.random() * 100 + '%';
    p.style.setProperty('--c', colours[i % colours.length]);
    p.style.setProperty('--dx', dx + 'px');
    p.style.setProperty('--rot', rot + 'deg');
    p.style.setProperty('--d', (Math.random() * 250) + 'ms');
    overlay.append(p);
  }
  document.body.append(overlay);
  // Dismiss: short for inter-puzzle, longer when the adventure ends.
  const total = finished ? 3500 : 1800;
  setTimeout(() => overlay.classList.add('gone'), total);
  // Promote any queued puzzle-block entrance the moment the overlay
  // is removed so the new puzzle eases in as the cover lifts.
  setTimeout(() => {
    overlay.remove();
    resolvePendingEntrance();
  }, total + 500);
}

// rebuff is celebrate's mirror for a wrong guess — shorter and smaller
// so the player isn't punished by a long overlay between tries. pointer
// events stay off, so the submit dock is usable again the instant the
// overlay fades.
function rebuff(guidance) {
  const overlay = document.createElement('div');
  overlay.className = 'rebuff';
  overlay.setAttribute('role', 'status');
  overlay.setAttribute('aria-live', 'polite');
  overlay.setAttribute('aria-atomic', 'true');
  const disc = document.createElement('div');
  disc.className = 'disc';
  disc.setAttribute('aria-hidden', 'true');
  disc.innerHTML = '<svg class="cross" viewBox="0 0 100 100">'
    + '<path d="M28 28 L72 72"/><path d="M72 28 L28 72"/>'
    + '</svg>';
  const head = document.createElement('div');
  head.className = 'head';
  head.textContent = t('Not quite');
  overlay.append(disc, head);
  if (guidance) {
    const sub = document.createElement('div');
    sub.className = 'sub';
    sub.textContent = guidance;
    overlay.append(sub);
  }
  document.body.append(overlay);
  const total = 900;
  setTimeout(() => overlay.classList.add('gone'), total);
  setTimeout(() => overlay.remove(), total + 300);
}

// Debug shortcut: Alt+S pops the celebration so you can tweak the visuals
// without actually solving a puzzle. Alt+W re-shows the welcome overlay,
// Alt+C renders the completion summary with placeholder numbers.
//
// Gated behind ?debug=1 so a real player who fat-fingers Alt during an
// answer entry can't drop into a phantom UI state mid-event. Reading
// the flag once and capturing it lets the listener stay declarative.
const DEBUG_KEYS_ENABLED = (() => {
  try { return new URLSearchParams(location.search).get('debug') === '1'; }
  catch { return false; }
})();
if (DEBUG_KEYS_ENABLED) {
  document.addEventListener('keydown', (e) => {
    if (!e.altKey) return;
    if (e.key === 'S' || e.key === 's') {
      e.preventDefault();
      celebrate(e.shiftKey);
      return;
    }
    if (e.key === 'W' || e.key === 'w') {
      e.preventDefault();
      showWelcomeDialog({
        team_name: 'Team Alfa',
        adventure_title: 'Debug preview',
        page_count: 3,
      }, { force: true });
      return;
    }
    if (e.key === 'C' || e.key === 'c') {
      e.preventDefault();
      showDebugSummary();
    }
  });
}

// maybeShowWelcome pops the welcome overlay the first time this slot
// opens this adventure, remembered in localStorage so a refresh doesn't
// re-show it.
function maybeShowWelcome(s) {
  if (!s.adventure_title || !s.team_name || !s.slot_name) return;
  // During pre-start we already show a countdown card in the main view.
  // Stacking the welcome overlay on top would duplicate the same
  // "waiting" message; defer until the event actually starts so the
  // intro + Let's go button lands when the player can act on it.
  if (s.status === 'waiting') return;
  const key = 'zv_welcome_' + [s.adventure_slug || s.adventure_title, s.team_name, s.slot_name].join('|');
  if (localStorage.getItem(key) === '1') return;
  showWelcomeDialog(s, { storageKey: key });
}

function showWelcomeDialog(s, opts = {}) {
  // Drop any leftover overlay (Alt+W pressed twice, etc.).
  document.querySelectorAll('.welcome').forEach((n) => n.remove());

  let undoModal = null;
  const dismiss = () => {
    if (opts.storageKey) localStorage.setItem(opts.storageKey, '1');
    if (undoModal) undoModal();
    document.removeEventListener('keydown', onKey);
    overlay.remove();
    // If render() rendered puzzle 1 underneath while welcome was up,
    // its block was held at .pre-enter — promote it now so it eases
    // into view as welcome clears.
    resolvePendingEntrance();
  };
  const onKey = (e) => { if (e.key === 'Escape') dismiss(); };
  document.addEventListener('keydown', onKey);

  // maybeShowWelcome suppresses the overlay during the 'waiting' state,
  // so by the time we get here the event is live and the CTA can just
  // dismiss. The pre-start countdown lives on buildWaitingCard instead.
  const cta = document.createElement('button');
  cta.textContent = t("Let's go");
  cta.addEventListener('click', dismiss);

  const overlay = el('div', { class: 'welcome' });
  const panel = el('div', { class: 'panel' });
  // First-join name override: arrangers often pre-set generic
  // placeholder names ("Player 3"). The welcome dialog is the
  // natural place to let the player introduce themselves before
  // they start playing. Renames flow through /api/player/me/name
  // and Hub-publish so team-mates and the arranger console see the
  // new name on the next state push.
  const whoLine = el('div', { class: 'who' });
  const renderWho = (slotName) => {
    whoLine.replaceChildren();
    const team = s.team_name || t('your team');
    const slot = slotName || s.slot_name || '';
    if (slot) {
      whoLine.append(
        document.createTextNode(team + ' · '),
        el('span', { class: 'who-slot' }, slot),
        document.createTextNode(' '),
        (() => {
          const renameBtn = document.createElement('button');
          renameBtn.type = 'button';
          renameBtn.className = 'who-rename';
          renameBtn.textContent = t('rename');
          renameBtn.addEventListener('click', async () => {
            const next = (prompt(t('Choose your name:'), slot) || '').trim();
            if (!next || next === slot) return;
            const r = await api('/api/player/me/name', {
              method: 'POST', body: JSON.stringify({ name: next }),
            });
            if (r.status === 200 && r.body?.name) {
              s.slot_name = r.body.name;
              renderWho(r.body.name);
            }
          });
          return renameBtn;
        })());
    } else {
      whoLine.textContent = team;
    }
  };
  renderWho();
  panel.append(
    el('button', {
      class: 'panel-close', type: 'button',
      'aria-label': t('Close'),
      on: { click: dismiss },
    }, '×'),
    el('h2', {}, s.adventure_title || t('Adventure')),
    whoLine);
  // If the adventure author supplied intro text, use it verbatim
  // instead of the built-in welcome paragraph + tips list. Newlines
  // are preserved via the CSS pre-wrap on .intro-custom.
  if (s.intro_text && s.intro_text.trim()) {
    panel.append(el('div', { class: 'intro-custom', html: s.intro_text }));
  } else {
    panel.append(
      el('p', {},
        t('Your team has '), el('strong', {}, String(s.page_count || '?')),
        t(' puzzles to solve. Good luck!')),
      el('h3', { style: 'margin-top:.5rem' }, t('A few quick tips')),
      el('ul', {},
        el('li', {}, t('Read each puzzle carefully — the answer is usually a short word or phrase.')),
        el('li', {}, t('Some puzzles only unlock when you reach a specific place. Your device will show a pin and prompt you to go there.')),
        el('li', {}, t('The submit button is always in the same spot at the bottom of the screen.')),
        el('li', {}, t('Whoever in your team has this link installed can type answers — pick one phone and keep it handy.')),
        el('li', {}, t('Wrong answers don\'t cost you anything — keep trying.'))));
  }
  // Starting-location card. Surfaced regardless of whether the
  // adventure has custom intro text — a player who lands on the
  // magic link before reaching the meeting point benefits from a
  // direct map link more than from another paragraph of prose.
  if (typeof s.start_lat === 'number' && typeof s.start_lng === 'number') {
    const startBox = el('div', { class: 'start-here' });
    startBox.append(el('h3', { style: 'margin:.75rem 0 .25rem' }, t('Start here')));
    if (s.start_label) {
      startBox.append(el('p', { style: 'margin:.15rem 0; font-weight:600' }, s.start_label));
    }
    startBox.append(el('p', { class: 'mono', style: 'margin:.1rem 0; font-size:.85rem; opacity:.75' },
      s.start_lat.toFixed(5) + ', ' + s.start_lng.toFixed(5)));
    const mapsURL = `https://www.openstreetmap.org/?mlat=${s.start_lat}&mlon=${s.start_lng}#map=17/${s.start_lat}/${s.start_lng}`;
    startBox.append(el('a', {
      class: 'start-here-link',
      href: mapsURL, target: '_blank', rel: 'noopener',
      style: 'display:inline-block; margin-top:.4rem',
    }, t('Open in maps')));
    panel.append(startBox);
  }
  panel.append(el('div', { class: 'cta' }, cta));
  overlay.append(panel);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) dismiss();
  });
  document.body.append(overlay);
  // Welcome is a real dialog: aria-labelledby points at the heading,
  // initial focus on the primary CTA so the player can confirm with
  // Enter alone, focus restored on dismiss.
  undoModal = wireModal(panel, {
    labelledBy: 'h2',
    initialFocus: cta,
  });
}

// buildPausedCard distinguishes a mid-event pause from the pre-start
// waiting state. The waiting card carries a countdown / "Ready"
// label in the accent colour; pause uses a warning-toned glyph + a
// different headline so a player glancing at the screen doesn't
// confuse "we haven't started yet" with "we paused 3 minutes in".
function buildPausedCard() {
  const card = el('div', { class: 'prestart-card paused' });
  card.append(
    el('div', { class: 'banner' }, t('Paused')),
    el('div', { class: 'digits soft', style: 'color:var(--gold,#c98a14)' }, '⏸'),
    el('small', {}, t('The arranger paused the event. Stand by.')));
  return card;
}

// buildTeamRemovedCard is shown when the server pushes a "removed"
// frame — the team this slot belongs to was deleted mid-event by
// the arranger. Distinct from the slot-expired and event-cancelled
// cards because the recovery path is different: there's no link to
// retry, the player has to ask the arranger to be re-added.
function buildTeamRemovedCard() {
  const card = el('div', { class: 'prestart-card' });
  card.append(
    el('div', { class: 'banner' }, t('Team removed')),
    el('div', { class: 'digits soft' }, '⊘'),
    el('small', {}, t('The arranger removed your team. Ask them to add you back if this was a mistake.')));
  return card;
}

// buildWaitingCard renders the main-content view for a scheduled run.
// If we know the start time it ticks down in-place; otherwise it
// shows the softer "waiting for the arranger" copy.
function buildWaitingCard(s) {
  const card = el('div', { class: 'prestart-card' });
  card.append(el('div', { class: 'banner' }, t('Starting soon')));
  if (s.scheduled_at) {
    const digits = el('div', { class: 'digits' },
      preStartCountdownText(s.scheduled_at, s.server_now));
    card.append(digits, el('small', {}, t('until the flag drops')));
    // Self-refreshing countdown — stops when the card leaves the DOM.
    // We anchor every tick on the server-side clock so a phone whose
    // system time is ahead of the server doesn't see "0:00" before the
    // event actually starts. serverOffsetMs is updated on every state
    // push (ws.onmessage) so even long pre-event waits stay accurate.
    const target = parsePreStartTarget(s.scheduled_at);
    const tick = () => {
      if (!digits.isConnected) return;
      const now = Date.now() + serverOffsetMs;
      if (now >= target) {
        digits.textContent = t('any moment…');
        return;
      }
      const fakeServerNow = new Date(now).toISOString();
      digits.textContent = preStartCountdownText(s.scheduled_at, fakeServerNow);
      setTimeout(tick, 1000);
    };
    setTimeout(tick, 1000);
  } else {
    // No scheduled_at means the arranger left the start time blank
    // and will press Start when everyone's gathered. The em-dash
    // placeholder is replaced with explanatory copy so the player
    // doesn't read the empty digits as "something is broken".
    card.append(el('div', { class: 'digits soft' }, t('Ready')),
      el('small', {}, t('The event hasn\'t started yet. The arranger will start it when everyone\'s here.')));
  }
  return card;
}

function parsePreStartTarget(scheduledISO) {
  const d = new Date(scheduledISO.includes('T') ? scheduledISO : scheduledISO.replace(' ', 'T') + 'Z');
  return Number.isNaN(d.getTime()) ? 0 : d.getTime();
}

function preStartCountdownText(scheduledISO, serverNowISO) {
  const target = parsePreStartTarget(scheduledISO);
  const now = serverNowISO ? new Date(serverNowISO).getTime() : Date.now();
  const sec = Math.round((target - now) / 1000);
  if (sec <= 0) return t('any moment…');
  const d = Math.floor(sec / 86400);
  const h = Math.floor((sec % 86400) / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  const pad = (n) => String(n).padStart(2, '0');
  if (d > 0) return `${d}d ${pad(h)}:${pad(m)}:${pad(s)}`;
  if (h > 0) return `${pad(h)}:${pad(m)}:${pad(s)}`;
  return `${pad(m)}:${pad(s)}`;
}

// renderCompleted replaces the simple "Adventure complete!" line with a
// richer end-of-run card: team stats, distance, time, right/wrong.
async function renderCompleted(s) {
  const host = el('div', { class: 'summary' });
  // Paint the full layout immediately with em-dash placeholders so
  // the card lands stable behind the celebrate fade-out. The /summary
  // fetch resolves a moment later and we patch the stat values in
  // place. No "Loading your event stats…" intermediate state, no
  // second layout shift, and on a network failure the card stays
  // dignified — the celebration is still the point; the numbers
