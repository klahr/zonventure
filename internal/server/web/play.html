<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zonventure · play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aclonica&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="/i18n.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --accent:        #ad1357;
    --accent-hover:  #951048;
    --accent-fg:     #ffffff;
    --accent-secondary: #ad1357; /* same as --accent by default; per-adventure brand overrides */
    --ink:           #1f3349;
    --success:       #429a3f;
    --danger:        #ff5252;
    --bg:            #fbfbfd;
    --surface:       #ffffff;
    --surface-2:     #f6f6f6;
    --border:        #c6d2e1;
    --border-soft:   #c6d2e166;
    --text:          var(--ink);
    --muted:         #6b7f96;
    --shadow:        0 1px 4px #00000014, 0 2px 8px #00000012;
    --radius:        12px;
    --radius-pill:   32px;
    --font-body:     'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --font-brand:    'Aclonica', 'Vollkorn', Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:          #14202e;
      --surface:     #1f3349;
      --surface-2:   #263d56;
      --border:      #3a5172;
      --border-soft: #3a517266;
      --text:        #e7ecf4;
      --ink:         #e7ecf4;
      --muted:       #9db1cc;
      --accent:      #e24080;
      --accent-hover:#ad1357;
      --success:     #7fd17b;
      --danger:      #ff7b7b;
      --shadow:      0 1px 4px #00000066, 0 2px 12px #00000077;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: var(--font-body);
    font-size: 16px; line-height: 1.5;
    color: var(--text); background: var(--bg);
    margin: 0;
    padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom) + 130px);
    max-width: 640px; margin-left: auto; margin-right: auto;
    -webkit-font-smoothing: antialiased;
  }
  .puzzle-img {
    width: 100%; height: auto; display: block;
    border-radius: var(--radius);
    border: 1px solid var(--border-soft);
    margin: .5rem 0;
    box-shadow: var(--shadow);
  }
  /* Sticky submit bar: always at the bottom of the viewport, same place
     for every puzzle so the player builds muscle memory. */
  .submit-dock {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: .75rem 1rem calc(.75rem + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: blur(8px);
    border-top: 1px solid var(--border-soft);
    z-index: 10;
  }
  .submit-dock form {
    max-width: 640px; margin: 0 auto;
    display: grid; grid-template-columns: 1fr auto; gap: .5rem;
    align-items: stretch;
  }
  .submit-dock input { margin: 0; }
  .submit-dock button { width: auto; padding: .75rem 1.2rem; }
  .submit-dock .result { grid-column: 1 / -1; margin: 0; min-height: 1rem; font-size: .9rem; }
  /* Compact top strip: adventure title + team + progress + status pill in
     one row. Leaves maximum vertical space for the puzzle itself. */
  .runbar {
    display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap;
    padding: .25rem 0 .6rem;
    margin-bottom: .5rem;
    border-bottom: 1px solid var(--border-soft);
    font-size: .85rem;
  }
  .runbar .title {
    font-family: var(--font-brand); color: var(--accent-secondary);
    font-size: 1.05rem; line-height: 1; margin-right: .25rem;
  }
  .runbar .sep { color: var(--muted); }
  .runbar .team { color: var(--ink); font-weight: 700; }
  .runbar .progress { color: var(--muted); font-variant-numeric: tabular-nums; }
  .runbar .status { margin-left: auto; }
  h2 { font-size: .85rem; margin: 1.2rem 0 .4rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  h3 { font-size: 1.05rem; margin: 0 0 .5rem; color: var(--accent-secondary); }
  input {
    font: inherit; width: 100%; padding: .75rem .9rem; margin-bottom: .8rem;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
  }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
  button {
    font: inherit; font-weight: 700; width: 100%;
    padding: .75rem 1.2rem; cursor: pointer;
    background: var(--accent); color: var(--accent-fg);
    border: none; border-radius: var(--radius-pill);
    box-shadow: var(--shadow);
    transition: background 120ms, transform 80ms;
  }
  button:hover { background: var(--accent-hover); }
  button:active { transform: translateY(1px); }
  button.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  button.secondary:hover { background: var(--surface-2); }
  .card {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 1.25rem; margin: .75rem 0;
    box-shadow: var(--shadow);
  }
  .muted { color: var(--muted); }
  .err { color: var(--danger); font-weight: 600; }
  .ok  { color: var(--success); font-weight: 600; }
  .prompt { white-space: pre-wrap; font-size: 1.1rem; line-height: 1.55; color: var(--ink); }
  .pill {
    display: inline-block; padding: .15rem .65rem;
    border-radius: 999px; font-size: .7rem; font-weight: 700;
    background: color-mix(in srgb, var(--accent-secondary) 15%, transparent);
    color: var(--accent-secondary);
    text-transform: uppercase; letter-spacing: .06em;
  }
  .topline {
    display: flex; justify-content: space-between; align-items: baseline;
    padding-bottom: .75rem; margin-bottom: .75rem;
    border-bottom: 1px solid var(--border-soft);
  }
  .topline .who { color: var(--muted); font-size: .9rem; }
  .topline .who strong { color: var(--ink); font-weight: 700; }
  .inline-btn { display: inline-block; width: auto; padding: .35rem .85rem; font-size: .8rem; }

  /* ---------- Welcome overlay (first time in the adventure) ---------- */
  .welcome {
    position: fixed; inset: 0; z-index: 1500;
    display: grid; place-items: center;
    padding: 1rem;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(226,64,128,.18), transparent 55%),
      radial-gradient(ellipse at 100% 100%, rgba(66,154,63,.12), transparent 55%),
      var(--bg);
    animation: welcomeFade .3s ease;
  }
  @keyframes welcomeFade { from { opacity: 0; } to { opacity: 1; } }
  .welcome .panel {
    background: var(--surface); border: 1px solid var(--border-soft);
    border-radius: var(--radius); box-shadow: 0 12px 40px rgba(0,0,0,.25);
    max-width: 520px; width: 100%; padding: 1.5rem;
  }
  .welcome h2 {
    font-family: var(--font-brand); color: var(--accent);
    font-size: 1.8rem; line-height: 1.1; margin: 0 0 .25rem;
  }
  .welcome .who { color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: .75rem; margin-bottom: 1rem; }
  .welcome ul { padding-left: 1.1rem; margin: 1rem 0; }
  .welcome li { margin: .35rem 0; }
  .welcome .cta { margin-top: 1rem; }
  .welcome .cta button[disabled] {
    background: var(--surface-2); color: var(--muted);
    cursor: not-allowed; box-shadow: none;
    font-variant-numeric: tabular-nums;
  }
  .welcome .cta button[disabled]:hover { background: var(--surface-2); }

  /* Pre-start card for the main view (shown once the welcome has been
     dismissed but the run still isn't running). Same countdown idea as
     the welcome button — players can't reach the first puzzle until the
     scheduled time; server enforces this too. */
  .prestart-card {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 2rem 1.25rem;
    margin: 1.5rem auto;
    text-align: center;
    max-width: 420px;
  }
  .prestart-card .banner {
    color: var(--muted); font-weight: 700;
    text-transform: uppercase; letter-spacing: .12em; font-size: .8rem;
    margin-bottom: .75rem;
  }
  .prestart-card .digits {
    font-family: var(--font-brand); color: var(--accent);
    font-size: clamp(2.4rem, 10vw, 3.6rem);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .prestart-card small {
    display: block; color: var(--muted); font-size: .8rem;
    margin-top: .6rem;
  }

  /* ---------- Completion stats ---------- */
  .summary {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 1.25rem; margin-top: 1rem;
  }
  .summary h2 {
    font-family: var(--font-brand); color: var(--accent);
    font-size: 1.6rem; line-height: 1.1; margin: 0 0 .25rem;
  }
  .summary .who { color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: .75rem; margin-bottom: .9rem; }
  .stats-grid {
    display: grid; grid-template-columns: repeat(2, minmax(0,1fr));
    gap: .5rem;
  }
  .stat {
    background: var(--surface-2);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm, 8px);
    padding: .8rem;
    text-align: center;
  }
  .stat .v { font-family: var(--font-brand); color: var(--ink); font-size: 1.4rem; line-height: 1; }
  .stat .l { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; margin-top: .25rem; }

  /* ---------- Puzzle-correct celebration ---------- */
  .celebrate {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(10, 20, 35, .55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    overflow: hidden;
    animation: celebrateFade .25s ease;
  }
  .celebrate.gone { animation: celebrateFadeOut .4s ease forwards; }
  @keyframes celebrateFade    { from { opacity: 0; } to { opacity: 1; } }
  @keyframes celebrateFadeOut { from { opacity: 1; } to { opacity: 0; } }

  .celebrate .ring {
    width: 140px; height: 140px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #7fd17b, var(--success));
    display: grid; place-items: center;
    box-shadow: 0 10px 40px rgba(66,154,63,.45), inset 0 -6px 18px rgba(0,0,0,.18);
    transform: scale(0);
    animation: celebratePop .55s cubic-bezier(.2,1.6,.4,1) .05s forwards;
  }
  @keyframes celebratePop { to { transform: scale(1); } }

  .celebrate .check {
    width: 86px; height: 86px;
  }
  .celebrate .check path {
    fill: none; stroke: #fff; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 80; stroke-dashoffset: 80;
    animation: celebrateDraw .45s .35s ease-out forwards;
  }
  @keyframes celebrateDraw { to { stroke-dashoffset: 0; } }

  .celebrate .head {
    font-family: var(--font-brand);
    color: #fff; font-size: clamp(2rem, 7vw, 3rem);
    margin-top: 1.1rem; letter-spacing: .01em;
    opacity: 0; animation: celebrateRise .4s .55s ease forwards;
  }
  .celebrate .sub {
    color: rgba(255,255,255,.85); font-weight: 600;
    margin-top: .25rem; text-align: center;
    opacity: 0; animation: celebrateRise .4s .75s ease forwards;
  }
  @keyframes celebrateRise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Confetti: small rectangles that drop from above with a horizontal
     drift and a random rotation. Driven by CSS custom properties set
     per-particle from JS. */
  .celebrate .piece {
    position: absolute;
    top: -30px; width: 9px; height: 15px; border-radius: 2px;
    background: var(--c, #e24080);
    transform: translate(0, 0) rotate(0);
    animation: celebrateConfetti 2.2s var(--d, 0ms) cubic-bezier(.25,.75,.45,1) forwards;
    will-change: transform, opacity;
  }
  @keyframes celebrateConfetti {
    0%   { opacity: 0; transform: translate(0, -40px) rotate(0); }
    6%   { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--dx, 0), 110vh) rotate(var(--rot, 360deg)); }
  }

  /* ---------- Puzzle-wrong rebuff ----------
     Shorter and smaller than .celebrate — wrong answers come often, so
     the feedback is quick (~900ms total) and non-blocking (pointer-events
     stays off). Same structural idea: tinted backdrop + pop-in disc with
     a drawn mark, plus a brief horizontal shake to sell the "nope". */
  .rebuff {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(50, 10, 15, .35);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    pointer-events: none;
    animation: rebuffFade .15s ease;
  }
  .rebuff.gone { animation: rebuffFadeOut .25s ease forwards; }
  @keyframes rebuffFade    { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rebuffFadeOut { from { opacity: 1; } to { opacity: 0; } }

  .rebuff .disc {
    width: 110px; height: 110px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ff8787, var(--danger));
    display: grid; place-items: center;
    box-shadow: 0 10px 30px rgba(255,82,82,.45), inset 0 -5px 14px rgba(0,0,0,.18);
    transform: scale(0);
    animation:
      rebuffPop   .35s cubic-bezier(.2,1.6,.4,1) .03s forwards,
      rebuffShake .38s .38s cubic-bezier(.36,.07,.19,.97);
  }
  @keyframes rebuffPop { to { transform: scale(1); } }
  @keyframes rebuffShake {
    0%, 100% { translate: 0 0; }
    15%      { translate: -10px 0; }
    30%      { translate:  10px 0; }
    45%      { translate:  -7px 0; }
    60%      { translate:   7px 0; }
    75%      { translate:  -4px 0; }
    90%      { translate:   4px 0; }
  }

  .rebuff .cross {
    width: 64px; height: 64px;
  }
  .rebuff .cross path {
    fill: none; stroke: #fff; stroke-width: 10; stroke-linecap: round;
    stroke-dasharray: 70; stroke-dashoffset: 70;
    animation: rebuffDraw .22s .25s ease-out forwards;
  }
  @keyframes rebuffDraw { to { stroke-dashoffset: 0; } }

  .rebuff .head {
    font-family: var(--font-brand);
    color: #fff; font-size: clamp(1.4rem, 5vw, 2rem);
    margin-top: .9rem; letter-spacing: .01em;
    opacity: 0; animation: celebrateRise .3s .45s ease forwards;
  }

  /* ---------- Language picker ----------
     Floats at the top-right corner so it's reachable from every view
     (no-session card, running puzzle, gated, completed). Compact and
     unobtrusive; the magic-link flow only needs it once. */
  .lang-fab {
    position: fixed;
    top: calc(.5rem + env(safe-area-inset-top));
    right: .5rem;
    z-index: 40;
  }
  .lang-fab select {
    font: inherit; font-size: .85rem; font-weight: 600;
    color: var(--text);
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    border: 1px solid var(--border-soft);
    border-radius: 999px;
    padding: .3rem 1.75rem .3rem .75rem;
    box-shadow: var(--shadow);
    cursor: pointer;
    appearance: none;
    background-image:
      linear-gradient(45deg, transparent 50%, var(--muted) 50%),
      linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position:
      calc(100% - 12px) 55%,
      calc(100% - 7px) 55%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }
  .lang-fab select:hover { border-color: var(--muted); }

  /* ---------- Preview mode ---------- */
  .preview-chrome {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
    padding: .5rem .75rem;
    margin: 0 0 .75rem;
    background: color-mix(in srgb, var(--accent) 18%, var(--surface));
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    font-size: .85rem;
  }
  .preview-chrome .sep { color: var(--muted); }
  .preview-chrome .chip {
    font: inherit; font-weight: 600;
    padding: .3rem .7rem; border-radius: 999px;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--border-soft);
    cursor: pointer; width: auto; box-shadow: none;
  }
  .preview-chrome .chip:hover:not(:disabled) { background: var(--surface-2); }
  .preview-chrome .chip.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .preview-chrome .chip:disabled { opacity: .4; cursor: default; }
  .preview-debug {
    border-left: 4px solid var(--accent);
    background: color-mix(in srgb, var(--accent) 4%, var(--surface));
  }
  .preview-debug code {
    background: var(--surface-2);
    padding: .1rem .4rem; border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, monospace;
    font-size: .95em;
  }
  .preview-debug .mono {
    font-family: ui-monospace, SFMono-Regular, monospace; font-size: .9rem;
  }
</style>
</head>
<body>
<div id="app" data-initial-loading>loading…</div>

<script>
const app = document.getElementById('app');
// Localise the baked-in loading placeholder now that t() is available.
if (app.hasAttribute('data-initial-loading')) app.textContent = t('loading…');
let gpsWatchID = null;
let pingTimer = null;
let lastFix = null;
// A shallow fingerprint of the last rendered state. If the state hasn't
// changed between pushes we skip the re-render so the submit dock's input
// keeps its value and focus.
let lastRenderKey = null;

// WebSocket to the server. The server pushes {kind:"state"} frames when
// anything in this run changes; we push {kind:"location"} and
// {kind:"answer"} frames back. Reconnects with exponential backoff so a
// dropped wifi / cellular handover heals itself without user action.
let ws = null;
let wsBackoff = 500;
let wsReconnectTimer = null;
let submitResultEl = null;
let submitInputEl = null;
// previewState is non-null while the page is running in preview mode:
// no WebSocket, no slot session — just a snapshot of one puzzle. The
// submit dock switches to local answer matching when `accept` is set
// (only present when ?debug=1 so the page has the answers).
let previewState = null;
// advanceMode tracks how the most recent "advance" WS message should
// be handled when the server replies. Set by the Continue / Check-
// location CTAs; the answer_result and answer_error listeners read it
// and reset it to 'none'.
//   'none'   — normal answer flow; animations play on result.
//   'silent' — plain no-answer continue; animations suppressed.
//   'gated'  — no-answer gated puzzle; celebrate on pass, rebuff on 403.
let advanceMode = 'none';

// api is kept only for the one-shot auth probe at page load — every
// subsequent state change rides the WebSocket.
async function api(path, opts = {}) {
  const res = await fetch(path, {
    credentials: 'same-origin',
    headers: opts.body ? { 'Content-Type': 'application/json' } : {},
    ...opts,
  });
  let body = null;
  if (res.status !== 204) { try { body = await res.json(); } catch {} }
  return { status: res.status, body };
}

function wsSend(kind, data) {
  if (!ws || ws.readyState !== 1) return false;
  try { ws.send(JSON.stringify({ kind, data })); return true; }
  catch { return false; }
}

function connectWS() {
  if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = null; }
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws/play`);
  ws.onopen = () => { wsBackoff = 500; };
  ws.onmessage = (ev) => {
    let msg; try { msg = JSON.parse(ev.data); } catch { return; }
    if (!msg || !msg.kind) return;
    if (msg.kind === 'state') {
      startGPS();
      render(msg.data);
    } else if (msg.kind === 'answer_result') {
      onAnswerResult(msg.data);
    } else if (msg.kind === 'answer_error') {
      // Gated "Check location" rejection → play the rebuff so the
      // player gets the same visceral "not yet" cue as a wrong
      // answer. The plain-continue error path stays silent.
      if (advanceMode === 'gated') rebuff();
      advanceMode = 'none';
      if (submitResultEl) {
        submitResultEl.className = 'result err';
        submitResultEl.textContent = msg.data?.error || t('error {{status}}', { status: msg.data?.status || '' });
      }
    }
  };
  ws.onclose = (ev) => {
    // 1008/1011 = auth / server error; don't spin. 1000 = normal.
    if (ev.code === 1008) { renderNoSession(); return; }
    const delay = Math.min(wsBackoff, 10000);
    wsBackoff = Math.min(wsBackoff * 2, 10000);
    wsReconnectTimer = setTimeout(connectWS, delay);
  };
  ws.onerror = () => { /* handled by onclose */ };
}

// applyColors paints the four optional adventure brand colours onto the
// document root. Unset fields are cleared so navigating back to an
// untinted adventure fully restores the defaults. Accent-fg is derived
// automatically from accent-luminance — saves a fourth admin knob while
// keeping text legible on either a light or dark accent.
function applyColors(c) {
  const root = document.documentElement;
  if (!c) {
    for (const v of ['--accent', '--accent-hover', '--accent-fg', '--accent-secondary', '--bg', '--ink', '--text']) {
      root.style.removeProperty(v);
    }
    return;
  }
  if (c.accent) {
    root.style.setProperty('--accent', c.accent);
    root.style.setProperty('--accent-hover', shade(c.accent, -0.12));
    root.style.setProperty('--accent-fg', readableOn(c.accent));
  } else {
    root.style.removeProperty('--accent');
    root.style.removeProperty('--accent-hover');
    root.style.removeProperty('--accent-fg');
  }
  root.style.setProperty('--accent-secondary', c.accent_secondary || c.accent || '');
  if (!c.accent_secondary && !c.accent) root.style.removeProperty('--accent-secondary');
  if (c.background) root.style.setProperty('--bg', c.background); else root.style.removeProperty('--bg');
  if (c.text) {
    root.style.setProperty('--ink', c.text);
    root.style.setProperty('--text', c.text);
  } else {
    root.style.removeProperty('--ink');
    root.style.removeProperty('--text');
  }
}

// shade nudges a hex colour toward black (amount<0) or white (amount>0)
// so the hover state stays automatically legible regardless of the
// admin's chosen accent.
function shade(hex, amount) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex);
  if (!m) return hex;
  const n = parseInt(m[1], 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const mix = amount < 0 ? 0 : 255;
  r = Math.round(r + (mix - r) * Math.abs(amount));
  g = Math.round(g + (mix - g) * Math.abs(amount));
  b = Math.round(b + (mix - b) * Math.abs(amount));
  return '#' + [r, g, b].map((x) => x.toString(16).padStart(2, '0')).join('');
}

// readableOn returns black or white, whichever has better contrast on
// the supplied background. Uses the WCAG relative-luminance formula.
function readableOn(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex);
  if (!m) return '#ffffff';
  const n = parseInt(m[1], 16);
  const srgb = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => {
    const s = v / 255;
    return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
  });
  const L = 0.2126 * srgb[0] + 0.7152 * srgb[1] + 0.0722 * srgb[2];
  return L > 0.5 ? '#000000' : '#ffffff';
}

function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'on') for (const [ev, fn] of Object.entries(v)) e.addEventListener(ev, fn);
    else if (k === 'class') e.className = v;
    else if (v !== null && v !== undefined) e.setAttribute(k, v);
  }
  for (const c of children) e.append(c?.nodeType ? c : document.createTextNode(c ?? ''));
  return e;
}

function renderNoSession() {
  lastRenderKey = null;
  hideSubmitDock();
  app.replaceChildren(el('div', { class: 'card' },
    el('h3', {}, t('Open your magic link')),
    el('p', { class: 'muted' },
      t('Players receive a personal link via message from their arranger. '),
      t('Open it on this device to join the game.'))));
}

function startGPS() {
  if (gpsWatchID !== null || !navigator.geolocation) return;
  gpsWatchID = navigator.geolocation.watchPosition(
    (pos) => {
      lastFix = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy };
    },
    (err) => { console.warn('gps', err.message); },
    { enableHighAccuracy: true, maximumAge: 10000, timeout: 30000 },
  );
  if (pingTimer === null) pingTimer = setInterval(sendPing, 15000);
}

function sendPing() {
  if (!lastFix) return;
  wsSend('location', { ...lastFix, client_ts: new Date().toISOString() });
}

function render(s) {
  applyColors(s.colors);
  const key = JSON.stringify({
    status: s.status, pi: s.page_index, pc: s.page_count,
    t: s.title, p: s.prompt, h: s.hint,
    img: (s.images || []).map((i) => i.url),
    gate: s.gate ? s.gate.reached : null,
    team: s.team_name, adv: s.adventure_title,
    // Include no_answer so a puzzle flipping between answer/no-answer
    // modes rebuilds the submit dock instead of being deduped.
    na: !!s.no_answer,
  });
  if (key === lastRenderKey) return;
  lastRenderKey = key;

  app.replaceChildren();
  const playing = s.status === 'running' || s.status === 'gated';
  const bar = el('div', { class: 'runbar' },
    s.adventure_title ? el('span', { class: 'title' }, s.adventure_title) : null,
    s.team_name ? el('span', { class: 'team' }, s.team_name) : null,
    playing
      ? el('span', { class: 'progress' }, t('Puzzle {{i}}/{{n}}', { i: s.page_index + 1, n: s.page_count }))
      : null,
    el('span', { class: 'status pill' }, t(s.status || '')),
  );
  app.append(bar);

  // Welcome screen shown once per (adventure, team, slot).
  maybeShowWelcome(s);

  if (s.status === 'waiting')  { hideSubmitDock(); app.append(buildWaitingCard(s)); return; }
  if (s.status === 'paused')   { hideSubmitDock(); app.append(el('p', {}, t('The arranger paused the run. Stand by.'))); return; }
  if (s.status === 'completed'){ hideSubmitDock(); renderCompleted(s); return; }

  if (s.status === 'gated') {
    hideSubmitDock();
    const cta = s.no_answer
      // No-answer puzzle: one button that confirms arrival and advances
      // on success. The server does the gate check; 403 triggers the
      // rebuff animation, accepted advances with celebrate.
      ? el('button', { on: { click: () => {
          advanceMode = 'gated';
          if (lastFix) wsSend('location', { ...lastFix, client_ts: new Date().toISOString() });
          if (!wsSend('advance', {})) {
            advanceMode = 'none';
            submitResultEl && (submitResultEl.textContent = t('Disconnected — try again in a moment.'));
          }
        } } }, t("Check location · I'm here"))
      : el('button', { on: { click: sendPing } }, t('Send location now'));
    const card = el('div', { class: 'card' },
      el('h2', {}, t('Travel to the location')),
      el('p', {}, t('Head within {{r}} m of ({{lat}}, {{lng}}).',
        { r: s.gate.radius_m, lat: s.gate.lat.toFixed(5), lng: s.gate.lng.toFixed(5) })),
      el('p', { class: 'muted' }, lastFix
        ? t('Last fix: {{lat}}, {{lng}} (±{{acc}} m)',
            { lat: lastFix.lat.toFixed(5), lng: lastFix.lng.toFixed(5), acc: Math.round(lastFix.accuracy) })
        : t('Waiting for a GPS fix…')),
      cta);
    app.append(card);
    return;
  }



  if (s.title) app.append(el('h3', {}, s.title));
  if (Array.isArray(s.images)) {
    for (const im of s.images) app.append(el('img', { class: 'puzzle-img', src: im.url, alt: '' }));
  }
  app.append(el('p', { class: 'prompt' }, s.prompt || ''));
  if (s.hint) app.append(el('p', { class: 'muted' }, t('Hint: {{text}}', { text: s.hint })));

  renderSubmitDock(s);
}

// renderSubmitDock always renders into the same sticky container at the
// bottom so the input field and button stay in a fixed spot between
// puzzles. When the puzzle has no accept list (state.no_answer) the
// dock collapses to a single Continue button that tells the server to
// advance without an answer-match attempt.
function renderSubmitDock(s) {
  let dock = document.getElementById('submit-dock');
  if (!dock) {
    dock = document.createElement('div');
    dock.id = 'submit-dock';
    dock.className = 'submit-dock';
    document.body.append(dock);
  }
  dock.replaceChildren();
  submitInputEl = null;

  if (s && s.no_answer) {
    // Continue-only dock — no input, no submit button. One wide CTA.
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = t('Continue');
    const result = document.createElement('p');
    result.className = 'result muted';
    const wrap = document.createElement('div');
    wrap.append(button, result);
    dock.append(wrap);
    submitResultEl = result;
    button.addEventListener('click', () => {
      if (previewState) {
        // Preview mode: advance locally as if the server said yes,
        // without any animations (per the no-answer rule).
        advanceMode = 'silent';
        onAnswerResult({
          accepted: true,
          completed: previewState.pageIndex + 1 >= previewState.pageCount,
        });
        return;
      }
      advanceMode = 'silent';
      if (!wsSend('advance', {})) {
        advanceMode = 'none';
        result.className = 'result err';
        result.textContent = t('Disconnected — try again in a moment.');
      }
    });
    return;
  }

  const input = document.createElement('input');
  input.name = 'a';
  input.placeholder = previewState ? t('Try an answer (preview)') : t('Your answer');
  input.autocomplete = 'off';
  input.required = true;
  const button = document.createElement('button');
  button.type = 'submit';
  button.textContent = t('Submit');
  const result = document.createElement('p');
  result.className = 'result muted';
  const form = document.createElement('form');
  form.append(input, button, result);
  dock.append(form);
  submitInputEl = input;
  submitResultEl = result;
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (previewState) { handlePreviewSubmit(input.value); return; }
    if (!wsSend('answer', { answer: input.value })) {
      result.className = 'result err';
      result.textContent = t('Disconnected — try again in a moment.');
    }
  });
}

// handlePreviewSubmit routes a preview answer through the same
// onAnswerResult the real player uses — arrangers see the real celebrate
// overlay on a correct answer (or the finale copy on the last puzzle)
// and the rebuff animation on a wrong one. With ?debug=1 the accept list
// is served alongside the puzzle so the match is real; without debug
// we let any non-empty answer through so the arranger can walk the
// adventure in order without knowing the answers. After a correct
// answer we auto-advance to the next puzzle once celebrate finishes,
// mirroring the WebSocket state push a real player would receive.
function handlePreviewSubmit(answer) {
  const needle = (answer || '').trim().toLowerCase();
  if (!needle) return;
  const accept = previewState.accept;
  const accepted = accept
    ? accept.some((a) => (a || '').trim().toLowerCase() === needle)
    : true;
  const completed = accepted && previewState.pageIndex + 1 >= previewState.pageCount;
  onAnswerResult({ accepted, completed });
  if (accepted && !completed) {
    // Wait until the inter-puzzle celebrate overlay has settled (~1.8s)
    // before swapping the page so the arranger sees the win land.
    const nextIdx = previewState.pageIndex + 1;
    setTimeout(() => loadPreviewPage(nextIdx), 1400);
  }
}

// loadPreviewPage refetches a different puzzle from the preview endpoint
// and re-renders in place. Used by the auto-advance after a correct
// answer; the chrome's Prev/Next buttons still do a full reload because
// a debug-toggle or slug change needs a fresh bootstrap anyway.
async function loadPreviewPage(pageIdx) {
  const qs = new URLSearchParams(location.search);
  const slug = qs.get('preview');
  if (!slug) return;
  const apiQs = new URLSearchParams({ page: String(pageIdx) });
  if (qs.get('debug') === '1') apiQs.set('debug', '1');
  const r = await api(`/api/admin/adventures/${encodeURIComponent(slug)}/preview?${apiQs}`);
  if (r.status !== 200) return;
  qs.set('page', String(pageIdx));
  history.replaceState(null, '', '?' + qs.toString());
  previewState = {
    accept: r.body.preview_debug?.accept || null,
    pageIndex: r.body.page_index ?? 0,
    pageCount: r.body.page_count ?? 0,
  };
  lastRenderKey = null; // force render() past its dedupe check
  render(r.body);
  renderPreviewChrome(r.body);
}

// onAnswerResult handles the server's reply to an {kind:"answer"} push.
// The state refresh that follows a correct answer arrives as a separate
// "state" frame (pushed because the hub fires on answer); the celebrate
// overlay covers the re-render while it plays.
function onAnswerResult(r) {
  // Consume the advance-mode flag so only the matching result branch
  // animates (or suppresses).
  const mode = advanceMode;
  advanceMode = 'none';
  if (submitResultEl) {
    // Verdict text would be redundant now that celebrate/rebuff carry
    // the feedback — leave the line blank and let the overlay speak.
    // The element still exists for network errors ("Disconnected…").
    submitResultEl.className = 'result muted';
    submitResultEl.textContent = '';
  }
  if (r.accepted) {
    if (submitInputEl) { submitInputEl.value = ''; submitInputEl.blur(); }
    // Plain Continue button on a no-answer puzzle advances silently —
    // no celebrate, just the state frame that follows.
    if (mode !== 'silent') celebrate(r.completed);
  } else {
    rebuff();
  }
}

// celebrate renders a full-screen success overlay with a popped ring, a
// drawn checkmark, and a burst of confetti. The `finished` flag tweaks
// copy so the final puzzle lands differently from the intermediate ones.
function celebrate(finished) {
  const overlay = document.createElement('div');
  overlay.className = 'celebrate';
  const ring = document.createElement('div');
  ring.className = 'ring';
  ring.innerHTML = '<svg class="check" viewBox="0 0 100 100"><path d="M22 52 l18 18 l38 -38"/></svg>';
  const head = document.createElement('div');
  head.className = 'head';
  head.textContent = finished ? t('Adventure complete!') : t('Correct!');
  const sub = document.createElement('div');
  sub.className = 'sub';
  sub.textContent = finished ? t('Great work — you made it to the end.') : t('Next puzzle coming up…');
  overlay.append(ring, head, sub);

  // Confetti.
  const colours = ['#e24080', '#f5c452', '#7fd17b', '#60a5fa', '#a78bfa', '#22d3ee'];
  const count = finished ? 80 : 48;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'piece';
    const dx = (Math.random() * 2 - 1) * 380;
    const rot = (Math.random() * 1440 - 720);
    p.style.left = Math.random() * 100 + '%';
    p.style.setProperty('--c', colours[i % colours.length]);
    p.style.setProperty('--dx', dx + 'px');
    p.style.setProperty('--rot', rot + 'deg');
    p.style.setProperty('--d', (Math.random() * 250) + 'ms');
    overlay.append(p);
  }
  document.body.append(overlay);
  // Dismiss: short for inter-puzzle, longer when the adventure ends.
  const total = finished ? 3500 : 1800;
  setTimeout(() => overlay.classList.add('gone'), total);
  setTimeout(() => overlay.remove(), total + 500);
}

// rebuff is celebrate's mirror for a wrong guess — shorter and smaller
// so the player isn't punished by a long overlay between tries. pointer
// events stay off, so the submit dock is usable again the instant the
// overlay fades.
function rebuff() {
  const overlay = document.createElement('div');
  overlay.className = 'rebuff';
  const disc = document.createElement('div');
  disc.className = 'disc';
  disc.innerHTML = '<svg class="cross" viewBox="0 0 100 100">'
    + '<path d="M28 28 L72 72"/><path d="M72 28 L28 72"/>'
    + '</svg>';
  const head = document.createElement('div');
  head.className = 'head';
  head.textContent = t('Not quite');
  overlay.append(disc, head);
  document.body.append(overlay);
  const total = 900;
  setTimeout(() => overlay.classList.add('gone'), total);
  setTimeout(() => overlay.remove(), total + 300);
}

// Debug shortcut: Alt+S pops the celebration so you can tweak the visuals
// without actually solving a puzzle. Alt+W re-shows the welcome overlay,
// Alt+C renders the completion summary with placeholder numbers.
document.addEventListener('keydown', (e) => {
  if (!e.altKey) return;
  if (e.key === 'S' || e.key === 's') {
    e.preventDefault();
    celebrate(e.shiftKey);
    return;
  }
  if (e.key === 'W' || e.key === 'w') {
    e.preventDefault();
    showWelcomeDialog({
      team_name: 'Team Alfa',
      adventure_title: 'Debug preview',
      page_count: 3,
    }, { force: true });
    return;
  }
  if (e.key === 'C' || e.key === 'c') {
    e.preventDefault();
    showDebugSummary();
  }
});

// maybeShowWelcome pops the welcome overlay the first time this slot
// opens this adventure, remembered in localStorage so a refresh doesn't
// re-show it.
function maybeShowWelcome(s) {
  if (!s.adventure_title || !s.team_name || !s.slot_name) return;
  const key = 'zv_welcome_' + [s.adventure_slug || s.adventure_title, s.team_name, s.slot_name].join('|');
  if (localStorage.getItem(key) === '1') return;
  showWelcomeDialog(s, { storageKey: key });
}

function showWelcomeDialog(s, opts = {}) {
  // Drop any leftover overlay (Alt+W pressed twice, etc.).
  document.querySelectorAll('.welcome').forEach((n) => n.remove());

  const dismiss = () => {
    if (opts.storageKey) localStorage.setItem(opts.storageKey, '1');
    overlay.remove();
  };

  // Pre-start lock: while the run is scheduled and the clock hasn't
  // reached scheduled_at, the Let's go button shows a live countdown
  // and is disabled. Server enforces the lock independently — even if
  // the client is tampered with, the state endpoint refuses to leak
  // puzzle content until the scheduler (or the lazy promote in
  // buildState) flips the run to running.
  const locked = s.status === 'waiting' && !!s.scheduled_at;
  const cta = document.createElement('button');
  cta.textContent = locked ? preStartCountdownText(s.scheduled_at, s.server_now) : t("Let's go");
  if (locked) cta.disabled = true;
  cta.addEventListener('click', () => {
    if (cta.disabled) return;
    dismiss();
  });

  const overlay = el('div', { class: 'welcome' });
  const panel = el('div', { class: 'panel' });
  panel.append(
    el('h2', {}, s.adventure_title || t('Adventure')),
    el('div', { class: 'who' }, `${s.team_name || t('your team')}`),
    el('p', {},
      t('Your team has '), el('strong', {}, String(s.page_count || '?')),
      t(' puzzles to solve. Good luck!')),
    el('h3', { style: 'margin-top:.5rem' }, t('A few quick tips')),
    el('ul', {},
      el('li', {}, t('Read each puzzle carefully — the answer is usually a short word or phrase.')),
      el('li', {}, t('Some puzzles only unlock when you reach a specific place. Your device will show a pin and prompt you to go there.')),
      el('li', {}, t('The submit button is always in the same spot at the bottom of the screen.')),
      el('li', {}, t('Whoever in your team has this link installed can type answers — pick one phone and keep it handy.')),
      el('li', {}, t('Wrong answers don\'t cost you anything — keep trying.'))),
    el('div', { class: 'cta' }, cta));
  overlay.append(panel);
  // While locked, skip the backdrop-dismiss shortcut so players can't
  // accidentally blow past the countdown. Still allow it after unlock.
  overlay.addEventListener('click', (e) => {
    if (cta.disabled) return;
    if (e.target === overlay) dismiss();
  });
  document.body.append(overlay);

  // Tick the countdown once per second. Stops itself when the button
  // unlocks or the overlay is removed.
  if (locked) {
    const target = parsePreStartTarget(s.scheduled_at);
    const tick = () => {
      if (!overlay.isConnected) return;
      const now = Date.now();
      if (now >= target) {
        cta.disabled = false;
        cta.textContent = t("Let's go");
        return;
      }
      cta.textContent = preStartCountdownText(s.scheduled_at, null);
      setTimeout(tick, 1000);
    };
    setTimeout(tick, 1000);
  }
}

// buildWaitingCard renders the main-content view for a scheduled run.
// If we know the start time it ticks down in-place; otherwise it
// shows the softer "waiting for the arranger" copy.
function buildWaitingCard(s) {
  const card = el('div', { class: 'prestart-card' });
  card.append(el('div', { class: 'banner' }, t('Starting soon')));
  if (s.scheduled_at) {
    const digits = el('div', { class: 'digits' },
      preStartCountdownText(s.scheduled_at, s.server_now));
    card.append(digits, el('small', {}, t('until the flag drops')));
    // Self-refreshing countdown — stops when the card leaves the DOM.
    const target = parsePreStartTarget(s.scheduled_at);
    const tick = () => {
      if (!digits.isConnected) return;
      const now = Date.now();
      if (now >= target) {
        digits.textContent = t('any moment…');
        return;
      }
      digits.textContent = preStartCountdownText(s.scheduled_at, null);
      setTimeout(tick, 1000);
    };
    setTimeout(tick, 1000);
  } else {
    card.append(el('div', { class: 'digits' }, '—'),
      el('small', {}, t('waiting for the arranger')));
  }
  return card;
}

function parsePreStartTarget(scheduledISO) {
  const d = new Date(scheduledISO.includes('T') ? scheduledISO : scheduledISO.replace(' ', 'T') + 'Z');
  return Number.isNaN(d.getTime()) ? 0 : d.getTime();
}

function preStartCountdownText(scheduledISO, serverNowISO) {
  const target = parsePreStartTarget(scheduledISO);
  const now = serverNowISO ? new Date(serverNowISO).getTime() : Date.now();
  const sec = Math.round((target - now) / 1000);
  if (sec <= 0) return t('any moment…');
  const d = Math.floor(sec / 86400);
  const h = Math.floor((sec % 86400) / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  const pad = (n) => String(n).padStart(2, '0');
  if (d > 0) return `${d}d ${pad(h)}:${pad(m)}:${pad(s)}`;
  if (h > 0) return `${pad(h)}:${pad(m)}:${pad(s)}`;
  return `${pad(m)}:${pad(s)}`;
}

// renderCompleted replaces the simple "Adventure complete!" line with a
// richer end-of-run card: team stats, distance, time, right/wrong.
async function renderCompleted(s) {
  // A placeholder while /summary loads.
  const host = el('div', { class: 'summary' });
  host.append(
    el('h2', {}, t('Adventure complete! 🎉')),
    el('div', { class: 'who' }, `${s.team_name || ''} · ${s.adventure_title || ''}`),
    el('p', { class: 'muted' }, t('Loading your run stats…')));
  app.append(host);

  let stats = null;
  try {
    const r = await api('/api/player/summary');
    if (r.status === 200) stats = r.body;
  } catch { /* ignore */ }
  if (!stats) {
    host.replaceChildren(
      el('h2', {}, t('Adventure complete! 🎉')),
      el('div', { class: 'who' }, `${s.team_name || ''} · ${s.adventure_title || ''}`),
      el('p', { class: 'muted' }, t('Could not load stats.')));
    return;
  }
  fillSummaryHost(host, stats);
}

function fillSummaryHost(host, stats) {
  host.replaceChildren(
    el('h2', {}, t('Adventure complete! 🎉')),
    el('div', { class: 'who' }, `${stats.team_name} · ${stats.adventure_title}`),
    el('div', { class: 'stats-grid' },
      statBox(formatDistance(stats.distance_m),       t('Distance')),
      statBox(formatDuration(stats.duration_seconds), t('Time')),
      statBox(`${stats.answers_right}`,               t('Correct answers')),
      statBox(`${stats.answers_wrong}`,               t('Misses')),
    ),
    stats.page_count
      ? el('p', { class: 'muted', style: 'font-size:.85rem; margin-top:.75rem' },
          stats.page_count === 1
            ? t('Solved all {{n}} puzzle.', { n: stats.page_count })
            : t('Solved all {{n}} puzzles.', { n: stats.page_count }))
      : null,
  );
}

function statBox(value, label) {
  return el('div', { class: 'stat' },
    el('div', { class: 'v' }, value),
    el('div', { class: 'l' }, label));
}

function formatDistance(m) {
  if (!Number.isFinite(m) || m <= 0) return '—';
  if (m < 1000) return `${Math.round(m)} m`;
  return `${(m / 1000).toFixed(m >= 10000 ? 0 : 1)} km`;
}

function formatDuration(sec) {
  if (!Number.isFinite(sec) || sec <= 0) return '—';
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  const pad = (n) => String(n).padStart(2, '0');
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}

// Debug helper bound to Alt+C — renders a summary card with made-up numbers
// so the visual layout can be iterated on without finishing a run.
function showDebugSummary() {
  app.replaceChildren();
  const host = el('div', { class: 'summary' });
  app.append(host);
  fillSummaryHost(host, {
    team_name: 'Team Alfa',
    adventure_title: 'Demo: First Steps',
    page_count: 3,
    answers_right: 3,
    answers_wrong: 1,
    distance_m: 1742,
    duration_seconds: 48 * 60 + 12,
  });
}
function hideSubmitDock() {
  const dock = document.getElementById('submit-dock');
  if (dock) dock.remove();
}

// Bootstrap: a single HTTP probe decides auth (WebSocket upgrade failures
// can't be distinguished from network errors in the browser) and seeds the
// initial render. Afterwards the WebSocket takes over entirely.
//
// Preview mode (?preview=<slug>&page=<N>[&debug=1]) takes a different
// path — no slot session, no WebSocket, no GPS pings. An arranger
// reviews the puzzle rendered exactly as a player would see it.
async function bootstrap() {
  const qs = new URLSearchParams(location.search);
  if (qs.get('preview')) {
    await bootstrapPreview(qs.get('preview'), parseInt(qs.get('page') || '0', 10), qs.get('debug') === '1');
    return;
  }
  const s = await api('/api/player/state');
  if (s.status === 401) { renderNoSession(); return; }
  if (s.status !== 200) {
    app.replaceChildren(el('p', { class: 'err' }, s.body?.error || t('error')));
    return;
  }
  startGPS();
  render(s.body);
  connectWS();
}

async function bootstrapPreview(slug, pageIdx, debug) {
  const qs = new URLSearchParams({ page: String(pageIdx) });
  if (debug) qs.set('debug', '1');
  const r = await api(`/api/admin/adventures/${encodeURIComponent(slug)}/preview?${qs}`);
  if (r.status === 401) {
    app.replaceChildren(el('p', { class: 'err' },
      t('Preview requires an arranger login. Open '),
      el('a', { href: '/arrange' }, '/arrange'), t(' first, then retry.')));
    return;
  }
  if (r.status !== 200) {
    app.replaceChildren(el('p', { class: 'err' }, r.body?.error || t('error {{status}}', { status: r.status })));
    return;
  }
  previewState = {
    accept: r.body.preview_debug?.accept || null,
    pageIndex: r.body.page_index ?? 0,
    pageCount: r.body.page_count ?? 0,
  };
  render(r.body);
  renderPreviewChrome(r.body);
}

// renderPreviewChrome overlays a top ribbon with adventure-level
// navigation so the arranger can jump between puzzles, toggle the debug
// panel, and exit without hunting for tab close. Rebuilt on every
// render() so the "N of M" stays in sync with the fetched page.
function renderPreviewChrome(s) {
  document.getElementById('preview-chrome')?.remove();
  const qs = new URLSearchParams(location.search);
  const slug = qs.get('preview');
  const pageIdx = s.page_index ?? 0;
  const count = s.page_count ?? 0;
  const debug = qs.get('debug') === '1';
  const go = (patch) => {
    const next = new URLSearchParams(location.search);
    for (const [k, v] of Object.entries(patch)) {
      if (v === null) next.delete(k); else next.set(k, String(v));
    }
    location.search = '?' + next.toString();
  };
  const chrome = el('div', { id: 'preview-chrome', class: 'preview-chrome' },
    el('strong', {}, t('Preview')),
    el('span', { class: 'sep' }, '·'),
    el('span', {}, s.adventure_title || slug),
    el('span', { class: 'sep' }, '·'),
    el('span', {}, t('Puzzle {{i}}/{{n}}', { i: pageIdx + 1, n: count })),
    el('span', { style: 'flex:1' }),
    el('button', { class: 'chip', disabled: pageIdx <= 0 ? '' : null,
      on: { click: () => go({ page: pageIdx - 1 }) } }, t('◀ Prev')),
    el('button', { class: 'chip', disabled: pageIdx >= count - 1 ? '' : null,
      on: { click: () => go({ page: pageIdx + 1 }) } }, t('Next ▶')),
    el('button', { class: 'chip' + (debug ? ' on' : ''),
      on: { click: () => go({ debug: debug ? null : 1 }) } }, t('Debug')),
    el('button', { class: 'chip', on: { click: () => window.close() } }, t('Close')),
  );
  document.body.prepend(chrome);
  if (s.preview_debug) renderPreviewDebug(s.preview_debug);
}

// renderPreviewDebug appends a panel with the author-side fields
// (accepted answers, gate location, notes) that a player never sees.
// Attached to #app so it sits underneath the puzzle content and scrolls
// with it.
function renderPreviewDebug(d) {
  // el() doesn't flatten array children — stringifying an array of nodes
  // would render as "[object HTMLElement],…", so build the chip list
  // inline and spread it as individual children instead.
  const accept = d.accept || [];
  const chipChildren = [];
  if (!accept.length) {
    chipChildren.push(el('span', { class: 'muted' }, t('(none)')));
  } else {
    accept.forEach((a, i) => {
      chipChildren.push(el('code', {}, a));
      if (i < accept.length - 1) chipChildren.push(document.createTextNode(', '));
    });
  }
  const coords = `${d.lat.toFixed(5)}, ${d.lng.toFixed(5)}`;
  const locSuffix = d.radius_m
    ? t(' · gate radius {{r}} m', { r: d.radius_m })
    : t(' · not gated');
  const panel = el('div', { class: 'card preview-debug' },
    el('h2', {}, t('Debug — author view')),
    el('p', {}, el('strong', {}, t('Accepted answers: ')), ...chipChildren),
    el('p', { class: 'mono' }, t('Location: {{coords}}', { coords }) + locSuffix),
    d.notes ? el('p', { class: 'muted', style: 'white-space:pre-wrap' },
      t('Notes: ') + d.notes) : null,
  );
  app.append(panel);
}

// Floating language picker. Mounted on <body> so it stays put across
// app.replaceChildren() renders and is visible from every view state.
(function mountLangFab() {
  const fab = document.createElement('div');
  fab.className = 'lang-fab';
  fab.append(zvI18n.makeLangPicker({ title: t('Language') }));
  document.body.append(fab);
})();

bootstrap();
</script>
</body>
