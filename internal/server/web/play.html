<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zonventure · play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aclonica&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --accent:        #ad1357;
    --accent-hover:  #951048;
    --accent-fg:     #ffffff;
    --ink:           #1f3349;
    --success:       #429a3f;
    --danger:        #ff5252;
    --bg:            #fbfbfd;
    --surface:       #ffffff;
    --surface-2:     #f6f6f6;
    --border:        #c6d2e1;
    --border-soft:   #c6d2e166;
    --text:          var(--ink);
    --muted:         #6b7f96;
    --shadow:        0 1px 4px #00000014, 0 2px 8px #00000012;
    --radius:        12px;
    --radius-pill:   32px;
    --font-body:     'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --font-brand:    'Aclonica', 'Vollkorn', Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:          #14202e;
      --surface:     #1f3349;
      --surface-2:   #263d56;
      --border:      #3a5172;
      --border-soft: #3a517266;
      --text:        #e7ecf4;
      --ink:         #e7ecf4;
      --muted:       #9db1cc;
      --accent:      #e24080;
      --accent-hover:#ad1357;
      --success:     #7fd17b;
      --danger:      #ff7b7b;
      --shadow:      0 1px 4px #00000066, 0 2px 12px #00000077;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: var(--font-body);
    font-size: 16px; line-height: 1.5;
    color: var(--text); background: var(--bg);
    margin: 0;
    padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom) + 130px);
    max-width: 640px; margin-left: auto; margin-right: auto;
    -webkit-font-smoothing: antialiased;
  }
  .puzzle-img {
    width: 100%; height: auto; display: block;
    border-radius: var(--radius);
    border: 1px solid var(--border-soft);
    margin: .5rem 0;
    box-shadow: var(--shadow);
  }
  /* Sticky submit bar: always at the bottom of the viewport, same place
     for every puzzle so the player builds muscle memory. */
  .submit-dock {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: .75rem 1rem calc(.75rem + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: blur(8px);
    border-top: 1px solid var(--border-soft);
    z-index: 10;
  }
  .submit-dock form {
    max-width: 640px; margin: 0 auto;
    display: grid; grid-template-columns: 1fr auto; gap: .5rem;
    align-items: stretch;
  }
  .submit-dock input { margin: 0; }
  .submit-dock button { width: auto; padding: .75rem 1.2rem; }
  .submit-dock .result { grid-column: 1 / -1; margin: 0; min-height: 1rem; font-size: .9rem; }
  /* Compact top strip: adventure title + team + progress + status pill in
     one row. Leaves maximum vertical space for the puzzle itself. */
  .runbar {
    display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap;
    padding: .25rem 0 .6rem;
    margin-bottom: .5rem;
    border-bottom: 1px solid var(--border-soft);
    font-size: .85rem;
  }
  .runbar .title {
    font-family: var(--font-brand); color: var(--accent);
    font-size: 1.05rem; line-height: 1; margin-right: .25rem;
  }
  .runbar .sep { color: var(--muted); }
  .runbar .team { color: var(--ink); font-weight: 700; }
  .runbar .progress { color: var(--muted); font-variant-numeric: tabular-nums; }
  .runbar .status { margin-left: auto; }
  h2 { font-size: .85rem; margin: 1.2rem 0 .4rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  h3 { font-size: 1.05rem; margin: 0 0 .5rem; color: var(--ink); }
  input {
    font: inherit; width: 100%; padding: .75rem .9rem; margin-bottom: .8rem;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
  }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
  button {
    font: inherit; font-weight: 700; width: 100%;
    padding: .75rem 1.2rem; cursor: pointer;
    background: var(--accent); color: var(--accent-fg);
    border: none; border-radius: var(--radius-pill);
    box-shadow: var(--shadow);
    transition: background 120ms, transform 80ms;
  }
  button:hover { background: var(--accent-hover); }
  button:active { transform: translateY(1px); }
  button.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  button.secondary:hover { background: var(--surface-2); }
  .card {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 1.25rem; margin: .75rem 0;
    box-shadow: var(--shadow);
  }
  .muted { color: var(--muted); }
  .err { color: var(--danger); font-weight: 600; }
  .ok  { color: var(--success); font-weight: 600; }
  .prompt { white-space: pre-wrap; font-size: 1.1rem; line-height: 1.55; color: var(--ink); }
  .pill {
    display: inline-block; padding: .15rem .65rem;
    border-radius: 999px; font-size: .7rem; font-weight: 700;
    background: color-mix(in srgb, var(--accent) 15%, transparent);
    color: var(--accent);
    text-transform: uppercase; letter-spacing: .06em;
  }
  .topline {
    display: flex; justify-content: space-between; align-items: baseline;
    padding-bottom: .75rem; margin-bottom: .75rem;
    border-bottom: 1px solid var(--border-soft);
  }
  .topline .who { color: var(--muted); font-size: .9rem; }
  .topline .who strong { color: var(--ink); font-weight: 700; }
  .inline-btn { display: inline-block; width: auto; padding: .35rem .85rem; font-size: .8rem; }

  /* ---------- Welcome overlay (first time in the adventure) ---------- */
  .welcome {
    position: fixed; inset: 0; z-index: 1500;
    display: grid; place-items: center;
    padding: 1rem;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(226,64,128,.18), transparent 55%),
      radial-gradient(ellipse at 100% 100%, rgba(66,154,63,.12), transparent 55%),
      var(--bg);
    animation: welcomeFade .3s ease;
  }
  @keyframes welcomeFade { from { opacity: 0; } to { opacity: 1; } }
  .welcome .panel {
    background: var(--surface); border: 1px solid var(--border-soft);
    border-radius: var(--radius); box-shadow: 0 12px 40px rgba(0,0,0,.25);
    max-width: 520px; width: 100%; padding: 1.5rem;
  }
  .welcome h2 {
    font-family: var(--font-brand); color: var(--accent);
    font-size: 1.8rem; line-height: 1.1; margin: 0 0 .25rem;
  }
  .welcome .who { color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: .75rem; margin-bottom: 1rem; }
  .welcome ul { padding-left: 1.1rem; margin: 1rem 0; }
  .welcome li { margin: .35rem 0; }
  .welcome .cta { margin-top: 1rem; }

  /* ---------- Completion stats ---------- */
  .summary {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 1.25rem; margin-top: 1rem;
  }
  .summary h2 {
    font-family: var(--font-brand); color: var(--accent);
    font-size: 1.6rem; line-height: 1.1; margin: 0 0 .25rem;
  }
  .summary .who { color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: .75rem; margin-bottom: .9rem; }
  .stats-grid {
    display: grid; grid-template-columns: repeat(2, minmax(0,1fr));
    gap: .5rem;
  }
  .stat {
    background: var(--surface-2);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm, 8px);
    padding: .8rem;
    text-align: center;
  }
  .stat .v { font-family: var(--font-brand); color: var(--ink); font-size: 1.4rem; line-height: 1; }
  .stat .l { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; margin-top: .25rem; }

  /* ---------- Puzzle-correct celebration ---------- */
  .celebrate {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(10, 20, 35, .55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    overflow: hidden;
    animation: celebrateFade .25s ease;
  }
  .celebrate.gone { animation: celebrateFadeOut .4s ease forwards; }
  @keyframes celebrateFade    { from { opacity: 0; } to { opacity: 1; } }
  @keyframes celebrateFadeOut { from { opacity: 1; } to { opacity: 0; } }

  .celebrate .ring {
    width: 140px; height: 140px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #7fd17b, var(--success));
    display: grid; place-items: center;
    box-shadow: 0 10px 40px rgba(66,154,63,.45), inset 0 -6px 18px rgba(0,0,0,.18);
    transform: scale(0);
    animation: celebratePop .55s cubic-bezier(.2,1.6,.4,1) .05s forwards;
  }
  @keyframes celebratePop { to { transform: scale(1); } }

  .celebrate .check {
    width: 86px; height: 86px;
  }
  .celebrate .check path {
    fill: none; stroke: #fff; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 80; stroke-dashoffset: 80;
    animation: celebrateDraw .45s .35s ease-out forwards;
  }
  @keyframes celebrateDraw { to { stroke-dashoffset: 0; } }

  .celebrate .head {
    font-family: var(--font-brand);
    color: #fff; font-size: clamp(2rem, 7vw, 3rem);
    margin-top: 1.1rem; letter-spacing: .01em;
    opacity: 0; animation: celebrateRise .4s .55s ease forwards;
  }
  .celebrate .sub {
    color: rgba(255,255,255,.85); font-weight: 600;
    margin-top: .25rem; text-align: center;
    opacity: 0; animation: celebrateRise .4s .75s ease forwards;
  }
  @keyframes celebrateRise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Confetti: small rectangles that drop from above with a horizontal
     drift and a random rotation. Driven by CSS custom properties set
     per-particle from JS. */
  .celebrate .piece {
    position: absolute;
    top: -30px; width: 9px; height: 15px; border-radius: 2px;
    background: var(--c, #e24080);
    transform: translate(0, 0) rotate(0);
    animation: celebrateConfetti 2.2s var(--d, 0ms) cubic-bezier(.25,.75,.45,1) forwards;
    will-change: transform, opacity;
  }
  @keyframes celebrateConfetti {
    0%   { opacity: 0; transform: translate(0, -40px) rotate(0); }
    6%   { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--dx, 0), 110vh) rotate(var(--rot, 360deg)); }
  }
</style>
</head>
<body>
<div id="app">loading…</div>

<script>
const app = document.getElementById('app');
let gpsWatchID = null;
let pingTimer = null;
let lastFix = null;
// A shallow fingerprint of the last rendered state. If the state hasn't
// changed between pushes we skip the re-render so the submit dock's input
// keeps its value and focus.
let lastRenderKey = null;

// WebSocket to the server. The server pushes {kind:"state"} frames when
// anything in this run changes; we push {kind:"location"} and
// {kind:"answer"} frames back. Reconnects with exponential backoff so a
// dropped wifi / cellular handover heals itself without user action.
let ws = null;
let wsBackoff = 500;
let wsReconnectTimer = null;
let submitResultEl = null;
let submitInputEl = null;

// api is kept only for the one-shot auth probe at page load — every
// subsequent state change rides the WebSocket.
async function api(path, opts = {}) {
  const res = await fetch(path, {
    credentials: 'same-origin',
    headers: opts.body ? { 'Content-Type': 'application/json' } : {},
    ...opts,
  });
  let body = null;
  if (res.status !== 204) { try { body = await res.json(); } catch {} }
  return { status: res.status, body };
}

function wsSend(kind, data) {
  if (!ws || ws.readyState !== 1) return false;
  try { ws.send(JSON.stringify({ kind, data })); return true; }
  catch { return false; }
}

function connectWS() {
  if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = null; }
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws/play`);
  ws.onopen = () => { wsBackoff = 500; };
  ws.onmessage = (ev) => {
    let msg; try { msg = JSON.parse(ev.data); } catch { return; }
    if (!msg || !msg.kind) return;
    if (msg.kind === 'state') {
      startGPS();
      render(msg.data);
    } else if (msg.kind === 'answer_result') {
      onAnswerResult(msg.data);
    } else if (msg.kind === 'answer_error') {
      if (submitResultEl) {
        submitResultEl.className = 'result err';
        submitResultEl.textContent = msg.data?.error || `error ${msg.data?.status || ''}`;
      }
    }
  };
  ws.onclose = (ev) => {
    // 1008/1011 = auth / server error; don't spin. 1000 = normal.
    if (ev.code === 1008) { renderNoSession(); return; }
    const delay = Math.min(wsBackoff, 10000);
    wsBackoff = Math.min(wsBackoff * 2, 10000);
    wsReconnectTimer = setTimeout(connectWS, delay);
  };
  ws.onerror = () => { /* handled by onclose */ };
}

function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'on') for (const [ev, fn] of Object.entries(v)) e.addEventListener(ev, fn);
    else if (k === 'class') e.className = v;
    else if (v !== null && v !== undefined) e.setAttribute(k, v);
  }
  for (const c of children) e.append(c?.nodeType ? c : document.createTextNode(c ?? ''));
  return e;
}

function renderNoSession() {
  lastRenderKey = null;
  hideSubmitDock();
  app.replaceChildren(el('div', { class: 'card' },
    el('h3', {}, 'Open your magic link'),
    el('p', { class: 'muted' },
      'Players receive a personal link via message from their arranger. ',
      'Open it on this device to join the game.')));
}

function startGPS() {
  if (gpsWatchID !== null || !navigator.geolocation) return;
  gpsWatchID = navigator.geolocation.watchPosition(
    (pos) => {
      lastFix = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy };
    },
    (err) => { console.warn('gps', err.message); },
    { enableHighAccuracy: true, maximumAge: 10000, timeout: 30000 },
  );
  if (pingTimer === null) pingTimer = setInterval(sendPing, 15000);
}

function sendPing() {
  if (!lastFix) return;
  wsSend('location', { ...lastFix, client_ts: new Date().toISOString() });
}

function render(s) {
  const key = JSON.stringify({
    status: s.status, pi: s.page_index, pc: s.page_count,
    t: s.title, p: s.prompt, h: s.hint,
    img: (s.images || []).map((i) => i.url),
    gate: s.gate ? s.gate.reached : null,
    team: s.team_name, adv: s.adventure_title,
  });
  if (key === lastRenderKey) return;
  lastRenderKey = key;

  app.replaceChildren();
  const playing = s.status === 'running' || s.status === 'gated';
  const bar = el('div', { class: 'runbar' },
    s.adventure_title ? el('span', { class: 'title' }, s.adventure_title) : null,
    s.team_name ? el('span', { class: 'team' }, s.team_name) : null,
    playing
      ? el('span', { class: 'progress' }, `Puzzle ${s.page_index + 1}/${s.page_count}`)
      : null,
    el('span', { class: 'status pill' }, s.status),
  );
  app.append(bar);

  // Welcome screen shown once per (adventure, team, slot).
  maybeShowWelcome(s);

  if (s.status === 'waiting')  { hideSubmitDock(); app.append(el('p', {}, 'Waiting for the adventure to start…')); return; }
  if (s.status === 'paused')   { hideSubmitDock(); app.append(el('p', {}, 'The arranger paused the run. Stand by.')); return; }
  if (s.status === 'completed'){ hideSubmitDock(); renderCompleted(s); return; }

  if (s.status === 'gated') {
    hideSubmitDock();
    const card = el('div', { class: 'card' },
      el('h2', {}, 'Travel to the location'),
      el('p', {}, `Head within ${s.gate.radius_m} m of (${s.gate.lat.toFixed(5)}, ${s.gate.lng.toFixed(5)}).`),
      el('p', { class: 'muted' }, lastFix
        ? `Last fix: ${lastFix.lat.toFixed(5)}, ${lastFix.lng.toFixed(5)} (±${Math.round(lastFix.accuracy)} m)`
        : 'Waiting for a GPS fix…'),
      el('button', { on: { click: sendPing } }, 'Send location now'));
    app.append(card);
    return;
  }



  if (s.title) app.append(el('h3', {}, s.title));
  if (Array.isArray(s.images)) {
    for (const im of s.images) app.append(el('img', { class: 'puzzle-img', src: im.url, alt: '' }));
  }
  app.append(el('p', { class: 'prompt' }, s.prompt || ''));
  if (s.hint) app.append(el('p', { class: 'muted' }, `Hint: ${s.hint}`));

  renderSubmitDock();
}

// renderSubmitDock always renders into the same sticky container at the
// bottom so the input field and button stay in a fixed spot between
// puzzles.
function renderSubmitDock() {
  let dock = document.getElementById('submit-dock');
  if (!dock) {
    dock = document.createElement('div');
    dock.id = 'submit-dock';
    dock.className = 'submit-dock';
    document.body.append(dock);
  }
  dock.replaceChildren();
  const input = document.createElement('input');
  input.name = 'a';
  input.placeholder = 'Your answer';
  input.autocomplete = 'off';
  input.required = true;
  const button = document.createElement('button');
  button.type = 'submit';
  button.textContent = 'Submit';
  const result = document.createElement('p');
  result.className = 'result muted';
  const form = document.createElement('form');
  form.append(input, button, result);
  dock.append(form);
  submitInputEl = input;
  submitResultEl = result;
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!wsSend('answer', { answer: input.value })) {
      result.className = 'result err';
      result.textContent = 'Disconnected — try again in a moment.';
    }
  });
}

// onAnswerResult handles the server's reply to an {kind:"answer"} push.
// The state refresh that follows a correct answer arrives as a separate
// "state" frame (pushed because the hub fires on answer); the celebrate
// overlay covers the re-render while it plays.
function onAnswerResult(r) {
  if (!submitResultEl) return;
  if (r.accepted) {
    submitResultEl.className = 'result ok';
    submitResultEl.textContent = '';
    if (submitInputEl) { submitInputEl.value = ''; submitInputEl.blur(); }
    celebrate(r.completed);
  } else {
    submitResultEl.className = 'result err';
    submitResultEl.textContent = 'Not quite — try again.';
  }
}

// celebrate renders a full-screen success overlay with a popped ring, a
// drawn checkmark, and a burst of confetti. The `finished` flag tweaks
// copy so the final puzzle lands differently from the intermediate ones.
function celebrate(finished) {
  const overlay = document.createElement('div');
  overlay.className = 'celebrate';
  const ring = document.createElement('div');
  ring.className = 'ring';
  ring.innerHTML = '<svg class="check" viewBox="0 0 100 100"><path d="M22 52 l18 18 l38 -38"/></svg>';
  const head = document.createElement('div');
  head.className = 'head';
  head.textContent = finished ? 'Adventure complete!' : 'Correct!';
  const sub = document.createElement('div');
  sub.className = 'sub';
  sub.textContent = finished ? 'Great work — you made it to the end.' : 'Next puzzle coming up…';
  overlay.append(ring, head, sub);

  // Confetti.
  const colours = ['#e24080', '#f5c452', '#7fd17b', '#60a5fa', '#a78bfa', '#22d3ee'];
  const count = finished ? 80 : 48;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'piece';
    const dx = (Math.random() * 2 - 1) * 380;
    const rot = (Math.random() * 1440 - 720);
    p.style.left = Math.random() * 100 + '%';
    p.style.setProperty('--c', colours[i % colours.length]);
    p.style.setProperty('--dx', dx + 'px');
    p.style.setProperty('--rot', rot + 'deg');
    p.style.setProperty('--d', (Math.random() * 250) + 'ms');
    overlay.append(p);
  }
  document.body.append(overlay);
  // Dismiss: short for inter-puzzle, longer when the adventure ends.
  const total = finished ? 3500 : 1800;
  setTimeout(() => overlay.classList.add('gone'), total);
  setTimeout(() => overlay.remove(), total + 500);
}

// Debug shortcut: Alt+S pops the celebration so you can tweak the visuals
// without actually solving a puzzle. Alt+W re-shows the welcome overlay,
// Alt+C renders the completion summary with placeholder numbers.
document.addEventListener('keydown', (e) => {
  if (!e.altKey) return;
  if (e.key === 'S' || e.key === 's') {
    e.preventDefault();
    celebrate(e.shiftKey);
    return;
  }
  if (e.key === 'W' || e.key === 'w') {
    e.preventDefault();
    showWelcomeDialog({
      team_name: 'Team Alfa',
      adventure_title: 'Debug preview',
      page_count: 3,
    }, { force: true });
    return;
  }
  if (e.key === 'C' || e.key === 'c') {
    e.preventDefault();
    showDebugSummary();
  }
});

// maybeShowWelcome pops the welcome overlay the first time this slot
// opens this adventure, remembered in localStorage so a refresh doesn't
// re-show it.
function maybeShowWelcome(s) {
  if (!s.adventure_title || !s.team_name || !s.slot_name) return;
  const key = 'zv_welcome_' + [s.adventure_slug || s.adventure_title, s.team_name, s.slot_name].join('|');
  if (localStorage.getItem(key) === '1') return;
  showWelcomeDialog(s, { storageKey: key });
}

function showWelcomeDialog(s, opts = {}) {
  // Drop any leftover overlay (Alt+W pressed twice, etc.).
  document.querySelectorAll('.welcome').forEach((n) => n.remove());

  const dismiss = () => {
    if (opts.storageKey) localStorage.setItem(opts.storageKey, '1');
    overlay.remove();
  };

  const overlay = el('div', { class: 'welcome' });
  const panel = el('div', { class: 'panel' });
  panel.append(
    el('h2', {}, s.adventure_title || 'Adventure'),
    el('div', { class: 'who' }, `${s.team_name || 'your team'}`),
    el('p', {},
      'Your team has ', el('strong', {}, String(s.page_count || '?')),
      ' puzzles to solve. Good luck!'),
    el('h3', { style: 'margin-top:.5rem' }, 'A few quick tips'),
    el('ul', {},
      el('li', {}, 'Read each puzzle carefully — the answer is usually a short word or phrase.'),
      el('li', {}, 'Some puzzles only unlock when you reach a specific place. ' +
        'Your device will show a pin and prompt you to go there.'),
      el('li', {}, 'The submit button is always in the same spot at the bottom of the screen.'),
      el('li', {}, 'Whoever in your team has this link installed can type answers — pick one phone and keep it handy.'),
      el('li', {}, 'Wrong answers don\'t cost you anything — keep trying.')),
    el('div', { class: 'cta' },
      el('button', { on: { click: dismiss } }, 'Let\'s go')));
  overlay.append(panel);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) dismiss(); });
  document.body.append(overlay);
}

// renderCompleted replaces the simple "Adventure complete!" line with a
// richer end-of-run card: team stats, distance, time, right/wrong.
async function renderCompleted(s) {
  // A placeholder while /summary loads.
  const host = el('div', { class: 'summary' });
  host.append(
    el('h2', {}, 'Adventure complete! 🎉'),
    el('div', { class: 'who' }, `${s.team_name || ''} · ${s.adventure_title || ''}`),
    el('p', { class: 'muted' }, 'Loading your run stats…'));
  app.append(host);

  let stats = null;
  try {
    const r = await api('/api/player/summary');
    if (r.status === 200) stats = r.body;
  } catch { /* ignore */ }
  if (!stats) {
    host.replaceChildren(
      el('h2', {}, 'Adventure complete! 🎉'),
      el('div', { class: 'who' }, `${s.team_name || ''} · ${s.adventure_title || ''}`),
      el('p', { class: 'muted' }, 'Could not load stats.'));
    return;
  }
  fillSummaryHost(host, stats);
}

function fillSummaryHost(host, stats) {
  host.replaceChildren(
    el('h2', {}, 'Adventure complete! 🎉'),
    el('div', { class: 'who' }, `${stats.team_name} · ${stats.adventure_title}`),
    el('div', { class: 'stats-grid' },
      statBox(formatDistance(stats.distance_m),       'Distance'),
      statBox(formatDuration(stats.duration_seconds), 'Time'),
      statBox(`${stats.answers_right}`,               'Correct answers'),
      statBox(`${stats.answers_wrong}`,               'Misses'),
    ),
    stats.page_count
      ? el('p', { class: 'muted', style: 'font-size:.85rem; margin-top:.75rem' },
          `Solved all ${stats.page_count} puzzle${stats.page_count === 1 ? '' : 's'}.`)
      : null,
  );
}

function statBox(value, label) {
  return el('div', { class: 'stat' },
    el('div', { class: 'v' }, value),
    el('div', { class: 'l' }, label));
}

function formatDistance(m) {
  if (!Number.isFinite(m) || m <= 0) return '—';
  if (m < 1000) return `${Math.round(m)} m`;
  return `${(m / 1000).toFixed(m >= 10000 ? 0 : 1)} km`;
}

function formatDuration(sec) {
  if (!Number.isFinite(sec) || sec <= 0) return '—';
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  const pad = (n) => String(n).padStart(2, '0');
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}

// Debug helper bound to Alt+C — renders a summary card with made-up numbers
// so the visual layout can be iterated on without finishing a run.
function showDebugSummary() {
  app.replaceChildren();
  const host = el('div', { class: 'summary' });
  app.append(host);
  fillSummaryHost(host, {
    team_name: 'Team Alfa',
    adventure_title: 'Demo: First Steps',
    page_count: 3,
    answers_right: 3,
    answers_wrong: 1,
    distance_m: 1742,
    duration_seconds: 48 * 60 + 12,
  });
}
function hideSubmitDock() {
  const dock = document.getElementById('submit-dock');
  if (dock) dock.remove();
}

// Bootstrap: a single HTTP probe decides auth (WebSocket upgrade failures
// can't be distinguished from network errors in the browser) and seeds the
// initial render. Afterwards the WebSocket takes over entirely.
async function bootstrap() {
  const s = await api('/api/player/state');
  if (s.status === 401) { renderNoSession(); return; }
  if (s.status !== 200) {
    app.replaceChildren(el('p', { class: 'err' }, s.body?.error || 'error'));
    return;
  }
  startGPS();
  render(s.body);
  connectWS();
}
bootstrap();
</script>
