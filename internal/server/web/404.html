<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Not found · Zonventure</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aclonica&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --accent: #ad1357; --ink: #1f3349; --muted: #6b7f96;
    --bg: #fbfbfd; --surface: #ffffff; --border-soft: #e2e7ef;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e7ecf4; --muted: #9db1cc; --bg: #14202e; --surface: #1f3349;
            --border-soft: #2c4361; --accent: #e24080; }
  }
  body {
    font: 16px/1.55 'Open Sans', system-ui, sans-serif;
    color: var(--ink); background: var(--bg);
    margin: 0; min-height: 100vh;
    display: grid; place-items: center; padding: 1rem;
  }
  .card {
    text-align: center;
    max-width: 28rem;
    padding: 2.5rem 2rem;
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,.08);
  }
  .num {
    font-family: 'Aclonica', Georgia, serif;
    font-size: 4rem; line-height: 1;
    color: var(--accent);
    margin: 0 0 .5rem;
  }
  h1 { font: 700 1.3rem/1.3 'Open Sans'; margin: 0 0 .5rem; }
  p { color: var(--muted); margin: 0 0 1.5rem; }
  .links { display: flex; gap: .75rem; justify-content: center; flex-wrap: wrap; }
  .btn {
    display: inline-block; padding: .55rem 1.25rem; border-radius: 999px;
    font-weight: 700; text-decoration: none;
    transition: opacity .12s, transform .12s, border-color .12s, color .12s;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.primary:hover { opacity: .92; }
  .btn.ghost { color: var(--ink); border: 1px solid var(--border-soft); background: var(--surface); }
  .btn.ghost:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
  <main class="card">
    <p class="num">404</p>
    <h1>This page wandered off-map.</h1>
    <p>The URL you tried doesn't exist on Zonventure. It may have been moved, mistyped, or never existed.</p>
    <div class="links">
      <a href="/" class="btn primary">Take me home</a>
      <a href="/manual" class="btn ghost">Read the manual</a>
    </div>
  </main>
</body></html>
