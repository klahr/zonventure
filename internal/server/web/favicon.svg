<!-- Zonventure mark: a pink arm, an orange slash and a pin, whose gaps
     draw a hidden Z. One colour at tab size, where the three brand
     colours blur together: ink on light tabs, white on dark ones. Top
     corners are rounded; the corners that draw the Z and the pin's tip
     stay sharp. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -24 314 314">
  <style>path { fill: #14202e; } @media (prefers-color-scheme: dark) { path { fill: #ffffff; } }</style>
