/* ========== Race simulator (admin only) ==========
   Drives a fake race inside the server so the live view can be
   exercised without real players on the ground. The heavy lifting
   (team movement, answer rolls, pings) happens server-side in the
   simulator package — this surface is just a control panel:
   pick an adventure + team count + speed, press Play, watch.
   Status polls every 1.5s so the state pill stays in sync with the
   server's own Pause/Resume/Reset. */
async function viewSimulator(view) {
  const [statusR, advR] = await Promise.all([
    api('/api/admin/simulator').catch(() => ({ ok: false, body: null })),
    api('/api/admin/adventures').catch(() => ({ ok: false, body: null })),
  ]);
  const status = statusR.ok ? statusR.body : { stage: 'idle' };
  const advs = (advR.body?.adventures || [])
    .filter((a) => a.page_count > 0)
    .sort((a, b) => a.title.localeCompare(b.title));

  // Controls — the form is visible even while a sim runs so the
  // operator can read back what they chose, but inputs are disabled
  // until Reset so you can't mutate a running simulation's config.
  const picker = h('select', { required: true },
    advs.length === 0
      ? h('option', { value: '' }, t('(no adventures)'))
      : advs.map((a) => h('option', { value: a.slug }, `${a.title} — ${a.page_count} ` + (a.page_count === 1 ? t('puzzle') : t('puzzles')))));
  if (status.adventure_slug) picker.value = status.adventure_slug;

  const teamInput = h('input', { type: 'number', min: '2', max: '20', value: String(status.team_count || 6) });
  const speedInput = h('input', { type: 'number', min: '1', max: '50', step: '1', value: String(status.speed_mul || 5) });

  // Stage pill, elapsed readout and live-view link are the three bits
  // the poll loop patches in place — capture references so we don't
  // tear the whole view down on every tick.
  const stagePill = h('span', { class: `pill ${stagePillClass(status.stage)}` }, t(stageLabel(status.stage)));
  const elapsed = h('span', { class: 'muted mono', style: 'font-size:.85rem' },
    (status.stage !== 'idle' && status.started_at)
      ? t('Live for {{t}}', { t: fmtElapsed(status.started_at) })
      : '');
  const liveSlot = h('span');
  const setLiveLink = (token) => {
    liveSlot.replaceChildren();
    if (token) {
      liveSlot.append(h('a', {
        href: `/live/${encodeURIComponent(token)}`, target: '_blank',
      }, icon(ICONS.eye), t('Open live view')));
    }
  };
  setLiveLink(status.live_token);

  const startBtn = h('button', {
    class: 'btn primary', type: 'button',
    on: { click: () => simulatorAction('start', {
      adventure_slug: picker.value,
      team_count: parseInt(teamInput.value, 10) || 6,
      speed_mul: parseFloat(speedInput.value) || 5,
    }) },
  }, icon(ICONS.play), t('Start'));
  const pauseBtn = h('button', {
    class: 'btn', type: 'button',
    on: { click: () => simulatorAction('pause') },
  }, t('Pause'));
  const resumeBtn = h('button', {
    class: 'btn', type: 'button',
    on: { click: () => simulatorAction('resume') },
  }, t('Resume'));
  const resetBtn = h('button', {
    class: 'btn danger', type: 'button',
    on: { click: () => simulatorAction('reset') },
  }, icon(ICONS.trash), t('Reset'));

  // applyStage patches the dynamic bits of the view for a given status
  // without rebuilding the DOM — survives transient fetch errors and
  // keeps the user's typing in the number inputs intact.
  const applyStage = (st) => {
    const stage = st?.stage || 'idle';
    stagePill.className = 'pill ' + stagePillClass(stage);
    stagePill.textContent = t(stageLabel(stage));
    elapsed.textContent = (stage !== 'idle' && st?.started_at)
      ? t('Live for {{t}}', { t: fmtElapsed(st.started_at) })
      : '';
    setLiveLink(st?.live_token);
    const idle = stage === 'idle';
    const paused = stage === 'paused';
    const running = stage === 'running';
    [picker, teamInput, speedInput].forEach((el) => { el.disabled = !idle; });
    startBtn.disabled = !idle;
    pauseBtn.disabled = !running;
    resumeBtn.disabled = !paused;
    resetBtn.disabled = idle;
  };
  applyStage(status);

  view.replaceChildren(
    h('div', { class: 'row between' },
      h('h1', {}, t('Simulator')),
      h('div', { class: 'row', style: 'gap:.5rem; align-items:center' },
        stagePill, elapsed, liveSlot)),
    h('p', { class: 'muted' },
      t('Fake a race so you can see the live view animate without recruiting real players. Writes to the same tables as a real event, so every subscriber (map, leaderboard, WS) updates as if players were on the ground.')),
    h('div', { class: 'card' },
      h('h2', {}, t('Configuration')),
      h('label', { class: 'field' }, h('span', {}, t('Adventure')), picker),
      h('label', { class: 'field' }, h('span', {}, t('Teams (2–20)')), teamInput),
      h('label', { class: 'field' }, h('span', {}, t('Speed multiplier (1–50)')), speedInput),
      h('p', { class: 'muted', style: 'font-size:.85rem' },
        t('Higher speed advances the walk faster without changing the ping cadence, so fast-forwarded events still look natural.'))),
    h('div', { class: 'row', style: 'gap:.5rem; flex-wrap:wrap; margin-top:1rem' },
      startBtn, pauseBtn, resumeBtn, resetBtn),
  );

  // Poll status only — no full re-render, no toast on blip. A dev
  // server restart or momentary WS loss shouldn't take the page down
  // with a NetworkError.
  if (simulatorPollTimer) clearInterval(simulatorPollTimer);
  const poll = async () => {
    if (!location.hash.startsWith('#simulator')) {
      clearInterval(simulatorPollTimer); simulatorPollTimer = null; return;
    }
    try {
      const r = await api('/api/admin/simulator');
      if (r.ok) applyStage(r.body);
    } catch { /* server restart or offline — the next tick will catch up */ }
  };
  simulatorPollTimer = setInterval(poll, 1500);
}

// simulatorAction posts a control command. Re-renders the view on
// success so inputs snap to whatever state the server is now in.
async function simulatorAction(kind, body) {
  let r;
  try {
    r = await api('/api/admin/simulator/' + kind, {
      method: 'POST',
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch {
    toastErr(t('Network error — is the server running?'));
    return;
  }
  if (!r.ok) {
    toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
    return;
  }
  if (kind === 'start') toastOk(t('Simulation started'));
  if (kind === 'reset') toastOk(t('Simulation reset'));
  renderRoute();
}

let simulatorPollTimer = null;

function stageLabel(stage) {
  switch (stage) {
    case 'running': return 'Running';
    case 'paused':  return 'Paused';
    default:        return 'Idle';
  }
}

function stagePillClass(stage) {
  switch (stage) {
    case 'running': return 'success';
    case 'paused':  return 'warning';
    default:        return '';
  }
}

function fmtElapsed(startISO) {
  const start = new Date(startISO);
  const sec = Math.max(0, Math.round((Date.now() - start.getTime()) / 1000));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const pad = (n) => String(n).padStart(2, '0');
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}

/* ========== Server logs (admin only) ==========
   xterm.js renders the stream, the server hands out each new Entry via
   /ws/logs, and a small control row lets the admin pick a minimum
   level + substring filter. Filter is client-side; level change hits
   the server so dropped entries never enter the ring buffer. */
async function viewLogs(view) {
  // xterm may not be ready yet if the defer scripts are still loading —
  // bail out with a polite retry.
  if (typeof Terminal === 'undefined') {
    view.replaceChildren(h('p', { class: 'muted' }, t('Loading terminal…')));
    setTimeout(() => { if (location.hash.startsWith('#logs')) viewLogs(view); }, 200);
    return;
  }

  const levels = ['DEBUG', 'INFO', 'WARN', 'ERROR'];
  // State shared between the control row and the WS listener.
  //
  // buffer keeps every entry the client has seen (snapshot + live),
  // bounded so long-running sessions don't blow up memory. passes(e)
  // is the filter+level predicate; repaintAll() clears the terminal
  // and replays the buffer through passes() — so changing the filter
  // or the client-level dropdown reapplies retroactively to the lines
  // already on screen, not just to new incoming entries.
  const state = {
    filter: '',
    minLevel: 'DEBUG',  // client-side floor; the server has its own
    paused: false,
    ws: null,
    lastSeq: 0,
  };
  const MAX_BUFFER = 5000;
  const buffer = [];

  const passes = (e) => {
    if (levelRank(e.level) < levelRank(state.minLevel)) return false;
    if (state.filter && !entryMatches(e, state.filter)) return false;
    return true;
  };
  const repaintAll = () => {
    term.reset();
    for (const e of buffer) if (passes(e)) writeEntry(term, e);
  };

  // Controls ----------------------------------------------------------
  const filterInput = h('input', {
    type: 'search', placeholder: t('Filter (substring)'),
    style: 'flex:1; min-width:10rem; box-shadow:none; border-color:var(--border-soft); margin:0',
  });
  // The audit view drops a one-shot HH:MM filter into sessionStorage so
  // a "view logs around this time" cross-link arrives pre-filtered.
  // Consume + clear on entry so navigating back here later doesn't
  // re-apply a stale filter.
  try {
    const pf = sessionStorage.getItem('zv_logs_prefilter');
    if (pf) {
      sessionStorage.removeItem('zv_logs_prefilter');
      filterInput.value = pf;
      state.filter = pf.toLowerCase();
    }
  } catch { /* ignore */ }
  filterInput.addEventListener('input', () => {
    state.filter = filterInput.value.toLowerCase();
    repaintAll();
  });

  const serverLevelSel = h('select', { class: 'zv-log-sel', title: t('Server log level') });
  for (const l of levels) {
    const opt = document.createElement('option');
    opt.value = l; opt.textContent = l;
    serverLevelSel.append(opt);
  }
  serverLevelSel.addEventListener('change', async () => {
    const rr = await api('/api/admin/logs/level', {
      method: 'PUT', body: JSON.stringify({ level: serverLevelSel.value }),
    });
    if (!rr.ok) toastErr(rr.body?.error || t('error {{status}}', { status: rr.status }));
  });

  const clientLevelSel = h('select', { class: 'zv-log-sel', title: t('Client-side minimum level') });
  for (const l of levels) {
    const opt = document.createElement('option');
    opt.value = l; opt.textContent = l;
    clientLevelSel.append(opt);
  }
  clientLevelSel.addEventListener('change', () => {
    state.minLevel = clientLevelSel.value;
    repaintAll();
  });

  const pauseBtn = h('button', { class: 'btn small', type: 'button' }, t('Pause'));
  pauseBtn.addEventListener('click', () => {
    state.paused = !state.paused;
    pauseBtn.textContent = state.paused ? t('Resume') : t('Pause');
  });
  const clearBtn = h('button', { class: 'btn small', type: 'button' }, t('Clear'));

  const controls = h('div', { class: 'row', style: 'gap:.5rem; flex-wrap:wrap; margin-bottom:.5rem; align-items:center' },
    h('span', { class: 'muted', style: 'font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; font-weight:700' },
      t('Server level')),
    serverLevelSel,
    h('span', { class: 'muted', style: 'font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; font-weight:700' },
      t('Show')),
    clientLevelSel,
    filterInput, pauseBtn, clearBtn,
  );

  // Terminal ---------------------------------------------------------
  const termHost = h('div', { class: 'zv-log-term' });
  const term = new Terminal({
    convertEol: true,
    scrollback: 5000,
    fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace',
    fontSize: 13,
    theme: {
      background: '#0e1420',
      foreground: '#d7dee8',
      cursor: '#1f3349',
      cursorAccent: '#0e1420',
    },
  });
  // Fit addon may not be loaded if the CDN is down — guard the call.
  let fit = null;
  if (typeof FitAddon !== 'undefined' && FitAddon.FitAddon) {
    fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
  }

  clearBtn.addEventListener('click', () => {
    // Drop the buffer too so the next repaint doesn't resurrect the
    // cleared output. New live entries will stream in fresh.
    buffer.length = 0;
    term.reset();
  });

  view.replaceChildren(h('h1', {}, t('Logs')), controls, termHost);

  // Mount + size. xterm wants a non-zero container at open.
  term.open(termHost);
  requestAnimationFrame(() => { try { fit && fit.fit(); } catch {} });
  const onResize = () => { try { fit && fit.fit(); } catch {} };
  window.addEventListener('resize', onResize);

  // ingest appends to the client buffer (bounded), and paints live
  // when (a) not paused and (b) the entry passes the filter+level
  // predicate. When the filter changes, repaintAll() replays buffer
  // through passes() so the already-rendered lines re-align with the
  // new filter.
  const ingest = (e) => {
    buffer.push(e);
    if (buffer.length > MAX_BUFFER) buffer.splice(0, buffer.length - MAX_BUFFER);
    state.lastSeq = Math.max(state.lastSeq, e.seq || 0);
    if (state.paused) return;
    if (passes(e)) writeEntry(term, e);
  };

  // Initial snapshot + live stream --------------------------------
  const initial = await api('/api/admin/logs');
  const serverLevel = initial.body?.level || 'INFO';
  serverLevelSel.value = serverLevel;
  clientLevelSel.value = 'DEBUG';
  for (const e of (initial.body?.entries || [])) ingest(e);

  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const sock = new WebSocket(`${proto}//${location.host}/ws/logs`);
  state.ws = sock;
  sock.onmessage = (ev) => {
    let msg; try { msg = JSON.parse(ev.data); } catch { return; }
    if (!msg || msg.kind !== 'entry') return;
    const e = msg.data;
    if (!e) return;
    ingest(e);
  };

  // Tear down when the route changes so we don't keep WS open.
  const cleanup = () => {
    window.removeEventListener('resize', onResize);
    try { sock.close(); } catch {}
    try { term.dispose(); } catch {}
    window.removeEventListener('hashchange', onHash);
  };
  const onHash = () => {
    if (!location.hash.startsWith('#logs')) cleanup();
  };
  window.addEventListener('hashchange', onHash);
}

/* ========== Audit log (admin + org_admin) ==========
   Reads /api/admin/auth-events with a paginated cursor (before_id).
   Server-side scoping: admins see every row, org_admins see only their
   org's users. The view stays a plain table — this is a forensics
   surface, not a dashboard, so density beats prettiness. */
async function viewAudit(view) {
  const PAGE = 100;
  let oldestID = 0; // 0 = no cursor; means "newest page"

  const tbody = h('tbody', {});
  const moreBtn = h('button', { class: 'btn', on: { click: loadMore } }, t('Load more'));
  const status = h('span', { class: 'muted' });

  const table = h('table', { class: 'audit-table' },
    h('thead', {},
      h('tr', {},
        h('th', {}, t('Time')),
        h('th', {}, t('Event')),
        h('th', {}, t('Result')),
        h('th', {}, t('User')),
        h('th', {}, t('IP')),
        h('th', {}, t('Reason')))),
    tbody);

  view.replaceChildren(
    h('h1', {}, t('Audit')),
    h('p', { class: 'muted' },
      t('Login, set-password, magic-link and logout events. Newest first.')),
    table,
    h('div', { class: 'row', style: 'gap:.75rem; align-items:center; margin-top:.6rem;' }, moreBtn, status),
  );

  await loadMore();

  async function loadMore() {
    moreBtn.disabled = true;
    status.textContent = t('Loading…');
    try {
      const qs = new URLSearchParams({ limit: String(PAGE) });
      if (oldestID > 0) qs.set('before_id', String(oldestID));
      const r = await api('/api/admin/auth-events?' + qs.toString());
      const events = r.events || [];
      for (const e of events) {
        tbody.appendChild(renderAuditRow(e));
      }
      if (events.length > 0) oldestID = events[events.length - 1].id;
      if (events.length < PAGE) {
        moreBtn.hidden = true;
        status.textContent = events.length === 0 && tbody.children.length === 0
          ? t('No events recorded.')
          : t('End of log.');
      } else {
        status.textContent = '';
      }
    } catch (err) {
      status.textContent = String(err);
    } finally {
      moreBtn.disabled = false;
    }
  }
}

function renderAuditRow(e) {
  const okClass = e.ok ? 'audit-ok' : 'audit-fail';
  const okLabel = e.ok ? t('ok') : t('fail');
  const ts = formatAuditTS(e.ts);
  const username = e.username || (e.user_id ? '#' + e.user_id : '—');
  // Cross-link to server logs: tapping the timestamp pre-fills the
  // logs-view filter with a substring drawn from this event's clock
  // time (HH:MM), so the admin lands on the same window of activity
  // without manually copy-pasting. Admin-only — org_admins don't see
  // the logs view at all.
  const tsCell = h('td', { class: 'mono' }, ts);
  if (state.me && state.me.role === 'admin') {
    const m = /T(\d{2}:\d{2})/.exec(e.ts || '');
    if (m) {
      tsCell.style.cursor = 'pointer';
      tsCell.title = t('Open server logs around this time');
      tsCell.addEventListener('click', () => {
        try { sessionStorage.setItem('zv_logs_prefilter', m[1]); } catch { /* ignore */ }
        nav('#logs');
      });
    }
  }
  // Inline details button — `title` tooltips work on desktop hover but
  // are completely invisible on touch devices. Replacing the implicit
  // hover with an explicit affordance gives admins the full UA + reason
  // + IP without copy-pasting from `view source`.
  const detailsBtn = h('button', {
    type: 'button',
    class: 'btn small ghost',
    style: 'padding:.15rem .55rem; font-size:.75rem; line-height:1',
    title: t('Show details'),
    on: { click: () => showAuditDetailsModal(e) },
  }, t('Details'));
  return h('tr', {},
    tsCell,
    h('td', {}, e.event),
    h('td', {}, h('span', { class: 'audit-pill ' + okClass }, okLabel)),
    h('td', {}, username),
    h('td', { class: 'mono' }, e.ip || '—'),
    h('td', { class: 'muted' }, h('div', {
      class: 'row', style: 'gap:.5rem; align-items:center; justify-content:space-between',
    }, h('span', {}, e.reason || ''), detailsBtn)));
}

function showAuditDetailsModal(e) {
  modal(t('Audit event #{{id}}', { id: e.id }), ({ body, close }) => {
    const dl = h('dl', { class: 'audit-details' });
    const row = (label, val) => {
      dl.append(h('dt', {}, label), h('dd', {}, val || '—'));
    };
    row(t('Time'),       formatAuditTS(e.ts));
    row(t('Event'),      e.event);
    row(t('Result'),     e.ok ? t('ok') : t('fail'));
    row(t('User'),       e.username || (e.user_id ? '#' + e.user_id : '—'));
    row(t('IP'),         e.ip || '');
    row(t('Reason'),     e.reason || '');
    row(t('User-Agent'), e.user_agent || '');
    body.append(dl,
      h('div', { class: 'row end', style: 'margin-top:.75rem' },
        h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, t('Close'))));
  });
}

/* ========== Webhooks ==========
   Per-org outbound webhook endpoints. The arranger configures a URL
   they own (Slack-bot, Zapier hook, internal dashboard), picks which
   event kinds they want, and the worker fires HMAC-signed POSTs at
   them as runs/teams/purchases progress. The secret is shown once
   on create/rotate; thereafter only an 8-char hint is visible.
*/

async function viewWebhooks(view) {
  const [endpointsR, kindsR] = await Promise.all([
    api('/api/admin/webhooks'),
    api('/api/admin/webhook-event-kinds'),
  ]);
  if (!endpointsR.ok) {
    view.replaceChildren(h('p', { class: 'err' },
      t('Could not load webhooks ({{status}}).', { status: endpointsR.status })));
    return;
  }
  const endpoints = endpointsR.body?.endpoints || [];
  const kinds = kindsR.body?.event_kinds || [];

  const addBtn = h('button', { class: 'btn primary', type: 'button' },
    icon(ICONS.plus), t('Add endpoint'));
  addBtn.addEventListener('click', async () => {
    const created = await openWebhookForm({ kinds });
    if (created) viewWebhooks(view); // reload
  });

  const cards = endpoints.length
    ? endpoints.map((ep) => renderWebhookCard(ep, kinds, () => viewWebhooks(view)))
    : [renderWebhookEmpty(addBtn)];

  view.replaceChildren(
    h('div', { class: 'row', style: 'align-items:center; justify-content:space-between' },
      h('h1', {}, t('Webhooks')),
      endpoints.length ? addBtn : null,
    ),
    h('p', { class: 'muted' },
      t('Outbound HTTP callbacks for run / team / purchase lifecycle. Each delivery is signed with HMAC-SHA256; verify the X-Zv-Signature header against your endpoint\'s secret.')),
    ...cards,
  );
}

function renderWebhookEmpty(addBtn) {
  return h('div', { class: 'card', style: 'text-align:center; padding:2rem' },
    h('p', { class: 'muted', style: 'margin-bottom:1rem' },
      t('No webhook endpoints yet. Add one to receive lifecycle events on a URL you control.')),
    addBtn,
  );
}

function renderWebhookCard(ep, kinds, reload) {
  const statusBadge = h('span', {
    class: 'chip ' + (ep.active ? 'ok' : ''),
    style: ep.active ? '' : 'opacity:.6',
  }, ep.active ? t('Active') : t('Disabled'));

  const kindChips = (ep.event_kinds || []).map((k) =>
    h('span', { class: 'chip', style: 'font-family:monospace; font-size:.78rem' }, k));

  const editBtn = iconBtn('pencil', t('Edit'), async () => {
    const updated = await openWebhookForm({ kinds, existing: ep });
    if (updated) reload();
  });
  const testBtn = h('button', { class: 'btn small', type: 'button', title: t('Send test event') },
    icon(ICONS.fastForward), t('Send test'));
  testBtn.addEventListener('click', async () => {
    if (!ep.active) {
      toastErr(t('Re-enable the endpoint first.'));
      return;
    }
    testBtn.disabled = true;
    try {
      const r = await api(`/api/admin/webhooks/${ep.id}/test`, { method: 'POST' });
      if (r.status === 202) {
        toastOk(t('Test queued. Watch your endpoint logs (delivery within ~5s).'));
      } else {
        toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
      }
    } finally {
      testBtn.disabled = false;
    }
  });
  const rotateBtn = h('button', { class: 'btn small', type: 'button',
    title: t('Mint a new secret. The old one stops working immediately.') },
    icon(ICONS.key), t('Rotate secret'));
  rotateBtn.addEventListener('click', async () => {
    const ok = await confirmDanger(
      t('Rotate secret?'),
      t('This invalidates the current secret immediately. Deploy the new secret to your verifier first if you want zero downtime.'));
    if (!ok) return;
    const r = await api(`/api/admin/webhooks/${ep.id}/rotate-secret`, { method: 'POST' });
    if (r.ok && r.body?.secret) {
      await openSecretReveal({ secret: r.body.secret, title: t('New webhook secret') });
      reload();
    } else {
      toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
    }
  });
  const logBtn = h('button', { class: 'btn small', type: 'button',
    title: t('Inspect this endpoint\'s delivery history') },
    icon(ICONS.terminal), t('Delivery log'));
  logBtn.addEventListener('click', () => nav('#webhooks/log/' + ep.id));
  const toggleBtn = h('button', { class: 'btn small', type: 'button' },
    ep.active ? t('Disable') : t('Enable'));
  toggleBtn.addEventListener('click', async () => {
    const r = await api(`/api/admin/webhooks/${ep.id}`, {
      method: 'PATCH',
      body: JSON.stringify({ active: !ep.active }),
    });
    if (r.status === 204) {
      toastOk(ep.active ? t('Endpoint disabled.') : t('Endpoint enabled.'));
      reload();
    } else {
      toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
    }
  });
  const deleteBtn = iconBtn('trash', t('Delete endpoint'), async () => {
    const ok = await confirmDanger(
      t('Delete endpoint?'),
      t('This stops all future deliveries to this URL. Past deliveries are removed too. Cannot be undone.'));
    if (!ok) return;
    const r = await api(`/api/admin/webhooks/${ep.id}`, { method: 'DELETE' });
    if (r.status === 204) {
      toastOk(t('Endpoint deleted.'));
      reload();
    } else {
      toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
    }
  }, { danger: true });

  return h('div', { class: 'card' },
    h('div', { class: 'row', style: 'align-items:center; justify-content:space-between; gap:.5rem; flex-wrap:wrap' },
      h('div', {},
        h('h2', { style: 'margin:0' }, ep.name || t('(unnamed endpoint)'))),
      h('div', { class: 'row', style: 'gap:.4rem; flex-wrap:wrap' },
        statusBadge, editBtn, deleteBtn),
    ),
    h('p', { class: 'muted', style: 'margin:.5rem 0; font-family:monospace; word-break:break-all' }, ep.url),
    kindChips.length
      ? h('div', { class: 'row', style: 'gap:.3rem; flex-wrap:wrap; margin:.5rem 0' }, ...kindChips)
      : h('p', { class: 'muted', style: 'font-size:.85rem' }, t('(no events subscribed)')),
    h('p', { class: 'muted', style: 'font-size:.8rem; margin:.5rem 0' },
      t('Secret hint: '),
      h('span', { style: 'font-family:monospace' }, (ep.secret_hint || '') + '…'),
      ' · ',
      t('Created {{date}}', { date: ep.created_at })),
    h('div', { class: 'row', style: 'gap:.4rem; flex-wrap:wrap; margin-top:.75rem' },
      testBtn, logBtn, rotateBtn, toggleBtn),
  );
}

// openWebhookForm is the shared modal used for both create and edit.
// Returns truthy on save, null on cancel.
async function openWebhookForm({ kinds, existing }) {
  const isEdit = !!existing;
  return modal(isEdit ? t('Edit webhook') : t('Add webhook'), ({ body, close }) => {
    const nameInput = h('input', { type: 'text', value: existing?.name || '',
      placeholder: t('e.g. prod-slack') });
    const urlInput = h('input', { type: 'url', required: true,
      value: existing?.url || '', placeholder: 'https://example.com/webhook' });

    const subscribed = new Set(existing?.event_kinds || []);
    const checks = kinds.map((k) => {
      const cb = h('input', { type: 'checkbox', value: k, checked: subscribed.has(k) });
      return h('label', {
        class: 'row',
        style: 'gap:.5rem; align-items:center; padding:.25rem 0; cursor:pointer',
      }, cb, h('code', { style: 'font-size:.85rem' }, k));
    });

    const err = h('p', { class: 'err', style: 'display:none' });
    const form = h('form', {},
      h('label', { class: 'field' }, h('span', {}, t('Name')), nameInput),
      h('label', { class: 'field' }, h('span', {}, t('Endpoint URL')), urlInput),
      h('p', { class: 'muted', style: 'font-size:.8rem; margin:.25rem 0 .5rem' },
        t('Must be https. Localhost is allowed for development.')),
      h('div', { class: 'field' },
        h('span', {}, t('Subscribed events')),
        h('div', {}, ...checks)),
      err,
      h('div', { class: 'row end', style: 'gap:.5rem; margin-top:1rem' },
        h('button', { class: 'btn', type: 'button',
          on: { click: () => close(null) } }, t('Cancel')),
        h('button', { class: 'btn primary', type: 'submit' },
          isEdit ? t('Save') : t('Create')),
      ));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const eventKinds = checks
        .map((label) => label.querySelector('input'))
        .filter((cb) => cb.checked)
        .map((cb) => cb.value);
      if (eventKinds.length === 0) {
        err.style.display = ''; err.textContent = t('Select at least one event kind.');
        return;
      }
      err.style.display = 'none';
      if (isEdit) {
        const patch = {
          name: nameInput.value,
          url: urlInput.value,
          event_kinds: eventKinds,
        };
        const r = await api(`/api/admin/webhooks/${existing.id}`, {
          method: 'PATCH',
          body: JSON.stringify(patch),
        });
        if (r.status === 204) {
          toastOk(t('Webhook updated.'));
          close(true);
        } else {
          err.style.display = ''; err.textContent = r.body?.error || t('error {{status}}', { status: r.status });
        }
      } else {
        const r = await api('/api/admin/webhooks', {
          method: 'POST',
          body: JSON.stringify({
            name: nameInput.value,
            url: urlInput.value,
            event_kinds: eventKinds,
          }),
        });
        if (r.status === 201 && r.body?.secret) {
          // Successfully created — reveal the secret, then signal
          // success to the caller so it reloads the list.
          close(true);
          await openSecretReveal({ secret: r.body.secret, title: t('Webhook created') });
        } else {
          err.style.display = ''; err.textContent = r.body?.error || t('error {{status}}', { status: r.status });
        }
      }
    });
    body.append(form);
    setTimeout(() => urlInput.focus(), 20);
  });
}

// openSecretReveal shows the secret exactly once with a copy button
// and a hard "this is the only time" warning. Used after create AND
// after rotate.
async function openSecretReveal({ secret, title }) {
  return modal(title, ({ body, close }) => {
    const copyBtn = h('button', { class: 'btn', type: 'button' }, icon(ICONS.copy), t('Copy'));
    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(secret);
        toastOk(t('Secret copied'));
      } catch {
        toastErr(t('Copy failed'));
      }
    });
    body.append(
      h('p', { style: 'color:var(--accent); font-weight:600' },
        t('This is the only time the secret will be shown. Store it somewhere safe.')),
      h('pre', {
        style: 'background:var(--surface-2); padding:.75rem; border-radius:8px; ' +
               'font-size:.85rem; word-break:break-all; white-space:pre-wrap; user-select:all',
      }, secret),
      h('p', { class: 'muted', style: 'font-size:.8rem' },
        t('Configure your verifier with this value. Compute HMAC-SHA256 over the raw request body and compare to the X-Zv-Signature header (after stripping the "sha256=" prefix).')),
      h('div', { class: 'row end', style: 'gap:.5rem; margin-top:1rem' },
        copyBtn,
        h('button', { class: 'btn primary', type: 'button',
          on: { click: () => close(true) } }, t('I\'ve saved it')),
      ),
    );
  });
}

// webhookLogPoll keeps a setInterval id while the log view is
// active so we can refresh the list automatically while the worker
// is still attempting pending deliveries. Module-level + cleared
// from renderRoute on every navigation away (mirroring the
// unwatchRun pattern) so a left-behind interval can't leak.
let webhookLogPoll = null;
function stopWebhookLogPoll() {
  if (webhookLogPoll) { clearInterval(webhookLogPoll); webhookLogPoll = null; }
}

// viewWebhooksLog renders one endpoint's delivery audit log: every
// attempt, status code, raw payload. Used to debug "did Slack get
// the team.completed I expected?" without tailing server logs.
// Always scoped to a single endpoint — the page is reached from the
// "Delivery log" button on each endpoint's card, which carries the
// id in the URL.
async function viewWebhooksLog(view, endpointID) {
  // Look the endpoint up so we can show its name + URL in the page
  // header. Org scoping is enforced server-side; if the id doesn't
  // belong to the caller's org we drop them back at the index.
  const endpointsR = await api('/api/admin/webhooks');
  const endpoint = (endpointsR.body?.endpoints || []).find((e) => e.id === endpointID);
  if (!endpoint) { nav('#webhooks'); return; }

  const filter = { status: '' };
  let nextBefore = 0;
  let deliveries = [];
  // Track which delivery rows the user has expanded so a poll-driven
  // rebuild restores them. Keyed by delivery id (server-assigned, so
  // stable across refreshes). Lives at view-scope and dies with the
  // navigation away.
  const expanded = new Set();

  const statusSelect = h('select', { class: 'btn small' },
    h('option', { value: '' },          t('Any status')),
    h('option', { value: 'pending' },   t('Waiting')),
    h('option', { value: 'delivered' }, t('Delivered')),
    h('option', { value: 'dead' },      t('Dead')),
  );
  const refreshBtn = h('button', { class: 'btn small', type: 'button' },
    icon(ICONS.crosshair), t('Refresh'));

  const list = h('div', { class: 'webhook-log' });
  const loadMoreBtn = h('button', { class: 'btn', type: 'button',
    style: 'display:none; margin-top:1rem' }, t('Load more'));
  const status = h('p', { class: 'muted' });

  // fetchPage handles three call shapes:
  //   - { reset: true,  quiet: false } — user clicked Refresh / changed filter:
  //     show "Loading…", clear DOM, repopulate.
  //   - { reset: true,  quiet: true  } — background auto-poll:
  //     keep existing DOM visible until new data arrives, then swap
  //     the list atomically. No flicker, no loading text.
  //   - { reset: false, quiet: false } — "Load more": append next page.
  async function fetchPage({ reset = false, quiet = false } = {}) {
    if (reset && !quiet) {
      deliveries = []; nextBefore = 0;
      list.replaceChildren();
      status.textContent = t('Loading…');
    }
    const params = new URLSearchParams();
    params.set('limit', '50');
    params.set('endpoint_id', String(endpointID));
    if (filter.status) params.set('status', filter.status);
    // Cursor only applies on append-mode loads. A reset (whether
    // quiet or loud) wants a fresh first page.
    if (!reset && nextBefore) params.set('before', String(nextBefore));
    const r = await api('/api/admin/webhooks/deliveries?' + params.toString());
    if (!r.ok) {
      // On a quiet poll we don't want to overwrite the list with an
      // error if we briefly drop a request — keep what's on screen
      // and try again next tick. Loud loads do surface the error.
      if (!quiet) {
        status.className = 'err';
        status.textContent = t('Could not load deliveries ({{status}}).', { status: r.status });
      }
      return;
    }
    const incoming = r.body?.deliveries || [];
    if (reset) {
      // Build the replacement DOM off-screen, then swap once. For
      // quiet polls this means the visible list stays stable until
      // the new content is ready — no empty-then-fill flash. The
      // `expanded` set is passed through so any row the user had
      // open before the rebuild reopens with the same payload
      // visible, no manual re-click required.
      const frag = document.createDocumentFragment();
      for (const d of incoming) frag.appendChild(renderDeliveryRow(d, expanded));
      list.replaceChildren(frag);
      deliveries = incoming.slice();
    } else {
      for (const d of incoming) list.appendChild(renderDeliveryRow(d, expanded));
      deliveries = deliveries.concat(incoming);
    }
    nextBefore = r.body?.next_before || 0;
    if (deliveries.length === 0) {
      status.className = 'muted';
      status.textContent = t('No deliveries yet. Send a test from the Webhooks page to see one land here.');
      loadMoreBtn.style.display = 'none';
    } else {
      status.className = 'muted';
      status.textContent = t('Showing {{n}} delivery row(s).', { n: deliveries.length });
      loadMoreBtn.style.display = nextBefore > 0 ? '' : 'none';
    }
  }

  statusSelect.addEventListener('change', () => {
    filter.status = statusSelect.value;
    fetchPage({ reset: true });
  });
  refreshBtn.addEventListener('click', () => fetchPage({ reset: true }));
  loadMoreBtn.addEventListener('click', () => fetchPage({ reset: false }));

  view.replaceChildren(
    h('button', { class: 'btn ghost small', type: 'button',
      on: { click: () => nav('#webhooks') } },
      icon(ICONS.back), t('Back to webhooks')),
    h('h1', { style: 'margin-top:.75rem' },
      t('Delivery log: {{name}}', { name: endpoint.name || t('(unnamed endpoint)') })),
    h('p', { class: 'muted', style: 'font-family:monospace; word-break:break-all; margin:.25rem 0' },
      endpoint.url),
    h('p', { class: 'muted' },
      t('Click a row to see the raw JSON we POSTed and the verifier-side signature inputs.')),
    h('div', { class: 'row', style: 'gap:.5rem; flex-wrap:wrap; margin:1rem 0' },
      statusSelect, refreshBtn),
    list,
    loadMoreBtn,
    status,
  );
  await fetchPage({ reset: true });

  // Auto-refresh while any row is still pending. The worker attempts
  // every 5s and exponentially backs off after failure; polling at
  // 4s catches the first success/failure transition without thrashing.
  // Self-stops once everything has settled (delivered/dead) so an
  // open log page on a quiet org isn't a constant DB hit. Uses
  // quiet=true so the visible list stays put until the new data
  // arrives — no "list goes empty then fills" flash on every tick.
  stopWebhookLogPoll();
  webhookLogPoll = setInterval(() => {
    if (!deliveries.some((d) => d.status === 'pending')) {
      stopWebhookLogPoll();
      return;
    }
    fetchPage({ reset: true, quiet: true });
  }, 4000);
}

// renderDeliveryRow returns one delivery as a clickable card. Click
// expands to show the pretty-printed payload, signature inputs and
// retry metadata. The card is collapsed by default to keep the log
// scrollable on small screens.
//
// `expanded` is a Set<deliveryID> shared across rebuilds — when a
// poll regenerates the list, rows whose id is in the set are
// rendered already-open so the user's manual expansion survives.
function renderDeliveryRow(d, expanded) {
  const statusClass = ({ delivered: 'ok', dead: 'err', pending: '' })[d.status] || '';
  const statusChip = h('span',
    { class: 'chip ' + statusClass },
    statusLabel(d.status));
  // Outcome chip:
  //   - last_status set    → show "HTTP <code>", green for 2xx, red otherwise
  //   - attempts > 0 only  → transport-level failure (DNS, connection
  //                          refused, timeout) — no HTTP code came back.
  //                          Show a red "No response" chip so the user
  //                          isn't left wondering why a failing row
  //                          looks identical to an un-attempted one.
  //   - attempts == 0      → never attempted yet; render nothing.
  let httpChip = null;
  if (d.last_status != null) {
    httpChip = h('span', {
      class: 'chip ' + httpStatusClass(d.last_status),
      style: 'font-family:monospace',
    }, String(d.last_status));
  } else if (d.attempts > 0) {
    httpChip = h('span', { class: 'chip err' }, t('No response'));
  }
  const kindChip = h('span',
    { class: 'chip', style: 'font-family:monospace; font-size:.78rem' },
    d.event_kind);

  const head = h('div', {
    class: 'row',
    style: 'gap:.5rem; align-items:center; flex-wrap:wrap; cursor:pointer',
  },
    statusChip, httpChip, kindChip,
    h('span', { class: 'muted', style: 'font-size:.85rem' }, d.created_at),
    h('span', { class: 'muted', style: 'font-size:.85rem; flex:1; text-align:right' },
      d.endpoint_name || t('(unnamed endpoint)')),
  );

  // The expandable detail body — built lazily on first expand so the
  // log can render hundreds of rows without parsing every payload.
  // Persistence across rebuilds is handled via the `expanded` set.
  const isOpen = expanded && expanded.has(d.id);
  const detail = h('div', { style: 'margin-top:.75rem; display:' + (isOpen ? '' : 'none') });
  let built = false;
  const ensureBuilt = () => {
    if (!built) {
      built = true;
      detail.append(...renderDeliveryDetail(d));
    }
  };
  if (isOpen) ensureBuilt();
  head.addEventListener('click', () => {
    ensureBuilt();
    if (detail.style.display === 'none') {
      detail.style.display = '';
      if (expanded) expanded.add(d.id);
    } else {
      detail.style.display = 'none';
      if (expanded) expanded.delete(d.id);
    }
  });

  return h('div', { class: 'card', style: 'padding:.85rem 1rem' }, head, detail);
}

function renderDeliveryDetail(d) {
  const out = [];

  // Metadata line: signature inputs the verifier-side handler wants.
  out.push(h('p', { class: 'muted', style: 'font-size:.82rem; margin:.25rem 0' },
    h('strong', {}, 'X-Zv-Delivery-Id: '),
    h('code', {}, d.delivery_uuid),
  ));
  out.push(h('p', { class: 'muted', style: 'font-size:.82rem; margin:.25rem 0' },
    h('strong', {}, t('Attempts: ')),
    String(d.attempts),
    d.delivered_at
      ? h('span', {}, ' · ', h('strong', {}, t('Delivered at: ')), d.delivered_at)
      : null,
    d.status === 'pending' && d.next_attempt_at
      ? h('span', {}, ' · ', h('strong', {}, t('Next attempt: ')), d.next_attempt_at)
      : null,
  ));
  if (d.last_error) {
    out.push(h('div', { class: 'callout warn',
      style: 'font-family:monospace; font-size:.82rem; white-space:pre-wrap' },
      d.last_error));
  }
  // Pretty-printed JSON. Falls back to the raw text if the payload
  // doesn't parse for any reason — defensive, since a corrupted row
  // shouldn't break the whole log.
  let pretty = d.payload;
  try { pretty = JSON.stringify(JSON.parse(d.payload), null, 2); } catch {}
  out.push(h('pre', {
    style: 'background:var(--surface-2); padding:.75rem 1rem; border-radius:8px; ' +
           'overflow-x:auto; font-size:.82rem; line-height:1.5; max-height:32rem; ' +
           'white-space:pre',
  }, pretty));
  return out;
}

function statusLabel(s) {
  switch (s) {
    case 'delivered': return t('Delivered');
    case 'pending':   return t('Waiting');
    case 'dead':      return t('Dead');
  }
  return s;
}
// Strict 2xx vs everything-else colouring per the operator's
// preference: a green chip means "the customer's endpoint accepted
// it"; any other code (4xx, 5xx, transport error → 0) means
// "something needs attention".
function httpStatusClass(code) {
  return (code >= 200 && code < 300) ? 'ok' : 'err';
}

// confirmDanger is a small destructive-action confirmation modal.
// Returns true if the user clicked the danger button.
async function confirmDanger(title, message) {
  return modal(title, ({ body, close }) => {
    body.append(
      h('p', { style: 'margin-bottom:1rem' }, message),
      h('div', { class: 'row end', style: 'gap:.5rem' },
        h('button', { class: 'btn', type: 'button',
          on: { click: () => close(false) } }, t('Cancel')),
        h('button', { class: 'btn danger', type: 'button',
          on: { click: () => close(true) } }, t('Confirm')),
      ));
  });
}

async function viewSettings(view) {
  const me = state.me || {};
  const isOrgUser = !!me.org_id;

  const pwCard = renderSettingsPasswordCard();
  const emailCard = renderSettingsEmailCard(me);
  const dangerCard = renderSettingsDeleteCard();
  const exportCard = renderSettingsExportCard();
  const sessionsCard = renderSettingsSessionsCard();
  const auditCard = renderSettingsAuditCard();
  // Webhooks + Manual were lifted out of the daily sidebar — most
  // arrangers don't think about either every visit. Surfaced here as
  // discoverable cards so they're one click away when needed.
  const integrationsCard = isOrgUser ? renderSettingsIntegrationsCard() : null;
  const helpCard = renderSettingsHelpCard();

  view.replaceChildren(
    h('h1', {}, t('Settings')),
    h('p', { class: 'muted' },
      t('Manage your account. Changes are immediate; deleting your account also removes its data.')),
    pwCard, emailCard,
    sessionsCard, auditCard,
    exportCard,
    integrationsCard,
    helpCard,
    dangerCard,
  );
}

function renderSettingsSessionsCard() {
  // Active sessions surface — list each session this user is currently
  // logged into, including one for "this device". Per-row Sign out
  // calls /api/admin/me/sessions/{id}; "Sign out everywhere else"
  // wipes all but the current. Mirrors the security UX users have
  // come to expect from Google / GitHub / etc.
  const card = h('div', { class: 'card settings-card' });
  const list = h('div');
  const status = h('p', { class: 'muted', style: 'font-size:.85rem; margin:.5rem 0 0' });
  const refresh = async () => {
    list.replaceChildren(h('p', { class: 'muted', style: 'font-size:.85rem' }, t('Loading…')));
    const r = await api('/api/admin/me/sessions');
    if (!r.ok) {
      list.replaceChildren(h('p', { class: 'err' }, r.body?.error || t('error {{status}}', { status: r.status })));
      return;
    }
    const sessions = r.body?.sessions || [];
    if (sessions.length === 0) {
      list.replaceChildren(h('p', { class: 'muted' }, t('No active sessions.')));
      return;
    }
    list.replaceChildren(...sessions.map((s) => h('div', { class: 'session-row' },
      h('div', { class: 'session-row-info' },
        h('div', { class: 'session-row-name' },
          s.current ? h('span', { class: 'pill success' }, t('this device')) : null,
          s.user_agent ? shortUA(s.user_agent) : t('Unknown device')),
        h('div', { class: 'session-row-meta' },
          t('Created {{when}}', { when: formatAuditTS(s.created_at) }),
          s.ip ? ' · ' + t('from {{ip}}', { ip: s.ip }) : '',
          s.expires_at ? ' · ' + t('expires {{when}}', { when: formatAuditTS(s.expires_at) }) : '')),
      s.current
        ? null
        : h('button', { class: 'btn small danger', type: 'button',
            on: { click: async () => {
              const rr = await api('/api/admin/me/sessions/' + encodeURIComponent(s.id),
                { method: 'DELETE' });
              if (rr.status === 204) { toastOk(t('Session signed out')); refresh(); }
              else toastErr(rr.body?.error || t('error {{status}}', { status: rr.status }));
            } } },
            t('Sign out')),
    )));
  };

// shortUA chops a User-Agent string to something glanceable. Full UA
// is still in the audit details modal for global admins; in the
// per-user list we just want "iPhone Safari" or similar.
function shortUA(ua) {
  if (!ua) return '';
  // Quick OS/browser detection — good enough for an at-a-glance label.
  let os = 'Other';
  if (/Windows/.test(ua)) os = 'Windows';
  else if (/Macintosh|Mac OS X/.test(ua)) os = 'macOS';
  else if (/Android/.test(ua)) os = 'Android';
  else if (/iPhone|iPad|iOS/.test(ua)) os = 'iOS';
  else if (/Linux/.test(ua)) os = 'Linux';
  let browser = 'Browser';
  if (/Edg\//.test(ua)) browser = 'Edge';
  else if (/Chrome\//.test(ua)) browser = 'Chrome';
  else if (/Firefox\//.test(ua)) browser = 'Firefox';
  else if (/Safari\//.test(ua) && !/Chrome/.test(ua)) browser = 'Safari';
  return os + ' · ' + browser;
}

function renderSettingsExportCard() {
  const status = h('p', { class: 'muted', style: 'font-size:.85rem' });
  // Plain <a download> would also work, but going through fetch lets
  // us surface 4xx errors as a toast instead of a confusing browser
  // download of an HTML error page.
  const dl = h('button', { class: 'btn', type: 'button' }, t('Download my data'));
  dl.addEventListener('click', async () => {
    dl.disabled = true; status.className = 'muted'; status.textContent = t('Preparing export…');
    try {
      const res = await fetch('/api/admin/me/export', { credentials: 'same-origin' });
      if (!res.ok) {
        status.className = 'err';
        status.textContent = t('error {{status}}', { status: res.status });
        return;
      }
      const blob = await res.blob();
      const cd = res.headers.get('Content-Disposition') || '';
      const m = cd.match(/filename="([^"]+)"/);
      const name = m ? m[1] : 'zonventure-export.json';
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.append(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      status.className = 'ok'; status.textContent = t('Downloaded {{name}}.', { name });
    } catch (e) {
      status.className = 'err'; status.textContent = String(e);
    } finally {
      dl.disabled = false;
    }
  });
  return h('div', { class: 'card settings-card' },
    h('h2', {}, t('Download my data')),
    h('p', { class: 'muted', style: 'font-size:.9rem' },
      t('A single JSON file with your account data plus your organization\'s runs, teams, adventures, assignments and purchases.')),
    h('div', { class: 'row end' }, dl),
    status,
  );
}

// renderSlotExpiryHint returns a small inline badge for the magic-link
// expiry. Past → "expired" in red. Within 7 days → muted "expires in Nd".
// More than 7 days out OR null → empty string (no badge), to avoid
// noise in the common case where the link is healthy.
function renderSlotExpiryHint(expiresAt, _lastLogin) {
  if (!expiresAt) return null;
  const iso = expiresAt.includes('T') ? expiresAt : expiresAt.replace(' ', 'T') + 'Z';
  const exp = new Date(iso);
  if (isNaN(exp.getTime())) return null;
  const ms = exp.getTime() - Date.now();
  if (ms <= 0) {
    return h('span', { class: 'tl-expiry expired', title: t('Expired {{when}}', { when: exp.toLocaleString() }) },
      t('expired'));
  }
  const days = Math.ceil(ms / (24 * 3600 * 1000));
  if (days <= 7) {
    return h('span', { class: 'tl-expiry soon', title: t('Expires {{when}}', { when: exp.toLocaleString() }) },
      t('expires in {{n}}d', { n: days }));
  }
  return null;
}

function formatAuditTS(ts) {
  // Server emits 'YYYY-MM-DD HH:MM:SS' UTC. Render local time so the
  // operator's clock matches the row.
  if (!ts) return '';
  const iso = ts.includes('T') ? ts : ts.replace(' ', 'T') + 'Z';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return ts;
  return d.toLocaleString();
}

function levelRank(level) {
  return { DEBUG: 0, INFO: 1, WARN: 2, ERROR: 3 }[String(level || 'INFO').toUpperCase()] ?? 1;
}

function entryMatches(e, needle) {
  if ((e.msg || '').toLowerCase().includes(needle)) return true;
  for (const a of (e.attrs || [])) {
    if (String(a.k || '').toLowerCase().includes(needle)) return true;
    if (String(a.v ?? '').toLowerCase().includes(needle)) return true;
  }
  return false;
}

// writeEntry paints a single log line in the xterm with ANSI colour
// escapes driven by the entry's level.
function writeEntry(term, e) {
  const R = '\x1b[0m';
  const dim = '\x1b[2m';
  const levelColors = {
    DEBUG: '\x1b[90m',          // gray
    INFO:  '\x1b[36m',          // cyan
    WARN:  '\x1b[33m',          // yellow
    ERROR: '\x1b[1;31m',        // bold red
  };
  const lc = levelColors[(e.level || 'INFO').toUpperCase()] || '';
  const ts = (e.ts || '').replace('T', ' ').replace(/\.\d+/, '').replace('Z', '');
  let line = `${dim}${ts}${R} ${lc}${String(e.level || 'INFO').padEnd(5)}${R} ${e.msg || ''}`;
  for (const a of (e.attrs || [])) {
    line += ` ${dim}${a.k}${R}=${formatAttrValue(a.v)}`;
  }
  term.writeln(line);
}

function formatAttrValue(v) {
  if (v === null || v === undefined) return '';
  if (typeof v === 'string') {
    if (/[\s="]/.test(v)) return JSON.stringify(v);
    return v;
  }
  return String(v);
}
