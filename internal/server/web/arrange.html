<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zonventure · arranger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aclonica&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<link rel="stylesheet" href="https://unpkg.com/xterm@5.3.0/css/xterm.css">
<script defer src="https://unpkg.com/xterm@5.3.0/lib/xterm.js"></script>
<script defer src="https://unpkg.com/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
<script src="/i18n.js"></script>
<style>
/* ---------- Theme (Zonventure palette) ---------- */
:root {
  --accent:        #ad1357;  /* raspberry — brand */
  --accent-hover:  #951048;
  --accent-fg:     #ffffff;
  /* Falls back to --accent unless an adventure overrides it via
     applyAdventureColors — mirrors the same default in play.html. */
  --accent-secondary: #ad1357;
  --ink:           #1f3349;  /* navy — headings */
  --success:       #429a3f;  /* brand green */
  --danger:        #ff5252;
  --danger-fg:     #ffffff;
  --warning:       #b45309;

  --bg:            #fbfbfd;
  --surface:       #ffffff;
  --surface-2:     #f6f6f6;
  --border:        #c6d2e1;
  --border-soft:   #c6d2e166;

  --text:          var(--ink);
  --muted:         #6b7f96;

  --shadow-soft:   0 1px 4px #00000014, 0 2px 8px #00000012;
  --shadow:        1px 1px 4px #00000033;
  --shadow-lg:     1px 1px 16px #00000047;

  --radius:        12px;
  --radius-sm:     8px;
  --radius-pill:   32px;

  --font-body:     'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-brand:    'Aclonica', 'Vollkorn', Georgia, serif;

  --anim:          200ms;
}
[data-theme="dark"] {
  --bg:          #14202e;
  --surface:     #1f3349;  /* the brand navy, used as primary surface */
  --surface-2:   #263d56;
  --border:      #3a5172;
  --border-soft: #3a517266;

  --text:        #e7ecf4;
  --muted:       #9db1cc;
  --ink:         #e7ecf4;

  --accent:      #e24080;   /* raspberry lifted for dark bg contrast */
  --accent-hover: #ad1357;
  --accent-fg:   #ffffff;
  --accent-secondary: #e24080;
  --success:     #7fd17b;
  --danger:      #ff7b7b;
  --warning:     #fbbf24;

  --shadow-soft: 0 1px 4px #00000066, 0 2px 12px #00000077;
  --shadow:      2px 2px 8px #00000073;
  --shadow-lg:   0 16px 40px #000000aa;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --bg: #14202e; --surface: #1f3349; --surface-2: #263d56;
    --border: #3a5172; --border-soft: #3a517266;
    --text: #e7ecf4; --muted: #9db1cc; --ink: #e7ecf4;
    --accent: #e24080; --accent-hover: #ad1357; --accent-fg: #ffffff;
    --accent-secondary: #e24080;
    --success: #7fd17b; --danger: #ff7b7b; --warning: #fbbf24;
    --shadow-soft: 0 1px 4px #00000066, 0 2px 12px #00000077;
    --shadow: 2px 2px 8px #00000073;
    --shadow-lg: 0 16px 40px #000000aa;
  }
}

/* ---------- Base ---------- */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3 { margin: 0 0 .5rem; line-height: 1.25; font-weight: 700; color: var(--ink); }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.1rem; }
h3 { font-size: .9rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
p { margin: 0 0 .5rem; }

/* ---------- App shell ---------- */
.app {
  display: grid;
  grid-template-columns: 240px minmax(0, 1fr);
  grid-template-rows: auto 1fr;
  grid-template-areas:
    "sidebar topbar"
    "sidebar content";
  min-height: 100vh;
  overflow-x: hidden;
}
.topbar {
  grid-area: topbar;
  display: flex;
  align-items: center;
  gap: .75rem;
  padding: 1rem 1.5rem;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 20;
}
.topbar .brand { display: none; font-size: 1.2rem; }
.topbar .crumb { font-weight: 700; font-size: 1rem; color: var(--ink); }
.topbar .spacer { flex: 1; }
.topbar .user {
  display: flex; align-items: center; gap: .6rem;
  color: var(--muted); font-size: .85rem;
}
.topbar .user strong { color: var(--text); font-weight: 700; }

.sidebar {
  grid-area: sidebar;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 1.5rem 0;
  display: flex; flex-direction: column;
}
.brand {
  font-family: var(--font-brand);
  font-weight: 400;
  color: var(--accent);
  letter-spacing: .01em;
}
.sidebar .brand {
  padding: 0 1.5rem 1.5rem;
  font-size: 1.55rem;
  display: flex; flex-direction: column;
  align-items: flex-start;
  gap: 0;
  line-height: 1.1;
}
.sidebar .brand small {
  font-family: var(--font-body);
  font-size: .7rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .08em;
  font-weight: 700;
  margin-top: .15rem;
}
.nav { display: flex; flex-direction: column; gap: 2px; padding: 0 .75rem; flex: 1; }
.sidebar-footer {
  margin-top: auto;
  padding: 1rem .75rem;
  border-top: 1px solid var(--border-soft);
  display: flex;
  flex-direction: column;
  gap: .4rem;
}
.sidebar-footer .btn {
  width: 100%;
  justify-content: flex-start;
  font-weight: 600;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sidebar-footer .btn:hover { color: var(--accent); border-color: transparent; background: var(--surface-2); }
.sidebar-footer .btn svg { stroke: currentColor; }
.sidebar-lang {
  display: flex; align-items: center; gap: .5rem;
  padding: .25rem .25rem; font-size: .8rem;
}
.sidebar-lang > span { text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.zv-lang-picker {
  font: inherit; color: var(--text);
  padding: .3rem .5rem;
  background: var(--surface-2);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm);
  box-shadow: none;
  cursor: pointer;
}
.zv-lang-picker:hover { border-color: var(--muted); }
.nav a {
  display: flex; align-items: center; gap: .75rem;
  padding: .6rem .85rem; border-radius: var(--radius-pill);
  color: var(--text); text-decoration: none; font-weight: 600;
  transition: background var(--anim), color var(--anim);
}
.nav a:hover { background: var(--surface-2); text-decoration: none; }
.nav a.active { background: var(--accent); color: var(--accent-fg); box-shadow: var(--shadow-soft); }
.nav a.active svg { stroke: var(--accent-fg); }
.nav svg { width: 18px; height: 18px; stroke: var(--muted); stroke-width: 1.75; fill: none; flex-shrink: 0; }
.nav a:hover svg { stroke: var(--accent); }

.content {
  grid-area: content;
  padding: 1.5rem 2rem 3rem;
  min-width: 0;          /* let the grid track shrink below content's intrinsic width */
  overflow-x: hidden;    /* defense in depth — page itself never scrolls sideways */
}
.content > * + * { margin-top: 1.25rem; }

/* Mobile */
.btn.menu-btn {
  display: none;
  /* Square icon-only tap target. 44×44 CSS px matches the Apple HIG
     minimum (and Material's 48dp lands close too), so the control is
     comfortable on a thumb without looking bulky next to the brand. */
  width: 44px; height: 44px; padding: 0; line-height: 0;
}
.btn.menu-btn svg { width: 26px; height: 26px; stroke-width: 2; }
@media (max-width: 820px) {
  .app {
    grid-template-columns: 1fr;
    grid-template-areas: "topbar" "content";
  }
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: 260px; z-index: 1500;
    transform: translateX(-100%);
    transition: transform .2s ease;
    box-shadow: var(--shadow-lg);
  }
  .sidebar.open { transform: translateX(0); }
  .topbar .brand { display: inline-flex; align-items: baseline; gap: .4rem; font-weight: 700; }
  .btn.menu-btn { display: inline-flex; }
  .content { padding: 1rem; }
  .topbar .crumb { display: none; }
  .topbar .user-details { display: none; }
}
.backdrop {
  display: none;
  position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 1400;
}
.backdrop.show { display: block; }

/* ---------- Buttons (Zonventure-style rounded pills) ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
  font: inherit; font-weight: 700; cursor: pointer; user-select: none;
  padding: .6rem 1.1rem; border-radius: var(--radius-pill);
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text);
  transition: background var(--anim), border-color var(--anim), transform 60ms, box-shadow var(--anim);
}
.btn:hover { background: var(--surface-2); border-color: var(--muted); }
.btn:active { transform: translateY(1px); }
.btn.primary {
  background: var(--accent); border-color: var(--accent); color: var(--accent-fg);
  box-shadow: var(--shadow-soft);
}
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.danger:hover { background: var(--danger); color: var(--danger-fg); border-color: var(--danger); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: .4rem .6rem; }
.btn.ghost:hover { background: var(--surface-2); color: var(--accent); border-color: transparent; }
.btn.small { padding: .35rem .75rem; font-size: .8rem; }
.btn.warning {
  background: color-mix(in srgb, var(--accent) 14%, var(--surface));
  border-color: color-mix(in srgb, var(--accent) 35%, var(--border));
  color: var(--accent);
}
.btn.warning:hover { background: color-mix(in srgb, var(--accent) 22%, var(--surface)); }
.lifecycle-btn { font-size: 1rem; padding: .55rem 1.1rem; }
.btn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.75; fill: none; }
/* icon-only variant: square, no text, used in card action rows and
   anywhere the meaning is obvious from the glyph. Keep the same min
   hit-target as the normal small button to stay thumb-friendly. */
.btn.icon {
  padding: 0;
  width: 2rem; height: 2rem;
  display: inline-grid; place-items: center;
  gap: 0;
}
.btn.icon.small { width: 1.8rem; height: 1.8rem; }
.btn.icon svg { width: 18px; height: 18px; }
/* Action row in the top-right of a clickable card. Its buttons stop
   click propagation so they don't trigger the card's own click. */
.card-actions {
  display: inline-flex; gap: .35rem;
  align-items: center;
}

/* ---------- Cards ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  box-shadow: var(--shadow-soft);
  padding: 1.25rem;
  /* Wide content (mainly tables) becomes a horizontal scroll area inside the
     card rather than pushing the viewport wider. */
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.card h2 { margin-top: 0; }
.card + .card { margin-top: 1rem; }
.card.clickable { cursor: pointer; transition: transform var(--anim), box-shadow var(--anim); }
.card.clickable:hover { transform: translateY(-2px) scale(1.015); box-shadow: var(--shadow-lg); }
/* Primary-tinted CTA card: used for "ready to schedule" assignments.
   Visually distinct from neutral browse-style cards so the dominant
   next action is obvious at a glance. */
.card.card-cta {
  background: color-mix(in srgb, var(--accent) 7%, var(--surface));
  border-color: color-mix(in srgb, var(--accent) 30%, var(--border));
}
.card.card-cta:hover { border-color: var(--accent); }

/* Sticky top bar on the run-detail view. Keeps Start/Pause/Resume
   within reach during a live event no matter how far the arranger
   has scrolled into the teams list or event log. */
.lifecycle-bar {
  position: sticky; top: 0; z-index: 50;
  background: var(--bg);
  padding: .75rem 0;
  margin: -.25rem 0 1rem;
  border-bottom: 1px solid var(--border-soft);
  display: flex; flex-wrap: wrap; gap: .75rem;
  justify-content: space-between; align-items: center;
}
.lifecycle-bar h1 { margin: 0; font-size: 1.3rem; }
.lifecycle-left {
  display: flex; gap: .75rem; align-items: center; flex-wrap: wrap;
}

/* Stuck team row: amber tint + left border, signal-but-not-alarm. */
tr.row-stuck {
  background: color-mix(in srgb, var(--accent) 8%, transparent);
  box-shadow: inset 4px 0 0 0 var(--accent);
}

.grid { display: grid; gap: 1rem; }
.grid.cols-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.grid.cols-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
/* stats are small enough to stay side-by-side even on very narrow phones */
.grid.stats { grid-template-columns: repeat(3, minmax(0,1fr)); gap: .5rem; }
@media (max-width: 820px) {
  .grid.cols-3, .grid.cols-2 { grid-template-columns: 1fr; }
}

.stat {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  padding: 1.1rem 1rem;
  box-shadow: var(--shadow-soft);
  text-align: center;
}
.stat .label {
  color: var(--muted);
  font-size: clamp(.6rem, 1.6vw, .75rem);
  text-transform: uppercase; letter-spacing: .07em; font-weight: 700;
  white-space: nowrap;
}
.stat .value {
  font-size: clamp(1.5rem, 6vw, 2.4rem);
  font-weight: 700; margin-top: .25rem; color: var(--ink);
  line-height: 1;
}
.stat.accent .value { color: var(--accent); }
@media (max-width: 560px) {
  .stat { padding: .85rem .5rem; }
}

/* ---------- Forms ---------- */
label.field { display: block; margin-bottom: .9rem; }
label.field > span {
  display: block; margin-bottom: .3rem;
  color: var(--ink); font-size: .8rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .04em;
}
input, select, textarea {
  font: inherit; width: 100%;
  padding: .65rem .85rem;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  box-shadow: inset 0 0 0 1px var(--border-soft);
}
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
}
textarea { min-height: 80px; resize: vertical; font-family: ui-monospace, monospace; }

/* ---------- Table ---------- */
.table {
  width: 100%;
  border-collapse: separate; border-spacing: 0;
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-soft);
}
.table th, .table td { padding: .7rem 1rem; text-align: left; vertical-align: middle; }
.table th {
  background: var(--surface-2); color: var(--ink);
  font-weight: 700; font-size: .75rem; text-transform: uppercase; letter-spacing: .06em;
  border-bottom: 1px solid var(--border);
}
.table tbody tr + tr td { border-top: 1px solid var(--border-soft); }
.table tbody tr:hover { background: var(--surface-2); }
.table tbody tr:nth-child(odd) { background: color-mix(in srgb, var(--surface-2) 45%, transparent); }
.table tbody tr:nth-child(odd):hover { background: var(--surface-2); }
.table td .row { display: flex; gap: .35rem; }
@media (max-width: 820px) {
  .table .hide-narrow { display: none; }
}

/* ---------- Bits ---------- */
.row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }
/* Header rows (a card title next to an action button) shouldn't carry
   the heading's default bottom margin — align-items:center would then
   nudge the title visually upward relative to the button. Zero it here
   and give the row itself a small bottom margin so it doesn't jam into
   the content that follows. */
.row > h1, .row > h2, .row > h3 { margin: 0; }
.card > .row.between { margin-bottom: .75rem; }
.muted { color: var(--muted); }
.err { color: var(--danger); }
.ok { color: var(--success); }
.mono { font-family: ui-monospace, SFMono-Regular, monospace; font-size: .9em; }

.pill {
  display: inline-flex; align-items: center;
  padding: .15rem .65rem;
  font-size: .7rem; font-weight: 700;
  border-radius: 999px;
  background: var(--surface-2); color: var(--muted);
  text-transform: uppercase; letter-spacing: .06em;
}
.pill.accent { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
.pill.danger { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }
.pill.success { background: color-mix(in srgb, var(--success) 15%, transparent); color: var(--success); }
.pill.warning { background: color-mix(in srgb, var(--warning) 18%, transparent); color: var(--warning); }

.chip {
  display: inline-flex; align-items: center; gap: .25rem;
  padding: .2rem .65rem; background: var(--surface-2);
  border: 1px solid var(--border-soft); border-radius: 999px;
  font-size: .8rem; font-weight: 600;
}
.chip button {
  background: none; border: none; cursor: pointer; padding: 0;
  color: var(--muted); font-size: 1rem; line-height: 1;
}
.chip button:hover { color: var(--danger); }

.empty {
  text-align: center; padding: 3rem 1rem; color: var(--muted);
  background: var(--surface-2); border-radius: var(--radius);
  border: 1px dashed var(--border);
}

/* ---------- Modal ----------
   Leaflet assigns its own layers z-index up to ~1000, so the modal and
   toasts have to sit clearly above that to stay on top of the run map. */
.modal-back {
  position: fixed; inset: 0; background: rgba(0,0,0,.45);
  display: flex; align-items: center; justify-content: center;
  z-index: 2000; padding: 1rem;
}
.modal {
  background: var(--surface); border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  width: 100%; max-width: 420px;
  padding: 1.5rem;
  max-height: calc(100vh - 2rem);
  overflow-y: auto;
}
.modal.wide { max-width: 560px; }
.modal.xwide { max-width: 720px; }
.modal h2 { margin-top: 0; }

/* ---------- WYSIWYG puzzle editor ----------
   The preview card mirrors play.html's puzzle layout (title, images,
   prompt, hint, submit dock) so the arranger sees roughly what the
   player will see. The inputs look like plain text until hovered or
   focused, then show a dashed editable affordance. */
/* Markdown preview pane shown under textareas the player's client
   will render as rich text. Server-rendered via the /markdown/preview
   endpoint so layout matches the runtime exactly. The pane looks
   card-like and sits flush against the textarea above. */
.md-preview {
  margin-top: -.35rem;
  padding: .6rem .75rem;
  border: 1px solid var(--border-soft);
  border-radius: 8px;
  background: var(--surface-2);
  font-size: .95rem; line-height: 1.5;
  color: var(--ink);
  min-height: 2.25rem;
}
.md-preview p { margin: 0 0 .5rem; }
.md-preview p:last-child { margin-bottom: 0; }
.md-preview ul, .md-preview ol { padding-left: 1.2rem; margin: .25rem 0 .5rem; }
.md-preview li { margin: .15rem 0; }
.md-preview a { color: var(--accent); }
.md-preview code {
  background: var(--surface); border: 1px solid var(--border-soft);
  padding: .05em .3em; border-radius: 4px;
  font: .9em ui-monospace, SFMono-Regular, Menlo, monospace;
}
.md-preview h1, .md-preview h2, .md-preview h3 {
  margin: .25rem 0 .4rem; line-height: 1.2;
}
.md-preview h1 { font-size: 1.35rem; }
.md-preview h2 { font-size: 1.15rem; }
.md-preview h3 { font-size: 1rem; }
.md-preview.compact { padding: .4rem .55rem; font-size: .9rem; }

.puzzle-editor {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 1.25rem;
  border: 1px solid var(--border-soft);
  box-shadow: var(--shadow);
  margin-bottom: 1rem;
}
.puzzle-editor textarea.pe {
  display: block; width: 100%;
  background: transparent;
  /* Dashed outline is always visible so it's obvious the field is
     editable. Focus lifts it to the accent colour + a soft glow. */
  border: 1px dashed var(--border-soft);
  padding: .35rem .5rem; margin: 0;
  border-radius: 6px;
  /* Clear the inheritable globals from the form `textarea` block:
     ui-monospace font, 80px min-height, the inset box-shadow border. */
  font: inherit; color: inherit;
  min-height: 0;
  box-shadow: none;
  resize: none; overflow: hidden;
  transition: border-color 120ms, background 120ms, box-shadow 120ms;
}
.puzzle-editor textarea.pe:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--surface-2);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
}
/* The slot-specific rules use `textarea.pe-*` (not `.pe-*`) so they beat
   `.puzzle-editor textarea.pe`'s `font: inherit` on specificity. */
.puzzle-editor textarea.pe-title {
  /* Matches play.html's h3: 1.05rem, brand-secondary tint. Font-family is
     the body font (inherited via `font: inherit`), not the brand font. */
  font-size: 1.05rem; font-weight: 700;
  color: var(--accent-secondary);
  margin: 0 0 .5rem;
}
.puzzle-editor textarea.pe-prompt {
  /* Matches play.html's .prompt. */
  font-size: 1.1rem; line-height: 1.55;
  white-space: pre-wrap; color: var(--ink);
}
.puzzle-editor textarea.pe-hint {
  color: var(--muted);
}
.puzzle-editor .pe-hint-row {
  display: flex; gap: .35rem; align-items: flex-start; margin-top: .5rem;
}
.puzzle-editor .pe-hint-row .tag {
  color: var(--muted); font-weight: 600;
  padding: .35rem 0; flex-shrink: 0;
}
.puzzle-editor .pe-images {
  display: grid; gap: .5rem; margin: .5rem 0;
}
.puzzle-editor .pe-image-wrap { position: relative; }
.puzzle-editor .pe-image {
  width: 100%; height: auto; display: block;
  border-radius: var(--radius);
  border: 1px solid var(--border-soft);
}
.puzzle-editor .pe-image-remove {
  position: absolute; top: .5rem; right: .5rem;
}
.puzzle-editor .pe-image-add {
  display: flex; align-items: center; justify-content: center; gap: .35rem;
  padding: .35rem .7rem;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  color: var(--muted); cursor: pointer;
  font-size: .85rem;
  transition: background 120ms, border-color 120ms, color 120ms;
}
.puzzle-editor .pe-image-add svg {
  width: 14px; height: 14px;
}
.puzzle-editor .pe-image-add:hover {
  background: var(--surface-2);
  border-color: var(--accent);
  color: var(--accent);
}
.puzzle-editor .pe-image-add.disabled {
  cursor: not-allowed; opacity: .6;
}
.puzzle-editor .pe-image-add.disabled:hover {
  background: transparent; border-color: var(--border); color: var(--muted);
}
/* Non-interactive preview of play.html's sticky submit dock, so the
   arranger sees where the player will type and how cramped the prompt
   is relative to the submit row. */
.puzzle-editor .pe-dock {
  margin-top: 1rem;
  padding: .75rem; background: var(--surface-2);
  border-radius: var(--radius);
  display: grid; grid-template-columns: 1fr auto; gap: .5rem;
  opacity: .7;
}
.puzzle-editor .pe-dock-label {
  grid-column: 1 / -1;
  text-transform: uppercase;
  font-size: .65rem; font-weight: 700; letter-spacing: .08em;
  color: var(--muted); margin: 0 0 .25rem;
}
.puzzle-editor .pe-dock input,
.puzzle-editor .pe-dock button {
  pointer-events: none;
}
.puzzle-settings { margin-top: 1rem; }
.puzzle-settings h3 {
  font-size: .85rem; margin: 0 0 .6rem;
  color: var(--muted); font-weight: 700;
  text-transform: uppercase; letter-spacing: .06em;
}

/* Location editor embedded in the puzzle-settings panel.
   The map itself is a Leaflet instance; the radius-drag handle is a
   divIcon styled to look like a resize grip. */
.pe-loc-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: .5rem; margin: 0 0 .5rem;
}
.pe-map {
  height: 260px;
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--border-soft);
  margin-bottom: .5rem;
}
.pe-loc-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: .5rem;
}
.pe-radius-handle {
  width: 22px; height: 22px;
  background: #ad1357; color: #fff;
  border: 2px solid #fff;
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 12px; font-weight: 800;
  box-shadow: 0 0 0 1px rgba(0,0,0,.25);
  cursor: ew-resize;
}

/* Floating action button for the Puzzles view. Sits above the content
   in the bottom-right corner so a phone-in-hand admin can tap it
   without scrolling. */
.fab {
  position: fixed;
  right: calc(1rem + env(safe-area-inset-right));
  bottom: calc(1rem + env(safe-area-inset-bottom));
  width: 56px; height: 56px;
  border-radius: 50%;
  background: var(--accent); color: var(--accent-fg);
  border: none; cursor: pointer;
  box-shadow: 0 8px 24px rgba(0,0,0,.25), 0 2px 8px rgba(0,0,0,.15);
  display: grid; place-items: center;
  z-index: 500;
}
.fab svg { width: 24px; height: 24px; }
.fab:hover { background: var(--accent-hover); }
.fab:disabled { opacity: .6; cursor: wait; }

/* Puzzle timeline: numbered pills at the top of the editor modal so an
   arranger can jump between puzzles without closing the dialog. The
   trailing "+" pill creates a new puzzle. */
.puzzle-timeline {
  display: flex; gap: .35rem; align-items: center; flex-wrap: wrap;
  margin: 0 0 1rem;
  padding-bottom: .75rem;
  border-bottom: 1px solid var(--border-soft);
}
.pt-pill {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 2rem; max-width: 14rem; height: 2rem; padding: 0 .75rem;
  border-radius: 999px;
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border-soft);
  font: inherit; font-weight: 700; font-variant-numeric: tabular-nums;
  cursor: pointer;
  overflow: hidden;
  transition: border-color 120ms, background 120ms, color 120ms;
}
.pt-pill .pt-label {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pt-pill.untitled .pt-label { font-style: italic; font-weight: 500; color: var(--muted); }
.pt-pill.current.untitled .pt-label { color: var(--accent-fg); }
.pt-pill:hover { border-color: var(--accent); }
.pt-pill.current {
  background: var(--accent); color: var(--accent-fg);
  border-color: var(--accent); cursor: default;
}
.pt-pill.current:hover { border-color: var(--accent); }
.pt-plus {
  color: var(--muted);
  border-style: dashed;
}
.pt-pill.disabled {
  opacity: .45;
  text-decoration: line-through;
  background: transparent;
  border-style: dashed;
}
.pt-pill.current.disabled { opacity: .7; }
/* Arrow between timeline pills — a pure-decoration sequence hint.
   pointer-events: none lets drag-over fall through to the pills. */
.pt-arrow {
  color: var(--muted);
  font-size: 1rem;
  line-height: 1;
  user-select: none;
  pointer-events: none;
}

/* Server logs terminal. Fills the remaining height of the content
   area and gets a subtle inset border so the dark xterm square looks
   like a mounted console rather than a floating blob. */
.zv-log-term {
  height: calc(100vh - 18rem);
  min-height: 320px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-soft);
  padding: .35rem;
  background: #0e1420;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.35);
  overflow: hidden;
}
.zv-log-sel {
  font: inherit; color: var(--text);
  padding: .3rem .5rem;
  background: var(--surface-2);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm);
  box-shadow: none; cursor: pointer;
}
.zv-log-sel:hover { border-color: var(--muted); }

/* Dragging feedback: the pill being dragged dims, and the drop target
   grows a coloured edge on whichever side the cursor is closer to so
   arrangers see the exact insertion point (same affordance as Slides). */
.pt-pill[draggable] { cursor: grab; }
.pt-pill[draggable]:active { cursor: grabbing; }
.pt-pill.drag-ghost { opacity: .3; }
.pt-pill.drop-before { box-shadow: inset 3px 0 0 0 var(--accent); }
.pt-pill.drop-after  { box-shadow: inset -3px 0 0 0 var(--accent); }

/* Selectable chip grid used in the team-create modal. */
.chip-grid {
  display: flex; flex-wrap: wrap; gap: .4rem;
  max-height: 220px; overflow-y: auto;
  padding: .5rem; border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
}
.chip.selectable {
  cursor: pointer; user-select: none;
  transition: background var(--anim), color var(--anim), border-color var(--anim);
}
.chip.selectable:hover { border-color: var(--muted); }
.chip.selectable.selected {
  background: var(--accent); color: var(--accent-fg);
  border-color: var(--accent); font-weight: 700;
}
.chip.selectable.selected:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.chip.selectable.taken {
  opacity: .55; cursor: not-allowed; font-style: italic;
  border-style: dashed;
}
.chip.selectable.taken:hover { border-color: var(--border-soft); }

.inline-form {
  margin-top: .6rem; padding: .85rem;
  background: var(--surface-2); border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm);
}
.inline-form .row > input { flex: 1 1 0; min-width: 0; margin: 0; }
.inline-form .row { gap: .4rem; align-items: stretch; }

.map-host {
  width: 100%; height: 420px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-soft);
  overflow: hidden;
}
.puzzle-marker {
  width: 28px; height: 28px;
  background: var(--ink); color: #fff;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: .8rem;
  border: 2px solid #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,.35);
}
.puzzle-marker.gated { background: var(--accent); }
.puzzle-marker > span { transform: rotate(45deg); }
.team-dot {
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid #fff;
  box-shadow: 0 0 0 1px rgba(0,0,0,.25);
}

.team-marker {
  width: 100%; height: 100%; border-radius: 50%;
  overflow: hidden;
  border: 3px solid var(--team-col, #e24080);
  background: var(--team-col, #e24080);
  box-shadow: 0 0 0 2px #fff, 0 2px 8px rgba(0,0,0,.35);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-size: 12px;
}
.team-marker img { width: 100%; height: 100%; object-fit: cover; display: block; }
.team-marker.no-img { /* initials variant keeps the background coloured */ }
.map-legend {
  display: flex; flex-wrap: wrap; gap: .75rem;
  margin-top: .75rem; font-size: .8rem;
}
.map-legend .sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: middle; margin-right: .35rem; }

/* ---------- Event feed ---------- */
.feed { list-style: none; padding: 0; margin: 0; max-height: 380px; overflow-y: auto; }
.feed li {
  display: grid; grid-template-columns: auto 1fr auto; gap: .75rem;
  align-items: start; padding: .6rem .3rem;
  border-bottom: 1px solid var(--border-soft);
}
.feed li:last-child { border-bottom: none; }
.feed .badge {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: .9rem; font-weight: 700;
  background: var(--surface-2); color: var(--ink);
}
.feed .badge.neutral { background: var(--surface-2); color: var(--ink); }
.feed .badge.good { background: color-mix(in srgb, var(--success) 22%, transparent); color: var(--success); }
.feed .badge.bad { background: color-mix(in srgb, var(--danger) 22%, transparent); color: var(--danger); }
.feed .badge.brand { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }
.feed .msg strong { font-weight: 700; }
.feed .meta { font-size: .75rem; color: var(--muted); margin-top: .1rem; }
.feed time { font-size: .75rem; color: var(--muted); white-space: nowrap; }

/* ---------- Toast ---------- */
.toasts {
  position: fixed; bottom: 1rem; right: 1rem; z-index: 2100;
  display: flex; flex-direction: column; gap: .5rem;
}
.toast {
  padding: .75rem 1rem; border-radius: var(--radius-sm);
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  box-shadow: var(--shadow-lg); min-width: 240px;
  animation: slideIn .2s ease;
}
.toast.err { border-color: var(--danger); color: var(--danger); }
.toast.ok { border-color: var(--success); color: var(--success); }
@keyframes slideIn { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- Login ---------- */
.login-wrap {
  min-height: 100vh; display: grid; place-items: center; padding: 1rem;
  background:
    radial-gradient(circle at 20% 0%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 50%),
    radial-gradient(circle at 80% 100%, color-mix(in srgb, var(--ink) 12%, transparent), transparent 50%),
    var(--bg);
}
.login {
  background: var(--surface); border: 1px solid var(--border-soft);
  border-radius: var(--radius); box-shadow: var(--shadow-lg);
  padding: 2rem; width: 100%; max-width: 380px;
}
.login .brand {
  font-size: 1.75rem; margin-bottom: 1.5rem;
  display: flex; flex-direction: column;
  align-items: flex-start;
  gap: 0;
  line-height: 1.1;
}
.login .brand small {
  font-family: var(--font-body);
  font-size: .7rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .08em;
  font-weight: 700;
  margin-top: .15rem;
}
</style>
</head>

/* ========== Theme ========== */
function initTheme() {
  const saved = localStorage.getItem('zv-theme');
  if (saved === 'light' || saved === 'dark') {
    document.documentElement.setAttribute('data-theme', saved);
  }
}
function currentTheme() {
  const attr = document.documentElement.getAttribute('data-theme');
  if (attr) return attr;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function toggleTheme() {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('zv-theme', next);
  render();
}
initTheme();

/* ========== Toast ========== */
function toast(msg, kind = '') {
  const el = h('div', { class: 'toast ' + kind }, msg);
  document.getElementById('toasts').append(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; }, 2500);
  setTimeout(() => el.remove(), 2900);
}
const toastOk = (m) => toast(m, 'ok');
const toastErr = (m) => toast(m, 'err');

/* ========== Password-confirm prompt ==========
   Returns the typed password on success or null if cancelled. Pair this
   with requests that set X-Confirm-Password. */
async function promptPassword(title, message) {
  return modal(title, ({ body, close }) => {
    const input = h('input', { type: 'password', autocomplete: 'current-password', required: true });
    const err = h('p', { class: 'err', style: 'display:none' });
    const form = h('form', {},
      message ? h('p', { style: 'margin-bottom:.75rem' }, message) : null,
      h('label', { class: 'field' }, h('span', {}, t('Your password')), input),
      err,
      h('div', { class: 'row end' },
        h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, t('Cancel')),
        h('button', { class: 'btn danger', type: 'submit' }, t('Confirm'))),
    );
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!input.value) { err.style.display = ''; err.textContent = t('password required'); return; }
      close(input.value);
    });
    body.append(form);
    setTimeout(() => input.focus(), 20);
  });
}

/* ========== Modal ========== */
function modal(title, bodyFn, opts = {}) {
  return new Promise((resolve) => {
    const host = document.getElementById('modal-host');
    const body = h('div');
    // Dispatch a synthetic event before teardown so content hooks (e.g.
    // the puzzle editor's parked file input) can clean up whether close
    // is called via Save, Cancel, Esc, or backdrop click.
    const close = (value) => {
      body.dispatchEvent(new CustomEvent('modal:close'));
      host.replaceChildren();
      resolve(value);
    };
    const back = h('div', { class: 'modal-back', on: { click: (e) => { if (e.target === back) close(null); } } },
      h('div', { class: 'modal' + (opts.wide ? ' wide' : '') },
        h('h2', {}, title),
        body,
      ));
    host.replaceChildren(back);
    bodyFn({ body, close });
  });
}

    class: 'btn',

function currentCrumb() {
  const parts = state.route.replace(/^#/, '').split('/');
  const section = parts[0] || 'dashboard';
  // Map section slugs to their translated nav label so the top breadcrumb
  // tracks the sidebar. Falls through to a capitalised raw slug for
  // anything we don't recognise.
  const LABELS = {
    dashboard:     t('Dashboard'),
    adventures:    t('Adventures'),
    store:         t('Store'),
    runs:          t('Runs'),
    members:       t('Members'),
    organizations: t('Organizations'),
    library:       t('Library'),
    puzzles:       t('Puzzles'),
    admins:        t('Admins'),
    simulator:     t('Simulator'),
    logs:          t('Logs'),
  };
  const sectionLabel = LABELS[section] || (section ? section[0].toUpperCase() + section.slice(1) : '');
  if (section === 'runs' && parts[1]) return t('{{section}} / Run #{{id}}', { section: sectionLabel, id: parts[1] });
  if (section === 'adventures' && parts[1]) return t('{{section}} / {{slug}}', { section: sectionLabel, slug: parts[1] });
  if (section === 'store' && parts[1]) return t('{{section}} / {{slug}}', { section: sectionLabel, slug: parts[1] });
  return sectionLabel;
}

async function renderRoute() {
  const view = document.getElementById('view');
  view.replaceChildren(h('p', { class: 'muted' }, t('Loading…')));
  const r = state.route.replace(/^#/, '');
  const [section, arg] = r.split('/');
  const role = state.me.role;
  const isAdmin = role === 'admin';
  const isOrgAdmin = role === 'org_admin';

  // Role-based route guards: admins can't visit org-user pages and vice versa.
  const adminOnly = ['organizations', 'admins', 'logs', 'simulator'];
  const orgUserOnly = ['adventures', 'runs', 'store'];
  if (isAdmin && orgUserOnly.includes(section)) { nav('#organizations'); return; }
  if (!isAdmin && adminOnly.includes(section))   { nav('#dashboard');     return; }
  if (section === 'members' && !isOrgAdmin)      { nav('#dashboard');     return; }

  // Run-detail is the only view with real-time updates. Entering it opens a
  // watch on the arrange WebSocket; leaving it releases that watch so the
  // server stops publishing to this client.
  if (section === 'runs' && arg) {
    watchRun(parseInt(arg, 10));
  } else {
    unwatchRun();
  }

  try {
    switch (section) {
      case '':
      case 'dashboard':    return await viewDashboard(view);
      case 'adventures':   return arg ? await viewAdventureDetail(view, arg) : await viewAdventures(view);
      case 'store':        return arg ? await viewStoreDetail(view, arg) : await viewStore(view);
      case 'runs':         return arg ? await viewRunDetail(view, arg) : await viewRuns(view);
      case 'members':      return await viewMembers(view);
      case 'organizations':return await viewOrganizations(view);
      case 'library':      return arg ? await viewLibraryEdit(view, arg) : await viewLibrary(view);
      case 'puzzles':      return arg ? await viewPuzzleEditRoute(view, arg) : await viewPuzzles(view);
      case 'purchases':    return await viewPurchases(view);
      case 'admins':       return await viewAdmins(view);
      case 'simulator':    return await viewSimulator(view);
      case 'logs':         return await viewLogs(view);
      default: view.replaceChildren(h('p', {}, t('Not found')));
    }
  } catch (err) {
    view.replaceChildren(h('p', { class: 'err' }, String(err)));
  }
}

/* ========== Arrange subscription stream ========== */
// arrangeWS is a single long-lived connection that pushes run-detail
// updates while an arranger has a run open. Mutations still ride HTTP;
// this socket only receives change notifications so the view stays in
// sync with player progress, team creates, etc., without polling.
let arrangeWS = null;
let arrangeWSBackoff = 500;
let watchedRunID = 0;
let arrangePushTimer = null;

function ensureArrangeWS() {
  if (arrangeWS && (arrangeWS.readyState === 0 || arrangeWS.readyState === 1)) return;
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  arrangeWS = new WebSocket(`${proto}//${location.host}/ws/arrange`);
  arrangeWS.onopen = () => {
    arrangeWSBackoff = 500;
    if (watchedRunID) arrangeWS.send(JSON.stringify({ kind: 'watch_run', data: { run_id: watchedRunID } }));
  };
  arrangeWS.onmessage = (ev) => {
    let msg; try { msg = JSON.parse(ev.data); } catch { return; }
    if (!msg || !msg.kind) return;
    // Any server push re-renders the current run-detail view. Debounced so
    // a burst of changes (eg. multiple position updates from players
    // pinging at once) collapses into a single re-render.
    if (msg.kind === 'positions' || msg.kind === 'tracks' ||
        msg.kind === 'events'   || msg.kind === 'run_detail') {
      if (arrangePushTimer) clearTimeout(arrangePushTimer);
      arrangePushTimer = setTimeout(() => {
        const r = state.route.replace(/^#/, '');
        const [section, arg] = r.split('/');
        if (section === 'runs' && arg) {
          const view = document.getElementById('view');
          if (view) viewRunDetail(view, parseInt(arg, 10));
        }
      }, 300);
    }
  };
  arrangeWS.onclose = () => {
    const delay = Math.min(arrangeWSBackoff, 10000);
    arrangeWSBackoff = Math.min(arrangeWSBackoff * 2, 10000);
    setTimeout(ensureArrangeWS, delay);
  };
}

function watchRun(runID) {
  if (!runID || runID === watchedRunID) { watchedRunID = runID; ensureArrangeWS(); return; }
  watchedRunID = runID;
  ensureArrangeWS();
  if (arrangeWS && arrangeWS.readyState === 1) {
    arrangeWS.send(JSON.stringify({ kind: 'watch_run', data: { run_id: runID } }));
  }
}

function unwatchRun() {
  if (!watchedRunID) return;
  watchedRunID = 0;
  if (arrangeWS && arrangeWS.readyState === 1) {
    arrangeWS.send(JSON.stringify({ kind: 'unwatch_run' }));
  }
}

async function logout() {
  await api('/api/auth/logout', { method: 'POST' });

/* ========== Dashboard ========== */
async function viewDashboard(view) {
  if (state.me.role === 'admin') return viewAdminDashboard(view);
  return viewArrangerDashboard(view);

async function viewArrangerDashboard(view) {
  const [runsR, advR, assignR] = await Promise.all([
    api('/api/admin/runs'),
    api('/api/admin/adventures'),
    api('/api/admin/assignments'),
  ]);
  const newEventBtn = h('button', { class: 'btn primary', on: { click: () => openNewEventWizard() } },
    icon(ICONS.plus), t('Start a new event'));
  const rs = runsR.body?.runs || [];
  const advs = advR.body?.adventures || [];
  const assignments = assignR.body?.assignments || [];
  const mineAdvs    = advs.filter((a) => a.mine_to_edit);
  const unusedAssigns = assignments.filter((a) => !a.run_id);
  const runningNow  = rs.filter((r) => r.state === 'running');
  const scheduled   = rs.filter((r) => r.state === 'scheduled')
    .sort((a, b) => (a.scheduled_at || '').localeCompare(b.scheduled_at || ''));

  // Setup checklist for first-time arrangers. Hides itself once a run
  // exists so veterans don't see it.
  const setup = rs.length === 0
    ? buildDashboardSetup({ mineAdvs, unusedAssigns })
    : null;

  // DOM's replaceChildren coerces null arguments to the string "null"
  // and appends them as text nodes — unlike h(), which skips them. The
  // sections below are conditionally null (no runs, no scheduled, etc.),
  // so filter before handing off.
  const sections = [
    h('div', { class: 'row between' },
      h('h1', {}, t('Hello, {{username}}', { username: state.me.username })),
      newEventBtn,
    ),
    h('div', { class: 'grid stats' },
      stat(t('Running now'), runningNow.length),
      stat(t('Scheduled'), scheduled.length),
      stat(t('Unused assignments'), unusedAssigns.length),
    ),
    setup,
    // During a live event this is what the arranger wants to see first.
    runningNow.length === 0 ? null : h('div', { class: 'card' },
      h('h2', {}, t('Running now')),
      h('div', { class: 'grid cols-2' },
        runningNow.map((r) => h('div', {
          class: 'card clickable',
          on: { click: () => nav('#runs/' + r.id) },
        },
          h('div', { class: 'row between' },
            h('strong', {}, runLabel(r)),
            h('span', { class: 'pill ' + pillClassForState(r.state) }, t(r.state || ''))),
          h('p', { class: 'muted mono', style: 'font-size:.75rem; margin:.1rem 0 .3rem' }, r.adventure_slug),
          h('p', { class: 'muted', style: 'font-size:.85rem; margin:0' },
            r.started_at ? t('Started {{when}}', { when: fmtLocal(r.started_at) }) : ''))))),
    // "Starts soon" is actionable — one-click Start on scheduled runs.
    scheduled.length === 0 ? null : h('div', { class: 'card' },
      h('h2', {}, t('Starts soon')),
      h('table', { class: 'table' },
        h('thead', {}, h('tr', {},
          h('th', {}, t('Run')),
          h('th', {}, t('Scheduled')),
          h('th', {}, ''))),
        h('tbody', {}, scheduled.slice(0, 10).map((r) => h('tr', {
            style: 'cursor:pointer',
            on: { click: () => nav('#runs/' + r.id) },
          },
          h('td', {}, runLabel(r)),
          h('td', {}, fmtLocal(r.scheduled_at) || h('span', { class: 'muted' }, t('(no time set)'))),
          h('td', { style: 'text-align:right' },
            iconBtn('play', t('Start now'), () => confirmStart(r), { primary: true })),
        ))))),
    // Fallback for users between events.
    (runningNow.length === 0 && scheduled.length === 0 && rs.length > 0)
      ? h('div', { class: 'card' },
          h('h2', {}, t('Recent runs')),
          runsTable(rs.slice(0, 5)))
      : null,
  ];
  view.replaceChildren(...sections.filter(Boolean));
}

// buildDashboardSetup drops a guided checklist for brand-new arrangers
// who haven't run anything yet — it meets them where they are and
// links to the next action.
function buildDashboardSetup({ mineAdvs, unusedAssigns }) {
  const stepDone = (done, label, cta, onClick) =>
    h('li', { style: 'display:flex; align-items:center; gap:.6rem; margin:.35rem 0' },
      h('span', {
        style: 'display:inline-grid; place-items:center; width:1.4rem; height:1.4rem; border-radius:50%; background:' +

      }, done ? '✓' : '·'),
      h('span', { style: done ? 'color:var(--muted); text-decoration:line-through' : '' }, label),
      !done && cta
        ? h('button', { class: 'btn small primary', style: 'margin-left:auto', on: { click: onClick } }, cta)
        : null,
    );
  const haveAdvOrAssignment = mineAdvs.length > 0 || unusedAssigns.length > 0;
  return h('div', { class: 'card', style: 'border:1px dashed var(--accent); background:color-mix(in srgb, var(--accent) 5%, var(--surface))' },
    h('h2', {}, t('Getting started')),
    h('p', { class: 'muted' }, t('A few clicks to your first adventure.')),
    h('ol', { style: 'list-style:none; padding:0; margin:0' },
      stepDone(haveAdvOrAssignment,
        t('Pick an adventure — browse the Store or create your own'),
        t('Go'), () => nav('#store')),
      stepDone(unusedAssigns.length > 0,
        t('Have team slots ready — an assignment lets you schedule a run'),
        t('Go'), () => nav('#store')),
      stepDone(false,
        t('Schedule a run, add teams, share their links — and start!'),
        unusedAssigns.length > 0 ? t('Schedule') : null,
        unusedAssigns.length > 0 ? (() => scheduleRun(unusedAssigns[0].id)) : null),
    ),
  );
}

/* ========== Adventures ==========
   For arrangers this is really "your assignments" — each unused assignment
   is a one-shot licence to run an adventure with a fixed team cap. Used
   assignments are also shown (with a link to their run) so the arranger can
   see the full history at a glance. */
async function viewAdventures(view) {
  // Post-checkout handoff: if sessionStorage carries a fresh
  // assignment id, open the scheduler for it right away. Cleared on
  // consume so refreshes don't reopen the dialog.
  const justPurchased = sessionStorage.getItem('zv-just-purchased');
  if (justPurchased) {
    sessionStorage.removeItem('zv-just-purchased');
    const id = parseInt(justPurchased, 10);
    if (id > 0) { toastOk(t('Payment received — let\'s schedule your run.')); scheduleRun(id); }
  }

  const [ar, advR] = await Promise.all([
    api('/api/admin/assignments'),
    api('/api/admin/adventures'),
  ]);
  const assignments = ar.body?.assignments || [];
  const advs = advR.body?.adventures || [];

  // Bucket assignments per adventure. unused = ready to schedule,
  // used = already materialised into a run (kept for context badges).
  const byAdv = new Map();
  for (const a of assignments) {
    if (!a.adventure_slug) continue;
    const b = byAdv.get(a.adventure_slug) || { unused: [], used: [] };
    (a.run_id ? b.used : b.unused).push(a);
    byAdv.set(a.adventure_slug, b);
  }

  // An adventure shows up on this page only if there's something the
  // arranger actually does with it — they author it, they hold at
  // least one assignment, or an admin has commissioned it for this
  // org via a share. Everything else lives in the Store.
  const runnable = advs
    .filter((a) => a.mine_to_edit || a.shared || byAdv.has(a.slug))
    .sort((a, b) => {
      // Mine first, then with unused assignments, then shared, then remainder.
      const score = (adv) => {
        const bk = byAdv.get(adv.slug) || { unused: [], used: [] };
        return (adv.mine_to_edit ? 8 : 0)
          + (bk.unused.length ? 4 : 0)
          + (adv.shared ? 2 : 0)
          + (bk.used.length ? 1 : 0);
      };
      return score(b) - score(a);
    });

  const renderCard = (adv) => {
    const bucket = byAdv.get(adv.slug) || { unused: [], used: [] };
    const actions = h('div', { class: 'row', style: 'gap:.5rem; flex-wrap:wrap; margin-top:.75rem' });
    if (adv.mine_to_edit) {
      actions.append(h('button', {
        class: 'btn',
        on: { click: () => nav('#library/' + adv.slug) },
      }, icon(ICONS.pencil), t('Edit')));
    }
    if (bucket.unused.length > 0) {
      actions.append(h('button', {
        class: 'btn primary',
        on: { click: () => pickAndScheduleRun(bucket.unused, adv) },
      }, icon(ICONS.play), t('Schedule run')));
    } else if (adv.shared || (adv.mine_to_edit && adv.org_id)) {
      // Commissioned by admin or authored in-house — either way the
      // org can schedule runs freely, no assignment needed.
      actions.append(h('button', {
        class: 'btn primary',
        on: { click: () => scheduleRun({ slug: adv.slug }) },
      }, icon(ICONS.play), t('Schedule run')));
    } else if (adv.mine_to_edit) {
      // Own adventure with no unused assignments — offer the buy
      // path inline so "make this runnable" is one step away.
      actions.append(h('button', {
        class: 'btn',
        on: { click: () => openPurchaseModal(adv) },
      }, icon(ICONS.coins), t('Buy team slots')));
    }

    const tags = [
      h('span', { class: 'pill' }, adv.page_count === 1
        ? t('{{n}} puzzle', { n: adv.page_count })
        : t('{{n}} puzzles', { n: adv.page_count })),
      adv.mine_to_edit ? h('span', { class: 'pill accent' }, t('Yours')) : null,
      adv.mine_to_edit
        ? (adv.published
            ? h('span', { class: 'pill success' }, t('Published'))
            : h('span', { class: 'pill warning' }, t('Draft')))
        : null,
      !adv.mine_to_edit && adv.shared ? h('span', { class: 'pill accent' }, t('Shared')) : null,
      bucket.unused.length > 0
        ? h('span', { class: 'pill accent' }, bucket.unused.length === 1
            ? t('{{n}} assignment available', { n: bucket.unused.length })
            : t('{{n}} assignments available', { n: bucket.unused.length }))
        : bucket.used.length > 0
          ? h('span', { class: 'pill' }, bucket.used.length === 1
              ? t('{{n}} run held', { n: bucket.used.length })
              : t('{{n}} runs held', { n: bucket.used.length }))
          : null,
    ].filter(Boolean);

    return h('div', { class: 'card' },
      h('div', { class: 'row between', style: 'align-items:flex-start; gap:.75rem' },
        h('div', { class: 'row', style: 'gap:.75rem; align-items:center; min-width:0' },
          adventureCover(adv, 56),
          h('h2', { style: 'margin:0' }, adv.title)),
        h('div', { class: 'row', style: 'gap:.35rem; flex-wrap:wrap' }, ...tags)),
      adv.description ? h('p', { class: 'muted', style: 'margin-top:.35rem' }, adv.description) : null,
      h('p', { class: 'muted mono', style: 'font-size:.8rem; margin:0' },
        adv.slug + (adv.author ? ' · ' + adv.author : '')),
      actions,
    );
  };

  view.replaceChildren(
    h('div', { class: 'row between' },
      h('h1', {}, t('Adventures')),
      h('div', { class: 'row' },
        h('button', { class: 'btn', on: { click: () => nav('#store') } },
          icon(ICONS.coins), t('Store')),
        h('button', { class: 'btn primary', on: { click: () => openCreateAdventure() } },
          icon(ICONS.plus), t('New adventure')))),
    runnable.length === 0
      ? h('div', { class: 'empty' },
          h('p', {}, t('No adventures you can run yet.')),
          h('p', { class: 'muted' }, t('Create your own or browse the Store for published adventures.')),
          h('div', { class: 'row', style: 'gap:.5rem; justify-content:center; margin-top:.5rem' },
            h('button', { class: 'btn primary', on: { click: () => openCreateAdventure() } },
              icon(ICONS.plus), t('New adventure')),
            h('button', { class: 'btn', on: { click: () => nav('#store') } },
              icon(ICONS.coins), t('Browse the Store'))))
      : h('div', { class: 'grid cols-2' }, runnable.map(renderCard)),
  );
}

// pickAndScheduleRun forwards straight to scheduleRun when there's a
// single assignment; when the arranger holds several for the same
// adventure it pops a tiny chooser so they know which one is spent.
async function pickAndScheduleRun(unusedAssignments, adv) {
  if (unusedAssignments.length === 1) {
    return scheduleRun(unusedAssignments[0].id);
  }
  const pick = await modal(t('Pick an assignment'), ({ body, close }) => {
    body.append(h('p', { class: 'muted' },
      t('You hold several assignments for {{title}}. Which one do you want to schedule?', { title: adv.title })));
    const list = h('div', { class: 'grid', style: 'gap:.4rem' });
    for (const a of unusedAssignments) {
      list.append(h('button', {
        class: 'btn',
        style: 'justify-content:flex-start; text-align:left',
        on: { click: () => close(a.id) },
      }, t('up to {{n}} teams · purchased {{when}}',
        { n: a.max_teams, when: fmtLocal(a.created_at) })));
    }
    body.append(list);
    body.append(h('div', { class: 'row end', style: 'margin-top:1rem' },
      h('button', { class: 'btn', on: { click: () => close(null) } }, t('Cancel'))));
  });
  if (pick) scheduleRun(pick);
}

// openPurchaseModal drives the buy-team-slots flow. The user picks a
// slot count, sees the total, and confirms. The server creates a
// pending purchase and returns a checkout_url — we redirect to it
// (simulated page now, Stripe Checkout later). On success the checkout
// page navigates the user back to #purchases so they see the fresh
// assignment.
async function openPurchaseModal(adv) {
  // Pricing lives server-side (PricePerSlotCents) but the UI has a
  // hardcoded mirror so we can show the total before the POST. If the
  // server price changes this drifts — that's fine for the simulated
  // flow; Stripe will ship a real catalog later.
  const PRICE_CENTS = 200;
  await modal(t('Buy team slots'), ({ body, close }) => {
    const slots = h('input', { type: 'number', min: '1', max: '100', value: '10', required: true });
    const totalEl = h('strong', {}, '');
    const update = () => {
      const n = Math.max(1, parseInt(slots.value, 10) || 0);
      totalEl.textContent = new Intl.NumberFormat(undefined, { style: 'currency', currency: 'USD' })
        .format(n * PRICE_CENTS / 100);
    };
    slots.addEventListener('input', update);
    update();
    const form = h('form', {},
      h('p', {},
        t('Each team slot lets one team play "{{title}}".', { title: adv.title || adv.slug })),
      h('label', { class: 'field' },
        h('span', {}, t('Team slots')), slots),
      h('p', { class: 'muted' },
        t('Total: '), totalEl,
        ' ',
        h('span', { class: 'muted', style: 'font-size:.85rem' },
          t('({{price}} per slot)', { price: '$2.00' }))),
      h('div', { class: 'row end' },
        h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, t('Cancel')),
        h('button', { class: 'btn primary', type: 'submit' }, t('Proceed to payment'))));
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const n = Math.max(1, parseInt(slots.value, 10) || 1);
      const r = await api('/api/admin/purchases', {
        method: 'POST',
        body: JSON.stringify({ adventure_slug: adv.slug, max_teams: n }),
      });
      if (r.status !== 201) {
        toastErr(r.body?.error || `error ${r.status}`);
        return;
      }
      close(true);
      location.href = r.body.checkout_url;
    });
    body.append(form);
  });
}

async function scheduleRun(source) {
  // `source` is either a number (assignment id — the Store purchase flow)
  // or an object with `{ slug }` — an admin-commissioned share or the
  // org's own-authored adventure, both of which skip the assignment and
  // run free.
  const baseReq = typeof source === 'number'
    ? { assignment_id: source }
    : { adventure_slug: source.slug };
  const body = await modal(t('New run'), ({ body, close }) => {
    const name = h('input', { placeholder: t('e.g. “Saturday Andersson party”') });
    // Two primary options, "Start now" first because the common case
    // is "I bought this because I want to play right now".
    const modeNow = h('input', { type: 'radio', name: 'mode', value: 'now', checked: true });
    const modeLater = h('input', { type: 'radio', name: 'mode', value: 'later' });
    const when = h('input', { type: 'datetime-local', disabled: '' });
    const refresh = () => { when.disabled = !modeLater.checked; };
    modeNow.addEventListener('change', refresh);
    modeLater.addEventListener('change', refresh);

    const form = h('form', {},
      h('label', { class: 'field' }, h('span', {}, t('Name (optional)')), name),
      h('label', { style: 'display:flex; gap:.5rem; align-items:center; margin:.5rem 0' },
        modeNow, h('span', {}, t('Start now'))),
      h('label', { style: 'display:flex; gap:.5rem; align-items:center; margin:.5rem 0' },
        modeLater, h('span', {}, t('Schedule for later'))),
      h('label', { class: 'field' }, h('span', {}, t('Auto-start at')), when),
      h('div', { class: 'row end' },
        h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, t('Cancel')),
        h('button', { class: 'btn primary', type: 'submit' }, t('Create run'))),
    );
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const req = { ...baseReq, name: name.value.trim() };
      if (modeLater.checked) {
        if (!when.value) { toastErr(t('Pick an auto-start time')); return; }
        const d = new Date(when.value);
        if (Number.isNaN(d.getTime())) { toastErr(t('Bad date')); return; }
        req.scheduled_at = d.toISOString();
      }
      close({ req, startNow: modeNow.checked });
    });
    body.append(form);
  });
  if (!body) return;
  const r = await api('/api/admin/runs', { method: 'POST', body: JSON.stringify(body.req) });
  if (r.status !== 201) { toastErr(r.body?.error || t('error {{status}}', { status: r.status })); return; }
  const runID = r.body.id;
  if (body.startNow) {
    const sr = await api('/api/admin/runs/' + runID + '/start', { method: 'POST' });
    if (sr.status !== 204 && sr.status !== 200) {
      toastErr(sr.body?.error || t('error {{status}}', { status: sr.status }));
    }
  }
  toastOk(t('Run ready'));
  nav('#runs/' + runID);
}

// openNewEventWizard walks the arranger through every decision needed
// to get from "I want to host" to "here's the run with teams ready".
// Runs inline (no checkout-page jump) by calling the purchase +
// confirm endpoints directly from the submit handler. The simulated
// checkout page still exists for the standalone "Buy team slots"
// flow on the Adventures catalog, but the wizard bypasses it.
async function openNewEventWizard() {
  const [advR, assignR] = await Promise.all([
    api('/api/admin/adventures'),
    api('/api/admin/assignments'),
  ]);
  const advs = advR.body?.adventures || [];
  if (advs.length === 0) {
    toastErr(t('Create or browse an adventure first')); return;
  }
  const assignments = (assignR.body?.assignments || []).filter((a) => !a.run_id);

  await modal(t('Start a new event'), ({ body, close }) => {
    // ---- 1. Adventure picker ----
    const advPick = h('div', { class: 'chip-grid', style: 'max-height:240px' });
    let pickedAdv = advs[0];
    const advChip = (a) => {
      const chip = h('div', {
        class: 'chip selectable' + (a.slug === pickedAdv.slug ? ' selected' : ''),
        style: 'display:flex; flex-direction:column; gap:.1rem; min-width:160px',
      },
        h('strong', {}, a.title),
        h('span', { class: 'muted', style: 'font-size:.75rem' },
          a.mine_to_edit ? t('yours') : t('catalog')));
      chip.addEventListener('click', () => {
        pickedAdv = a;
        for (const c of advPick.children) c.classList.remove('selected');
        chip.classList.add('selected');
        refreshAssignment();
      });
      return chip;
    };
    advs.forEach((a) => advPick.append(advChip(a)));

    // ---- 2. Capacity: reuse existing assignment or buy ----
    const buyCount = h('input', { type: 'number', min: '1', max: '100', value: '10' });
    const capacitySection = h('div', {});
    const PRICE_CENTS = 200;
    const refreshAssignment = () => {
      capacitySection.replaceChildren();
      const matching = assignments.filter((x) => x.adventure_slug === pickedAdv.slug);
      if (matching.length > 0) {
        capacitySection.append(
          h('p', { class: 'muted' }, t('You have an unused assignment for this adventure — no new purchase needed.')),
          h('p', {}, h('strong', {}, matching[0].max_teams === 1
            ? t('{{n}} team slot', { n: matching[0].max_teams })
            : t('{{n}} team slots', { n: matching[0].max_teams }))));
      } else {
        const total = () => ((parseInt(buyCount.value, 10) || 0) * PRICE_CENTS / 100).toFixed(2);
        const totalEl = h('strong', {}, '$' + total());
        buyCount.addEventListener('input', () => { totalEl.textContent = '$' + total(); });
        capacitySection.append(
          h('p', { class: 'muted' }, t('How many team slots do you need? ($2.00 each, simulated payment.)')),
          h('div', { class: 'row', style: 'gap:.5rem; align-items:center' },
            h('label', { class: 'field', style: 'flex:0 0 auto; margin:0' },
              h('span', {}, t('Team slots')), buyCount),
            h('p', { style: 'margin:0' }, t('Total: '), totalEl)));
      }
    };
    refreshAssignment();

    // ---- 3. When ----
    const modeNow   = h('input', { type: 'radio', name: 'ev-mode', value: 'now', checked: true });
    const modeLater = h('input', { type: 'radio', name: 'ev-mode', value: 'later' });
    const whenInput = h('input', { type: 'datetime-local', disabled: '' });
    const toggleWhen = () => { whenInput.disabled = !modeLater.checked; };
    modeNow.addEventListener('change', toggleWhen);
    modeLater.addEventListener('change', toggleWhen);
    const nameInput = h('input', { placeholder: t('e.g. “Saturday Andersson party”') });

    // ---- 4. Teams ----
    const teamCount = h('input', { type: 'number', min: '0', max: '50', value: '0' });
    const playerCount = h('input', { type: 'number', min: '1', max: '20', value: '3' });
    const teamPrefix   = h('input', { value: 'Team' });
    const playerPrefix = h('input', { value: 'Player' });

    const submitBtn = h('button', { class: 'btn primary', type: 'submit' }, t('Create event'));
    const form = h('form', {},
      h('h3', { style: 'margin-top:0' }, t('Adventure')),
      advPick,
      h('h3', {}, t('Team capacity')),
      capacitySection,
      h('h3', {}, t('When')),
      h('label', { style: 'display:flex; gap:.5rem; align-items:center; margin:.25rem 0' },
        modeNow, h('span', {}, t('Start now'))),
      h('label', { style: 'display:flex; gap:.5rem; align-items:center; margin:.25rem 0' },
        modeLater, h('span', {}, t('Schedule for later'))),
      h('label', { class: 'field' }, h('span', {}, t('Auto-start at')), whenInput),
      h('label', { class: 'field' }, h('span', {}, t('Run name (optional)')), nameInput),
      h('h3', {}, t('Teams (optional — add later if you prefer)')),
      h('div', { class: 'grid cols-2' },
        h('label', { class: 'field' }, h('span', {}, t('Number of teams')), teamCount),
        h('label', { class: 'field' }, h('span', {}, t('Players per team')), playerCount)),
      h('div', { class: 'grid cols-2' },
        h('label', { class: 'field' }, h('span', {}, t('Team name prefix')), teamPrefix),
        h('label', { class: 'field' }, h('span', {}, t('Player name prefix')), playerPrefix)),
      h('div', { class: 'row end', style: 'margin-top:1rem' },
        h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, t('Cancel')),
        submitBtn));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      try {
        // Resolve or mint an assignment.
        let assignmentID = null;
        const matching = assignments.filter((x) => x.adventure_slug === pickedAdv.slug);
        if (matching.length > 0) {
          assignmentID = matching[0].id;
        } else {
          const n = Math.max(1, parseInt(buyCount.value, 10) || 0);
          const pr = await api('/api/admin/purchases', {
            method: 'POST',
            body: JSON.stringify({ adventure_slug: pickedAdv.slug, max_teams: n }),
          });
          if (pr.status !== 201) { toastErr(pr.body?.error || t('Purchase failed')); return; }
          const cr = await api('/api/admin/purchases/' + pr.body.id + '/confirm', { method: 'POST' });
          if (cr.status !== 200) { toastErr(cr.body?.error || t('Payment failed')); return; }
          assignmentID = cr.body.assignment_id;
        }
        // Create the run.
        const runReq = { assignment_id: assignmentID, name: nameInput.value.trim() };
        if (modeLater.checked) {
          if (!whenInput.value) { toastErr(t('Pick an auto-start time')); return; }
          runReq.scheduled_at = new Date(whenInput.value).toISOString();
        }
        const rr = await api('/api/admin/runs', { method: 'POST', body: JSON.stringify(runReq) });
        if (rr.status !== 201) { toastErr(rr.body?.error || t('Run creation failed')); return; }
        const runID = rr.body.id;
        // Bulk teams.
        const T = Math.max(0, parseInt(teamCount.value, 10) || 0);
        const P = Math.max(1, parseInt(playerCount.value, 10) || 0);
        const tp = teamPrefix.value.trim() || 'Team';
        const pp = playerPrefix.value.trim() || 'Player';
        for (let i = 1; i <= T; i++) {
          const members = Array.from({ length: P }, (_, j) => `${pp} ${j + 1}`);
          await api(`/api/admin/runs/${runID}/teams`, {
            method: 'POST',
            body: JSON.stringify({ name: `${tp} ${i}`, member_names: members }),
          });
        }
        if (modeNow.checked) {
          await api('/api/admin/runs/' + runID + '/start', { method: 'POST' });
        }
        toastOk(t('Event ready'));
        close(true);
        nav('#runs/' + runID);
      } finally {
        submitBtn.disabled = false;
      }
    });
    body.append(form);
  }, { wide: true });
}

// runLabel renders a run's display name — the human-set name if any,
// otherwise "Run #id". Used everywhere a run identifier is shown.
function runLabel(run) {
  if (!run) return '';
  return run.name ? run.name : 'Run #' + run.id;
}

async function openRenameRun(run) {
  await modal(t('Rename run'), ({ body, close }) => {
    const input = h('input', { value: run.name || '', autofocus: true, placeholder: t('Run name') });
    const form = h('form', {},
      h('label', { class: 'field' }, h('span', {}, t('Run name')), input),
      h('p', { class: 'muted', style: 'font-size:.85rem' },
        t('Empty resets to "Run #{{id}}".', { id: run.id })),
      h('div', { class: 'row end' },
        h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, t('Cancel')),
        h('button', { class: 'btn primary', type: 'submit' }, t('Save'))));
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const r = await api(`/api/admin/runs/${run.id}`, {
        method: 'PATCH', body: JSON.stringify({ name: input.value.trim() }),
      });
      if (r.status === 204) { toastOk(t('Renamed')); close(true); renderRoute(); }
      else toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
    });
    body.append(form);
  });
}

/* ========== Runs ========== */

function runsTable(rs) {
  if (rs.length === 0) return h('div', { class: 'empty' },

    h('button', { class: 'btn primary', on: { click: () => nav('#adventures') } },

      h('th', {}, t('Run')),
      h('th', { class: 'hide-narrow' }, t('Adventure')),

      h('th', { class: 'hide-narrow' }, t('Scheduled')),
      h('th', { class: 'hide-narrow' }, t('Started')))),
