}

// renderSettingsRoleCard tells the user which role they hold —
// global admin, org admin, or race director — plus which org they're
// acting as when relevant. Pre-existed only as branching logic in
// the rest of the UI (which tabs show, which buttons appear); now
// it's an explicit "you are X" surface so a user doesn't have to
// reverse-engineer their role by reading the tab strip.
function renderSettingsRoleCard() {
  const me = state.me || {};
  const role = me.role;
  const memberships = me.memberships || [];
  const active = memberships.find((m) => m.org_id === me.org_id);
  let label, blurb;
  if (role === 'admin') {
    label = t('Global admin');
    blurb = t('You can manage every organisation, adventure, and event on this instance. Treat this like a root password.');
  } else if (role === 'org_admin') {
    label = t('Organisation admin');
    blurb = t('You can manage members, purchases, branding, and settings for your organisation. Run events too.');
  } else if (role === 'org_member') {
    label = t('Race director');
    blurb = t('You can author adventures and run events in your organisation. Member management is reserved for admins.');
  } else {
    label = t('Player');
    blurb = t('You play events as a team member. The arranger console is read-only for you.');
  }
  // Identity row: username + email so the card doubles as a
  // "who am I logged in as" answer alongside the role.
  const identity = h('p', { class: 'muted', style: 'margin:0; font-size:.9rem' },
    me.username || '?',
    me.email ? ' · ' : null,
    me.email ? h('span', {}, me.email) : null,
  );
  const orgRow = active
    ? h('p', { style: 'margin:.4rem 0 0; display:flex; align-items:center; gap:.55rem' },
        orgIcon(active, 22),
        h('span', {}, t('Acting as '),
          h('strong', {}, active.org_name)))
    : null;
  return h('section', { class: 'card' },
    h('h2', { style: 'margin:0 0 .25rem' }, label),
    h('p', { class: 'muted', style: 'margin:0 0 .5rem' }, blurb),
    identity,
    orgRow,
  );
}

// renderSettingsSystem houses the operator-tunable knobs: server-wide
// signup / landing-page toggles plus the components panel. The
// software-update surface lives in a sibling tab next to this one.
// Admin-only — the tab strip already hides this entry from
// non-admins, but the role guard stays for the URL-typing edge case.
function renderSettingsSystem(view) {
  if (state.me?.role !== 'admin') {
    view.replaceChildren(h('p', { class: 'err' }, t('Admin only.')));
    return;
  }
  view.replaceChildren(
    h('h1', {}, t('System')),
    h('p', { class: 'muted' },
      t('Server-wide settings and the components wired into the running build. Read by every visitor; changes are immediate.')),
    renderSettingsServerCard(),
    renderSettingsComponentsCard(),
  );
}

// renderSettingsServerCard surfaces operator-tunable runtime knobs to
// the global admin. Two toggles today: public signup, and the
// marketing landing surface. Self-host operators flip both off for a
// closed deployment (single org, members invited only, app-only
// front door). Hosted ops keep both on so the marketing site and
// signup CTA continue to work.
function renderSettingsServerCard() {
  const card = h('div', { class: 'card settings-card' });
  const status = h('p', { class: 'muted', style: 'font-size:.85rem; margin:.5rem 0 0' });

  // Two toggles share the load/save plumbing — same endpoint shape,
  // different keys. The buildToggle helper isolates the bits that
  // differ (label, help text, response field, save URL, in-memory
  // mirror) so adding the next toggle later is a one-call addition.
  const buildToggle = ({ label, help, field, saveUrl, mirror }) => {
    const input = h('input', { type: 'checkbox' });
    const setStatus = (ok, msg) => {
      status.className = ok ? 'muted' : 'err';
      status.textContent = msg || '';
    };
    input.addEventListener('change', async () => {
      input.disabled = true;
      setStatus(true, t('Saving…'));
      const r = await api(saveUrl, {
        method: 'PUT',
        body: JSON.stringify({ enabled: input.checked }),
      });
      input.disabled = false;
      if (!r.ok) {
        setStatus(false, r.body?.error || t('error {{status}}', { status: r.status }));
        input.checked = !input.checked;
        return;
      }
      setStatus(true, t('Saved.'));
      if (mirror) mirror(!!r.body?.[field]);
    });
    return {
      input,
      row: h('div', { style: 'margin-top:.75rem' },
        h('label', { class: 'row', style: 'gap:.5rem; align-items:center' },
          input,
          h('span', {}, label)),
        h('p', { class: 'muted', style: 'font-size:.85rem; margin:.25rem 0 0 1.5rem' }, help)),
      field,
    };
  };

  const signup = buildToggle({
    label: t('Allow public signup'),
    help: t('When off, the /arrange "Sign up" link is hidden and the signup endpoint refuses new accounts. Existing arrangers can still log in. Add new arrangers via Organizations → Members.'),
    field: 'signup_enabled',
    saveUrl: '/api/admin/settings/signup',
    mirror: (v) => { state.signupEnabled = v; },
  });
  const landing = buildToggle({
    label: t('Show public landing page'),
    help: t('When off, unauthenticated visitors to / are sent straight to the login screen and /pricing returns 404. Useful for self-host deployments that don\'t want a marketing front door.'),
    field: 'landing_enabled',
    saveUrl: '/api/admin/settings/landing',
    mirror: null,
  });
  // Hint shown under the landing toggle when ZV_LANDING_ENABLED is
  // pinning the value via env. Inserted after the row's existing help
  // line so the operator sees both — what the toggle does, and why it
  // currently isn't taking effect.
  const landingEnvHint = h('p', { class: 'muted', style: 'font-size:.85rem; margin:.25rem 0 0 1.5rem; font-style: italic' }, '');
  landing.row.append(landingEnvHint);
  const toggles = [signup, landing];

  const setStatus = (ok, msg) => {
    status.className = ok ? 'muted' : 'err';
    status.textContent = msg || '';
  };
  const refresh = async () => {
    setStatus(true, t('Loading…'));
    const r = await api('/api/admin/settings');
    if (!r.ok) {
      setStatus(false, r.body?.error || t('error {{status}}', { status: r.status }));
      toggles.forEach((tg) => { tg.input.disabled = true; });
      return;
    }
    toggles.forEach((tg) => {
      tg.input.checked = !!r.body?.[tg.field];
      tg.input.disabled = false;
    });
    // ZV_LANDING_ENABLED, when set, hard-overrides the DB. Disable the
    // toggle and surface why so an operator who pinned it via .env
    // doesn't waste time wondering why their flips don't stick.
    if (r.body?.landing_pinned_by_env) {
      landing.input.disabled = true;
      landingEnvHint.textContent = t('Pinned by ZV_LANDING_ENABLED — unset the env var to use this toggle.');
    } else {
      landingEnvHint.textContent = '';
    }
    setStatus(true, '');
  };

  card.append(
    h('h2', {}, t('Server settings')),
    h('p', { class: 'muted', style: 'font-size:.9rem' },
      t('Knobs that affect the whole deployment. Visible only to global admins.')),
    ...toggles.map((tg) => tg.row),
    status,
  );
  refresh();
  return card;
}

// renderSettingsComponentsCard surfaces what's wired into the running
// binary — mailer, payments, metrics, etc. — and whether each seam is
// enabled in this deployment. Read-only on purpose: swapping a seam
// means rebuilding the binary, so the GUI describes what's installed,
// it doesn't configure it. Admin-only.
function renderSettingsComponentsCard() {
  const card = h('div', { class: 'card settings-card' });
  const list = h('div');
  const status = h('p', { class: 'muted', style: 'font-size:.85rem; margin:.5rem 0 0' });
  const refresh = async () => {
    list.replaceChildren(h('p', { class: 'muted', style: 'font-size:.85rem' }, t('Loading…')));
    const r = await api('/api/admin/components');
    if (!r.ok) {
      list.replaceChildren(h('p', { class: 'err' }, r.body?.error || t('error {{status}}', { status: r.status })));
      return;
    }
    const items = r.body?.components || [];
    if (items.length === 0) {
      list.replaceChildren(h('p', { class: 'muted' }, t('No components reported.')));
      return;
    }
    list.replaceChildren(h('table', { class: 'audit-table' },
      h('thead', {}, h('tr', {},
        h('th', {}, t('Component')),
        h('th', {}, t('Implementation')),
        h('th', {}, t('Status')),
        h('th', {}, t('Notes')))),
      h('tbody', {}, items.map((c) => h('tr', {},
        h('td', { class: 'mono' }, c.name),
        h('td', { class: 'mono' }, c.impl),
        h('td', {}, h('span', {
          class: 'pill ' + (c.enabled ? 'success' : ''),
        }, c.enabled ? t('on') : t('off'))),
        h('td', { class: 'muted', style: 'font-size:.85rem' }, c.notes || ''))))));
  };
  card.append(
    h('h2', {}, t('Installed components')),
    h('p', { class: 'muted', style: 'font-size:.9rem' },
      t('Pluggable seams the running binary was built with. Read-only — swap an implementation by rebuilding.')),
    list,
    status,
  );
  refresh();
  return card;
}

// viewSettingsSoftwareUpdate paints the Settings → Software update
// tab. Pulls the cached snapshot from state.systemUpdate (populated
// at app start by loadSystemUpdate) and refreshes it on entry so an
// admin opening the tab always gets up-to-date info even if the
// background poll hasn't fired this hour. Surfaces the running and
// latest versions, the changelog sections newer than the running
// binary, and the per-deployment upgrade snippets — the actual
// upgrade is the operator's job; this page exists to tell them
// there's work to do, not to do the work for them.
async function viewSettingsSoftwareUpdate(view) {
  if (state.me?.role !== 'admin') {
    view.replaceChildren(h('p', { class: 'err' }, t('Admin only.')));
    return;
  }
  // Refresh from the cache endpoint on entry. CheckNow (POST) is
  // wired to its own button below; the GET on entry just means a
  // fresh page paints fresh data even when a background poll has
  // landed since the user last loaded the app.
  await loadSystemUpdate();
  paint();

  function paint() {
    const s = state.systemUpdate || {};
    const isDev = !!s.is_dev_build;
    const updateAvailable = !!s.update_available;
    // Treat "no snapshot at all" as "couldn't check" — the only way
    // to land here without a checked_at is a transport failure on
    // /api/admin/system-update itself (the service always populates
    // CheckedAt even when the upstream fetch failed).
    const couldNotCheck = (!!s.fetch_error && !s.latest) || !s.checked_at;

    let pillCls = '';
    let pillTxt = t('Up to date');
    if (isDev) { pillCls = 'warning'; pillTxt = t('Development build'); }
    else if (updateAvailable) { pillCls = 'accent'; pillTxt = t('Update available'); }
    else if (couldNotCheck) { pillCls = 'warning'; pillTxt = t('Could not check'); }

    const checkedAt = s.checked_at
      ? t('Checked {{when}}', { when: relativeTime(s.checked_at) })
      : t('Not checked yet.');

    const checkBtn = h('button', {
      class: 'btn small', type: 'button',
    }, t('Check now'));
    const checkStatus = h('span', { class: 'muted', style: 'font-size:.85rem; margin-left:.5rem' });

        state.systemUpdate = r.body || {};
        // Re-paint the rest of the app too — the hamburger / nav

        paint();
        renderShellChrome();
      } else {
        checkStatus.textContent = r.body?.error || t('error {{status}}', { status: r.status });

    const versionRow = h('div', {
      class: 'row',
      style: 'gap:1.5rem; align-items:baseline; flex-wrap:wrap; margin:.75rem 0 .5rem',
    },
      h('div', {},
        h('span', { class: 'muted', style: 'font-size:.75rem; text-transform:uppercase; letter-spacing:.06em' }, t('Current')),
        h('div', { class: 'mono', style: 'font-size:1.1rem' }, s.current_raw || t('unknown'))),
      h('div', {},
        h('span', { class: 'muted', style: 'font-size:.75rem; text-transform:uppercase; letter-spacing:.06em' }, t('Latest')),
        h('div', { class: 'mono', style: 'font-size:1.1rem' },
          s.latest ? (s.latest + (s.latest_date ? '  (' + s.latest_date + ')' : ''))
                   : t('unknown'))));

    const headerCard = h('div', { class: 'card settings-card' },
      h('div', { class: 'row between', style: 'gap:.5rem; align-items:center; flex-wrap:wrap' },
        h('h2', { style: 'margin:0' }, t('Software update')),
        h('span', { class: 'pill ' + pillCls }, pillTxt)),
      h('p', { class: 'muted', style: 'margin:.25rem 0 0' },
        t('Checks once a day whether a newer version of Zonventure is available. Click Check now to look immediately.')),
      versionRow,
      h('div', { class: 'row', style: 'gap:.5rem; align-items:center; flex-wrap:wrap' },
        checkBtn,
        h('span', { class: 'muted', style: 'font-size:.85rem' }, checkedAt),
        checkStatus));

    if (s.fetch_error) {
      headerCard.append(h('p', { class: 'muted', style: 'margin:.5rem 0 0; font-size:.85rem' },
        t('Last error: {{err}}', { err: s.fetch_error })));
    }

    const cards = [headerCard];

    if (isDev) {
      cards.push(h('div', { class: 'card settings-card' },
        h('h2', {}, t('Development build')),
        h('p', { class: 'muted' },
          t('This binary reports a version past the last tagged release. Update prompts are suppressed because we can\'t tell whether the upstream changelog covers commits this build already includes.'))));
    } else if (updateAvailable && Array.isArray(s.sections) && s.sections.length) {
      const notesCard = h('div', { class: 'card settings-card' },
        h('h2', {}, t('Changes since {{v}}', { v: s.current || s.current_raw || '' })));
      s.sections.forEach((sec) => {
        notesCard.append(
          h('div', { class: 'row', style: 'gap:.5rem; align-items:baseline; margin:1rem 0 .25rem' },
            h('strong', { class: 'mono', style: 'font-size:1.05rem' }, sec.version),
            sec.date ? h('span', { class: 'muted', style: 'font-size:.85rem' }, sec.date) : null),
          h('div', { class: 'md-preview', html: sec.notes_html || '' }),
        );
      });
      cards.push(notesCard);
    }

    cards.push(renderUpgradeInstructionsCard());

    view.replaceChildren(
      h('h1', {}, t('Software update')),
      h('p', { class: 'muted' },
        t('Detects new releases of Zonventure and shows what changed. Upgrading the deployment is still a shell-level operation — instructions per deployment style are below.')),
      ...cards,
    );
  }
}

// renderShellChrome rebuilds the sidebar + topbar so a fresh
// systemUpdate snapshot flips the hamburger / Settings badge
// without re-routing the whole view. Cheap because renderShell()
// is already idempotent on state.
function renderShellChrome() {
  // Re-running render() rebuilds the entire shell, but it also
  // re-renders the current view which would discard transient form
  // state in other tabs. Limit to the shell parts that depend on
  // systemUpdate by re-painting the sidebar nav + menu button.
  // The cheap path is just to call render() — every settings
  // surface refetches from the server on mount, so nothing valuable
  // is lost.
  render();
}

// relativeTime formats an ISO-8601 timestamp as "5 minutes ago" /
// "yesterday" / "2 weeks ago". Single-purpose helper used by the
// software-update card; doesn't try to handle every grammar case
// (Swedish singular vs. plural is folded into one phrase per range).
function relativeTime(iso) {
  const t0 = new Date(iso).getTime();
  if (Number.isNaN(t0)) return iso;
  const sec = Math.max(0, Math.round((Date.now() - t0) / 1000));
  if (sec < 60)        return t('just now');
  const min = Math.round(sec / 60);
  if (min < 60)        return t('{{n}} minute(s) ago', { n: min });
  const hr = Math.round(min / 60);
  if (hr < 24)         return t('{{n}} hour(s) ago', { n: hr });
  const days = Math.round(hr / 24);
  if (days < 14)       return t('{{n}} day(s) ago', { n: days });
  const weeks = Math.round(days / 7);
  if (weeks < 8)       return t('{{n}} week(s) ago', { n: weeks });
  return new Date(iso).toLocaleDateString();
}

function renderSettingsSessionsCard() {
  // Active sessions surface — list each session this user is currently
  // logged into, including one for "this device". Per-row Sign out
  // calls /api/admin/me/sessions/{id}; "Sign out everywhere else"
  // wipes all but the current. Mirrors the security UX users have
  // come to expect from Google / GitHub / etc.
  const card = h('div', { class: 'card settings-card' });
  const list = h('div');
  const status = h('p', { class: 'muted', style: 'font-size:.85rem; margin:.5rem 0 0' });
  const refresh = async () => {
    list.replaceChildren(h('p', { class: 'muted', style: 'font-size:.85rem' }, t('Loading…')));
    const r = await api('/api/admin/me/sessions');
    if (!r.ok) {
      list.replaceChildren(h('p', { class: 'err' }, r.body?.error || t('error {{status}}', { status: r.status })));
      return;
    }
    const sessions = r.body?.sessions || [];
    if (sessions.length === 0) {
      list.replaceChildren(h('p', { class: 'muted' }, t('No active sessions.')));
      return;
    }
    list.replaceChildren(...sessions.map((s) => h('div', { class: 'session-row' },
      h('div', { class: 'session-row-info' },
        h('div', { class: 'session-row-name' },
          s.current ? h('span', { class: 'pill success' }, t('this device')) : null,
          s.user_agent ? shortUA(s.user_agent) : t('Unknown device')),
        h('div', { class: 'session-row-meta' },
          t('Created {{when}}', { when: formatAuditTS(s.created_at) }),
          s.ip ? ' · ' + t('from {{ip}}', { ip: s.ip }) : '',
          s.expires_at ? ' · ' + t('expires {{when}}', { when: formatAuditTS(s.expires_at) }) : '')),
      s.current
        ? null
        : h('button', { class: 'btn small danger', type: 'button',
            on: { click: async () => {
              const rr = await api('/api/admin/me/sessions/' + encodeURIComponent(s.id),
                { method: 'DELETE' });
              if (rr.status === 204) { toastOk(t('Session signed out')); refresh(); }
              else toastErr(rr.body?.error || t('error {{status}}', { status: rr.status }));
            } } },
            t('Sign out')),
    )));
  };
  const otherBtn = h('button', { class: 'btn', type: 'button' },
    icon(ICONS.shield), t('Sign out everywhere else'));
  otherBtn.addEventListener('click', async () => {
    if (!confirm(t('Sign out of every other browser, phone, and tablet? You\'ll stay signed in here.'))) return;
    otherBtn.disabled = true;
    const rr = await api('/api/admin/me/sessions', { method: 'DELETE' });

    if (rr.status === 204) { toastOk(t('Other sessions signed out')); refresh(); }
    else toastErr(rr.body?.error || t('error {{status}}', { status: rr.status }));
  });
  card.append(
    h('h2', {}, t('Active sessions')),
    h('p', { class: 'muted', style: 'font-size:.9rem' },
      t('Every device you\'re signed into. If something looks unfamiliar, sign that session out.')),
    list,
    h('div', { class: 'row end', style: 'margin-top:.75rem' }, otherBtn),
    status,
  );
  refresh();
  return card;
}

// shortUA chops a User-Agent string to something glanceable. Full UA
// is still in the audit details modal for global admins; in the
// per-user list we just want "iPhone Safari" or similar.
function shortUA(ua) {
  if (!ua) return '';
  // Quick OS/browser detection — good enough for an at-a-glance label.
  let os = 'Other';
  if (/Windows/.test(ua)) os = 'Windows';
  else if (/Macintosh|Mac OS X/.test(ua)) os = 'macOS';
  else if (/Android/.test(ua)) os = 'Android';
  else if (/iPhone|iPad|iOS/.test(ua)) os = 'iOS';
  else if (/Linux/.test(ua)) os = 'Linux';
  let browser = 'Browser';
  if (/Edg\//.test(ua)) browser = 'Edge';
  else if (/Chrome\//.test(ua)) browser = 'Chrome';
  else if (/Firefox\//.test(ua)) browser = 'Firefox';
  else if (/Safari\//.test(ua) && !/Chrome/.test(ua)) browser = 'Safari';
  return os + ' · ' + browser;
}

function renderSettingsExportCard() {
  const status = h('p', { class: 'muted', style: 'font-size:.85rem' });
  // Plain <a download> would also work, but going through fetch lets
  // us surface 4xx errors as a toast instead of a confusing browser
  // download of an HTML error page.
  const dl = h('button', { class: 'btn', type: 'button' }, t('Download my data'));
  dl.addEventListener('click', async () => {
    dl.disabled = true; status.className = 'muted'; status.textContent = t('Preparing export…');
    try {
      const res = await fetch('/api/admin/me/export', { credentials: 'same-origin' });
      if (!res.ok) {
        status.className = 'err';
        status.textContent = t('error {{status}}', { status: res.status });
        return;
      }
      const blob = await res.blob();
      const cd = res.headers.get('Content-Disposition') || '';
      const m = cd.match(/filename="([^"]+)"/);
      const name = m ? m[1] : 'zonventure-export.json';
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.append(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      status.className = 'ok';
      status.replaceChildren(
        document.createTextNode(t('Downloaded {{name}}.', { name }) + ' '),
        // Right-to-erasure follow-up: now that they have their data,
        // remind them deletion is one click away. Anchored scroll
        // jumps to the danger card at the bottom of the page.
        h('a', {
          href: '#settings/delete', style: 'color:inherit; text-decoration:underline',
          on: { click: (e) => {
            e.preventDefault();
            const card = document.getElementById('settings-delete');
            if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
          } },
        }, t('Want to delete your account too? →')),
      );
    } catch (e) {
      status.className = 'err'; status.textContent = String(e);
    } finally {
      dl.disabled = false;
    }
  });
  return h('div', { class: 'card settings-card' },
    h('h2', {}, t('Download my data')),
    h('p', { class: 'muted', style: 'font-size:.9rem' },
      t('A single JSON file with your account data plus your organization\'s runs, teams, adventures, assignments and purchases.')),
    h('div', { class: 'row end' }, dl),
    status,
  );
}

// renderSettingsTOTPCard is the two-factor authentication panel.
// Three states the card has to render:
//   - server has no ZV_TOTP_KEY configured → operator placeholder
//   - user enrolled            → "TOTP is on", regenerate codes, disable
//   - user not enrolled        → setup flow (QR + manual secret + confirm)
//
// Disable + regenerate codes both require X-Confirm-Password reauth,
// so they prompt for the current password inline before firing.
function renderSettingsTOTPCard() {
  const card = h('div', { class: 'card settings-card' });
  card.replaceChildren(h('h2', {}, t('Two-factor authentication')),
    h('p', { class: 'muted', style: 'font-size:.9rem' }, t('Loading…')));
  const refresh = async () => {
    const r = await api('/api/admin/me/totp');
    if (!r.ok) {
      card.replaceChildren(h('h2', {}, t('Two-factor authentication')),
        h('p', { class: 'err' }, r.body?.error || t('error {{status}}', { status: r.status })));
      return;
    }
    if (!r.body.server_ready) {
      card.replaceChildren(h('h2', {}, t('Two-factor authentication')),
        h('p', { class: 'muted', style: 'font-size:.9rem' },
          t('TOTP is not configured on this server. Ask your operator to set $ZV_TOTP_KEY (32 bytes base64) to enable enrolment.')));
      return;
    }
    if (r.body.enabled) {
      card.replaceChildren(...renderTOTPEnabled(refresh, r.body.enrolled_at));
      return;
    }
    card.replaceChildren(...renderTOTPDisabledSetup(refresh));
  };
  refresh();
  return card;
}

// renderTOTPEnabled is the panel shown when the user is already

function renderTOTPEnabled(refresh, enrolledAt) {

        const pw = prompt(t('Confirm your current password to regenerate recovery codes:'));

        status.className = 'muted'; status.textContent = t('Generating…');
        const r = await api('/api/admin/me/totp/recovery-codes/regenerate', {

// renderTOTPDisabledSetup is the enrol flow: SetupTOTP → display QR
// + secret → user scans → ConfirmTOTP → display recovery codes.
function renderTOTPDisabledSetup(refresh) {
  const status = h('p', { class: 'muted', style: 'font-size:.85rem' });
  const setupBox = h('div', { hidden: true });
  const startBtn = h('button', { class: 'btn primary', type: 'button', on: { click: async () => {
    startBtn.disabled = true;
    status.className = 'muted'; status.textContent = t('Generating secret…');
    const r = await api('/api/admin/me/totp/setup', { method: 'POST' });
    startBtn.disabled = false;
    if (!r.ok) {
      status.className = 'err';
      status.textContent = r.body?.error || t('error {{status}}', { status: r.status });
      return;
    }
    status.textContent = '';
    renderSetupConfirmFlow(setupBox, r.body, refresh);
    setupBox.removeAttribute('hidden');
    startBtn.hidden = true;
  } } }, t('Set up 2FA'));
  return [
    h('h2', {}, t('Two-factor authentication')),
    h('p', { class: 'muted', style: 'font-size:.9rem' },
      t('Add a second factor so a stolen password alone cannot log into your account. Requires an authenticator app like 1Password, Bitwarden, Aegis, Google Authenticator or similar.')),
    h('div', { class: 'row', style: 'margin-top:.5rem' }, startBtn),
    status,
    setupBox,
  ];
}

function renderSetupConfirmFlow(box, body, refresh) {
  const submitBtn = h('button', { class: 'btn primary', type: 'submit' }, t('Confirm and enable'));
  const otp = makeOTPBoxes({ onComplete: () => submitBtn.focus() });
  const status = h('p', { class: 'muted', style: 'font-size:.85rem' });
  const qrImg = body.qr_data_url
    ? h('img', { src: body.qr_data_url, alt: t('TOTP QR code'),
        style: 'width:200px; height:200px; image-rendering: pixelated; display:block; margin:0 auto;' })
    : null;
  const secretInput = h('input', {
    readonly: '', value: body.secret_base32,
    style: 'flex:1; min-width:0; background:var(--surface-2); font-family:ui-monospace,SFMono-Regular,monospace; font-size:.9rem; box-shadow:none; border-color:var(--border-soft)',
    on: { click: (e) => e.target.select() },
  });
  const copySecretBtn = h('button', {
    class: 'btn small', type: 'button', title: t('Copy secret'),
    on: { click: async () => {
      try {
        await navigator.clipboard.writeText(body.secret_base32);
        toastOk(t('Secret copied'));
      } catch {
        secretInput.select();
        document.execCommand('copy');
        toastOk(t('Secret copied'));
      }
    } },
  }, t('Copy'));
  const form = h('form', {},
    h('p', { class: 'muted', style: 'font-size:.9rem; margin-top:1rem' },
      t('Scan this QR code in your authenticator app, or enter the secret manually.')),
    qrImg,
    h('label', { class: 'field', style: 'margin-top:.5rem' },
      h('span', {}, t('Secret')),
      h('div', { class: 'row', style: 'gap:.5rem; align-items:center' },
        secretInput, copySecretBtn)),
    h('p', { class: 'muted', style: 'font-size:.9rem; margin-top:1rem' },
      t('Then enter the 6-digit code your app shows to confirm:')),
    otp.node,
    status,
    h('div', { class: 'row end' }, submitBtn));
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const code = otp.getValue();
    if (code.length !== 6) {
      status.className = 'err';
      status.textContent = t('Enter all 6 digits.');
      return;
    }
    status.className = 'muted'; status.textContent = t('Confirming…');
    const r = await api('/api/admin/me/totp/confirm', {
      method: 'POST', body: JSON.stringify({ code }),
    });
    if (!r.ok) {
      status.className = 'err';
      status.textContent = r.body?.error || t('error {{status}}', { status: r.status });
      otp.clear();
      return;
    }
    status.textContent = '';
    showRecoveryCodes(r.body?.recovery_codes || []);
    await refreshMe();
    refresh();
  });
  box.replaceChildren(form);
}

// showRecoveryCodes displays the freshly minted codes in a modal-ish
// callout. The user must explicitly dismiss it after copying — we
// can't show the codes again later.
function showRecoveryCodes(codes) {
  const list = h('ul', { style: 'font-family:monospace; font-size:1.1rem; line-height:1.6; user-select:all; margin:.75rem 0; padding-left:1.5rem' });
  for (const c of codes) list.appendChild(h('li', {}, c));
  const blob = new Blob([codes.join('\n') + '\n'], { type: 'text/plain' });
  const dlURL = URL.createObjectURL(blob);
  const overlay = h('div', {
    style: 'position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; z-index:9999; padding:1rem;',
  },
    h('div', { class: 'card', style: 'max-width:480px; width:100%; max-height:90vh; overflow:auto' },
      h('h2', {}, t('Save your recovery codes')),
      h('p', { class: 'muted' },
        t('Store these somewhere safe. Each code works once if you lose access to your authenticator.')),
      list,
      h('div', { class: 'row', style: 'gap:.5rem; flex-wrap:wrap' },
        h('a', { class: 'btn', href: dlURL, download: 'zonventure-recovery-codes.txt' }, t('Download as .txt')),
        h('button', { class: 'btn', type: 'button', on: { click: () => {
          navigator.clipboard?.writeText(codes.join('\n'))
            .then(() => toastOk(t('Copied.')))
            .catch(() => toastErr(t('Could not copy.')));
        } } }, t('Copy to clipboard')),
        h('button', { class: 'btn primary', type: 'button', on: { click: () => {
          URL.revokeObjectURL(dlURL);
          overlay.remove();
        } } }, t('I saved them')))));
  document.body.appendChild(overlay);
}

function renderSettingsEmailCard(me) {
  const cur = me.email || t('(none — admin-seeded account)');
  const status = h('p', { class: 'muted', style: 'font-size:.85rem' });
  const newEmail = h('input', { name: 'new_email', type: 'email', autocomplete: 'email', required: true });
  // Revert banner: filled in by /api/admin/me/email/revert-status if a
  // recent change is still revertable. Hidden by default so the card
  // is identical for the common no-pending-revert case.
  const revertBox = h('div', { hidden: true });
  (async () => {
    const r = await api('/api/admin/me/email/revert-status');
    if (!r.ok || !r.body?.available) return;
    revertBox.replaceChildren(
      h('div', { class: 'settings-callout-warn' },
        h('div', {},
          t('Recent change from {{prev}} → {{cur}}.', { prev: r.body.previous_email, cur: cur })),
        h('div', { class: 'meta' },
          t('You can revert until {{when}} if you typed the new address wrong.',
            { when: formatAuditTS(r.body.expires_at) })),
        h('div', { class: 'row end' },
          h('button', { class: 'btn small', type: 'button',
            on: { click: async () => {
              if (!confirm(t('Revert your email back to {{prev}}?', { prev: r.body.previous_email }))) return;
              const rr = await api('/api/admin/me/email/revert', { method: 'POST' });
              if (rr.ok) {
                toastOk(t('Email reverted to {{email}}.', { email: rr.body?.email || r.body.previous_email }));
                await refreshMe(); render();
              } else {
                toastErr(rr.body?.error || t('error {{status}}', { status: rr.status }));
              }
            } } },
            t('Revert email change')))));
    revertBox.removeAttribute('hidden');
  })();
  const form = h('form', { class: 'card settings-card' },
    h('h2', {}, t('Change email')),
    h('p', { class: 'muted', style: 'font-size:.9rem' },
      t('Current email: {{email}}', { email: cur })),
    revertBox,
    h('p', { class: 'muted', style: 'font-size:.85rem' },
      t('We send a confirmation link to the new address — your email only changes when you click it. After confirming you have a {{n}}-day window to revert if you typed it wrong.', { n: 7 })),
    h('label', { class: 'field' }, h('span', {}, t('New email')), newEmail),
    status,
    h('div', { class: 'row end' },
      h('button', { class: 'btn primary', type: 'submit' }, t('Send confirmation'))));
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    status.className = 'muted'; status.textContent = t('Sending…');
    const r = await api('/api/admin/me/email', {
      method: 'POST',
      body: JSON.stringify({ new_email: newEmail.value }),
    });
    if (r.status === 200) {
      status.className = 'ok';
      status.textContent = t('Confirmation link sent to {{email}}.', { email: newEmail.value });
      newEmail.value = '';
    } else {
      status.className = 'err';
      status.textContent = r.body?.error || t('error {{status}}', { status: r.status });
    }
  });
  return form;
}

function renderSettingsDeleteCard() {
  const status = h('p', { class: 'muted', style: 'font-size:.85rem' });
  const form = h('form', { class: 'card settings-card danger-card', id: 'settings-delete' },
    h('h2', {}, t('Delete account')),
    h('p', { class: 'muted', style: 'font-size:.9rem' },
      t('Schedules your account for deletion in 7 days. You can cancel any time before then by logging back in. After the grace period, your account and (if you\'re the last member) your organization — runs, teams, adventures, purchases — are permanently removed.')),
    status,
    h('div', { class: 'row end' },
      h('button', { class: 'btn danger', type: 'submit' }, t('Schedule deletion…'))));
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = await promptPassword(
      t('Schedule account deletion?'),
      t('Type your password to confirm. You\'ll be logged out and have 7 days to log back in and cancel.'));
    if (!pw) return;
    status.className = 'muted'; status.textContent = t('Scheduling…');
    const r = await api('/api/admin/me', {
      method: 'DELETE',
      headers: { 'X-Confirm-Password': pw },
    });
    // Server returns 202 with the scheduled_deletion_at timestamp.
    // Sessions are dropped server-side, so refreshing /whoami would
    // 401 — redirect to the landing/login screen instead.
    if (r.status === 202) {
      location.replace('/arrange');
      return;
    }
    status.className = 'err';
    status.textContent = r.body?.error || t('error {{status}}', { status: r.status });
  });
  return form;
}

// renderSlotExpiryHint returns a small inline badge for the magic-link
// expiry. Past → "expired" in red. Within 7 days → muted "expires in Nd".
// More than 7 days out OR null → empty string (no badge), to avoid
// noise in the common case where the link is healthy.
function renderSlotExpiryHint(expiresAt, _lastLogin) {
  if (!expiresAt) return null;
  const iso = expiresAt.includes('T') ? expiresAt : expiresAt.replace(' ', 'T') + 'Z';
  const exp = new Date(iso);
  if (isNaN(exp.getTime())) return null;
  const ms = exp.getTime() - Date.now();
  if (ms <= 0) {
    return h('span', { class: 'tl-expiry expired', title: t('Expired {{when}}', { when: fmtLocal(expiresAt) }) },
      t('expired'));
  }
  const days = Math.ceil(ms / (24 * 3600 * 1000));
  if (days <= 7) {
    return h('span', { class: 'tl-expiry soon', title: t('Expires {{when}}', { when: fmtLocal(expiresAt) }) },
      t('expires in {{n}}d', { n: days }));
  }
  return null;
}

function formatAuditTS(ts) {
  // Server emits 'YYYY-MM-DD HH:MM:SS' UTC. Render local time so the
  // operator's clock matches the row. 24h clock matches the rest of
  // the app — forensic timestamps shouldn't be ambiguous AM/PM.
  if (!ts) return '';
  const iso = ts.includes('T') ? ts : ts.replace(' ', 'T') + 'Z';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return ts;
  return d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'medium', hour12: false });
}

function levelRank(level) {
  return { DEBUG: 0, INFO: 1, WARN: 2, ERROR: 3 }[String(level || 'INFO').toUpperCase()] ?? 1;
}

function entryMatches(e, needle) {
  if ((e.msg || '').toLowerCase().includes(needle)) return true;
  for (const a of (e.attrs || [])) {
    if (String(a.k || '').toLowerCase().includes(needle)) return true;
    if (String(a.v ?? '').toLowerCase().includes(needle)) return true;
  }
  return false;
}

// writeEntry paints a single log line in the xterm with ANSI colour
// escapes driven by the entry's level.
function writeEntry(term, e) {
  const R = '\x1b[0m';
  const dim = '\x1b[2m';
  const levelColors = {
    DEBUG: '\x1b[90m',          // gray
    INFO:  '\x1b[36m',          // cyan
    WARN:  '\x1b[33m',          // yellow
    ERROR: '\x1b[1;31m',        // bold red
  };
  const lc = levelColors[(e.level || 'INFO').toUpperCase()] || '';
  const ts = (e.ts || '').replace('T', ' ').replace(/\.\d+/, '').replace('Z', '');
  let line = `${dim}${ts}${R} ${lc}${String(e.level || 'INFO').padEnd(5)}${R} ${e.msg || ''}`;
  for (const a of (e.attrs || [])) {
    line += ` ${dim}${a.k}${R}=${formatAttrValue(a.v)}`;
  }
  term.writeln(line);
}

function formatAttrValue(v) {
  if (v === null || v === undefined) return '';
  if (typeof v === 'string') {
    if (/[\s="]/.test(v)) return JSON.stringify(v);
    return v;
  }
  return String(v);
}

/* ========== Members (for org_admin of their own org) ========== */
async function viewMembers(view) {
  if (!state.me.org_id) {
    view.replaceChildren(h('p', { class: 'err' }, t('No organization.')));
    return;
  }
  const r = await api('/api/admin/organizations/' + state.me.org_id);
  if (!r.ok) {
    view.replaceChildren(h('p', { class: 'err' }, r.body?.error || t('failed to load')));
    return;
  }
  const org = r.body || { id: state.me.org_id, name: t('Your organization'), members: [] };
  // Transfer-ownership is org_admin-only and only useful when the
  // org has at least one other user to transfer TO. Hide it
  // otherwise so the affordance doesn't tease an action that would
  // refuse on submit.
  const meIsOrgAdmin = state.me.role === 'org_admin';
  const others = (org.members || []).filter((m) => m.id !== state.me.id);
  const transferBtn = meIsOrgAdmin && others.length > 0
    ? h('button', { class: 'btn',
        on: { click: () => openTransferOwnership(org) } },
        t('Transfer ownership…'))
    : null;
  view.replaceChildren(
    h('div', { class: 'row between', style: 'margin-bottom:1rem' },
      h('h1', { style: 'margin:0' }, t('Members')),
      h('div', { class: 'row', style: 'gap:.5rem' },
        transferBtn,
        h('button', { class: 'btn primary', on: { click: () => openAddOrgMember(org) } },
          icon(ICONS.plus), t('Add user')))),
    h('p', { class: 'muted' },
      t('Users in {{name}}. Admins can invite more users; race directors run the games.', { name: org.name })),
    h('div', { class: 'card', style: 'background: var(--surface-2); padding: .85rem 1rem; margin-bottom: .9rem; font-size: var(--ts-sm)' },
      h('div', { style: 'margin-bottom:.35rem' },
        h('span', { class: 'pill' }, t('admin')), ' ',
        h('span', { class: 'muted' },
          t('Run events, manage teams, plus invite/remove users and change billing.'))),
      h('div', {},
        h('span', { class: 'pill' }, t('race director')), ' ',
        h('span', { class: 'muted' },
          t('Run events and manage teams. Cannot invite users or touch billing.')))),
    (org.members || []).length === 0
      ? h('div', { class: 'empty' }, t('No other users yet.'))
      : h('div', { class: 'card' },
        h('table', { class: 'table' },
          h('thead', {}, h('tr', {}, h('th', {}, t('Username')), h('th', {}, t('Role')), h('th', {}, ''))),
          h('tbody', {}, (org.members || []).map((m) => h('tr', {},
            h('td', {}, m.username, state.me.id === m.id ? h('span', { class: 'muted', style: 'margin-left:.35rem' }, t('(you)')) : null),
            h('td', {}, h('span', { class: 'pill' }, m.role === 'org_admin' ? t('admin') : t('race director'))),
            h('td', {}, h('div', { class: 'row end' },
              state.me.id === m.id
                ? null
                : iconBtn('trash', t('Remove'), () => confirmRemoveOrgMember(org, m), { danger: true }))),
          ))))),
  );
}

/* ========== Kick off ========== */
render();
</script>
