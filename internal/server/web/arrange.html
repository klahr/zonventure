      file.remove();
      close(null);
      openEditPuzzle(adv, targetPage);
    };

    // Timeline is a click-to-switch strip. Reorder lives on the
    // adventure-detail page (drag handles on the puzzle cards) — this
    // strip is for navigating between puzzles in author mode, not for
    // restructuring the adventure. Standalone library puzzles have no
    // siblings and no strip — a small "In library" banner replaces it.
    const timeline = h('div', { class: 'puzzle-timeline' });
    if (standalone) {
      timeline.style.display = 'none';
    }
    const renderTimeline = () => {
      if (standalone) return;
      timeline.replaceChildren();
      const arrow = () => h('span', { class: 'pt-arrow', 'aria-hidden': 'true' }, '→');
      adv.pages.forEach((p, i) => {
        if (i > 0) timeline.append(arrow());
        const current = page && p.id === page.id;
        const titled = !!(p.title && p.title.trim());
        const cls = ['pt-pill'];
        if (current)    cls.push('current');
        if (p.disabled) cls.push('disabled');
        if (!titled)    cls.push('untitled');
        const pill = h('button', {
          class: cls.join(' '),
          type: 'button',
          title: (titled ? p.title : t('Puzzle {{i}} (untitled)', { i: i + 1 })) + (p.disabled ? t(' — disabled') : ''),
          on: { click: () => { if (!current) switchTo(p); } },
        }, h('span', { class: 'pt-label' }, titled ? p.title : t('Puzzle {{i}}', { i: i + 1 })));
        timeline.append(pill);
      });
      if (adv.pages.length > 0) timeline.append(arrow());
      if (creating) {
        timeline.append(h('span', { class: 'pt-pill current', title: t('This puzzle') }, t('New')));
      } else {
        timeline.append(h('button', {
          class: 'pt-pill pt-plus', type: 'button', title: t('New puzzle'),
          on: { click: () => switchTo(null) },
        }, '+'));
      }
    };

    renderTimeline();

    body.append(timeline);
    // Tiny banner above the preview card: which adventure the puzzle
    // belongs to, so an author editing a library puzzle never has to
    // guess where their edits will apply.
    if (!creating) {
      const assignLabel = standalone
        ? h('span', {}, t('📚 Library puzzle — not yet in any adventure'))
        : h('span', {}, t('In adventure '),
            h('strong', {}, adv.title || adv.slug),
            t(', position '), h('strong', {}, String((page.index ?? 0) + 1)));
      body.append(h('p', { class: 'muted', style: 'margin: .25rem 0 1rem; font-size:.9rem' }, assignLabel));
    }
    body.append(form);
    autosize(titleInput); autosize(notes);

    // Location editor (Leaflet). Wiring lives in renderPuzzleLocationMap
    // so the pile of marker/circle/handle state doesn't bleed into this
    // function.
    const locMap = renderPuzzleLocationMap({
      mapEl, gpsBtn, lat, lng, gated, radius,
      initial: { lat: initialLat, lng: initialLng },
      freshPuzzle: !page,
      // When a quick-puzzle GPS fix arrives before the author moves the
      // pin, silently persist it so bailing out without pressing Save
      // doesn't lose the location the tap was meant to capture.
      pendingGPS: pendingGPSMatch ? pendingGPSMatch.promise : null,
      onAutoLocation: async (coords) => {
        const r = await api(`/api/admin/pages/${page.id}`, {
          method: 'PATCH',
          body: JSON.stringify({
            title:    titleInput.value.trim(),
            prompt:   promptInput.value.trim(),
            hints:    hintsController.get(),
            notes:    notes.value.trim(),
            accept:   accept.get(),
            lat:      coords.lat,
            lng:      coords.lng,
            disabled: disabled.checked,
            ...(gated.checked ? { radius_m: parseFloat(radius.value) } : {}),
          }),
        });
        if (r.status === 204) {
          // Keep isDirty honest — the inputs now match the server.
          page.lat = coords.lat;
          page.lng = coords.lng;
        }
      },
    });
    // Resize the map once it's visible — Leaflet reads the container
    // size at init and otherwise picks up a 0×0 box.
    requestAnimationFrame(() => locMap.invalidate());

    // Clean up the parked file input + map on close, and — for library
    // puzzles only — tidy both the server stub and the URL.
    //
    //  * Abandoned-stub tidy-up: Quick/New puzzle lands on an empty
    //    library row; walking away without filling anything in
    //    deletes it so the library doesn't accumulate blanks.
    //
    //  * URL tidy-up: the library deep-link (#puzzles/<id>) stays
    //    pinned through the modal lifetime. On an unsaved close we
    //    move back to #puzzles so the URL matches what the user sees;
    //    otherwise a later reload — e.g. a language switch which
    //    goes through location.reload() — rehydrates the editor for
    //    a puzzle the user has already dismissed.
    //
    // Adventure puzzles use switchTo to swap between siblings and
    // live on #library/<slug>; they're skipped here so that flow
    // keeps working.
    body.addEventListener('modal:close', async () => {
      file.remove();
      locMap.destroy();
      // New-puzzle drafts: clear on a successful save, otherwise
      // capture a final snapshot — this is the path that catches
      // map-driven lat/lng updates which don't bubble an input event.
      if (draftKey) {
        if (saved) {
          try { localStorage.removeItem(draftKey); } catch { /* ignore */ }
        } else {
          writeDraft();
        }
      }
      if (!page || adv) return;
      const isEmpty =
        !titleInput.value.trim() &&
        !promptInput.value.trim() &&
        hintsController.get().length === 0 &&
        !notes.value.trim() &&
        accept.get().length === 0 &&
        (images.length === 0) &&
        (audios.length === 0) &&
        !gated.checked &&
        !disabled.checked;
      if (!saved && isEmpty) {
        await api(`/api/admin/pages/${page.id}`, { method: 'DELETE' });
      }
      if (!saved && location.hash === '#puzzles/' + page.id) {
        nav('#puzzles');
      }
    }, { once: true });
  }, { wide: true });
}

// renderPuzzleLocationMap wires a Leaflet map + marker + (optional)
// gated-radius circle + drag handle into the puzzle editor. Returns
// { invalidate, destroy } so the caller can force a resize after mount
// and tear everything down on close.
//
// Interactions wired in both directions:
//   marker drag / map click / GPS button → update lat, lng, circle
//   lat/lng input edits                  → move marker + circle
//   gated toggle                         → show/hide circle + handle
//   radius input edits                   → resize circle + reposition handle
//   radius handle drag                   → resize circle + update input
function renderPuzzleLocationMap(args) {
  const { mapEl, gpsBtn, lat, lng, gated, radius, initial, freshPuzzle } = args;

  // A new puzzle without a prior sibling starts at a city-level zoom so
  // the arranger can find themselves; an existing or cloned-from-sibling
  // puzzle zooms in close to the pin.
  const startZoom = freshPuzzle && initial.lat === 59.3293 ? 12 : 16;

  const map = L.map(mapEl, { scrollWheelZoom: true }).setView([initial.lat, initial.lng], startZoom);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 19,
  }).addTo(map);

  const marker = L.marker([initial.lat, initial.lng], { draggable: true }).addTo(map);
  let circle = null;
  let handle = null;

  // pushPinToInputs writes the marker's coords back into the form fields.
  // 6 decimals ≈ 11 cm — more than enough and round-trips cleanly.
  const pushPinToInputs = () => {
    const ll = marker.getLatLng();
    lat.value = ll.lat.toFixed(6);
    lng.value = ll.lng.toFixed(6);
  };

  // destination returns the lat/lng that's `metres` away from `center`
  // at the given bearing (degrees, 0 = north, 90 = east). Used to place
  // the radius-drag handle directly east of the marker.
  const destination = (center, metres, bearingDeg) => {
    const R = 6371000;
    const brng = bearingDeg * Math.PI / 180;
    const lat1 = center.lat * Math.PI / 180;
    const lng1 = center.lng * Math.PI / 180;
    const dr = metres / R;
    const lat2 = Math.asin(Math.sin(lat1) * Math.cos(dr) +
      Math.cos(lat1) * Math.sin(dr) * Math.cos(brng));
    const lng2 = lng1 + Math.atan2(
      Math.sin(brng) * Math.sin(dr) * Math.cos(lat1),
      Math.cos(dr) - Math.sin(lat1) * Math.sin(lat2),
    );
    return L.latLng(lat2 * 180 / Math.PI, lng2 * 180 / Math.PI);
  };

  const updateCircle = () => {
    const center = marker.getLatLng();
    if (gated.checked) {
      const r = Math.max(1, parseFloat(radius.value) || 50);
      if (!circle) {
        circle = L.circle(center, {
          radius: r, color: '#ad1357', weight: 2,
          fillColor: '#ad1357', fillOpacity: 0.12,
        }).addTo(map);
      } else {
        circle.setLatLng(center);
        circle.setRadius(r);
      }
      const handleLL = destination(center, r, 90);
      if (!handle) {
        handle = L.marker(handleLL, {
          draggable: true,
          icon: L.divIcon({
            className: '', // clear Leaflet's default
            html: '<div class="pe-radius-handle" title="Drag to resize">↔</div>',
            iconSize: [22, 22], iconAnchor: [11, 11],
          }),
        }).addTo(map);
        handle.on('drag', () => {
          const d = map.distance(marker.getLatLng(), handle.getLatLng());
          const meters = Math.max(1, Math.round(d));
          radius.value = meters;
          circle.setRadius(meters);
        });
      } else {
        handle.setLatLng(handleLL);
      }
    } else {
      if (circle) { map.removeLayer(circle); circle = null; }
      if (handle) { map.removeLayer(handle); handle = null; }
    }
  };

  marker.on('drag', () => {
    pushPinToInputs();
    if (circle) circle.setLatLng(marker.getLatLng());
    if (handle) {
      const r = Math.max(1, parseFloat(radius.value) || 50);
      handle.setLatLng(destination(marker.getLatLng(), r, 90));
    }
  });
  map.on('click', (e) => {
    marker.setLatLng(e.latlng);
    pushPinToInputs();
    updateCircle();
  });

  const syncFromInputs = () => {
    const la = parseFloat(lat.value), ln = parseFloat(lng.value);
    if (!Number.isFinite(la) || !Number.isFinite(ln)) return;
    marker.setLatLng([la, ln]);
    updateCircle();
  };
  lat.addEventListener('input', syncFromInputs);
  lng.addEventListener('input', syncFromInputs);
  gated.addEventListener('change', updateCircle);
  radius.addEventListener('input', updateCircle);

  gpsBtn.addEventListener('click', () => {
    if (!navigator.geolocation) { toastErr(t('Geolocation not available on this device')); return; }
    gpsBtn.disabled = true;
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        gpsBtn.disabled = false;
        const la = pos.coords.latitude, ln = pos.coords.longitude;
        lat.value = la.toFixed(6);
        lng.value = ln.toFixed(6);
        marker.setLatLng([la, ln]);
        map.setView([la, ln], 17);
        updateCircle();
      },
      (err) => { gpsBtn.disabled = false; toastErr(t('GPS failed: {{msg}}', { msg: err.message || t('unknown') })); },
      { enableHighAccuracy: true, maximumAge: 10000, timeout: 30000 },
    );
  });

  updateCircle();

  // Quick-puzzle's background GPS fix: apply it when it arrives, unless
  // the author has already set a location (dragged the pin, clicked the
  // map, typed in a coord, or hit the GPS button). Any of those signal
  // an intentional placement we shouldn't overwrite.
  let destroyed = false;
  if (args.pendingGPS) {
    let userTouched = false;
    const markTouched = () => { userTouched = true; };
    marker.on('dragstart', markTouched);
    map.on('click', markTouched);
    lat.addEventListener('input', markTouched);
    lng.addEventListener('input', markTouched);
    gpsBtn.addEventListener('click', markTouched);
    args.pendingGPS.then((coords) => {
      if (destroyed || userTouched || !coords) return;
      lat.value = coords.lat.toFixed(6);
      lng.value = coords.lng.toFixed(6);
      marker.setLatLng([coords.lat, coords.lng]);
      map.setView([coords.lat, coords.lng], 17);
      updateCircle();
      args.onAutoLocation?.(coords);
    });
  }

  return {
    invalidate: () => map.invalidateSize(),
    destroy:    () => { destroyed = true; map.remove(); },
  };
}

// addPuzzleButton renders a primary "Add puzzle" button with a small
// chevron that opens a popover with the "Copy from library…" option.
// The bulk of the authoring flow is blank-puzzle create, so the
// primary click does that; the library import is the secondary path.
function addPuzzleButton(adv) {
  const wrap = h('div', { class: 'split-btn' });
  const primary = h('button', { class: 'btn primary small' },
    icon(ICONS.plus), t('Add puzzle'));
  primary.addEventListener('click', () => openEditPuzzle(adv, null));
  const toggle = h('button', {
    class: 'btn primary small split-btn-toggle',
    'aria-label': t('More options'),
    title: t('More options'),
  }, '▾');
  const menu = h('div', { class: 'split-btn-menu', role: 'menu' });
  menu.append(
    h('button', { class: 'split-btn-item', role: 'menuitem' }, t('Copy from library…')),
  );
  const [libItem] = menu.querySelectorAll('.split-btn-item');
  libItem.addEventListener('click', () => {
    menu.classList.remove('open');
    openLibraryPicker(adv);
  });
  toggle.addEventListener('click', (e) => {
    e.stopPropagation();
    menu.classList.toggle('open');
  });
  // Close the menu on outside click / Escape.
  const onDocClick = (e) => { if (!wrap.contains(e.target)) menu.classList.remove('open'); };
  const onKey = (e) => { if (e.key === 'Escape') menu.classList.remove('open'); };
  document.addEventListener('click', onDocClick);
  document.addEventListener('keydown', onKey);
  // If the button tree is later removed from the DOM (navigation), drop
  // the listeners. Using MutationObserver is overkill; just attach a
  // one-shot cleanup via the view's replaceChildren cycle.
  wrap.append(primary, toggle, menu);
  return wrap;
}

// openLibraryPicker lets the author attach a puzzle to this adventure
// by deep-copying one out of the library (which here means every
// puzzle in the system — the server handles the copy). Library puzzles
// are offered first; already-assigned puzzles follow so the author can
// duplicate a puzzle across adventures if they want.
async function openLibraryPicker(adv) {
  await modal(t('Pick a puzzle from the library'), async ({ body, close }) => {
    body.append(h('p', { class: 'muted' }, t('Loading puzzles…')));
    const r = await api('/api/admin/puzzles');
    body.replaceChildren();
    if (!r.ok) { body.append(h('p', { class: 'err' }, r.body?.error || t('load failed'))); return; }
    const puzzles = (r.body?.puzzles || []).slice();
    // Put library puzzles first so the common case is discoverable at
    // a glance; attached puzzles follow for copy-across-adventures.
    puzzles.sort((a, b) => (!!a.adventure_slug) - (!!b.adventure_slug));
    if (puzzles.length === 0) {
      body.append(h('p', {}, t('No puzzles in the library yet.')));
      body.append(h('div', { class: 'row end' },
        h('button', { class: 'btn', on: { click: () => close(null) } }, t('Close'))));
      return;
    }
    // Filter input — case-insensitive search over title, notes, prompt
    // and the source adventure's slug. Kept simple: re-renders the
    // entire list on keystroke, the N is small.
    const search = h('input', {
      placeholder: t('Filter by title, notes or adventure'),
      autofocus: true,
      style: 'margin-bottom:.75rem',
    });
    const list = h('div', { style: 'display:grid; gap:.5rem; max-height:55vh; overflow-y:auto; padding-right:.25rem' });

    const renderList = () => {
      list.replaceChildren();
      const q = search.value.trim().toLowerCase();
      const matches = !q ? puzzles : puzzles.filter((p) => {
        const hay = [p.title, p.notes, p.prompt, p.adventure_slug, p.adventure_title]
          .filter(Boolean).join(' ').toLowerCase();
        return hay.includes(q);
      });
      if (matches.length === 0) {
        list.append(h('p', { class: 'muted' }, t('No matches.')));
        return;
      }
      for (const p of matches) {
        const label = p.adventure_slug
          ? h('span', { class: 'pill', style: 'margin-left:.5rem' },
              t('in {{title}} · #{{n}}', { title: p.adventure_title, n: (p.adventure_idx ?? 0) + 1 }))
          : h('span', { class: 'pill accent', style: 'margin-left:.5rem' }, t('library'));
        const card = h('div', { class: 'card clickable', style: 'padding:.6rem .9rem; margin:0' },
          h('div', { class: 'row between' },
            h('strong', {}, p.title || t('(untitled)')),
            label),
          p.notes || p.prompt ? h('p', { class: 'muted', style: 'margin:.25rem 0 0; font-size:.85rem; white-space:pre-wrap; overflow:hidden; max-height:2.4em' },
            p.notes || p.prompt) : null,
          h('p', { class: 'muted mono', style: 'margin:.25rem 0 0; font-size:.75rem' },
            `${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}`));
        card.addEventListener('click', async () => {
          const rr = await api(`/api/admin/adventures/${encodeURIComponent(adv.slug)}/pages/copy-from/${p.id}`,
            { method: 'POST' });
          if (rr.status === 201) {
            toastOk(t('Puzzle copied into adventure'));
            close(true);
            renderRoute();
          } else {
            toastErr(rr.body?.error || t('error {{status}}', { status: rr.status }));
          }
        });
        list.append(card);
      }
    };
    search.addEventListener('input', renderList);
    renderList();

    body.append(search, list);
    body.append(h('div', { class: 'row end', style: 'margin-top:1rem' },
      h('button', { class: 'btn', on: { click: () => close(null) } }, t('Cancel'))));
  }, { wide: true });
}

// duplicatePuzzle clones one puzzle in place and reloads the editor
// so the new card appears immediately. Brief highlight pulse on the
// new card to point the author at it; without that the duplicate
// can disappear into a long scrollable list.
async function duplicatePuzzle(adv, page) {
  const r = await api(`/api/admin/pages/${page.id}/duplicate`, {
    method: 'POST',
    body: JSON.stringify({}),
  });
  if (r.status !== 201 || !r.body?.id) {
    toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
    return;
  }
  const newID = r.body.id;
  await renderRoute();
  // After the re-render the new card carries data-page-id; locate
  // it, scroll into view, and pulse a brief outline so the author
  // immediately sees where the duplicate landed.
  requestAnimationFrame(() => {
    const el = document.querySelector(`[data-page-id="${newID}"]`);
    if (!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.add('puzzle-duplicated');
    setTimeout(() => el.classList.remove('puzzle-duplicated'), 1400);
  });
  toastOk(t('Puzzle duplicated'));
}

/* ========== Race simulator (admin only) ==========
   Drives a fake race inside the server so the live view can be
   exercised without real players on the ground. The heavy lifting
   (team movement, answer rolls, pings) happens server-side in the
   simulator package — this surface is just a control panel:
   pick an adventure + team count + speed, press Play, watch.
   Status polls every 1.5s so the state pill stays in sync with the
   server's own Pause/Resume/Reset. */
// mountSimulatorPanel renders the per-adventure simulator surface
// into `host`. The simulator state is org-scoped server-side (only
// one sim active per org at a time), so when an org-mate has a sim
// running on a different adventure we render a redirect notice with
// a link to that adventure's detail page rather than a contradictory
// second control set. Polling stops automatically when `host` is
// removed from the DOM (route change / re-render), so callers don't
// need to manage a teardown hook.
async function mountSimulatorPanel(host, advSlug) {
  const r = await api('/api/admin/simulator');
  if (!r.ok) {
    host.replaceChildren(h('p', { class: 'err' },
      r.body?.error || t('Could not load simulator state.')));
    return;
  }
  const status = r.body || { stage: 'idle' };
  const busyElsewhere = status.stage !== 'idle'
    && status.adventure_slug
    && status.adventure_slug !== advSlug;

  if (busyElsewhere) {
    // Look up the running adventure's title so the redirect link
    // reads as "open <other adventure>" rather than a slug.
    const advR = await api('/api/admin/adventures');
    const advs = advR.body?.adventures || [];
    const other = advs.find((a) => a.slug === status.adventure_slug);
    const otherTitle = other?.title || status.adventure_slug;
    host.replaceChildren(
      h('div', { class: 'row between', style: 'gap:.5rem' },
        h('h2', { style: 'margin:0' }, t('Simulator')),
        h('span', { class: `pill ${stagePillClass(status.stage)}` },
          t(stageLabel(status.stage)))),
      h('p', { class: 'muted', style: 'margin:.25rem 0 .5rem' },
        t('A simulation is already running on another adventure. Reset it from there to start one here.')),
      h('div', { class: 'row', style: 'gap:.5rem; align-items:center' },
        h('strong', { style: 'flex:1; min-width:0' }, otherTitle),
        h('a', {
          href: '#adventures/' + encodeURIComponent(status.adventure_slug),
          class: 'btn small',
          on: { click: (e) => {
            e.preventDefault();
            nav('#adventures/' + encodeURIComponent(status.adventure_slug));
          } },
        }, t('Open simulator'))),
    );
    schedulePoll(host, advSlug, status);
    return;
  }

  // On-this-adventure (or idle) path: full controls.
  const stagePill = h('span', { class: `pill ${stagePillClass(status.stage)}` },
    t(stageLabel(status.stage)));
  const elapsed = h('span', { class: 'muted mono', style: 'font-size:.85rem' },
    (status.stage !== 'idle' && status.started_at)
      ? t('Live for {{t}}', { t: fmtElapsed(status.started_at) })
      : '');
  const liveSlot = h('span');
  const setLiveLink = (token) => {
    liveSlot.replaceChildren();
    if (token) {
      liveSlot.append(h('a', {
        href: `/live/${encodeURIComponent(token)}`,
        target: '_blank', rel: 'noopener',
        class: 'btn primary small',
      }, icon(ICONS.eye), t('Open live view')));
    }
  };
  setLiveLink(status.live_token);

  const teamInput = h('input', { type: 'number', min: '2', max: '20',
    value: String(status.team_count || 6) });
  const speedInput = h('input', { type: 'number', min: '1', max: '50', step: '1',
    value: String(status.speed_mul || 5) });

  const startBtn = h('button', {
    class: 'btn primary', type: 'button',
    on: { click: () => simulatorAction('start', {
      adventure_slug: advSlug,
      team_count: parseInt(teamInput.value, 10) || 6,
      speed_mul: parseFloat(speedInput.value) || 5,
    }, host, advSlug) },
  }, icon(ICONS.play), t('Start'));
  const pauseBtn = h('button', { class: 'btn', type: 'button',
    on: { click: () => simulatorAction('pause', null, host, advSlug) } }, t('Pause'));
  const resumeBtn = h('button', { class: 'btn', type: 'button',
    on: { click: () => simulatorAction('resume', null, host, advSlug) } }, t('Resume'));
  const resetBtn = h('button', { class: 'btn danger', type: 'button',
    on: { click: () => simulatorAction('reset', null, host, advSlug) } },
    icon(ICONS.trash), t('Reset'));

  // applyStage patches the dynamic bits of the view for a given
  // status without rebuilding the DOM — survives transient fetch
  // errors and keeps the user's typing in the number inputs intact.
  const applyStage = (st) => {
    const stage = st?.stage || 'idle';
    stagePill.className = 'pill ' + stagePillClass(stage);
    stagePill.textContent = t(stageLabel(stage));
    elapsed.textContent = (stage !== 'idle' && st?.started_at)
      ? t('Live for {{t}}', { t: fmtElapsed(st.started_at) })
      : '';
    setLiveLink(st?.live_token);
    const idle = stage === 'idle';
    const paused = stage === 'paused';
    const running = stage === 'running';
    [teamInput, speedInput].forEach((el) => { el.disabled = !idle; });
    startBtn.disabled = !idle;
    pauseBtn.disabled = !running;
    resumeBtn.disabled = !paused;
    resetBtn.disabled = idle;
  };
  applyStage(status);

  host.replaceChildren(
    h('div', { class: 'row between', style: 'gap:.5rem' },
      h('h2', { style: 'margin:0' }, t('Simulator')),
      h('div', { class: 'row', style: 'gap:.5rem; align-items:center' },
        stagePill, elapsed, liveSlot)),
    h('p', { class: 'muted', style: 'margin:.25rem 0 .75rem' },
      t('Preview pacing and the live view with pretend teams — no real players needed.')),
    h('div', { class: 'row', style: 'gap:.75rem; flex-wrap:wrap; align-items:flex-end' },
      h('label', { class: 'field', style: 'flex:1 1 8rem; margin:0' },
        h('span', {}, t('Teams (2–20)')), teamInput),
      h('label', { class: 'field', style: 'flex:1 1 12rem; margin:0' },
        h('span', {}, t('Speed multiplier (1–50)')), speedInput),
      startBtn, pauseBtn, resumeBtn, resetBtn),
  );
  schedulePoll(host, advSlug, status, applyStage);
}

// schedulePoll runs the 1.5s simulator-status loop scoped to a single
// host element. Stops on three triggers: the host gets removed from
// the DOM (route change), the running adventure flips (we re-mount
// to switch between busy-elsewhere and full-controls layouts), or
// the stage transitions to/from idle (same reason).
function schedulePoll(host, advSlug, prevStatus, applyStage) {
  if (simulatorPollTimer) clearInterval(simulatorPollTimer);
  simulatorPollTimer = setInterval(async () => {
    if (!document.contains(host)) {
      clearInterval(simulatorPollTimer); simulatorPollTimer = null; return;
    }
    try {
      const r = await api('/api/admin/simulator');
      if (!r.ok) return;
      const next = r.body || { stage: 'idle' };
      const stageChanged = (next.stage || 'idle') !== (prevStatus.stage || 'idle');
      const advChanged = (next.adventure_slug || '') !== (prevStatus.adventure_slug || '');
      if (stageChanged || advChanged) {
        clearInterval(simulatorPollTimer); simulatorPollTimer = null;
        mountSimulatorPanel(host, advSlug);
        return;
      }
      if (applyStage) applyStage(next);
    } catch { /* server restart or offline — next tick will catch up */ }
  }, 1500);
}

// simulatorAction posts a control command. Re-mounts only the
// simulator panel on success so inputs snap to the new server state
// without touching the rest of the page (which would reset scroll).
async function simulatorAction(kind, body, host, advSlug) {
  let r;
  try {
    r = await api('/api/admin/simulator/' + kind, {
      method: 'POST',
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch {
    toastErr(t('Network error — is the server running?'));
    return;
  }
  if (!r.ok) {
    toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
    return;
  }
  if (kind === 'start') toastOk(t('Simulation started'));
  if (kind === 'reset') toastOk(t('Simulation reset'));
  if (host && document.contains(host)) {
    mountSimulatorPanel(host, advSlug);
  } else {
    renderRoute();
  }
}

let simulatorPollTimer = null;

function stageLabel(stage) {
  switch (stage) {
    case 'running': return 'Running';
    case 'paused':  return 'Paused';
    default:        return 'Idle';
  }
}

function stagePillClass(stage) {
  switch (stage) {
    case 'running': return 'success';
    case 'paused':  return 'warning';
    default:        return '';
  }
}

function fmtElapsed(startISO) {
  const start = new Date(startISO);
  const sec = Math.max(0, Math.round((Date.now() - start.getTime()) / 1000));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const pad = (n) => String(n).padStart(2, '0');
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}

/* ========== Server logs (admin only) ==========
   xterm.js renders the stream, the server hands out each new Entry via
   /ws/logs, and a small control row lets the admin pick a minimum
   level + substring filter. Filter is client-side; level change hits
   the server so dropped entries never enter the ring buffer. */
async function viewLogs(view) {
  // xterm may not be ready yet if the defer scripts are still loading —
  // bail out with a polite retry.
  if (typeof Terminal === 'undefined') {
    view.replaceChildren(h('p', { class: 'muted' }, t('Loading terminal…')));
    setTimeout(() => { if (location.hash.startsWith('#logs')) viewLogs(view); }, 200);
    return;
  }

  const levels = ['DEBUG', 'INFO', 'WARN', 'ERROR'];
  // State shared between the control row and the WS listener.
  //
  // buffer keeps every entry the client has seen (snapshot + live),
  // bounded so long-running sessions don't blow up memory. passes(e)
  // is the filter+level predicate; repaintAll() clears the terminal
  // and replays the buffer through passes() — so changing the filter
  // or the client-level dropdown reapplies retroactively to the lines
  // already on screen, not just to new incoming entries.
  const state = {
    filter: '',
    minLevel: 'DEBUG',  // client-side floor; the server has its own
    paused: false,
    ws: null,
    lastSeq: 0,
  };
  const MAX_BUFFER = 5000;
  const buffer = [];

  const passes = (e) => {
    if (levelRank(e.level) < levelRank(state.minLevel)) return false;
    if (state.filter && !entryMatches(e, state.filter)) return false;
    return true;
  };
  const repaintAll = () => {
    term.reset();
    for (const e of buffer) if (passes(e)) writeEntry(term, e);
  };

  // Controls ----------------------------------------------------------
  const filterInput = h('input', {
    type: 'search', placeholder: t('Filter (substring)'),
    style: 'flex:1; min-width:10rem; box-shadow:none; border-color:var(--border-soft); margin:0',
  });
  // The audit view drops a one-shot HH:MM filter into sessionStorage so
  // a "view logs around this time" cross-link arrives pre-filtered.
  // Consume + clear on entry so navigating back here later doesn't
  // re-apply a stale filter.
  try {
    const pf = sessionStorage.getItem('zv_logs_prefilter');
    if (pf) {
      sessionStorage.removeItem('zv_logs_prefilter');
      filterInput.value = pf;
      state.filter = pf.toLowerCase();
    }
  } catch { /* ignore */ }
  filterInput.addEventListener('input', () => {
    state.filter = filterInput.value.toLowerCase();
    repaintAll();
  });

  const serverLevelSel = h('select', { class: 'zv-log-sel', title: t('Server log level') });
  for (const l of levels) {
    const opt = document.createElement('option');
    opt.value = l; opt.textContent = l;
    serverLevelSel.append(opt);
  }
  serverLevelSel.addEventListener('change', async () => {
    const rr = await api('/api/admin/logs/level', {
      method: 'PUT', body: JSON.stringify({ level: serverLevelSel.value }),
    });
    if (!rr.ok) toastErr(rr.body?.error || t('error {{status}}', { status: rr.status }));
  });

  const clientLevelSel = h('select', { class: 'zv-log-sel', title: t('Client-side minimum level') });
  for (const l of levels) {
    const opt = document.createElement('option');
    opt.value = l; opt.textContent = l;
    clientLevelSel.append(opt);
  }
  clientLevelSel.addEventListener('change', () => {
    state.minLevel = clientLevelSel.value;
    repaintAll();
  });

  const pauseBtn = h('button', { class: 'btn small', type: 'button' }, t('Pause'));
  pauseBtn.addEventListener('click', () => {
    state.paused = !state.paused;
    pauseBtn.textContent = state.paused ? t('Resume') : t('Pause');
  });
  const clearBtn = h('button', { class: 'btn small', type: 'button' }, t('Clear'));

  const controls = h('div', { class: 'row', style: 'gap:.5rem; flex-wrap:wrap; margin-bottom:.5rem; align-items:center' },
    h('span', { class: 'muted', style: 'font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; font-weight:700' },
      t('Server level')),
    serverLevelSel,
    h('span', { class: 'muted', style: 'font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; font-weight:700' },
      t('Show')),
    clientLevelSel,
    filterInput, pauseBtn, clearBtn,
  );

  // Terminal ---------------------------------------------------------
  const termHost = h('div', { class: 'zv-log-term' });
  const term = new Terminal({
    convertEol: true,
    scrollback: 5000,
    fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace',
    fontSize: 13,
    theme: {
      background: '#0e1420',
      foreground: '#d7dee8',
      cursor: '#1f3349',
      cursorAccent: '#0e1420',
    },
  });
  // Fit addon may not be loaded if the CDN is down — guard the call.
  let fit = null;
  if (typeof FitAddon !== 'undefined' && FitAddon.FitAddon) {
    fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
  }

  clearBtn.addEventListener('click', () => {
    // Drop the buffer too so the next repaint doesn't resurrect the
    // cleared output. New live entries will stream in fresh.
    buffer.length = 0;
    term.reset();
  });

  view.replaceChildren(h('h1', {}, t('Logs')), controls, termHost);

  // Mount + size. xterm wants a non-zero container at open.
  term.open(termHost);
  requestAnimationFrame(() => { try { fit && fit.fit(); } catch {} });
  const onResize = () => { try { fit && fit.fit(); } catch {} };
  window.addEventListener('resize', onResize);

  // ingest appends to the client buffer (bounded), and paints live
  // when (a) not paused and (b) the entry passes the filter+level
  // predicate. When the filter changes, repaintAll() replays buffer
  // through passes() so the already-rendered lines re-align with the
  // new filter.
  const ingest = (e) => {
    buffer.push(e);
    if (buffer.length > MAX_BUFFER) buffer.splice(0, buffer.length - MAX_BUFFER);
    state.lastSeq = Math.max(state.lastSeq, e.seq || 0);
    if (state.paused) return;
    if (passes(e)) writeEntry(term, e);
  };

  // Initial snapshot + live stream --------------------------------
  const initial = await api('/api/admin/logs');
  const serverLevel = initial.body?.level || 'INFO';
  serverLevelSel.value = serverLevel;
  clientLevelSel.value = 'DEBUG';
  for (const e of (initial.body?.entries || [])) ingest(e);

  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const sock = new WebSocket(`${proto}//${location.host}/ws/logs`);
  state.ws = sock;
  sock.onmessage = (ev) => {
    let msg; try { msg = JSON.parse(ev.data); } catch { return; }
    if (!msg || msg.kind !== 'entry') return;
    const e = msg.data;
    if (!e) return;
    ingest(e);
  };

  // Tear down when the route changes so we don't keep WS open.
  const cleanup = () => {
    window.removeEventListener('resize', onResize);
    try { sock.close(); } catch {}
    try { term.dispose(); } catch {}
    window.removeEventListener('hashchange', onHash);
  };
  const onHash = () => {
    if (!location.hash.startsWith('#logs')) cleanup();
  };
  window.addEventListener('hashchange', onHash);
}

/* ========== Audit log (admin + org_admin) ==========
   Reads /api/admin/auth-events with a paginated cursor (before_id).
   Server-side scoping: admins see every row, org_admins see only their
   org's users. The view stays a plain table — this is a forensics
   surface, not a dashboard, so density beats prettiness. */
async function viewAudit(view) {
  const PAGE = 100;
  let oldestID = 0; // 0 = no cursor; means "newest page"

  const tbody = h('tbody', {});
  const moreBtn = h('button', { class: 'btn', on: { click: loadMore } }, t('Load more'));
  const status = h('span', { class: 'muted' });

  // Filter inputs. The event-kind options match the constants in
  // internal/auth/audit.go — admins only land here when investigating
  // a specific incident, so a fixed list is more honest than typing.
  const eventSel = h('select', { class: 'select' },
    h('option', { value: '' }, t('All events')),
    h('option', { value: 'login' }, t('login')),
    h('option', { value: 'logout' }, t('logout')),
    h('option', { value: 'set_password' }, t('set_password')),
    h('option', { value: 'magic_link' }, t('magic_link')),
    h('option', { value: 'email_verify' }, t('email_verify')));
  const okSel = h('select', { class: 'select' },
    h('option', { value: '' }, t('OK or fail')),
    h('option', { value: '1' }, t('OK only')),
    h('option', { value: '0' }, t('Fail only')));
  const userInp = h('input', { type: 'text', placeholder: t('substring'), style: 'min-width:8rem' });
  const ipInp   = h('input', { type: 'text', placeholder: t('substring'), style: 'min-width:8rem' });
  const applyBtn = h('button', { class: 'btn primary small' }, t('Apply'));
  const clearBtn = h('button', { class: 'btn small' }, t('Clear'));

  const filters = h('div', { class: 'card', style: 'margin:.5rem 0' },
    h('div', { class: 'row', style: 'gap:.5rem; flex-wrap:wrap; align-items:flex-end' },
      h('label', { class: 'field' }, h('span', {}, t('Event')), eventSel),
      h('label', { class: 'field' }, h('span', {}, t('Result')), okSel),
      h('label', { class: 'field' }, h('span', {}, t('User')), userInp),
      h('label', { class: 'field' }, h('span', {}, t('IP')), ipInp),
      h('div', { class: 'row', style: 'gap:.4rem' }, applyBtn, clearBtn)));

  const table = h('table', { class: 'audit-table' },
    h('thead', {},
      h('tr', {},
        h('th', {}, t('Time')),
        h('th', {}, t('Event')),
        h('th', {}, t('Result')),
        h('th', {}, t('User')),
        h('th', {}, t('IP')),
        h('th', {}, t('Reason')))),
    tbody);

  view.replaceChildren(
    h('h1', {}, t('Audit')),
    h('p', { class: 'muted' },
      t('Login, set-password, magic-link and logout events. Newest first.')),
    filters,
    table,
    h('div', { class: 'row', style: 'gap:.75rem; align-items:center; margin-top:.6rem;' }, moreBtn, status),
  );

  function reload() {
    oldestID = 0;
    tbody.replaceChildren();
    moreBtn.hidden = false;
    loadMore();
  }
  applyBtn.addEventListener('click', reload);
  clearBtn.addEventListener('click', () => {
    eventSel.value = ''; okSel.value = ''; userInp.value = ''; ipInp.value = '';
    reload();
  });
  // Pressing Enter inside a filter input applies — saves a click in
  // the common case where the admin is typing a username and hits ↵.
  for (const el of [userInp, ipInp]) {
    el.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); reload(); } });
  }

  await loadMore();

  async function loadMore() {
    moreBtn.disabled = true;
    status.textContent = t('Loading…');
    try {
      const qs = new URLSearchParams({ limit: String(PAGE) });
      if (oldestID > 0) qs.set('before_id', String(oldestID));
      if (eventSel.value) qs.set('event', eventSel.value);
      if (okSel.value)    qs.set('ok', okSel.value);
      if (userInp.value.trim()) qs.set('username', userInp.value.trim());
      if (ipInp.value.trim())   qs.set('ip', ipInp.value.trim());
      const r = await api('/api/admin/auth-events?' + qs.toString());
      const events = r.body?.events || [];
      for (const e of events) {
        tbody.appendChild(renderAuditRow(e));
      }
      if (events.length > 0) oldestID = events[events.length - 1].id;
      if (events.length < PAGE) {
        moreBtn.hidden = true;
        status.textContent = events.length === 0 && tbody.children.length === 0
          ? t('No events match.')
          : t('End of log.');
      } else {
        status.textContent = '';
      }
    } catch (err) {
      status.textContent = t('Something went wrong: {{err}}', { err: String(err) });
    } finally {
      moreBtn.disabled = false;
    }
  }
}

function renderAuditRow(e) {
  const okClass = e.ok ? 'audit-ok' : 'audit-fail';
  const okLabel = e.ok ? t('ok') : t('fail');
  const ts = formatAuditTS(e.ts);
  const username = e.username || (e.user_id ? '#' + e.user_id : '—');
  // Cross-link to server logs: tapping the timestamp pre-fills the
  // logs-view filter with a substring drawn from this event's clock
  // time (HH:MM), so the admin lands on the same window of activity
  // without manually copy-pasting. Admin-only — org_admins don't see
  // the logs view at all.
  const tsCell = h('td', { class: 'mono' }, ts);
  if (state.me && state.me.role === 'admin') {
    const m = /T(\d{2}:\d{2})/.exec(e.ts || '');
    if (m) {
      tsCell.style.cursor = 'pointer';
      tsCell.title = t('Open server logs around this time');
      tsCell.addEventListener('click', () => {
        try { sessionStorage.setItem('zv_logs_prefilter', m[1]); } catch { /* ignore */ }
        nav('#logs');
      });
    }
  }
  // Inline details button — `title` tooltips work on desktop hover but
  // are completely invisible on touch devices. Replacing the implicit
  // hover with an explicit affordance gives admins the full UA + reason
  // + IP without copy-pasting from `view source`.
  const detailsBtn = h('button', {
    type: 'button',
    class: 'btn small ghost',
    style: 'padding:.15rem .55rem; font-size:.75rem; line-height:1',
    title: t('Show details'),
    on: { click: () => showAuditDetailsModal(e) },
  }, t('Details'));
  return h('tr', {},
    tsCell,
    h('td', {}, e.event),
    h('td', {}, h('span', { class: 'audit-pill ' + okClass }, okLabel)),
    h('td', {}, username),
    h('td', { class: 'mono' }, e.ip || '—'),
    h('td', { class: 'muted' }, h('div', {
      class: 'row', style: 'gap:.5rem; align-items:center; justify-content:space-between',
    }, h('span', {}, e.reason || ''), detailsBtn)));
}

function showAuditDetailsModal(e) {
  modal(t('Audit event #{{id}}', { id: e.id }), ({ body, close }) => {
    const dl = h('dl', { class: 'audit-details' });
    const row = (label, val) => {
      dl.append(h('dt', {}, label), h('dd', {}, val || '—'));
    };
    row(t('Time'),       formatAuditTS(e.ts));
    row(t('Event'),      e.event);
    row(t('Result'),     e.ok ? t('ok') : t('fail'));
    row(t('User'),       e.username || (e.user_id ? '#' + e.user_id : '—'));
    row(t('IP'),         e.ip || '');
    row(t('Reason'),     e.reason || '');
    row(t('User-Agent'), e.user_agent || '');
    body.append(dl,
      h('div', { class: 'row end', style: 'margin-top:.75rem' },
        h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, t('Close'))));
  });
}

/* ========== Webhooks ==========
   Per-org outbound webhook endpoints. The arranger configures a URL
   they own (Slack-bot, Zapier hook, internal dashboard), picks which
   event kinds they want, and the worker fires HMAC-signed POSTs at
   them as runs/teams/purchases progress. The secret is shown once
   on create/rotate; thereafter only an 8-char hint is visible.
*/

async function viewWebhooks(view) {
  const [endpointsR, kindsR] = await Promise.all([
    api('/api/admin/webhooks'),
    api('/api/admin/webhook-event-kinds'),
  ]);
  if (!endpointsR.ok) {
    view.replaceChildren(h('p', { class: 'err' },
      t('Could not load webhooks ({{status}}).', { status: endpointsR.status })));
    return;
  }
  const endpoints = endpointsR.body?.endpoints || [];
  const kinds = kindsR.body?.event_kinds || [];

  const addBtn = h('button', { class: 'btn primary', type: 'button' },
    icon(ICONS.plus), t('Add endpoint'));
  addBtn.addEventListener('click', async () => {
    const created = await openWebhookForm({ kinds });
    if (created) viewWebhooks(view); // reload
  });

  const cards = endpoints.length
    ? endpoints.map((ep) => renderWebhookCard(ep, kinds, () => viewWebhooks(view)))
    : [renderWebhookEmpty(addBtn)];

  view.replaceChildren(
    h('div', { class: 'row', style: 'align-items:center; justify-content:space-between' },
      h('h1', {}, t('Webhooks')),
      endpoints.length ? addBtn : null,
    ),
    h('p', { class: 'muted' },
      t('Outbound HTTP callbacks for run / team / purchase lifecycle. Each delivery is signed with HMAC-SHA256; verify the X-Zv-Signature header against your endpoint\'s secret.')),
    ...cards,
  );
}

function renderWebhookEmpty(addBtn) {
  return h('div', { class: 'card', style: 'text-align:center; padding:2rem' },
    h('p', { class: 'muted', style: 'margin-bottom:1rem' },
      t('No webhook endpoints yet. Add one to receive lifecycle events on a URL you control.')),
    addBtn,
  );
}

function renderWebhookCard(ep, kinds, reload) {
  const statusBadge = h('span', {
    class: 'chip ' + (ep.active ? 'ok' : ''),
    style: ep.active ? '' : 'opacity:.6',
  }, ep.active ? t('Active') : t('Disabled'));

  const kindChips = (ep.event_kinds || []).map((k) =>
    h('span', { class: 'chip', style: 'font-family:monospace; font-size:.78rem' }, k));

  const editBtn = iconBtn('pencil', t('Edit'), async () => {
    const updated = await openWebhookForm({ kinds, existing: ep });
    if (updated) reload();
  });
  const testBtn = h('button', { class: 'btn small', type: 'button', title: t('Send test event') },
    icon(ICONS.fastForward), t('Send test'));
  testBtn.addEventListener('click', async () => {
    if (!ep.active) {
      toastErr(t('Re-enable the endpoint first.'));
      return;
    }
    testBtn.disabled = true;
    try {
      const r = await api(`/api/admin/webhooks/${ep.id}/test`, { method: 'POST' });
      if (r.status === 202) {
        toastOk(t('Test queued. Watch your endpoint logs (delivery within ~5s).'));
      } else {
        toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
      }
    } finally {
      testBtn.disabled = false;
    }
  });
  const rotateBtn = h('button', { class: 'btn small', type: 'button',
    title: t('Mint a new secret. The old one stops working immediately.') },
    icon(ICONS.key), t('Rotate secret'));
  rotateBtn.addEventListener('click', async () => {
    const ok = await confirmDanger(
      t('Rotate secret?'),
      t('This invalidates the current secret immediately. Deploy the new secret to your verifier first if you want zero downtime.'));
    if (!ok) return;
    const r = await api(`/api/admin/webhooks/${ep.id}/rotate-secret`, { method: 'POST' });
    if (r.ok && r.body?.secret) {
      await openSecretReveal({ secret: r.body.secret, title: t('New webhook secret') });
      reload();
    } else {
      toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
    }
  });
  const logBtn = h('button', { class: 'btn small', type: 'button',
    title: t('Inspect this endpoint\'s delivery history') },
    icon(ICONS.terminal), t('Delivery log'));
  logBtn.addEventListener('click', () => nav('#webhooks/log/' + ep.id));
  const toggleBtn = h('button', { class: 'btn small', type: 'button' },
    ep.active ? t('Disable') : t('Enable'));
  toggleBtn.addEventListener('click', async () => {
    const r = await api(`/api/admin/webhooks/${ep.id}`, {
      method: 'PATCH',
      body: JSON.stringify({ active: !ep.active }),
    });
    if (r.status === 204) {
      toastOk(ep.active ? t('Endpoint disabled.') : t('Endpoint enabled.'));
      reload();
    } else {
      toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
    }
  });
  const deleteBtn = iconBtn('trash', t('Delete endpoint'), async () => {
    const ok = await confirmDanger(
      t('Delete endpoint?'),
      t('This stops all future deliveries to this URL. Past deliveries are removed too. Cannot be undone.'));
    if (!ok) return;
    const r = await api(`/api/admin/webhooks/${ep.id}`, { method: 'DELETE' });
    if (r.status === 204) {
      toastOk(t('Endpoint deleted.'));
      reload();
    } else {
      toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
    }
  }, { danger: true });

  return h('div', { class: 'card' },
    h('div', { class: 'row', style: 'align-items:center; justify-content:space-between; gap:.5rem; flex-wrap:wrap' },
      h('div', {},
        h('h2', { style: 'margin:0' }, ep.name || t('(unnamed endpoint)'))),
      h('div', { class: 'row', style: 'gap:.4rem; flex-wrap:wrap' },
        statusBadge, editBtn, deleteBtn),
    ),
    h('p', { class: 'muted', style: 'margin:.5rem 0; font-family:monospace; word-break:break-all' }, ep.url),
    kindChips.length
      ? h('div', { class: 'row', style: 'gap:.3rem; flex-wrap:wrap; margin:.5rem 0' }, ...kindChips)
      : h('p', { class: 'muted', style: 'font-size:.85rem' }, t('(no events subscribed)')),
    h('p', { class: 'muted', style: 'font-size:.8rem; margin:.5rem 0' },
      t('Secret hint: '),
      h('span', { style: 'font-family:monospace' }, (ep.secret_hint || '') + '…'),
      ' · ',
      t('Created {{date}}', { date: ep.created_at })),
    h('div', { class: 'row', style: 'gap:.4rem; flex-wrap:wrap; margin-top:.75rem' },
      testBtn, logBtn, rotateBtn, toggleBtn),
  );
}

// openWebhookForm is the shared modal used for both create and edit.
// Returns truthy on save, null on cancel.
async function openWebhookForm({ kinds, existing }) {
  const isEdit = !!existing;
  return modal(isEdit ? t('Edit webhook') : t('Add webhook'), ({ body, close, setBeforeClose }) => {
    const nameInput = h('input', { type: 'text', value: existing?.name || '',
      placeholder: t('e.g. prod-slack') });
    const urlInput = h('input', { type: 'url', required: true,
      value: existing?.url || '', placeholder: 'https://example.com/webhook' });

    const subscribed = new Set(existing?.event_kinds || []);
    const checks = kinds.map((k) => {
      const cb = h('input', { type: 'checkbox', value: k, checked: subscribed.has(k) });
      return h('label', {
        class: 'row',
        style: 'gap:.5rem; align-items:center; padding:.25rem 0; cursor:pointer',
      }, cb, h('code', { style: 'font-size:.85rem' }, k));
    });

    const err = h('p', { class: 'err', style: 'display:none' });
    const form = h('form', {},
      h('label', { class: 'field' }, h('span', {}, t('Name')), nameInput),
      h('label', { class: 'field' }, h('span', {}, t('Endpoint URL')), urlInput),
      h('p', { class: 'muted', style: 'font-size:.8rem; margin:.25rem 0 .5rem' },
        t('Must be https. Localhost is allowed for development.')),
      h('div', { class: 'field' },
        h('span', {}, t('Subscribed events')),
        h('div', {}, ...checks)),
      err,
      h('div', { class: 'row end', style: 'gap:.5rem; margin-top:1rem' },
        h('button', { class: 'btn', type: 'button',
          on: { click: () => close(null) } }, t('Cancel')),
        h('button', { class: 'btn primary', type: 'submit' },
          isEdit ? t('Save') : t('Create')),
      ));

    const snapshot = () => JSON.stringify({
      name: nameInput.value,
      url: urlInput.value,
      kinds: checks.map((label) => label.querySelector('input').checked),
    });
    const initial = snapshot();
    if (typeof setBeforeClose === 'function') {
      setBeforeClose(() => snapshot() === initial
        || confirm(isEdit
          ? t('Discard unsaved changes to this webhook?')
          : t('Discard this webhook?')));
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const eventKinds = checks
        .map((label) => label.querySelector('input'))
        .filter((cb) => cb.checked)
        .map((cb) => cb.value);
      if (eventKinds.length === 0) {
        err.style.display = ''; err.textContent = t('Select at least one event kind.');
        return;
      }
      err.style.display = 'none';
      if (isEdit) {
        const patch = {
          name: nameInput.value,
          url: urlInput.value,
          event_kinds: eventKinds,
        };
        const r = await api(`/api/admin/webhooks/${existing.id}`, {
          method: 'PATCH',
          body: JSON.stringify(patch),
        });
        if (r.status === 204) {
          toastOk(t('Webhook updated.'));
          close(true);
        } else {
          err.style.display = ''; err.textContent = r.body?.error || t('error {{status}}', { status: r.status });
        }
      } else {
        const r = await api('/api/admin/webhooks', {
          method: 'POST',
          body: JSON.stringify({
            name: nameInput.value,
            url: urlInput.value,
            event_kinds: eventKinds,
          }),
        });
        if (r.status === 201 && r.body?.secret) {
          // Successfully created — reveal the secret, then signal
          // success to the caller so it reloads the list.
          close(true);
          await openSecretReveal({ secret: r.body.secret, title: t('Webhook created') });
        } else {
          err.style.display = ''; err.textContent = r.body?.error || t('error {{status}}', { status: r.status });
        }
      }
    });
    body.append(form);
    setTimeout(() => urlInput.focus(), 20);
  });
}

// openSecretReveal shows the secret exactly once with a copy button
// and a hard "this is the only time" warning. Used after create AND
// after rotate.
async function openSecretReveal({ secret, title }) {
  return modal(title, ({ body, close }) => {
    const copyBtn = h('button', { class: 'btn', type: 'button' }, icon(ICONS.copy), t('Copy'));
    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(secret);
        toastOk(t('Secret copied'));
      } catch {
        toastErr(t('Copy failed'));
      }
    });
    body.append(
      h('p', { style: 'color:var(--accent); font-weight:600' },
        t('This is the only time the secret will be shown. Store it somewhere safe.')),
      h('pre', {
        style: 'background:var(--surface-2); padding:.75rem; border-radius:8px; ' +
               'font-size:.85rem; word-break:break-all; white-space:pre-wrap; user-select:all',
      }, secret),
      h('p', { class: 'muted', style: 'font-size:.8rem' },
        t('Configure your verifier with this value. Compute HMAC-SHA256 over the raw request body and compare to the X-Zv-Signature header (after stripping the "sha256=" prefix).')),
      h('div', { class: 'row end', style: 'gap:.5rem; margin-top:1rem' },
        copyBtn,
        h('button', { class: 'btn primary', type: 'button',
          on: { click: () => close(true) } }, t('I\'ve saved it')),
      ),
    );
  });
}

// webhookLogPoll keeps a setInterval id while the log view is
// active so we can refresh the list automatically while the worker
// is still attempting pending deliveries. Module-level + cleared
// from renderRoute on every navigation away (mirroring the
// unwatchRun pattern) so a left-behind interval can't leak.
let webhookLogPoll = null;
function stopWebhookLogPoll() {
  if (webhookLogPoll) { clearInterval(webhookLogPoll); webhookLogPoll = null; }
}

// viewWebhooksLog renders one endpoint's delivery audit log: every
// attempt, status code, raw payload. Used to debug "did Slack get
// the team.completed I expected?" without tailing server logs.
// Always scoped to a single endpoint — the page is reached from the
// "Delivery log" button on each endpoint's card, which carries the
// id in the URL.
async function viewWebhooksLog(view, endpointID) {
  // Look the endpoint up so we can show its name + URL in the page
  // header. Org scoping is enforced server-side; if the id doesn't
  // belong to the caller's org we drop them back at the index.
  const endpointsR = await api('/api/admin/webhooks');
  const endpoint = (endpointsR.body?.endpoints || []).find((e) => e.id === endpointID);
  if (!endpoint) { nav('#webhooks'); return; }

  const filter = { status: '' };
  let nextBefore = 0;
  let deliveries = [];
  // Track which delivery rows the user has expanded so a poll-driven
  // rebuild restores them. Keyed by delivery id (server-assigned, so
  // stable across refreshes). Lives at view-scope and dies with the
  // navigation away.
  const expanded = new Set();

  const statusSelect = h('select', { class: 'btn small' },
    h('option', { value: '' },          t('Any status')),
    h('option', { value: 'pending' },   t('Waiting')),
    h('option', { value: 'delivered' }, t('Delivered')),
    h('option', { value: 'dead' },      t('Dead')),
  );
  const refreshBtn = h('button', { class: 'btn small', type: 'button' },
    icon(ICONS.crosshair), t('Refresh'));

  const list = h('div', { class: 'webhook-log' });
  const loadMoreBtn = h('button', { class: 'btn', type: 'button',
    style: 'display:none; margin-top:1rem' }, t('Load more'));
  const status = h('p', { class: 'muted' });

  // fetchPage handles three call shapes:
  //   - { reset: true,  quiet: false } — user clicked Refresh / changed filter:
  //     show "Loading…", clear DOM, repopulate.
  //   - { reset: true,  quiet: true  } — background auto-poll:
  //     keep existing DOM visible until new data arrives, then swap
  //     the list atomically. No flicker, no loading text.
  //   - { reset: false, quiet: false } — "Load more": append next page.
  async function fetchPage({ reset = false, quiet = false } = {}) {
    if (reset && !quiet) {
      deliveries = []; nextBefore = 0;
      list.replaceChildren();
      status.textContent = t('Loading…');
    }
    const params = new URLSearchParams();
    params.set('limit', '50');
    params.set('endpoint_id', String(endpointID));
    if (filter.status) params.set('status', filter.status);
    // Cursor only applies on append-mode loads. A reset (whether
    // quiet or loud) wants a fresh first page.
    if (!reset && nextBefore) params.set('before', String(nextBefore));
    const r = await api('/api/admin/webhooks/deliveries?' + params.toString());
    if (!r.ok) {
      // On a quiet poll we don't want to overwrite the list with an
      // error if we briefly drop a request — keep what's on screen
      // and try again next tick. Loud loads do surface the error.
      if (!quiet) {
        status.className = 'err';
        status.textContent = t('Could not load deliveries ({{status}}).', { status: r.status });
      }
      return;
    }
    const incoming = r.body?.deliveries || [];
    if (reset) {
      // Build the replacement DOM off-screen, then swap once. For
      // quiet polls this means the visible list stays stable until
      // the new content is ready — no empty-then-fill flash. The
      // `expanded` set is passed through so any row the user had
      // open before the rebuild reopens with the same payload
      // visible, no manual re-click required.
      const frag = document.createDocumentFragment();
      for (const d of incoming) frag.appendChild(renderDeliveryRow(d, expanded));
      list.replaceChildren(frag);
      deliveries = incoming.slice();
    } else {
      for (const d of incoming) list.appendChild(renderDeliveryRow(d, expanded));
      deliveries = deliveries.concat(incoming);
    }
    nextBefore = r.body?.next_before || 0;
    if (deliveries.length === 0) {
      status.className = 'muted';
      status.textContent = t('No deliveries yet. Send a test from the Webhooks page to see one land here.');
      loadMoreBtn.style.display = 'none';
    } else {
      status.className = 'muted';
      status.textContent = t('Showing {{n}} delivery row(s).', { n: deliveries.length });
      loadMoreBtn.style.display = nextBefore > 0 ? '' : 'none';
    }
  }

  statusSelect.addEventListener('change', () => {
    filter.status = statusSelect.value;
    fetchPage({ reset: true });
  });
  refreshBtn.addEventListener('click', () => fetchPage({ reset: true }));
  loadMoreBtn.addEventListener('click', () => fetchPage({ reset: false }));

  view.replaceChildren(
    h('button', { class: 'btn ghost small', type: 'button',
      on: { click: () => nav('#webhooks') } },
      icon(ICONS.back), t('Back to webhooks')),
    h('h1', { style: 'margin-top:.75rem' },
      t('Delivery log: {{name}}', { name: endpoint.name || t('(unnamed endpoint)') })),
    h('p', { class: 'muted', style: 'font-family:monospace; word-break:break-all; margin:.25rem 0' },
      endpoint.url),
    h('p', { class: 'muted' },
      t('Click a row to see the raw JSON we POSTed and the verifier-side signature inputs.')),
    h('div', { class: 'row', style: 'gap:.5rem; flex-wrap:wrap; margin:1rem 0' },
      statusSelect, refreshBtn),
    list,
    loadMoreBtn,
    status,
  );
  await fetchPage({ reset: true });

  // Auto-refresh while any row is still pending. The worker attempts
  // every 5s and exponentially backs off after failure; polling at
  // 4s catches the first success/failure transition without thrashing.
  // Self-stops once everything has settled (delivered/dead) so an
  // open log page on a quiet org isn't a constant DB hit. Uses
  // quiet=true so the visible list stays put until the new data
  // arrives — no "list goes empty then fills" flash on every tick.
  stopWebhookLogPoll();
  webhookLogPoll = setInterval(() => {
    if (!deliveries.some((d) => d.status === 'pending')) {
      stopWebhookLogPoll();
      return;
    }
    fetchPage({ reset: true, quiet: true });
  }, 4000);
}

// renderDeliveryRow returns one delivery as a clickable card. Click
// expands to show the pretty-printed payload, signature inputs and
// retry metadata. The card is collapsed by default to keep the log
// scrollable on small screens.
//
// `expanded` is a Set<deliveryID> shared across rebuilds — when a
// poll regenerates the list, rows whose id is in the set are
// rendered already-open so the user's manual expansion survives.
function renderDeliveryRow(d, expanded) {
  const statusClass = ({ delivered: 'ok', dead: 'err', pending: '' })[d.status] || '';
  const statusChip = h('span',
    { class: 'chip ' + statusClass },
    statusLabel(d.status));
  // Outcome chip:
  //   - last_status set    → show "HTTP <code>", green for 2xx, red otherwise
  //   - attempts > 0 only  → transport-level failure (DNS, connection
  //                          refused, timeout) — no HTTP code came back.
  //                          Show a red "No response" chip so the user
  //                          isn't left wondering why a failing row
  //                          looks identical to an un-attempted one.
  //   - attempts == 0      → never attempted yet; render nothing.
  let httpChip = null;
  if (d.last_status != null) {
    httpChip = h('span', {
      class: 'chip ' + httpStatusClass(d.last_status),
      style: 'font-family:monospace',
    }, String(d.last_status));
  } else if (d.attempts > 0) {
    httpChip = h('span', { class: 'chip err' }, t('No response'));
  }
  const kindChip = h('span',
    { class: 'chip', style: 'font-family:monospace; font-size:.78rem' },
    d.event_kind);

  // Render the delivery age as a localized relative string ("5m ago",
  // "2h ago"). Hover/long-press surfaces the absolute local timestamp
  // for the operator who needs forensic detail. Plain UTC-like server
  // string is what was here before — readable but slow to parse.
  const head = h('div', {
    class: 'row',
    style: 'gap:.5rem; align-items:center; flex-wrap:wrap; cursor:pointer',
  },
    statusChip, httpChip, kindChip,
    h('span', {
      class: 'muted', style: 'font-size:.85rem',
      title: fmtLocal(d.created_at) || d.created_at,
    }, formatEventTime(d.created_at)),
    h('span', { class: 'muted', style: 'font-size:.85rem; flex:1; text-align:right' },
      d.endpoint_name || t('(unnamed endpoint)')),
  );

  // The expandable detail body — built lazily on first expand so the
  // log can render hundreds of rows without parsing every payload.
  // Persistence across rebuilds is handled via the `expanded` set.
  const isOpen = expanded && expanded.has(d.id);
  const detail = h('div', { style: 'margin-top:.75rem; display:' + (isOpen ? '' : 'none') });
  let built = false;
  const ensureBuilt = () => {
    if (!built) {
      built = true;
      detail.append(...renderDeliveryDetail(d));
    }
  };
  if (isOpen) ensureBuilt();
  head.addEventListener('click', () => {
    ensureBuilt();
    if (detail.style.display === 'none') {
      detail.style.display = '';
      if (expanded) expanded.add(d.id);
    } else {
      detail.style.display = 'none';
      if (expanded) expanded.delete(d.id);
    }
  });

  return h('div', { class: 'card', style: 'padding:.85rem 1rem' }, head, detail);
}

function renderDeliveryDetail(d) {
  const out = [];

  // Metadata line: signature inputs the verifier-side handler wants.
  out.push(h('p', { class: 'muted', style: 'font-size:.82rem; margin:.25rem 0' },
    h('strong', {}, 'X-Zv-Delivery-Id: '),
    h('code', {}, d.delivery_uuid),
  ));
  out.push(h('p', { class: 'muted', style: 'font-size:.82rem; margin:.25rem 0' },
    h('strong', {}, t('Attempts: ')),
    String(d.attempts),
    d.delivered_at
      ? h('span', {}, ' · ', h('strong', {}, t('Delivered at: ')), d.delivered_at)
      : null,
    d.status === 'pending' && d.next_attempt_at
      ? h('span', {}, ' · ', h('strong', {}, t('Next attempt: ')), d.next_attempt_at)
      : null,
  ));
  if (d.last_error) {
    out.push(h('div', { class: 'callout warn',
      style: 'font-family:monospace; font-size:.82rem; white-space:pre-wrap' },
      d.last_error));
  }
  // Pretty-printed JSON. Falls back to the raw text if the payload
  // doesn't parse for any reason — defensive, since a corrupted row
  // shouldn't break the whole log.
  let pretty = d.payload;
  try { pretty = JSON.stringify(JSON.parse(d.payload), null, 2); } catch {}
  out.push(h('pre', {
    style: 'background:var(--surface-2); padding:.75rem 1rem; border-radius:8px; ' +
           'overflow-x:auto; font-size:.82rem; line-height:1.5; max-height:32rem; ' +
           'white-space:pre',
  }, pretty));
  return out;
}

function statusLabel(s) {
  switch (s) {
    case 'delivered': return t('Delivered');
    case 'pending':   return t('Waiting');
    case 'dead':      return t('Dead');
  }
  return s;
}
// Strict 2xx vs everything-else colouring per the operator's
// preference: a green chip means "the customer's endpoint accepted
// it"; any other code (4xx, 5xx, transport error → 0) means
// "something needs attention".
function httpStatusClass(code) {
  return (code >= 200 && code < 300) ? 'ok' : 'err';
}

// confirmDanger is a small destructive-action confirmation modal.
// Returns true if the user clicked the danger button.
async function confirmDanger(title, message) {
  return modal(title, ({ body, close }) => {
    body.append(
      h('p', { style: 'margin-bottom:1rem' }, message),
      h('div', { class: 'row end', style: 'gap:.5rem' },
        h('button', { class: 'btn', type: 'button',
          on: { click: () => close(false) } }, t('Cancel')),
        h('button', { class: 'btn danger', type: 'button',
          on: { click: () => close(true) } }, t('Confirm')),
      ));
  });
}

// viewSettings is the tabbed Settings hub. The five tabs cover
// concerns that previously lived as separate sidebar entries
// (Members, Purchases, Webhooks-as-Integrations) plus the personal
// account cards (General) and admin-only operator knobs (System).
// Each tab fills the inner `body` element with replaceChildren,
// so the existing reload-via-renderRoute pattern in the body
// handlers (member add, webhook add, purchase refund, …) keeps
// working without modification.
async function viewSettings(view, tab) {
  const me = state.me || {};
  const isOrgUser = !!me.org_id;
  const isOrgAdmin = me.role === 'org_admin';
  const isAdmin = me.role === 'admin';

  const tabs = [
    { id: 'general',      label: t('General'),      visible: true },
    // Account is the identity / security / data hub: who you are,
    // your password / 2FA, the sessions you've opened, an export of
    // your data, and the delete-my-account button. Always visible.
    { id: 'account',      label: t('Account'),      visible: true },
    { id: 'members',      label: t('Members'),      visible: isOrgAdmin },
    // Admins is the platform-admin equivalent of Members — same UI
    // shape (user list + add/remove), different audience. Mutually
    // exclusive with Members because a standalone admin isn't in an
    // org and an org_admin can't see global admins.
    { id: 'admins',       label: t('Admins'),       visible: isAdmin },
    // Audit is an investigation surface — same audience as Members
    // (org_admin sees their org's auth events; standalone admin sees
    // platform-wide). Sits next to Members so the "people +
    // their activity" pair clusters together.
    { id: 'audit',        label: t('Audit'),        visible: isOrgAdmin || isAdmin },
    { id: 'purchases',    label: t('Purchases'),    visible: isOrgUser },
    { id: 'system',       label: t('System'),       visible: isAdmin },
    // Software update is admin-only and carries a badge dot when
    // the cached snapshot says a newer release is available, so the
    // operator finds the page even without remembering it exists.
    { id: 'software-update', label: t('Software update'), visible: isAdmin,
      badge: systemUpdateAvailable() },
    { id: 'integrations', label: t('Integrations'), visible: isOrgUser },
  ].filter((tb) => tb.visible);

  // Fall through to General if the URL asks for a tab the current
  // user can't see — direct-link followers shouldn't get a wedged
  // empty page just because their role doesn't match.
  if (!tab || !tabs.find((tb) => tb.id === tab)) tab = 'general';

  const tabStrip = h('div', { class: 'lib-tabs', style: 'margin-bottom:1rem' },
    tabs.map((tb) => h('a', {
      class: 'lib-tab' + (tb.id === tab ? ' active' : '') + (tb.badge ? ' has-update' : ''),
      href: '#settings/' + tb.id,
      on: { click: (e) => { e.preventDefault(); nav('#settings/' + tb.id); } },
    }, tb.label)));

  // Each tab fills `body` directly with replaceChildren — keeps the
  // existing handlers' "reload by re-running my own view fn" pattern
  // intact, and the strip above stays untouched.
  const body = h('div');
  view.replaceChildren(tabStrip, body);

  switch (tab) {
    case 'general':      return renderSettingsGeneral(body);
    case 'account':      return renderSettingsAccount(body);
    case 'members':      return await viewMembers(body);
    case 'admins':       return await viewAdmins(body);
    case 'audit':        return await viewAudit(body);
    case 'purchases':    return await viewPurchases(body);
    case 'integrations': return await viewWebhooks(body);
    case 'system':       return renderSettingsSystem(body);
    case 'software-update': return await viewSettingsSoftwareUpdate(body);
  }
}

// renderSettingsGeneral collects the personal-account cards (password,
// email, TOTP, sessions, audit, export, help, account deletion) — the
// surfaces every authenticated user sees regardless of role.
function renderSettingsGeneral(view) {
  // General is now scoped to UI preferences + where to get help.
  // Account-management cards (password, email, 2FA, sessions, audit,
  // export, delete) moved to the dedicated Account tab so a user
  // looking for "change my password" goes to the obviously-named
  // place, not a kitchen-sink "General" page.
  view.replaceChildren(
    h('h1', {}, t('General')),
    h('p', { class: 'muted' },
      t('Appearance and quick links to help. For password, email, sessions, and account deletion, see the Account tab.')),
    renderSettingsAppearanceCard(),
    renderSettingsHelpCard(),
  );
}

// renderSettingsAccount paints the identity / security / data cards.
// Available to every authenticated user — the cards themselves
// gate on whether they're applicable (e.g. the email card no-ops

function renderSettingsAccount(view) {
  const me = state.me || {};
  view.replaceChildren(
    h('h1', {}, t('Account')),
    h('p', { class: 'muted' },
      t('Your identity on this instance, the sign-in security on top of it, and the data export / deletion controls.')),
    renderSettingsRoleCard(),
    renderSettingsPasswordCard(),
