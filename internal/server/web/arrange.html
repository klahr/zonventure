<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zonventure · arranger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aclonica&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="/i18n.js"></script>
<style>
/* ---------- Theme (Zonventure palette) ---------- */
:root {
  --accent:        #ad1357;  /* raspberry — brand */
  --accent-hover:  #951048;
  --accent-fg:     #ffffff;
  /* Falls back to --accent unless an adventure overrides it via
     applyAdventureColors — mirrors the same default in play.html. */
  --accent-secondary: #ad1357;
  --ink:           #1f3349;  /* navy — headings */
  --success:       #429a3f;  /* brand green */
  --danger:        #ff5252;
  --danger-fg:     #ffffff;
  --warning:       #b45309;

  --bg:            #fbfbfd;
  --surface:       #ffffff;
  --surface-2:     #f6f6f6;
  --border:        #c6d2e1;
  --border-soft:   #c6d2e166;

  --text:          var(--ink);
  --muted:         #6b7f96;

  --shadow-soft:   0 1px 4px #00000014, 0 2px 8px #00000012;
  --shadow:        1px 1px 4px #00000033;
  --shadow-lg:     1px 1px 16px #00000047;

  --radius:        12px;
  --radius-sm:     8px;
  --radius-pill:   32px;

  --font-body:     'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-brand:    'Aclonica', 'Vollkorn', Georgia, serif;

  --anim:          200ms;
}
[data-theme="dark"] {
  --bg:          #14202e;
  --surface:     #1f3349;  /* the brand navy, used as primary surface */
  --surface-2:   #263d56;
  --border:      #3a5172;
  --border-soft: #3a517266;

  --text:        #e7ecf4;
  --muted:       #9db1cc;
  --ink:         #e7ecf4;

  --accent:      #e24080;   /* raspberry lifted for dark bg contrast */
  --accent-hover: #ad1357;
  --accent-fg:   #ffffff;
  --accent-secondary: #e24080;
  --success:     #7fd17b;
  --danger:      #ff7b7b;
  --warning:     #fbbf24;

  --shadow-soft: 0 1px 4px #00000066, 0 2px 12px #00000077;
  --shadow:      2px 2px 8px #00000073;
  --shadow-lg:   0 16px 40px #000000aa;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --bg: #14202e; --surface: #1f3349; --surface-2: #263d56;
    --border: #3a5172; --border-soft: #3a517266;
    --text: #e7ecf4; --muted: #9db1cc; --ink: #e7ecf4;
    --accent: #e24080; --accent-hover: #ad1357; --accent-fg: #ffffff;
    --accent-secondary: #e24080;
    --success: #7fd17b; --danger: #ff7b7b; --warning: #fbbf24;
    --shadow-soft: 0 1px 4px #00000066, 0 2px 12px #00000077;
    --shadow: 2px 2px 8px #00000073;
    --shadow-lg: 0 16px 40px #000000aa;
  }
}

/* ---------- Base ---------- */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3 { margin: 0 0 .5rem; line-height: 1.25; font-weight: 700; color: var(--ink); }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.1rem; }
h3 { font-size: .9rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
p { margin: 0 0 .5rem; }

/* ---------- App shell ---------- */
.app {
  display: grid;
  grid-template-columns: 240px minmax(0, 1fr);
  grid-template-rows: auto 1fr;
  grid-template-areas:
    "sidebar topbar"
    "sidebar content";
  min-height: 100vh;
  overflow-x: hidden;
}
.topbar {
  grid-area: topbar;
  display: flex;
  align-items: center;
  gap: .75rem;
  padding: 1rem 1.5rem;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 20;
}
.topbar .brand { display: none; font-size: 1.2rem; }
.topbar .crumb { font-weight: 700; font-size: 1rem; color: var(--ink); }
.topbar .spacer { flex: 1; }
.topbar .user {
  display: flex; align-items: center; gap: .6rem;
  color: var(--muted); font-size: .85rem;
}
.topbar .user strong { color: var(--text); font-weight: 700; }

.sidebar {
  grid-area: sidebar;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 1.5rem 0;
  display: flex; flex-direction: column;
}
.brand {
  font-family: var(--font-brand);
  font-weight: 400;
  color: var(--accent);
  letter-spacing: .01em;
}
.sidebar .brand {
  padding: 0 1.5rem 1.5rem;
  font-size: 1.55rem;
  display: flex; flex-direction: column;
  align-items: flex-start;
  gap: 0;
  line-height: 1.1;
}
.sidebar .brand small {
  font-family: var(--font-body);
  font-size: .7rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .08em;
  font-weight: 700;
  margin-top: .15rem;
}
.nav { display: flex; flex-direction: column; gap: 2px; padding: 0 .75rem; flex: 1; }
.sidebar-footer {
  margin-top: auto;
  padding: 1rem .75rem;
  border-top: 1px solid var(--border-soft);
  display: flex;
  flex-direction: column;
  gap: .4rem;
}
.sidebar-footer .btn {
  width: 100%;
  justify-content: flex-start;
  font-weight: 600;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sidebar-footer .btn:hover { color: var(--accent); border-color: transparent; background: var(--surface-2); }
.sidebar-footer .btn svg { stroke: currentColor; }
.sidebar-lang {
  display: flex; align-items: center; gap: .5rem;
  padding: .25rem .25rem; font-size: .8rem;
}
.sidebar-lang > span { text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.zv-lang-picker {
  font: inherit; color: var(--text);
  padding: .3rem .5rem;
  background: var(--surface-2);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm);
  box-shadow: none;
  cursor: pointer;
}
.zv-lang-picker:hover { border-color: var(--muted); }
.nav a {
  display: flex; align-items: center; gap: .75rem;
  padding: .6rem .85rem; border-radius: var(--radius-pill);
  color: var(--text); text-decoration: none; font-weight: 600;
  transition: background var(--anim), color var(--anim);
}
.nav a:hover { background: var(--surface-2); text-decoration: none; }
.nav a.active { background: var(--accent); color: var(--accent-fg); box-shadow: var(--shadow-soft); }
.nav a.active svg { stroke: var(--accent-fg); }
.nav svg { width: 18px; height: 18px; stroke: var(--muted); stroke-width: 1.75; fill: none; flex-shrink: 0; }
.nav a:hover svg { stroke: var(--accent); }

.content {
  grid-area: content;
  padding: 1.5rem 2rem 3rem;
  min-width: 0;          /* let the grid track shrink below content's intrinsic width */
  overflow-x: hidden;    /* defense in depth — page itself never scrolls sideways */
}
.content > * + * { margin-top: 1.25rem; }

/* Mobile */
.btn.menu-btn {
  display: none;
  /* Square icon-only tap target. 44×44 CSS px matches the Apple HIG
     minimum (and Material's 48dp lands close too), so the control is
     comfortable on a thumb without looking bulky next to the brand. */
  width: 44px; height: 44px; padding: 0; line-height: 0;
}
.btn.menu-btn svg { width: 26px; height: 26px; stroke-width: 2; }
@media (max-width: 820px) {
  .app {
    grid-template-columns: 1fr;
    grid-template-areas: "topbar" "content";
  }
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: 260px; z-index: 1500;
    transform: translateX(-100%);
    transition: transform .2s ease;
    box-shadow: var(--shadow-lg);
  }
  .sidebar.open { transform: translateX(0); }
  .topbar .brand { display: inline-flex; align-items: baseline; gap: .4rem; font-weight: 700; }
  .btn.menu-btn { display: inline-flex; }
  .content { padding: 1rem; }
  .topbar .crumb { display: none; }
  .topbar .user-details { display: none; }
}
.backdrop {
  display: none;
  position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 1400;
}
.backdrop.show { display: block; }

/* ---------- Buttons (Zonventure-style rounded pills) ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
  font: inherit; font-weight: 700; cursor: pointer; user-select: none;
  padding: .6rem 1.1rem; border-radius: var(--radius-pill);
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text);
  transition: background var(--anim), border-color var(--anim), transform 60ms, box-shadow var(--anim);
}
.btn:hover { background: var(--surface-2); border-color: var(--muted); }
.btn:active { transform: translateY(1px); }
.btn.primary {
  background: var(--accent); border-color: var(--accent); color: var(--accent-fg);
  box-shadow: var(--shadow-soft);
}
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.danger:hover { background: var(--danger); color: var(--danger-fg); border-color: var(--danger); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: .4rem .6rem; }
.btn.ghost:hover { background: var(--surface-2); color: var(--accent); border-color: transparent; }
.btn.small { padding: .35rem .75rem; font-size: .8rem; }
.btn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.75; fill: none; }

/* ---------- Cards ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  box-shadow: var(--shadow-soft);
  padding: 1.25rem;
  /* Wide content (mainly tables) becomes a horizontal scroll area inside the
     card rather than pushing the viewport wider. */
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.card h2 { margin-top: 0; }
.card + .card { margin-top: 1rem; }
.card.clickable { cursor: pointer; transition: transform var(--anim), box-shadow var(--anim); }
.card.clickable:hover { transform: translateY(-2px) scale(1.015); box-shadow: var(--shadow-lg); }

.grid { display: grid; gap: 1rem; }
.grid.cols-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.grid.cols-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
/* stats are small enough to stay side-by-side even on very narrow phones */
.grid.stats { grid-template-columns: repeat(3, minmax(0,1fr)); gap: .5rem; }
@media (max-width: 820px) {
  .grid.cols-3, .grid.cols-2 { grid-template-columns: 1fr; }
}

.stat {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  padding: 1.1rem 1rem;
  box-shadow: var(--shadow-soft);
  text-align: center;
}
.stat .label {
  color: var(--muted);
  font-size: clamp(.6rem, 1.6vw, .75rem);
  text-transform: uppercase; letter-spacing: .07em; font-weight: 700;
  white-space: nowrap;
}
.stat .value {
  font-size: clamp(1.5rem, 6vw, 2.4rem);
  font-weight: 700; margin-top: .25rem; color: var(--ink);
  line-height: 1;
}
.stat.accent .value { color: var(--accent); }
@media (max-width: 560px) {
  .stat { padding: .85rem .5rem; }
}

/* ---------- Forms ---------- */
label.field { display: block; margin-bottom: .9rem; }
label.field > span {
  display: block; margin-bottom: .3rem;
  color: var(--ink); font-size: .8rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .04em;
}
input, select, textarea {
  font: inherit; width: 100%;
  padding: .65rem .85rem;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  box-shadow: inset 0 0 0 1px var(--border-soft);
}
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
}
textarea { min-height: 80px; resize: vertical; font-family: ui-monospace, monospace; }

/* ---------- Table ---------- */
.table {
  width: 100%;
  border-collapse: separate; border-spacing: 0;
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-soft);
}
.table th, .table td { padding: .7rem 1rem; text-align: left; vertical-align: middle; }
.table th {
  background: var(--surface-2); color: var(--ink);
  font-weight: 700; font-size: .75rem; text-transform: uppercase; letter-spacing: .06em;
  border-bottom: 1px solid var(--border);
}
.table tbody tr + tr td { border-top: 1px solid var(--border-soft); }
.table tbody tr:hover { background: var(--surface-2); }
.table tbody tr:nth-child(odd) { background: color-mix(in srgb, var(--surface-2) 45%, transparent); }
.table tbody tr:nth-child(odd):hover { background: var(--surface-2); }
.table td .row { display: flex; gap: .35rem; }
@media (max-width: 820px) {
  .table .hide-narrow { display: none; }
}

/* ---------- Bits ---------- */
.row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }
/* Header rows (a card title next to an action button) shouldn't carry
   the heading's default bottom margin — align-items:center would then
   nudge the title visually upward relative to the button. Zero it here
   and give the row itself a small bottom margin so it doesn't jam into
   the content that follows. */
.row > h1, .row > h2, .row > h3 { margin: 0; }
.card > .row.between { margin-bottom: .75rem; }
.muted { color: var(--muted); }
.err { color: var(--danger); }
.ok { color: var(--success); }
.mono { font-family: ui-monospace, SFMono-Regular, monospace; font-size: .9em; }

.pill {
  display: inline-flex; align-items: center;
  padding: .15rem .65rem;
  font-size: .7rem; font-weight: 700;
  border-radius: 999px;
  background: var(--surface-2); color: var(--muted);
  text-transform: uppercase; letter-spacing: .06em;
}
.pill.accent { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
.pill.danger { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }
.pill.success { background: color-mix(in srgb, var(--success) 15%, transparent); color: var(--success); }
.pill.warning { background: color-mix(in srgb, var(--warning) 18%, transparent); color: var(--warning); }

.chip {
  display: inline-flex; align-items: center; gap: .25rem;
  padding: .2rem .65rem; background: var(--surface-2);
  border: 1px solid var(--border-soft); border-radius: 999px;
  font-size: .8rem; font-weight: 600;
}
.chip button {
  background: none; border: none; cursor: pointer; padding: 0;
  color: var(--muted); font-size: 1rem; line-height: 1;
}
.chip button:hover { color: var(--danger); }

.empty {
  text-align: center; padding: 3rem 1rem; color: var(--muted);
  background: var(--surface-2); border-radius: var(--radius);
  border: 1px dashed var(--border);
}

/* ---------- Modal ----------
   Leaflet assigns its own layers z-index up to ~1000, so the modal and
   toasts have to sit clearly above that to stay on top of the run map. */
.modal-back {
  position: fixed; inset: 0; background: rgba(0,0,0,.45);
  display: flex; align-items: center; justify-content: center;
  z-index: 2000; padding: 1rem;
}
.modal {
  background: var(--surface); border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  width: 100%; max-width: 420px;
  padding: 1.5rem;
  max-height: calc(100vh - 2rem);
  overflow-y: auto;
}
.modal.wide { max-width: 560px; }
.modal.xwide { max-width: 720px; }
.modal h2 { margin-top: 0; }

/* ---------- WYSIWYG puzzle editor ----------
   The preview card mirrors play.html's puzzle layout (title, images,
   prompt, hint, submit dock) so the arranger sees roughly what the
   player will see. The inputs look like plain text until hovered or
   focused, then show a dashed editable affordance. */
.puzzle-editor {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 1.25rem;
  border: 1px solid var(--border-soft);
  box-shadow: var(--shadow);
  margin-bottom: 1rem;
}
.puzzle-editor textarea.pe {
  display: block; width: 100%;
  background: transparent;
  /* Dashed outline is always visible so it's obvious the field is
     editable. Focus lifts it to the accent colour + a soft glow. */
  border: 1px dashed var(--border-soft);
  padding: .35rem .5rem; margin: 0;
  border-radius: 6px;
  /* Clear the inheritable globals from the form `textarea` block:
     ui-monospace font, 80px min-height, the inset box-shadow border. */
  font: inherit; color: inherit;
  min-height: 0;
  box-shadow: none;
  resize: none; overflow: hidden;
  transition: border-color 120ms, background 120ms, box-shadow 120ms;
}
.puzzle-editor textarea.pe:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--surface-2);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
}
/* The slot-specific rules use `textarea.pe-*` (not `.pe-*`) so they beat
   `.puzzle-editor textarea.pe`'s `font: inherit` on specificity. */
.puzzle-editor textarea.pe-title {
  /* Matches play.html's h3: 1.05rem, brand-secondary tint. Font-family is
     the body font (inherited via `font: inherit`), not the brand font. */
  font-size: 1.05rem; font-weight: 700;
  color: var(--accent-secondary);
  margin: 0 0 .5rem;
}
.puzzle-editor textarea.pe-prompt {
  /* Matches play.html's .prompt. */
  font-size: 1.1rem; line-height: 1.55;
  white-space: pre-wrap; color: var(--ink);
}
.puzzle-editor textarea.pe-hint {
  color: var(--muted);
}
.puzzle-editor .pe-hint-row {
  display: flex; gap: .35rem; align-items: flex-start; margin-top: .5rem;
}
.puzzle-editor .pe-hint-row .tag {
  color: var(--muted); font-weight: 600;
  padding: .35rem 0; flex-shrink: 0;
}
.puzzle-editor .pe-images {
  display: grid; gap: .5rem; margin: .5rem 0;
}
.puzzle-editor .pe-image-wrap { position: relative; }
.puzzle-editor .pe-image {
  width: 100%; height: auto; display: block;
  border-radius: var(--radius);
  border: 1px solid var(--border-soft);
}
.puzzle-editor .pe-image-remove {
  position: absolute; top: .5rem; right: .5rem;
}
.puzzle-editor .pe-image-add {
  display: flex; align-items: center; justify-content: center; gap: .35rem;
  padding: .35rem .7rem;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  color: var(--muted); cursor: pointer;
  font-size: .85rem;
  transition: background 120ms, border-color 120ms, color 120ms;
}
.puzzle-editor .pe-image-add svg {
  width: 14px; height: 14px;
}
.puzzle-editor .pe-image-add:hover {
  background: var(--surface-2);
  border-color: var(--accent);
  color: var(--accent);
}
.puzzle-editor .pe-image-add.disabled {
  cursor: not-allowed; opacity: .6;
}
.puzzle-editor .pe-image-add.disabled:hover {
  background: transparent; border-color: var(--border); color: var(--muted);
}
/* Non-interactive preview of play.html's sticky submit dock, so the
   arranger sees where the player will type and how cramped the prompt
   is relative to the submit row. */
.puzzle-editor .pe-dock {
  margin-top: 1rem;
  padding: .75rem; background: var(--surface-2);
  border-radius: var(--radius);
  display: grid; grid-template-columns: 1fr auto; gap: .5rem;
  opacity: .7;
}
.puzzle-editor .pe-dock-label {
  grid-column: 1 / -1;
  text-transform: uppercase;
  font-size: .65rem; font-weight: 700; letter-spacing: .08em;
  color: var(--muted); margin: 0 0 .25rem;
}
.puzzle-editor .pe-dock input,
.puzzle-editor .pe-dock button {
  pointer-events: none;
}
.puzzle-settings { margin-top: 1rem; }
.puzzle-settings h3 {
  font-size: .85rem; margin: 0 0 .6rem;
  color: var(--muted); font-weight: 700;
  text-transform: uppercase; letter-spacing: .06em;
}

/* Location editor embedded in the puzzle-settings panel.
   The map itself is a Leaflet instance; the radius-drag handle is a
   divIcon styled to look like a resize grip. */
.pe-loc-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: .5rem; margin: 0 0 .5rem;
}
.pe-map {
  height: 260px;
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--border-soft);
  margin-bottom: .5rem;
}
.pe-loc-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: .5rem;
}
.pe-radius-handle {
  width: 22px; height: 22px;
  background: #ad1357; color: #fff;
  border: 2px solid #fff;
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 12px; font-weight: 800;
  box-shadow: 0 0 0 1px rgba(0,0,0,.25);
  cursor: ew-resize;
}

/* Floating action button for the Puzzles view. Sits above the content
   in the bottom-right corner so a phone-in-hand admin can tap it
   without scrolling. */
.fab {
  position: fixed;
  right: calc(1rem + env(safe-area-inset-right));
  bottom: calc(1rem + env(safe-area-inset-bottom));
  width: 56px; height: 56px;
  border-radius: 50%;
  background: var(--accent); color: var(--accent-fg);
  border: none; cursor: pointer;
  box-shadow: 0 8px 24px rgba(0,0,0,.25), 0 2px 8px rgba(0,0,0,.15);
  display: grid; place-items: center;
  z-index: 500;
}
.fab svg { width: 24px; height: 24px; }
.fab:hover { background: var(--accent-hover); }
.fab:disabled { opacity: .6; cursor: wait; }

/* Puzzle timeline: numbered pills at the top of the editor modal so an
   arranger can jump between puzzles without closing the dialog. The
   trailing "+" pill creates a new puzzle. */
.puzzle-timeline {
  display: flex; gap: .35rem; align-items: center; flex-wrap: wrap;
  margin: 0 0 1rem;
  padding-bottom: .75rem;
  border-bottom: 1px solid var(--border-soft);
}
.pt-pill {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 2rem; max-width: 14rem; height: 2rem; padding: 0 .75rem;
  border-radius: 999px;
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border-soft);
  font: inherit; font-weight: 700; font-variant-numeric: tabular-nums;
  cursor: pointer;
  overflow: hidden;
  transition: border-color 120ms, background 120ms, color 120ms;
}
.pt-pill .pt-label {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pt-pill.untitled .pt-label { font-style: italic; font-weight: 500; color: var(--muted); }
.pt-pill.current.untitled .pt-label { color: var(--accent-fg); }
.pt-pill:hover { border-color: var(--accent); }
.pt-pill.current {
  background: var(--accent); color: var(--accent-fg);
  border-color: var(--accent); cursor: default;
}
.pt-pill.current:hover { border-color: var(--accent); }
.pt-plus {
  color: var(--muted);
  border-style: dashed;
}
.pt-pill.disabled {
  opacity: .45;
  text-decoration: line-through;
  background: transparent;
  border-style: dashed;
}
.pt-pill.current.disabled { opacity: .7; }
/* Arrow between timeline pills — a pure-decoration sequence hint.
   pointer-events: none lets drag-over fall through to the pills. */
.pt-arrow {
  color: var(--muted);
  font-size: 1rem;
  line-height: 1;
  user-select: none;
  pointer-events: none;
}

/* Dragging feedback: the pill being dragged dims, and the drop target
   grows a coloured edge on whichever side the cursor is closer to so
   arrangers see the exact insertion point (same affordance as Slides). */
.pt-pill[draggable] { cursor: grab; }
.pt-pill[draggable]:active { cursor: grabbing; }
.pt-pill.drag-ghost { opacity: .3; }
.pt-pill.drop-before { box-shadow: inset 3px 0 0 0 var(--accent); }
.pt-pill.drop-after  { box-shadow: inset -3px 0 0 0 var(--accent); }

/* Selectable chip grid used in the team-create modal. */
.chip-grid {
  display: flex; flex-wrap: wrap; gap: .4rem;
  max-height: 220px; overflow-y: auto;
  padding: .5rem; border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
}
.chip.selectable {
  cursor: pointer; user-select: none;
  transition: background var(--anim), color var(--anim), border-color var(--anim);
}
.chip.selectable:hover { border-color: var(--muted); }
.chip.selectable.selected {
  background: var(--accent); color: var(--accent-fg);
  border-color: var(--accent); font-weight: 700;
}
.chip.selectable.selected:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.chip.selectable.taken {
  opacity: .55; cursor: not-allowed; font-style: italic;
  border-style: dashed;
}
.chip.selectable.taken:hover { border-color: var(--border-soft); }

.inline-form {
  margin-top: .6rem; padding: .85rem;
  background: var(--surface-2); border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm);
}
.inline-form .row > input { flex: 1 1 0; min-width: 0; margin: 0; }
.inline-form .row { gap: .4rem; align-items: stretch; }

/* ---------- Map ---------- */
.map-host {
  width: 100%; height: 420px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-soft);
  overflow: hidden;
}
.puzzle-marker {
  width: 28px; height: 28px;
  background: var(--ink); color: #fff;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: .8rem;
  border: 2px solid #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,.35);
}
.puzzle-marker.gated { background: var(--accent); }
.puzzle-marker > span { transform: rotate(45deg); }
.team-dot {
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid #fff;
  box-shadow: 0 0 0 1px rgba(0,0,0,.25);
}
.map-legend {
  display: flex; flex-wrap: wrap; gap: .75rem;
  margin-top: .75rem; font-size: .8rem;
}
.map-legend .sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: middle; margin-right: .35rem; }

/* ---------- Event feed ---------- */
.feed { list-style: none; padding: 0; margin: 0; max-height: 380px; overflow-y: auto; }
.feed li {
  display: grid; grid-template-columns: auto 1fr auto; gap: .75rem;
  align-items: start; padding: .6rem .3rem;
  border-bottom: 1px solid var(--border-soft);
}
.feed li:last-child { border-bottom: none; }
.feed .badge {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: .9rem; font-weight: 700;
  background: var(--surface-2); color: var(--ink);
}
.feed .badge.neutral { background: var(--surface-2); color: var(--ink); }
.feed .badge.good { background: color-mix(in srgb, var(--success) 22%, transparent); color: var(--success); }
.feed .badge.bad { background: color-mix(in srgb, var(--danger) 22%, transparent); color: var(--danger); }
.feed .badge.brand { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }
.feed .msg strong { font-weight: 700; }
.feed .meta { font-size: .75rem; color: var(--muted); margin-top: .1rem; }
.feed time { font-size: .75rem; color: var(--muted); white-space: nowrap; }

/* ---------- Toast ---------- */
.toasts {
  position: fixed; bottom: 1rem; right: 1rem; z-index: 2100;
  display: flex; flex-direction: column; gap: .5rem;
}
.toast {
  padding: .75rem 1rem; border-radius: var(--radius-sm);
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  box-shadow: var(--shadow-lg); min-width: 240px;
  animation: slideIn .2s ease;
}
.toast.err { border-color: var(--danger); color: var(--danger); }
.toast.ok { border-color: var(--success); color: var(--success); }
@keyframes slideIn { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- Login ---------- */
.login-wrap {
  min-height: 100vh; display: grid; place-items: center; padding: 1rem;
  background:
    radial-gradient(circle at 20% 0%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 50%),
    radial-gradient(circle at 80% 100%, color-mix(in srgb, var(--ink) 12%, transparent), transparent 50%),
    var(--bg);
}
.login {
  background: var(--surface); border: 1px solid var(--border-soft);
  border-radius: var(--radius); box-shadow: var(--shadow-lg);
  padding: 2rem; width: 100%; max-width: 380px;
}
.login .brand {
  font-size: 1.75rem; margin-bottom: 1.5rem;
  display: flex; flex-direction: column;
  align-items: flex-start;
  gap: 0;
  line-height: 1.1;
}
.login .brand small {
  font-family: var(--font-body);
  font-size: .7rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .08em;
  font-weight: 700;
  margin-top: .15rem;
}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal-host"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script>
/* ========== API helper ========== */
async function api(path, opts = {}) {
  const res = await fetch(path, {
    credentials: 'same-origin',
    headers: opts.body ? { 'Content-Type': 'application/json' } : {},
    ...opts,
  });
  let body = null;
  if (res.status !== 204) {
    try { body = await res.json(); } catch {}
  }
  return { status: res.status, ok: res.ok, body };
}

/* ========== DOM helper ========== */
function h(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'on') for (const [ev, fn] of Object.entries(v)) e.addEventListener(ev, fn);
    else if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k in e && typeof e[k] !== 'function') {
      try { e[k] = v; } catch { e.setAttribute(k, v); }
    } else e.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c === null || c === undefined || c === false) continue;
    e.append(c?.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
const icon = (svg) => {
  const s = h('span');
  s.innerHTML = svg;
  return s.firstElementChild;
};
const ICONS = {
  dashboard: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  map: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21 3 6"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>',
  play: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>',
  user: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
  shield: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
  plus: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  trash: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>',
  key: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M10.85 12.15 19 4"/><path d="m18 5 2 2"/><path d="m15 8 2 2"/></svg>',
  sun: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>',
  moon: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
  menu: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>',
  back: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>',
  crosshair: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="3" x2="12" y2="7"/><line x1="12" y1="17" x2="12" y2="21"/><line x1="3" y1="12" x2="7" y2="12"/><line x1="17" y1="12" x2="21" y2="12"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>',
  // Jigsaw piece: flat left+bottom, tab bulging up on the top edge,
  // notch biting in on the right edge. Drawn relative so the cubic
  // controls land outside the bounding box for a clear tab/notch.
  puzzle: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4 h5 c0 -3 6 -3 6 0 h5 v5 c-3 0 -3 6 0 6 v5 h-16 z"/></svg>',
};

/* ========== Theme ========== */
function initTheme() {
  const saved = localStorage.getItem('zv-theme');
  if (saved === 'light' || saved === 'dark') {
    document.documentElement.setAttribute('data-theme', saved);
  }
}
function currentTheme() {
  const attr = document.documentElement.getAttribute('data-theme');
  if (attr) return attr;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function toggleTheme() {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('zv-theme', next);
  render();
}
initTheme();

/* ========== Toast ========== */
function toast(msg, kind = '') {
  const el = h('div', { class: 'toast ' + kind }, msg);
  document.getElementById('toasts').append(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; }, 2500);
  setTimeout(() => el.remove(), 2900);
}
const toastOk = (m) => toast(m, 'ok');
const toastErr = (m) => toast(m, 'err');

/* ========== Password-confirm prompt ==========
   Returns the typed password on success or null if cancelled. Pair this
   with requests that set X-Confirm-Password. */
async function promptPassword(title, message) {
  return modal(title, ({ body, close }) => {
    const input = h('input', { type: 'password', autocomplete: 'current-password', required: true });
    const err = h('p', { class: 'err', style: 'display:none' });
    const form = h('form', {},
      message ? h('p', { style: 'margin-bottom:.75rem' }, message) : null,
      h('label', { class: 'field' }, h('span', {}, t('Your password')), input),
      err,
      h('div', { class: 'row end' },
        h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, t('Cancel')),
        h('button', { class: 'btn danger', type: 'submit' }, t('Confirm'))),
    );
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!input.value) { err.style.display = ''; err.textContent = t('password required'); return; }
      close(input.value);
    });
    body.append(form);
    setTimeout(() => input.focus(), 20);
  });
}

/* ========== Modal ========== */
function modal(title, bodyFn, opts = {}) {
  return new Promise((resolve) => {
    const host = document.getElementById('modal-host');
    const body = h('div');
    // Dispatch a synthetic event before teardown so content hooks (e.g.
    // the puzzle editor's parked file input) can clean up whether close
    // is called via Save, Cancel, Esc, or backdrop click.
    const close = (value) => {
      body.dispatchEvent(new CustomEvent('modal:close'));
      host.replaceChildren();
      resolve(value);
    };
    const back = h('div', { class: 'modal-back', on: { click: (e) => { if (e.target === back) close(null); } } },
      h('div', { class: 'modal' + (opts.wide ? ' wide' : '') },
        h('h2', {}, title),
        body,
      ));
    host.replaceChildren(back);
    bodyFn({ body, close });
  });
}

/* ========== State ========== */
const state = {
  me: null,                // {username, role}
  route: location.hash || '#dashboard',
};

window.addEventListener('hashchange', () => {
  state.route = location.hash || '#dashboard';
  render();
});

/* ========== Router ========== */
async function refreshMe() {
  const r = await api('/api/auth/whoami');
  state.me = (r.status === 200) ? r.body : null;
}
function nav(hash) { location.hash = hash; }

async function render() {
  if (!state.me) await refreshMe();
  const root = document.getElementById('root');
  if (!state.me) { root.replaceChildren(renderLogin()); return; }
  if (state.me.role === 'player') {
    root.replaceChildren(h('div', { class: 'login-wrap' },
      h('div', { class: 'login' },
        h('div', { class: 'brand' }, 'zonventure'),
        h('p', {}, t('Logged in as {{username}} (player). This dashboard is for arrangers.', { username: state.me.username })),
        h('p', {}, h('a', { href: '/play' }, t('Go to the player view →'))),
        h('p', {}, h('button', { class: 'btn', on: { click: logout } }, t('Log out'))),
      )));
    return;
  }
  root.replaceChildren(renderShell());
  await renderRoute();
}

function renderLogin(err) {
  const form = h('form', { class: 'login' },
    h('div', { class: 'brand' }, 'zonventure', h('small', {}, t('arranger'))),
    h('label', { class: 'field' },
      h('span', {}, t('Username')),
      h('input', { name: 'u', autocomplete: 'username', required: true })),
    h('label', { class: 'field' },
      h('span', {}, t('Password')),
      h('input', { name: 'p', type: 'password', autocomplete: 'current-password', required: true })),
    err ? h('p', { class: 'err' }, err) : null,
    h('div', { class: 'row end', style: 'margin-top:1rem' },
      h('button', { class: 'btn primary', type: 'submit' }, t('Log in'))),
    h('div', { class: 'row', style: 'margin-top:1rem; justify-content:flex-end' },
      h('label', { class: 'muted', style: 'font-size:.8rem; display:flex; align-items:center; gap:.35rem' },
        t('Language'),
        zvI18n.makeLangPicker({ className: 'zv-lang-picker' }))),
  );
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const r = await api('/api/auth/login', {
      method: 'POST',
      body: JSON.stringify({ username: fd.get('u'), password: fd.get('p') }),
    });
    if (r.ok) { await refreshMe(); render(); }
    else document.getElementById('root').replaceChildren(renderLogin(r.body?.error || t('login failed')));
  });
  return h('div', { class: 'login-wrap' }, form);
}

function renderShell() {
  const role = state.me.role;
  const isAdmin = role === 'admin';
  const isOrgAdmin = role === 'org_admin';
  // Admin runs the multi-tenant plumbing (organizations, other admins).
  // Org users play the game: adventures, runs, players. Org admins also
  // manage their organization's members.
  let items;
  if (isAdmin) {
    items = [
      ['#dashboard',     t('Dashboard'),     ICONS.dashboard],
      ['#organizations', t('Organizations'), ICONS.shield],
      ['#library',       t('Adventures'),    ICONS.map],
      ['#puzzles',       t('Puzzles'),       ICONS.puzzle],
      ['#admins',        t('Admins'),        ICONS.user],
    ];
  } else {
    items = [
      ['#dashboard',  t('Dashboard'),  ICONS.dashboard],
      ['#adventures', t('Adventures'), ICONS.map],
      ['#library',    t('Authoring'),  ICONS.key],
      ['#puzzles',    t('Puzzles'),    ICONS.puzzle],
      ['#runs',       t('Runs'),       ICONS.play],
    ];
    if (isOrgAdmin) items.push(['#members', t('Members'), ICONS.shield]);
  }
  const active = state.route.split('/')[0];

  const nav = h('nav', { class: 'nav' }, items.map(([href, label, svg]) =>
    h('a', {
      href,
      class: active === href ? 'active' : '',
      on: { click: () => { document.querySelector('.sidebar')?.classList.remove('open'); document.querySelector('.backdrop')?.classList.remove('show'); } },
    }, icon(svg), label)));

  const isDark = currentTheme() === 'dark';
  const themeBtn = h('button', {
    class: 'btn',
    title: isDark ? t('Use light theme') : t('Use dark theme'),
    on: { click: toggleTheme },
  }, icon(isDark ? ICONS.sun : ICONS.moon), isDark ? t('Use light theme') : t('Use dark theme'));
  const logoutBtn = h('button', {
    class: 'btn',
    title: t('Log out'),
    on: { click: logout },
  }, icon(ICONS.user), t('Log out ({{username}})', { username: state.me.username }));
  const langPicker = h('label', { class: 'sidebar-lang', title: t('Language') },
    h('span', { class: 'muted' }, t('Language')),
    zvI18n.makeLangPicker({ className: 'zv-lang-picker' }));

  const sidebar = h('aside', { class: 'sidebar' },
    h('div', { class: 'brand' }, 'zonventure',
      h('small', {}, isAdmin ? t('administrator') : t('arranger'))),
    nav,
    h('div', { class: 'sidebar-footer' }, themeBtn, logoutBtn, langPicker));

  const backdrop = h('div', { class: 'backdrop', on: { click: () => {
    document.querySelector('.sidebar').classList.remove('open');
    backdrop.classList.remove('show');
  } } });

  const menuBtn = h('button', {
    class: 'btn ghost menu-btn',
    on: { click: () => {
      document.querySelector('.sidebar').classList.toggle('open');
      backdrop.classList.toggle('show');
    } },
  }, icon(ICONS.menu));

  const topbar = h('header', { class: 'topbar' },
    menuBtn,
    h('span', { class: 'brand' }, 'zonventure'),
    h('div', { class: 'crumb' }, currentCrumb()),
    h('div', { class: 'spacer' }),
  );

  return h('div', { class: 'app' },
    sidebar, topbar,
    h('main', { class: 'content', id: 'view' }),
    backdrop);
}

function currentCrumb() {
  const parts = state.route.replace(/^#/, '').split('/');
  const section = parts[0] || 'dashboard';
  // Map section slugs to their translated nav label so the top breadcrumb
  // tracks the sidebar. Falls through to a capitalised raw slug for
  // anything we don't recognise.
  const LABELS = {
    dashboard:     t('Dashboard'),
    adventures:    t('Adventures'),
    runs:          t('Runs'),
    members:       t('Members'),
    organizations: t('Organizations'),
    library:       t('Library'),
    puzzles:       t('Puzzles'),
    admins:        t('Admins'),
  };
  const sectionLabel = LABELS[section] || (section ? section[0].toUpperCase() + section.slice(1) : '');
  if (section === 'runs' && parts[1]) return t('{{section}} / Run #{{id}}', { section: sectionLabel, id: parts[1] });
  if (section === 'adventures' && parts[1]) return t('{{section}} / {{slug}}', { section: sectionLabel, slug: parts[1] });
  return sectionLabel;
}

async function renderRoute() {
  const view = document.getElementById('view');
  view.replaceChildren(h('p', { class: 'muted' }, t('Loading…')));
  const r = state.route.replace(/^#/, '');
  const [section, arg] = r.split('/');
  const role = state.me.role;
  const isAdmin = role === 'admin';
  const isOrgAdmin = role === 'org_admin';

  // Role-based route guards: admins can't visit org-user pages and vice versa.
  const adminOnly = ['organizations', 'admins'];
  const orgUserOnly = ['adventures', 'runs'];
  if (isAdmin && orgUserOnly.includes(section)) { nav('#organizations'); return; }
  if (!isAdmin && adminOnly.includes(section))   { nav('#dashboard');     return; }
  if (section === 'members' && !isOrgAdmin)      { nav('#dashboard');     return; }

  // Run-detail is the only view with real-time updates. Entering it opens a
  // watch on the arrange WebSocket; leaving it releases that watch so the
  // server stops publishing to this client.
  if (section === 'runs' && arg) {
    watchRun(parseInt(arg, 10));
  } else {
    unwatchRun();
  }

  try {
    switch (section) {
      case '':
      case 'dashboard':    return await viewDashboard(view);
      case 'adventures':   return arg ? await viewAdventureDetail(view, arg) : await viewAdventures(view);
      case 'runs':         return arg ? await viewRunDetail(view, arg) : await viewRuns(view);
      case 'members':      return await viewMembers(view);
      case 'organizations':return await viewOrganizations(view);
      case 'library':      return arg ? await viewLibraryEdit(view, arg) : await viewLibrary(view);
      case 'puzzles':      return arg ? await viewPuzzleEditRoute(view, arg) : await viewPuzzles(view);
      case 'purchases':    return await viewPurchases(view);
      case 'admins':       return await viewAdmins(view);
      default: view.replaceChildren(h('p', {}, t('Not found')));
    }
  } catch (err) {
    view.replaceChildren(h('p', { class: 'err' }, String(err)));
  }
}

/* ========== Arrange subscription stream ========== */
// arrangeWS is a single long-lived connection that pushes run-detail
// updates while an arranger has a run open. Mutations still ride HTTP;
// this socket only receives change notifications so the view stays in
// sync with player progress, team creates, etc., without polling.
let arrangeWS = null;
let arrangeWSBackoff = 500;
let watchedRunID = 0;
let arrangePushTimer = null;

function ensureArrangeWS() {
  if (arrangeWS && (arrangeWS.readyState === 0 || arrangeWS.readyState === 1)) return;
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  arrangeWS = new WebSocket(`${proto}//${location.host}/ws/arrange`);
  arrangeWS.onopen = () => {
    arrangeWSBackoff = 500;
    if (watchedRunID) arrangeWS.send(JSON.stringify({ kind: 'watch_run', data: { run_id: watchedRunID } }));
  };
  arrangeWS.onmessage = (ev) => {
    let msg; try { msg = JSON.parse(ev.data); } catch { return; }
    if (!msg || !msg.kind) return;
    // Any server push re-renders the current run-detail view. Debounced so
    // a burst of changes (eg. multiple position updates from players
    // pinging at once) collapses into a single re-render.
    if (msg.kind === 'positions' || msg.kind === 'tracks' ||
        msg.kind === 'events'   || msg.kind === 'run_detail') {
      if (arrangePushTimer) clearTimeout(arrangePushTimer);
      arrangePushTimer = setTimeout(() => {
        const r = state.route.replace(/^#/, '');
        const [section, arg] = r.split('/');
        if (section === 'runs' && arg) {
          const view = document.getElementById('view');
          if (view) viewRunDetail(view, parseInt(arg, 10));
        }
      }, 300);
    }
  };
  arrangeWS.onclose = () => {
    const delay = Math.min(arrangeWSBackoff, 10000);
    arrangeWSBackoff = Math.min(arrangeWSBackoff * 2, 10000);
    setTimeout(ensureArrangeWS, delay);
  };
}

function watchRun(runID) {
  if (!runID || runID === watchedRunID) { watchedRunID = runID; ensureArrangeWS(); return; }
  watchedRunID = runID;
  ensureArrangeWS();
  if (arrangeWS && arrangeWS.readyState === 1) {
    arrangeWS.send(JSON.stringify({ kind: 'watch_run', data: { run_id: runID } }));
  }
}

function unwatchRun() {
  if (!watchedRunID) return;
  watchedRunID = 0;
  if (arrangeWS && arrangeWS.readyState === 1) {
    arrangeWS.send(JSON.stringify({ kind: 'unwatch_run' }));
  }
}

// openPurchaseModal drives the buy-team-slots flow. The user picks a
// slot count, sees the total, and confirms. The server creates a
// pending purchase and returns a checkout_url — we redirect to it
// (simulated page now, Stripe Checkout later). On success the checkout
// page navigates the user back to #purchases so they see the fresh
// assignment.
async function openPurchaseModal(adv) {
  // Pricing lives server-side (PricePerSlotCents) but the UI has a
  // hardcoded mirror so we can show the total before the POST. If the
  // server price changes this drifts — that's fine for the simulated
  // flow; Stripe will ship a real catalog later.
  const PRICE_CENTS = 200;
  await modal(t('Buy team slots'), ({ body, close }) => {
    const slots = h('input', { type: 'number', min: '1', max: '100', value: '10', required: true });
    const totalEl = h('strong', {}, '');
    const update = () => {
      const n = Math.max(1, parseInt(slots.value, 10) || 0);
      totalEl.textContent = new Intl.NumberFormat(undefined, { style: 'currency', currency: 'USD' })
        .format(n * PRICE_CENTS / 100);
    };
    slots.addEventListener('input', update);
    update();
    const form = h('form', {},
      h('p', {},
        t('Each team slot lets one team play "{{title}}".', { title: adv.title || adv.slug })),
      h('label', { class: 'field' },
        h('span', {}, t('Team slots')), slots),
      h('p', { class: 'muted' },
        t('Total: '), totalEl,
        ' ',
        h('span', { class: 'muted', style: 'font-size:.85rem' },
          t('({{price}} per slot)', { price: '$2.00' }))),
      h('div', { class: 'row end' },
        h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, t('Cancel')),
        h('button', { class: 'btn primary', type: 'submit' }, t('Proceed to payment'))));
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const n = Math.max(1, parseInt(slots.value, 10) || 1);
      const r = await api('/api/admin/purchases', {
        method: 'POST',
        body: JSON.stringify({ adventure_slug: adv.slug, max_teams: n }),
      });
      if (r.status !== 201) {
        toastErr(r.body?.error || `error ${r.status}`);
        return;
      }
      close(true);
      location.href = r.body.checkout_url;
    });
    body.append(form);
  });
}

async function scheduleRun(assignmentID) {
  const body = await modal(t('Schedule run'), ({ body, close }) => {
    const when = h('input', { type: 'datetime-local' });
    const form = h('form', {},
      h('p', { class: 'muted', style: 'font-size:.85rem; margin-bottom:.5rem' },
        t('The run is created in the scheduled state. You can start it manually later, or pick a local time here to have the server auto-start it.')),
      h('label', { class: 'field' }, h('span', {}, t('Auto-start at (optional)')), when),
      h('div', { class: 'row end' },
        h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, t('Cancel')),
        h('button', { class: 'btn primary', type: 'submit' }, t('Create run'))),
    );
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const req = { assignment_id: assignmentID };
      if (when.value) {
        // datetime-local is parsed as local time; toISOString emits UTC.
        const d = new Date(when.value);
        if (Number.isNaN(d.getTime())) { toastErr(t('Bad date')); return; }
        req.scheduled_at = d.toISOString();
      }
      close(req);
    });
    body.append(form);
  });
  if (!body) return;
  const r = await api('/api/admin/runs', { method: 'POST', body: JSON.stringify(body) });
  if (r.status === 201) { toastOk(t('Run #{{id}} scheduled', { id: r.body.id })); nav('#runs/' + r.body.id); }
  else toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
}

// Public share bar: shows the absolute /live/{token} URL (opaque) so the
// arranger can read/copy it and send it to whoever's running the TV
// screen.
function renderShareBar(run) {
  const url = `${location.origin}/live/${run.live_token}`;
  const urlBox = h('input', {
    readonly: '', value: url,
    style: 'flex:1; min-width:0; background:var(--surface-2); font-family:ui-monospace,SFMono-Regular,monospace; font-size:.9rem; box-shadow:none; border-color:var(--border-soft)',
    on: { click: (e) => e.target.select() },
  });
  const copyBtn = h('button', {
    class: 'btn small', type: 'button', title: t('Copy link'),
    on: { click: async () => {
      try {
        await navigator.clipboard.writeText(url);

        document.execCommand('copy');

    h('p', { class: 'muted mono' }, run.adventure_slug),
    renderShareBar(run),
    h('div', { class: 'card' },

// initRunMap mounts a Leaflet map inside host. Puzzle pins come from the
// adventure (all pages always have a location now); per-team polylines and
// latest-position dots come from the tracks payload.
function initRunMap(host, adventure, teams, tracks) {
  if (typeof L === 'undefined') {
    host.replaceChildren(h('div', { class: 'empty' }, t('Map library is still loading — refresh the page.')));
    return;
  }
  const map = L.map(host, { scrollWheelZoom: false }).setView([59.3293, 18.0686], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 19,
  }).addTo(map);

  const bounds = L.latLngBounds([]);

  // Puzzle markers.
  for (const p of (adventure.pages || [])) {
    const ll = [p.location.lat, p.location.lng];
    const marker = L.marker(ll, {
      icon: L.divIcon({
        className: '',
        html: `<div class="puzzle-marker ${p.gated ? 'gated' : ''}"><span>${p.index + 1}</span></div>`,
        iconSize: [28, 28],
        iconAnchor: [14, 28],
      }),
    }).addTo(map);
    marker.bindPopup(
      `<strong>${p.index + 1}. ${p.title || t('Puzzle')}</strong>` +
      (p.gated && p.location.radius_m
        ? `<br><em>${t('Gated — {{r}} m', { r: p.location.radius_m })}</em>`
        : '') +
      `<br><small>${p.location.lat.toFixed(5)}, ${p.location.lng.toFixed(5)}</small>`
    );
    bounds.extend(ll);
  }

  // Team traces.
  const teamByID = new Map();
  teams.forEach((t, i) => teamByID.set(t.id, { team: t, i }));
  for (const track of tracks) {
    const info = teamByID.get(track.team_id);
    const colour = teamColor(track.team_id, info ? info.i : 0);
    if (track.points.length > 0) {
      const latlngs = track.points.map((p) => [p.lat, p.lng]);
      L.polyline(latlngs, { color: colour, weight: 3, opacity: .85 }).addTo(map);
      const latest = track.points[track.points.length - 1];
      L.marker([latest.lat, latest.lng], {
        icon: L.divIcon({
          className: '',
          html: `<div class="team-dot" style="background:${colour}"></div>`,
          iconSize: [14, 14],
          iconAnchor: [7, 7],
        }),
      }).bindPopup(`<strong>${track.team_name}</strong><br><small>${fmtLocal(latest.server_ts)}</small>`).addTo(map);
      for (const ll of latlngs) bounds.extend(ll);
    }
  }

  if (bounds.isValid()) {
    map.fitBounds(bounds, { padding: [24, 24] });
  }
}

// renderEventFeed turns the run_events JSON into a readable timeline.
function renderEventFeed(events, teams) {
  if (!events.length) return h('div', { class: 'empty' }, t('No activity yet.'));
  const ul = h('ul', { class: 'feed' });
  for (const e of events) ul.append(renderEvent(e, teams));
  return ul;
}

function renderEvent(e, teams) {
  const p = e.payload || {};
  let badge = 'neutral', symbol = '•', msg, meta;
  const team = h('strong', {}, e.team_name || '');
  switch (e.kind) {
    case 'run.created':
      badge = 'brand'; symbol = '+'; msg = h('span', { class: 'msg' }, t('Run created for '), h('strong', {}, p.adventure_slug || '')); break;
    case 'run.started': badge = 'good'; symbol = '▶'; msg = h('span', { class: 'msg' }, t('Run started')); break;
    case 'run.paused':  badge = 'neutral'; symbol = '‖'; msg = h('span', { class: 'msg' }, t('Run paused')); break;
    case 'run.resumed': badge = 'good'; symbol = '▶'; msg = h('span', { class: 'msg' }, t('Run resumed')); break;
    case 'team.created':
      badge = 'brand'; symbol = '+'; msg = h('span', { class: 'msg' }, t('Team '), h('strong', {}, e.team_name || p.name || ''), t(' created'));
      if ((p.members || []).length) meta = t('with {{names}}', { names: (p.members || []).join(', ') }); break;
    case 'team.renamed':
      badge = 'neutral'; symbol = '✎'; msg = h('span', { class: 'msg' }, t('Renamed '), h('strong', {}, p.from || ''), ' → ', h('strong', {}, p.to || '')); break;
    case 'team.deleted':
      badge = 'bad'; symbol = '×'; msg = h('span', { class: 'msg' }, t('Team '), h('strong', {}, p.name || ''), t(' deleted')); break;
    case 'team.member.added':
      badge = 'good'; symbol = '+'; msg = h('span', { class: 'msg' }, t('Added '), h('strong', {}, p.username || ''), t(' to '), h('strong', {}, e.team_name || '')); break;
    case 'team.member.removed':
      badge = 'neutral'; symbol = '−'; msg = h('span', { class: 'msg' }, t('Removed '), h('strong', {}, p.username || ''), t(' from '), h('strong', {}, e.team_name || '')); break;
    case 'answer.wrong':
      badge = 'bad'; symbol = '✗'; msg = h('span', { class: 'msg' }, team, t(' wrong on puzzle {{n}}', { n: (p.page_index ?? 0) + 1 }));
      if (p.submitted) meta = t('submitted “{{answer}}”', { answer: p.submitted }); break;
    case 'answer.right':
      badge = 'good'; symbol = '✓'; msg = h('span', { class: 'msg' }, team, t(' solved puzzle {{n}}', { n: (p.page_index ?? 0) + 1 })); break;
    case 'team.completed':
      badge = 'good'; symbol = '★'; msg = h('span', { class: 'msg' }, team, t(' finished the adventure!')); break;
    case 'team.unlocked':
      badge = 'brand'; symbol = '⇨'; msg = h('span', { class: 'msg' },
        team, t(' skipped past puzzle {{n}}', { n: (p.from_page_index ?? 0) + 1 }));
      if (p.by_arranger) meta = t('by arranger'); break;
    case 'gate.reached':
      badge = 'brand'; symbol = '⛳'; msg = h('span', { class: 'msg' }, team, t(' reached the puzzle location')); break;
    default:
      msg = h('span', { class: 'msg' }, e.kind);
  }
  return h('li', {},
    h('span', { class: 'badge ' + badge }, symbol),
    h('div', {},
      msg,
      e.actor ? h('div', { class: 'meta' }, t('by {{actor}}', { actor: e.actor }) + (meta ? ' · ' + meta : ''))
              : (meta ? h('div', { class: 'meta' }, meta) : null),
    ),
    h('time', { datetime: e.created_at }, formatEventTime(e.created_at)),
  );
}

// fmtLocal turns a server timestamp (SQLite "YYYY-MM-DD HH:MM:SS" UTC, or an
// RFC3339 string) into the viewer's local time. Returns '—' for empty input
// and the raw value when it can't be parsed, so we never show "Invalid Date".
function fmtLocal(s, opts) {
  if (!s) return '—';
  const iso = s.includes('T') ? s : s.replace(' ', 'T') + 'Z';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return s;
  return d.toLocaleString(undefined, opts || { dateStyle: 'medium', timeStyle: 'short' });
}

function formatEventTime(s) {
  if (!s) return '';
  // SQLite datetime('now') returns "YYYY-MM-DD HH:MM:SS" in UTC. Let users
  // see something friendlier; locale defaults are fine.
  const d = new Date(s.includes('T') ? s : s.replace(' ', 'T') + 'Z');
  if (Number.isNaN(d.getTime())) return s;
  const now = Date.now();
  const diff = (now - d.getTime()) / 1000;
  if (diff < 60) return t('just now');
  if (diff < 3600) return t('{{n}}m ago', { n: Math.round(diff / 60) });
  if (diff < 86400) return t('{{n}}h ago', { n: Math.round(diff / 3600) });
  return d.toLocaleString();
}

function btn(label, cls, fn) {
  return h('button', { class: 'btn ' + (cls || ''), on: { click: fn } }, label);
}

async function transition(runID, action) {
  const r = await api(`/api/admin/runs/${runID}/${action}`, { method: 'POST' });
  if (r.status === 204) {
    // Map each action verb to a localised past-tense confirmation so
    // toastOk doesn't end up as Swedish "Pause" + English "-ed".
    const TRANSITION_OK = {
      start:  t('Started'),
      pause:  t('Paused'),
      resume: t('Resumed'),
    };
    toastOk(TRANSITION_OK[action] || action);
    renderRoute();
  } else {
    toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
  }
}

async function confirmStart(run) {
  const ok = await modal(t('Start this run now?'), ({ body, close }) => {
    body.append(
      h('p', {},
        t('Starting the run opens the first puzzle to all teams. '),
        run.scheduled_at
          ? h('span', {},
              t('An auto-start is currently scheduled for '),
              h('strong', {}, fmtLocal(run.scheduled_at)),
              t('. Starting now will replace that.'))
          : t('You can pause it later if needed.')),
      h('div', { class: 'row end', style: 'margin-top:1rem' },
        h('button', { class: 'btn', on: { click: () => close(false) } }, t('Cancel')),
        h('button', { class: 'btn primary', on: { click: () => close(true) } }, t('Start run'))),
    );
  });
  if (!ok) return;
  await transition(run.id, 'start');
}

async function openEditSchedule(run) {
  // Pre-fill the datetime-local input from the current UTC-stored value.
  // The input wants "YYYY-MM-DDTHH:MM" in local time; use the Date object to
  // convert without a chunky date library.
  let prefill = '';
  if (run.scheduled_at) {
    const iso = run.scheduled_at.includes('T') ? run.scheduled_at : run.scheduled_at.replace(' ', 'T') + 'Z';
    const d = new Date(iso);
    if (!Number.isNaN(d.getTime())) {
      const pad = (n) => String(n).padStart(2, '0');
      prefill = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
  }

  await modal(run.scheduled_at ? t('Change auto-start') : t('Set auto-start'), ({ body, close }) => {
    const when = h('input', { type: 'datetime-local', value: prefill });
    const form = h('form', {},
      h('p', { class: 'muted', style: 'font-size:.85rem; margin-bottom:.5rem' },
        t('The server will flip the run to running automatically at the time below. Leave empty and hit Clear to remove the auto-start.')),
      h('label', { class: 'field' }, h('span', {}, t('Auto-start at')), when),
      h('div', { class: 'row between', style: 'margin-top:.5rem' },
        run.scheduled_at
          ? h('button', { class: 'btn danger', type: 'button', on: { click: async () => {
              close(null);
              await patchSchedule(run.id, '');
            } } }, t('Clear'))
          : h('span', {}),
        h('div', { class: 'row' },
          h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, t('Cancel')),
          h('button', { class: 'btn primary', type: 'submit' }, t('Save')))),
    );
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!when.value) { toastErr(t('Pick a date or use Clear')); return; }
      const d = new Date(when.value);
      if (Number.isNaN(d.getTime())) { toastErr(t('Bad date')); return; }
      close(null);
      await patchSchedule(run.id, d.toISOString());
    });
    body.append(form);
  });
}

async function patchSchedule(runID, iso) {
  const r = await api(`/api/admin/runs/${runID}`, {
    method: 'PATCH',
    body: JSON.stringify({ scheduled_at: iso }),
  });
  if (r.status === 204) {
    toastOk(iso ? t('Schedule updated') : t('Auto-start cleared'));
    renderRoute();
  } else {
    toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
  }
}

async function openTeamDetail(runID, team, adventure) {
  // Fetch events filtered to this team.
  const evR = await api(`/api/admin/runs/${runID}/events?team_id=${team.id}`);
  const events = evR.body?.events || [];
  const page = adventure?.pages?.[team.page_index];
  const last = adventure?.pages ? adventure.pages.length : null;
  const finished = team.completed_at || (last !== null && team.page_index >= last);

  await modal(t('Team · {{name}}', { name: team.name }), ({ body, close }) => {
    const summary = h('div', { class: 'row between', style: 'margin-bottom:.75rem' },
      h('div', {},
        h('div', { class: 'muted', style: 'font-size:.8rem; text-transform:uppercase; letter-spacing:.05em; font-weight:700' },
          finished
            ? t('Finished')
            : (last
                ? t('Puzzle {{i}} of {{n}}', { i: team.page_index + 1, n: last })
                : t('Puzzle {{i}}', { i: team.page_index + 1 }))),
        page && !finished ? h('div', {}, h('strong', {}, page.title || t('(untitled)'))) : null,
      ),
      h('div', {},
        (team.members || []).map((m) => h('span', { class: 'chip', style: 'margin-right:.25rem' }, m.name)),
      ),
    );

    const actions = h('div', { class: 'row', style: 'margin-bottom:.75rem; flex-wrap:wrap' });
    if (!finished) {
      actions.append(h('button', { class: 'btn primary', on: { click: () => skipPuzzle(team, close) } },
        icon(ICONS.key), t('Skip this puzzle')));
    }
    actions.append(h('button', { class: 'btn', on: { click: () => { close(null); openTeamModal(runID, team); } } },
      t('Edit members')));
    actions.append(h('button', { class: 'btn danger', on: { click: async () => { close(null); await confirmDeleteTeam(team); } } },
      icon(ICONS.trash), t('Delete')));

    body.append(
      summary,
      actions,
      h('h3', {}, t('Activity')),
      renderEventFeed(events, [team]),
      h('div', { class: 'row end', style: 'margin-top:1rem' },
        h('button', { class: 'btn', on: { click: () => close(null) } }, t('Close'))),
    );
  }, { wide: true });
}

async function skipPuzzle(team, close) {
  const ok = await modal(t('Skip puzzle for {{name}}?', { name: team.name }), ({ body, close: c }) => {
    body.append(
      h('p', {}, t('This advances the team past their current puzzle without them submitting the answer. Useful when they\'re stuck. The action is recorded in the event log.')),
      h('div', { class: 'row end' },
        h('button', { class: 'btn', on: { click: () => c(false) } }, t('Cancel')),
        h('button', { class: 'btn primary', on: { click: () => c(true) } }, t('Skip puzzle'))),
    );
  });
  if (!ok) return;
  const r = await api(`/api/admin/teams/${team.id}/unlock`, { method: 'POST' });
  if (r.ok) {
    toastOk(r.body?.completed
      ? t('{{name}} finished', { name: team.name })
      : t('{{name}} advanced', { name: team.name }));
    close(true);
    renderRoute();
  } else {
    toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
  }
}

async function confirmDeleteTeam(team) {
  const pw = await promptPassword(t('Delete team “{{name}}”?', { name: team.name }),
    t('This removes the team and all its progress. Members stay as player accounts. Enter your password to confirm.'));
  if (!pw) return;
  const r = await api(`/api/admin/teams/${team.id}`, {
    method: 'DELETE',
    headers: { 'X-Confirm-Password': pw },
  });
  if (r.status === 204) { toastOk(t('Team deleted')); renderRoute(); }
  else toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
}

// openTeamModal handles both new-team and edit-team. For a new team the
// arranger types a team name plus one name per line; each line becomes a
// slot with its own magic-link token. For an existing team the modal lets
// the arranger rename, copy each slot's link, rotate a link, remove a
// slot, or add a new slot inline.
async function openTeamModal(runID, existing) {
  if (existing) return openEditTeamModal(runID, existing);
  return openNewTeamModal(runID);
}

async function openNewTeamModal(runID) {
  await modal(t('New team'), ({ body, close }) => {
    const nameInput = h('input', { name: 'name', required: true, autofocus: true });
    const memberArea = h('textarea', {
      name: 'members', rows: 5,
      placeholder: 'alice\nbob\ncharlie',
      required: true,
    });
    const submitBtn = h('button', { class: 'btn primary', type: 'submit' }, t('Create team'));
    const form = h('form', {},
      h('label', { class: 'field' }, h('span', {}, t('Team name')), nameInput),
      h('label', { class: 'field' },
        h('span', {}, t('Members — one name per line')),
        memberArea),
      h('p', { class: 'muted', style: 'font-size:.8rem' },
        t('Each line becomes a player slot with its own magic-link token. '),
        t('You can copy the per-player link after the team is created.')),
      h('div', { class: 'row end', style: 'margin-top:1rem' },
        h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, t('Cancel')),
        submitBtn));
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const names = (memberArea.value || '').split('\n')
        .map((s) => s.trim()).filter(Boolean);

async function openEditTeamModal(runID, existing) {
  // Refresh the team detail so we pick up any changes since the page
  // rendered — tokens can rotate and we want the latest.
  const r = await api('/api/admin/runs/' + runID);
  const run = r.body || {};
  const freshTeam = (run.teams || []).find((t) => t.id === existing.id) || existing;

  await modal(t('Edit team · {{name}}', { name: freshTeam.name }), ({ body, close }) => {
    const nameInput = h('input', { value: freshTeam.name, required: true });
    const renameBtn = h('button', { class: 'btn small', type: 'button' }, t('Save name'));
    renameBtn.addEventListener('click', async () => {
      const name = nameInput.value.trim();
      if (!name || name === freshTeam.name) return;
      const rr = await api(`/api/admin/teams/${freshTeam.id}`, {
        method: 'PATCH', body: JSON.stringify({ name }),
      });
      if (rr.status === 204) { toastOk(t('Renamed')); close(true); renderRoute(); }
      else toastErr(rr.body?.error || t('error {{status}}', { status: rr.status }));
    });

    const membersWrap = h('div', {});
    const rebuildMembers = () => {
      membersWrap.replaceChildren();
      const rows = (freshTeam.members || []).map((m) => renderSlotRow(freshTeam.id, m, reload));
      if (rows.length === 0) {
        membersWrap.append(h('p', { class: 'muted' }, t('No members yet. Add one below.')));
      } else {
        membersWrap.append(...rows);
      }
    };

    async function reload() {
      const rr = await api('/api/admin/runs/' + runID);
      const fresh = (rr.body?.teams || []).find((t) => t.id === freshTeam.id);
      if (!fresh) { close(true); renderRoute(); return; }
      freshTeam.members = fresh.members;
      freshTeam.name = fresh.name;
      rebuildMembers();
    }

    // Inline "add slot"
    const newName = h('input', { placeholder: t('New member name') });
    const addBtn = h('button', { class: 'btn primary small', type: 'button' }, icon(ICONS.plus), t('Add'));
    const addRow = h('div', { class: 'row', style: 'gap:.4rem; margin-top:.75rem' }, newName, addBtn);
    addBtn.addEventListener('click', async () => {
      const name = newName.value.trim();
      if (!name) return;
      const rr = await api(`/api/admin/teams/${freshTeam.id}/slots`, {
        method: 'POST', body: JSON.stringify({ name }),
      });
      if (rr.status === 201) {
        newName.value = '';
        toastOk(t('Added {{name}}', { name: rr.body.name }));
        await reload();
      } else {
        toastErr(rr.body?.error || t('error {{status}}', { status: rr.status }));
      }
    });
    newName.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addBtn.click(); } });

    body.append(
      h('label', { class: 'field' }, h('span', {}, t('Team name')),
        h('div', { class: 'row', style: 'gap:.4rem' }, nameInput, renameBtn)),
      h('h3', { style: 'margin-top:1rem' }, t('Members')),
      membersWrap,
      addRow,
      h('div', { class: 'row end', style: 'margin-top:1rem' },
        h('button', { class: 'btn', on: { click: () => close(null) } }, t('Close'))));
    rebuildMembers();
  }, { wide: true });
}

function renderSlotRow(teamID, slot, reload) {
  const url = `${location.origin}/play?t=${encodeURIComponent(slot.token)}`;
  const urlInput = h('input', {
    readonly: '', value: url,
    style: 'flex:1; min-width:0; font-family:ui-monospace,monospace; font-size:.8rem; box-shadow:none; border-color:var(--border-soft); margin:0',
    on: { click: (e) => e.target.select() },
  });
  const copyBtn = h('button', { class: 'btn small', type: 'button', title: t('Copy link') }, t('Copy'));
  copyBtn.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(url); toastOk(t('Link copied')); }
    catch { urlInput.select(); document.execCommand('copy'); toastOk(t('Link copied')); }
  });
  const rotateBtn = h('button', { class: 'btn small', type: 'button', title: t('Rotate link') }, '↻');
  rotateBtn.addEventListener('click', async () => {
    const rr = await api(`/api/admin/teams/${teamID}/slots/${slot.id}/rotate`, { method: 'POST' });
    if (rr.status === 200) { toastOk(t('Link rotated')); reload(); }
    else toastErr(rr.body?.error || t('error {{status}}', { status: rr.status }));
  });
  const removeBtn = h('button', { class: 'btn small danger', type: 'button', title: t('Remove slot') }, icon(ICONS.trash));
  removeBtn.addEventListener('click', async () => {
    const rr = await api(`/api/admin/teams/${teamID}/slots/${slot.id}`, { method: 'DELETE' });
    if (rr.status === 204) { toastOk(t('Removed')); reload(); }
    else toastErr(rr.body?.error || t('error {{status}}', { status: rr.status }));
  });
  return h('div', { style: 'margin-bottom:.5rem' },
    h('div', { class: 'row', style: 'gap:.4rem; align-items:center' },
      h('strong', { style: 'min-width:8ch' }, slot.name),
      urlInput, copyBtn, rotateBtn, removeBtn),
    slot.last_login_at
      ? h('div', { class: 'muted', style: 'font-size:.75rem; margin-left:.5rem' },
          t('last login {{when}}', { when: fmtLocal(slot.last_login_at) }))
      : null);
}

  const usersPart = members.length === 1
    ? t('{{n}} user', { n: members.length })

    ? t('{{n}} player', { n: playersCount })

    members.length === 0
      ? h('p', { class: 'muted', style: 'font-size:.85rem' }, t('No users yet — add one to get started.'))

// pendingQuickPuzzleGPS is the in-flight GPS fix kicked off by a
// quickPuzzle tap. The puzzle itself is created without waiting, so
// the editor opens immediately; when the fix eventually arrives, the
// matching editor applies it to the location — unless the author has
// set it manually in the meantime.
let pendingQuickPuzzleGPS = null; // { puzzleID, promise } | null

// quickPuzzle creates a stub via POST /api/admin/puzzles and navigates
// to the new puzzle's editor without waiting on GPS. A location fix is
// requested in the background and applied by the editor if one arrives
// before the author sets a location manually. Designed for the
// "standing somewhere, want to remember this spot" flow — one tap
// after the page is already loaded.
async function quickPuzzle(ev) {
  const btn = ev?.currentTarget;
  if (btn) btn.disabled = true;
  const gpsPromise = navigator.geolocation
    ? new Promise((resolve) => {
        navigator.geolocation.getCurrentPosition(
          (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
          () => resolve(null),
          { enableHighAccuracy: true, maximumAge: 10000, timeout: 30000 },
        );
      })
    : Promise.resolve(null);
  const r = await api('/api/admin/puzzles', {
    method: 'POST',
    body: JSON.stringify({}),
  });
  if (btn) btn.disabled = false;
  if (r.status !== 201) { toastErr(r.body?.error || t('error {{status}}', { status: r.status })); return; }
  toastOk(t('Puzzle captured'));
  pendingQuickPuzzleGPS = { puzzleID: r.body.id, promise: gpsPromise };
  nav('#puzzles/' + r.body.id);
}

function renderPuzzleLibraryCard(p) {
  const assignment = p.adventure_slug
    ? h('span', { class: 'pill accent', title: t('Assigned to adventure') },
        `${p.adventure_title} · #${(p.adventure_idx ?? 0) + 1}`)
    : h('span', { class: 'pill' }, t('library'));
  const subtitle = p.notes
    ? h('p', { class: 'muted', style: 'font-style:italic' }, p.notes)
    : p.prompt
      ? h('p', { class: 'muted', style: 'white-space:pre-wrap; overflow:hidden; max-height:3em' }, p.prompt)
      : h('p', { class: 'muted' }, t('(no content yet)'));
  return h('div', {
    class: 'card clickable' + (p.disabled ? '' : ''),
    style: p.disabled ? 'opacity:.6' : '',
    on: { click: () => nav('#puzzles/' + p.id) },
  },
    h('div', { class: 'row between' },
      h('h3', {}, p.title || t('(untitled)')),
      h('div', { class: 'row' },
        p.disabled ? h('span', { class: 'pill' }, t('disabled')) : null,
        p.gated ? h('span', { class: 'pill warning' }, t('gated')) : null,
        assignment)),
    subtitle,
    h('p', { class: 'muted mono', style: 'font-size:.8rem' },
      `${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}`,
      p.radius_m ? t(' · gate {{r}} m', { r: p.radius_m }) : '',
      p.has_images ? t(' · has images') : ''),
  );
}

// viewPuzzleEditRoute supports deep-linking #puzzles/<id> straight into
// the editor. For an attached puzzle we also fetch the parent adventure
// so the timeline can render the siblings; for a library puzzle we pass
// adv=null and the editor renders in standalone mode.
//
// The Puzzles library is painted behind the modal so that when the
// editor closes (Cancel, backdrop click, Esc) the user lands on the
// list instead of a blank placeholder view.
async function viewPuzzleEditRoute(view, pageID) {
  await viewPuzzles(view);
  const r = await api('/api/admin/puzzles/' + encodeURIComponent(pageID));
  if (r.status !== 200) {
    toastErr(r.body?.error || t('puzzle not found'));
    return;
  }
  const page = r.body;
  let adv = null;
  if (page.adventure_slug) {
    const er = await api('/api/admin/adventures/' + encodeURIComponent(page.adventure_slug) + '/edit');
    if (er.ok) {
      adv = er.body;
      // Use the authoritative copy from the adventure so the editor
      // and timeline agree on sibling page identities.
      const fresh = adv.pages.find((pp) => pp.id === page.id);
      if (fresh) Object.assign(page, fresh);
    }
  }
  openEditPuzzle(adv, page);
}

// colorRow builds a labelled row with a type=color picker, a "use default"
// reset button, and a live text readout. Empty initial means "use the
// default theme" — the picker renders greyed so admins see the field is
// unset. get() returns "" (use default) or "#rrggbb".
function colorRow(label, initial) {
  const state = { value: initial || '' };
  const picker = h('input', { type: 'color', value: initial || '#808080' });
  const reset  = h('button', { class: 'btn small', type: 'button', title: t('Use default') }, t('Reset'));
  const show   = h('span', { class: 'muted mono', style: 'font-size:.8rem' },
    initial ? initial : t('(default)'));
  const refresh = () => {
    show.textContent = state.value || t('(default)');
    picker.style.opacity = state.value ? '1' : '.45';
  };
  picker.addEventListener('input', () => { state.value = picker.value; refresh(); });
  reset.addEventListener('click',  () => { state.value = ''; refresh(); });
  refresh();
  return {
    el: h('label', { class: 'field' },
      h('span', {}, label),
      h('div', { class: 'row', style: 'gap:.5rem; align-items:center' }, picker, reset, show)),
    get: () => state.value,
  };
}
