<body>
<div id="root"></div>
<div id="modal-host"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script>
/* ========== API helper ========== */
// csrfToken reads the zv_csrf cookie set by the server's EnsureCSRF
// middleware. We echo it back as X-CSRF-Token on every mutating
// request — the server compares header == cookie. A cross-origin
// attacker can't read document.cookie for our domain, so they can't
// forge the header even if the browser would attach our cookies.
function csrfToken() {
  const m = document.cookie.match(/(?:^|;\s*)zv_csrf=([^;]+)/);
  return m ? decodeURIComponent(m[1]) : '';
}
async function api(path, opts = {}) {
  const headers = { ...(opts.body ? { 'Content-Type': 'application/json' } : {}), ...(opts.headers || {}) };
  const method = (opts.method || 'GET').toUpperCase();
  if (method !== 'GET' && method !== 'HEAD' && method !== 'OPTIONS') {
    headers['X-CSRF-Token'] = csrfToken();
  }
  const res = await fetch(path, {
    credentials: 'same-origin',
    ...opts,
    headers,
  });
  let body = null;
  if (res.status !== 204) {
    try { body = await res.json(); } catch {}
  }
  // Translate the server's error message through the i18n table so
  // toasts surface in the user's language without each call site
  // having to remember to wrap. t() falls through to the English
  // string when no translation exists, so this is a no-op for
  // strings we haven't localised yet — never breaks an existing
  // surface, just upgrades it.
  if (body && typeof body.error === 'string') {
    body.error = t(body.error);
  }
  // Expose Retry-After (in seconds) when the server tells us to wait.
  // Login lockouts and rate-limited paths use it for their countdown
  // UI; null when the header is absent.
  const ra = res.headers.get('Retry-After');
  const retryAfter = ra ? parseInt(ra, 10) || 0 : 0;
  return { status: res.status, ok: res.ok, body, retryAfter };
}

// downscaleImage caps an uploaded image's longer side at maxDim and
// re-encodes it as JPEG before it goes on the wire. The server caps
// stored images at 512 px anyway (internal/imageutil) — sending the
// raw camera file (often 10+ MB) is wasted upload bandwidth that
// hurts the most on mobile uplinks. A modest client-side cap at
// 1600 px leaves the server's higher-quality CatmullRom downscale to
// do the final reduction without the mobile user waiting on a
// multi-megabyte upload first.
//
// Falls back to the original file on anything unexpected (animated
// formats, SVG, decode failure, browser without canvas/toBlob) — the
// server-side shrink + size cap is the safety net.
async function downscaleImage(file, maxDim = 1600, quality = 0.85) {
  if (!file || !file.type || !file.type.startsWith('image/')) return file;
  // GIF would lose animation; SVG is vector and doesn't benefit.
  if (file.type === 'image/gif' || file.type === 'image/svg+xml') return file;
  if (typeof createImageBitmap !== 'function') return file;
  let bitmap;
  try {
    bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
  } catch {
    return file;
  }
  try {
    const w = bitmap.width;
    const h = bitmap.height;
    const longer = Math.max(w, h);
    if (longer <= maxDim) return file;
    const scale = maxDim / longer;
    const dw = Math.max(1, Math.round(w * scale));
    const dh = Math.max(1, Math.round(h * scale));
    const canvas = document.createElement('canvas');
    canvas.width = dw;
    canvas.height = dh;
    const ctx = canvas.getContext('2d');
    if (!ctx) return file;
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(bitmap, 0, 0, dw, dh);
    const blob = await new Promise((resolve) =>
      canvas.toBlob(resolve, 'image/jpeg', quality));
    if (!blob || blob.size >= file.size) return file;
    const baseName = (file.name || 'image').replace(/\.[^.]+$/, '');
    return new File([blob], baseName + '.jpg', {
      type: 'image/jpeg',
      lastModified: Date.now(),
    });
  } catch {
    return file;
  } finally {
    bitmap.close?.();
  }
}

/* ========== DOM helper ========== */
function h(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'on') for (const [ev, fn] of Object.entries(v)) e.addEventListener(ev, fn);
    else if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k in e && typeof e[k] !== 'function') {
      try { e[k] = v; } catch { e.setAttribute(k, v); }
    } else e.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c === null || c === undefined || c === false) continue;
    e.append(c?.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
const icon = (svg) => {
  const s = h('span');
  s.innerHTML = svg;
  return s.firstElementChild;
};

// iconBtn is the shared recipe for icon-only action buttons. It stops
// click propagation so buttons inside a clickable card don't trigger
// the card's own click handler, and always sets a title/aria-label so
// screen readers and hover tooltips explain the glyph.
function iconBtn(iconKey, title, onClick, opts = {}) {
  const cls = ['btn', 'icon', 'small'];
  if (opts.danger)  cls.push('danger');
  if (opts.primary) cls.push('primary');
  if (opts.ghost)   cls.push('ghost');
  return h('button', {
    class: cls.join(' '),
    type: 'button',
    title,
    'aria-label': title,
    on: { click: (e) => { e.stopPropagation(); onClick(e); } },
  }, icon(ICONS[iconKey]));
}

// makeOTPBoxes builds a row of six grouped 1-digit inputs for TOTP code
// entry. Returns { node, getValue, focus, clear, boxes }.
//
// Behaviour:
//   - typing a digit auto-advances to the next box
//   - Backspace on an empty box jumps back and clears the prior digit
//   - ←/→ arrows move between boxes
//   - paste in any box distributes digits forward (junk stripped)
//   - autofill / IME paths that deliver multi-char input events are
//     also fanned out across the remaining boxes
//   - onComplete fires once all six boxes hold a digit
function makeOTPBoxes(opts) {
  opts = opts || {};
  const onComplete = opts.onComplete || (() => {});
  const autofocus = opts.autofocus === true;
  const boxes = [];
  for (let i = 0; i < 6; i++) {
    boxes.push(h('input', {
      type: 'text', inputmode: 'numeric', pattern: '[0-9]*',
      maxlength: 1,
      autocomplete: i === 0 ? 'one-time-code' : 'off',
      'aria-label': t('Digit {{n}}', { n: i + 1 }),
      class: 'otp-box',
      ...(autofocus && i === 0 ? { autofocus: '' } : {}),
    }));
  }
  const getValue = () => boxes.map((b) => b.value).join('');
  const fillFrom = (s, startIdx) => {
    const digits = (s || '').replace(/\D/g, '').slice(0, 6 - startIdx);
    for (let i = 0; i < digits.length; i++) boxes[startIdx + i].value = digits[i];
    const landing = Math.min(startIdx + digits.length, boxes.length - 1);
    boxes[landing].focus();
    if (boxes[landing].value) boxes[landing].select();
    if (getValue().length === 6) onComplete(getValue());
  };
  for (let i = 0; i < boxes.length; i++) {
    const b = boxes[i];
    b.addEventListener('input', () => {
      const v = b.value;
      if (v.length > 1) { b.value = ''; fillFrom(v, i); return; }
      if (!/^\d$/.test(v)) { b.value = ''; return; }
      if (i < boxes.length - 1) boxes[i + 1].focus();
      if (getValue().length === 6) onComplete(getValue());
    });
    b.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !b.value && i > 0) {
        boxes[i - 1].focus(); boxes[i - 1].value = ''; e.preventDefault();
      } else if (e.key === 'ArrowLeft' && i > 0) {
        boxes[i - 1].focus(); e.preventDefault();
      } else if (e.key === 'ArrowRight' && i < boxes.length - 1) {
        boxes[i + 1].focus(); e.preventDefault();
      }
    });
    b.addEventListener('paste', (e) => {
      const data = (e.clipboardData || window.clipboardData)?.getData('text') || '';
      if (!data) return;
      e.preventDefault();
      fillFrom(data, i);
    });
    b.addEventListener('focus', () => b.select());
  }
  return {
    node: h('div', { class: 'otp-row' }, ...boxes),
    boxes,
    getValue,
    focus: () => boxes[0].focus(),
    clear: () => { for (const b of boxes) b.value = ''; boxes[0].focus(); },
  };
}

/* ========== Theme ========== */
function initTheme() {
  const saved = localStorage.getItem('zv-theme');
  if (saved === 'light' || saved === 'dark') {
    document.documentElement.setAttribute('data-theme', saved);
  }
}
function currentTheme() {
  const attr = document.documentElement.getAttribute('data-theme');
  if (attr) return attr;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function toggleTheme() {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('zv-theme', next);
  render();
}
initTheme();

/* ========== Toast ========== */
function toast(msg, kind = '') {
  // Errors get role="alert" + aria-live="assertive" so screen readers
  // interrupt; success/info toasts use role="status" + polite so they
  // queue behind whatever the user is reading.
  const isErr = kind === 'err';
  const el = h('div', {
    class: 'toast ' + kind,
    role: isErr ? 'alert' : 'status',
    'aria-live': isErr ? 'assertive' : 'polite',
    'aria-atomic': 'true',
  }, msg);
  document.getElementById('toasts').append(el);
  // Errors hang around longer; successes scale with message length so
  // a short "Saved" still feels brisk while a 60-character "Email
  // verified — you can now schedule events…" actually has time to be
  // read before fading.
  const okDwell = (typeof msg === 'string' && msg.length > 40) ? 5000 : 3500;
  const dwell = isErr ? 5500 : okDwell;
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; }, dwell);
  setTimeout(() => el.remove(), dwell + 400);
}
const toastOk = (m) => toast(m, 'ok');
const toastErr = (m) => toast(m, 'err');

/* ========== QR-scanner helpers ==========
 *
 * Used by the puzzle editor so an arranger can test-scan a printed
 * QR before laminating it. Same code shape as play.html's scanner.
 * Kept inline because there are only two callers; if a third
 * appears extract to /assets/qr-scanner.js.
 *
 * Decode path mirrors play.html: native BarcodeDetector when the
 * browser exposes it, vendored jsQR (~130 KB) lazily loaded as a
 * fallback for Firefox / older Safari.
 */
function qrSupported() {
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
}

let jsqrLoading = null;
function loadJsqr() {
  if (typeof window.jsQR === 'function') return Promise.resolve(window.jsQR);
  if (jsqrLoading) return jsqrLoading;
  jsqrLoading = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = '/assets/jsqr.js';
    s.async = true;
    s.onload = () => resolve(window.jsQR);
    s.onerror = () => { jsqrLoading = null; reject(new Error('jsqr load failed')); };
    document.head.append(s);
  });
  return jsqrLoading;
}

function openQrScanner() {
  return new Promise((resolve) => {
    const modal = document.createElement('div');
    modal.className = 'qr-modal';
    const video = document.createElement('video');
    video.setAttribute('playsinline', '');
    video.muted = true;
    video.autoplay = true;
    const frame = document.createElement('div');
    frame.className = 'qr-frame';
    const status = document.createElement('p');
    status.className = 'qr-status';
    status.textContent = t('Point the camera at a QR code');
    const cancel = document.createElement('button');
    cancel.type = 'button';
    cancel.className = 'qr-cancel';
    cancel.textContent = t('Cancel');
    modal.append(video, frame, status, cancel);
    document.body.append(modal);

    let stream = null;
    let stopped = false;
    const cleanup = (value) => {
      if (stopped) return;
      stopped = true;
      if (stream) stream.getTracks().forEach((tk) => tk.stop());
      modal.remove();
      resolve(value);
    };
    cancel.addEventListener('click', () => cleanup(null));
    const onKey = (e) => { if (e.key === 'Escape') cleanup(null); };
    document.addEventListener('keydown', onKey);
    modal.addEventListener('remove', () => document.removeEventListener('keydown', onKey));

    (async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
        });
        if (stopped) { stream.getTracks().forEach((tk) => tk.stop()); return; }
        video.srcObject = stream;
        await video.play().catch(() => { /* autoplay rejection is benign */ });
      } catch {
        status.textContent = t('Camera permission denied.');
        return;
      }
      const native = (typeof window.BarcodeDetector === 'function')
        ? new BarcodeDetector({ formats: ['qr_code'] }) : null;
      let jsqr = null;
      if (!native) {
        try { jsqr = await loadJsqr(); }
        catch { status.textContent = t('Camera unavailable.'); return; }
      }
      const canvas = jsqr ? document.createElement('canvas') : null;
      const ctx = canvas ? canvas.getContext('2d', { willReadFrequently: true }) : null;
      const tick = async () => {
        if (stopped) return;
        if (video.readyState >= 2) {
          try {
            if (native) {
              const codes = await native.detect(video);
              if (codes && codes.length > 0) {
                cleanup(codes[0].rawValue || '');
                return;
              }
            } else if (jsqr && video.videoWidth > 0) {
              canvas.width = video.videoWidth;
              canvas.height = video.videoHeight;
              ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
              const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
              const code = jsqr(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
              if (code && code.data) {
                cleanup(code.data);
                return;
              }
            }
          } catch { /* per-frame failures are benign */ }
        }
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    })();
  });
}

/* ========== Password-confirm prompt ==========
   Returns the typed password on success or null if cancelled. Pair this
   with requests that set X-Confirm-Password. */
async function promptPassword(title, message) {
  return modal(title, ({ body, close }) => {
    const input = h('input', { type: 'password', autocomplete: 'current-password', required: true });
    const err = h('p', { class: 'err', style: 'display:none' });
    const form = h('form', {},
      message ? h('p', { style: 'margin-bottom:.75rem' }, message) : null,
      h('label', { class: 'field' }, h('span', {}, t('Your password')), input),
      err,
      h('div', { class: 'row end' },
        h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, t('Cancel')),
        h('button', { class: 'btn danger', type: 'submit' }, t('Confirm'))),
    );
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!input.value) { err.style.display = ''; err.textContent = t('password required'); return; }
      close(input.value);
    });
    body.append(form);
    setTimeout(() => input.focus(), 20);
  });
}

/* ========== Modal ========== */
// Modal counter feeds a unique id so the heading can be aria-labelledby
// referenced from the dialog. Avoids collisions when multiple modals
// stack (rare but cheap to support).
let _modalSeq = 0;
// _modalStack tracks every open modal (innermost last) so the global
// popstate handler can route browser-back to "close the topmost modal"
// instead of leaving the page. _modalSuppressPop counts pending
// programmatic history.back() calls fired by close() — one back per
// pushed entry — so the resulting popstate doesn't recursively close
// another modal underneath. The flag is a counter rather than a bool
// because chained close()+open() patterns (Edit → switch to a different
// modal) can stack two history.back() calls before any popstate fires.
const _modalStack = [];
let _modalSuppressPop = 0;
window.addEventListener('popstate', () => {
  if (_modalSuppressPop > 0) {
    _modalSuppressPop--;
    return;
  }
  if (_modalStack.length === 0) return;
  _modalStack[_modalStack.length - 1].closeFromPop();
});
function modal(title, bodyFn, opts = {}) {
  return new Promise((resolve) => {
    const host = document.getElementById('modal-host');
    const body = h('div');
    // Stash the element that opened the modal so we can return focus
    // there on close — keyboard users would otherwise lose their place
    // and end up at the top of the page.
    const trigger = (document.activeElement && document.activeElement !== document.body)
      ? document.activeElement : null;
    // beforeClose lets the body opt into a dirty-check guard. Returning
    // false from the hook blocks the close (Save still works because
    // it bypasses the guard via close(value, { force: true })).
    let beforeClose = null;
    let removed = false;
    const titleID = 'modal-title-' + (++_modalSeq);
    // Dispatch a synthetic event before teardown so content hooks (e.g.
    // the puzzle editor's parked file input) can clean up whether close
    // is called via Save, Cancel, Esc, backdrop click, or browser back.
    const close = (value, options) => {
      const force = !!(options && options.force);
      const fromPop = !!(options && options.fromPop);
      // Form submit / explicit Save always wins; only treat null/undefined
      // (the cancel/Esc/backdrop signals) as candidates for the guard.
      const isCancel = value === null || value === undefined;
      if (isCancel && !force && beforeClose) {
        try {
          if (beforeClose() === false) {
            // Dirty-check refused. If the gesture was the browser's
            // back button, re-push so the URL/back stack still maps to
            // "this modal is open". Otherwise just stay open.
            if (fromPop) {
              history.pushState({ zvModal: titleID }, '');
            }
            return;
          }
        } catch { /* fall through to close */ }
      }
      if (removed) return; // idempotent: a button handler may call close twice.
      removed = true;
      body.dispatchEvent(new CustomEvent('modal:close'));
      document.removeEventListener('keydown', onKey);
      const idx = _modalStack.indexOf(handle);
      if (idx >= 0) _modalStack.splice(idx, 1);
      // Pop the history entry pushed on open. Skip when the close was
      // triggered by popstate itself (the entry is already gone).
      if (!fromPop) {
        _modalSuppressPop++;
        history.back();
      }
      host.replaceChildren();
      // Restore focus to the trigger element so a keyboard user stays
      // anchored in the same row/button they just acted from.
      if (trigger && trigger.isConnected) {
        try { trigger.focus(); } catch { /* element may have been re-rendered out */ }
      }
      resolve(value);
    };
    const handle = {
      closeFromPop: () => close(null, { force: false, fromPop: true }),
    };
    // Tab-trap: keep focus inside the dialog so a screen-reader user
    // can't accidentally Tab into the page behind. Standard pattern —
    // intercept Tab when focus is on the first/last focusable child.
    const onKey = (e) => {
      if (e.key === 'Escape') { close(null); return; }
      if (e.key !== 'Tab') return;
      const focusables = back.querySelectorAll(
        'a[href], area[href], button:not([disabled]), input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])');
      if (focusables.length === 0) return;
      const first = focusables[0];
      const last  = focusables[focusables.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault(); last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault(); first.focus();
      }
    };
    document.addEventListener('keydown', onKey);
    // Push a history entry so the browser back button maps to "close
    // modal" rather than "leave the page". The URL doesn't change —
    // this is purely a marker on the back stack.
    _modalStack.push(handle);
    history.pushState({ zvModal: titleID }, '');
    const back = h('div', {
      class: 'modal-back',
      role: 'presentation',
      on: { click: (e) => { if (e.target === back) close(null); } },
    },
      h('div', {
        class: 'modal' + (opts.wide ? ' wide' : ''),
        role: 'dialog',
        'aria-modal': 'true',
        'aria-labelledby': titleID,
        tabindex: '-1',
      },
        h('button', {
          class: 'modal-close',
          type: 'button',
          'aria-label': t('Close'),
          on: { click: () => close(null) },
        }, '×'),
        h('h2', { id: titleID }, title),
        body,
      ));
    host.replaceChildren(back);
    bodyFn({
      body,
      close,
      // setBeforeClose registers a hook that is consulted before the
      // modal closes via cancel paths. Return false (or trigger the
      // confirm dialog and return its boolean) to abort the close.
      setBeforeClose: (fn) => { beforeClose = fn; },
    });
    // Move focus into the modal after the body has been populated so
    // the first interactive element gets it. Falls back to the dialog
    // container itself if the body is action-free.
    setTimeout(() => {
      const dialog = back.querySelector('[role="dialog"]');
      if (!dialog) return;
      const firstInput = dialog.querySelector(
        'input:not([type="hidden"]):not([disabled]), textarea:not([disabled]), select:not([disabled]), button:not([disabled])');
      (firstInput || dialog).focus();
    }, 30);
  });
}

/* ========== State ========== */
const state = {
  me: null,                // {username, role}
  route: location.hash || '#dashboard',
  // Operator-controlled gate; populated lazily via /api/auth/signup-config
  // before the login screen renders. Default true keeps the historical
  // shape if the fetch fails — the server still rejects with 403 when
  // signup is actually disabled, so the UI is just a hint, not the gate.
  signupEnabled: true,
  // SSO config from /api/auth/signup-config. null = not fetched yet
  // (treated as "no SSO"); object with .enabled, .button_label,
  // .hosted_domain, .login_url when the operator has configured
  // OIDC. The login screen reads this to render the "Sign in with
  // Google" button and to surface a domain hint on the username
  // field.
  sso: null,
  // Cached system-update snapshot. Populated for admins after login;
  // null means "haven't checked yet" (the UI just doesn't show a
  // badge in that state). Refreshed on tab open + on demand via the
  // Check now button.
  systemUpdate: null,
  // Running build's version string, fetched from the public
  // /api/version endpoint so non-admins (who can't see the
  // system-update snapshot) still get a version line in the sidebar
  // footer. null = not fetched yet, '' = fetch failed.
  serverVersion: null,
};

// loadSystemUpdate fetches the changelog snapshot and caches it on
// state. Admin-only — the endpoint 403s for everyone else, so we
// just don't call it. Errors are silent: a missing badge is better
// than a console-spamming retry loop in deployments where the
// upstream URL is unreachable. Always sets state.systemUpdate to a
// non-null object after the first attempt so render() doesn't
// re-fire the cold-start fetch on every paint.
async function loadSystemUpdate() {
  if (state.me?.role !== 'admin') {
    state.systemUpdate = {};
    return;
  }
  try {
    const r = await api('/api/admin/system-update');
    state.systemUpdate = (r.ok && r.body) ? r.body : {};
  } catch (_) {
    state.systemUpdate = {};
  }
}

// systemUpdateAvailable is the single source of truth the rest of
// the UI consults to decide whether to draw the update badge. Keeps
// the null / missing-field paths funnelled through one place.
function systemUpdateAvailable() {
  return !!state.systemUpdate?.update_available;
}

// loadServerVersion fetches /api/version (the public build-info
// endpoint) so the sidebar footer can show "v0.1.4" to every user.
// Admins additionally get the changelog snapshot via loadSystemUpdate
// for the "update available" affordance, but that endpoint is
// admin-gated and so can't power the always-on version line.
async function loadServerVersion() {
  try {
    const r = await api('/api/version');
    state.serverVersion = (r.ok && r.body?.version) ? r.body.version : '';
  } catch (_) {
    state.serverVersion = '';
  }
}

// Fetch the public signup-config once and cache the result. Called
// before renderLogin so the "Sign up" link reflects the live setting
// without a flash of stale UI.
async function ensureSignupConfig() {
  try {
    const r = await api('/api/auth/signup-config');
    if (r.ok && typeof r.body?.enabled === 'boolean') {
      state.signupEnabled = r.body.enabled;
    }
    if (r.ok && r.body?.sso?.enabled) {
      state.sso = {
        buttonLabel: r.body.sso.button_label || t('Sign in with Google'),
        hostedDomain: r.body.sso.hosted_domain || '',
        loginUrl: r.body.sso.login_url || '/auth/oidc/login',
        // provider_name drives whether we paint Google's official
        // Material button (per Google's branding guidelines) or a
        // generic SSO button — non-Google IdPs shouldn't carry the
        // Google logo.
        providerName: r.body.sso.provider_name || 'google',
      };
    }
  } catch (_) { /* leave default */ }
}

window.addEventListener('hashchange', () => {
  state.route = location.hash || '#dashboard';
  render();
});

/* ========== Router ========== */
async function refreshMe() {
  const r = await api('/api/auth/whoami');
  state.me = (r.status === 200) ? r.body : null;
}
function nav(hash) { location.hash = hash; }

// Called on every successful login. The hash sticks across logout —
// if a user was on #settings before signing out (or restarting their
// session), the form swaps in but the URL still says #settings, so
// the post-login render would land them there instead of the
// dashboard. replaceState avoids firing hashchange (we re-render
// explicitly anyway).
function resetRouteToDashboard() {
  history.replaceState(null, '', '#dashboard');
  state.route = '#dashboard';
}

// switchOrgAndRender pins a new active organisation server-side, then
// tears down the websocket subscription (its filter is per-org), pulls
// a fresh whoami, and re-renders the route. Used by both the post-
// login picker modal and the sidebar org switcher.
async function switchOrgAndRender(orgID) {
  const r = await api('/api/auth/switch-org', {
    method: 'POST',
    body: JSON.stringify({ org_id: orgID }),
  });
  if (!r.ok) {
    toastErr(r.body?.error || t('Could not switch organization.'));
    return;
  }
  if (typeof arrangeWS !== 'undefined' && arrangeWS) {
    try { arrangeWS.close(); } catch (e) {}
    arrangeWS = null;
  }
  await refreshMe();
  render();
}

// renderOrgPicker is the full-screen card shown before any view
// paints when a user belongs to several orgs and the session has no
// active selection — fresh login by a multi-org user, or the result
// of an admin removing them from their previously-active org.
function renderOrgPicker() {
  const memberships = (state.me && state.me.memberships) || [];
  const card = h('div', { class: 'login' },
    h('div', { class: 'brand' }, 'zonventure',
      h('small', {}, t('select organization'))),
    h('p', { class: 'muted' },
      t('You belong to {{n}} organisations. Pick which one to act as — you can switch from the menu later.', { n: memberships.length })),
    h('div', { style: 'display:flex; flex-direction:column; gap:.5rem; margin-top:1rem' },
      memberships.map((m) => {
        // Logo when available — recognising a brand mark is faster
        // than scanning org names for an arranger who works across
        // several tenants. Falls back to a muted initial so the
        // layout doesn't shift between orgs with and without logos.
        // Logo: contain (preserves whole mark, no crop) and no
        // background fill so a transparent logo reads against the
        // login card surface. The initials fallback keeps the muted
        // tile because a single letter alone needs the contrast.
        const mark = m.org_logo_url
          ? h('img', {
              src: m.org_logo_url,
              alt: '',
              style: 'width:1.75rem; height:1.75rem; object-fit:contain; flex:0 0 auto',
            })
          : h('span', {
              style: 'width:1.75rem; height:1.75rem; border-radius:.35rem; flex:0 0 auto; display:inline-grid; place-items:center; background:var(--surface-2); color:var(--muted); font-weight:700; font-size:.85rem',
              'aria-hidden': 'true',
            }, (m.org_name || '?').trim().charAt(0).toUpperCase());
        return h('button', {
          class: 'btn ghost',
          type: 'button',
          style: 'display:flex; align-items:center; gap:.6rem; text-align:left',
          on: { click: () => switchOrgAndRender(m.org_id) },
        }, mark,
           h('strong', { style: 'flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap' }, m.org_name),
           h('span', { class: 'muted', style: 'font-size:.85rem; flex:0 0 auto' },
             m.role === 'org_admin' ? t('admin') : t('race director')));
      })),
    h('div', { class: 'row end', style: 'margin-top:1rem' },
      h('button', {
        class: 'btn small',
        type: 'button',
        on: { click: async () => {
          await api('/api/auth/logout', { method: 'POST' });
          state.me = null;
          state.systemUpdate = null;
          render();
        } },
      }, t('Log out'))),
  );
  return h('div', { class: 'login-wrap' }, card);
}

// renderTopbarOrg pins the active org's logo + name to the right of
// the topbar. Returns null for admins (no org context) and for users
// whose session has no active org pinned yet (the post-login picker
// hasn't run). Read-only — actual switching still lives in the
// sidebar dropdown for multi-org users; this surface is identity,
// not navigation.
function renderTopbarOrg() {
  if (!state.me || state.me.role === 'admin') return null;
  const orgID = state.me.org_id;
  if (orgID == null) return null;
  const memberships = state.me.memberships || [];
  const active = memberships.find((m) => m.org_id === orgID);
  if (!active) return null;
  const children = [];
  if (active.org_logo_url) {
    children.push(h('img', {
      src: active.org_logo_url,
      alt: '',
      'aria-hidden': 'true',
    }));
  }
  children.push(h('span', { class: 'topbar-org-name' }, active.org_name));
  return h('div', {
    class: 'topbar-org',
    title: active.org_name,
  }, ...children);
}

// renderOrgSwitcher renders the sidebar dropdown that lets a multi-org
// user flip between their organisations mid-session. Returns null for
// single-org users (and admins, who have no memberships) — the menu
// stays uncluttered for the common case.
function renderOrgSwitcher() {
  const memberships = (state.me && state.me.memberships) || [];
  if (memberships.length <= 1) return null;
  const sel = h('select', {
    class: 'sidebar-orgswitch',
    'aria-label': t('Active organization'),
  }, memberships.map((m) => h('option', {
    value: String(m.org_id),
  }, m.org_name)));
  // Set the active option via the select's value property — passing
  // `selected: ''` to h() would set option.selected to '' (coerced
  // to false), so no option ends up selected and the browser falls
  // back to showing the first one. Switching would then "revert"
  // visually after every re-render.
  if (state.me.org_id != null) sel.value = String(state.me.org_id);
  sel.addEventListener('change', async () => {
    const newID = parseInt(sel.value, 10);
    if (!Number.isFinite(newID) || newID === state.me.org_id) return;
    await switchOrgAndRender(newID);
  });
  return h('div', { style: 'padding:0 .75rem .5rem' },
    h('label', { class: 'muted', style: 'font-size:.75rem; display:block; margin-bottom:.25rem' },
      t('Organization')),
    sel);
}

// maybeShowOnboarding flashes a one-time welcome modal on the first
// /arrange render after a fresh signup. Dismissal is sticky in
// localStorage; once it's shown for an account it never reappears
// unless the user clears site data.
function maybeShowOnboarding() {
  if (!state.me) return;
  const key = 'zv_onboarded_' + state.me.id;
  if (localStorage.getItem(key) === '1') return;
  // Only show once whoami has settled and we have an authenticated user.
  setTimeout(() => {
    if (location.hash.startsWith('#reset') || location.hash.startsWith('#change-email')) return;
    localStorage.setItem(key, '1');
    if (state.me.role === 'admin') showAdminOnboardingModal();
    else                           showOnboardingModal();
  }, 200);
}

async function showOnboardingModal() {
  await modal(t('Welcome to Zonventure Studio'), ({ body, close }) => {
    body.append(
      h('p', { class: 'muted', style: 'margin-top:.25rem' },
        t('Three steps from here to a live adventure:')),
      h('ol', { style: 'padding-left:1.25rem; line-height:1.7' },
        h('li', {}, h('strong', {}, t('Browse adventures')), ' — ',
          t('the catalog has ready-made adventures, or you can author your own.')),
        h('li', {}, h('strong', {}, t('Buy player slots')), ' — ',
          t('one slot per team. Pay once per event.')),
        h('li', {}, h('strong', {}, t('Schedule an event')), ' — ',
          t('add teams, share magic links, and start when ready.'))),
      h('p', { class: 'muted', style: 'font-size:.85rem; margin-top:1rem' },
        t('You can revisit this from the Settings page anytime.')),
      h('div', { class: 'row end', style: 'margin-top:1rem; gap:.5rem' },
        h('button', { class: 'btn', on: { click: () => close(null) } }, t('Skip')),
        h('button', { class: 'btn primary', on: { click: () => { close(null); nav('#catalog'); } } },
          t('Open the store'))));
  });
}

async function showAdminOnboardingModal() {
  await modal(t('Welcome to Zonventure Studio'), ({ body, close }) => {
    body.append(
      h('p', { class: 'muted', style: 'margin-top:.25rem' },
        t('Admin shortcut — three steps to a working deployment:')),
      h('ol', { style: 'padding-left:1.25rem; line-height:1.7' },
        h('li', {}, h('strong', {}, t('Create an organization')), ' — ',
          t('one tenant per customer. They run their own events.')),
        h('li', {}, h('strong', {}, t('Add a user to it')), ' — ',
          t('an org_admin can invite team members and run events.')),
        h('li', {}, h('strong', {}, t('Stock the library')), ' — ',
          t('author adventures or commission existing ones to an org.'))),
      h('p', { class: 'muted', style: 'font-size:.85rem; margin-top:1rem' },
        t('The dashboard checklist tracks these steps until the first event runs.')),
      h('div', { class: 'row end', style: 'margin-top:1rem; gap:.5rem' },
        h('button', { class: 'btn', on: { click: () => close(null) } }, t('Skip')),
        h('button', { class: 'btn primary', on: { click: () => { close(null); nav('#organizations'); } } },
          t('Manage organizations'))));

async function render() {
  if (!state.me) await refreshMe();
  // Kick off the changelog fetch the first time an admin lands —
  // populates the hamburger / Settings badges before the next paint
  // if the cached server snapshot is already populated, or shortly
  // after for a cold-start. Silently bails for non-admins.
  if (state.me?.role === 'admin' && state.systemUpdate === null) {
    loadSystemUpdate().then(() => render());
  }
  // Sidebar version line. Public endpoint, fetched once per session
  // for any signed-in user.
  if (state.me && state.serverVersion === null) {
    loadServerVersion().then(() => render());
  }
  const root = document.getElementById('root');
  // Reset-password landing: the email link points at
  // /arrange#reset?token=ABC. Show the reset card regardless of
  // login state — the user with the token is exactly the one who
  // needs to override their password.
  const resetMatch = location.hash.match(/^#reset\?token=([^&]+)/);
  if (resetMatch) {
    root.replaceChildren(renderLogin(null, 'reset', decodeURIComponent(resetMatch[1])));
    return;
  }
  // Change-email confirmation: the email link points at
  // /arrange#change-email?token=ABC. Consume the token and flash a
  // toast — same pattern as #verify-ok / #verify-failed.
  const ceMatch = location.hash.match(/^#change-email\?token=([^&]+)/);
  if (ceMatch) {
    const token = decodeURIComponent(ceMatch[1]);
    history.replaceState(null, '', '#dashboard');
    state.route = '#dashboard';
    api('/api/auth/confirm-email-change', {
      method: 'POST',
      body: JSON.stringify({ token }),
    }).then(async (r) => {
      if (r.status === 200) {
        await refreshMe();
        render();
        setTimeout(() => toastOk(t('Email updated to {{email}}.', { email: r.body?.email || '' })), 50);
      } else {
        render();
        setTimeout(() => toastErr(r.body?.error || t('Could not change email.')), 50);
      }
    });
  }
  // The OIDC callback redirects back here with #sso-error=<code> on
  // failure paths the audit log already captured (state mismatch,
  // domain mismatch, IdP refusal, etc.). We map the code to a
  // human-readable toast, then strip the hash so a refresh doesn't
  // re-flash. Specific failure reasons stay generic in the user-
  // facing copy — the audit row carries the detail.
  const ssoErrMatch = location.hash.match(/^#sso-error=([a-z_]+)$/);
  if (ssoErrMatch) {
    history.replaceState(null, '', '#dashboard');
    state.route = '#dashboard';
    const code = ssoErrMatch[1];
    setTimeout(() => {
      const map = {
        domain_not_allowed: t('That account is not part of the configured workspace.'),
        email_unverified:   t('Your identity provider didn’t mark your email as verified.'),
        idp_error:          t('The sign-in provider declined the request. Try again, or contact your admin.'),
        session_expired:    t('Sign-in took too long and the session expired. Try again.'),
      };
      toastErr(map[code] || t('Single sign-on failed ({{code}}). Try again, or contact your admin.', { code }));
    }, 50);
  }
  // The /verify endpoint redirects back here with a state hash that
  // tells the UI which toast to flash. We consume it once and replace
  // the hash with #dashboard so a refresh doesn't re-flash the same
  // toast and the audit log doesn't fill with redundant clicks.
  if (location.hash === '#verify-ok' || location.hash === '#verify-failed') {
    const ok = location.hash === '#verify-ok';
    history.replaceState(null, '', '#dashboard');
    state.route = '#dashboard';
    setTimeout(() => {
      if (ok) toastOk(t('Email verified — you can now schedule events and buy assignments.'));
      else toastErr(t('Verification link is invalid or has expired. Sign in and tap "Resend email".'));
      // refreshMe so the banner disappears now that email_verified=true.
      if (ok) refreshMe().then(render);
    }, 50);
  }
  if (!state.me) {
    await ensureSignupConfig();
    root.replaceChildren(renderLogin());
    return;
  }
  // Multi-org user with no active selection — show the picker before
  // any role-specific view paints. Single-org users and admins skip
  // straight through. The session's active_org_id stays NULL until
  // they pick; the API will hand back an empty org_id on whoami until
  // then, so this branch is what gates the rest of the UI.
  if (state.me.role !== 'admin' && !state.me.org_id &&
      state.me.memberships && state.me.memberships.length > 1) {
    root.replaceChildren(renderOrgPicker());
    return;
  }
  if (state.me.role === 'player') {
    root.replaceChildren(h('div', { class: 'login-wrap' },
      h('div', { class: 'login' },
        h('div', { class: 'brand' }, 'zonventure'),
        h('p', {}, t('Logged in as {{username}} (player). This dashboard is for arrangers.', { username: state.me.username })),
        h('p', {}, h('a', { href: '/play' }, t('Go to the player view →'))),
        h('p', {}, h('button', { class: 'btn', on: { click: logout } }, t('Log out'))),
      )));
    return;
  }
  root.replaceChildren(renderShell());
  await renderRoute();
  maybeShowOnboarding();
}

// renderLogin renders one of the pre-auth screens — login, signup,
// forgot-password, or reset-password — picked by `mode`. Defaults to
// login. Sharing one card avoids dragging the user through page
// navigations during account-flow edge cases.
function renderLogin(err, mode, extra) {
  mode = mode || 'login';
  // Signup is operator-gated. If the server says it's off, fall back
  // to plain login — the server would 403 the POST anyway, but a
  // dead-end "Create account" form is worse UX than just hiding it.
  if (mode === 'signup' && state.signupEnabled === false) mode = 'login';
  if (mode === 'signup') return renderSignup(err);
  if (mode === 'forgot') return renderForgot(err);
  if (mode === 'reset')  return renderReset(err, extra);

  const errEl  = err ? h('p', { class: 'err' }, err) : null;
  // Full-width submit so it visually pairs with the Google SSO
  // button above (which is also stretched to the card width via the
  // .sso-block override below). Without the explicit width the
  // primary button shrinks to its ~80px label and reads as a
  // secondary action next to the wider SSO mark.
  const submit = h('button', {
    class: 'btn primary',
    type: 'submit',
    style: 'width:100%',
  }, t('Log in'));
  const usernameEl = h('input', { name: 'u', autocomplete: 'username', required: true });
  const passwordEl = h('input', { name: 'p', type: 'password', autocomplete: 'current-password', required: true });
  // SSO button rendered above the username/password block when the
  // operator has configured OIDC. Same brand-accent styling as the
  // primary submit so it reads as the recommended option for
  // workspace users; the "or sign in with password" divider below it
  // makes the password fallback discoverable for non-domain users
  // (e.g. external collaborators who were invited as arrangers).
  // Google's official Material button. Markup matches the spec on
  // developers.google.com/identity/branding-guidelines verbatim —
  // <button> wrapping a state overlay, content-wrapper with icon,
  // visible label span, and a duplicate hidden label span (Google
  // emits this in their generator, kept for compatibility with
  // their accessibility scaffolding even though `aria-label`
  // already covers screen readers). Click navigates the top frame
  // to the IdP login URL — same effect as the previous <a> anchor.
  const renderGoogleSSOButton = (href, label) => {
    const wrap = document.createElement('button');
    wrap.type = 'button';
    wrap.className = 'gsi-material-button';
    wrap.setAttribute('aria-label', label);
    wrap.addEventListener('click', () => { location.href = href; });
    wrap.innerHTML = '\
      <div class="gsi-material-button-state"></div>\
      <div class="gsi-material-button-content-wrapper">\
        <div class="gsi-material-button-icon">\
          <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" xmlns:xlink="http://www.w3.org/1999/xlink" style="display:block">\
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>\
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>\
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>\
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>\
            <path fill="none" d="M0 0h48v48H0z"></path>\
          </svg>\
        </div>\
        <span class="gsi-material-button-contents"></span>\
        <span style="display: none;"></span>\
      </div>';
    // Set both label slots via textContent (not innerHTML) so a
    // translated string with HTML-special characters can't break
    // the markup. Two slots match Google's generator output.
    wrap.querySelectorAll('.gsi-material-button-contents, [style*="display: none"]')
      .forEach((node) => { node.textContent = label; });
    return wrap;
  };
  const ssoBlock = state.sso ? h('div', { class: 'sso-block' },
    state.sso.providerName === 'google'
      ? renderGoogleSSOButton(state.sso.loginUrl, state.sso.buttonLabel)
      : h('a', {
          class: 'btn primary sso-btn',
          href: state.sso.loginUrl,
          role: 'button',
        }, state.sso.buttonLabel),
    state.sso.hostedDomain
      ? h('p', { class: 'muted sso-hint' },
          t('For @{{domain}} accounts.', { domain: state.sso.hostedDomain }))
      : null,
    h('div', { class: 'sso-divider' },
      h('span', { class: 'sso-divider-label' }, t('or sign in with password'))),
  ) : null;
  const form = h('form', { class: 'login' },
    h('div', { class: 'brand' }, 'zonventure', h('small', {}, t('studio'))),
    ssoBlock,
    h('label', { class: 'field' }, h('span', {}, t('Username')), usernameEl),
    h('label', { class: 'field' }, h('span', {}, t('Password')), passwordEl),
    errEl,
    h('div', { style: 'margin-top:1rem' }, submit),
    h('p', { class: 'muted', style: 'margin-top:1rem; font-size:.85rem; text-align:center' },
      h('a', { href: '#', on: { click: (e) => { e.preventDefault();
        document.getElementById('root').replaceChildren(renderLogin(null, 'forgot')); } } }, t('Forgot password?'))),
    state.signupEnabled === false ? null :
    h('p', { class: 'muted', style: 'margin-top:.5rem; font-size:.85rem; text-align:center' },
      t('No account yet?'), ' ',
      h('a', { href: '#', on: { click: (e) => { e.preventDefault();
        document.getElementById('root').replaceChildren(renderLogin(null, 'signup')); } } }, t('Sign up'))),
    renderLegalFooter(),
  );
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const r = await api('/api/auth/login', {
      method: 'POST',
      body: JSON.stringify({ username: fd.get('u'), password: fd.get('p') }),
    });
    if (r.ok && r.body?.code === 'totp_required') {
      document.getElementById('root').replaceChildren(renderTOTPChallenge(r.body.challenge, { mode: 'login' }));
      return;
    }
    // 409 sso_required: the entered email is in the workspace's
    // SSO domain. Bounce straight to the IdP — the user can finish
    // signing in with the same browser session, no re-typing.
    if (r.status === 409 && r.body?.code === 'sso_required' && r.body?.login_url) {
      location.href = r.body.login_url;
      return;
    }
    if (r.ok) { await refreshMe(); resetRouteToDashboard(); render(); return; }
    // Lockout (429): the server's Retry-After header carries the wait
    // budget. Render a live-ticking countdown and disable the submit
    // button until the cooldown elapses, so a user mashing the button
    // doesn't keep racking up failures and extending the lockout.
    if (r.status === 429 && r.retryAfter > 0) {
      let secs = r.retryAfter;
      const live = h('p', { class: 'err', role: 'status', 'aria-live': 'polite' }, '');
      const setText = () => { live.textContent = secs > 0
        ? t('Too many failed attempts. Try again in {{n}}s.', { n: secs })
        : t('You can try again now.'); };
      submit.disabled = true;
      usernameEl.disabled = true;
      passwordEl.disabled = true;
      setText();
      // Inject the ticker after the static err element if present, else
      // after the form body — replaceChildren on the root would reset
      // any in-progress timers.
      (errEl ? errEl.replaceWith(live) : form.insertBefore(live, submit.parentElement));
      const tick = setInterval(() => {
        secs -= 1;
        setText();
        if (secs <= 0) {
          clearInterval(tick);
          submit.disabled = false;
          usernameEl.disabled = false;
          passwordEl.disabled = false;
        }
      }, 1000);
      return;
    }
    document.getElementById('root').replaceChildren(renderLogin(r.body?.error || t('login failed')));
  });
  return h('div', { class: 'login-wrap' }, form);
}

function renderForgot(err, sentTo) {
  const form = h('form', { class: 'login' },
    h('div', { class: 'brand' }, 'zonventure', h('small', {}, t('reset password'))),
    h('p', { class: 'muted', style: 'font-size:.9rem' },
      t('Enter your email and we\'ll send you a link to set a new password. The link expires in 1 hour.')),
    h('label', { class: 'field' },
      h('span', {}, t('Email')),
      h('input', { name: 'email', type: 'email', autocomplete: 'email', required: true })),
    err ? h('p', { class: 'err' }, err) : null,
    sentTo ? h('p', { class: 'ok' }, t('If {{email}} matches an account, a reset link is on its way.', { email: sentTo })) : null,
    h('div', { class: 'row end', style: 'margin-top:1rem' },
      h('button', { class: 'btn primary', type: 'submit' }, t('Send reset link'))),
    h('p', { class: 'muted', style: 'margin-top:1rem; font-size:.85rem; text-align:center' },
      h('a', { href: '#', on: { click: (e) => { e.preventDefault();
        document.getElementById('root').replaceChildren(renderLogin(null, 'login')); } } }, t('Back to log in'))),
  );
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const email = String(fd.get('email') || '').trim();
    const r = await api('/api/auth/forgot', {
      method: 'POST',
      body: JSON.stringify({ email }),
    });
    // 204 is the always-success response from the server. 400 only
    // fires for malformed addresses (validation failed locally too).
    if (r.status === 204) {
      document.getElementById('root').replaceChildren(renderForgot(null, email));
    } else {
      document.getElementById('root').replaceChildren(renderForgot(r.body?.error || t('reset failed')));
    }
  });
  return h('div', { class: 'login-wrap' }, form);
}

// renderReset shows the "choose a new password" form. token is the
// reset token from the URL fragment; we POST it together with the
// new password and let the server set the session cookie + return
// whoami so the user is dropped straight into the dashboard.
function renderReset(err, token) {
  if (!token) {
    return h('div', { class: 'login-wrap' },
      h('div', { class: 'login' },
        h('div', { class: 'brand' }, 'zonventure', h('small', {}, t('reset password'))),
        h('p', { class: 'err' }, t('No reset token in the URL. Check the link you clicked, or request a new one.')),
        h('p', { class: 'muted', style: 'margin-top:1rem; font-size:.85rem; text-align:center' },
          h('a', { href: '#', on: { click: (e) => { e.preventDefault();
            history.replaceState(null, '', '#dashboard');
            document.getElementById('root').replaceChildren(renderLogin(null, 'forgot')); } } }, t('Request a new link')))));
  }
  const form = h('form', { class: 'login' },
    h('div', { class: 'brand' }, 'zonventure', h('small', {}, t('reset password'))),
    h('label', { class: 'field' },
      h('span', {}, t('New password (min 8)')),
      h('input', { name: 'pw', type: 'password', autocomplete: 'new-password', minlength: 8, required: true })),
    err ? h('p', { class: 'err' }, err) : null,
    h('div', { class: 'row end', style: 'margin-top:1rem' },
      h('button', { class: 'btn primary', type: 'submit' }, t('Set password'))),
  );
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const r = await api('/api/auth/reset', {
      method: 'POST',
      body: JSON.stringify({ token, new_password: fd.get('pw') }),
    });
    if (r.status === 200 && r.body?.code === 'totp_required') {
      // Server changed the password but didn't mint a session —
      // bridge into the TOTP step on the same screen. Strip the
      // reset token from the URL first so a back-button trip
      // doesn't re-render this form with a now-consumed token.
      history.replaceState(null, '', '#dashboard');
      document.getElementById('root').replaceChildren(renderTOTPChallenge(r.body.challenge, { mode: 'reset' }));
      return;
    }
    if (r.status === 200) {
      // Server already minted a session and dropped the cookie.
      // Replace the hash so a refresh doesn't re-trigger the reset
      // form, then drop into the dashboard.
      history.replaceState(null, '', '#dashboard');
      state.route = '#dashboard';
      await refreshMe();
      render();
      setTimeout(() => toastOk(t('Password updated. You\'re signed in.')), 50);
      return;
    }
    document.getElementById('root').replaceChildren(renderReset(r.body?.error || t('reset failed'), token));
  });
  return h('div', { class: 'login-wrap' }, form);
}

// renderTOTPChallenge is the second leg of login when the server
// returned {code: 'totp_required', challenge: '...'} from either
// /api/auth/login or /api/auth/reset. Mode is 'login' or 'reset' —
// only affects the heading copy.
function renderTOTPChallenge(challenge, opts) {
  opts = opts || {};
  const mode = opts.mode || 'login';
  const submit = h('button', { class: 'btn primary', type: 'submit' }, t('Verify'));
  const otp = makeOTPBoxes({ autofocus: true, onComplete: () => submit.focus() });
  // Recovery-code path is initially hidden; clicking the link
  // toggles it in alongside (not instead of) the code input. The
  // server accepts exactly one of code / recovery_code, but the
  // UI keeping the user on one screen avoids a "wait, where's the
  // back button?" moment when they go for the recovery flow.
  const recoveryEl = h('input', {
    name: 'recovery', autocomplete: 'one-time-code', maxlength: 11, placeholder: 'xxxx-xxxx',
  });
  const recoveryRow = h('label', { class: 'field', hidden: true },
    h('span', {}, t('Recovery code')), recoveryEl);
  const status = h('p', { class: 'muted', style: 'font-size:.85rem' });
  const heading = mode === 'reset' ? t('verify 2FA · password reset') : t('two-factor');
  const form = h('form', { class: 'login' },
    h('div', { class: 'brand' }, 'zonventure', h('small', {}, heading)),
    h('p', { class: 'muted', style: 'font-size:.9rem' },
      t('Enter the 6-digit code from your authenticator app.')),
    otp.node,
    recoveryRow,
    status,
    h('div', { class: 'row end', style: 'margin-top:1rem' }, submit),
    h('p', { class: 'muted', style: 'margin-top:1rem; font-size:.85rem; text-align:center' },
      h('a', { href: '#', on: { click: (e) => {
        e.preventDefault();
        if (recoveryRow.hasAttribute('hidden')) {
          recoveryRow.removeAttribute('hidden');
          recoveryEl.required = true;
          otp.clear();
          recoveryEl.focus();
        } else {
          recoveryRow.setAttribute('hidden', '');
          recoveryEl.required = false;
          recoveryEl.value = '';
          otp.focus();
        }
      } } }, t('Use a recovery code'))),
    h('p', { class: 'muted', style: 'margin-top:.5rem; font-size:.85rem; text-align:center' },
      h('a', { href: '#', on: { click: (e) => {
        e.preventDefault();
        document.getElementById('root').replaceChildren(renderLogin(null, 'login'));
      } } }, t('Back to log in'))),
  );
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = { challenge };
    if (recoveryRow.hasAttribute('hidden')) {
      const code = otp.getValue();
      if (code.length !== 6) {
        status.className = 'err';
        status.textContent = t('Enter all 6 digits.');
        return;
      }
      body.code = code;
    } else {
      body.recovery_code = recoveryEl.value.trim();
    }
    status.className = 'muted'; status.textContent = t('Verifying…');
    const r = await api('/api/auth/login/totp', {
      method: 'POST',
      body: JSON.stringify(body),
    });
    if (r.ok) {
      await refreshMe();
      resetRouteToDashboard();
      render();
      if (mode === 'reset') {
        setTimeout(() => toastOk(t('Password updated. You\'re signed in.')), 50);
      }
      return;
    }
    if (r.status === 429 && r.retryAfter > 0) {
      status.className = 'err';
      status.textContent = t('Too many failed attempts. Try again in {{n}}s.', { n: r.retryAfter });
      submit.disabled = true;
      setTimeout(() => { submit.disabled = false; }, r.retryAfter * 1000);
      return;
    }
    status.className = 'err';
    status.textContent = r.body?.error || t('verification failed');
    if (recoveryRow.hasAttribute('hidden')) otp.clear();
  });
  return h('div', { class: 'login-wrap' }, form);
}

function renderShell() {
  const role = state.me.role;
  const isAdmin = role === 'admin';
  const isOrgAdmin = role === 'org_admin';
  // Admin runs the multi-tenant plumbing (organizations, other admins).
  // Org users play the game: adventures, runs, players. Org admins also
  // manage their organization's members.
  let items;
  if (isAdmin) {
    items = [
      ['#dashboard',     t('Dashboard'),     ICONS.dashboard],
      ['#organizations', t('Organizations'), ICONS.building],
      // "Library" is the single entry point for authored content — a
      // tab strip inside the view splits Adventures and Puzzles. Two
      // sidebar entries for what's essentially one catalog was noise.
      ['#library',       t('Library'),       ICONS.map],
      ['#logs',          t('Logs'),          ICONS.terminal],
      ['#settings',      t('Settings'),      ICONS.gear],
    ];
  } else {
    // Sidebar lists the daily-operational surfaces only. Adventures
    // (incl. its Catalog tab), Events, and per-role
    // surfaces. Member admin, audit log, billing history,
    // integrations and the manual all live as tabs inside Settings
    // so the daily nav stays calm.
    items = [
      ['#dashboard',  t('Dashboard'),  ICONS.dashboard],
      ['#adventures', t('Adventures'), ICONS.map],
      ['#events',     t('Events'),     ICONS.schedule],
    ];
    items.push(['#settings', t('Settings'), ICONS.gear]);
  }
  const active = state.route.split('/')[0];

  const updateAvailable = systemUpdateAvailable();
  const nav = h('nav', { class: 'nav', 'aria-label': t('Primary') },
    items.map(([href, label, svg]) => {
      // Settings is the only entry that can carry the update badge —
      // the surface itself lives behind a Settings tab. Keeping the
      // dot out of the unrelated nav links avoids visual confusion.
      const showBadge = updateAvailable && href === '#settings';
      const cls = [active === href ? 'active' : '', showBadge ? 'has-update' : '']
        .filter(Boolean).join(' ');
      return h('a', {
        href,
        class: cls || null,
        'aria-current': active === href ? 'page' : null,
        title: showBadge ? t('Software update available') : null,
        on: { click: () => { document.querySelector('.sidebar')?.classList.remove('open'); document.querySelector('.backdrop')?.classList.remove('show'); } },
      }, icon(svg), label);
    }));
  // Arrow-key navigation across the sidebar. We deliberately don't
  // adopt role="tab" / role="tablist" — these are real anchor links
  // (each one is a routable URL), and forcing tab semantics would
  // misrepresent them to screen readers. Just add focus movement so
  // keyboard-only users don't have to Tab through every entry.
  nav.addEventListener('keydown', (ev) => {
    if (ev.key !== 'ArrowDown' && ev.key !== 'ArrowUp') return;
    const links = Array.from(nav.querySelectorAll('a'));
    if (links.length === 0) return;
    const idx = links.indexOf(document.activeElement);
    const next = ev.key === 'ArrowDown'
      ? (idx < 0 ? 0 : Math.min(idx + 1, links.length - 1))
      : (idx <= 0 ? 0 : idx - 1);
    links[next].focus();
    ev.preventDefault();
  });

  const logoutBtn = h('button', {
    class: 'btn',
    title: t('Log out'),
    on: { click: logout },
  }, icon(ICONS.exit), t('Log out ({{username}})', { username: state.me.username }));

  const sidebar = h('aside', {
    class: 'sidebar', id: 'sidebar-nav',
    'aria-label': t('Sidebar'),
  },
    h('div', { class: 'brand' }, 'zonventure',
      h('small', {}, t('studio'))),
    renderOrgSwitcher(),
    nav,
    h('div', { class: 'sidebar-footer' }, logoutBtn, renderSidebarVersion(), renderLegalFooter()));

  const backdrop = h('div', { class: 'backdrop', on: { click: () => {
    document.querySelector('.sidebar').classList.remove('open');
    backdrop.classList.remove('show');
  } } });

  const menuBtn = h('button', {
    class: 'btn ghost menu-btn' + (updateAvailable ? ' has-update' : ''),
    type: 'button',
    'aria-label': updateAvailable
      ? t('Open navigation menu (software update available)')
      : t('Open navigation menu'),
    'aria-controls': 'sidebar-nav',
    'aria-expanded': 'false',
    on: { click: () => {
      const sb = document.querySelector('.sidebar');
      const open = sb.classList.toggle('open');
      backdrop.classList.toggle('show', open);
      menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    } },
  }, icon(ICONS.menu));

  const topbar = h('header', { class: 'topbar', role: 'banner' },
    menuBtn,
    h('span', { class: 'brand' }, 'zonventure'),
    h('div', { class: 'crumb', 'aria-live': 'polite' }, currentCrumb()),
    h('div', { class: 'spacer' }),
    renderTopbarOrg(),
  );

  // Unverified-email banner: shown for users with an email_verified
  // flag of false. Money-touching actions (CreateRun, CreatePurchase)
  // 403 with a verification_required code, so this banner gives them
  // the recovery action up front before they hit the wall.
  const verifyBanner = (state.me && state.me.email && state.me.email_verified === false)
    ? renderVerifyBanner(state.me.email)
    : null;

  // Deletion-pending banner: outranks the verify banner because it
  // affects the entire account. Shown whenever scheduled_deletion_at
  // is on /whoami; the cancel button clears the timestamp.
  const deleteBanner = (state.me && state.me.scheduled_deletion_at)
    ? renderDeletionBanner(state.me.scheduled_deletion_at)
    : null;

  // Default-credentials banner: shown when the user is still on the
  // seeded admin/admin (or root/rootpw) password. Loud red because
  // a publicly-reachable box with the default password is one
  // curl-from-anywhere away from total takeover. Cleared the moment
  // the user changes their password through any of the password-
  // update paths, server-side (see UPDATE users SET ... password_is
  // _default = 0).
  const defaultPwBanner = (state.me && state.me.password_is_default)
    ? renderDefaultPasswordBanner()
    : null;

  // Skip-link is the first focusable element on the page so a
  // keyboard user lands on it before crawling through the sidebar +
  // topbar. Hidden until focused; jumps focus to <main> on click.
  const skip = h('a', { class: 'skip-link', href: '#main' }, t('Skip to main content'));
  return h('div', { class: 'app' },
    skip, sidebar, topbar,
    h('main', { class: 'content', id: 'main', tabindex: '-1' }, defaultPwBanner, deleteBanner, verifyBanner,
      h('div', { id: 'view' })),
    backdrop);
}

// renderDefaultPasswordBanner is the loud "you're on admin/admin"
// alert. Clicking it routes to Settings → General where the password
// card lets the user change it. Sticky red so it's impossible to
// miss; only renders when /api/auth/whoami says password_is_default
// (so a fresh seed shows it; any password change clears it).
function renderDefaultPasswordBanner() {
  return h('div', { class: 'banner err', role: 'alert' },
    h('strong', {}, t('Default password in use.')),
    ' ',

function currentCrumb() {
  const parts = state.route.replace(/^#/, '').split('/');
  const section = parts[0] || 'dashboard';
  // Map section slugs to their translated nav label so the top breadcrumb
  // tracks the sidebar. Falls through to a capitalised raw slug for
  // anything we don't recognise.
  const LABELS = {
    dashboard:     t('Dashboard'),
    adventures:    t('Adventures'),
    // Both prefixes resolve to viewCatalog (see the route table); the
    // label is the same in either case.
    catalog:       t('Catalog'),
    store:         t('Catalog'),
    events:         t('Events'),
    members:       t('Members'),
    organizations: t('Organizations'),
    library:       t('Library'),
    puzzles:       t('Puzzles'),
    purchases:     t('Purchases'),
    admins:        t('Admins'),
    simulator:     t('Simulator'),
    logs:          t('Logs'),
    audit:         t('Audit'),
    webhooks:      t('Webhooks'),
    manual:        t('Manual'),
    settings:      t('Settings'),
  };
  const sectionLabel = LABELS[section] || (section ? section[0].toUpperCase() + section.slice(1) : '');
  // Deep-link suffixes — without these, navigating directly to
  // /arrange#library/42 leaves the breadcrumb reading "Library" with
  // no signal that the user is on a detail page. The {section}
  // label still tracks the sidebar, the suffix tells them where in
  // it they are.
  if (section === 'events' && parts[1]) return t('{{section}} / Event #{{id}}', { section: sectionLabel, id: parts[1] });
  if (section === 'adventures' && parts[1]) return t('{{section}} / {{slug}}', { section: sectionLabel, slug: parts[1] });
  if (section === 'store' && parts[1]) return t('{{section}} / {{slug}}', { section: sectionLabel, slug: parts[1] });
  if (section === 'library' && parts[1]) return t('{{section}} / Puzzle #{{id}}', { section: sectionLabel, id: parts[1] });
  if (section === 'puzzles' && parts[1]) return t('{{section}} / Puzzle #{{id}}', { section: sectionLabel, id: parts[1] });
  if (section === 'webhooks' && parts[1] === 'log' && parts[2]) {
    return t('{{section}} / Log #{{id}}', { section: sectionLabel, id: parts[2] });
  }
  if (section === 'manual' && parts[1]) return t('{{section}} / {{anchor}}', { section: sectionLabel, anchor: parts[1] });
  return sectionLabel;
}

async function renderRoute() {
  const view = document.getElementById('view');
  view.replaceChildren(h('p', { class: 'muted' }, t('Loading…')));
  const r = state.route.replace(/^#/, '');
  const [section, arg] = r.split('/');
  const role = state.me.role;
  const isAdmin = role === 'admin';
  const isOrgAdmin = role === 'org_admin';

  // Role-based route guards: admins can't visit org-user pages and vice versa.
  const adminOnly = ['organizations', 'admins', 'logs'];
  const orgUserOnly = ['adventures', 'events', 'store', 'webhooks'];
  if (isAdmin && orgUserOnly.includes(section)) { nav('#organizations'); return; }
  if (!isAdmin && adminOnly.includes(section))   { nav('#dashboard');     return; }
  if (section === 'members' && !isOrgAdmin)      { nav('#dashboard');     return; }
  // Audit is open to admin + org_admin only — org_member never sees the
  // sidebar entry, but a hand-typed URL would otherwise reach the view
  // shell before the API rejected it.
  if (section === 'audit' && !isAdmin && !isOrgAdmin) { nav('#dashboard'); return; }

  // Event-detail is the only view with real-time updates. Entering it opens a
  // watch on the arrange WebSocket; leaving it releases that watch so the
  // server stops publishing to this client.
  if (section === 'events' && arg) {
    watchRun(parseInt(arg, 10));
  } else {
    unwatchRun();
  }
  // Stop the webhook-log auto-refresh whenever we leave the log
  // view. viewWebhooksLog itself starts a fresh poll on entry.
  if (!(section === 'webhooks' && arg === 'log')) {
    stopWebhookLogPoll();
  }

  try {
    switch (section) {
      case '':
      case 'dashboard':    return await viewDashboard(view);
      case 'adventures':   return arg ? await viewAdventureDetail(view, arg) : await viewAdventures(view);
      // 'store' alias keeps old bookmarks / inline links working
      // after the rename to 'catalog'. Same handlers; the URL just
      // happens to resolve via either prefix.
      case 'catalog':
      case 'store':        return arg ? await viewCatalogDetail(view, arg) : await viewCatalog(view);
      case 'events': {
        if (!arg) return await viewRuns(view);
        // /events/{id}/control is the live "race control" cockpit;
        // /events/{id} is the setup + wrap-up detail page.
        const parts = r.split('/');
        if (parts[2] === 'control') return await viewEventControl(view, parseInt(arg, 10));
        return await viewRunDetail(view, parseInt(arg, 10));
      }
      // Members / Admins / Audit / Purchases / Webhooks were lifted
      // into the Settings hub as tabs; old links / bookmarks /
      // inline calls keep working by redirecting to the new tabbed
      // location. The webhook log sub-route stays a real route since
      // it's a deeper surface than the integrations list.
      case 'members':      nav('#settings/members'); return;
      case 'admins':       nav('#settings/admins'); return;
      case 'audit':        nav('#settings/audit'); return;
      case 'purchases':    nav('#settings/purchases'); return;
      // Simulator moved onto each adventure's detail page; old
      // bookmarks land on the adventures list since we no longer
      // know which adventure they wanted to simulate.
      case 'simulator':    nav('#adventures'); return;
      case 'webhooks': {
        if (arg === 'log') {
          const parts = r.split('/');
          const endpointID = parts[2] ? parseInt(parts[2], 10) : 0;
          if (!endpointID) { nav('#settings/integrations'); return; }
          return await viewWebhooksLog(view, endpointID);
        }
        nav('#settings/integrations');
        return;
      }
      case 'organizations':return await viewOrganizations(view);
      case 'library':      return arg ? await viewLibraryEdit(view, arg) : await viewLibrary(view);
      case 'puzzles':      return arg ? await viewPuzzleEditRoute(view, arg) : await viewPuzzles(view);
      case 'logs':         return await viewLogs(view);
      case 'manual':       return viewManual(view, arg);
      case 'settings':     return await viewSettings(view, arg);
      default: view.replaceChildren(h('p', {}, t('Not found')));
    }
  } catch (err) {
    // The err.message is whatever JS or fetch produced — usually
    // English ("Failed to fetch"), but at least the leading label is
    // localised. Better than a bare untranslated string.
    view.replaceChildren(h('p', { class: 'err' },
      t('Something went wrong: {{err}}', { err: String(err) })));
  }
}

/* ========== Arrange subscription stream ========== */
// arrangeWS is a single long-lived connection that pushes event-detail
// updates while an arranger has an event open. Mutations still ride HTTP;
// this socket only receives change notifications so the view stays in
// sync with player progress, team creates, etc., without polling.
let arrangeWS = null;
let arrangeWSBackoff = 500;
let watchedEventID = 0;
let arrangePushTimer = null;

// arrangeUIState preserves transient view state for the event-detail
// page across WS-triggered re-renders. viewRunDetail rebuilds the DOM
// from scratch on every push, so without this any cards the arranger
// expanded (or collapsed away from the default) snap back on the next
// position update — jarring during a live event when pushes arrive
// every few seconds. Keys are scoped by event/team ID so the state
// doesn't bleed between different events.
const arrangeUIState = {
  teamLinksPanelOpen: new Map(), // event_id -> bool (overrides roster-size default)
  teamLinkRowOpen: new Set(),    // team_id; presence = expanded
  // Race-control team filter — multi-select set of team IDs scoped per
  // event. Empty set = "all teams". Survives WS-driven re-renders so a
  // race director who's narrowed focus to two teams doesn't see the
  // selection wiped every time a position update lands.
  controlFilter: new Map(),      // event_id -> Set<team_id>
};

// Arrange-side connection banner. Only shown while watchedEventID !=
// 0 — outside event detail the WS is idle and a banner would just be
// noise. Two tiers (warn/err) match play.html / live.html so the
// behaviour reads the same across surfaces.
let arrangeStatusEl = null;
let arrangeStatusTimer = null;
function setArrangeStatus(level, text) {
  if (!arrangeStatusEl) {
    arrangeStatusEl = document.createElement('div');
    arrangeStatusEl.className = 'ws-status';
    arrangeStatusEl.setAttribute('role', 'status');
    arrangeStatusEl.setAttribute('aria-live', 'polite');
    document.body.append(arrangeStatusEl);
  }
  arrangeStatusEl.classList.remove('warn', 'err', 'show');
  if (!level) return;
  arrangeStatusEl.classList.add(level, 'show');
  arrangeStatusEl.textContent = text;
}

function ensureArrangeWS() {
  if (arrangeWS && (arrangeWS.readyState === 0 || arrangeWS.readyState === 1)) return;
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  arrangeWS = new WebSocket(`${proto}//${location.host}/ws/arrange`);
  arrangeWS.onopen = () => {
    arrangeWSBackoff = 500;
    if (arrangeStatusTimer) { clearTimeout(arrangeStatusTimer); arrangeStatusTimer = null; }
    setArrangeStatus('', '');
    // Server-side message kinds were renamed from "*_run" to
    // "*_event" in migration 0009 — the client lagged behind, so
    // every watch_run frame was silently dropped by the server's
    // unknown-kind default arm and the event-detail page never
    // got live updates. Send the right kind name now.
    if (watchedEventID) arrangeWS.send(JSON.stringify({ kind: 'watch_event', data: { event_id: watchedEventID } }));
  };
  arrangeWS.onmessage = (ev) => {
    let msg; try { msg = JSON.parse(ev.data); } catch { return; }
    if (!msg || !msg.kind) return;
    // Any server push re-renders the current event-detail view. Debounced so
    // a burst of changes (eg. multiple position updates from players
    // pinging at once) collapses into a single re-render.
    if (msg.kind === 'positions' || msg.kind === 'tracks' ||
        msg.kind === 'activity'   || msg.kind === 'event_detail') {
      if (arrangePushTimer) clearTimeout(arrangePushTimer);
      arrangePushTimer = setTimeout(() => {
        const r = state.route.replace(/^#/, '');
        const parts = r.split('/');
        const [section, arg] = parts;
        if (section === 'events' && arg) {
          const view = document.getElementById('view');
          if (!view) return;
          // Race control gets the same WS pushes as the setup
          // detail page; both views are live, only the layout
          // and density differ.
          if (parts[2] === 'control') viewEventControl(view, parseInt(arg, 10));
          else viewRunDetail(view, parseInt(arg, 10));
        }
      }, 300);
    }
  };
  arrangeWS.onclose = () => {
    const delay = Math.min(arrangeWSBackoff, 10000);
    arrangeWSBackoff = Math.min(arrangeWSBackoff * 2, 10000);
    setTimeout(ensureArrangeWS, delay);
    // Suppress the banner when the user isn't on an event-detail view —
    // the WS has nothing useful to say there and the banner would
    // distract during catalog / settings work.
    if (arrangeStatusTimer) clearTimeout(arrangeStatusTimer);
    if (!watchedEventID) { setArrangeStatus('', ''); return; }
    arrangeStatusTimer = setTimeout(() => {
      if (!watchedEventID) return;
      setArrangeStatus('warn', t('Reconnecting — live updates paused.'));
      arrangeStatusTimer = setTimeout(() => {
        if (!watchedEventID) return;
        setArrangeStatus('err', t('Disconnected — event data may be stale.'));
      }, 13000);
    }, 2000);
  };
}

function watchRun(runID) {
  if (!runID || runID === watchedEventID) { watchedEventID = runID; ensureArrangeWS(); return; }
  watchedEventID = runID;
  ensureArrangeWS();
  if (arrangeWS && arrangeWS.readyState === 1) {
    arrangeWS.send(JSON.stringify({ kind: 'watch_event', data: { event_id: runID } }));
  }
}

function unwatchRun() {
  if (!watchedEventID) return;
  watchedEventID = 0;
  if (arrangeStatusTimer) { clearTimeout(arrangeStatusTimer); arrangeStatusTimer = null; }
  setArrangeStatus('', '');
  if (arrangeWS && arrangeWS.readyState === 1) {
    arrangeWS.send(JSON.stringify({ kind: 'unwatch_event' }));
  }
}
