async function openEditAdventureMeta(adv) {
  await modal(t('Edit adventure'), ({ body, close }) => {
    const slug  = h('input', { value: adv.slug, required: true, pattern: '[a-z0-9-]+' });
    const title = h('input', { value: adv.title, required: true });
    const desc  = h('textarea', { rows: 2 }, adv.description || '');
    const author = h('input', { value: adv.author || '' });
    // Custom copy for the first-run welcome dialog and the end-of-run
    // stats screen. Empty keeps the built-in default copy.
    const intro = h('textarea', { rows: 5,
      placeholder: t('Shown on the first-run welcome overlay — leave empty for the default welcome + tips.'),
    }, adv.intro_text || '');
    const outro = h('textarea', { rows: 4,
      placeholder: t('Shown under the stats when the team finishes — leave empty for the default celebratory line.'),
    }, adv.outro_text || '');
    const initialAccent    = adv.accent_color           || '';
    const initialSecondary = adv.accent_secondary_color || '';
    const initialBg        = adv.background_color      || '';
    const initialText      = adv.text_color            || '';
    const cAccent     = colorRow(t('Accent — buttons, progress'),      initialAccent);
    const cSecondary  = colorRow(t('Secondary — titles, status pill'), initialSecondary);
    const cBackground = colorRow(t('Background'),                      initialBg);
    const cText       = colorRow(t('Text'),                            initialText);

    // Cover picture — uploaded inline against the adventure row. The
    // preview is rebuilt on upload/remove so the arranger sees the
    // change without closing the modal; renderRoute() below refreshes
    // the library grid so other surfaces pick the new URL up too.
    const coverPreview = h('span');
    const redrawCover = () => {
      coverPreview.replaceChildren(adventureCover(adv, 72));
    };
    redrawCover();
    const coverFile = h('input', { type: 'file', accept: 'image/*', style: 'display:none' });
    const coverActions = h('div', { class: 'row', style: 'gap:.4rem; flex-wrap:wrap' });
    const uploadCoverBtn = h('button', { class: 'btn small', type: 'button' },
      icon(ICONS.plus), t('Upload cover'));
    uploadCoverBtn.addEventListener('click', () => coverFile.click());
    const removeCoverBtn = h('button', { class: 'btn small danger', type: 'button' },
      icon(ICONS.trash), t('Remove cover'));
    removeCoverBtn.addEventListener('click', async () => {
      const rr = await api(`/api/admin/adventures/${encodeURIComponent(adv.slug)}/avatar`, { method: 'DELETE' });
      if (rr.status === 204) {
        adv.avatar_url = '';
        toastOk(t('Cover removed'));
        redrawCoverActions(); redrawCover();
      } else {
        toastErr(rr.body?.error || t('error {{status}}', { status: rr.status }));
      }
    });
    coverFile.addEventListener('change', async () => {
      const f = coverFile.files?.[0];
      if (!f) return;
      const fd = new FormData();
      fd.append('file', f);
      const res = await fetch(`/api/admin/adventures/${encodeURIComponent(adv.slug)}/avatar`, {
        method: 'POST', body: fd, credentials: 'same-origin',
      });
      coverFile.value = '';
      if (res.ok) {
        const body = await res.json().catch(() => ({}));
        adv.avatar_url = (body.url || `/adventure-assets/avatar/${encodeURIComponent(adv.slug)}`) + '?v=' + Date.now();
        toastOk(t('Cover updated'));
        redrawCoverActions(); redrawCover();
      } else {
        const errTxt = await res.text().catch(() => '');
        toastErr(errTxt || t('error {{status}}', { status: res.status }));
      }
    });
    const redrawCoverActions = () => {
      coverActions.replaceChildren(uploadCoverBtn);
      if (adv.avatar_url) coverActions.append(removeCoverBtn);
    };
    redrawCoverActions();
    const coverRow = h('div', { style: 'display:flex; align-items:center; gap:.75rem; margin:.25rem 0 1rem' },
      coverPreview,
      h('div', { style: 'display:flex; flex-direction:column; gap:.3rem' },
        h('span', { class: 'muted', style: 'font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; font-weight:700' },
          t('Cover picture')),
        coverActions));

    const form = h('form', {},
      h('label', { class: 'field' }, h('span', {}, t('Slug')), slug),
      h('label', { class: 'field' }, h('span', {}, t('Title')), title),
      h('label', { class: 'field' }, h('span', {}, t('Description')), desc),
      h('label', { class: 'field' }, h('span', {}, t('Author')), author),
      coverRow, coverFile,
      h('h3', { style: 'margin-top:1rem' }, t('Welcome & completion copy')),
      h('label', { class: 'field' }, h('span', {}, t('Intro — shown on the welcome screen')), intro),
      attachMdPreview(intro),
      h('p', { class: 'muted', style: 'font-size:.8rem; margin:.35rem 0 .75rem' }, mdSupportedHint()),
      h('label', { class: 'field' }, h('span', {}, t('Outro — shown on the completion screen')), outro),
      attachMdPreview(outro),
      h('p', { class: 'muted', style: 'font-size:.8rem; margin:.35rem 0 .75rem' }, mdSupportedHint()),
      h('h3', { style: 'margin-top:1rem' }, t('Brand colours')),
      cAccent.el, cSecondary.el, cBackground.el, cText.el,
      h('div', { class: 'row end' },
        h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, t('Cancel')),
        h('button', { class: 'btn primary', type: 'submit' }, t('Save'))));
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {};
      if (slug.value.trim() !== adv.slug) payload.slug = slug.value.trim();
      if (title.value.trim() !== adv.title) payload.title = title.value.trim();
      if (desc.value !== (adv.description || '')) payload.description = desc.value;
      if (author.value.trim() !== (adv.author || '')) payload.author = author.value.trim();
      if (intro.value !== (adv.intro_text || '')) payload.intro_text = intro.value;
      if (outro.value !== (adv.outro_text || '')) payload.outro_text = outro.value;
      if (cAccent.get()     !== initialAccent)    payload.accent_color           = cAccent.get();
      if (cSecondary.get()  !== initialSecondary) payload.accent_secondary_color = cSecondary.get();
      if (cBackground.get() !== initialBg)        payload.background_color       = cBackground.get();
      if (cText.get()       !== initialText)      payload.text_color             = cText.get();
      if (Object.keys(payload).length === 0) { close(null); return; }
      const r = await api(`/api/admin/adventures/${encodeURIComponent(adv.slug)}`, {
        method: 'PATCH', body: JSON.stringify(payload),
      });
      if (r.status === 204) {
        toastOk(t('Saved'));
        close(true);
        // If the slug didn't change the hash stays the same, so nav()
        // wouldn't fire hashchange and viewLibraryEdit wouldn't re-fetch
        // — any open puzzle-editor preview card would keep applying the
        // old colour palette until a hard reload. Re-render explicitly
        // so the cached `adv` object is replaced with the saved state.
        const nextSlug = payload.slug || adv.slug;
        if (nextSlug !== adv.slug) {
          nav('#library/' + nextSlug);
        } else {
          renderRoute();
        }
      } else {
        toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
      }
    });
    body.append(form);
  });
}

async function confirmDeleteAdventure(adv) {
  const pw = await promptPassword(t('Delete adventure “{{title}}”?', { title: adv.title }),
    t('This removes the adventure and all its puzzles. Enter your password to confirm.'));
  if (!pw) return;
  const r = await api(`/api/admin/adventures/${encodeURIComponent(adv.slug)}`, {
    method: 'DELETE', headers: { 'X-Confirm-Password': pw },
  });
  if (r.status === 204) { toastOk(t('Deleted')); nav(state.me.role === 'admin' ? '#library' : '#adventures'); }
  else toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
}

// autosize makes a textarea grow to fit its content — used in the
// WYSIWYG puzzle editor so multi-line prompts render in the preview the
// same way they'll render in the play view.
// mdSupportedHint is the little "Markdown: ..." muted caption shown
// under arranger text fields that the server renders through goldmark.
// Consistent wording in every place keeps the hint reliable.
function mdSupportedHint() {
  return t('Markdown supported: **bold**, *italics*, [links](https://…), `code`, - bullet lists.');
}

// attachMdPreview returns a live-updating preview div for a textarea.
// The server endpoint runs the same goldmark pipeline used at egress,
// so what the author sees here is exactly what the player will see.
// The fetch is debounced so the author can type "## a real heading"
// without the server hearing every keystroke, and the request body
// is sized-capped indirectly by the textarea's own content length.
function attachMdPreview(textarea, extraClass) {
  const preview = h('div', { class: 'md-preview' + (extraClass ? ' ' + extraClass : '') });
  preview.setAttribute('aria-live', 'polite');
  // Seed text so the pane isn't empty before the first fetch comes
  // back or when the textarea is empty — an empty preview with no
  // explanation reads as broken.
  const paintEmpty = () => {
    preview.innerHTML = '';
    preview.append(h('span', { class: 'muted' }, t('Preview appears here as you type.')));
  };
  let timer = null;
  let inFlight = false;
  let pending = false;
  const render = async () => {
    if (inFlight) { pending = true; return; }
    const text = textarea.value;
    if (!text.trim()) { paintEmpty(); return; }
    inFlight = true;
    try {
      const r = await api('/api/admin/markdown/preview', {
        method: 'POST', body: JSON.stringify({ text }),
      });
      if (r.status === 200 && typeof r.body?.html === 'string') {
        preview.innerHTML = r.body.html;
      }
    } catch { /* keep last successful render */ }
    inFlight = false;
    if (pending) { pending = false; render(); }
  };
  textarea.addEventListener('input', () => {
    if (timer) clearTimeout(timer);
    timer = setTimeout(render, 200);
  });
  // First paint: whatever's already in the textarea.
  render();
  return preview;
}

function autosize(el) {
  const resize = () => {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  };
  el.addEventListener('input', resize);
  // Resize after the element is mounted and has a real scrollHeight.
  requestAnimationFrame(resize);
}

// applyAdventureColors paints the optional per-adventure brand palette
// onto `el` so its descendants (the puzzle-editor preview card) show the
// same accents, background and text colour a player would see. Mirrors
// play.html's applyColors but scoped to an element rather than the
// document root. `adv` may be null (library puzzle) — in that case the
// card keeps the editor's defaults.
function applyAdventureColors(el, adv) {
  if (!adv) return;
  if (adv.accent_color) {
    el.style.setProperty('--accent', adv.accent_color);
    el.style.setProperty('--accent-fg', readableOn(adv.accent_color));
  }
  const sec = adv.accent_secondary_color || adv.accent_color;
  if (sec) el.style.setProperty('--accent-secondary', sec);
  if (adv.background_color) {
    // The preview card uses --surface as its own background, so override
    // that too — the card should read as the adventure's page colour.
    el.style.setProperty('--bg', adv.background_color);
    el.style.setProperty('--surface', adv.background_color);
  }
  if (adv.text_color) {
    el.style.setProperty('--ink', adv.text_color);
    el.style.setProperty('--text', adv.text_color);
  }
}

// readableOn returns black or white — whichever has better contrast on
// the supplied hex colour. Matches play.html so accent-fg stays legible
// whatever accent the arranger picked.
function readableOn(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex);
  if (!m) return '#ffffff';
  const n = parseInt(m[1], 16);
  const srgb = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => {
    const s = v / 255;
    return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
  });
  const L = 0.2126 * srgb[0] + 0.7152 * srgb[1] + 0.0722 * srgb[2];
  return L > 0.5 ? '#000000' : '#ffffff';
}

async function openEditPuzzle(adv, page /* or null */) {
  const creating = !page;
  const standalone = !adv; // library puzzle with no adventure context
  const title = creating
    ? t('New puzzle')
    : standalone
      ? (page.title ? t('Library: {{title}}', { title: page.title }) : t('Library puzzle'))
      : t('Puzzle {{i}}', { i: page.index + 1 });
  await modal(title, ({ body, close }) => {
    // ---- Preview card: mirrors play.html's puzzle shape ----
    // None of these are HTML-`required` — an arranger often saves a stub
    // with nothing but a location (especially via Quick Puzzle) and
    // fills the text in later. The backend's pageWriteRequest.validate
    // matches: prompt and accept may be empty, only radius_m is checked.
    // Marking them required here silently blocks the Save submit.
    const titleInput  = h('textarea', { class: 'pe pe-title', rows: 1, placeholder: t('Puzzle title') });
    const promptInput = h('textarea', { class: 'pe pe-prompt', rows: 3, placeholder: t('What the player sees…') });
    const hintInput   = h('textarea', { class: 'pe pe-hint', rows: 1, placeholder: t('(optional hint)') });
    titleInput.value  = page?.title  || '';
    promptInput.value = page?.prompt || '';
    hintInput.value   = page?.hint   || '';

    const imagesHost = h('div', { class: 'pe-images' });
    const images = page?.images ? [...page.images] : [];

    // File input parked at body level — Firefox won't open the picker if
    // the click path goes through a transformed modal ancestor. Label→for
    // binding drives it from the editor without touching that path.
    const inputID = 'zv-image-input-' + (page?.id || 'new') + '-' + Math.random().toString(36).slice(2, 8);
    const file = document.createElement('input');
    file.id = inputID;
    file.type = 'file';
    file.accept = 'image/*';
    Object.assign(file.style, {
      position: 'fixed', left: '-10000px', top: '0',
      width: '1px', height: '1px', opacity: '0',
    });
    file.setAttribute('tabindex', '-1');
    document.body.appendChild(file);

    const drawImages = () => {
      imagesHost.replaceChildren();
      for (const im of images) {
        const wrap = h('div', { class: 'pe-image-wrap' });
        wrap.append(
          h('img', { class: 'pe-image', src: im.url, alt: '' }),
          h('button', {
            class: 'btn small danger pe-image-remove', type: 'button', title: t('Remove'),
            on: { click: async () => {
              const rr = await api(`/api/admin/images/${im.id}`, { method: 'DELETE' });
              if (rr.status === 204) {
                const i = images.indexOf(im);
                if (i >= 0) images.splice(i, 1);
                drawImages();
                toastOk(t('Image removed'));
              } else {
                toastErr(rr.body?.error || t('error {{status}}', { status: rr.status }));
              }
            } },
          }, icon(ICONS.trash)),
        );
        imagesHost.append(wrap);
      }
      // Add-image tile: clickable when the page already exists, disabled
      // placeholder when creating (the upload endpoint needs a page id).
      if (page) {
        const addTile = document.createElement('label');
        addTile.className = 'pe-image-add';
        addTile.htmlFor = inputID;
        addTile.append(icon(ICONS.plus));
        addTile.append(document.createTextNode(' ' + t('Click to add image')));
        imagesHost.append(addTile);
      } else {
        imagesHost.append(h('div', { class: 'pe-image-add disabled' },
          icon(ICONS.plus), ' ' + t('Save the puzzle first, then add images')));
      }
    };
    drawImages();

    file.addEventListener('change', async () => {
      if (!file.files?.[0]) return;
      const fd = new FormData();
      fd.append('file', file.files[0]);
      const res = await fetch(`/api/admin/pages/${page.id}/images`, {
        method: 'POST', body: fd, credentials: 'same-origin',
      });
      if (res.ok) {
        const im = await res.json();
        images.push(im);
        drawImages();
        toastOk(t('Image added'));
      } else {
        const errTxt = await res.text();
        toastErr(errTxt || t('error {{status}}', { status: res.status }));
      }
      file.value = '';
    });

    const dock = h('div', { class: 'pe-dock' },
      h('p', { class: 'pe-dock-label' }, t('Player answer bar (preview)')),
      h('input', { disabled: '', placeholder: t('Your answer') }),
      h('button', { class: 'btn primary', disabled: '' }, t('Submit')));

    // Live markdown preview below each rich-text textarea. The server
    // renders what the player will see, so authors can verify their
    // `# heading`, `- list`, `**bold**` actually look right without
    // saving and opening /play.
    const promptPreview = attachMdPreview(promptInput);
    const hintPreview   = attachMdPreview(hintInput, 'compact');
    const previewCard = h('div', { class: 'puzzle-editor' },
      titleInput,
      imagesHost,
      promptInput,
      promptPreview,
      h('div', { class: 'pe-hint-row' },
        h('span', { class: 'tag' }, t('Hint:')),
        hintInput),
      hintPreview,
      dock,
      h('p', { class: 'muted', style: 'font-size:.75rem; margin:.5rem 0 0' }, mdSupportedHint()),
    );
    // Paint the adventure's brand colours onto the preview card so the
    // arranger sees the puzzle with the same palette a player will.
    // Library puzzles (no adventure context) fall through to the editor
    // defaults. Mirrors play.html's applyColors but scoped to the card.
    applyAdventureColors(previewCard, adv);

    // ---- Settings panel: fields with no visual player rendering ----
    const accept = h('input', {
      value: (page?.accept || []).join(', '),
      placeholder: t('hello, hi'),
    });
    // For a fresh puzzle, inherit the location from the previous puzzle
    // in the adventure — adventures are almost always a cluster, so
    // "start near the last pin" beats "start in central Stockholm".
    // Standalone edits always come with an existing page, so the
    // fallback only kicks in for attached-adventure creates.
    const fallback = (!standalone && adv.pages.length > 0)
      ? { lat: adv.pages[adv.pages.length - 1].lat, lng: adv.pages[adv.pages.length - 1].lng }
      : { lat: 59.3293, lng: 18.0686 };
    // A quick-puzzle created without GPS lands at (0, 0) on the server;
    // claim the pending fix (if any) so the editor can apply it when it
    // arrives, and fall back to the default view in the meantime instead
    // of opening the map in the Gulf of Guinea.
    const pendingGPSMatch = pendingQuickPuzzleGPS && page && pendingQuickPuzzleGPS.puzzleID === page.id
      ? pendingQuickPuzzleGPS : null;
    if (pendingGPSMatch) pendingQuickPuzzleGPS = null;
    const waitingForGPS = !!pendingGPSMatch && page.lat === 0 && page.lng === 0;
    const initialLat = (page && !waitingForGPS) ? page.lat : fallback.lat;
    const initialLng = (page && !waitingForGPS) ? page.lng : fallback.lng;

    const lat    = h('input', { type: 'number', step: 'any', required: true, value: initialLat });
    const lng    = h('input', { type: 'number', step: 'any', required: true, value: initialLng });
    const gated  = h('input', { type: 'checkbox' });
    if (page?.radius_m) gated.checked = true;
    const radius = h('input', { type: 'number', step: 'any', min: '1', value: page?.radius_m || 50 });
    const disabled = h('input', { type: 'checkbox' });
    if (page?.disabled) disabled.checked = true;

    const notes = h('textarea', { rows: 2,
      placeholder: t('e.g. "statue at the fountain, check opening hours"'),
    });
    notes.value = page?.notes || '';

    const gpsBtn = h('button', { class: 'btn small', type: 'button', title: t('Use this device\'s GPS') },
      icon(ICONS.crosshair), t('Use my location'));
    const mapEl  = h('div', { class: 'pe-map' });

    const settings = h('div', { class: 'puzzle-settings' },
      h('h3', {}, t('Settings')),
      h('label', { class: 'field' },
        h('span', {}, t('Accepted answers — comma-separated')), accept),
      h('label', { class: 'field' },
        h('span', {}, t('Internal notes — not shown to players')), notes),
      h('h3', {}, t('Location')),
      h('div', { class: 'pe-loc-head' },
        h('span', { class: 'muted', style: 'font-size:.85rem' },
          t('Drag the pin, click the map, or press the button')),
        gpsBtn),
      mapEl,
      h('div', { class: 'pe-loc-row' },
        h('label', { class: 'field' }, h('span', {}, t('Latitude')), lat),
        h('label', { class: 'field' }, h('span', {}, t('Longitude')), lng)),
      h('label', { style: 'display:flex; gap:.4rem; align-items:center; margin: .25rem 0 .5rem' },
        gated, h('span', { style: 'margin:0' }, t('Gated — player must reach location first'))),
      h('label', { class: 'field' }, h('span', {}, t('Gate radius (metres)')), radius),
      h('label', { style: 'display:flex; gap:.4rem; align-items:center; margin: .75rem 0 .25rem' },
        disabled, h('span', { style: 'margin:0' },
          t('Disabled — players skip this puzzle; the content and gate stay saved'))),
    );

    const form = h('form', {}, previewCard, settings,
      h('div', { class: 'row end', style: 'margin-top:1rem' },
        h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, t('Cancel')),
        h('button', { class: 'btn primary', type: 'submit' }, creating ? t('Create') : t('Save'))));

    // saved flips true the moment a save (POST or PATCH) succeeds, so
    // the modal:close cleanup below knows not to delete the server-side
    // stub on the way out. Any other exit path (Cancel, backdrop, Esc,
    // timeline switchTo) leaves it false.
    let saved = false;
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        title:    titleInput.value.trim(),
        prompt:   promptInput.value.trim(),
        hint:     hintInput.value.trim(),
        notes:    notes.value.trim(),
        accept:   accept.value.split(',').map((s) => s.trim()).filter(Boolean),
        lat:      parseFloat(lat.value),
        lng:      parseFloat(lng.value),
        disabled: disabled.checked,
      };
      if (gated.checked) payload.radius_m = parseFloat(radius.value);
      if (creating) {
        const r = await api(`/api/admin/adventures/${encodeURIComponent(adv.slug)}/pages`, {
          method: 'POST', body: JSON.stringify(payload),
        });
        if (r.status !== 201) { toastErr(r.body?.error || t('error {{status}}', { status: r.status })); return; }
        toastOk(t('Puzzle created'));
        saved = true;
        file.remove();
        close(true);
        // Reopen in edit mode so images can be uploaded immediately.
        const fresh = await api(`/api/admin/adventures/${encodeURIComponent(adv.slug)}/edit`);
        if (fresh.ok) {
          const np = (fresh.body.pages || []).find((p) => p.id === r.body.id);
          if (np) { openEditPuzzle(fresh.body, np); return; }
        }
        renderRoute();
        return;
      }
      const r = await api(`/api/admin/pages/${page.id}`, {
        method: 'PATCH', body: JSON.stringify(payload),
      });
      if (r.status !== 204) { toastErr(r.body?.error || t('error {{status}}', { status: r.status })); return; }
      toastOk(t('Puzzle saved'));
      saved = true;
      file.remove();
      close(true);
      renderRoute();
    });

    // ---- Puzzle timeline: quick-switch between puzzles in this adventure ----
    // Dirty-check compares current inputs to the page's starting values so
    // a stray click doesn't silently lose edits.
    const isDirty = () => (
      titleInput.value  !== (page?.title  || '') ||
      promptInput.value !== (page?.prompt || '') ||
      hintInput.value   !== (page?.hint   || '') ||
      notes.value       !== (page?.notes  || '') ||
      accept.value      !== (page?.accept || []).join(', ') ||
      parseFloat(lat.value) !== (page ? page.lat : 59.3293) ||
      parseFloat(lng.value) !== (page ? page.lng : 18.0686) ||
      gated.checked !== !!page?.radius_m ||
      (gated.checked && parseFloat(radius.value) !== (page?.radius_m || 50)) ||
      disabled.checked !== !!page?.disabled
    );
    const switchTo = (targetPage) => {
      if (isDirty() && !confirm(t('Discard unsaved changes in this puzzle?'))) return;
      file.remove();
      close(null);
      openEditPuzzle(adv, targetPage);
    };

    // Timeline is rebuilt after every drag-reorder so the pills can show
    // the new order without closing the modal. Standalone library
    // puzzles have no siblings and no reorder surface, so we skip the
    // whole strip there — a small "In library" banner replaces it.
    const timeline = h('div', { class: 'puzzle-timeline' });
    if (standalone) {
      timeline.style.display = 'none';
    }
    const renderTimeline = () => {
      if (standalone) return;
      timeline.replaceChildren();
      const arrow = () => h('span', { class: 'pt-arrow', 'aria-hidden': 'true' }, '→');
      adv.pages.forEach((p, i) => {
        if (i > 0) timeline.append(arrow());
        const current = page && p.id === page.id;
        const titled = !!(p.title && p.title.trim());
        const cls = ['pt-pill'];
        if (current)    cls.push('current');
        if (p.disabled) cls.push('disabled');
        if (!titled)    cls.push('untitled');
        const pill = h('button', {
          class: cls.join(' '),
          type: 'button',
          draggable: 'true',
          title: (titled ? p.title : t('Puzzle {{i}} (untitled)', { i: i + 1 })) + (p.disabled ? t(' — disabled') : ''),
          'data-page-id': p.id,
          'data-page-pos': i,
          on: { click: () => { if (!current) switchTo(p); } },
        }, h('span', { class: 'pt-label' }, titled ? p.title : t('Puzzle {{i}}', { i: i + 1 })));
        wireDrag(pill, p, i);
        timeline.append(pill);
      });
      if (adv.pages.length > 0) timeline.append(arrow());
      if (creating) {
        timeline.append(h('span', { class: 'pt-pill current', title: t('This puzzle') }, t('New')));
      } else {
        timeline.append(h('button', {
          class: 'pt-pill pt-plus', type: 'button', title: t('New puzzle'),
          on: { click: () => switchTo(null) },
        }, '+'));
      }
    };

    // wireDrag / onReorder implement a Google-Slides-style reorder:
    // drag a pill, drop on another, server reorders, we re-render.
    // We mutate adv.pages locally on success so subsequent operations
    // (another drag, a save) see the new order immediately.
    let dragFrom = -1;
    const clearDropHints = () => {
      for (const el of timeline.querySelectorAll('.drop-before, .drop-after')) {
        el.classList.remove('drop-before', 'drop-after');
      }
    };
    const onReorder = async (fromPos, toPos) => {
      if (fromPos === toPos || toPos < 0 || toPos >= adv.pages.length) return;
      const next = adv.pages.slice();
      const [moved] = next.splice(fromPos, 1);
      next.splice(toPos, 0, moved);
      const r = await api(`/api/admin/adventures/${encodeURIComponent(adv.slug)}/pages/reorder`, {
        method: 'PATCH', body: JSON.stringify({ page_ids: next.map((p) => p.id) }),
      });
      if (r.status !== 204) { toastErr(r.body?.error || t('error {{status}}', { status: r.status })); return; }
      adv.pages = next.map((p, i) => ({ ...p, index: i }));
      renderTimeline();
    };
    function wireDrag(pill, p, i) {
      // HTML5 drag-and-drop for desktop mice. Touch screens never fire
      // these — the touch listeners below translate a single-finger
      // horizontal drag into the same dragFrom / drop-hint state.
      pill.addEventListener('dragstart', (e) => {
        dragFrom = i;
        pill.classList.add('drag-ghost');
        e.dataTransfer.effectAllowed = 'move';
        // Firefox refuses to initiate the drag unless some data is set.
        e.dataTransfer.setData('text/plain', String(p.id));
      });
      pill.addEventListener('dragend', () => {
        pill.classList.remove('drag-ghost');
        clearDropHints();
      });
      pill.addEventListener('dragover', (e) => {
        if (dragFrom < 0 || dragFrom === i) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        const rect = pill.getBoundingClientRect();
        const before = (e.clientX - rect.left) < rect.width / 2;
        clearDropHints();
        pill.classList.add(before ? 'drop-before' : 'drop-after');
      });
      pill.addEventListener('dragleave', () => {
        pill.classList.remove('drop-before', 'drop-after');
      });
      pill.addEventListener('drop', (e) => {
        if (dragFrom < 0) return;
        e.preventDefault();
        const rect = pill.getBoundingClientRect();
        const before = (e.clientX - rect.left) < rect.width / 2;
        const target = before ? i : i + 1;
        // Splice semantics: removing fromPos before inserting at target
        // shifts the target by one when fromPos < target.
        const adjusted = dragFrom < target ? target - 1 : target;
        clearDropHints();
        const from = dragFrom;
        dragFrom = -1;
        onReorder(from, adjusted);
      });

      // Touch drag for mobile. Touch events "stick" to the touchstart
      // target, so we can wire the whole drag per-pill and still track
      // the finger when it moves over a sibling — document.elementFromPoint
      // gives us the live drop target at each move.
      //
      // touchMode cycles through three states:
      //   null  — finger is down, we haven't decided yet
      //   drag  — past the threshold and horizontal-dominant, owning the gesture
      //   skip  — past the threshold but mostly vertical; it's a scroll, stand down
      let touchStartX = 0, touchStartY = 0, touchMode = null;
      const dropTargetAt = (clientX, clientY) => {
        const el = document.elementFromPoint(clientX, clientY);
        const t = el?.closest('[data-page-pos]');
        if (!t || t === pill) return null;
        const idx = parseInt(t.getAttribute('data-page-pos'), 10);
        if (isNaN(idx) || idx === i) return null;
        return { el: t, idx };
      };
      pill.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) return;
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchMode = null;
      }, { passive: true });
      pill.addEventListener('touchmove', (e) => {
        if (touchMode === 'skip' || e.touches.length !== 1) return;
        const t = e.touches[0];
        if (touchMode === null) {
          const dx = t.clientX - touchStartX;
          const dy = t.clientY - touchStartY;
          if (Math.hypot(dx, dy) < 8) return; // below the threshold; still a tap
          // Vertical-dominant motion is almost certainly an attempt to
          // scroll the modal — don't hijack it.
          if (Math.abs(dy) > Math.abs(dx)) { touchMode = 'skip'; return; }
          touchMode = 'drag';
          dragFrom = i;
          pill.classList.add('drag-ghost');
        }
        e.preventDefault();
        clearDropHints();
        const drop = dropTargetAt(t.clientX, t.clientY);
        if (!drop) return;
        const rect = drop.el.getBoundingClientRect();
        const before = (t.clientX - rect.left) < rect.width / 2;
        drop.el.classList.add(before ? 'drop-before' : 'drop-after');
      }, { passive: false });
      pill.addEventListener('touchend', (e) => {
        if (touchMode !== 'drag') { touchMode = null; return; }
        touchMode = null;
        const last = e.changedTouches[0];
        let adjusted = -1;
        if (last) {
          const drop = dropTargetAt(last.clientX, last.clientY);
          if (drop) {
            const rect = drop.el.getBoundingClientRect();
            const before = (last.clientX - rect.left) < rect.width / 2;
            const desired = before ? drop.idx : drop.idx + 1;
            adjusted = i < desired ? desired - 1 : desired;
          }
        }
        clearDropHints();
        pill.classList.remove('drag-ghost');
        const from = dragFrom;
        dragFrom = -1;
        // Suppress the synthetic click that follows touchend, so the
        // pill we just released on doesn't also trigger switchTo.
        e.preventDefault();
        if (adjusted >= 0) onReorder(from, adjusted);
      }, { passive: false });
      pill.addEventListener('touchcancel', () => {
        if (touchMode === 'drag') {
          clearDropHints();
          pill.classList.remove('drag-ghost');
          dragFrom = -1;
        }
        touchMode = null;
      }, { passive: true });
    }
    renderTimeline();

    body.append(timeline);
    // Tiny banner above the preview card: which adventure the puzzle
    // belongs to, so an author editing a library puzzle never has to
    // guess where their edits will apply.
    if (!creating) {
      const assignLabel = standalone
        ? h('span', {}, t('📚 Library puzzle — not yet in any adventure'))
        : h('span', {}, t('In adventure '),
            h('strong', {}, adv.title || adv.slug),
            t(', position '), h('strong', {}, String((page.index ?? 0) + 1)));
      body.append(h('p', { class: 'muted', style: 'margin: .25rem 0 1rem; font-size:.9rem' }, assignLabel));
    }
    body.append(form);
    autosize(titleInput); autosize(promptInput); autosize(hintInput); autosize(notes);

    // Location editor (Leaflet). Wiring lives in renderPuzzleLocationMap
    // so the pile of marker/circle/handle state doesn't bleed into this
    // function.
    const locMap = renderPuzzleLocationMap({
      mapEl, gpsBtn, lat, lng, gated, radius,
      initial: { lat: initialLat, lng: initialLng },
      freshPuzzle: !page,
      // When a quick-puzzle GPS fix arrives before the author moves the
      // pin, silently persist it so bailing out without pressing Save
      // doesn't lose the location the tap was meant to capture.
      pendingGPS: pendingGPSMatch ? pendingGPSMatch.promise : null,
      onAutoLocation: async (coords) => {
        const r = await api(`/api/admin/pages/${page.id}`, {
          method: 'PATCH',
          body: JSON.stringify({
            title:    titleInput.value.trim(),
            prompt:   promptInput.value.trim(),
            hint:     hintInput.value.trim(),
            notes:    notes.value.trim(),
            accept:   accept.value.split(',').map((s) => s.trim()).filter(Boolean),
            lat:      coords.lat,
            lng:      coords.lng,
            disabled: disabled.checked,
            ...(gated.checked ? { radius_m: parseFloat(radius.value) } : {}),
          }),
        });
        if (r.status === 204) {
          // Keep isDirty honest — the inputs now match the server.
          page.lat = coords.lat;
          page.lng = coords.lng;
        }
      },
    });
    // Resize the map once it's visible — Leaflet reads the container
    // size at init and otherwise picks up a 0×0 box.
    requestAnimationFrame(() => locMap.invalidate());

    // Clean up the parked file input + map on close, and — for library
    // puzzles only — tidy both the server stub and the URL.
    //
    //  * Abandoned-stub tidy-up: Quick/New puzzle lands on an empty
    //    library row; walking away without filling anything in
    //    deletes it so the library doesn't accumulate blanks.
    //
    //  * URL tidy-up: the library deep-link (#puzzles/<id>) stays
    //    pinned through the modal lifetime. On an unsaved close we
    //    move back to #puzzles so the URL matches what the user sees;
    //    otherwise a later reload — e.g. a language switch which
    //    goes through location.reload() — rehydrates the editor for
    //    a puzzle the user has already dismissed.
    //
    // Adventure puzzles use switchTo to swap between siblings and
    // live on #library/<slug>; they're skipped here so that flow
    // keeps working.
    body.addEventListener('modal:close', async () => {
      file.remove();
      locMap.destroy();
      if (!page || adv) return;
      const isEmpty =
        !titleInput.value.trim() &&
        !promptInput.value.trim() &&
        !hintInput.value.trim() &&
        !notes.value.trim() &&
        !accept.value.trim() &&
        (images.length === 0) &&
        !gated.checked &&
        !disabled.checked;
      if (!saved && isEmpty) {
        await api(`/api/admin/pages/${page.id}`, { method: 'DELETE' });
      }
      if (!saved && location.hash === '#puzzles/' + page.id) {
        nav('#puzzles');
      }
    }, { once: true });
  }, { wide: true });
}

// renderPuzzleLocationMap wires a Leaflet map + marker + (optional)
// gated-radius circle + drag handle into the puzzle editor. Returns
// { invalidate, destroy } so the caller can force a resize after mount
// and tear everything down on close.
//
// Interactions wired in both directions:
//   marker drag / map click / GPS button → update lat, lng, circle
//   lat/lng input edits                  → move marker + circle
//   gated toggle                         → show/hide circle + handle
//   radius input edits                   → resize circle + reposition handle
//   radius handle drag                   → resize circle + update input
function renderPuzzleLocationMap(args) {
  const { mapEl, gpsBtn, lat, lng, gated, radius, initial, freshPuzzle } = args;

  // A new puzzle without a prior sibling starts at a city-level zoom so
  // the arranger can find themselves; an existing or cloned-from-sibling
  // puzzle zooms in close to the pin.
  const startZoom = freshPuzzle && initial.lat === 59.3293 ? 12 : 16;

  const map = L.map(mapEl, { scrollWheelZoom: true }).setView([initial.lat, initial.lng], startZoom);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 19,
  }).addTo(map);

  const marker = L.marker([initial.lat, initial.lng], { draggable: true }).addTo(map);
  let circle = null;
  let handle = null;

  // pushPinToInputs writes the marker's coords back into the form fields.
  // 6 decimals ≈ 11 cm — more than enough and round-trips cleanly.
  const pushPinToInputs = () => {
    const ll = marker.getLatLng();
    lat.value = ll.lat.toFixed(6);
    lng.value = ll.lng.toFixed(6);
  };

  // destination returns the lat/lng that's `metres` away from `center`
  // at the given bearing (degrees, 0 = north, 90 = east). Used to place
  // the radius-drag handle directly east of the marker.
  const destination = (center, metres, bearingDeg) => {
    const R = 6371000;
    const brng = bearingDeg * Math.PI / 180;
    const lat1 = center.lat * Math.PI / 180;
    const lng1 = center.lng * Math.PI / 180;
    const dr = metres / R;
    const lat2 = Math.asin(Math.sin(lat1) * Math.cos(dr) +
      Math.cos(lat1) * Math.sin(dr) * Math.cos(brng));
    const lng2 = lng1 + Math.atan2(
      Math.sin(brng) * Math.sin(dr) * Math.cos(lat1),
      Math.cos(dr) - Math.sin(lat1) * Math.sin(lat2),
    );
    return L.latLng(lat2 * 180 / Math.PI, lng2 * 180 / Math.PI);
  };

  const updateCircle = () => {
    const center = marker.getLatLng();
    if (gated.checked) {
      const r = Math.max(1, parseFloat(radius.value) || 50);
      if (!circle) {
        circle = L.circle(center, {
          radius: r, color: '#ad1357', weight: 2,
          fillColor: '#ad1357', fillOpacity: 0.12,
        }).addTo(map);
      } else {
        circle.setLatLng(center);
        circle.setRadius(r);
      }
      const handleLL = destination(center, r, 90);
      if (!handle) {
        handle = L.marker(handleLL, {
          draggable: true,
          icon: L.divIcon({
            className: '', // clear Leaflet's default
            html: '<div class="pe-radius-handle" title="Drag to resize">↔</div>',
            iconSize: [22, 22], iconAnchor: [11, 11],
          }),
        }).addTo(map);
        handle.on('drag', () => {
          const d = map.distance(marker.getLatLng(), handle.getLatLng());
          const meters = Math.max(1, Math.round(d));
          radius.value = meters;
          circle.setRadius(meters);
        });
      } else {
        handle.setLatLng(handleLL);
      }
    } else {
      if (circle) { map.removeLayer(circle); circle = null; }
      if (handle) { map.removeLayer(handle); handle = null; }
    }
  };

  marker.on('drag', () => {
    pushPinToInputs();
    if (circle) circle.setLatLng(marker.getLatLng());
    if (handle) {
      const r = Math.max(1, parseFloat(radius.value) || 50);
      handle.setLatLng(destination(marker.getLatLng(), r, 90));
    }
  });
  map.on('click', (e) => {
    marker.setLatLng(e.latlng);
    pushPinToInputs();
    updateCircle();
  });

  const syncFromInputs = () => {
    const la = parseFloat(lat.value), ln = parseFloat(lng.value);
    if (!Number.isFinite(la) || !Number.isFinite(ln)) return;
    marker.setLatLng([la, ln]);
    updateCircle();
  };
  lat.addEventListener('input', syncFromInputs);
  lng.addEventListener('input', syncFromInputs);
  gated.addEventListener('change', updateCircle);
  radius.addEventListener('input', updateCircle);

  gpsBtn.addEventListener('click', () => {
    if (!navigator.geolocation) { toastErr(t('Geolocation not available on this device')); return; }
    gpsBtn.disabled = true;
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        gpsBtn.disabled = false;
        const la = pos.coords.latitude, ln = pos.coords.longitude;
        lat.value = la.toFixed(6);
        lng.value = ln.toFixed(6);
        marker.setLatLng([la, ln]);
        map.setView([la, ln], 17);
        updateCircle();
      },
      (err) => { gpsBtn.disabled = false; toastErr(t('GPS failed: {{msg}}', { msg: err.message || t('unknown') })); },
      { enableHighAccuracy: true, maximumAge: 10000, timeout: 30000 },
    );
  });

  updateCircle();

  // Quick-puzzle's background GPS fix: apply it when it arrives, unless
  // the author has already set a location (dragged the pin, clicked the
  // map, typed in a coord, or hit the GPS button). Any of those signal
  // an intentional placement we shouldn't overwrite.
  let destroyed = false;
  if (args.pendingGPS) {
    let userTouched = false;
    const markTouched = () => { userTouched = true; };
    marker.on('dragstart', markTouched);
    map.on('click', markTouched);
    lat.addEventListener('input', markTouched);
    lng.addEventListener('input', markTouched);
    gpsBtn.addEventListener('click', markTouched);
    args.pendingGPS.then((coords) => {
      if (destroyed || userTouched || !coords) return;
      lat.value = coords.lat.toFixed(6);
      lng.value = coords.lng.toFixed(6);
      marker.setLatLng([coords.lat, coords.lng]);
      map.setView([coords.lat, coords.lng], 17);
      updateCircle();
      args.onAutoLocation?.(coords);
    });
  }

  return {
    invalidate: () => map.invalidateSize(),
    destroy:    () => { destroyed = true; map.remove(); },
  };
}

// openLibraryPicker lets the author attach a puzzle to this adventure
// by deep-copying one out of the library (which here means every
// puzzle in the system — the server handles the copy). Library puzzles
// are offered first; already-assigned puzzles follow so the author can
// duplicate a puzzle across adventures if they want.
async function openLibraryPicker(adv) {
  await modal(t('Pick a puzzle from the library'), async ({ body, close }) => {
    body.append(h('p', { class: 'muted' }, t('Loading puzzles…')));
    const r = await api('/api/admin/puzzles');
    body.replaceChildren();
    if (!r.ok) { body.append(h('p', { class: 'err' }, r.body?.error || t('load failed'))); return; }
    const puzzles = (r.body?.puzzles || []).slice();
    // Put library puzzles first so the common case is discoverable at
    // a glance; attached puzzles follow for copy-across-adventures.
    puzzles.sort((a, b) => (!!a.adventure_slug) - (!!b.adventure_slug));
    if (puzzles.length === 0) {
      body.append(h('p', {}, t('No puzzles in the library yet.')));
      body.append(h('div', { class: 'row end' },
        h('button', { class: 'btn', on: { click: () => close(null) } }, t('Close'))));
      return;
    }
    // Filter input — case-insensitive search over title, notes, prompt
    // and the source adventure's slug. Kept simple: re-renders the
    // entire list on keystroke, the N is small.
    const search = h('input', {
      placeholder: t('Filter by title, notes or adventure'),
      autofocus: true,
      style: 'margin-bottom:.75rem',
    });
    const list = h('div', { style: 'display:grid; gap:.5rem; max-height:55vh; overflow-y:auto; padding-right:.25rem' });

    const renderList = () => {
      list.replaceChildren();
      const q = search.value.trim().toLowerCase();
      const matches = !q ? puzzles : puzzles.filter((p) => {
        const hay = [p.title, p.notes, p.prompt, p.adventure_slug, p.adventure_title]
          .filter(Boolean).join(' ').toLowerCase();
        return hay.includes(q);
      });
      if (matches.length === 0) {
        list.append(h('p', { class: 'muted' }, t('No matches.')));
        return;
      }
      for (const p of matches) {
        const label = p.adventure_slug
          ? h('span', { class: 'pill', style: 'margin-left:.5rem' },
              t('in {{title}} · #{{n}}', { title: p.adventure_title, n: (p.adventure_idx ?? 0) + 1 }))
          : h('span', { class: 'pill accent', style: 'margin-left:.5rem' }, t('library'));
        const card = h('div', { class: 'card clickable', style: 'padding:.6rem .9rem; margin:0' },
          h('div', { class: 'row between' },
            h('strong', {}, p.title || t('(untitled)')),
            label),
          p.notes || p.prompt ? h('p', { class: 'muted', style: 'margin:.25rem 0 0; font-size:.85rem; white-space:pre-wrap; overflow:hidden; max-height:2.4em' },
            p.notes || p.prompt) : null,
          h('p', { class: 'muted mono', style: 'margin:.25rem 0 0; font-size:.75rem' },
            `${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}`));
        card.addEventListener('click', async () => {
          const rr = await api(`/api/admin/adventures/${encodeURIComponent(adv.slug)}/pages/copy-from/${p.id}`,
            { method: 'POST' });
          if (rr.status === 201) {
            toastOk(t('Puzzle copied into adventure'));
            close(true);
            renderRoute();
          } else {
            toastErr(rr.body?.error || t('error {{status}}', { status: rr.status }));
          }
        });
        list.append(card);
      }
    };
    search.addEventListener('input', renderList);
    renderList();

    body.append(search, list);
    body.append(h('div', { class: 'row end', style: 'margin-top:1rem' },
      h('button', { class: 'btn', on: { click: () => close(null) } }, t('Cancel'))));
  }, { wide: true });
}

async function confirmDeletePuzzle(adv, page) {
  const ok = await modal(t('Delete puzzle {{n}}?', { n: page.index + 1 }), ({ body, close }) => {
    body.append(
      h('p', {}, t('This removes the puzzle and any images attached to it.')),
      h('div', { class: 'row end' },
        h('button', { class: 'btn', on: { click: () => close(false) } }, t('Cancel')),
        h('button', { class: 'btn danger', on: { click: () => close(true) } }, t('Delete'))));
  });
  if (!ok) return;
  const r = await api(`/api/admin/pages/${page.id}`, { method: 'DELETE' });
  if (r.status === 204) { toastOk(t('Deleted')); renderRoute(); }
  else toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
}

/* ========== Admins (global admin only) ========== */
async function viewAdmins(view) {
  const r = await api('/api/admin/admins');
  const admins = r.body?.admins || [];
  view.replaceChildren(
    h('div', { class: 'row between' },
      h('h1', {}, t('Admins')),
      h('button', { class: 'btn primary', on: { click: () => openCreateAdmin() } },
        icon(ICONS.plus), t('New admin'))),
    h('p', { class: 'muted' },
      t('Global admins manage organizations and other admins. The system will refuse to let you delete the last remaining admin.')),
    admins.length === 0
      ? h('div', { class: 'empty' }, t('No admins yet.'))
      : h('div', { class: 'card' },
        h('table', { class: 'table' },
          h('thead', {}, h('tr', {}, h('th', {}, t('Username')), h('th', {}, ''))),
          h('tbody', {}, admins.map((a) => h('tr', {},
            h('td', {}, a.username, state.me.id === a.id ? h('span', { class: 'muted', style: 'margin-left:.35rem' }, t('(you)')) : null),
            h('td', {}, h('div', { class: 'row end' },
              state.me.username === a.username
                ? null
                : iconBtn('trash', t('Delete'), () => confirmDeleteAdmin(a), { danger: true }))),
          ))))),
  );
}

async function openCreateAdmin() {
  await modal(t('New admin'), ({ body, close }) => {
    const form = h('form', {},
      h('label', { class: 'field' }, h('span', {}, t('Username')),
        h('input', { name: 'u', required: true, autofocus: true })),
      h('label', { class: 'field' }, h('span', {}, t('Password')),
        h('input', { name: 'p', type: 'password', required: true })),
      h('div', { class: 'row end' },
        h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, t('Cancel')),
        h('button', { class: 'btn primary', type: 'submit' }, t('Create'))));
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const r = await api('/api/admin/admins', {
        method: 'POST',
        body: JSON.stringify({ username: fd.get('u'), password: fd.get('p') }),
      });
      if (r.status === 201) { toastOk(t('Admin created')); close(true); renderRoute(); }
      else toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
    });
    body.append(form);
  });
}

async function confirmDeleteAdmin(admin) {
  const pw = await promptPassword(t('Delete admin {{username}}?', { username: admin.username }),
    t('Enter your password to confirm.'));
  if (!pw) return;
  const r = await api(`/api/admin/admins/${admin.id}`, {
    method: 'DELETE', headers: { 'X-Confirm-Password': pw },
  });
  if (r.status === 204) { toastOk(t('Admin deleted')); renderRoute(); }
  else toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
}

/* ========== Race simulator (admin only) ==========
   Drives a fake race inside the server so the live view can be
   exercised without real players on the ground. The heavy lifting
   (team movement, answer rolls, pings) happens server-side in the
   simulator package — this surface is just a control panel:
   pick an adventure + team count + speed, press Play, watch.
   Status polls every 1.5s so the state pill stays in sync with the
   server's own Pause/Resume/Reset. */
async function viewSimulator(view) {
  const [statusR, advR] = await Promise.all([
    api('/api/admin/simulator').catch(() => ({ ok: false, body: null })),
    api('/api/admin/adventures').catch(() => ({ ok: false, body: null })),
  ]);
  const status = statusR.ok ? statusR.body : { stage: 'idle' };
  const advs = (advR.body?.adventures || [])
    .filter((a) => a.page_count > 0)
    .sort((a, b) => a.title.localeCompare(b.title));

  // Controls — the form is visible even while a sim runs so the
  // operator can read back what they chose, but inputs are disabled
  // until Reset so you can't mutate a running simulation's config.
  const picker = h('select', { required: true },
    advs.length === 0
      ? h('option', { value: '' }, t('(no adventures)'))
      : advs.map((a) => h('option', { value: a.slug }, `${a.title} — ${a.page_count} ` + (a.page_count === 1 ? t('puzzle') : t('puzzles')))));
  if (status.adventure_slug) picker.value = status.adventure_slug;

  const teamInput = h('input', { type: 'number', min: '2', max: '20', value: String(status.team_count || 6) });
  const speedInput = h('input', { type: 'number', min: '1', max: '50', step: '1', value: String(status.speed_mul || 5) });

  // Stage pill, elapsed readout and live-view link are the three bits
  // the poll loop patches in place — capture references so we don't
  // tear the whole view down on every tick.
  const stagePill = h('span', { class: `pill ${stagePillClass(status.stage)}` }, t(stageLabel(status.stage)));
  const elapsed = h('span', { class: 'muted mono', style: 'font-size:.85rem' },
    (status.stage !== 'idle' && status.started_at)
      ? t('Running for {{t}}', { t: fmtElapsed(status.started_at) })
      : '');
  const liveSlot = h('span');
  const setLiveLink = (token) => {
    liveSlot.replaceChildren();
    if (token) {
      liveSlot.append(h('a', {
        href: `/live/${encodeURIComponent(token)}`, target: '_blank',
      }, icon(ICONS.eye), t('Open live view')));
    }
  };
  setLiveLink(status.live_token);

  const startBtn = h('button', {
    class: 'btn primary', type: 'button',
    on: { click: () => simulatorAction('start', {
      adventure_slug: picker.value,
      team_count: parseInt(teamInput.value, 10) || 6,
      speed_mul: parseFloat(speedInput.value) || 5,
    }) },
  }, icon(ICONS.play), t('Start'));
  const pauseBtn = h('button', {
    class: 'btn', type: 'button',
    on: { click: () => simulatorAction('pause') },
  }, t('Pause'));
  const resumeBtn = h('button', {
    class: 'btn', type: 'button',
    on: { click: () => simulatorAction('resume') },
  }, t('Resume'));
  const resetBtn = h('button', {
    class: 'btn danger', type: 'button',
    on: { click: () => simulatorAction('reset') },
  }, icon(ICONS.trash), t('Reset'));

  // applyStage patches the dynamic bits of the view for a given status
  // without rebuilding the DOM — survives transient fetch errors and
  // keeps the user's typing in the number inputs intact.
  const applyStage = (st) => {
    const stage = st?.stage || 'idle';
    stagePill.className = 'pill ' + stagePillClass(stage);
    stagePill.textContent = t(stageLabel(stage));
    elapsed.textContent = (stage !== 'idle' && st?.started_at)
      ? t('Running for {{t}}', { t: fmtElapsed(st.started_at) })
      : '';
    setLiveLink(st?.live_token);
    const idle = stage === 'idle';
    const paused = stage === 'paused';
    const running = stage === 'running';
    [picker, teamInput, speedInput].forEach((el) => { el.disabled = !idle; });
    startBtn.disabled = !idle;
    pauseBtn.disabled = !running;
    resumeBtn.disabled = !paused;
    resetBtn.disabled = idle;
  };
  applyStage(status);

  view.replaceChildren(
    h('div', { class: 'row between' },
      h('h1', {}, t('Simulator')),
      h('div', { class: 'row', style: 'gap:.5rem; align-items:center' },
        stagePill, elapsed, liveSlot)),
    h('p', { class: 'muted' },
      t('Fake a race so you can see the live view animate without recruiting real players. Writes to the same tables as a real run, so every subscriber (map, leaderboard, WS) updates as if players were on the ground.')),
    h('div', { class: 'card' },
      h('h2', {}, t('Configuration')),
      h('label', { class: 'field' }, h('span', {}, t('Adventure')), picker),
      h('label', { class: 'field' }, h('span', {}, t('Teams (2–20)')), teamInput),
      h('label', { class: 'field' }, h('span', {}, t('Speed multiplier (1–50)')), speedInput),
      h('p', { class: 'muted', style: 'font-size:.85rem' },
        t('Higher speed advances the walk faster without changing the ping cadence, so fast-forwarded runs still look natural.'))),
    h('div', { class: 'row', style: 'gap:.5rem; flex-wrap:wrap; margin-top:1rem' },
      startBtn, pauseBtn, resumeBtn, resetBtn),
  );

  // Poll status only — no full re-render, no toast on blip. A dev
  // server restart or momentary WS loss shouldn't take the page down
  // with a NetworkError.
  if (simulatorPollTimer) clearInterval(simulatorPollTimer);
  const poll = async () => {
    if (!location.hash.startsWith('#simulator')) {
      clearInterval(simulatorPollTimer); simulatorPollTimer = null; return;
    }
    try {
      const r = await api('/api/admin/simulator');
      if (r.ok) applyStage(r.body);
    } catch { /* server restart or offline — the next tick will catch up */ }
  };
  simulatorPollTimer = setInterval(poll, 1500);
}

// simulatorAction posts a control command. Re-renders the view on
// success so inputs snap to whatever state the server is now in.
async function simulatorAction(kind, body) {
  let r;
  try {
    r = await api('/api/admin/simulator/' + kind, {
      method: 'POST',
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch {
    toastErr(t('Network error — is the server running?'));
    return;
  }
  if (!r.ok) {
    toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
    return;
  }
  if (kind === 'start') toastOk(t('Simulation started'));
  if (kind === 'reset') toastOk(t('Simulation reset'));
  renderRoute();
}

let simulatorPollTimer = null;

function stageLabel(stage) {
  switch (stage) {
    case 'running': return 'Running';
    case 'paused':  return 'Paused';
    default:        return 'Idle';
  }
}

function stagePillClass(stage) {
  switch (stage) {
    case 'running': return 'success';
    case 'paused':  return 'warning';
    default:        return '';
  }
}

function fmtElapsed(startISO) {
  const start = new Date(startISO);
  const sec = Math.max(0, Math.round((Date.now() - start.getTime()) / 1000));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const pad = (n) => String(n).padStart(2, '0');
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}

/* ========== Server logs (admin only) ==========
   xterm.js renders the stream, the server hands out each new Entry via
   /ws/logs, and a small control row lets the admin pick a minimum
   level + substring filter. Filter is client-side; level change hits
   the server so dropped entries never enter the ring buffer. */
async function viewLogs(view) {
  // xterm may not be ready yet if the defer scripts are still loading —
  // bail out with a polite retry.
  if (typeof Terminal === 'undefined') {
    view.replaceChildren(h('p', { class: 'muted' }, t('Loading terminal…')));
    setTimeout(() => { if (location.hash.startsWith('#logs')) viewLogs(view); }, 200);
    return;
  }

  const levels = ['DEBUG', 'INFO', 'WARN', 'ERROR'];
  // State shared between the control row and the WS listener.
  //
  // buffer keeps every entry the client has seen (snapshot + live),
  // bounded so long-running sessions don't blow up memory. passes(e)
  // is the filter+level predicate; repaintAll() clears the terminal
  // and replays the buffer through passes() — so changing the filter
  // or the client-level dropdown reapplies retroactively to the lines
  // already on screen, not just to new incoming entries.
  const state = {
    filter: '',
    minLevel: 'DEBUG',  // client-side floor; the server has its own
    paused: false,
    ws: null,
    lastSeq: 0,
  };
  const MAX_BUFFER = 5000;
  const buffer = [];

  const passes = (e) => {
    if (levelRank(e.level) < levelRank(state.minLevel)) return false;
    if (state.filter && !entryMatches(e, state.filter)) return false;
    return true;
  };
  const repaintAll = () => {
    term.reset();
    for (const e of buffer) if (passes(e)) writeEntry(term, e);
  };

  // Controls ----------------------------------------------------------
  const filterInput = h('input', {
    type: 'search', placeholder: t('Filter (substring)'),
    style: 'flex:1; min-width:10rem; box-shadow:none; border-color:var(--border-soft); margin:0',
  });
  filterInput.addEventListener('input', () => {
    state.filter = filterInput.value.toLowerCase();
    repaintAll();
  });

  const serverLevelSel = h('select', { class: 'zv-log-sel', title: t('Server log level') });
  for (const l of levels) {
    const opt = document.createElement('option');
    opt.value = l; opt.textContent = l;
    serverLevelSel.append(opt);
  }
  serverLevelSel.addEventListener('change', async () => {
    const rr = await api('/api/admin/logs/level', {
      method: 'PUT', body: JSON.stringify({ level: serverLevelSel.value }),
    });
    if (!rr.ok) toastErr(rr.body?.error || t('error {{status}}', { status: rr.status }));
  });

  const clientLevelSel = h('select', { class: 'zv-log-sel', title: t('Client-side minimum level') });
  for (const l of levels) {
    const opt = document.createElement('option');
    opt.value = l; opt.textContent = l;
    clientLevelSel.append(opt);
  }
  clientLevelSel.addEventListener('change', () => {
    state.minLevel = clientLevelSel.value;
    repaintAll();
  });

  const pauseBtn = h('button', { class: 'btn small', type: 'button' }, t('Pause'));
  pauseBtn.addEventListener('click', () => {
    state.paused = !state.paused;
    pauseBtn.textContent = state.paused ? t('Resume') : t('Pause');
  });
  const clearBtn = h('button', { class: 'btn small', type: 'button' }, t('Clear'));

  const controls = h('div', { class: 'row', style: 'gap:.5rem; flex-wrap:wrap; margin-bottom:.5rem; align-items:center' },
    h('span', { class: 'muted', style: 'font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; font-weight:700' },
      t('Server level')),
    serverLevelSel,
    h('span', { class: 'muted', style: 'font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; font-weight:700' },
      t('Show')),
    clientLevelSel,
    filterInput, pauseBtn, clearBtn,
  );

  // Terminal ---------------------------------------------------------
  const termHost = h('div', { class: 'zv-log-term' });
  const term = new Terminal({
    convertEol: true,
    scrollback: 5000,
    fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace',
    fontSize: 13,
    theme: {
      background: '#0e1420',
      foreground: '#d7dee8',
      cursor: '#1f3349',
      cursorAccent: '#0e1420',
    },
  });
  // Fit addon may not be loaded if the CDN is down — guard the call.
  let fit = null;
  if (typeof FitAddon !== 'undefined' && FitAddon.FitAddon) {
    fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
  }

  clearBtn.addEventListener('click', () => {
    // Drop the buffer too so the next repaint doesn't resurrect the
    // cleared output. New live entries will stream in fresh.
    buffer.length = 0;
    term.reset();
  });

  view.replaceChildren(h('h1', {}, t('Logs')), controls, termHost);

  // Mount + size. xterm wants a non-zero container at open.
  term.open(termHost);
  requestAnimationFrame(() => { try { fit && fit.fit(); } catch {} });
  const onResize = () => { try { fit && fit.fit(); } catch {} };
  window.addEventListener('resize', onResize);

  // ingest appends to the client buffer (bounded), and paints live
  // when (a) not paused and (b) the entry passes the filter+level
  // predicate. When the filter changes, repaintAll() replays buffer
  // through passes() so the already-rendered lines re-align with the
  // new filter.
  const ingest = (e) => {
    buffer.push(e);
    if (buffer.length > MAX_BUFFER) buffer.splice(0, buffer.length - MAX_BUFFER);
    state.lastSeq = Math.max(state.lastSeq, e.seq || 0);
    if (state.paused) return;
    if (passes(e)) writeEntry(term, e);
  };

  // Initial snapshot + live stream --------------------------------
  const initial = await api('/api/admin/logs');
  const serverLevel = initial.body?.level || 'INFO';
  serverLevelSel.value = serverLevel;
  clientLevelSel.value = 'DEBUG';
  for (const e of (initial.body?.entries || [])) ingest(e);

  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const sock = new WebSocket(`${proto}//${location.host}/ws/logs`);
  state.ws = sock;
  sock.onmessage = (ev) => {
    let msg; try { msg = JSON.parse(ev.data); } catch { return; }
    if (!msg || msg.kind !== 'entry') return;
    const e = msg.data;
    if (!e) return;
    ingest(e);
  };

  // Tear down when the route changes so we don't keep WS open.
  const cleanup = () => {
    window.removeEventListener('resize', onResize);
    try { sock.close(); } catch {}
    try { term.dispose(); } catch {}
    window.removeEventListener('hashchange', onHash);
  };
  const onHash = () => {
    if (!location.hash.startsWith('#logs')) cleanup();
  };
  window.addEventListener('hashchange', onHash);
}

function levelRank(level) {
  return { DEBUG: 0, INFO: 1, WARN: 2, ERROR: 3 }[String(level || 'INFO').toUpperCase()] ?? 1;
}

function entryMatches(e, needle) {
  if ((e.msg || '').toLowerCase().includes(needle)) return true;
  for (const a of (e.attrs || [])) {
    if (String(a.k || '').toLowerCase().includes(needle)) return true;
    if (String(a.v ?? '').toLowerCase().includes(needle)) return true;
  }
  return false;
}

// writeEntry paints a single log line in the xterm with ANSI colour
// escapes driven by the entry's level.
function writeEntry(term, e) {
  const R = '\x1b[0m';
  const dim = '\x1b[2m';
  const levelColors = {
    DEBUG: '\x1b[90m',          // gray
    INFO:  '\x1b[36m',          // cyan
    WARN:  '\x1b[33m',          // yellow
    ERROR: '\x1b[1;31m',        // bold red
  };
  const lc = levelColors[(e.level || 'INFO').toUpperCase()] || '';
  const ts = (e.ts || '').replace('T', ' ').replace(/\.\d+/, '').replace('Z', '');
  let line = `${dim}${ts}${R} ${lc}${String(e.level || 'INFO').padEnd(5)}${R} ${e.msg || ''}`;
  for (const a of (e.attrs || [])) {
    line += ` ${dim}${a.k}${R}=${formatAttrValue(a.v)}`;
  }
  term.writeln(line);
}

function formatAttrValue(v) {
  if (v === null || v === undefined) return '';
  if (typeof v === 'string') {
    if (/[\s="]/.test(v)) return JSON.stringify(v);
    return v;
  }
  return String(v);
}

/* ========== Members (for org_admin of their own org) ========== */
async function viewMembers(view) {
  if (!state.me.org_id) {
    view.replaceChildren(h('p', { class: 'err' }, t('No organization.')));
    return;
  }
  const r = await api('/api/admin/organizations/' + state.me.org_id);
  if (!r.ok) {
    view.replaceChildren(h('p', { class: 'err' }, r.body?.error || t('failed to load')));
    return;
  }
  const org = r.body || { id: state.me.org_id, name: t('Your organization'), members: [] };
  view.replaceChildren(
    h('div', { class: 'row between' },
      h('h1', {}, t('Members')),
      h('button', { class: 'btn primary', on: { click: () => openAddOrgMember(org) } },
        icon(ICONS.plus), t('Add user'))),
    h('p', { class: 'muted' },
      t('Users in {{name}}. Admins can invite more users; members run the games.', { name: org.name })),
    (org.members || []).length === 0
      ? h('div', { class: 'empty' }, t('No other users yet.'))
      : h('div', { class: 'card' },
        h('table', { class: 'table' },
          h('thead', {}, h('tr', {}, h('th', {}, t('Username')), h('th', {}, t('Role')), h('th', {}, ''))),
          h('tbody', {}, (org.members || []).map((m) => h('tr', {},
            h('td', {}, m.username, state.me.id === m.id ? h('span', { class: 'muted', style: 'margin-left:.35rem' }, t('(you)')) : null),
            h('td', {}, h('span', { class: 'pill' }, m.role === 'org_admin' ? t('admin') : t('member'))),
            h('td', {}, h('div', { class: 'row end' },
              state.me.id === m.id
                ? h('button', {
                    class: 'btn icon small', type: 'button', disabled: '',
                    title: t("You can't remove yourself"), 'aria-label': t("You can't remove yourself"),
                  }, icon(ICONS.trash))
                : iconBtn('trash', t('Remove'), () => confirmRemoveOrgMember(org, m), { danger: true }))),
          ))))),
  );
}

/* ========== Kick off ========== */
render();
</script>
