/* ========== Dashboard ========== */
async function viewDashboard(view) {
  if (state.me.role === 'admin') return viewAdminDashboard(view);
  return viewArrangerDashboard(view);
}

async function viewArrangerDashboard(view) {
  const [eventsR, advR, assignR] = await Promise.all([
    api('/api/admin/events'),
    api('/api/admin/adventures'),
    api('/api/admin/assignments'),
  ]);
  const newEventBtn = h('button', { class: 'btn primary', on: { click: () => openNewEventWizard() } },
    icon(ICONS.plus), t('Start a new event'));
  const rs = eventsR.body?.events || [];
  const advs = advR.body?.adventures || [];
  const assignments = assignR.body?.assignments || [];
  const mineAdvs    = advs.filter((a) => a.mine_to_edit);
  const unusedAssigns = assignments.filter((a) => !a.event_id);
  const runningNow  = rs.filter((r) => r.state === 'running');
  const scheduled   = rs.filter((r) => r.state === 'scheduled')
    .sort((a, b) => (a.scheduled_at || '').localeCompare(b.scheduled_at || ''));

  // Setup checklist for first-time arrangers. Hides itself once an event
  // exists so veterans don't see it.
  const setup = rs.length === 0
    ? buildDashboardSetup({ mineAdvs, unusedAssigns })
    : null;

  // DOM's replaceChildren coerces null arguments to the string "null"
  // and appends them as text nodes — unlike h(), which skips them. The
  // sections below are conditionally null (no runs, no scheduled, etc.),
  // so filter before handing off.
  const sections = [
    h('div', { class: 'row between', style: 'margin-bottom:1rem' },
      h('h1', { style: 'margin:0' }, t('Dashboard')),
      newEventBtn,
    ),
    h('div', { class: 'grid stats', style: 'margin-bottom:1rem' },
      stat(t('Live now'), runningNow.length),
      stat(t('Scheduled'), scheduled.length),
      stat(t('Unused'), unusedAssigns.length),
    ),
    setup,
    // During a live event this is what the arranger wants to see first.
    runningNow.length === 0 ? null : h('div', { class: 'card' },
      h('h2', {}, t('Live now')),
      h('div', { class: 'grid cols-2' },
        runningNow.map((r) => h('div', {
          class: 'card clickable',
          on: { click: () => nav('#events/' + r.id) },
        },
          h('div', { class: 'row', style: 'gap:.75rem; align-items:flex-start' },
            adventureCover({
              title:      r.adventure_title || r.adventure_slug,
              avatar_url: r.adventure_avatar_url,
            }, 48),
            h('div', { style: 'flex:1; min-width:0' },
              h('div', { class: 'row between' },
                h('strong', {}, runLabel(r)),
                h('span', { class: 'pill ' + pillClassForState(r.state) }, stateGlyph(r.state) + t(r.state || ''))),
              h('p', { class: 'muted', style: 'font-size:.8rem; margin:.1rem 0 .3rem' },
                r.adventure_title || r.adventure_slug),
              h('p', { class: 'muted', style: 'font-size:.85rem; margin:0' },
                r.started_at ? t('Started {{when}}', { when: fmtLocal(r.started_at) }) : '')))))),
    // "Starts soon" is actionable — one-click Start on scheduled events.
    scheduled.length === 0 ? null : h('div', { class: 'card' },
      h('h2', {}, t('Starts soon')),
      h('table', { class: 'table' },
        h('thead', {}, h('tr', {},
          h('th', {}, t('Event')),
          h('th', {}, t('Scheduled')),
          h('th', {}, ''))),
        h('tbody', {}, scheduled.slice(0, 10).map((r) => h('tr', {
            style: 'cursor:pointer',
            on: { click: () => nav('#events/' + r.id) },
          },
          h('td', {}, runLabel(r)),
          h('td', {}, fmtLocal(r.scheduled_at) || h('span', { class: 'muted' }, t('(no time set)'))),
          h('td', { style: 'text-align:right' },
            iconBtn('play', t('Start now'), () => confirmStart(r), { primary: true })),
        ))))),
    // Fallback for users between events.
    (runningNow.length === 0 && scheduled.length === 0 && rs.length > 0)
      ? h('div', { class: 'card' },
          h('h2', {}, t('Recent events')),
          runsTable(rs.slice(0, 5)))
      : null,
  ];
  view.replaceChildren(...sections.filter(Boolean));
}

// buildDashboardSetup drops a guided checklist for brand-new arrangers
// who haven't run any events yet — it meets them where they are and
// links to the next action.
function buildDashboardSetup({ mineAdvs, unusedAssigns }) {
  const stepDone = (done, label, cta, onClick) =>
    h('li', { style: 'display:flex; align-items:center; gap:.6rem; margin:.35rem 0' },
      h('span', {
        style: 'display:inline-grid; place-items:center; width:1.4rem; height:1.4rem; border-radius:50%; background:' +
          (done ? 'var(--accent)' : 'var(--surface-2)') + '; color:' + (done ? 'var(--accent-fg)' : 'var(--muted)') + '; font-weight:700; font-size:.85rem',
      }, done ? '✓' : '·'),
      h('span', { style: done ? 'color:var(--muted); text-decoration:line-through' : '' }, label),
      !done && cta
        ? h('button', { class: 'btn small primary', style: 'margin-left:auto', on: { click: onClick } }, cta)
        : null,
    );
  const haveAdvOrAssignment = mineAdvs.length > 0 || unusedAssigns.length > 0;
  return h('div', { class: 'card', style: 'border:1px dashed var(--accent); background:color-mix(in srgb, var(--accent) 5%, var(--surface))' },
    h('h2', {}, t('Getting started')),
    h('p', { class: 'muted' }, t('A few clicks to your first adventure.')),
    h('ol', { style: 'list-style:none; padding:0; margin:0' },
      stepDone(haveAdvOrAssignment,
        t('Pick an adventure — browse the Catalog or create your own'),
        // Most first-time arrangers want to make their own adventure;
        // the wording leaves browsing as a secondary path (one click
        // away in the sidebar). The CTA jumps straight into the
        // create-adventure modal so the next click is productive.
        t('Create'), () => openCreateAdventure()),
      stepDone(unusedAssigns.length > 0,
        t('Have player slots ready — an assignment lets you schedule an event'),
        t('Browse the Catalog'), () => nav('#catalog')),
      stepDone(false,
        t('Schedule an event, add teams, share their links — and start!'),
        unusedAssigns.length > 0 ? t('Schedule') : null,
        unusedAssigns.length > 0 ? (() => scheduleRun(unusedAssigns[0].id)) : null),
    ),
  );
}

async function viewAdminDashboard(view) {
  const [orgsR, advsR] = await Promise.all([
    api('/api/admin/organizations'),
    api('/api/admin/adventures'),
  ]);
  const orgs = orgsR.body?.organizations || [];
  const advs = advsR.body?.adventures || [];

  const totals = orgs.reduce((acc, o) => {
    acc.eventsTotal   += o.events_total   || 0;
    acc.eventsRunning += o.events_running || 0;
    acc.players     += o.players_total || 0;
    acc.members     += (o.members || []).length;
    return acc;
  }, { eventsTotal: 0, eventsRunning: 0, players: 0, members: 0 });

  // Once any org has held an event the operator is past bootstrap;
  // hiding the checklist keeps the long-term dashboard calm. While
  // events_total is zero we keep showing it (with checks ticked off
  // as the operator works through the steps).
  const setup = totals.eventsTotal === 0
    ? buildAdminDashboardSetup({ orgs, advs })
    : null;

  const sections = [
    h('h1', {}, t('Dashboard')),
    h('div', { class: 'grid stats', style: 'margin-bottom:1rem' },
      stat(t('Organizations'), orgs.length),
      stat(t('Org users'), totals.members),
      stat(t('Active events'), totals.eventsRunning),
    ),
    setup,
    h('div', { class: 'card' },
      h('div', { class: 'row between' },
        h('h2', {}, t('Organizations')),
        h('button', { class: 'btn primary small', on: { click: () => nav('#organizations') } },
          icon(ICONS.building), t('Manage'))),
      orgs.length === 0
        ? h('div', { class: 'empty' },
            h('p', {}, t('No organizations yet.')),
            h('button', { class: 'btn primary', on: { click: () => openCreateOrg() } },
              icon(ICONS.plus), t('Create your first organization')))
        : h('table', { class: 'table' },
          h('thead', {}, h('tr', {},
            h('th', {}, t('Organization')),
            h('th', { class: 'hide-narrow' }, t('Users')),
            h('th', { class: 'hide-narrow' }, t('Players')),
            h('th', {}, t('Events')),
            h('th', { class: 'hide-narrow' }, t('Active')))),
          h('tbody', {}, orgs.map((o) => h('tr', {},
            h('td', {}, h('span', {
              style: 'display:inline-flex; align-items:center; gap:.55rem; min-width:0',
            }, orgIcon(o, 24), h('span', {
              style: 'overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0',
            }, o.name))),
            h('td', { class: 'mono hide-narrow' }, (o.members || []).length),
            h('td', { class: 'mono hide-narrow' }, o.players_total || 0),
            h('td', { class: 'mono' }, o.events_total || 0),
            h('td', { class: 'hide-narrow' },
              (o.events_running || 0) > 0
                ? h('span', { class: 'pill success' }, t('{{n}} running', { n: o.events_running }))
                : h('span', { class: 'muted' }, '—')),
          )))),
    ),
  ];
  view.replaceChildren(...sections.filter(Boolean));
}

          (done ? 'var(--accent)' : 'var(--surface-2)') + '; color:' + (done ? 'var(--accent-fg)' : 'var(--muted)') + '; font-weight:700; font-size:.85rem',
      }, done ? '✓' : '·'),
      h('span', { style: done ? 'color:var(--muted); text-decoration:line-through' : '' }, label),
      !done && cta
        ? h('button', { class: 'btn small primary', style: 'margin-left:auto', on: { click: onClick } }, cta)
        : null,
    );
  const haveOrg = orgs.length > 0;
  const haveOrgUser = orgs.some((o) => (o.members || []).length > 0);
  // Global-catalog adventures (org_id IS NULL) are the ones an admin
  // can publish or commission to any org. Org-owned adventures don't
  // count for this step — they're authored by org users for their own
  // events, not stocked by the admin.
  const haveCatalog = advs.some((a) => !a.org_id);
  return h('div', { class: 'card', style: 'border:1px dashed var(--accent); background:color-mix(in srgb, var(--accent) 5%, var(--surface))' },
    h('h2', {}, t('Getting started')),
    h('p', { class: 'muted' }, t('Three steps to a working deployment.')),
    h('ol', { style: 'list-style:none; padding:0; margin:0' },
      stepDone(haveOrg,
        t('Create an organization — one tenant per customer'),
        t('Create'), () => openCreateOrg()),
      stepDone(haveOrgUser,
        t('Add a user to it — at least one org_admin can run events'),
        haveOrg ? t('Manage') : null,
        haveOrg ? (() => nav('#organizations')) : null),
      stepDone(haveCatalog,
        t('Stock the library — author an adventure or import the samples'),
        t('New adventure'), () => openCreateAdventure()),
    ),
  );
}

function stat(label, value) {
  return h('div', { class: 'stat' },
    h('div', { class: 'label' }, label),
    h('div', { class: 'value' }, value));
}

/* ========== Adventures ==========
   For arrangers this is really "your assignments" — each unused assignment
   is a one-shot licence to use an adventure for an event with a fixed team cap. Used
   assignments are also shown (with a link to their run) so the arranger can
   see the full history at a glance. */
async function viewAdventures(view) {
  // Post-checkout handoff: if sessionStorage carries a fresh
  // assignment id, open the scheduler for it right away. Cleared on
  // consume so refreshes don't reopen the dialog.
  const justPurchased = sessionStorage.getItem('zv-just-purchased');
  if (justPurchased) {
    sessionStorage.removeItem('zv-just-purchased');
    const id = parseInt(justPurchased, 10);
    if (id > 0) { toastOk(t('Payment received — let\'s schedule your event.')); scheduleRun(id); }
  }

  const [ar, advR] = await Promise.all([
    api('/api/admin/assignments'),
    api('/api/admin/adventures'),
  ]);
  const assignments = ar.body?.assignments || [];
  const advs = advR.body?.adventures || [];

  // Bucket assignments per adventure. unused = ready to schedule,
  // used = already materialised into an event (kept for context badges).
  const byAdv = new Map();
  for (const a of assignments) {
    if (!a.adventure_slug) continue;
    const b = byAdv.get(a.adventure_slug) || { unused: [], used: [] };
    (a.event_id ? b.used : b.unused).push(a);
    byAdv.set(a.adventure_slug, b);
  }

  // An adventure shows up on this page only if there's something the
  // arranger actually does with it — they author it, they hold at
  // least one assignment, or an admin has commissioned it for this
  // org via a share. Everything else lives in the Catalog.
  const runnable = advs
    .filter((a) => a.mine_to_edit || a.shared || byAdv.has(a.slug))
    .sort((a, b) => {
      // Mine first, then with unused assignments, then shared, then remainder.
      const score = (adv) => {
        const bk = byAdv.get(adv.slug) || { unused: [], used: [] };
        return (adv.mine_to_edit ? 8 : 0)
          + (bk.unused.length ? 4 : 0)
          + (adv.shared ? 2 : 0)
          + (bk.used.length ? 1 : 0);
      };
      return score(b) - score(a);
    });

  const renderCard = (adv) => {
    const bucket = byAdv.get(adv.slug) || { unused: [], used: [] };
    const actions = h('div', { class: 'row', style: 'gap:.5rem; flex-wrap:wrap; margin-top:.75rem' });
    // Edit lives on the adventure detail page now — clicking the title
    // is the path in. Keeps this listing focused on "what to run" so
    // a glance separates schedulable adventures from ones that need a
    // purchase first, without an extra primary action competing.
    // Schedule routing under the unified pay-at-event model:
    //   - Has an unused assignment → use it (pre-paid licence).
    //   - Commissioned via share → free, schedule with the slug.
    //   - Otherwise (own org content, forked or self-authored) → go
    //     through the purchase flow first, which mints an
    //     assignment (free for ≤15 players, Stripe for more), and
    //     auto-schedules the event using that assignment.
    if (bucket.unused.length > 0) {
      actions.append(h('button', {
        class: 'btn primary',
        on: { click: () => pickAndScheduleRun(bucket.unused, adv) },
      }, icon(ICONS.schedule), t('Schedule event')));
    } else if (adv.shared) {
      actions.append(h('button', {
        class: 'btn primary',
        on: { click: () => scheduleRun({ slug: adv.slug }) },
      }, icon(ICONS.schedule), t('Schedule event')));
    } else if (adv.mine_to_edit && adv.org_id) {
      // Own org content — schedule via the buy-then-create path.
      actions.append(h('button', {
        class: 'btn primary',
        on: { click: () => openPurchaseModal(adv) },
      }, icon(ICONS.schedule), t('Schedule event')));
    } else if (adv.mine_to_edit) {
      // Admin-authored global catalog row from this admin's seat —
      // the buy flow stays for the legacy assignment surface.
      actions.append(h('button', {
        class: 'btn',
        on: { click: () => openPurchaseModal(adv) },
      }, icon(ICONS.coins), t('Buy player slots')));
    }

    const tags = [
      h('span', { class: 'pill' }, adv.page_count === 1
        ? t('{{n}} puzzle', { n: adv.page_count })
        : t('{{n}} puzzles', { n: adv.page_count })),
      // "Yours" is only meaningful on the global-catalog (admin-owned)
      // rows where it distinguishes the caller's authored adventures
      // from other admins'. Org users see only their own org's
      // adventures here, so the pill would just be noise.
      adv.mine_to_edit && !adv.org_id ? h('span', { class: 'pill accent' }, t('Yours')) : null,
      // Only the global catalog (org_id IS NULL) actually consults the
      // published flag for cross-org visibility; on org-owned rows it
      // doesn't change anything, so don't display a misleading pill.
      adv.mine_to_edit && !adv.org_id
        ? (adv.published
            ? h('span', { class: 'pill success' }, '✓ ' + t('Published'))
            : h('span', { class: 'pill warning' }, '✎ ' + t('Draft')))
        : null,
      !adv.mine_to_edit && adv.shared ? h('span', { class: 'pill accent' }, t('Shared')) : null,
      bucket.unused.length > 0
        ? h('span', { class: 'pill accent' }, bucket.unused.length === 1
            ? t('{{n}} assignment available', { n: bucket.unused.length })
            : t('{{n}} assignments available', { n: bucket.unused.length }))
        : bucket.used.length > 0
          ? h('span', { class: 'pill' }, bucket.used.length === 1
              ? t('{{n}} event held', { n: bucket.used.length })
              : t('{{n}} events held', { n: bucket.used.length }))
          : null,
    ].filter(Boolean);

    // Title links to the read-only adventure detail page. Edit is
    // a dedicated button for owners — separating "look at it" from
    // "edit it" lets the editor hide spoiler-prone answer chips
    // behind a toggle while the author still gets one-click access
    // to their own editor surface.
    const titleLink = h('a', {
      href: '#adventures/' + encodeURIComponent(adv.slug),
      style: 'color:inherit; text-decoration:none',
      on: { click: (e) => {
        e.preventDefault();
        nav('#adventures/' + encodeURIComponent(adv.slug));
      } },
    }, adv.title);
    return h('div', { class: 'card' },
      h('div', { class: 'row between', style: 'align-items:flex-start; gap:.75rem' },
        h('div', { class: 'row', style: 'gap:.75rem; align-items:center; min-width:0' },
          adventureCover(adv, 56),
          h('h2', { style: 'margin:0' }, titleLink)),
        h('div', { class: 'row', style: 'gap:.35rem; flex-wrap:wrap' }, ...tags)),
      adv.description ? h('p', { class: 'muted', style: 'margin-top:.35rem' }, adv.description) : null,
      h('p', { class: 'muted mono', style: 'font-size:.8rem; margin:0' },
        adv.slug + (adv.author ? ' · ' + adv.author : '')),
      actions,
    );
  };

  view.replaceChildren(
    h('div', { class: 'row between' },
      h('h1', {}, t('Adventures')),
      h('button', { class: 'btn primary', on: { click: () => openCreateAdventure() } },
        icon(ICONS.plus), t('New adventure'))),
    renderAdventureTabs('yours'),
    runnable.length === 0
      ? h('div', { class: 'empty' },
          h('p', {}, t('No adventures you can use yet.')),
          h('p', { class: 'muted' }, t('Create your own or browse the Catalog for published adventures.')),
          h('div', { class: 'row', style: 'gap:.5rem; justify-content:center; margin-top:.5rem' },
            h('button', { class: 'btn primary', on: { click: () => openCreateAdventure() } },
              icon(ICONS.plus), t('New adventure')),
            h('button', { class: 'btn', on: { click: () => nav('#catalog') } },
              icon(ICONS.coins), t('Browse the Catalog'))))
      : h('div', { class: 'grid cols-2' }, runnable.map(renderCard)),
  );
}

// renderAdventureTabs is the shared two-tab strip that sits under the
// h1 on both viewAdventures (Yours) and viewCatalog (Catalog) so the
// arranger can flip between "what I can run now" and "what's on offer"
// without going back to the sidebar. Reuses the existing .lib-tabs
// styles from the Library section for visual consistency.
function renderAdventureTabs(active) {
  const tab = (id, label, route) => h('a', {
    class: 'lib-tab' + (active === id ? ' active' : ''),
    href: route,
    on: { click: (e) => { e.preventDefault(); nav(route); } },
  }, label);
  return h('div', { class: 'lib-tabs', style: 'margin-bottom:1rem' },
    tab('yours',   t('Yours'),   '#adventures'),
    tab('catalog', t('Catalog'), '#catalog'),
  );
}

// pickAndScheduleRun forwards straight to scheduleRun when there's a
// single assignment; when the arranger holds several for the same
// adventure it pops a tiny chooser so they know which one is spent.
async function pickAndScheduleRun(unusedAssignments, adv) {
  if (unusedAssignments.length === 1) {
    return scheduleRun(unusedAssignments[0].id);
  }
  const pick = await modal(t('Pick an assignment'), ({ body, close }) => {
    body.append(h('p', { class: 'muted' },
      t('You hold several assignments for {{title}}. Which one do you want to schedule?', { title: adv.title })));
    const list = h('div', { class: 'grid', style: 'gap:.4rem' });
    for (const a of unusedAssignments) {
      list.append(h('button', {
        class: 'btn',
        style: 'justify-content:flex-start; text-align:left',
        on: { click: () => close(a.id) },
      }, t('up to {{n}} players · purchased {{when}}',
        { n: a.max_players, when: fmtLocal(a.created_at) })));
    }
    body.append(list);
    body.append(h('div', { class: 'row end', style: 'margin-top:1rem' },
      h('button', { class: 'btn', on: { click: () => close(null) } }, t('Cancel'))));
  });
  if (pick) scheduleRun(pick);
}

// ========== Catalog ==========
// Discovery surface for adventures the arranger doesn't author. The
// read-about-and-buy counterpart to Adventures (which is "what can I
// actually run right now"). Buying slots here creates an assignment
// which then promotes the adventure onto the Adventures page.

  const r = await api('/api/admin/adventures');
  const advs = r.body?.adventures || [];
  const catalog = advs.filter((a) => !a.mine_to_edit && a.published);

  view.replaceChildren(
    h('h1', {}, t('Adventures')),
    renderAdventureTabs('catalog'),
    h('p', { class: 'muted' },
      t('Published adventures from other organisations. Buy player slots to add one to your own Adventures list.')),
    catalog.length === 0
      ? h('div', { class: 'empty' },
          h('p', {}, t('No published adventures yet.')),
          h('p', { class: 'muted', style: 'margin-top:.5rem' },
            t('Check back soon — operators publish new adventures regularly.')))
      : h('div', { class: 'grid cols-2' }, catalog.map((a) =>
        h('div', {
          class: 'card clickable',
          on: { click: () => nav('#catalog/' + a.slug) },
        },
          h('div', { class: 'row between', style: 'align-items:flex-start; gap:.75rem' },
            h('div', { class: 'row', style: 'gap:.75rem; align-items:center; min-width:0' },
              adventureCover(a, 56),
              h('h2', { style: 'margin:0' }, a.title)),
            h('div', { class: 'row', style: 'gap:.35rem; flex-wrap:wrap; justify-content:flex-end' },
              a.language
                ? h('span', {
                    class: 'pill',
                    style: 'letter-spacing:.05em',
                    title: t('Adventure content language'),
                  },
                    zvI18n.flagFor(a.language) ? zvI18n.flagFor(a.language) + ' ' : '',
                    h('span', { style: 'text-transform:uppercase' }, a.language))
                : null,
              h('span', { class: 'pill' }, a.page_count === 1
                ? t('{{n}} puzzle', { n: a.page_count })
                : t('{{n}} puzzles', { n: a.page_count })))),
          a.description ? h('p', { class: 'muted', style: 'margin-top:.35rem' }, a.description) : null,
          h('p', { class: 'muted mono', style: 'font-size:.8rem' },
            a.slug + (a.author ? ' · ' + a.author : '')),
          h('div', { class: 'row end', style: 'margin-top:.5rem' },

              class: 'btn primary',

// viewCatalogDetail is the Catalog's read-about page — the surface an
// arranger uses to decide whether an adventure fits their event.
// Aggregates the per-puzzle data the backend returns into decision-
// relevant facts (geographic flexibility, media mix, hint timing,
// estimated playtime) without rendering individual puzzles — the
// Catalog should help an arranger judge the shape of the adventure,
// not spoil the content they haven't paid for yet.
// useAdventureFromCatalog forks a Catalog adventure into the caller's
// org via the existing duplicate endpoint and navigates to the new
// adventure's detail page. Universal entry point — every Catalog
// adventure goes through this path now (the as_is/template
// distinction was retired alongside the move to per-event billing).
// Server enforces org_admin via canAuthor; org_members trying this
// path get a tidy 403 toast.
async function useAdventureFromCatalog(adv) {
  const r = await api(`/api/admin/adventures/${encodeURIComponent(adv.slug)}/duplicate`, {
    method: 'POST',
    body: JSON.stringify({}),
  });
  if (r.status === 201 && r.body?.slug) {
    toastOk(t('Added to your Adventures — customise as much or as little as you want, then schedule.'));
    nav('#adventures/' + encodeURIComponent(r.body.slug));
    return;
  }
  toastErr(r.body?.error || t('Could not add the adventure to your org.'));
}

async function viewCatalogDetail(view, slug) {
  const r = await api('/api/admin/adventures/' + encodeURIComponent(slug));
  if (!r.ok) { view.replaceChildren(h('p', { class: 'err' }, r.body?.error || t('not found'))); return; }
  const a = r.body;
  const pages = (a.pages || []).filter((p) => !p.disabled);
  const facts = computeAdventureFacts(pages);

  // ── Hero card: cover, title, slug+author meta, big Buy CTA, blurb.
  const hero = h('div', { class: 'card' },
    h('div', { class: 'row between', style: 'align-items:flex-start; gap:1rem; flex-wrap:wrap' },
      h('div', { class: 'row', style: 'gap:1rem; align-items:center; min-width:0' },
        adventureCover(a, 96),
        h('div', { style: 'min-width:0' },
          h('h1', { style: 'margin:0 0 .15rem' }, a.title),
          h('p', { class: 'muted mono', style: 'margin:0; font-size:.85rem' },
            a.slug + (a.author ? ' · ' + a.author : '')))),
      h('div', { class: 'row', style: 'gap:.5rem; flex-wrap:wrap' },
        // Preview lands on /play in spoiler-free mode for buyers and
        // share-holders, full-fidelity for authors. Catalog browsers
        // who haven't bought see a 403 from the preview endpoint —
        // matches the policy we just locked in on the server.
        h('a', {
          class: 'btn',
          href: '/play?preview=' + encodeURIComponent(a.slug) + '&page=0',
          target: '_blank',
          rel: 'noopener',
        }, icon(ICONS.eye), t('Preview')),
        h('button', {
          class: 'btn primary',
          on: { click: () => useAdventureFromCatalog(a) },
        }, icon(ICONS.plus), t('Use this adventure')))),
    a.description
      ? h('p', { style: 'white-space:pre-wrap; margin:.85rem 0 0' }, a.description)
      : h('p', { class: 'muted', style: 'margin:.85rem 0 0' }, t('(no description)')),
  );

  // ── At a glance: a tile grid of decision-relevant facts. Each tile
  //    has a short label + one-line value, all derived from the puzzle
  //    data so the page reflects reality (no separate metadata to drift).
  const glance = (label, value) => h('div', {
    class: 'glance-tile',
    style: 'padding:.7rem .85rem; background:var(--surface-2); border-radius:8px; min-width:0',
  },
    h('p', { class: 'muted', style: 'margin:0; font-size:.7rem; text-transform:uppercase; letter-spacing:.07em; font-weight:700' }, label),
    h('p', { style: 'margin:.2rem 0 0; font-weight:600; font-size:.95rem; overflow:hidden; text-overflow:ellipsis' }, value),
  );
  const glanceGrid = h('div', { class: 'card' },
    h('h2', { style: 'margin:0 0 .55rem' }, t('At a glance')),
    h('div', {
      style: 'display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:.5rem',
    },
      glance(t('Puzzles'), pages.length === 1
        ? t('{{n}} puzzle', { n: pages.length })
        : t('{{n}} puzzles', { n: pages.length })),
      glance(t('Estimated playtime'), facts.playtime),
      glance(t('Location'), facts.geo.shortLabel),
      glance(t('Media'), facts.mediaLabel),
      glance(t('Hints'), facts.hintsLabel),
      a.language
        ? glance(t('Language'),
            (zvI18n.flagFor(a.language) ? zvI18n.flagFor(a.language) + ' ' : '') + a.language.toUpperCase())
        : null,
      a.author ? glance(t('Author'), a.author) : null,
    ),
  );

  // ── Where to play: longer prose + a mini-map for location-bound
  //    adventures. The map is built lazily — we ensureLeaflet() only
  //    when there's actually a bbox to render.
  const whereCard = h('div', { class: 'card' },
    h('h2', { style: 'margin:0 0 .35rem' }, t('Where to play')),
    h('p', { style: 'margin:0 0 .5rem' }, facts.geo.blurb),
  );
  if (facts.geo.bbox) {
    const mapHost = h('div', {
      style: 'height:240px; border-radius:8px; overflow:hidden; border:1px solid var(--border-soft)',
    });
    whereCard.append(mapHost);
    // Lazy Leaflet load matches how the run-detail map is wired —
    // first paint of the Catalog detail page shouldn't pay the Leaflet
    // download cost just for the bbox tile.
    ensureLeaflet().then(() => {
      const map = L.map(mapHost, { zoomControl: true, attributionControl: false }).fitBounds([
        [facts.geo.bbox.minLat, facts.geo.bbox.minLng],
        [facts.geo.bbox.maxLat, facts.geo.bbox.maxLng],
      ], { padding: [20, 20] });
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18, attribution: '© OpenStreetMap',
      }).addTo(map);
      // Faint marker cluster — shows shape without giving away
      // every gate's exact coordinates as a precise pin.
      for (const p of facts.geo.points) {
        L.circleMarker([p.lat, p.lng], {
          radius: 6, weight: 0, fillColor: 'var(--accent)', fillOpacity: 0.7,
        }).addTo(map);
      }
    }).catch(() => { /* offline / blocked — silent fallback to text-only */ });
  }

  // ── What players need: phone-side requirements, derived from the
  //    puzzle mix. Players don't sign up to find out they needed
  //    headphones halfway through.
  const needs = [];
  needs.push(h('li', {}, t('A smartphone with a modern browser (Safari, Chrome, Firefox).')));
  if (facts.geo.kind !== 'anywhere') {
    needs.push(h('li', {}, t('GPS / location services enabled — some puzzles only unlock when the team reaches a specific spot.')));
  }
  if (facts.audioPages > 0) {
    needs.push(h('li', {}, t('Audio output — {{n}} puzzle(s) include audio clips. Headphones recommended in noisy venues.', { n: facts.audioPages })));
  }
  if (facts.imagePages > 0) {
    needs.push(h('li', {}, t('Bandwidth for image downloads — {{n}} puzzle(s) include images.', { n: facts.imagePages })));
  }
  const needsCard = h('div', { class: 'card' },
    h('h2', { style: 'margin:0 0 .35rem' }, t('What players need')),
    h('ul', { style: 'margin:0; padding-left:1.2rem' }, ...needs),
  );

  view.replaceChildren(
    h('button', { class: 'btn ghost small', on: { click: () => nav('#catalog') } },
      icon(ICONS.back), t('Catalog')),
    hero,
    glanceGrid,
    whereCard,
    needsCard,
  );
}

// computeAdventureFacts derives the decision-relevant aggregates the
// Catalog detail page surfaces. Pure function over the page array so it
// can be unit-tested in isolation if a future regression appears.
//   - geo.kind: 'anywhere' | 'spot' | 'area' | 'tour' | 'mixed'
//   - geo.bbox: lat/lng bounds of all gated pages, null when none gated
//   - geo.points: gate coordinates for the mini-map (gated pages only)
//   - playtime: rough text estimate based on page count + hint delays
//   - mediaLabel / hintsLabel: short pill copy for the at-a-glance grid
function computeAdventureFacts(pages) {
  const gated = pages.filter((p) => p.gated);
  const audioPages = pages.filter((p) => (p.audio || []).length > 0).length;
  const imagePages = pages.filter((p) => (p.images || []).length > 0).length;
  const hints = pages.flatMap((p) => p.hints || []);
  const timedHints = hints.filter((hh) => (hh.delay_seconds || 0) > 0).length;

  // Playtime: assume ~5 minutes per puzzle as a baseline, plus a
  // few extra minutes for image-heavy or audio-heavy ones (players
  // pause to look / listen). Round to a 5-minute bucket so the
  // estimate doesn't pretend to be precise.
  const baseMin = pages.length * 5;
  const mediaBoost = (audioPages + imagePages) * 1;
  const lowMin = Math.max(15, Math.round((baseMin + mediaBoost) * 0.8 / 5) * 5);
  const highMin = Math.max(lowMin + 10, Math.round((baseMin + mediaBoost) * 1.4 / 5) * 5);
  const playtime = lowMin === highMin
    ? t('{{m}} min', { m: lowMin })
    : t('{{lo}}–{{hi}} min', { lo: lowMin, hi: highMin });

  let geo;
  if (gated.length === 0) {
    geo = {
      kind: 'anywhere',
      shortLabel: t('Anywhere'),
      blurb: t('No GPS gates — players answer text, image, and audio puzzles wherever you choose to host the event. Adapt prompts to your venue and run it indoors, outdoors, or fully online.'),
      bbox: null,
      points: [],
    };
  } else {
    let minLat = Infinity, maxLat = -Infinity, minLng = Infinity, maxLng = -Infinity;
    const points = [];
    for (const p of gated) {
      const { lat, lng } = p.location || {};
      if (typeof lat !== 'number' || typeof lng !== 'number') continue;
      minLat = Math.min(minLat, lat); maxLat = Math.max(maxLat, lat);
      minLng = Math.min(minLng, lng); maxLng = Math.max(maxLng, lng);
      points.push({ lat, lng });
    }
    const spanKm = haversineKm(minLat, minLng, maxLat, maxLng);
    const mixed = gated.length < pages.length;
    let kind, shortLabel, blurb;
    if (spanKm < 0.4) {
      kind = 'spot';
      shortLabel = t('Single venue');
      blurb = t('All gated puzzles cluster within a ~{{m}} m area — runs as a single-venue event (one park, one campus, one café crawl).', { m: Math.max(50, Math.round(spanKm * 1000)) });
    } else if (spanKm < 5) {
      kind = 'area';
      shortLabel = t('Specific area (~{{km}} km)', { km: spanKm.toFixed(1) });
      blurb = t('Gated puzzles span ~{{km}} km — fits a campus, neighbourhood, or city quarter. Bound to this geography unless you re-author the locations.', { km: spanKm.toFixed(1) });
    } else {
      kind = 'tour';
      shortLabel = t('Multi-stop tour (~{{km}} km)', { km: Math.round(spanKm) });
      blurb = t('Gated puzzles span ~{{km}} km — a city- or region-wide tour. Plan transport for the team between stops.', { km: Math.round(spanKm) });
    }
    if (mixed) {
      blurb += ' ' + t('{{n}} puzzle(s) are NOT gated and could be re-themed for any venue.', { n: pages.length - gated.length });
    }
    geo = {
      kind, shortLabel, blurb,
      bbox: isFinite(minLat) ? { minLat, maxLat, minLng, maxLng } : null,
      points,
    };
  }

  const mediaParts = [];
  if (imagePages > 0) mediaParts.push(t('{{n}} with images', { n: imagePages }));
  if (audioPages > 0) mediaParts.push(t('{{n}} with audio', { n: audioPages }));
  const mediaLabel = mediaParts.length === 0 ? t('Text-only') : mediaParts.join(' · ');

  let hintsLabel;
  if (hints.length === 0) hintsLabel = t('No hints');
  else if (timedHints === 0) hintsLabel = t('{{n}} hints, all immediate', { n: hints.length });
  else if (timedHints === hints.length) hintsLabel = t('{{n}} hints, all timed', { n: hints.length });
  else hintsLabel = t('{{n}} hints ({{m}} timed)', { n: hints.length, m: timedHints });

  return { geo, audioPages, imagePages, mediaLabel, hintsLabel, playtime };
}

// haversineKm returns great-circle distance in km between two
// lat/lng pairs. Used here to characterise the geographic span of
// gated puzzles; mathx-quality precision isn't needed (we round to
// fairly coarse buckets in the Catalog copy).
function haversineKm(aLat, aLng, bLat, bLng) {
  if (!isFinite(aLat) || !isFinite(bLat)) return 0;
  const R = 6371;
  const toRad = (d) => d * Math.PI / 180;
  const dLat = toRad(bLat - aLat);
  const dLng = toRad(bLng - aLng);
  const x = Math.sin(dLat / 2) ** 2
    + Math.cos(toRad(aLat)) * Math.cos(toRad(bLat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}

// viewPurchases is the post-checkout landing + history view. Simulated
// checkout redirects here after a successful /confirm; the user sees
// their new assignment alongside any previous purchases.
async function viewPurchases(view) {
  const r = await api('/api/admin/purchases');
  const purchases = r.body?.purchases || [];
  const money = (cents, cur) => new Intl.NumberFormat(undefined, {
    style: 'currency', currency: cur || 'EUR',
  }).format(cents / 100);
  const isAdmin = state.me?.role === 'admin';

  // Stripe Customer Portal button — only when the org has at least
  // one completed Stripe purchase (server enforces no_customer otherwise).
  const hasStripePaid = purchases.some((p) => p.state === 'paid' && p.provider === 'stripe');
  const portalBtn = hasStripePaid
    ? h('button', {
        class: 'btn',
        on: { click: async (e) => {
          e.target.disabled = true;
          const pr = await api('/api/admin/me/portal-session', { method: 'POST' });
          e.target.disabled = false;
          if (pr.status === 200 && pr.body?.url) {
            location.href = pr.body.url;
            return;
          }
          toastErr(pr.body?.error || t('Could not open billing portal — try again.'));
        } },
      }, t('Update payment method'))
    : null;

  // Filter state — admins get the provider chips + a "to bill" focus
  // chip for invoice rows that haven't been marked billed yet. Org
  // users see the same flat list as before.
  const FILTERS = isAdmin
    ? [
        { key: 'all',      label: t('All') },
        { key: 'tobill',   label: t('To bill') },
        { key: 'invoice',  label: t('Invoice') },
        { key: 'stripe',   label: t('Stripe') },
        { key: 'free',     label: t('Free') },
      ]
    : null;
  let activeFilter = isAdmin ? 'tobill' : 'all';
  const matchesFilter = (p) => {
    switch (activeFilter) {
      case 'tobill':  return p.provider === 'invoice' && p.state === 'paid' && !p.billed_at;
      case 'invoice': return p.provider === 'invoice';
      case 'stripe':  return p.provider === 'stripe';
      case 'free':    return p.provider === 'free';
      default:        return true;
    }
  };

  const tableHost = h('div');
  const summaryHost = h('div');
  const renderTable = () => {
    const filtered = purchases.filter(matchesFilter);
    // Summary row — only meaningful on the admin view, where filters
    // narrow the set down to "what do I act on?".
    if (isAdmin) {
      const total = filtered.reduce((acc, p) => acc + (p.amount_cents || 0), 0);
      const orgs = new Set(filtered.map((p) => p.org_id));
      summaryHost.replaceChildren(
        filtered.length === 0
          ? h('p', { class: 'muted', style: 'margin:.25rem 0 0' },
              t('Nothing matches this filter.'))
          : h('p', { class: 'muted', style: 'margin:.25rem 0 .5rem' },
              t('{{n}} purchase(s) · {{total}} across {{orgs}} org(s)',
                { n: filtered.length, total: money(total, 'EUR'), orgs: orgs.size })),
      );
    } else {
      summaryHost.replaceChildren();
    }

    if (filtered.length === 0) {
      tableHost.replaceChildren(renderEmptyPurchases());
      return;
    }
    tableHost.replaceChildren(
      h('div', { class: 'card' }, h('table', { class: 'table' },
        h('thead', {}, h('tr', {},
          h('th', {}, t('Adventure')),
          isAdmin ? h('th', {}, t('Org')) : null,
          h('th', {}, t('Slots')),
          h('th', {}, t('Total')),
          h('th', {}, t('State')),
          h('th', {}, t('Date')),
          h('th', {}, ''))),
        h('tbody', {}, filtered.map((p) => h('tr', {
          class: p.provider === 'invoice' && !p.billed_at ? 'row-stuck' : '',
        },
          h('td', {}, p.adventure_title || p.adventure_slug),
          isAdmin ? h('td', { class: 'mono', style: 'font-size:.85rem' }, '#' + p.org_id) : null,
          h('td', { class: 'mono' }, p.max_players),
          h('td', { class: 'mono' }, money(p.amount_cents, p.currency)),
          h('td', {},
            h('span', {
              class: 'pill ' + (p.state === 'paid' ? 'success' : p.state === 'pending' ? 'warning' : p.state === 'refunded' ? 'danger' : ''),
            }, stateGlyph(p.state) + p.state),
            p.provider === 'invoice'
              ? h('span', { class: 'pill', style: 'margin-left:.35rem; font-size:.7rem' }, t('invoice'))
              : null,
            p.provider === 'invoice' && p.billed_at
              ? h('span', { class: 'pill success', style: 'margin-left:.35rem; font-size:.7rem' }, t('billed'))
              : null),
          h('td', { class: 'muted mono', style: 'font-size:.8rem' }, p.created_at),
          h('td', { class: 'row', style: 'gap:.5rem; flex-wrap:wrap; justify-content:flex-end' },
            renderPurchaseActions(p)),
        ))))),
    );
  };

  // Filter chip bar (admin only).
  let chipBar = null;
  if (isAdmin) {
    chipBar = h('div', { class: 'row', style: 'gap:.25rem; flex-wrap:wrap; margin:.5rem 0' });
    FILTERS.forEach((f) => {
      const btn = h('button', {
        class: 'btn small' + (activeFilter === f.key ? ' primary' : ' ghost'),
        type: 'button',
        on: { click: () => {
          activeFilter = f.key;
          for (const child of chipBar.children) {
            const k = child.dataset.k;
            child.className = 'btn small' + (k === activeFilter ? ' primary' : ' ghost');
          }
          renderTable();
        } },
      }, f.label);
      btn.dataset.k = f.key;
      chipBar.append(btn);
    });
  }

  view.replaceChildren(...[
    h('div', { class: 'row between' },
      h('h1', {}, t('Purchases')),
      h('div', { class: 'row', style: 'gap:.5rem; flex-wrap:wrap' },
        portalBtn,
        h('button', { class: 'btn', on: { click: () => nav('#adventures') } }, t('Browse catalog')))),
    isAdmin
      ? h('p', { class: 'muted' },
          t('Every purchase across all orgs. Off-platform invoices show under "To bill" until you mark them billed.'))
      : h('p', { class: 'muted' },
          t('Every player-slot purchase. Paid ones produce an assignment you can schedule from the Adventures page.')),
    chipBar,
    summaryHost,
    purchases.length === 0 ? renderEmptyPurchases() : tableHost,
  ].filter(Boolean));
  if (purchases.length > 0) renderTable();
}

// renderPurchaseActions returns per-row links/buttons:
//   - "Receipt" — Stripe-hosted invoice URL when present (paid only).
//   - "Refund"  — admin-only, paid Stripe purchases. Hidden for org
//                 users; they contact us out-of-band.
function renderPurchaseActions(p) {
  const out = [];
  if (p.invoice_url) {
    out.push(h('a', {
      href: p.invoice_url, target: '_blank', rel: 'noopener',
      class: 'btn small ghost',
    }, t('Receipt')));
  }
  // Admin-only "Mark billed" toggle for off-platform invoice purchases.
  // Once you've sent the actual invoice from outside the platform,
  // click this so the row drops out of the "To bill" focus filter.
  if (state.me?.role === 'admin' && p.provider === 'invoice' && p.state === 'paid') {
    const label = p.billed_at ? t('Unmark billed') : t('Mark billed');
    const btn = h('button', { class: 'btn small', type: 'button' }, label);
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      const next = !p.billed_at;
      const r = await api('/api/admin/purchases/' + p.id + '/billed', {
        method: 'POST',
        body: JSON.stringify({ billed: next }),
      });
      if (r.status === 200) {
        toastOk(next ? t('Marked billed') : t('Marked unbilled'));
        renderRoute();
      } else {
        btn.disabled = false;
        toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
      }
    });
    out.push(btn);
  }
  if (state.me?.role === 'admin' && p.state === 'paid' && p.provider === 'stripe') {
    const btn = h('button', { class: 'btn small danger', type: 'button' }, t('Refund'));
    btn.addEventListener('click', async () => {
      if (!confirm(t('Refund {{amount}} to the customer? The state flips to "refunded" once Stripe confirms.', {
        amount: new Intl.NumberFormat(undefined, { style: 'currency', currency: p.currency || 'EUR' }).format(p.amount_cents / 100),
      }))) return;
      btn.disabled = true;
      const r = await api('/api/admin/purchases/' + p.id + '/refund', { method: 'POST' });
      if (r.status !== 202) {
        btn.disabled = false;
        toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
        return;
      }
      toastOk(t('Refund initiated. Confirming with Stripe…'));
      // The /refund endpoint fires the Stripe API call and returns
      // immediately; the actual state flip happens when the
      // charge.refunded webhook lands. Poll the purchase row every 2s
      // for up to 30s so we can give the operator a clean confirmation
      // (or a "still pending" warning) without forcing a full page
      // reload.
      const deadline = Date.now() + 30_000;
      const poll = async () => {
        if (Date.now() > deadline) {
          toastErr(t('Refund still processing — check Stripe and refresh in a minute.'));
          renderRoute();
          return;
        }
        const r2 = await api('/api/admin/purchases/' + p.id);
        if (r2.status === 200 && r2.body?.state === 'refunded') {
          toastOk(t('Refund confirmed.'));
          renderRoute();
          return;
        }
        setTimeout(poll, 2000);
      };
      setTimeout(poll, 2000);
    });
    out.push(btn);
  }
  return out;
}
