// pricingHelpers reads the canonical per-player price + free-tier
// threshold off /whoami and bundles the formatters every modal that
// shows a total needs. Falling back to defaults keeps stale dev
// clones with old whoami payloads working. PRICE_CENTS / FREE are
// returned alongside fmtMoney / chargeable so callers can format
// the headline copy ("first {{n}} free, then {{price}} per player")
// without unpacking the same numbers themselves.
function pricingHelpers() {
  const PRICE_CENTS = (state.me?.pricing?.player_cents) || 500;
  const FREE        = (state.me?.pricing?.free_players_per_event) ?? 15;
  const CURRENCY    = (state.me?.pricing?.currency) || 'EUR';
  const fmtMoney = (cents) => new Intl.NumberFormat(undefined,
    { style: 'currency', currency: CURRENCY }).format(cents / 100);
  // chargeable(n) is what the buyer actually pays — first FREE
  // slots are free, the rest are PRICE_CENTS each.
  const chargeable = (n) => Math.max(0, n - FREE) * PRICE_CENTS;
  return { PRICE_CENTS, FREE, CURRENCY, fmtMoney, chargeable };
}

// openPurchaseModal drives the buy-player-slots flow. The user picks a
// player count, sees the total (with the free-tier deduction applied),
// and confirms. The server creates a pending purchase and returns a
// checkout_url — we redirect to it
// (simulated page now, Stripe Checkout later). On success the checkout
// page navigates the user back to #purchases so they see the fresh
// assignment.
// activeOrgIsTrusted reports whether the caller's currently-active org
// has been flagged trusted by a global admin. Trusted orgs see the
// "Add to invoice" alternative on the buy-player-slots modal.
function activeOrgIsTrusted() {
  const orgID = state.me?.org_id;
  if (!orgID) return false;
  const m = (state.me?.memberships || []).find((x) => x.org_id === orgID);
  return !!(m && m.trusted);
}

async function openPurchaseModal(adv) {
  const { PRICE_CENTS, FREE, fmtMoney, chargeable } = pricingHelpers();
  const trusted = activeOrgIsTrusted();
  // submit() ships a {provider} the server can route. Stripe / simulated
  // both come back with a checkout_url to redirect to; free + invoice
  // come back already paid with an assignment_id.
  const submit = async (provider, n) => {
    const body = { adventure_slug: adv.slug, max_players: n };
    if (provider) body.provider = provider;
    const r = await api('/api/admin/purchases', {
      method: 'POST', body: JSON.stringify(body),
    });
    if (r.status !== 201) {
      toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
      return;
    }
    if (r.body.state === 'paid' && r.body.assignment_id) {
      try { sessionStorage.setItem('zv-just-purchased', String(r.body.assignment_id)); } catch { /* no-op */ }
      if (r.body.provider === 'invoice') toastOk(t('Player slots added to your next invoice'));
      location.href = '/arrange#adventures';
      return;
    }
    location.href = r.body.checkout_url;
  };
  await modal(t('Buy player slots'), ({ body, close }) => {
    const players = h('input', { type: 'number', min: '1', max: '500', value: '30', required: true });
    const totalEl = h('strong', {}, '');
    const update = () => {
      const n = Math.max(1, parseInt(players.value, 10) || 0);
      totalEl.textContent = fmtMoney(chargeable(n));
    };
    players.addEventListener('input', update);
    update();
    const payNowBtn = h('button', { class: 'btn primary', type: 'submit' }, t('Continue'));
    const invoiceBtn = trusted
      ? h('button', { class: 'btn', type: 'button',
          title: t('Skip Stripe — your finance team will get an invoice from us.'),
          on: { click: async () => {
            const n = Math.max(1, parseInt(players.value, 10) || 1);
            close(true);
            await submit('invoice', n);
          } } },
          t('Add to invoice'))
      : null;
    const form = h('form', {},
      h('p', {},
        t('How many players will join "{{title}}"?', { title: adv.title || adv.slug })),
      h('label', { class: 'field' },
        h('span', {}, t('Players')), players),
      h('p', { class: 'muted' },
        t('Total: '), totalEl,
        ' ',
        h('span', { class: 'muted', style: 'font-size:.85rem' },
          t('(first {{n}} free, then {{price}} per player)',
            { n: FREE, price: fmtMoney(PRICE_CENTS) }))),
      h('div', { class: 'row end', style: 'gap:.5rem; flex-wrap:wrap' },
        h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, t('Cancel')),
        invoiceBtn,
        payNowBtn));
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const n = Math.max(1, parseInt(players.value, 10) || 1);
      close(true);
      await submit(null, n);
    });
    body.append(form);
  });
}

async function viewAdventureDetail(view, slug) {
  const r = await api('/api/admin/adventures/' + encodeURIComponent(slug));
  if (!r.ok) { view.replaceChildren(h('p', { class: 'err' }, r.body?.error || t('not found'))); return; }
  const a = r.body;
  const pages = a.pages || [];

  // ---- Hero: cover + title + status pills + CTAs ----
  const pills = [];
  if (a.mine_to_edit) {
    pills.push(h('span', { class: 'pill' }, t('Yours to edit')));
  }
  if (a.org_id == null) {
    pills.push(h('span', { class: 'pill' + (a.published ? ' success' : ' warning') },
      a.published ? t('Published in catalog') : t('Draft')));
  }
  if (a.language) {
    pills.push(h('span', {
      class: 'pill',
      style: 'letter-spacing:.05em',
      title: t('Adventure content language'),
    },
      zvI18n.flagFor(a.language) ? zvI18n.flagFor(a.language) + ' ' : '',
      h('span', { style: 'text-transform:uppercase' }, a.language)));
  }
  if ((a.running_event_count || 0) > 0) {
    pills.push(h('span', { class: 'pill warning' },
      a.running_event_count === 1
        ? t('1 event running now')
        : t('{{n}} events running now', { n: a.running_event_count })));
  }
  const ctas = h('div', { class: 'row', style: 'gap:.5rem; flex-wrap:wrap' });
  if (a.mine_to_edit) {
    ctas.append(h('button', {
      class: 'btn primary',
      on: { click: () => nav('#library/' + encodeURIComponent(a.slug)) },
    }, icon(ICONS.pencil), t('Edit')));
  } else {
    ctas.append(h('button', {
      class: 'btn primary',
      on: { click: () => openPurchaseModal({ slug: a.slug, title: a.title }) },
    }, icon(ICONS.coins), t('Buy player slots')));
  }
  // Preview opens the player view in a new tab — handy for both
  // catalog browsers and authors checking their own work without
  // losing this page's scroll position.
  ctas.append(h('a', {
    class: 'btn',
    href: '/arrange/preview/' + encodeURIComponent(a.slug) + '?page=0',
    target: '_blank', rel: 'noopener',
    on: { click: (e) => {
      e.preventDefault();
      // The /preview route lives under the same path the player uses,
      // hidden behind admin auth. We open it via the existing modal
      // helper if present; falling back to a new tab keeps it
      // reachable from this page even when the helper is missing.
      const url = `/play?preview=${encodeURIComponent(a.slug)}`;
      window.open(url, '_blank', 'noopener');
    } },
  }, icon(ICONS.eye), t('Preview as player')));

  const hero = h('section', { class: 'adv-hero' },
    h('div', { class: 'adv-hero-left' }, adventureCover(a, 96)),
    h('div', { class: 'adv-hero-mid' },
      h('h1', { style: 'margin:0' }, a.title),
      h('div', { class: 'adv-hero-meta muted' },
        a.author ? h('span', {}, a.author) : null,
        h('span', { class: 'mono', style: 'opacity:.65' }, a.slug),
      ),
      pills.length ? h('div', { class: 'adv-hero-pills' }, ...pills) : null,
    ),
    h('div', { class: 'adv-hero-cta' }, ctas),
  );

  // ---- Quick stats: puzzle count, gated count, max extent ----
  const enabled = pages.filter((p) => !p.disabled);
  const gatedCount = enabled.filter((p) => p.gated).length;
  // Max distance between any two pins — the rough "how big is this
  // adventure on the ground" number. O(n^2) is fine for the adventure
  // sizes this product targets (rarely past 20 puzzles).
  let maxKm = 0;
  for (let i = 0; i < enabled.length; i++) {
    const a1 = enabled[i].location;
    if (!a1 || (!a1.lat && !a1.lng)) continue;
    for (let j = i + 1; j < enabled.length; j++) {
      const b1 = enabled[j].location;
      if (!b1 || (!b1.lat && !b1.lng)) continue;
      const d = haversineKm(a1.lat, a1.lng, b1.lat, b1.lng);
      if (d > maxKm) maxKm = d;
    }
  }
  const stats = h('div', { class: 'adv-stats' },
    statBlock(String(enabled.length), enabled.length === 1 ? t('puzzle') : t('puzzles')),
    statBlock(String(gatedCount), gatedCount === 1 ? t('gated stop') : t('gated stops')),
    maxKm > 0 ? statBlock(formatKm(maxKm), t('extent')) : null,
  );

  // ---- Description / intro / outro ----
  const story = h('section', { class: 'adv-story' });
  if (a.description) story.append(h('p', { class: 'adv-desc' }, a.description));
  if (a.intro_text && a.intro_text.trim()) {
    story.append(
      h('h3', { class: 'adv-section-h' }, t('Intro shown to players')),
      h('div', { class: 'adv-prose' }, a.intro_text));
  }
  if (a.outro_text && a.outro_text.trim()) {
    story.append(
      h('h3', { class: 'adv-section-h' }, t('Outro on completion')),
      h('div', { class: 'adv-prose' }, a.outro_text));
  }

  // ---- Adventure-wide map ----
  const mapHost = h('div', { class: 'adv-map-host', id: 'adv-map-' + a.slug });
  const mapCard = h('div', { class: 'card' },
    h('h2', { style: 'margin:0 0 .5rem' }, t('Map')),
    h('p', { class: 'muted', style: 'font-size:.85rem; margin:0 0 .5rem' },
      t('All puzzle locations. Click a pin to jump to that puzzle.')),
    mapHost);

  // ---- Puzzle cards ----
  const puzzleCards = enabled.map((p, i) => renderPuzzleCard(p, i, { mode: 'detail' }));

  // ---- Simulator card ----
  // Only meaningful once there's at least one enabled puzzle to walk
  // through; without that, every Start press would fail server-side
  // anyway. Hidden from catalog viewers (mine_to_edit / shared check)
  // so a browser of someone else's adventure doesn't see controls
  // they can't (and shouldn't) drive against an org-mate's run.
  const canSimulate = enabled.length > 0 && (a.mine_to_edit || a.shared);
  const simHost = canSimulate ? h('div', { class: 'card' }) : null;
  if (simHost) mountSimulatorPanel(simHost, a.slug);

  view.replaceChildren(...[
    h('button', { class: 'btn ghost small', on: { click: () => nav('#adventures') } }, icon(ICONS.back), t('Back')),
    hero,
    stats,
    story,
    mapCard,
    simHost,
    h('h2', { style: 'margin-top:1.5rem' }, t('Puzzles')),
    h('div', { class: 'adv-puzzles' }, ...puzzleCards),
  ].filter(Boolean));

  // Mount the map after the DOM lands so Leaflet has a sized
  // container — same trick the run-detail map uses.
  setTimeout(() => mountAdventureMap(mapHost, enabled, a.colors), 0);
}

// statBlock is a small bordered tile rendering a value + label.
// Used in the adventure-detail quick-stats row; layout is handled
// by .adv-stats grid.
function statBlock(value, label) {
  return h('div', { class: 'adv-stat' },
    h('div', { class: 'adv-stat-v' }, value),
    h('div', { class: 'adv-stat-l' }, label));
}

// haversineKm returns the great-circle distance between two
// lat/lng points in kilometres. Used for the adventure "extent"
// stat so authors can see the rough geographic spread of their
// puzzles without doing the math themselves.
function haversineKm(lat1, lng1, lat2, lng2) {
  const R = 6371; // km
  const rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad;
  const dLng = (lng2 - lng1) * rad;
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(lat1 * rad) * Math.cos(lat2 * rad) *
            Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function formatKm(km) {
  if (km < 1) {
    return new Intl.NumberFormat(undefined, { maximumFractionDigits: 0 })
      .format(Math.round(km * 1000)) + ' m';
  }
  const digits = km >= 10 ? 0 : 1;
  return new Intl.NumberFormat(undefined, {
    minimumFractionDigits: digits, maximumFractionDigits: digits,
  }).format(km) + ' km';
}

// formatHintDelayBrief renders an unlock-delay as human copy for
// the adventure-detail card. Uses parseHintDelay's reverse — the
// editor already has formatHintDelay for the same shape, but the
// card wants "after 2m" rather than "(2m)" so we don't share.
function formatHintDelayBrief(sec) {
  if (sec <= 0) return t('immediate');
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  if (!m) return t('after {{s}}s', { s });
  if (!s) return t('after {{m}}m', { m });
  return t('after {{m}}m {{s}}s', { m, s });
}

// renderPuzzleCard renders one puzzle as a card. Used by both the
// read-only adventure detail page (mode 'detail') and the adventure
// editor (mode 'edit') — the body (title row, images, prompt, hints,
// location, accept reveal) is identical; the mode flag toggles the
// chrome around it. Edit adds the drag handle, the whole-card click-
// to-edit, the disabled-state styling, and the per-card action
// buttons (preview, edit, delete); detail leaves all of that off.
//
// Data shape: the detail endpoint nests location under p.location;
// the edit endpoint flattens it into top-level p.lat/p.lng. The
// helper accepts either — read-side normalisation beats forcing both
// callers through a transformer.
//
// opts:
//   mode:        'edit' | 'detail'   (default 'detail')
//   adv:         adventure object — required by 'edit' for the
//                preview / open-edit / delete callbacks
//   previewIdx:  position among enabled pages (optional, 'edit' only)
function renderPuzzleCard(p, i, opts) {
  opts = opts || {};
  const mode = opts.mode || 'detail';
  const isEdit = mode === 'edit';
  const adv = opts.adv;
  const previewIdx = opts.previewIdx;

  const loc = p.location || p;
  const lat = loc.lat || 0;
  const lng = loc.lng || 0;
  const radiusM = loc.radius_m || 0;

  // ---- Header: index badge + title (left), pills + actions (right). ----
  const headLeft = h('div', { class: 'row', style: 'align-items:center; min-width:0; flex:1' });
  if (isEdit) {
    headLeft.append(h('span', {
      class: 'drag-handle',
      title: t('Drag to reorder'),
      'aria-label': t('Drag to reorder'),
      on: { click: (e) => e.stopPropagation() },
      html: ICONS.grip,
    }));
  }
  headLeft.append(
    h('span', { class: 'adv-pz-num' }, String(i + 1)),
    h('strong', { class: 'adv-pz-title' }, p.title || t('(untitled)')));

  const headRight = h('div', { class: 'card-actions' });
  if (isEdit && p.disabled) headRight.append(h('span', { class: 'pill' }, t('disabled')));
  if (p.gated) headRight.append(h('span', { class: 'pill warning' }, t('gated')));
  if (isEdit) {
    if (previewIdx != null) {
      headRight.append(iconBtn('eye', t('Open in the player view with author debug panel'),
        () => previewAdventure(adv.slug, previewIdx, true)));
    }
    headRight.append(iconBtn('pencil', t('Edit'), () => openEditPuzzle(adv, p)));
    // Google-Slides-style "Duplicate puzzle" — author crafts one
    // good landmark/trivia/photo puzzle, then makes four more like
    // it without retyping every field. The clone lands directly
    // after the source so the editor stays in flow.
    headRight.append(iconBtn('copy', t('Duplicate'), () => duplicatePuzzle(adv, p)));
    headRight.append(iconBtn('trash', t('Delete'), () => confirmDeletePuzzle(adv, p), { danger: true }));
  }

  const card = h('div', {
    class: 'card adv-pz-card' + (isEdit ? ' clickable puzzle-card' : ''),
    style: (isEdit && p.disabled) ? 'opacity:.6' : '',
    ...(isEdit ? {
      draggable: 'true',
      'data-page-id': p.id,
      'data-page-pos': i,
      on: { click: () => openEditPuzzle(adv, p) },
    } : {}),
  }, h('div', { class: 'adv-pz-head row between' }, headLeft, headRight));

  // ---- Images — before the prompt so the card mirrors the player
  // and editor layouts (title → images → text). The
  // /adventure-assets/image/{id} route gates on staff session OR
  // slot-on-current-page; admin/arranger viewers always pass. ----
  if (p.images && p.images.length) {
    const grid = h('div', { class: 'adv-pz-images' });
    for (const im of p.images) {
      grid.append(h('img', {
        src: im.url, alt: im.alt_text || '',
        title: im.alt_text || '',
      }));
    }
    card.append(grid);
  }

  // ---- Prompt — render the server-supplied HTML so markdown
  // formatting (links, lists, emphasis) shows; fall back to the raw
  // text only if html wasn't provided. ----
  if (p.prompt_html) {
    card.append(h('div', { class: 'adv-pz-prompt md-preview', html: p.prompt_html }));
  } else if (p.prompt) {
    card.append(h('p', { style: 'white-space:pre-wrap' }, p.prompt));
  }

  // ---- Hints disclosure — collapsed by default (the edit/preview
  // surfaces are where authors actually edit them; this is a
  // glanceable list). ----
  if (p.hints && p.hints.length) {
    const hintsList = h('div', { class: 'adv-pz-hints' });
    p.hints.forEach((hint, hi) => {
      const row = h('div', { class: 'adv-pz-hint' },
        h('div', { class: 'adv-pz-hint-head muted' },
          t('Hint {{i}}', { i: hi + 1 }), ' · ', formatHintDelayBrief(hint.delay_seconds || 0)),
        h('div', { class: 'adv-pz-hint-body md-preview', html: hint.text_html || '' }),
      );
      if (hint.images && hint.images.length) {
        const hg = h('div', { class: 'adv-pz-images' });
        for (const im of hint.images) {
          hg.append(h('img', { src: im.url, alt: im.alt_text || '' }));
        }
        row.append(hg);
      }
      hintsList.append(row);
    });
    card.append(
      h('details', { class: 'adv-pz-disclosure' },
        h('summary', {
          // Edit mode wraps the card in a click-to-edit handler;
          // toggling the disclosure summary would otherwise also
          // open the editor.
          on: isEdit ? { click: (e) => e.stopPropagation() } : {},
        }, t('Hints ({{n}})', { n: p.hints.length })),
        hintsList));
  }

  // ---- Location — opens the in-app fullscreen map overlay rather
  // than bouncing the user out to OpenStreetMap. The label keeps
  // the gate radius visible so authors don't have to open the map
  // just to confirm a number they set during authoring. In edit
  // mode the click stopPropagations so a tap on the button doesn't
  // also open the puzzle editor. ----
  if (lat || lng) {
    const gateSuffix = radiusM ? t(' · gate {{r}} m', { r: radiusM }) : '';
    card.append(h('button', {
      class: 'btn small ghost',
      type: 'button',
      style: 'margin-top:.5rem',
      on: { click: (e) => {
        if (isEdit) e.stopPropagation();
        openFullscreenMap({
          title: p.title || t('Location'),
          pins: [{
            lat, lng,
            label: p.title || '',
            gated: p.gated,
            radiusM,
          }],
        });
      } },
    }, icon(ICONS.map), t('Open map'), gateSuffix));
  } else if (isEdit) {
    card.append(h('p', { class: 'muted', style: 'font-size:.8rem; margin-top:.5rem' },
      t('(no location)')));
  }

  // ---- Accepted answers — hidden behind a click-to-reveal toggle
  // so a co-arranger or catalog browser doesn't get the answer key
  // by accident. ----
  if (p.accept && p.accept.length > 0) {
    const reveal = h('button', { class: 'btn small ghost', type: 'button',
      style: 'margin-top:.5rem' },
      icon(ICONS.eye), t('Show answers'));
    const answers = h('p', { class: 'muted', style: 'display:none; margin:.4rem 0 0' },
      ...p.accept.map(acceptChip));
    reveal.addEventListener('click', (e) => {
      if (isEdit) e.stopPropagation();
      const open = answers.style.display === 'none';
      answers.style.display = open ? '' : 'none';
      reveal.replaceChildren(icon(ICONS.eye), open ? t('Hide answers') : t('Show answers'));
    });
    card.append(reveal, answers);
  }

  return card;
}

// openFullscreenMap drops a chromeless overlay with a Leaflet map
// covering the viewport. Generic enough to reuse anywhere we want
// "show this on a map" — the puzzle card link uses it today; future
// callers (track replay, share preview, etc.) pass their own pins.
//
// opts: { title?, pins?, accent? }
//   pins[]: { lat, lng, label?, gated?, radiusM? }
//     gated:   fills the marker (matches the run-detail legend).
//     radiusM: draws a translucent gate circle around the pin.
//
// One pin centres at zoom 17; many auto-fit to bounds.
function openFullscreenMap(opts) {
  return new Promise((resolve) => {
    const { title, pins, accent } = opts || {};
    const list = Array.isArray(pins) ? pins : [];
    const host = document.getElementById('modal-host');
    let removed = false;
    let map = null;
    const close = () => {
      if (removed) return;
      removed = true;
      document.removeEventListener('keydown', onKey);
      try { if (map) map.remove(); } catch { /* leaflet teardown is best-effort */ }
      host.replaceChildren();
      resolve();
    };
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', onKey);
    const mapEl = h('div', { class: 'fsmap-host' });
    const back = h('div', {
      class: 'fsmap-back',
      role: 'dialog',
      'aria-modal': 'true',
      on: { click: (e) => { if (e.target === back) close(); } },
    },
      h('div', { class: 'fsmap-chrome' },
        h('div', { class: 'fsmap-title' }, title || ''),
        h('button', {
          class: 'fsmap-close',
          type: 'button',
          'aria-label': t('Close'),
          on: { click: close },
        }, '×')),
      mapEl,
    );
    host.replaceChildren(back);
    if (typeof L === 'undefined') {
      mapEl.replaceChildren(h('div', { class: 'empty', style: 'padding:2rem' },
        t('Map library is still loading — refresh the page.')));
      return;
    }
    map = L.map(mapEl).setView([59.3293, 18.0686], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 19,
    }).addTo(map);
    const fillColour = accent ||
      getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() ||
      '#ad1357';
    const pts = [];
    for (const pin of list) {
      if (!pin || (!pin.lat && !pin.lng)) continue;
      const m = L.circleMarker([pin.lat, pin.lng], {
        radius: 9,
        color: fillColour,
        weight: 2,
        fillColor: pin.gated ? fillColour : 'transparent',
        fillOpacity: pin.gated ? 1 : 0,
      }).addTo(map);
      if (pin.label) m.bindTooltip(pin.label);
      if (pin.radiusM > 0) {
        L.circle([pin.lat, pin.lng], {
          radius: pin.radiusM,
          color: fillColour,
          weight: 1,
          fillOpacity: .12,
        }).addTo(map);
      }
      pts.push([pin.lat, pin.lng]);
    }
    if (pts.length === 1) {
      map.setView(pts[0], 17);
    } else if (pts.length > 1) {
      map.fitBounds(L.latLngBounds(pts), { padding: [40, 40] });
    }
    // Drop a "you are here" marker if the browser hands one over.
    // Doesn't influence the auto-zoom — the pins are what we're
    // showing; the user marker just adds context so the arranger
    // can read distance to a gate at a glance. Distinct blue keeps
    // it visually separable from the brand-accent puzzle pins.
    // Errors (denied permission, no sensor) are silently swallowed;
    // the map is still useful without the marker.
    if ('geolocation' in navigator) {
      navigator.geolocation.getCurrentPosition((pos) => {
        if (removed) return;
        const { latitude, longitude, accuracy } = pos.coords;
        L.circleMarker([latitude, longitude], {
          radius: 6,
          color: '#fff',
          weight: 2,
          fillColor: '#1976d2',
          fillOpacity: 1,
        }).addTo(map).bindTooltip(t('You are here'));
        if (accuracy && accuracy > 0) {
          L.circle([latitude, longitude], {
            radius: accuracy,
            color: '#1976d2',
            weight: 1,
            fillOpacity: .1,
          }).addTo(map);
        }
      }, () => { /* denied or no fix — silent */ },
        { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 });
    }
    // Leaflet measures its container at init; the overlay is freshly
    // mounted so the size is correct, but invalidateSize after the
    // browser commits the layout is the standard belt-and-braces call
    // for map-in-flex setups.
    setTimeout(() => { try { map.invalidateSize(); } catch { /* torn down */ } }, 30);
  });
}

// mountAdventureMap drops a Leaflet preview showing every puzzle
// pin. Gated puzzles get the accent fill (matches the run-detail
// legend); regular puzzles get a hollow ring. Auto-fits bounds
// when there's at least one location, falls back to Stockholm
// otherwise so the map never lands on the ocean.
function mountAdventureMap(host, pages, colors) {
  if (typeof L === 'undefined') {
    host.replaceChildren(h('div', { class: 'empty' },
      t('Map library is still loading — refresh the page.')));
    return;
  }
  const map = L.map(host, { scrollWheelZoom: false }).setView([59.3293, 18.0686], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 19,
  }).addTo(map);
  const accent = (colors && colors.accent) ||
    getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() ||
    '#ad1357';
  const pts = [];
  pages.forEach((p, i) => {
    if (!p.location) return;
    if (!p.location.lat && !p.location.lng) return;
    const m = L.circleMarker([p.location.lat, p.location.lng], {
      radius: 9,
      color: accent,
      weight: 2,
      fillColor: p.gated ? accent : 'transparent',
      fillOpacity: p.gated ? 1 : 0,
    });
    m.bindTooltip(`${i + 1}. ` + (p.title || t('(untitled)')));
    m.addTo(map);
    pts.push([p.location.lat, p.location.lng]);
  });
  if (pts.length > 0) {
    map.fitBounds(L.latLngBounds(pts), { padding: [24, 24] });
  }
}

async function scheduleRun(source) {
  // `source` is either a number (assignment id — the Catalog purchase flow)
  // or an object with `{ slug }` — an admin-commissioned share or the
  // org's own-authored adventure, both of which skip the assignment and
  // run free.
  const baseReq = typeof source === 'number'
    ? { assignment_id: source }
    : { adventure_slug: source.slug };
  const body = await modal(t('New event'), ({ body, close }) => {
    const name = h('input', { placeholder: t('e.g. “Saturday Andersson party”') });
    // A newly created run stays scheduled until the arranger explicitly
    // hits Start on the event page — auto-starting on create robbed the
    // arranger of the chance to add teams and share links first.
    const modeManual = h('input', { type: 'radio', name: 'mode', value: 'manual', checked: true });
    const modeLater = h('input', { type: 'radio', name: 'mode', value: 'later' });
    const when = h('input', { type: 'datetime-local', disabled: '' });
    const refresh = () => { when.disabled = !modeLater.checked; };
    modeManual.addEventListener('change', refresh);
    modeLater.addEventListener('change', refresh);

    const attest = h('input', { type: 'checkbox', required: true });
    const attestErr = h('p', { class: 'err',
      style: 'display:none; font-size:.85rem; margin:.15rem 0 .5rem 1.6rem' },
      t('Please confirm the player-age statement to continue.'));
    const form = h('form', {},
      h('label', { class: 'field' }, h('span', {}, t('Name (optional)')), name),
      h('label', { style: 'display:flex; gap:.5rem; align-items:center; margin:.5rem 0' },
        modeManual, h('span', {}, t('Start manually — I\'ll hit Start when we\'re ready'))),
      h('label', { style: 'display:flex; gap:.5rem; align-items:center; margin:.5rem 0' },
        modeLater, h('span', {}, t('Schedule for later'))),
      h('label', { class: 'field' }, h('span', {}, t('Auto-start at')), when),
      h('label', { style: 'display:flex; gap:.5rem; align-items:flex-start; margin:1rem 0 .25rem; font-size:.9rem' },
        attest,
        h('span', {}, t('I confirm no participants under 13 will play this adventure, or I have parental consent for any who will.'))),
      // Inline error replaces the easy-to-miss toast — sits right
      // under the checkbox so the user's eye lands on it on the next
      // submit attempt.
      attestErr,
      h('div', { class: 'row end' },
        h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, t('Cancel')),
        h('button', { class: 'btn primary', type: 'submit' }, t('Create event'))),
    );
    attest.addEventListener('change', () => {
      if (attest.checked) attestErr.style.display = 'none';
    });
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!attest.checked) {
        attestErr.style.display = '';
        attest.focus();
        return;
      }
      const req = { ...baseReq, name: name.value.trim(), attest_no_minors: true };
      if (modeLater.checked) {
        if (!when.value) { toastErr(t('Pick an auto-start time')); return; }
        const d = new Date(when.value);
        if (Number.isNaN(d.getTime())) { toastErr(t('Bad date')); return; }
        req.scheduled_at = d.toISOString();
      }
      close({ req });
    });
    body.append(form);
  });
  if (!body) return;
  const r = await api('/api/admin/events', { method: 'POST', body: JSON.stringify(body.req) });
  if (r.status !== 201) { toastErr(r.body?.error || t('error {{status}}', { status: r.status })); return; }
  const runID = r.body.id;
  toastOk(t('Event ready'));
  nav('#events/' + runID);
}

// openNewEventWizard walks the arranger through every decision needed
// to get from "I want to host" to "here's the event with teams ready".
// Events inline (no checkout-page jump) by calling the purchase +
// confirm endpoints directly from the submit handler. The simulated
// checkout page still exists for the standalone "Buy player slots"
// flow on the Adventures catalog, but the wizard bypasses it.
async function openNewEventWizard() {
  const [advR, assignR] = await Promise.all([
    api('/api/admin/adventures'),
    api('/api/admin/assignments'),
  ]);
  const advs = advR.body?.adventures || [];
  if (advs.length === 0) {
    toastErr(t('Create or browse an adventure first')); return;
  }
  const assignments = (assignR.body?.assignments || []).filter((a) => !a.event_id);

  await modal(t('Start a new event'), ({ body, close }) => {
    // ---- 1. Adventure picker ----
    const advPick = h('div', { class: 'chip-grid', style: 'max-height:240px' });
    let pickedAdv = advs[0];
    const advChip = (a) => {
      const chip = h('div', {
        class: 'chip selectable' + (a.slug === pickedAdv.slug ? ' selected' : ''),
        style: 'display:flex; flex-direction:column; gap:.1rem; min-width:160px',
      },
        h('strong', {}, a.title),
        h('span', { class: 'muted', style: 'font-size:.75rem' },
          a.mine_to_edit ? t('yours') : t('catalog')));
      chip.addEventListener('click', () => {
        pickedAdv = a;
        for (const c of advPick.children) c.classList.remove('selected');
        chip.classList.add('selected');
        refreshAssignment();
        refreshCapWarn();
      });
      return chip;
    };
    advs.forEach((a) => advPick.append(advChip(a)));

    // ---- 2. Capacity: reuse existing assignment or buy ----
    const buyCount = h('input', { type: 'number', min: '1', max: '500', value: '30' });
    const capacitySection = h('div', {});
    const { PRICE_CENTS, FREE, fmtMoney, chargeable } = pricingHelpers();
    const refreshAssignment = () => {
      capacitySection.replaceChildren();
      const matching = assignments.filter((x) => x.adventure_slug === pickedAdv.slug);
      if (matching.length > 0) {
        capacitySection.append(
          h('p', { class: 'muted' }, t('You have an unused assignment for this adventure — no new purchase needed.')),
          h('p', {}, h('strong', {}, matching[0].max_players === 1
            ? t('{{n}} player slot', { n: matching[0].max_players })
            : t('{{n}} player slots', { n: matching[0].max_players }))));
      } else {
        const total = () => fmtMoney(chargeable(parseInt(buyCount.value, 10) || 0));
        const totalEl = h('strong', {}, total());
        buyCount.addEventListener('input', () => { totalEl.textContent = total(); });
        capacitySection.append(
          h('p', { class: 'muted' },
            t('How many players will join? (first {{n}} free, then {{price}} per player.)',
              { n: FREE, price: fmtMoney(PRICE_CENTS) })),
          h('div', { class: 'row', style: 'gap:.5rem; align-items:center' },
            h('label', { class: 'field', style: 'flex:0 0 auto; margin:0' },
              h('span', {}, t('Players')), buyCount),
            h('p', { style: 'margin:0' }, t('Total: '), totalEl)));
      }
    };
    refreshAssignment();

    // ---- 3. When ----
    // The default is manual start: the wizard leaves the event in
    // scheduled state so the arranger can share links and add teams
    // before tapping Start on the event page.
    const modeManual = h('input', { type: 'radio', name: 'ev-mode', value: 'manual', checked: true });
    const modeLater  = h('input', { type: 'radio', name: 'ev-mode', value: 'later' });
    const whenInput  = h('input', { type: 'datetime-local', disabled: '' });
    const toggleWhen = () => { whenInput.disabled = !modeLater.checked; };
    modeManual.addEventListener('change', toggleWhen);
    modeLater.addEventListener('change', toggleWhen);
    // datetime-local has no timezone selector, so a Stockholm arranger
    // typing "14:00" can't tell if the server stores it as 14:00 local
    // or 14:00 UTC. Make the user's resolved zone explicit so DST and
    // remote-server clocks aren't a guessing game.
    const localTZ = (() => {
      try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; }
      catch { return ''; }
    })();
    const tzHint = h('small', { class: 'muted', style: 'display:block; margin-top:.2rem' },
      localTZ ? t('Times are interpreted as your local timezone ({{tz}}).', { tz: localTZ })
              : t('Times are interpreted as your local timezone.'));
    // Inline error for the auto-start time. Shown when the arranger
    // submits with "Schedule for later" selected but no time picked,
    // and on input as a self-clearing affordance.
    const whenErr = h('p', { class: 'err',
      style: 'display:none; margin:.15rem 0 0; font-size:.8rem' },
      t('Pick an auto-start time, or switch back to Start manually.'));
    whenInput.addEventListener('input', () => {
      if (whenInput.value) whenErr.style.display = 'none';
    });
    modeManual.addEventListener('change', () => { whenErr.style.display = 'none'; });

    const nameInput = h('input', { placeholder: t('e.g. “Saturday Andersson party”') });

    // ---- 4. Teams ----
    const teamCount = h('input', { type: 'number', min: '0', max: '50', value: '0' });
    const playerCount = h('input', { type: 'number', min: '1', max: '20', value: '3' });
    const teamPrefix   = h('input', { value: 'Team' });
    const playerPrefix = h('input', { value: 'Player' });
    // Pre-flight: warn when the requested team count exceeds the
    // capacity available — saves a server 4xx after the user spent
    // a step on the team-prefix details. Auto-clears when the user
    // either drops the count or picks an adventure with more slots.
    const capWarn = h('p', { class: 'err', style: 'display:none; font-size:.85rem; margin:.25rem 0 0' });
    const refreshCapWarn = () => {
      // Capacity is metered in player slots. Compare requested
      // total players (teamCount × playerCount) against the
      // assignment cap (max_players) — either the existing
      // assignment's cap, or buyCount when a fresh purchase is
      // about to be minted.
      const reqTeams   = Math.max(0, parseInt(teamCount.value, 10) || 0);
      const reqPlayers = reqTeams * Math.max(1, parseInt(playerCount.value, 10) || 0);
      const matching = assignments.filter((x) => x.adventure_slug === pickedAdv.slug);
      const cap = matching.length > 0
        ? matching[0].max_players
        : Math.max(0, parseInt(buyCount.value, 10) || 0);
      if (reqPlayers > cap) {
        capWarn.textContent = t('You picked {{players}} players but only {{cap}} slots are available. Lower the team count or buy more slots.',
          { players: reqPlayers, cap });
        capWarn.style.display = '';
      } else {
        capWarn.style.display = 'none';
      }
    };
    teamCount.addEventListener('input', refreshCapWarn);
    playerCount.addEventListener('input', refreshCapWarn);
    buyCount.addEventListener('input', refreshCapWarn);

    const submitBtn = h('button', { class: 'btn primary', type: 'submit' }, t('Create event'));
    const attestWiz = h('input', { type: 'checkbox', required: true });
    const attestWizErr = h('p', { class: 'err',
      style: 'display:none; font-size:.85rem; margin:.15rem 0 .5rem 1.6rem' },
      t('Please confirm the player-age statement to continue.'));
    const form = h('form', {},
      h('h3', { style: 'margin-top:0' }, t('Adventure')),
      advPick,
      h('h3', {}, t('Capacity')),
      capacitySection,
      h('h3', {}, t('When')),
      h('label', { style: 'display:flex; gap:.5rem; align-items:center; margin:.25rem 0' },
        modeManual, h('span', {}, t('Start manually — I\'ll hit Start when we\'re ready'))),
      h('label', { style: 'display:flex; gap:.5rem; align-items:center; margin:.25rem 0' },
        modeLater, h('span', {}, t('Schedule for later'))),
      h('label', { class: 'field' }, h('span', {}, t('Auto-start at')), whenInput, tzHint),
      whenErr,
      h('label', { class: 'field' }, h('span', {}, t('Event name (optional)')), nameInput),
      h('h3', {}, t('Teams (optional — add later if you prefer)')),
      h('div', { class: 'grid cols-2' },
        h('label', { class: 'field' }, h('span', {}, t('Number of teams')), teamCount),
        h('label', { class: 'field' }, h('span', {}, t('Players per team')), playerCount)),
      h('div', { class: 'grid cols-2' },
        h('label', { class: 'field' }, h('span', {}, t('Team name prefix')), teamPrefix),
        h('label', { class: 'field' }, h('span', {}, t('Player name prefix')), playerPrefix)),
      capWarn,
      h('h3', {}, t('Player ages')),
      h('label', { style: 'display:flex; gap:.5rem; align-items:flex-start; margin:.25rem 0; font-size:.9rem' },
        attestWiz,
        h('span', {}, t('I confirm no participants under 13 will play this adventure, or I have parental consent for any who will.'))),
      attestWizErr,
      h('div', { class: 'row end', style: 'margin-top:1rem' },
        h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, t('Cancel')),
        submitBtn));

    attestWiz.addEventListener('change', () => {
      if (attestWiz.checked) attestWizErr.style.display = 'none';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!attestWiz.checked) {
        attestWizErr.style.display = '';
        attestWiz.focus();
        return;
      }
      // Re-run the capacity check at submit time too — covers the
      // "user fixed the field then bumped it back up before clicking
      // Create" path that an input-listener-only check would miss.
      refreshCapWarn();
      if (capWarn.style.display !== 'none') {
        toastErr(capWarn.textContent);
        return;
      }
      submitBtn.disabled = true;
      try {
        // Resolve or mint an assignment.
        let assignmentID = null;
        const matching = assignments.filter((x) => x.adventure_slug === pickedAdv.slug);
        if (matching.length > 0) {
          assignmentID = matching[0].id;
        } else {
          const n = Math.max(1, parseInt(buyCount.value, 10) || 0);
          const pr = await api('/api/admin/purchases', {
            method: 'POST',
            body: JSON.stringify({ adventure_slug: pickedAdv.slug, max_players: n }),
          });
          if (pr.status !== 201) { toastErr(pr.body?.error || t('Purchase failed')); return; }
          // Free buys come back already paid with assignment_id;
          // skip the confirm round-trip entirely. Paid buys via
          // the simulated provider still need /confirm.
          if (pr.body.state === 'paid' && pr.body.assignment_id) {
            assignmentID = pr.body.assignment_id;
          } else {
            const cr = await api('/api/admin/purchases/' + pr.body.id + '/confirm', { method: 'POST' });
            if (cr.status !== 200) { toastErr(cr.body?.error || t('Payment failed')); return; }
            assignmentID = cr.body.assignment_id;
          }
        }
        // Create the event.
        const runReq = { assignment_id: assignmentID, name: nameInput.value.trim(), attest_no_minors: true };
        if (modeLater.checked) {
          if (!whenInput.value) {
            whenErr.style.display = '';
            whenInput.focus();
            return;
          }
          runReq.scheduled_at = new Date(whenInput.value).toISOString();
        }
        const rr = await api('/api/admin/events', { method: 'POST', body: JSON.stringify(runReq) });
        if (rr.status !== 201) { toastErr(rr.body?.error || t('Event creation failed')); return; }
        const runID = rr.body.id;
        // Bulk teams.
        const T = Math.max(0, parseInt(teamCount.value, 10) || 0);
        const P = Math.max(1, parseInt(playerCount.value, 10) || 0);
        const tp = teamPrefix.value.trim() || 'Team';
        const pp = playerPrefix.value.trim() || 'Player';
        for (let i = 1; i <= T; i++) {
          const members = Array.from({ length: P }, (_, j) => `${pp} ${j + 1}`);
          await api(`/api/admin/events/${runID}/teams`, {
            method: 'POST',
            body: JSON.stringify({ name: `${tp} ${i}`, member_names: members }),
          });
        }
        toastOk(t('Event ready'));
        close(true);
        nav('#events/' + runID);
      } finally {
        submitBtn.disabled = false;
      }
    });
    body.append(form);
  }, { wide: true });
}

// runLabel renders an event's display name — the human-set name if any,
// otherwise "Event #id". Used everywhere an event identifier is shown.
function runLabel(event) {
  if (!event) return '';
  return event.name ? event.name : 'Event #' + event.id;
}

async function openRenameEvent(event) {
  await modal(t('Rename event'), ({ body, close }) => {
    const input = h('input', { value: event.name || '', autofocus: true, placeholder: t('Event name') });
    const form = h('form', {},
      h('label', { class: 'field' }, h('span', {}, t('Event name')), input),
      h('p', { class: 'muted', style: 'font-size:.85rem' },
        t('Empty resets to "Event #{{id}}".', { id: event.id })),
      h('div', { class: 'row end' },
        h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, t('Cancel')),
        h('button', { class: 'btn primary', type: 'submit' }, t('Save'))));
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const r = await api(`/api/admin/events/${event.id}`, {
        method: 'PATCH', body: JSON.stringify({ name: input.value.trim() }),
      });
      if (r.status === 204) { toastOk(t('Renamed')); close(true); renderRoute(); }
      else toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
    });
    body.append(form);
  });
}

/* ========== Events ========== */

    h('div', { class: 'row between', style: 'margin-bottom:1rem' },

      h('button', { class: 'btn primary', on: { click: () => openNewEventWizard() } },

}

function runsTable(rs) {
  if (rs.length === 0) return h('div', { class: 'empty' },
    h('p', {}, t('No events yet.')),
    h('p', { class: 'muted', style: 'margin-top:.5rem' },
      t('Pick an adventure to schedule your first event — you can add teams and share player links once it\'s created.')),
    h('div', { style: 'margin-top:.75rem' },
      h('button', { class: 'btn primary', on: { click: () => nav('#adventures') } },
        icon(ICONS.map), t('Pick an adventure'))));
  return h('table', { class: 'table' },
    h('thead', {}, h('tr', {},
      // Cover column has no header text — the icon itself identifies
      // the adventure. Width-pinned so the column doesn't shift as
      // the cover loads or falls back to initials.
      h('th', { style: 'width:48px' }, ''),
      h('th', {}, t('Event')),
      h('th', { class: 'hide-narrow' }, t('Adventure')),
      h('th', {}, t('State')),
      h('th', { class: 'hide-narrow' }, t('Scheduled')),
      h('th', { class: 'hide-narrow' }, t('Started')))),
    h('tbody', {}, rs.map((r) =>
      h('tr', { style: 'cursor:pointer', on: { click: () => nav('#events/' + r.id) } },
        h('td', { style: 'width:48px' }, adventureCover({
          title:      r.adventure_title || r.adventure_slug,
          avatar_url: r.adventure_avatar_url,
        }, 32)),
        h('td', {}, h('strong', {}, runLabel(r))),
        // Adventure column shows the human title with the slug as a
        // small muted second line — readable at a glance, still
        // unambiguous for the operator who only knows the slug.
        h('td', { class: 'hide-narrow' },
          r.adventure_title
            ? h('div', {},
                r.adventure_title,
                h('div', { class: 'muted mono', style: 'font-size:.75rem' }, r.adventure_slug))
            : h('span', { class: 'muted mono' }, r.adventure_slug)),
        h('td', {}, h('span', { class: 'pill ' + pillClassForState(r.state) }, stateGlyph(r.state) + t(r.state || ''))),
        h('td', { class: 'hide-narrow' }, fmtLocal(r.scheduled_at)),
        h('td', { class: 'hide-narrow' }, fmtLocal(r.started_at)),
      ))),
  );
}

function pillClassForState(s) {
  switch (s) {
    case 'running': return 'success';
    case 'scheduled': return 'accent';
    case 'paused': return 'warning';
    case 'completed': return 'success';
    case 'cancelled': return 'danger';
    default: return '';
  }
}

// stateGlyph returns a unicode prefix for a state pill so colourblind
// users have a non-colour cue. Returned with a trailing space so the
// callsite can concatenate unconditionally; unmapped states fall
// through to '' (no glyph, label-only pill).
const STATE_GLYPHS = {
  running:   '▶',
  scheduled: '⏰',
  paused:    '⏸',
  completed: '✓',
  cancelled: '✕',
  paid:      '✓',
  pending:   '↻',
  refunded:  '↩',
};
function stateGlyph(s) {
  return STATE_GLYPHS[s] ? STATE_GLYPHS[s] + ' ' : '';
}

// canDo mirrors the server-side eventstate matrix: the event payload
// carries allowed_ops, and the UI hides/disables affordances the
// server would 409. The server is still the source of truth — this
// just spares the user a round-trip on cosmetic buttons.
function canDo(event, op) {
  if (!event || !Array.isArray(event.allowed_ops)) return true;
  return event.allowed_ops.includes(op);
}

const TEAM_COLORS = ['#e24080', '#429a3f', '#2563eb', '#f59e0b', '#7c3aed', '#0891b2', '#be185d', '#16a34a'];
function teamColor(teamID, i) { return TEAM_COLORS[i % TEAM_COLORS.length]; }

// teamInitials returns up to two letters from the team name — the
// fallback content for the generated avatar when no upload exists.
function teamInitials(name) {
  const parts = (name || '').trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return '?';
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

// teamAvatar renders a circular avatar node for a team. Uses the
// uploaded picture when present, otherwise falls back to initials on
// the team's colour swatch. Size is px; callers pass 24/28/40
// depending on surface.
//
// team: { id, name, avatar_url? }
// colour: hex string (team's colour from teamColor)
function teamAvatar(team, colour, size) {
  const px = size || 28;
  const wrap = h('span', {
    class: 'team-avatar',
    style: `display:inline-flex; align-items:center; justify-content:center; width:${px}px; height:${px}px; border-radius:50%; overflow:hidden; background:${colour}; color:#fff; font-weight:700; font-size:${Math.max(10, Math.round(px * 0.42))}px; flex:0 0 ${px}px; border:2px solid ${colour}; box-shadow:0 0 0 1px rgba(0,0,0,.08);`,
    'aria-label': team?.name || '',
  });
  if (team?.avatar_url) {
    const img = document.createElement('img');
    img.src = team.avatar_url;
    img.alt = team.name || '';
    img.style.cssText = 'width:100%; height:100%; object-fit:cover; display:block;';
    // If the picture fails to load for any reason, fall back to the
    // initials so the surface never shows a broken image.
    img.onerror = () => {
      img.remove();
      wrap.textContent = teamInitials(team.name);
    };
    wrap.append(img);
  } else {
    wrap.textContent = teamInitials(team?.name);
  }
  return wrap;
}

// orgIcon renders the organisation's brand mark as a small inline
// element — uploaded logo when available (transparent, no fill, so
// the surrounding row colour shows through any alpha), otherwise a
// muted tile with the org's initial. Used in admin tables and
// anywhere else an org appears in a list — kept compact so it fits
// in a table row without forcing the line height up.
function orgIcon(org, size) {
  const px = size || 24;
  const radius = Math.max(4, Math.round(px * 0.2));
  if (org && org.has_logo) {
    return h('img', {
      src: '/org-logo/' + org.id,
      alt: '',
      'aria-hidden': 'true',
      style: `width:${px}px; height:${px}px; border-radius:${radius}px; object-fit:contain; flex:0 0 auto`,
    });
  }
  const letter = ((org && org.name) || '?').trim().charAt(0).toUpperCase() || '?';
  return h('span', {
    style: `width:${px}px; height:${px}px; border-radius:${radius}px; display:inline-grid; place-items:center; background:var(--surface-2); color:var(--muted); font-weight:700; font-size:${Math.max(10, Math.round(px * 0.5))}px; flex:0 0 auto`,
    'aria-hidden': 'true',
  }, letter);
}

// adventureInitials pulls up to two upper-case letters from the title
// for the default cover-art tile.
function adventureInitials(title) {
  const parts = (title || '').trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return '?';
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

// adventureCover renders the adventure's cover image — rounded square
// (reserved shape for adventures; teams use circles). Uses the
// uploaded picture when present, otherwise initials on the accent
// colour. `size` is px; `adv` needs `title` + optional `avatar_url` +
// optional `accent_color`.
function adventureCover(adv, size) {
  const px = size || 48;
  const colour = adv?.accent_color || 'var(--accent)';
  const fg = '#fff';
  const radius = Math.max(6, Math.round(px * 0.18));
  // When an avatar is present we skip the accent-tinted background
  // and the rim chrome (border + shadow) so transparent areas of the
  // uploaded logo read against the surrounding surface — the user
  // expectation is "the logo is the icon", not "the logo is on a
  // brand-coloured tile". The initials fallback still gets the
  // accent fill because a one-letter glyph alone needs the contrast.
  const hasAvatar = !!adv?.avatar_url;
  const tileChrome = hasAvatar
    ? 'background:transparent; color:inherit;'
    : `background:${colour}; color:${fg}; border:1px solid rgba(0,0,0,.08); box-shadow:0 1px 3px rgba(0,0,0,.12);`;
  const wrap = h('span', {
    class: 'adv-cover',
    style: `display:inline-flex; align-items:center; justify-content:center; width:${px}px; height:${px}px; border-radius:${radius}px; overflow:hidden; ${tileChrome} font-weight:800; font-size:${Math.max(11, Math.round(px * 0.34))}px; flex:0 0 ${px}px; letter-spacing:.04em; text-transform:uppercase;`,
    'aria-label': adv?.title || '',
  });
  if (hasAvatar) {
    const img = document.createElement('img');
    img.src = adv.avatar_url;
    img.alt = adv.title || '';
    // contain (not cover) preserves the whole logo even on non-square
    // marks; transparency now matters, so cropping a logo to fill the
    // tile would amputate part of the brand the user uploaded.
    img.style.cssText = 'width:100%; height:100%; object-fit:contain; display:block;';
    img.onerror = () => {
      img.remove();
      // Fallback to initials → repaint the tile chrome so the letter
      // lands on the accent fill it needs for contrast.
      wrap.style.background = colour;
      wrap.style.color = fg;
      wrap.style.border = '1px solid rgba(0,0,0,.08)';
      wrap.style.boxShadow = '0 1px 3px rgba(0,0,0,.12)';
      wrap.textContent = adventureInitials(adv.title);
    };
    wrap.append(img);
  } else {
    wrap.textContent = adventureInitials(adv?.title);
  }
  return wrap;
}

// renderTeamLinksPanel is the "distribute magic links" surface sitting
// at the top of the event page. An arranger with 100 teams needs to copy
// captain URLs in bulk (paste into a spreadsheet or email merge) and
// occasionally reach one team's per-player URLs inline. Virtualisation
// isn't worth it at the scale we've seen (~100 teams × ~5 members =
// 500 rows); a fixed-height scroller with client-side search keeps the
// rest of the event page usable.
function renderTeamLinksPanel(run, teams) {
  if (!teams || teams.length === 0) return null;
  const origin = location.origin;
  const teamURL    = (tm) => `${origin}/team/${encodeURIComponent(tm.token || '')}`;
  const memberURL  = (m)  => `${origin}/play?t=${encodeURIComponent(m.token || '')}`;
  const csvEscape  = (c) => /[",\n]/.test(c) ? `"${String(c).replace(/"/g, '""')}"` : String(c);

  const search = h('input', {
    type: 'search',
    placeholder: t('Filter {{n}} teams…', { n: teams.length }),
    style: 'flex:1; margin:0; min-width:10rem',
  });
  const copyCaptainsBtn = h('button', { class: 'btn small', type: 'button' },
    icon(ICONS.copy), t('Copy captain links'));
  copyCaptainsBtn.addEventListener('click', async () => {
    const txt = teams.map((tm) => `${tm.name}\t${teamURL(tm)}`).join('\n');
    try { await navigator.clipboard.writeText(txt); toastOk(t('Copied {{n}} captain links', { n: teams.length })); }
    catch { toastErr(t('Clipboard blocked — select and copy by hand')); }
  });
  const copyCSVBtn = h('button', { class: 'btn small', type: 'button' },
    icon(ICONS.copy), t('Copy all (CSV)'));
  copyCSVBtn.addEventListener('click', async () => {
    const rows = [['team', 'member', 'url']];
    for (const tm of teams) {
      rows.push([tm.name, '(captain)', teamURL(tm)]);
      for (const m of (tm.members || [])) rows.push([tm.name, m.name || '', memberURL(m)]);
    }
    const csv = rows.map((r) => r.map(csvEscape).join(',')).join('\n');
    try {
      await navigator.clipboard.writeText(csv);
      toastOk(t('Copied {{n}} rows', { n: rows.length - 1 }));
      return;
    } catch { /* fall through to download */ }
    // Mobile Safari and locked-down enterprise browsers refuse the
    // async clipboard write. Trigger a download as a CSV file so the
    // arranger isn't stuck — they can re-share it via whatever
    // sharing surface the OS gives them next.
    try {
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'team-links.csv';
      document.body.append(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      toastOk(t('Downloaded team-links.csv — open it in your sharing app.'));
    } catch {
      toastErr(t('Clipboard blocked — select and copy by hand'));
    }
  });

  const scroll = h('div', { class: 'tl-scroll' });
  const rowNodes = teams.map((tm, i) => buildTeamLinkRow(tm, i, teamURL, memberURL));
  scroll.append(...rowNodes);

  search.addEventListener('input', () => {
    const q = search.value.trim().toLowerCase();
    rowNodes.forEach((row, i) => {
      if (!q) { row.style.display = ''; return; }
      const hit = teams[i].name.toLowerCase().includes(q)
        || (teams[i].members || []).some((m) => (m.name || '').toLowerCase().includes(q));
      row.style.display = hit ? '' : 'none';
    });
  });

  const body = h('div', { style: 'margin-top:.75rem' },
    h('div', { class: 'row', style: 'gap:.5rem; align-items:center; flex-wrap:wrap; margin-bottom:.5rem' },
      search, copyCaptainsBtn, copyCSVBtn),
    h('p', { class: 'muted', style: 'font-size:.78rem; margin:0 0 .55rem' },
      t('Links expire after a fixed window — anyone with the URL can play as that player. Use the per-team rotate-token action if a link leaks; existing players keep playing until they sign out.')),
    scroll);

  const summary = h('summary', {
    style: 'cursor:pointer; list-style:none; display:flex; align-items:center; gap:.6rem',
  },
    h('span', { style: 'font-size:.7rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)' },
      t('Distribute links')),
    h('span', { class: 'muted', style: 'font-size:.85rem' },
      t('{{n}} teams — captain + per-player links', { n: teams.length })),
  );
  // Open by default for small rosters where the panel doesn't dominate
  // the viewport; collapsed past that so the rest of the event page is
  // visible without scrolling. Once the arranger has toggled it, the
  // chosen state sticks across WS-triggered re-renders via arrangeUIState.
  const stored = arrangeUIState.teamLinksPanelOpen.get(run.id);
  const openByDefault = stored ?? (teams.length <= 6);
  const panel = h('details', {
    class: 'card share-bar team-links',
    style: 'padding:.85rem 1rem',
    open: openByDefault ? true : null,
  }, summary, body);
  panel.addEventListener('toggle', () => {
    arrangeUIState.teamLinksPanelOpen.set(run.id, panel.open);
  });
  return panel;
}

function buildTeamLinkRow(tm, i, teamURL, memberURL) {
  const url = teamURL(tm);
  const urlInput = h('input', {
    readonly: '', value: url,
    class: 'tl-url',
    on: { click: (e) => e.target.select() },
  });
  const copyBtn = iconBtn('copy', t('Copy captain link'), async () => {
    try { await navigator.clipboard.writeText(url); toastOk(t('Link copied')); }
    catch { urlInput.select(); document.execCommand('copy'); toastOk(t('Link copied')); }
  });
  const members = tm.members || [];
  // Persist per-team expansion across WS re-renders. Default collapsed;
  // membership in arrangeUIState.teamLinkRowOpen flips it open.
  const rowOpen = arrangeUIState.teamLinkRowOpen.has(tm.id);
  const memBody = h('div', { class: 'tl-members', style: rowOpen ? '' : 'display:none' },
    members.map((m) => {
      const murl = memberURL(m);
      const minput = h('input', {
        readonly: '', value: murl,
        class: 'tl-url tl-url-sm',
        on: { click: (e) => e.target.select() },
      });
      const mcopy = iconBtn('copy', t('Copy link'), async () => {
        try { await navigator.clipboard.writeText(murl); toastOk(t('Link copied')); }
        catch { minput.select(); document.execCommand('copy'); toastOk(t('Link copied')); }
      });
      // Magic-link expiry hint. Red "expired" when past, muted
      // "expires in Nd" otherwise. Hidden (no badge) when the slot
      // has no expiry — that's the legacy "never expires" case for
      // pre-migration rows.
      const expiry = renderSlotExpiryHint(m.expires_at, m.last_login_at);
      return h('div', {
        class: 'tl-member-row',
        title: m.last_login_at ? t('Last opened {{when}}', { when: formatAuditTS(m.last_login_at) }) : '',
      },
        h('span', { class: 'muted tl-member-name' }, m.name || t('(unnamed)')),
        expiry, minput, mcopy);
    }));
  const caretGlyph = h('span', { class: 'tl-caret' }, rowOpen ? '▾' : '▸');
  const toggle = h('button', {
    type: 'button',
    class: 'btn small ghost tl-toggle',
    title: members.length === 1
      ? t('Show 1 player link')
      : t('Show {{n}} player links', { n: members.length }),
  }, h('span', {}, members.length), caretGlyph);
  toggle.addEventListener('click', () => {
    const open = memBody.style.display === 'none';
    memBody.style.display = open ? '' : 'none';
    caretGlyph.textContent = open ? '▾' : '▸';
    if (open) arrangeUIState.teamLinkRowOpen.add(tm.id);
    else arrangeUIState.teamLinkRowOpen.delete(tm.id);
  });
  const sw = h('span', {
    class: 'sw tl-sw',
    style: `background:${teamColor(tm.id, i)}`,
  });
  return h('div', { class: 'tl-row' },
    h('div', { class: 'tl-head' },
      sw,
      h('span', { class: 'tl-team' }, tm.name),
      urlInput, copyBtn, toggle),
    memBody);
}

// Public share bar: shows the absolute /live/{token} URL (opaque) so the
// arranger can read/copy it and send it to whoever's running the TV
// screen.
function renderShareBar(event) {
  const url = `${location.origin}/live/${event.live_token}`;
  const urlBox = h('input', {
    readonly: '', value: url,
    style: 'flex:1; min-width:0; background:var(--surface-2); font-family:ui-monospace,SFMono-Regular,monospace; font-size:.9rem; box-shadow:none; border-color:var(--border-soft)',
    on: { click: (e) => e.target.select() },
  });
  const copyBtn = h('button', {
    class: 'btn small', type: 'button', title: t('Copy link'),
    on: { click: async () => {
      try {
        await navigator.clipboard.writeText(url);
        toastOk(t('Link copied'));
      } catch {
        urlBox.select();
        document.execCommand('copy');
        toastOk(t('Link copied'));
      }
    } },
  }, t('Copy'));
  const openBtn = h('a', {
    href: url, target: '_blank', rel: 'noopener', class: 'btn small primary',
  }, t('Open ↗'));

  // Real-time map toggle — arrangers can enable/disable the audience map
  // at any time (default off: revealing team positions is effectively
  // cheating for most puzzle types).
  const mapToggle = h('input', { type: 'checkbox' });
  if (event.show_map) mapToggle.checked = true;
  mapToggle.addEventListener('change', async () => {
    const r = await api(`/api/admin/events/${event.id}`, {
      method: 'PATCH',
      body: JSON.stringify({ show_map: mapToggle.checked }),
    });
    if (r.status === 204) {
      toastOk(mapToggle.checked ? t('Map enabled on live view') : t('Map hidden'));
    } else {
      mapToggle.checked = !mapToggle.checked;
      toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
    }
  });
  const mapLabel = h('label', {
    style: 'display:inline-flex; align-items:center; gap:.35rem; cursor:pointer; font-size:.85rem; color:var(--muted)',
  }, mapToggle, t('Show real-time map'));

  // Collapsed by default: the share URL and map toggle are only needed
  // once per run (at setup), so they're tucked behind a <details> to
  // cut visual noise on the main run dashboard.
  const body = h('div', { style: 'margin-top:.75rem' },
    h('div', { class: 'row', style: 'gap:.75rem; align-items:center; flex-wrap:wrap' },
      urlBox,
      copyBtn,
      openBtn,
    ),
    h('div', { style: 'margin-top:.5rem' }, mapLabel),
  );
  const summary = h('summary', {
    style: 'cursor:pointer; list-style:none; display:flex; align-items:center; gap:.6rem',
  },
    h('span', { style: 'font-size:.7rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)' }, t('Live view')),
    h('span', { class: 'muted', style: 'font-size:.85rem' }, t('Open the link on any screen — no login needed.')),
  );
  return h('details', { class: 'card share-bar', style: 'padding:.85rem 1rem' },
    summary, body,
  );
}

// renderEventAdventureStrip is the compact adventure summary that
// sits below the lifecycle bar on the event-detail view: cover +
// title + puzzle count + a "View adventure →" link to the read-only
// detail page (where the full prompt list, hints, and map preview
// live). Replaces the earlier muted-slug-only line which named the
// adventure but conveyed nothing else.
function renderEventAdventureStrip(adventure, event) {
  if (!adventure) {
    // Fallback when /api/admin/adventures/{slug} is unreachable —
    // surface what we can from event so the strip doesn't blank.
    return h('div', { class: 'event-adv-strip muted mono' }, event.adventure_slug);
  }
  return h('div', { class: 'event-adv-strip' },
    adventureCover(adventure, 40),
    h('div', { class: 'event-adv-meta' },
      h('div', { class: 'event-adv-title' }, adventure.title || event.adventure_slug),
      h('div', { class: 'muted', style: 'font-size:.8rem' },
        t('{{n}} puzzles', { n: adventure.page_count || (adventure.pages || []).length }),
        adventure.author ? ' · ' + adventure.author : '',
        adventure.language ? ' · ' : null,
        adventure.language
          ? h('span', { style: 'letter-spacing:.04em' },
              zvI18n.flagFor(adventure.language) ? zvI18n.flagFor(adventure.language) + ' ' : '',
              h('span', { style: 'text-transform:uppercase' }, adventure.language))
