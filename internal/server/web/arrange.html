function pillClassForState(s) {
  switch (s) {
    case 'running': return 'success';
    case 'scheduled': return 'accent';
    case 'paused': return 'warning';
    case 'completed': return 'success';
    default: return '';
  }
}

const TEAM_COLORS = ['#e24080', '#429a3f', '#2563eb', '#f59e0b', '#7c3aed', '#0891b2', '#be185d', '#16a34a'];
function teamColor(teamID, i) { return TEAM_COLORS[i % TEAM_COLORS.length]; }

// teamInitials returns up to two letters from the team name — the
// fallback content for the generated avatar when no upload exists.
function teamInitials(name) {
  const parts = (name || '').trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return '?';
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

// teamAvatar renders a circular avatar node for a team. Uses the
// uploaded picture when present, otherwise falls back to initials on
// the team's colour swatch. Size is px; callers pass 24/28/40
// depending on surface.
//
// team: { id, name, avatar_url? }
// colour: hex string (team's colour from teamColor)
function teamAvatar(team, colour, size) {
  const px = size || 28;
  const wrap = h('span', {
    class: 'team-avatar',
    style: `display:inline-flex; align-items:center; justify-content:center; width:${px}px; height:${px}px; border-radius:50%; overflow:hidden; background:${colour}; color:#fff; font-weight:700; font-size:${Math.max(10, Math.round(px * 0.42))}px; flex:0 0 ${px}px; border:2px solid ${colour}; box-shadow:0 0 0 1px rgba(0,0,0,.08);`,
    'aria-label': team?.name || '',
  });
  if (team?.avatar_url) {
    const img = document.createElement('img');
    img.src = team.avatar_url;
    img.alt = team.name || '';
    img.style.cssText = 'width:100%; height:100%; object-fit:cover; display:block;';
    // If the picture fails to load for any reason, fall back to the
    // initials so the surface never shows a broken image.
    img.onerror = () => {
      img.remove();
      wrap.textContent = teamInitials(team.name);
    };
    wrap.append(img);
  } else {
    wrap.textContent = teamInitials(team?.name);
  }
  return wrap;
}

// adventureInitials pulls up to two upper-case letters from the title
// for the default cover-art tile.
function adventureInitials(title) {
  const parts = (title || '').trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return '?';
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

// adventureCover renders the adventure's cover image — rounded square
// (reserved shape for adventures; teams use circles). Uses the
// uploaded picture when present, otherwise initials on the accent
// colour. `size` is px; `adv` needs `title` + optional `avatar_url` +
// optional `accent_color`.
function adventureCover(adv, size) {
  const px = size || 48;
  const colour = adv?.accent_color || 'var(--accent)';
  const fg = '#fff';
  const radius = Math.max(6, Math.round(px * 0.18));
  const wrap = h('span', {
    class: 'adv-cover',
    style: `display:inline-flex; align-items:center; justify-content:center; width:${px}px; height:${px}px; border-radius:${radius}px; overflow:hidden; background:${colour}; color:${fg}; font-weight:800; font-size:${Math.max(11, Math.round(px * 0.34))}px; flex:0 0 ${px}px; letter-spacing:.04em; text-transform:uppercase; border:1px solid rgba(0,0,0,.08); box-shadow:0 1px 3px rgba(0,0,0,.12);`,
    'aria-label': adv?.title || '',
  });
  if (adv?.avatar_url) {
    const img = document.createElement('img');
    img.src = adv.avatar_url;
    img.alt = adv.title || '';
    img.style.cssText = 'width:100%; height:100%; object-fit:cover; display:block;';
    img.onerror = () => { img.remove(); wrap.textContent = adventureInitials(adv.title); };
    wrap.append(img);
  } else {
    wrap.textContent = adventureInitials(adv?.title);
  }
  return wrap;
}

// renderTeamLinksPanel is the "distribute magic links" surface sitting
// at the top of the event page. An arranger with 100 teams needs to copy
// captain URLs in bulk (paste into a spreadsheet or email merge) and
// occasionally reach one team's per-player URLs inline. Virtualisation
// isn't worth it at the scale we've seen (~100 teams × ~5 members =
// 500 rows); a fixed-height scroller with client-side search keeps the
// rest of the event page usable.
function renderTeamLinksPanel(run, teams) {
  if (!teams || teams.length === 0) return null;
  const origin = location.origin;
  const teamURL    = (tm) => `${origin}/team/${encodeURIComponent(tm.token || '')}`;
  const memberURL  = (m)  => `${origin}/play?t=${encodeURIComponent(m.token || '')}`;
  const csvEscape  = (c) => /[",\n]/.test(c) ? `"${String(c).replace(/"/g, '""')}"` : String(c);

  const search = h('input', {
    type: 'search',
    placeholder: t('Filter {{n}} teams…', { n: teams.length }),
    style: 'flex:1; margin:0; min-width:10rem',
  });
  const copyCaptainsBtn = h('button', { class: 'btn small', type: 'button' },
    icon(ICONS.copy), t('Copy captain links'));
  copyCaptainsBtn.addEventListener('click', async () => {
    const txt = teams.map((tm) => `${tm.name}\t${teamURL(tm)}`).join('\n');
    try { await navigator.clipboard.writeText(txt); toastOk(t('Copied {{n}} captain links', { n: teams.length })); }
    catch { toastErr(t('Clipboard blocked — select and copy by hand')); }
  });
  const copyCSVBtn = h('button', { class: 'btn small', type: 'button' },
    icon(ICONS.copy), t('Copy all (CSV)'));
  copyCSVBtn.addEventListener('click', async () => {
    const rows = [['team', 'member', 'url']];
    for (const tm of teams) {
      rows.push([tm.name, '(captain)', teamURL(tm)]);
      for (const m of (tm.members || [])) rows.push([tm.name, m.name || '', memberURL(m)]);
    }
    const csv = rows.map((r) => r.map(csvEscape).join(',')).join('\n');
    try { await navigator.clipboard.writeText(csv); toastOk(t('Copied {{n}} rows', { n: rows.length - 1 })); }
    catch { toastErr(t('Clipboard blocked — select and copy by hand')); }
  });

  const scroll = h('div', { class: 'tl-scroll' });
  const rowNodes = teams.map((tm, i) => buildTeamLinkRow(tm, i, teamURL, memberURL));
  scroll.append(...rowNodes);

  search.addEventListener('input', () => {
    const q = search.value.trim().toLowerCase();
    rowNodes.forEach((row, i) => {
      if (!q) { row.style.display = ''; return; }
      const hit = teams[i].name.toLowerCase().includes(q)
        || (teams[i].members || []).some((m) => (m.name || '').toLowerCase().includes(q));
      row.style.display = hit ? '' : 'none';
    });
  });

  const body = h('div', { style: 'margin-top:.75rem' },
    h('div', { class: 'row', style: 'gap:.5rem; align-items:center; flex-wrap:wrap; margin-bottom:.5rem' },
      search, copyCaptainsBtn, copyCSVBtn),
    h('p', { class: 'muted', style: 'font-size:.78rem; margin:0 0 .55rem' },
      t('Links expire after a fixed window — anyone with the URL can play as that player. Use the per-team rotate-token action if a link leaks; existing players keep playing until they sign out.')),
    scroll);

  const summary = h('summary', {
    style: 'cursor:pointer; list-style:none; display:flex; align-items:center; gap:.6rem',
  },
    h('span', { style: 'font-size:.7rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)' },
      t('Distribute links')),
    h('span', { class: 'muted', style: 'font-size:.85rem' },
      t('{{n}} teams — captain + per-player links', { n: teams.length })),
  );
  // Open by default for small rosters where the panel doesn't dominate
  // the viewport; collapsed past that so the rest of the event page is
  // visible without scrolling.
  const openByDefault = teams.length <= 6;
  return h('details', {
    class: 'card share-bar team-links',
    style: 'padding:.85rem 1rem',
    open: openByDefault ? true : null,
  }, summary, body);
}

function buildTeamLinkRow(tm, i, teamURL, memberURL) {
  const url = teamURL(tm);
  const urlInput = h('input', {
    readonly: '', value: url,
    class: 'tl-url',
    on: { click: (e) => e.target.select() },
  });
  const copyBtn = iconBtn('copy', t('Copy captain link'), async () => {
    try { await navigator.clipboard.writeText(url); toastOk(t('Link copied')); }
    catch { urlInput.select(); document.execCommand('copy'); toastOk(t('Link copied')); }
  });
  const members = tm.members || [];
  const memBody = h('div', { class: 'tl-members', style: 'display:none' },
    members.map((m) => {
      const murl = memberURL(m);
      const minput = h('input', {
        readonly: '', value: murl,
        class: 'tl-url tl-url-sm',
        on: { click: (e) => e.target.select() },
      });
      const mcopy = iconBtn('copy', t('Copy link'), async () => {
        try { await navigator.clipboard.writeText(murl); toastOk(t('Link copied')); }
        catch { minput.select(); document.execCommand('copy'); toastOk(t('Link copied')); }
      });
      // Magic-link expiry hint. Red "expired" when past, muted
      // "expires in Nd" otherwise. Hidden (no badge) when the slot
      // has no expiry — that's the legacy "never expires" case for
      // pre-migration rows.
      const expiry = renderSlotExpiryHint(m.expires_at, m.last_login_at);
      return h('div', {
        class: 'tl-member-row',
        title: m.last_login_at ? t('Last opened {{when}}', { when: formatAuditTS(m.last_login_at) }) : '',
      },
        h('span', { class: 'muted tl-member-name' }, m.name || t('(unnamed)')),
        expiry, minput, mcopy);
    }));
  const caretGlyph = h('span', { class: 'tl-caret' }, '▸');
  const toggle = h('button', {
    type: 'button',
    class: 'btn small ghost tl-toggle',
    title: members.length === 1
      ? t('Show 1 player link')
      : t('Show {{n}} player links', { n: members.length }),
  }, h('span', {}, members.length), caretGlyph);
  toggle.addEventListener('click', () => {
    const open = memBody.style.display === 'none';
    memBody.style.display = open ? '' : 'none';
    caretGlyph.textContent = open ? '▾' : '▸';
  });
  const sw = h('span', {
    class: 'sw tl-sw',
    style: `background:${teamColor(tm.id, i)}`,
  });
  return h('div', { class: 'tl-row' },
    h('div', { class: 'tl-head' },
      sw,
      h('span', { class: 'tl-team' }, tm.name),
      urlInput, copyBtn, toggle),
    memBody);
}

// Public share bar: shows the absolute /live/{token} URL (opaque) so the
// arranger can read/copy it and send it to whoever's running the TV
// screen.
function renderShareBar(run) {
  const url = `${location.origin}/live/${event.live_token}`;
  const urlBox = h('input', {
    readonly: '', value: url,
    style: 'flex:1; min-width:0; background:var(--surface-2); font-family:ui-monospace,SFMono-Regular,monospace; font-size:.9rem; box-shadow:none; border-color:var(--border-soft)',
    on: { click: (e) => e.target.select() },
  });
  const copyBtn = h('button', {
    class: 'btn small', type: 'button', title: t('Copy link'),
    on: { click: async () => {
      try {
        await navigator.clipboard.writeText(url);
        toastOk(t('Link copied'));
      } catch {
        urlBox.select();
        document.execCommand('copy');
        toastOk(t('Link copied'));
      }
    } },
  }, t('Copy'));
  const openBtn = h('a', {
    href: url, target: '_blank', rel: 'noopener', class: 'btn small primary',
  }, t('Open ↗'));

  // Real-time map toggle — arrangers can enable/disable the audience map
  // at any time (default off: revealing team positions is effectively
  // cheating for most puzzle types).
  const mapToggle = h('input', { type: 'checkbox' });
  if (event.show_map) mapToggle.checked = true;
  mapToggle.addEventListener('change', async () => {
    const r = await api(`/api/admin/events/${run.id}`, {
      method: 'PATCH',
      body: JSON.stringify({ show_map: mapToggle.checked }),
    });
    if (r.status === 204) {
      toastOk(mapToggle.checked ? t('Map enabled on live view') : t('Map hidden'));
    } else {
      mapToggle.checked = !mapToggle.checked;
      toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
    }
  });
  const mapLabel = h('label', {
    style: 'display:inline-flex; align-items:center; gap:.35rem; cursor:pointer; font-size:.85rem; color:var(--muted)',
  }, mapToggle, t('Show real-time map'));

  // Collapsed by default: the share URL and map toggle are only needed
  // once per run (at setup), so they're tucked behind a <details> to
  // cut visual noise on the main run dashboard.
  const body = h('div', { style: 'margin-top:.75rem' },
    h('div', { class: 'row', style: 'gap:.75rem; align-items:center; flex-wrap:wrap' },
      urlBox,
      copyBtn,
      openBtn,
    ),
    h('div', { style: 'margin-top:.5rem' }, mapLabel),
  );
  const summary = h('summary', {
    style: 'cursor:pointer; list-style:none; display:flex; align-items:center; gap:.6rem',
  },
    h('span', { style: 'font-size:.7rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)' }, t('Public live view')),
    h('span', { class: 'muted', style: 'font-size:.85rem' }, t('Share on a TV — token URL, no login needed')),
  );
  return h('details', { class: 'card share-bar', style: 'padding:.85rem 1rem' },
    summary, body,
  );
}

async function viewRunDetail(view, runID) {
  const [detail, positions, tracksR, adventureR, eventsR] = await Promise.all([
    api('/api/admin/events/' + runID),
    api('/api/admin/events/' + runID + '/positions'),
    api('/api/admin/events/' + runID + '/tracks'),
    (async () => {
      const d = await api('/api/admin/events/' + runID);
      if (!d.ok) return null;
      return api('/api/admin/adventures/' + encodeURIComponent(d.body.event.adventure_slug));
    })(),
    api('/api/admin/events/' + runID + '/events'),
  ]);
  if (!detail.ok) { view.replaceChildren(h('p', { class: 'err' }, detail.body?.error || t('not found'))); return; }
  const run = detail.body.event;
  const teams = detail.body.teams || [];
  const tracks = tracksR.body?.tracks || [];
  const adventure = adventureR?.body || null;
  const events = eventsR.body?.events || [];

  // Lifecycle action lives at the top — during a live event this is
  // what the arranger reaches for, so it belongs above everything.
  const actions = h('div', { class: 'row', style: 'gap:.5rem; flex-wrap:wrap' });
  if (event.state === 'scheduled') {
    const start = h('button', { class: 'btn primary lifecycle-btn', on: { click: () => confirmStart(run) } },
      icon(ICONS.play), t('Start now'));
    const sched = h('button', { class: 'btn lifecycle-btn', on: { click: () => openEditSchedule(run) } },
      icon(ICONS.schedule), t('Reschedule'));
    actions.append(start, sched);
  }
  if (event.state === 'running') {
    const pause = h('button', { class: 'btn lifecycle-btn warning', on: { click: () => transition(event.id, 'pause') } },
      icon(ICONS.moon), t('Pause'));
    actions.append(pause);
  }
  if (event.state === 'paused') {
    const resume = h('button', { class: 'btn primary lifecycle-btn', on: { click: () => transition(event.id, 'resume') } },
      icon(ICONS.play), t('Resume'));
    actions.append(resume);
  }
  // Results export is always available once there are teams — arrangers
  // often want to grab mid-event standings too, not just post-mortem.
  if (teams.length > 0) {
    const finishedN = teams.filter((tm) => tm.completed_at).length;
    const allDone   = finishedN === teams.length;
    const csv = h('a', {
      class: 'btn lifecycle-btn' + (allDone ? ' primary' : ''),
      href: '/api/admin/events/' + event.id + '/results.csv',
      download: `run-${run.id}-results.csv`,
      title: t('Download CSV of the current standings'),
    }, icon(ICONS.copy), allDone ? t('Download results') : t('Download standings'));
    actions.append(csv);
  }

  // Last-activity-per-team: the newest event timestamp the team was
  // involved in. Used to highlight teams that look stuck.
  const lastEventByTeam = new Map();
  for (const ev of events) {
    if (!ev.team_id) continue;
    const prev = lastEventByTeam.get(ev.team_id);
    if (!prev || (ev.created_at > prev)) lastEventByTeam.set(ev.team_id, ev.created_at);
  }
  const STUCK_MS = 10 * 60 * 1000;

  // Build team → colour map up-front so legend, trace and dots match.
  const teamIndex = new Map();
  teams.forEach((t, i) => teamIndex.set(t.id, i));
  const teamLegend = teams.map((t, i) => h('span', {},
    h('span', { class: 'sw', style: `background:${teamColor(t.id, i)}` }),
    t.name));

  const mapHost = h('div', { class: 'map-host', id: 'run-map-' + event.id });
  const legend = h('div', { class: 'map-legend' },
    h('span', {}, h('span', { class: 'sw', style: 'background:var(--accent)' }), t('Gated puzzle')),
    h('span', {}, h('span', { class: 'sw', style: 'background:var(--ink)' }), t('Puzzle')),
    ...teamLegend);

  // Collapsible map card. Leaflet needs a sized container at init
  // time, so we only call initRunMap when the body is visible; a
  // guard keeps it idempotent across toggles.
  const mapBody = h('div', { style: event.show_map ? '' : 'display:none' }, mapHost, legend);
  const mapCaret = h('span', { style: 'margin-left:auto; color:var(--muted); font-size:.85rem' },
    event.show_map ? t('Hide') : t('Show'));
  const mapHeader = h('div', { class: 'row between', style: 'cursor:pointer; user-select:none' },
    h('h2', { style: 'margin:0' }, t('Map')), mapCaret);
  let mapReady = false;
  const ensureMap = () => {
    if (!mapReady && adventure) { initRunMap(mapHost, adventure, teams, tracks); mapReady = true; }
  };
  mapHeader.addEventListener('click', () => {
    const nowOpen = mapBody.style.display === 'none';
    mapBody.style.display = nowOpen ? '' : 'none';
    mapCaret.textContent  = nowOpen ? t('Hide') : t('Show');
    if (nowOpen) ensureMap();
  });
  const mapCard = h('div', { class: 'card' }, mapHeader, mapBody);

  // Sticky lifecycle bar — pins to the top of the scroll area so big
  // Start/Pause/Resume stay reachable while scrolling through teams.
  const titleEl = h('h1', {}, runLabel(run));
  const renameBtn = iconBtn('pencil', t('Rename event'), () => openRenameEvent(run));
  const lifecycleBar = h('div', { class: 'lifecycle-bar' },
    h('div', { class: 'lifecycle-left' },
      h('button', { class: 'btn ghost small', on: { click: () => nav('#events') } },
        icon(ICONS.back), t('Events')),
      titleEl, renameBtn,
      h('span', { class: 'pill ' + pillClassForState(event.state) }, t(event.state || '')),
      h('span', { class: 'muted', style: 'font-size:.85rem' },
        event.started_at
          ? t('Started {{when}}', { when: fmtLocal(event.started_at) })
          : event.scheduled_at
            ? t('Auto-start {{when}}', { when: fmtLocal(event.scheduled_at) })
            : t('Not scheduled')),
    ),
    actions,
  );

  view.replaceChildren(
    lifecycleBar,
    h('p', { class: 'muted mono' }, event.adventure_slug),
    renderTeamLinksPanel(run, teams),
    renderShareBar(run),
    mapCard,
    h('div', { class: 'grid cols-2' },
      h('div', { class: 'card' },
        h('div', { class: 'row between' },
          h('h2', {},
            t('Teams'),
            event.max_teams > 0
              ? h('span', { class: 'muted', style: 'font-weight:400; margin-left:.4rem; font-size:.85rem' },
                  `(${teams.length} / ${event.max_teams})`)
              : null),
          h('button', {
            class: 'btn primary small',
            disabled: event.max_teams > 0 && teams.length >= event.max_teams ? '' : null,
            on: { click: () => openTeamModal(event.id, null) },
          }, icon(ICONS.plus), t('New team'))),
        teams.length === 0
          ? h('div', { class: 'empty' },
              h('p', {}, t('No teams yet.')),
              h('button', { class: 'btn primary', on: { click: () => openTeamModal(event.id, null) } },
                icon(ICONS.plus), t('Add the first team')))
          : h('table', { class: 'table' },
            h('thead', {}, h('tr', {},
              h('th', {}, t('Team')),
              h('th', {}, t('Puzzle')),
              h('th', { class: 'hide-narrow' }, t('Activity')),
              h('th', {}, ''))),
            h('tbody', {}, teams.map((tm, i) => {
              const page = adventure?.pages?.[tm.page_index];
              const lastEv = lastEventByTeam.get(tm.id);
              const lastMs = lastEv ? Date.parse(lastEv.includes('T') ? lastEv : lastEv.replace(' ', 'T') + 'Z') : null;
              const stuck = event.state === 'running' && !tm.completed_at && lastMs != null && (Date.now() - lastMs) > STUCK_MS;
              return h('tr', { class: stuck ? 'row-stuck' : '' },
                h('td', {},
                  h('span', {
                    style: 'display:inline-flex; align-items:center; gap:.5rem; vertical-align:middle',
                  },
                    teamAvatar(tm, teamColor(tm.id, i), 26),
                    h('a', { href: '#', on: { click: (e) => { e.preventDefault(); openTeamDetail(event.id, tm, adventure); } } }, tm.name)),
                  tm.completed_at ? h('span', { class: 'pill success', style: 'margin-left:.5rem' }, t('done')) : null,
                  stuck ? h('span', { class: 'pill warning', style: 'margin-left:.5rem' }, t('stuck?')) : null),
                h('td', {},
                  h('div', { class: 'mono' },
                    adventure?.pages
                      ? t('{{i}} / {{n}}', { i: tm.page_index + 1, n: adventure.pages.length })
                      : tm.page_index),
                  page && !tm.completed_at
                    ? h('div', { class: 'muted', style: 'font-size:.85rem' }, page.title || t('(untitled)'))
                    : null),
                h('td', { class: 'hide-narrow muted', style: 'font-size:.85rem' },
                  lastEv ? fmtLocal(lastEv) : t('—')),
                h('td', {}, h('div', { class: 'row end' },
                  iconBtn('pencil', t('Edit team'),   () => openTeamModal(event.id, tm)),
                  iconBtn('trash',  t('Delete team'), () => confirmDeleteTeam(tm), { danger: true }))),
              );
            })))),
      h('div', { class: 'card' },
        h('h2', {}, t('Event log')),
        renderEventFeed(events, teams)),
    ),
  );

  // Initialise Leaflet only when the map card is open (event.show_map
  // makes it open on arrival; otherwise the click handler triggers
  // init the first time the user expands it).
  if (event.show_map) ensureMap();
}

// initRunMap mounts a Leaflet map inside host. Puzzle pins come from the
// adventure (all pages always have a location now); per-team polylines and
// latest-position dots come from the tracks payload.
function initRunMap(host, adventure, teams, tracks) {
  if (typeof L === 'undefined') {
    host.replaceChildren(h('div', { class: 'empty' }, t('Map library is still loading — refresh the page.')));
    return;
  }
  const map = L.map(host, { scrollWheelZoom: false }).setView([59.3293, 18.0686], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 19,
  }).addTo(map);

  const bounds = L.latLngBounds([]);

  // Puzzle markers.
  for (const p of (adventure.pages || [])) {
    const ll = [p.location.lat, p.location.lng];
    const marker = L.marker(ll, {
      icon: L.divIcon({
        className: '',
        html: `<div class="puzzle-marker ${p.gated ? 'gated' : ''}"><span>${p.index + 1}</span></div>`,
        iconSize: [28, 28],
        iconAnchor: [14, 28],
      }),
    }).addTo(map);
    marker.bindPopup(
      `<strong>${p.index + 1}. ${p.title || t('Puzzle')}</strong>` +
      (p.gated && p.location.radius_m
        ? `<br><em>${t('Gated — {{r}} m', { r: p.location.radius_m })}</em>`
        : '') +
      `<br><small>${p.location.lat.toFixed(5)}, ${p.location.lng.toFixed(5)}</small>`
    );
    bounds.extend(ll);
  }

  // Team traces.
  const teamByID = new Map();
  teams.forEach((t, i) => teamByID.set(t.id, { team: t, i }));
  for (const track of tracks) {
    const info = teamByID.get(track.team_id);
    const colour = teamColor(track.team_id, info ? info.i : 0);
    if (track.points.length > 0) {
      const latlngs = track.points.map((p) => [p.lat, p.lng]);
      L.polyline(latlngs, { color: colour, weight: 3, opacity: .85 }).addTo(map);
      const latest = track.points[track.points.length - 1];
      // Circular avatar marker — the uploaded picture when present,
      // initials-on-team-colour otherwise. A coloured ring keeps the
      // "which polyline is whose" legibility we had with the dot.
      const initials = teamInitials(track.team_name);
      const size = 30;
      const html = track.avatar_url
        ? `<div class="team-marker" style="--team-col:${colour}; width:${size}px; height:${size}px;">`
            + `<img src="${track.avatar_url}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:${JSON.stringify(initials)}}))"/>`
            + `</div>`
        : `<div class="team-marker no-img" style="--team-col:${colour}; width:${size}px; height:${size}px;">`
            + `<span>${initials}</span></div>`;
      L.marker([latest.lat, latest.lng], {
        icon: L.divIcon({
          className: '',
          html,
          iconSize: [size, size],
          iconAnchor: [size / 2, size / 2],
        }),
      }).bindPopup(`<strong>${track.team_name}</strong><br><small>${fmtLocal(latest.server_ts)}</small>`).addTo(map);
      for (const ll of latlngs) bounds.extend(ll);
    }
  }

  if (bounds.isValid()) {
    map.fitBounds(bounds, { padding: [24, 24] });
  }
}

// renderEventFeed turns the run_events JSON into a readable timeline.
function renderEventFeed(events, teams) {
  if (!events.length) return h('div', { class: 'empty' }, t('No activity yet.'));
  const ul = h('ul', { class: 'feed' });
  for (const e of events) ul.append(renderEvent(e, teams));
  return ul;
}

function renderEvent(e, teams) {
  const p = e.payload || {};
  let badge = 'neutral', symbol = '•', msg, meta;
  const team = h('strong', {}, e.team_name || '');
  switch (e.kind) {
    case 'event.created':
      badge = 'brand'; symbol = '+'; msg = h('span', { class: 'msg' }, t('Event created for '), h('strong', {}, p.adventure_slug || '')); break;
    case 'event.started': badge = 'good'; symbol = '▶'; msg = h('span', { class: 'msg' }, t('Event started')); break;
    case 'event.paused':  badge = 'neutral'; symbol = '‖'; msg = h('span', { class: 'msg' }, t('Event paused')); break;
    case 'event.resumed': badge = 'good'; symbol = '▶'; msg = h('span', { class: 'msg' }, t('Event resumed')); break;
    case 'team.created':
      badge = 'brand'; symbol = '+'; msg = h('span', { class: 'msg' }, t('Team '), h('strong', {}, e.team_name || p.name || ''), t(' created'));
      if ((p.members || []).length) meta = t('with {{names}}', { names: (p.members || []).join(', ') }); break;
    case 'team.renamed':
      badge = 'neutral'; symbol = '✎'; msg = h('span', { class: 'msg' }, t('Renamed '), h('strong', {}, p.from || ''), ' → ', h('strong', {}, p.to || '')); break;
    case 'team.deleted':
      badge = 'bad'; symbol = '×'; msg = h('span', { class: 'msg' }, t('Team '), h('strong', {}, p.name || ''), t(' deleted')); break;
    case 'team.member.added':
      badge = 'good'; symbol = '+'; msg = h('span', { class: 'msg' }, t('Added '), h('strong', {}, p.username || ''), t(' to '), h('strong', {}, e.team_name || '')); break;
    case 'team.member.removed':
      badge = 'neutral'; symbol = '−'; msg = h('span', { class: 'msg' }, t('Removed '), h('strong', {}, p.username || ''), t(' from '), h('strong', {}, e.team_name || '')); break;
    case 'answer.wrong':
      badge = 'bad'; symbol = '✗'; msg = h('span', { class: 'msg' }, team, t(' wrong on puzzle {{n}}', { n: (p.page_index ?? 0) + 1 }));
      if (p.submitted) meta = t('submitted “{{answer}}”', { answer: p.submitted }); break;
    case 'answer.right':
      badge = 'good'; symbol = '✓'; msg = h('span', { class: 'msg' }, team, t(' solved puzzle {{n}}', { n: (p.page_index ?? 0) + 1 })); break;
    case 'team.completed':
      badge = 'good'; symbol = '★'; msg = h('span', { class: 'msg' }, team, t(' finished the adventure!')); break;
    case 'team.unlocked':
      badge = 'brand'; symbol = '⇨'; msg = h('span', { class: 'msg' },
        team, t(' skipped past puzzle {{n}}', { n: (p.from_page_index ?? 0) + 1 }));
      if (p.by_arranger) meta = t('by arranger'); break;
    case 'gate.reached':
      badge = 'brand'; symbol = '⛳'; msg = h('span', { class: 'msg' }, team, t(' reached the puzzle location')); break;
    default:
      msg = h('span', { class: 'msg' }, e.kind);
  }
  return h('li', {},
    h('span', { class: 'badge ' + badge }, symbol),
    h('div', {},
      msg,
      e.actor ? h('div', { class: 'meta' }, t('by {{actor}}', { actor: e.actor }) + (meta ? ' · ' + meta : ''))
              : (meta ? h('div', { class: 'meta' }, meta) : null),
    ),
    h('time', { datetime: e.created_at }, formatEventTime(e.created_at)),
  );
}

// fmtLocal turns a server timestamp (SQLite "YYYY-MM-DD HH:MM:SS" UTC, or an
// RFC3339 string) into the viewer's local time. Returns '—' for empty input
// and the raw value when it can't be parsed, so we never show "Invalid Date".
function fmtLocal(s, opts) {
  if (!s) return '—';
  const iso = s.includes('T') ? s : s.replace(' ', 'T') + 'Z';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return s;
  return d.toLocaleString(undefined, opts || { dateStyle: 'medium', timeStyle: 'short' });
}

function formatEventTime(s) {
  if (!s) return '';
  // SQLite datetime('now') returns "YYYY-MM-DD HH:MM:SS" in UTC. Let users
  // see something friendlier; locale defaults are fine.
  const d = new Date(s.includes('T') ? s : s.replace(' ', 'T') + 'Z');
  if (Number.isNaN(d.getTime())) return s;
  const now = Date.now();
  const diff = (now - d.getTime()) / 1000;
  if (diff < 60) return t('just now');
  if (diff < 3600) return t('{{n}}m ago', { n: Math.round(diff / 60) });
  if (diff < 86400) return t('{{n}}h ago', { n: Math.round(diff / 3600) });
  return d.toLocaleString();
}

function btn(label, cls, fn) {
  return h('button', { class: 'btn ' + (cls || ''), on: { click: fn } }, label);
}

async function transition(runID, action) {
  const r = await api(`/api/admin/events/${runID}/${action}`, { method: 'POST' });
  if (r.status === 204) {
    // Map each action verb to a localised past-tense confirmation so
    // toastOk doesn't end up as Swedish "Pause" + English "-ed".
    const TRANSITION_OK = {
      start:  t('Started'),
      pause:  t('Paused'),
      resume: t('Resumed'),
    };
    toastOk(TRANSITION_OK[action] || action);
    renderRoute();
  } else {
    toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
  }
}

async function confirmStart(run) {
  const ok = await modal(t('Start this event now?'), ({ body, close }) => {
    body.append(
      h('p', {},
        t('Starting the event opens the first puzzle to all teams. '),
        event.scheduled_at
          ? h('span', {},
              t('An auto-start is currently scheduled for '),
              h('strong', {}, fmtLocal(event.scheduled_at)),
              t('. Starting now will replace that.'))
          : t('You can pause it later if needed.')),
      h('div', { class: 'row end', style: 'margin-top:1rem' },
        h('button', { class: 'btn', on: { click: () => close(false) } }, t('Cancel')),
        h('button', { class: 'btn primary', on: { click: () => close(true) } }, t('Start event'))),
    );
  });
  if (!ok) return;
  await transition(event.id, 'start');
}

async function openEditSchedule(run) {
  // Pre-fill the datetime-local input from the current UTC-stored value.
  // The input wants "YYYY-MM-DDTHH:MM" in local time; use the Date object to
  // convert without a chunky date library.
  let prefill = '';
  if (event.scheduled_at) {
    const iso = event.scheduled_at.includes('T') ? event.scheduled_at : event.scheduled_at.replace(' ', 'T') + 'Z';
    const d = new Date(iso);
    if (!Number.isNaN(d.getTime())) {
      const pad = (n) => String(n).padStart(2, '0');
      prefill = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
  }

  await modal(event.scheduled_at ? t('Change auto-start') : t('Set auto-start'), ({ body, close }) => {
    const when = h('input', { type: 'datetime-local', value: prefill });
    const form = h('form', {},
      h('p', { class: 'muted', style: 'font-size:.85rem; margin-bottom:.5rem' },
        t('The server will start the event automatically at the time below. Leave empty and hit Clear to remove the auto-start.')),
      h('label', { class: 'field' }, h('span', {}, t('Auto-start at')), when),
      h('div', { class: 'row between', style: 'margin-top:.5rem' },
        event.scheduled_at
          ? h('button', { class: 'btn danger', type: 'button', on: { click: async () => {
              close(null);
              await patchSchedule(event.id, '');
            } } }, t('Clear'))
          : h('span', {}),
        h('div', { class: 'row' },
          h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, t('Cancel')),
          h('button', { class: 'btn primary', type: 'submit' }, t('Save')))),
    );
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!when.value) { toastErr(t('Pick a date or use Clear')); return; }
      const d = new Date(when.value);
      if (Number.isNaN(d.getTime())) { toastErr(t('Bad date')); return; }
      close(null);
      await patchSchedule(event.id, d.toISOString());
    });
    body.append(form);
  });
}

async function patchSchedule(runID, iso) {
  const r = await api(`/api/admin/events/${runID}`, {
    method: 'PATCH',
    body: JSON.stringify({ scheduled_at: iso }),
  });
  if (r.status === 204) {
    toastOk(iso ? t('Schedule updated') : t('Auto-start cleared'));
    renderRoute();
  } else {
    toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
  }
}

async function openTeamDetail(runID, team, adventure) {
  // Fetch events filtered to this team.
  const evR = await api(`/api/admin/events/${runID}/events?team_id=${team.id}`);
  const events = evR.body?.events || [];
  const page = adventure?.pages?.[team.page_index];
  const last = adventure?.pages ? adventure.pages.length : null;
  const finished = team.completed_at || (last !== null && team.page_index >= last);

  await modal(t('Team · {{name}}', { name: team.name }), ({ body, close }) => {
    const summary = h('div', { class: 'row between', style: 'margin-bottom:.75rem' },
      h('div', {},
        h('div', { class: 'muted', style: 'font-size:.8rem; text-transform:uppercase; letter-spacing:.05em; font-weight:700' },
          finished
            ? t('Finished')
            : (last
                ? t('Puzzle {{i}} of {{n}}', { i: team.page_index + 1, n: last })
                : t('Puzzle {{i}}', { i: team.page_index + 1 }))),
        page && !finished ? h('div', {}, h('strong', {}, page.title || t('(untitled)'))) : null,
      ),
      h('div', {},
        (team.members || []).map((m) => h('span', { class: 'chip', style: 'margin-right:.25rem' }, m.name)),
      ),
    );

    const actions = h('div', { class: 'row', style: 'margin-bottom:.75rem; flex-wrap:wrap' });
    if (!finished) {
      // Alt-click skips the confirmation modal — faster when the
      // arranger is actively unsticking a team mid-event. Normal
      // click still goes through the confirm so a mis-tap doesn't
      // silently advance a team.
      const skipBtn = h('button', {
        class: 'btn primary',
        title: t('Alt-click to skip the confirmation'),
      }, icon(ICONS.fastForward), t('Skip this puzzle'));
      skipBtn.addEventListener('click', (e) => {
        if (e.altKey) skipPuzzleNow(team, close); else skipPuzzle(team, close);
      });
      actions.append(skipBtn);
    }
    actions.append(h('button', { class: 'btn', on: { click: () => { close(null); openTeamModal(runID, team); } } },
      icon(ICONS.pencil), t('Edit members')));
    actions.append(h('button', { class: 'btn danger', on: { click: async () => { close(null); await confirmDeleteTeam(team); } } },
      icon(ICONS.trash), t('Delete')));

    body.append(
      summary,
      actions,
      h('h3', {}, t('Activity')),
      renderEventFeed(events, [team]),
      h('div', { class: 'row end', style: 'margin-top:1rem' },
        h('button', { class: 'btn', on: { click: () => close(null) } }, t('Close'))),
    );
  }, { wide: true });
}

// skipPuzzleNow is the alt-click fast path — same server call as
// skipPuzzle but no confirmation modal, for when the arranger is
// actively triaging a stuck team mid-event.
async function skipPuzzleNow(team, close) {
  const r = await api(`/api/admin/teams/${team.id}/unlock`, { method: 'POST' });
  if (r.ok) {
    toastOk(r.body?.completed
      ? t('{{name}} finished', { name: team.name })
      : t('{{name}} advanced', { name: team.name }));
    close(true);
    renderRoute();
  } else {
    toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
  }
}

async function skipPuzzle(team, close) {
  const ok = await modal(t('Skip puzzle for {{name}}?', { name: team.name }), ({ body, close: c }) => {
    body.append(
      h('p', {}, t('This advances the team past their current puzzle without them submitting the answer. Useful when they\'re stuck. The action is recorded in the event log.')),
      h('div', { class: 'row end' },
        h('button', { class: 'btn', on: { click: () => c(false) } }, t('Cancel')),
        h('button', { class: 'btn primary', on: { click: () => c(true) } }, t('Skip puzzle'))),
    );
  });
  if (!ok) return;
  const r = await api(`/api/admin/teams/${team.id}/unlock`, { method: 'POST' });
  if (r.ok) {
    toastOk(r.body?.completed
      ? t('{{name}} finished', { name: team.name })
      : t('{{name}} advanced', { name: team.name }));
    close(true);
    renderRoute();
  } else {
    toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
  }
}

async function confirmDeleteTeam(team) {
  const pw = await promptPassword(t('Delete team “{{name}}”?', { name: team.name }),
    t('This removes the team and all its progress. Members stay as player accounts. Enter your password to confirm.'));
  if (!pw) return;
  const r = await api(`/api/admin/teams/${team.id}`, {
    method: 'DELETE',
    headers: { 'X-Confirm-Password': pw },
  });
  if (r.status === 204) { toastOk(t('Team deleted')); renderRoute(); }
  else toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
}

// openTeamModal handles both new-team and edit-team. For a new team the
// arranger types a team name plus one name per line; each line becomes a
// slot with its own magic-link token. For an existing team the modal lets
// the arranger rename, copy each slot's link, rotate a link, remove a
// slot, or add a new slot inline.
async function openTeamModal(runID, existing) {
  if (existing) return openEditTeamModal(runID, existing);
  return openNewTeamModal(runID);
}

async function openNewTeamModal(runID) {
  // Fetch the event's current teams so bulk-create can skip over names
  // that already exist. Without this, running bulk twice (or running
  // it with a prefix that happens to collide with an existing team)
  // hits the UNIQUE(run_id, name) constraint on every POST and the
  // arranger sees "Created 0, N failed" with no explanation.
  const existingR = await api('/api/admin/events/' + runID);
  const existingNames = new Set(((existingR.body?.teams) || []).map((x) => x.name));
  await modal(t('Add teams'), ({ body, close }) => {
    // Two modes share this modal. Default is "single" — fill one team
    // with specific names. "Bulk" is the tournament-setup shortcut:
    // "I have 5 teams of 3 players, generate placeholders, we'll
    // rename later." Names are auto-generated; the magic-link share
    // page already works with whatever names are there.
    const modeSingle = h('input', { type: 'radio', name: 'mode', value: 'single', checked: true });
    const modeBulk   = h('input', { type: 'radio', name: 'mode', value: 'bulk' });
    const modeBar = h('div', { style: 'display:flex; gap:1rem; margin-bottom:1rem' },
      h('label', { style: 'display:flex; gap:.4rem; align-items:center; cursor:pointer' },
        modeSingle, h('span', {}, t('One team'))),
      h('label', { style: 'display:flex; gap:.4rem; align-items:center; cursor:pointer' },
        modeBulk, h('span', {}, t('Many teams at once'))),
    );

    /* ---- single-team fields ---- */
    const nameInput = h('input', { name: 'name', autofocus: true });
    const memberArea = h('textarea', {
      name: 'members', rows: 5,
      placeholder: 'alice\nbob\ncharlie',
    });
    const singleFields = h('div', {},
      h('label', { class: 'field' }, h('span', {}, t('Team name')), nameInput),
      h('label', { class: 'field' },
        h('span', {}, t('Members — one per line, or paste CSV')),
        memberArea),
      h('p', { class: 'muted', style: 'font-size:.8rem' },
        t('Each line becomes a player slot with its own magic-link token.')));

    /* ---- bulk-team fields ---- */
    const teamCount   = h('input', { type: 'number', min: '1', max: '50', value: '5' });
    const playerCount = h('input', { type: 'number', min: '1', max: '20', value: '3' });
    const teamPrefix   = h('input', { value: 'Team' });
    const playerPrefix = h('input', { value: 'Player' });
    const bulkPreview = h('p', { class: 'muted', style: 'font-size:.85rem' });
    const updatePreview = () => {
      const T = parseInt(teamCount.value, 10) || 0;
      const P = parseInt(playerCount.value, 10) || 0;
      bulkPreview.textContent = t('Creates {{t}} teams × {{p}} players = {{n}} magic links.',
        { t: T, p: P, n: T * P });
    };
    for (const el of [teamCount, playerCount]) el.addEventListener('input', updatePreview);
    updatePreview();
    const bulkFields = h('div', { style: 'display:none' },
      h('div', { class: 'grid cols-2' },
        h('label', { class: 'field' }, h('span', {}, t('Number of teams')), teamCount),
        h('label', { class: 'field' }, h('span', {}, t('Players per team')), playerCount)),
      h('div', { class: 'grid cols-2' },
        h('label', { class: 'field' }, h('span', {}, t('Team name prefix')), teamPrefix),
        h('label', { class: 'field' }, h('span', {}, t('Player name prefix')), playerPrefix)),
      bulkPreview);

    const refreshMode = () => {
      singleFields.style.display = modeSingle.checked ? '' : 'none';
      bulkFields.style.display   = modeBulk.checked   ? '' : 'none';
    };
    modeSingle.addEventListener('change', refreshMode);
    modeBulk.addEventListener('change', refreshMode);

    const submitBtn = h('button', { class: 'btn primary', type: 'submit' }, t('Create'));
    const form = h('form', {}, modeBar, singleFields, bulkFields,
      h('div', { class: 'row end', style: 'margin-top:1rem' },
        h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, t('Cancel')),
        submitBtn));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      try {
        if (modeSingle.checked) {
          const names = (memberArea.value || '').split(/[\n,;]+/)
            .map((s) => s.trim()).filter(Boolean);
          const tName = nameInput.value.trim();
          if (!tName) { toastErr(t('Team name required')); return; }
          if (names.length === 0) { toastErr(t('Add at least one member')); return; }
          const rr = await api(`/api/admin/events/${runID}/teams`, {
            method: 'POST',
            body: JSON.stringify({ name: tName, member_names: names }),
          });
          if (rr.status !== 201) { toastErr(rr.body?.error || t('error {{status}}', { status: rr.status })); return; }
          toastOk(t('Team created'));
        } else {
          const T = Math.max(1, parseInt(teamCount.value, 10) || 0);
          const P = Math.max(1, parseInt(playerCount.value, 10) || 0);
          const tp = teamPrefix.value.trim() || 'Team';
          const pp = playerPrefix.value.trim() || 'Player';
          // Skip over names that already exist on this event (previous
          // bulk attempts, manually-renamed collisions, …) so we don't
          // just fail every POST with a 409.
          let created = 0, failed = 0, lastError = '';
          let idx = 1;
          const safetyCap = 10000;
          while (created < T && idx < safetyCap) {
            let name;
            do {
              name = `${tp} ${idx++}`;
            } while (existingNames.has(name) && idx < safetyCap);
            if (idx >= safetyCap) break;
            const members = Array.from({ length: P }, (_, j) => `${pp} ${j + 1}`);
            const rr = await api(`/api/admin/events/${runID}/teams`, {
              method: 'POST',
              body: JSON.stringify({ name, member_names: members }),
            });
            if (rr.status === 201) {
              created++;
              existingNames.add(name);
            } else {
              failed++;
              lastError = rr.body?.error || t('error {{status}}', { status: rr.status });
              // If the server rejected once for a non-collision reason
              // (e.g. run full, permission), stop hammering it.
              if (!/already used/i.test(lastError)) break;
            }
          }
          if (created === 0 && failed > 0) {
            toastErr(lastError || t('Could not create any teams'));
          } else if (failed) {
            toastErr(t('Created {{c}}, {{f}} failed: {{err}}', { c: created, f: failed, err: lastError }));
          } else {
            toastOk(t('Created {{n}} teams', { n: created }));
          }
        }
        close(true);
        renderRoute();
      } finally {
        submitBtn.disabled = false;
      }
    });
    body.append(form);
  }, { wide: true });
}

async function openEditTeamModal(runID, existing) {
  // Refresh the team detail so we pick up any changes since the page
  // rendered — tokens can rotate and we want the latest.
  const r = await api('/api/admin/events/' + runID);
  const run = r.body || {};
  const freshTeam = (run.teams || []).find((t) => t.id === existing.id) || existing;

  await modal(t('Edit team · {{name}}', { name: freshTeam.name }), ({ body, close }) => {
    const nameInput = h('input', { value: freshTeam.name, required: true });
    const renameBtn = h('button', { class: 'btn small', type: 'button' }, t('Save name'));
    renameBtn.addEventListener('click', async () => {
      const name = nameInput.value.trim();
      if (!name || name === freshTeam.name) return;
      const rr = await api(`/api/admin/teams/${freshTeam.id}`, {
        method: 'PATCH', body: JSON.stringify({ name }),
      });
      if (rr.status === 204) { toastOk(t('Renamed')); close(true); renderRoute(); }
      else toastErr(rr.body?.error || t('error {{status}}', { status: rr.status }));
    });

    const membersWrap = h('div', {});
    const rebuildMembers = () => {
      membersWrap.replaceChildren();
      const rows = (freshTeam.members || []).map((m) => renderSlotRow(freshTeam.id, m, reload));
      if (rows.length === 0) {
        membersWrap.append(h('p', { class: 'muted' }, t('No members yet. Add one below.')));
      } else {
        membersWrap.append(...rows);
      }
    };

    async function reload() {
      const rr = await api('/api/admin/events/' + runID);
      const fresh = (rr.body?.teams || []).find((t) => t.id === freshTeam.id);
      if (!fresh) { close(true); renderRoute(); return; }
      freshTeam.members = fresh.members;
      freshTeam.name = fresh.name;
      rebuildMembers();
    }

    // Inline "add slot"
    const newName = h('input', { placeholder: t('New member name') });
    const addBtn = h('button', { class: 'btn primary small', type: 'button' }, icon(ICONS.plus), t('Add'));
    const addRow = h('div', { class: 'row', style: 'gap:.4rem; margin-top:.75rem' }, newName, addBtn);
    addBtn.addEventListener('click', async () => {
      const name = newName.value.trim();
      if (!name) return;
      const rr = await api(`/api/admin/teams/${freshTeam.id}/slots`, {
        method: 'POST', body: JSON.stringify({ name }),
      });
      if (rr.status === 201) {
        newName.value = '';
        toastOk(t('Added {{name}}', { name: rr.body.name }));
        await reload();
      } else {
        toastErr(rr.body?.error || t('error {{status}}', { status: rr.status }));
      }
    });
    newName.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addBtn.click(); } });

    // Team-share affordances. The team URL is meant for the captain —
    // they open it on a phone and every member taps their own name. The
    // "Copy all" dumps name+URL pairs for paste-into-Slack flows.
    const teamURL = `${location.origin}/team/${encodeURIComponent(freshTeam.token || '')}`;
    const teamURLInput = h('input', {
      readonly: '', value: teamURL,
      style: 'flex:1; min-width:0; font-family:ui-monospace,monospace; font-size:.8rem; box-shadow:none; border-color:var(--border-soft); margin:0',
      on: { click: (e) => e.target.select() },
    });
    const copyTeamBtn = iconBtn('copy', t('Copy team share link'), async () => {
      try { await navigator.clipboard.writeText(teamURL); toastOk(t('Team link copied')); }
      catch { teamURLInput.select(); document.execCommand('copy'); toastOk(t('Team link copied')); }
    });
    const openTeamBtn = iconBtn('eye', t('Open team page'), () => window.open(teamURL, '_blank', 'noopener'));
    const copyAllBtn = h('button', { class: 'btn small', type: 'button' },
      icon(ICONS.copy), t('Copy all as text'));
    copyAllBtn.addEventListener('click', async () => {
      const base = location.origin;
      const text = (freshTeam.members || [])
        .map((m) => `${m.name}: ${base}/play?t=${m.token}`)
        .join('\n');
      try { await navigator.clipboard.writeText(text); toastOk(t('Copied {{n}} links', { n: freshTeam.members.length })); }
      catch { toastErr(t('Clipboard blocked — select and copy by hand')); }
    });

    // Profile picture row: preview + upload + remove. The preview is
    // rebuilt in place after upload/remove so the arranger sees the
    // change immediately without reopening the modal.
    const avatarHost = h('div', {
      style: 'display:flex; align-items:center; gap:.75rem; margin:.25rem 0 1rem',
    });
    const fileInput = h('input', { type: 'file', accept: 'image/*', style: 'display:none' });
    const avatarActions = h('div', { class: 'row', style: 'gap:.4rem; flex-wrap:wrap' });
    const redrawAvatar = () => {
      avatarHost.replaceChildren();
      const teamIndex = (run.teams || []).findIndex((x) => x.id === freshTeam.id);
      const colour = teamColor(freshTeam.id, Math.max(0, teamIndex));
      avatarHost.append(
        teamAvatar(freshTeam, colour, 56),
        h('div', { style: 'display:flex; flex-direction:column; gap:.3rem' },
          h('span', { class: 'muted', style: 'font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; font-weight:700' },
            t('Team photo')),
          avatarActions),
      );
    };
    const uploadBtn = h('button', { class: 'btn small', type: 'button' },
      icon(ICONS.plus), t('Upload photo'));
    uploadBtn.addEventListener('click', () => fileInput.click());
    const removeBtn = h('button', { class: 'btn small danger', type: 'button' },
      icon(ICONS.trash), t('Remove photo'));
    removeBtn.addEventListener('click', async () => {
      const rr = await api(`/api/admin/teams/${freshTeam.id}/avatar`, { method: 'DELETE' });
      if (rr.status === 204) {
        freshTeam.avatar_url = '';
        toastOk(t('Team photo removed'));
        redrawActions();
        redrawAvatar();
        renderRoute();
      } else {
        toastErr(rr.body?.error || t('error {{status}}', { status: rr.status }));
      }
    });
    fileInput.addEventListener('change', async () => {
      const file = fileInput.files?.[0];
      if (!file) return;
      const fd = new FormData();
      fd.append('file', file);
      const res = await fetch(`/api/admin/teams/${freshTeam.id}/avatar`, {
        method: 'POST', body: fd, credentials: 'same-origin',
        headers: { 'X-CSRF-Token': csrfToken() },
      });
      fileInput.value = '';
      if (res.ok) {
        const body = await res.json().catch(() => ({}));
        // Cache-bust the URL so the preview + map markers pick up the
        // new image instead of showing the browser-cached old one.
        freshTeam.avatar_url = (body.url || `/adventure-assets/team-avatar/${freshTeam.id}`) + '?v=' + Date.now();
        toastOk(t('Team photo updated'));
        redrawActions();
        redrawAvatar();
        renderRoute();
      } else {
        const errTxt = await res.text().catch(() => '');
        toastErr(errTxt || t('error {{status}}', { status: res.status }));
      }
    });
    const redrawActions = () => {
      avatarActions.replaceChildren(uploadBtn);
      if (freshTeam.avatar_url) avatarActions.append(removeBtn);
    };
    redrawActions();
    redrawAvatar();

    body.append(
      h('label', { class: 'field' }, h('span', {}, t('Team name')),
        h('div', { class: 'row', style: 'gap:.4rem' }, nameInput, renameBtn)),
      avatarHost, fileInput,
      h('h3', { style: 'margin-top:1rem' }, t('Share with the team')),
      h('p', { class: 'muted', style: 'font-size:.85rem' },
        t('Send this single link to the captain. Each member taps their own name there to pick up their personal magic link.')),
      h('div', { class: 'row', style: 'gap:.4rem; align-items:center; margin-bottom:.5rem' },
        teamURLInput, copyTeamBtn, openTeamBtn),
      h('div', { class: 'row', style: 'gap:.4rem' }, copyAllBtn),
      h('h3', { style: 'margin-top:1rem' }, t('Members')),
      membersWrap,
      addRow,
      h('div', { class: 'row end', style: 'margin-top:1rem' },
        h('button', { class: 'btn', on: { click: () => close(null) } }, t('Close'))));
    rebuildMembers();
  }, { wide: true });
}

function renderSlotRow(teamID, slot, reload) {
  const url = `${location.origin}/play?t=${encodeURIComponent(slot.token)}`;
  const urlInput = h('input', {
    readonly: '', value: url,
    style: 'flex:1; min-width:0; font-family:ui-monospace,monospace; font-size:.8rem; box-shadow:none; border-color:var(--border-soft); margin:0',
    on: { click: (e) => e.target.select() },
  });
  const copyBtn = iconBtn('copy', t('Copy link'), async () => {
    try { await navigator.clipboard.writeText(url); toastOk(t('Link copied')); }
    catch { urlInput.select(); document.execCommand('copy'); toastOk(t('Link copied')); }
  });
  const rotateBtn = iconBtn('key', t('Rotate link — invalidates the old one'), async () => {
    const rr = await api(`/api/admin/teams/${teamID}/slots/${slot.id}/rotate`, { method: 'POST' });
    if (rr.status === 200) { toastOk(t('Link rotated')); reload(); }
    else toastErr(rr.body?.error || t('error {{status}}', { status: rr.status }));
  });
  const removeBtn = iconBtn('trash', t('Remove slot'), async () => {
    const rr = await api(`/api/admin/teams/${teamID}/slots/${slot.id}`, { method: 'DELETE' });
    if (rr.status === 204) { toastOk(t('Removed')); reload(); }
    else toastErr(rr.body?.error || t('error {{status}}', { status: rr.status }));
  }, { danger: true });
  return h('div', { style: 'margin-bottom:.5rem' },
    h('div', { class: 'row', style: 'gap:.4rem; align-items:center' },
      h('strong', { style: 'min-width:8ch' }, slot.name),
      urlInput, copyBtn, rotateBtn, removeBtn),
    slot.last_login_at
      ? h('div', { class: 'muted', style: 'font-size:.75rem; margin-left:.5rem' },
          t('last login {{when}}', { when: fmtLocal(slot.last_login_at) }))
      : null);
}

/* ========== Players ========== */
// Players are per-slot rows on a team now — there is no global Players
// page. Kept only the password-reset modal since org-admin reset flows
// (below) still use it.

async function openResetPassword(user) {
  await modal(t('Reset password for {{username}}', { username: user.username }), ({ body, close }) => {
    const form = h('form', {},
      h('label', { class: 'field' }, h('span', {}, t('New password')), h('input', { name: 'p', type: 'password', required: true })),
      h('div', { class: 'row end' },
        h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, t('Cancel')),
        h('button', { class: 'btn primary', type: 'submit' }, t('Set password'))),
    );
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const r = await api(`/api/admin/users/${user.id}/password`, { method: 'POST', body: JSON.stringify({ password: fd.get('p') }) });
      if (r.status === 204) { toastOk(t('password reset')); close(true); }

function renderOrganizationCard(org, adventures) {
  const assignments = org.assignments || [];
  const unused = assignments.filter((x) => !x.event_id);
  const used = assignments.filter((x) => x.event_id);
  const members = org.members || [];

  const usersPart = members.length === 1
    ? t('{{n}} user', { n: members.length })
    : t('{{n}} users', { n: members.length });
  const playersCount = org.players_total || 0;
  const playersPart = playersCount === 1
    ? t('{{n}} player', { n: playersCount })
    : t('{{n}} players', { n: playersCount });
  const eventsCount = org.events_total || 0;
  const runsPart = eventsCount === 1
    ? t('{{n}} event', { n: eventsCount })
    : t('{{n}} events', { n: eventsCount });

    h('div', { class: 'row between' },

    h('h3', { style: 'margin-top:.75rem' }, t('Users ({{n}})', { n: members.length })),
    members.length === 0
      ? h('p', { class: 'muted', style: 'font-size:.85rem' }, t('No users yet — add one to get started.'))
      : h('div', {}, members.map((m) => h('span', {
          class: 'chip', style: 'margin: 0 .35rem .35rem 0',
          title: t('{{role}} · click ⓧ to remove', { role: m.role }),
        }, m.role === 'org_admin'
            ? t('{{username}} (admin)', { username: m.username })
            : t('{{username}} (member)', { username: m.username }),
        h('button', { title: t('Remove'), on: { click: () => confirmRemoveOrgMember(org, m) } }, '×')))),

async function confirmDeleteOrg(org) {
  // The org list already carries counts so we can show the blast
  // radius up front rather than letting the admin discover the size
  // of the cascade after pressing delete. Refuse to even prompt when
  // an event is currently running — that's the case where a misclick
  // is most catastrophic.
  const members     = (org.members || []).length;
  const assignments = (org.assignments || []).length;
  const players     = org.players_total || 0;
  const events      = org.events_total || 0;
  const running     = org.events_running || 0;
  if (running > 0) {
    toastErr(t('Cannot delete: {{n}} event(s) currently running. Stop them first.', { n: running }));
    return;
  }
  const summary = t('You are about to delete: {{members}} user(s), {{assignments}} assignment(s), {{players}} player(s), {{events}} event(s). Cascades immediately and cannot be undone.',
    { members, assignments, players, events });
  const pw = await promptPassword(t('Delete organization “{{name}}”?', { name: org.name }),
    summary + ' ' + t('Enter your password to confirm.'));
  if (!pw) return;
  const r = await api(`/api/admin/organizations/${org.id}`, {
    method: 'DELETE', headers: { 'X-Confirm-Password': pw },
  });
  if (r.status === 204) { toastOk(t('Organization deleted')); renderRoute(); }
  else toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
}

    const form = h('form', {},
      h('label', { class: 'field' },
        h('span', {}, used ? t('Adventure (locked — already used)') : t('Adventure')),
        advSel),
      h('label', { class: 'field' }, h('span', {}, t('Maximum teams')), count),
      h('p', { class: 'muted', style: 'font-size:.8rem' },

      h('div', { class: 'row between', style: 'margin-top:.5rem' },

// libraryTabs renders the Adventures|Puzzles strip shown at the top of

// pendingQuickPuzzleGPS is the in-flight GPS fix kicked off by a
// quickPuzzle tap. The puzzle itself is created without waiting, so
// the editor opens immediately; when the fix eventually arrives, the
// matching editor applies it to the location — unless the author has
// set it manually in the meantime.
let pendingQuickPuzzleGPS = null; // { puzzleID, promise } | null

// quickPuzzle creates a stub via POST /api/admin/puzzles and navigates
// to the new puzzle's editor without waiting on GPS. A location fix is
// requested in the background and applied by the editor if one arrives
// before the author sets a location manually. Designed for the
// "standing somewhere, want to remember this spot" flow — one tap
// after the page is already loaded.
async function quickPuzzle(ev) {
  const btn = ev?.currentTarget;
  if (btn) btn.disabled = true;
  const gpsPromise = navigator.geolocation
    ? new Promise((resolve) => {
        navigator.geolocation.getCurrentPosition(
          (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
          () => resolve(null),
          { enableHighAccuracy: true, maximumAge: 10000, timeout: 30000 },
        );
      })
    : Promise.resolve(null);
  const r = await api('/api/admin/puzzles', {
    method: 'POST',
    body: JSON.stringify({}),
  });
  if (btn) btn.disabled = false;
  if (r.status !== 201) { toastErr(r.body?.error || t('error {{status}}', { status: r.status })); return; }
  toastOk(t('Puzzle captured'));
  pendingQuickPuzzleGPS = { puzzleID: r.body.id, promise: gpsPromise };
  nav('#puzzles/' + r.body.id);
}

// viewPuzzleEditRoute supports deep-linking #puzzles/<id> straight into
// the editor. For an attached puzzle we also fetch the parent adventure
// so the timeline can render the siblings; for a library puzzle we pass
// adv=null and the editor renders in standalone mode.
//
// The Puzzles library is painted behind the modal so that when the
// editor closes (Cancel, backdrop click, Esc) the user lands on the
// list instead of a blank placeholder view.
async function viewPuzzleEditRoute(view, pageID) {
  await viewPuzzles(view);
  const r = await api('/api/admin/puzzles/' + encodeURIComponent(pageID));
  if (r.status !== 200) {
    toastErr(r.body?.error || t('puzzle not found'));
    return;
  }
  const page = r.body;
  let adv = null;
  if (page.adventure_slug) {
    const er = await api('/api/admin/adventures/' + encodeURIComponent(page.adventure_slug) + '/edit');
    if (er.ok) {
      adv = er.body;
      // Use the authoritative copy from the adventure so the editor
      // and timeline agree on sibling page identities.
      const fresh = adv.pages.find((pp) => pp.id === page.id);
      if (fresh) Object.assign(page, fresh);
    }
  }
  openEditPuzzle(adv, page);
}

// colorRow builds a labelled row with a type=color picker, a "use default"
// reset button, and a live text readout. Empty initial means "use the
// default theme" — the picker renders greyed so admins see the field is
// unset. get() returns "" (use default) or "#rrggbb".
function colorRow(label, initial) {
  const state = { value: initial || '' };
  const picker = h('input', { type: 'color', value: initial || '#808080' });
  const reset  = h('button', { class: 'btn small', type: 'button', title: t('Use default') }, t('Reset'));
  const show   = h('span', { class: 'muted mono', style: 'font-size:.8rem' },
    initial ? initial : t('(default)'));
  const refresh = () => {
    show.textContent = state.value || t('(default)');
    picker.style.opacity = state.value ? '1' : '.45';
  };
  picker.addEventListener('input', () => { state.value = picker.value; refresh(); });
  reset.addEventListener('click',  () => { state.value = ''; refresh(); });
  refresh();
  return {
    el: h('label', { class: 'field' },
      h('span', {}, label),
      h('div', { class: 'row', style: 'gap:.5rem; align-items:center' }, picker, reset, show)),
    get: () => state.value,
  };
}

async function openCreateAdventure() {
  await modal(t('New adventure'), ({ body, close, setBeforeClose }) => {
    const slug  = h('input', { required: true, placeholder: 'my-adventure', pattern: '[a-z0-9-]+' });
    const slugHint = h('small', { class: 'muted', style: 'display:block; margin-top:.2rem' }, '');
    const title = h('input', { required: true });
    const desc  = h('textarea', { rows: 2 });
    const author = h('input', {});
    const cAccent    = colorRow(t('Accent — buttons, progress'),      '');
    const cSecondary = colorRow(t('Secondary — titles, status pill'), '');
    const cBackground = colorRow(t('Background'),                     '');
    const cText      = colorRow(t('Text'),                            '');
    // Live slug validator: keeps the author from discovering at submit
    // time that "My-Adventure" isn't a legal slug. Echoes a small hint
    // beside the field as they type.
    const validateSlug = () => {
      const v = slug.value;
      if (!v) { slugHint.textContent = ''; slugHint.className = 'muted'; return; }
      if (/^[a-z0-9-]+$/.test(v)) {
        slugHint.textContent = '✓ ' + t('Looks good.');
        slugHint.className = 'ok';
      } else {
        slugHint.textContent = t('Lowercase a–z, digits, and hyphens only.');
        slugHint.className = 'err';
      }
    };
    slug.addEventListener('input', validateSlug);
    const form = h('form', {},
      h('label', { class: 'field' },
        h('span', {}, t('Slug — lowercase letters, digits, hyphens')), slug, slugHint),
      h('label', { class: 'field' }, h('span', {}, t('Title')), title),
      h('label', { class: 'field' }, h('span', {}, t('Description')), desc),
      h('label', { class: 'field' }, h('span', {}, t('Author')), author),
      h('h3', { style: 'margin-top:1rem' }, t('Brand colours (optional)')),
      cAccent.el, cSecondary.el, cBackground.el, cText.el,
      h('div', { class: 'row end' },
        h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, t('Cancel')),
        h('button', { class: 'btn primary', type: 'submit' }, t('Create'))));
    // Dirty-check guard: backdrop click / Escape would otherwise lose
    // a half-typed adventure spec. We treat any non-empty input field
    // as dirty since blank-on-create is the common abandoned state.
    if (typeof setBeforeClose === 'function') {
      setBeforeClose(() => {
        const dirty = !!(slug.value || title.value || desc.value || author.value
          || cAccent.get() || cSecondary.get() || cBackground.get() || cText.get());
        return !dirty || confirm(t('Discard this adventure?'));
      });
    }
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const r = await api('/api/admin/adventures', {
        method: 'POST', body: JSON.stringify({
          slug: slug.value.trim(), title: title.value.trim(),
          description: desc.value, author: author.value.trim(),
          accent_color:           cAccent.get(),
          accent_secondary_color: cSecondary.get(),
          background_color:       cBackground.get(),
          text_color:             cText.get(),
        }),
      });
      if (r.status === 201) { toastOk(t('Adventure created')); close(true); nav('#library/' + r.body.slug); }
      else toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
    });
    body.append(form);
  });
}

async function viewLibraryEdit(view, slug) {
  const r = await api('/api/admin/adventures/' + encodeURIComponent(slug) + '/edit');
  if (!r.ok) {
    view.replaceChildren(h('p', { class: 'err' }, r.body?.error || t('not found')));
    return;
  }
  const adv = r.body;
  renderLibraryEdit(view, adv);
}

function renderLibraryEdit(view, adv) {
  // Enabled index differs from adv.pages index once any puzzle is
  // disabled — the preview endpoint matches the player's view and
  // skips disabled pages, so we thread the enabled position to each
  // card's Preview button.
  let enabledIdx = 0;
  // List container; cards are appended below. Keeping the variable
  // here lets the drag handlers query it for drop-hint cleanup
  // without searching the whole DOM.
  const list = h('div', { class: 'puzzle-list' });
  const cards = adv.pages.map((p, i) => {
    const previewIdx = p.disabled ? null : enabledIdx;
    if (!p.disabled) enabledIdx++;
    return renderPuzzleCard(adv, p, i, previewIdx);
  });
  cards.forEach((c) => list.append(c));

  // Drag-and-drop reorder. Live-shuffle: as the cursor crosses a
  // sibling's vertical midpoint we splice the dragged card to that
  // position in the DOM. Other cards reflow to fill, giving the
  // arranger a real preview of the final layout instead of an
  // abstract "drop hint" line. State is closure-scoped so a single
  // in-flight drag is shared across all cards.
  let dragFrom = -1; // original index, captured at dragstart
  let dragEl = null; // the card being dragged
  const indexOfCard = (card) => Array.from(list.children).indexOf(card);
  // moveOver swaps dragEl past `target` on cursor entry, with a
  // post-swap "suppression" zone instead of a fixed dead-zone
  // fraction. After a swap, dragEl occupies a new spot under the
  // cursor — to fire another swap, the cursor must first LEAVE
  // dragEl's new bounding rect entirely. That hysteresis scales with
  // the dragged card's height (taller card → larger suppression
  // zone), which is exactly what's needed when puzzle cards have
  // wildly different heights (a short title-only card vs. a tall
  // card with images and a long prompt).
  //
  // Direction is inferred from current DOM order: if dragEl precedes
  // target the user is dragging downward, so we move dragEl AFTER
  // target; otherwise dragEl moves BEFORE target.
  //
  // FLIP animation: capture sibling rects pre-mutation, do the DOM
  // splice, then translate each moved sibling back to its old
  // position and animate the transform to 0. The dragged card itself
  // is excluded — it'd fight the browser's drag image, which is
  // already following the cursor.
  const moveOver = (target, clientY) => {
    if (!dragEl || target === dragEl) return;
    // Suppression: while the cursor is still inside dragEl's bounds
    // from a previous swap, refuse to fire another one. The flag
    // clears the moment the cursor exits dragEl, so the next card
    // entered will swap as expected.
    const dragRect = dragEl.getBoundingClientRect();
    if (clientY >= dragRect.top && clientY <= dragRect.bottom) return;
    const draggedFirst = !!(dragEl.compareDocumentPosition(target) & Node.DOCUMENT_POSITION_FOLLOWING);
    const desiredBefore = draggedFirst ? target.nextSibling : target;
    if (dragEl.nextSibling === desiredBefore) return; // already in slot

    const siblings = Array.from(list.children).filter((el) => el !== dragEl);
    const firstRects = new Map();
    for (const el of siblings) firstRects.set(el, el.getBoundingClientRect());

    list.insertBefore(dragEl, desiredBefore);

    for (const el of siblings) {
      const old = firstRects.get(el);
      const now = el.getBoundingClientRect();
      const dy = old.top - now.top;
      if (dy === 0) continue;
      el.style.transition = 'none';
      el.style.transform = `translateY(${dy}px)`;
      // Force a reflow so the next transition runs from the inverted
      // start, not from the natural 0 (otherwise the browser folds
      // the two style mutations into one frame and skips the anim).
      void el.offsetHeight;
      el.style.transition = 'transform 0.18s ease';
      el.style.transform = '';
    }
  };
  const commitReorder = async () => {
    if (!dragEl || dragFrom < 0) return;
    const finalPos = indexOfCard(dragEl);
    dragEl.classList.remove('drag-ghost');
    const fromPos = dragFrom;
    dragFrom = -1;
    dragEl = null;
    if (finalPos === fromPos || finalPos < 0) return;
    // Optimistically reflect the new order on the data side; the
    // server is told via the reorder endpoint, and we re-render at
    // the end so the per-card position numbers ("1.", "2.", …)
    // refresh.
    const next = adv.pages.slice();
    const [moved] = next.splice(fromPos, 1);
    next.splice(finalPos, 0, moved);
    const r = await api(`/api/admin/adventures/${encodeURIComponent(adv.slug)}/pages/reorder`, {
      method: 'PATCH', body: JSON.stringify({ page_ids: next.map((p) => p.id) }),
    });
    if (r.status !== 204) {
      toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
      // Server rejected — re-render from the unchanged adv.pages so
      // the DOM snaps back to the authoritative order.
      renderLibraryEdit(view, adv);
      return;
    }
    adv.pages = next.map((p, i) => ({ ...p, index: i }));
    renderLibraryEdit(view, adv);
  };
  cards.forEach((card, i) => wirePuzzleDrag(card, i,
    () => dragFrom, (from, el) => { dragFrom = from; dragEl = el; },
    moveOver, commitReorder,
    () => { if (dragEl) { dragEl.classList.remove('drag-ghost'); } dragFrom = -1; dragEl = null; },
  ));

  const hasEnabled = enabledIdx > 0;
  // .filter(Boolean) drops null/undefined ternary branches. Native
  // `replaceChildren` coerces non-Node args to strings — without the
  // filter the literal text "null" leaked in above the puzzle list
  // for non-admin viewers (the renderAdventureShares branch).
  view.replaceChildren(...[
    h('button', { class: 'btn ghost small', on: { click: () => nav(state.me.role === 'admin' ? '#library' : '#adventures') } },
      icon(ICONS.back), t('Back')),
    h('div', { class: 'row between', style: 'gap:.75rem; align-items:flex-start' },
      h('div', { class: 'row', style: 'gap:1rem; align-items:center; min-width:0' },
        adventureCover(adv, 80),
        h('div', { style: 'min-width:0' },
          h('h1', { style: 'margin:0' }, adv.title),
          adv.published === false
            ? h('span', { class: 'pill warning', style: 'margin-top:.35rem' }, t('Draft'))
            : h('span', { class: 'pill success', style: 'margin-top:.35rem' }, t('Published')))),
      h('div', { class: 'card-actions' },
        hasEnabled
          ? iconBtn('eye',    t('Open the adventure in the player view'),
              () => previewAdventure(adv.slug, 0, false))
          : null,
        adv.published
          ? h('button', { class: 'btn small',
              title: t('Hide from the Store'),
              on: { click: () => togglePublished(adv, false) } },
              t('Unpublish'))
          : h('button', { class: 'btn small primary',
              title: t('Make available in the Store'),
              on: { click: () => togglePublished(adv, true) } },
              t('Publish')),
        iconBtn('pencil', t('Edit title/slug/colours'), () => openEditAdventureMeta(adv)),
        iconBtn('trash',  t('Delete adventure'),        () => confirmDeleteAdventure(adv), { danger: true }))),
    h('p', { class: 'muted mono' }, adv.slug, adv.author ? ` · ${adv.author}` : ''),
    adv.description ? h('p', { class: 'muted' }, adv.description) : null,
    state.me.role === 'admin' ? renderAdventureShares(adv) : null,
    h('div', { class: 'row between', style: 'margin-top:1rem' },
      h('h2', {}, t('Puzzles ({{n}})', { n: adv.pages.length })),
      // One "Add puzzle" entry point with a menu for the "copy from
      // library" variant. Two separate buttons read as two separate
      // features; a single button with a menu reads as one action
      // with options — same verb, two ways to fill it.
      addPuzzleButton(adv)),
    adv.pages.length === 0
      ? h('div', { class: 'empty' },
          h('p', {}, t('No puzzles yet.')),
          h('p', { class: 'muted', style: 'margin-top:.5rem' },
            t('Use "Add puzzle" above to author a new one or copy from the library.')))
      : list,
  ].filter(Boolean));
}

// wirePuzzleDrag attaches HTML5 + touch drag-and-drop handlers to a
// puzzle card. The drag is "live": as the cursor crosses a sibling's
// midpoint, the dragged card is spliced to that position in the DOM
// and other cards naturally reflow. The original index is captured at
// dragstart; the final index is read from the DOM at drop time.
function wirePuzzleDrag(card, i, getDragFrom, setDragFrom, moveOver, commit, cancel) {
  card.addEventListener('dragstart', (e) => {
    setDragFrom(i, card);
    card.classList.add('drag-ghost');
    e.dataTransfer.effectAllowed = 'move';
    // Firefox refuses to initiate the drag unless some payload is set.
    e.dataTransfer.setData('text/plain', String(i));
  });
  card.addEventListener('dragend', () => {
    // Fired even if the drop landed outside the list. If we're still
    // mid-drag (drop didn't fire), back out cleanly.
    if (getDragFrom() >= 0) cancel();
  });
  card.addEventListener('dragover', (e) => {
    if (getDragFrom() < 0) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    moveOver(card, e.clientY);
  });
  card.addEventListener('drop', (e) => {
    if (getDragFrom() < 0) return;
    e.preventDefault();
    commit();
  });

  // Touch fallback. Only the grip starts a touch drag; touching the
  // card body keeps native scrolling.
  let touchStartX = 0, touchStartY = 0, touchMode = null;
  const handle = card.querySelector('.drag-handle');
  if (!handle) return;
  const targetAt = (clientX, clientY) => {
    const el = document.elementFromPoint(clientX, clientY);
    return el?.closest('.puzzle-card');
  };
  handle.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchMode = null;
  }, { passive: true });
  handle.addEventListener('touchmove', (e) => {
    if (touchMode === 'skip' || e.touches.length !== 1) return;
    const t = e.touches[0];
    if (touchMode === null) {
      const dx = t.clientX - touchStartX;
      const dy = t.clientY - touchStartY;
      if (Math.hypot(dx, dy) < 8) return;
      touchMode = 'drag';
      setDragFrom(i, card);
      card.classList.add('drag-ghost');
    }
    e.preventDefault();
    const target = targetAt(t.clientX, t.clientY);
    if (target) moveOver(target, t.clientY);
  }, { passive: false });
  handle.addEventListener('touchend', (e) => {
    if (touchMode !== 'drag') { touchMode = null; return; }
    touchMode = null;
    e.preventDefault();
    commit();
  }, { passive: false });
  handle.addEventListener('touchcancel', () => {
    if (touchMode === 'drag') cancel();
    touchMode = null;
  }, { passive: true });
}

// togglePublished flips the adventure's published flag and re-renders
// the library edit view so the pill and CTA label swap. Only Store
// visibility is affected — owned adventures stay in Adventures either
// way, so arrangers can iterate on drafts without losing access.
async function togglePublished(adv, next) {
  const r = await api(`/api/admin/adventures/${encodeURIComponent(adv.slug)}`, {
    method: 'PATCH', body: JSON.stringify({ published: next }),
  });
  if (r.status === 204) {
    adv.published = next;
    toastOk(next ? t('Published') : t('Unpublished'));
    renderRoute();
  } else {
    toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
  }
}
