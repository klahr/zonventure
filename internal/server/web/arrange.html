<!-- Apply persisted theme synchronously, before stylesheets render, so
     a saved-dark user doesn't see a light flash on refresh. The full
     initTheme() runs later as part of the main script bundle; this
     inline copy just gets the data-theme attribute on <html> in time
     for the first paint. Same key (zv-theme) shared across the app. -->
<script>(function(){try{var v=localStorage.getItem('zv-theme');if(v==='light'||v==='dark')document.documentElement.setAttribute('data-theme',v);}catch(e){}})();</script>
<!-- Unsupported-browser bail-out. Pure ES5 so even IE11 / older
     Android WebView builds run it cleanly; if any required API is
     missing we replace the document with a plain banner before the
     modern-syntax bundle below has a chance to throw a silent
     SyntaxError. fetch + WebSocket + Promise + Object.assign cover
     ~every API the rest of the page actually leans on. -->
<script>(function(){
  var ok = typeof fetch === 'function' &&
           typeof WebSocket !== 'undefined' &&
           typeof Promise !== 'undefined' &&
           typeof Object.assign === 'function';
  if (ok) return;
  document.documentElement.innerHTML =
    '<head><meta charset="utf-8"><title>Unsupported browser</title>' +
    '<style>body{font-family:system-ui,-apple-system,sans-serif;max-width:34rem;margin:5rem auto;padding:0 1.25rem;line-height:1.55;color:#222;background:#fff}h1{margin:0 0 .5rem;font-size:1.4rem}p{margin:0 0 1rem}code{background:#f3f3f3;padding:.05rem .35rem;border-radius:4px}</style>' +
    '</head><body>' +
    '<h1>Browser not supported</h1>' +
    '<p>Zonventure Studio needs a current version of <strong>Chrome</strong>, <strong>Firefox</strong>, <strong>Safari</strong>, or <strong>Edge</strong>.</p>' +
    '<p>Please update your browser and reload this page. If your device is managed by IT, ask them to push a recent build.</p>' +
    '</body>';
})();</script>
<style>
/* ---------- Theme (Zonventure palette) ---------- */
:root {
  --accent:        #ad1357;  /* raspberry — brand */
  --accent-hover:  #951048;
  --accent-fg:     #ffffff;
  /* Falls back to --accent unless an adventure overrides it via
     applyAdventureColors — mirrors the same default in play.html. */
  --accent-secondary: #ad1357;
  --ink:           #1f3349;  /* navy — headings */
  --success:       #429a3f;  /* brand green */
  --danger:        #ff5252;
  --danger-fg:     #ffffff;
  --warning:       #b45309;

  --bg:            #fbfbfd;
  --surface:       #ffffff;
  --surface-2:     #f6f6f6;
  --border:        #c6d2e1;
  --border-soft:   #c6d2e166;

  --text:          var(--ink);
  --muted:         #6b7f96;

  --shadow-soft:   0 1px 4px #00000014, 0 2px 8px #00000012;
  --shadow:        1px 1px 4px #00000033;
  --shadow-lg:     1px 1px 16px #00000047;

  --radius:        12px;
  --radius-sm:     8px;
  --radius-pill:   32px;

  /* Spacing scale — every padding/margin/gap should pick from one of
     these so the rhythm of the UI stays predictable. Most callers
     already land near these values; extracting them as tokens means
     a future "make everything tighter" sweep is one var-edit, not a
     codebase grep. */
  --space-1: .25rem;
  --space-2: .5rem;
  --space-3: .75rem;
  --space-4: 1rem;
  --space-5: 1.25rem;
  --space-6: 1.75rem;

  /* Typography scale. Most existing UI is body / xs / sm / lg, so
     these four cover the surface without over-fitting. The brand
     font lives separately on .brand / h1-h2. */
  --ts-xs: .75rem;
  --ts-sm: .85rem;
  --ts-md: 1rem;
  --ts-lg: 1.15rem;

  /* Minimum tap target. Apple HIG says 44pt; WCAG 2.5.5 says 24px
     minimum / 44px target. We pick 44 across the board. */
  --tap-target: 2.75rem;

  --font-body:     'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-brand:    'Aclonica', 'Vollkorn', Georgia, serif;

  --anim:          200ms;
}

/* ============ Accessibility utilities ============ */
/* visually-hidden hides content from sighted users while keeping it
   exposed to assistive tech. The standard inert/clip-path technique. */
.visually-hidden {
  position: absolute !important;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
/* Skip-to-content link: invisible until focused, then jumps into the
   top-left so a keyboard user can fly past the sidebar/topbar to the
   main content in one Tab. */
.skip-link {
  position: fixed;
  top: -40px; left: var(--space-2);
  z-index: 10000;
  padding: var(--space-2) var(--space-4);
  background: var(--accent);
  color: var(--accent-fg);
  border-radius: var(--radius-sm);
  font-weight: 700;
  text-decoration: none;
  transition: top 120ms ease;
}
.skip-link:focus {
  top: var(--space-2);
  outline: 3px solid color-mix(in srgb, var(--accent) 50%, white);
}
[data-theme="dark"] {
  --bg:          #14202e;
  --surface:     #1f3349;  /* the brand navy, used as primary surface */
  --surface-2:   #263d56;
  --border:      #3a5172;
  --border-soft: #3a517266;

  --text:        #e7ecf4;
  --muted:       #9db1cc;
  --ink:         #e7ecf4;

  --accent:      #e24080;   /* raspberry lifted for dark bg contrast */
  --accent-hover: #ad1357;
  --accent-fg:   #ffffff;
  --accent-secondary: #e24080;
  --success:     #7fd17b;
  --danger:      #ff7b7b;
  --warning:     #fbbf24;

  --shadow-soft: 0 1px 4px #00000066, 0 2px 12px #00000077;
  --shadow:      2px 2px 8px #00000073;
  --shadow-lg:   0 16px 40px #000000aa;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --bg: #14202e; --surface: #1f3349; --surface-2: #263d56;
    --border: #3a5172; --border-soft: #3a517266;
    --text: #e7ecf4; --muted: #9db1cc; --ink: #e7ecf4;
    --accent: #e24080; --accent-hover: #ad1357; --accent-fg: #ffffff;
    --accent-secondary: #e24080;
    --success: #7fd17b; --danger: #ff7b7b; --warning: #fbbf24;
    --shadow-soft: 0 1px 4px #00000066, 0 2px 12px #00000077;
    --shadow: 2px 2px 8px #00000073;
    --shadow-lg: 0 16px 40px #000000aa;
  }
}

/* ---------- Base ---------- */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3 { margin: 0 0 .5rem; line-height: 1.25; font-weight: 700; color: var(--ink); }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.1rem; }
h3 { font-size: .9rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
p { margin: 0 0 .5rem; }

/* ---------- App shell ---------- */
.app {
  display: grid;
  grid-template-columns: 240px minmax(0, 1fr);
  grid-template-rows: auto 1fr;
  grid-template-areas:
    "sidebar topbar"
    "sidebar content";
  min-height: 100vh;
  overflow-x: hidden;
}
.topbar {
  grid-area: topbar;
  display: flex;
  align-items: center;
  gap: .75rem;
  padding: 1rem 1.5rem;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 20;
}
.topbar .brand { display: none; font-size: 1.2rem; }
.topbar .crumb { font-weight: 700; font-size: 1rem; color: var(--ink); }
.topbar .spacer { flex: 1; }
.topbar .user {
  display: flex; align-items: center; gap: .6rem;
  color: var(--muted); font-size: var(--ts-sm);
}
.topbar .user strong { color: var(--text); font-weight: 700; }
/* Active-org pill at the top-right of the topbar — gives a single-org
   arranger a constant reminder of which tenant they're acting as
   (the sidebar org-switcher is multi-org-only and doesn't render
   for them). Logo + name pair compresses to logo-only on narrow
   viewports where the topbar real estate is scarce. */
.topbar-org {
  display: inline-flex; align-items: center; gap: .5rem;
  color: var(--muted); font-size: var(--ts-sm);
  max-width: 16rem; min-width: 0;
}
.topbar-org img {
  width: 1.5rem; height: 1.5rem; border-radius: .35rem;
  /* contain + no fill so transparent logos read against the topbar
     surface rather than a placeholder tile; the topbar paints var
     (--surface) as its own background, so a transparent logo lands
     on that same colour without a coloured well behind it. */
  object-fit: contain; flex: 0 0 auto;
}
.topbar-org .topbar-org-name {
  font-weight: 600; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
@media (max-width: 700px) {
  .topbar-org .topbar-org-name { display: none; }
}

.sidebar {
  grid-area: sidebar;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 1.5rem 0;
  display: flex; flex-direction: column;
}
.brand {
  font-family: var(--font-brand);
  font-weight: 400;
  color: var(--accent);
  letter-spacing: .01em;
}
.sidebar .brand {
  padding: 0 1.5rem 1.5rem;
  font-size: 1.55rem;
  display: flex; flex-direction: column;
  align-items: flex-start;
  gap: 0;
  line-height: 1.1;
}
.sidebar .brand small {
  font-family: var(--font-body);
  font-size: .7rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .08em;
  font-weight: 700;
  margin-top: .15rem;
}
.nav { display: flex; flex-direction: column; gap: 2px; padding: 0 .75rem; flex: 1; }
.sidebar-footer {
  margin-top: auto;
  padding: 1rem .75rem;
  border-top: 1px solid var(--border-soft);
  display: flex;
  flex-direction: column;
  gap: .4rem;
}
.sidebar-footer .btn {
  width: 100%;
  justify-content: flex-start;
  font-weight: 600;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sidebar-footer .btn:hover { color: var(--accent); border-color: transparent; background: var(--surface-2); }
.sidebar-footer .btn svg { stroke: currentColor; }
.zv-lang-picker {
  font: inherit; color: var(--text);
  padding: .3rem .5rem;
  background: var(--surface-2);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm);
  box-shadow: none;
  cursor: pointer;
}
.zv-lang-picker:hover { border-color: var(--muted); }
.nav a {
  display: flex; align-items: center; gap: .75rem;
  padding: .6rem .85rem; border-radius: var(--radius-pill);
  color: var(--text); text-decoration: none; font-weight: 600;
  transition: background var(--anim), color var(--anim);
}
.nav a:hover { background: var(--surface-2); text-decoration: none; }
.nav a.active { background: var(--accent); color: var(--accent-fg); box-shadow: var(--shadow-soft); }
.nav a.active svg { stroke: var(--accent-fg); }
.nav svg { width: 18px; height: 18px; stroke: var(--muted); stroke-width: 1.75; fill: none; flex-shrink: 0; }
.nav a:hover svg { stroke: var(--accent); }
/* Visible keyboard focus on the sidebar links — :focus-visible avoids
   the outline showing up on mouse clicks while still helping
   keyboard-only users orient. */
.nav a:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--accent) 50%, transparent);
  outline-offset: 2px;
}

.content {
  grid-area: content;
  padding: 1.5rem 2rem 3rem;
  min-width: 0;          /* let the grid track shrink below content's intrinsic width */
  overflow-x: hidden;    /* defense in depth — page itself never scrolls sideways */
}
.content > * + * { margin-top: 1.75rem; }

/* Mobile */
.btn.menu-btn {
  display: none;
  /* Square icon-only tap target. 44×44 CSS px matches the Apple HIG
     minimum (and Material's 48dp lands close too), so the control is
     comfortable on a thumb without looking bulky next to the brand. */
  width: 44px; height: 44px; padding: 0; line-height: 0;
  position: relative;
}
.btn.menu-btn svg { width: 26px; height: 26px; stroke-width: 2; }

/* Update-available indicator. Single rule reused on the hamburger
   button and on the Settings sidebar link — small accent-coloured
   dot tucked into the upper-right corner of the host element. The
   host needs `position: relative` (the menu-btn rule above sets
   it; the .nav anchors get it via the .has-update class).
   Aria-hidden lives in the markup; CSS just paints it. */
.has-update { position: relative; }
.has-update::after {
  content: "";
  position: absolute;
  top: 6px; right: 6px;
  width: 9px; height: 9px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 2px var(--surface);
  pointer-events: none;
}
@media (max-width: 820px) {
  .app {
    grid-template-columns: 1fr;
    grid-template-areas: "topbar" "content";
  }
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: 260px; z-index: 1500;
    transform: translateX(-100%);
    transition: transform .2s ease;
    box-shadow: var(--shadow-lg);
  }
  .sidebar.open { transform: translateX(0); }
  .topbar .brand { display: inline-flex; align-items: baseline; gap: .4rem; font-weight: 700; }
  .btn.menu-btn { display: inline-flex; }
  .content { padding: 1rem; }
  .topbar .crumb { display: none; }
  .topbar .user-details { display: none; }
}
.backdrop {
  display: none;
  position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 1400;
}
.backdrop.show { display: block; }

/* ---------- Buttons (Zonventure-style rounded pills) ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
  font: inherit; font-weight: 700; cursor: pointer; user-select: none;
  /* min-height ≥ tap target so a button with short text still passes
     the 44 px touch heuristic. Padding can shrink for .small / .ghost
     variants without dropping below the floor. */
  min-height: var(--tap-target);
  padding: .6rem 1.1rem; border-radius: var(--radius-pill);
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text);
  transition: background var(--anim), border-color var(--anim), transform 60ms, box-shadow var(--anim);
}
.btn:hover { background: var(--surface-2); border-color: var(--muted); }
.btn:active { transform: translateY(1px); }
.btn:disabled, .btn[disabled] {
  opacity: .55; cursor: not-allowed;
}
.btn.primary {
  background: var(--accent); border-color: var(--accent); color: var(--accent-fg);
  box-shadow: var(--shadow-soft);
}
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.danger:hover { background: var(--danger); color: var(--danger-fg); border-color: var(--danger); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: .4rem .6rem; }
.btn.ghost:hover { background: var(--surface-2); color: var(--accent); border-color: transparent; }
/* .btn.small drops the floor since these are typically inside
   already-tap-friendly contexts (toolbars, table action columns). The
   min-width keeps the hit area sane on touch devices regardless. */
.btn.small {
  padding: .35rem .75rem; font-size: var(--ts-sm);
  min-height: 2rem; min-width: 2rem;
}
.btn.warning {
  background: color-mix(in srgb, var(--accent) 14%, var(--surface));
  border-color: color-mix(in srgb, var(--accent) 35%, var(--border));
  color: var(--accent);
}
.btn.warning:hover { background: color-mix(in srgb, var(--accent) 22%, var(--surface)); }
.lifecycle-btn { font-size: 1rem; padding: .55rem 1.1rem; }
.btn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.75; fill: none; }
/* icon-only variant: square, no text, used in card action rows and
   anywhere the meaning is obvious from the glyph. Min-square sized so
   it stays thumb-friendly even when nested in dense lists. */
.btn.icon {
  padding: 0;
  width: 2.25rem; height: 2.25rem;
  min-width: 2.25rem; min-height: 2.25rem;
  display: inline-grid; place-items: center;
  gap: 0;
}
.btn.icon.small { width: 2rem; height: 2rem; min-width: 2rem; min-height: 2rem; }
.btn.icon svg { width: 18px; height: 18px; }
/* Action row in the top-right of a clickable card. Its buttons stop
   click propagation so they don't trigger the card's own click. */
.card-actions {
  display: inline-flex; gap: .35rem;
  align-items: center;
}

/* ---------- Cards ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  box-shadow: var(--shadow-soft);
  padding: 1.25rem;
  /* Wide content (mainly tables) becomes a horizontal scroll area inside the
     card rather than pushing the viewport wider. */
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.card h2 { margin-top: 0; }
.card + .card { margin-top: 1rem; }
/* Mirror card-to-card spacing when a .grid wrapper follows a card —
   the event-detail layout puts the Teams + Event-log cards inside a
   .grid.cols-2 right below the share bar / map card, so without
   this rule the grid (and its first card) is flush against the
   element above it. */
.card + .grid { margin-top: 1rem; }
.puzzle-list { margin-top: 1.25rem; }
.puzzle-card .md-preview { margin-top: .75rem; margin-bottom: .75rem; }
.card.clickable { cursor: pointer; transition: transform var(--anim), box-shadow var(--anim); }
.card.clickable:hover { transform: translateY(-2px) scale(1.015); box-shadow: var(--shadow-lg); }
/* Primary-tinted CTA card: used for "ready to schedule" assignments.
   Visually distinct from neutral browse-style cards so the dominant
   next action is obvious at a glance. */
.card.card-cta {
  background: color-mix(in srgb, var(--accent) 7%, var(--surface));
  border-color: color-mix(in srgb, var(--accent) 30%, var(--border));
}
.card.card-cta:hover { border-color: var(--accent); }

/* ---------- Adventure detail page ---------- */
/* Hero strip: cover (left), title + meta + pills (mid), CTA stack
   (right). flex-wraps cleanly to a stacked layout on phones rather
   than crushing the cover/title row at narrow widths. */
.adv-hero {
  display: flex; flex-wrap: wrap; gap: 1rem;
  align-items: center; margin: .75rem 0 1.25rem;
  padding: 1rem 1.25rem; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--border-soft);
}
.adv-hero-left { flex: 0 0 auto; }
.adv-hero-mid { flex: 1 1 16rem; min-width: 0; }
.adv-hero-mid h1 { line-height: 1.15; margin: 0; word-wrap: break-word; }
.adv-hero-meta {
  display: flex; flex-wrap: wrap; gap: .35rem .75rem;
  font-size: .9rem; margin-top: .15rem;
}
.adv-hero-pills {
  display: flex; flex-wrap: wrap; gap: .35rem;
  margin-top: .55rem;
}
.adv-hero-cta { flex: 0 0 auto; }
@media (max-width: 540px) {
  /* On phones the CTA stack drops below — full-width buttons read
     better than truncated/wrapping rows of icon+text. */
  .adv-hero-cta { width: 100%; }
  .adv-hero-cta .row { width: 100%; }
  .adv-hero-cta .btn { flex: 1 1 auto; }
}

/* Quick stats row — 3 tiles by default, collapses to 2 on phones.
   Each tile is a small card with a big number + uppercase label. */
.adv-stats {
  display: grid; gap: .55rem;
  grid-template-columns: repeat(3, 1fr);
  margin: 0 0 1rem;
}
@media (max-width: 540px) {
  .adv-stats { grid-template-columns: repeat(2, 1fr); }
}
.adv-stat {
  background: var(--surface); border: 1px solid var(--border-soft);
  border-radius: var(--radius); padding: .65rem .85rem;
  text-align: center;
}
.adv-stat-v {
  font-size: 1.4rem; font-weight: 700; color: var(--accent);
  line-height: 1.1;
}
.adv-stat-l {
  font-size: .72rem; color: var(--muted); text-transform: uppercase;
  letter-spacing: .05em; margin-top: .15rem;
}

/* Description + intro + outro block. Quiet typography — these are
   author copy, not page chrome. */
.adv-story { margin: 0 0 1.25rem; }
.adv-story .adv-desc {
  font-size: 1.05rem; line-height: 1.55; color: var(--ink);
  margin: 0 0 1rem;
}
.adv-story .adv-section-h {
  font-size: .8rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .06em; color: var(--muted);
  margin: 1rem 0 .35rem;
}
.adv-story .adv-prose {
  white-space: pre-wrap; line-height: 1.55;
  background: var(--surface-2); border-radius: var(--radius);
  padding: .75rem 1rem; border: 1px solid var(--border-soft);
}

/* Adventure-wide map. Sized so the OSM tiles don't dominate the
   page on a desktop but still convey shape on a phone. */
.adv-map-host {
  width: 100%; height: 18rem;
  border-radius: var(--radius);
  border: 1px solid var(--border-soft);
  background: var(--surface-2);
}

/* Puzzle cards block. Stacked, with a stronger gap than the page's
   default card+card so each puzzle reads as a discrete unit. */
.adv-puzzles { display: flex; flex-direction: column; gap: 1rem; }
.adv-pz-card { padding: 1rem 1.15rem; }
.adv-pz-head {
  display: flex; align-items: center; gap: .55rem; flex-wrap: wrap;
  margin: 0 0 .5rem;
}
.adv-pz-num {
  display: inline-grid; place-items: center;
  width: 1.6rem; height: 1.6rem;
  border-radius: 999px;
  background: color-mix(in srgb, var(--accent) 14%, var(--surface));
  color: var(--accent); font-weight: 700; font-size: .85rem;
  flex: 0 0 auto;
}
.adv-pz-title { font-size: 1.05rem; }
.adv-pz-prompt { line-height: 1.55; margin: 0 0 .5rem; }
/* auto-fit with a 1fr max meant a single image inflated its column
   to the whole card width; the cap keeps thumbnails legible on wide
   displays while still letting several pack across one row. 360px
   lets a single image fill a typical phone screen (~320–360 px of
   card content area on a 390 px viewport) without leaving an empty
   gutter on the right. */
.adv-pz-images {
  display: grid; gap: .4rem;
  grid-template-columns: repeat(auto-fit, minmax(140px, 360px));
  margin: .5rem 0;
}
.adv-pz-images img {
  width: 100%; height: auto; display: block;
  border-radius: 8px; border: 1px solid var(--border-soft);
}
.adv-pz-hints { display: flex; flex-direction: column; gap: .55rem; margin-top: .5rem; }
.adv-pz-hint {
  background: var(--surface-2); border: 1px solid var(--border-soft);
  border-radius: var(--radius); padding: .55rem .75rem;
}
.adv-pz-hint-head {
  font-size: .72rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .04em; margin-bottom: .25rem;
}
.adv-pz-hint-body p:first-child { margin-top: 0; }
.adv-pz-hint-body p:last-child  { margin-bottom: 0; }
.adv-pz-disclosure {
  margin-top: .65rem;
  border-top: 1px solid var(--border-soft); padding-top: .65rem;
}
.adv-pz-disclosure summary {
  cursor: pointer; font-size: .85rem; font-weight: 600;
  color: var(--muted);
}
.adv-pz-disclosure summary:hover { color: var(--accent); }

/* ---------- Event detail page ---------- */
/* Adventure summary strip — sits below the lifecycle bar so the
   arranger always sees which adventure they're running, with a
   one-tap link to the adventure detail page for the full content. */
.event-adv-strip {
  display: flex; align-items: center; gap: .75rem;
  padding: .55rem .75rem; margin: 0 0 .75rem;
  background: var(--surface); border: 1px solid var(--border-soft);
  border-radius: var(--radius);
}
.event-adv-meta { flex: 1 1 auto; min-width: 0; }
.event-adv-title {
  font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* The cover stays at 40px on all viewports — it was previously
   hidden under 540px to "save space", but that triggered on
   laptop devtools-open layouts too, so the icon went missing for
   users who weren't even on a phone. The 40-px square is small
   enough to fit on any reasonable screen. */

/* Post-event results card — finishing order, recap links per row,
   "didn't finish" teams below. Uses an <ol> so screen readers
   announce the placement. */
.results-card .results-list {
  list-style: none; padding: 0; margin: 0;
}
.results-card .results-list li {
  display: flex; align-items: center; gap: .55rem;
  padding: .4rem 0;
  border-bottom: 1px solid var(--border-soft);
}
.results-card .results-list li:last-child { border-bottom: 0; }
.results-card .results-rank {
  flex: 0 0 auto;
  font-weight: 700; color: var(--accent);
  min-width: 2.25rem;
}
.results-card .results-name { flex: 0 1 auto; }
.results-card .results-recap {
  margin-left: auto; flex: 0 0 auto;
  font-size: .85rem; font-weight: 600;
  display: inline-flex; align-items: center; gap: .25rem;
}
.results-card .results-dnf .results-name { color: var(--muted); }

/* Event log scroll cap — the activity feed can run very long on a
   completed event; capping at 50vh prevents it from pushing the
   teams card off-screen on mobile. The card-level overflow:auto
   from .card already handles horizontal; this is the vertical
   complement. */
.event-log-body {
  max-height: 50vh;
  overflow-y: auto;
}

/* Sticky top bar on the event-detail view. Keeps Start/Pause/Resume
   within reach during a live event no matter how far the arranger
   has scrolled into the teams list or event log. */
.lifecycle-bar {
  position: sticky; top: 0; z-index: 50;
  background: var(--bg);
  padding: .75rem 0;
  margin: -.25rem 0 1rem;
  border-bottom: 1px solid var(--border-soft);
  display: flex; flex-wrap: wrap; gap: .75rem;
  justify-content: space-between; align-items: center;
}
.lifecycle-bar h1 { margin: 0; font-size: 1.3rem; }
.lifecycle-left {
  display: flex; gap: .75rem; align-items: center; flex-wrap: wrap;
}

/* Stuck team row: amber tint + left border, signal-but-not-alarm. */
tr.row-stuck {
  background: color-mix(in srgb, var(--accent) 8%, transparent);
  box-shadow: inset 4px 0 0 0 var(--accent);
}

.grid { display: grid; gap: 1rem; }
.grid.cols-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.grid.cols-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
/* stats are small enough to stay side-by-side even on very narrow phones */
.grid.stats { grid-template-columns: repeat(3, minmax(0,1fr)); gap: 1rem; }
@media (max-width: 820px) {
  .grid.cols-3, .grid.cols-2 { grid-template-columns: 1fr; }
}

/* Race-control side-by-side panels (leaderboard + activity feed). The
   default .grid.cols-2 lets each child grow to its content, which on
   the control view leaves the activity card capped at the .event-log-body
   50vh while the leaderboard card stretches to however many rows it
   has — visibly mismatched heights. .control-grid pins both cards to
   the same max-height and scrolls their bodies internally so the
   panels read as a matched pair. */
.control-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1rem;
  align-items: stretch;
}
.control-grid > .card {
  display: flex;
  flex-direction: column;
  max-height: 60vh;
  min-height: 0;
}
.control-grid > .card > h2 { flex: 0 0 auto; }
.control-grid .control-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
}
@media (max-width: 820px) {
  .control-grid { grid-template-columns: 1fr; }
  .control-grid > .card { max-height: 50vh; }
}

.stat {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  padding: 1.1rem 1rem;
  box-shadow: var(--shadow-soft);
  text-align: center;
}
.stat .label {
  color: var(--muted);
  font-size: clamp(.6rem, 1.6vw, .75rem);
  text-transform: uppercase; letter-spacing: .07em; font-weight: 700;
  white-space: nowrap;
}
.stat .value {
  font-size: clamp(1.5rem, 6vw, 2.4rem);
  font-weight: 700; margin-top: .25rem; color: var(--ink);
  line-height: 1;
}
.stat.accent .value { color: var(--accent); }
@media (max-width: 560px) {
  .stat { padding: .85rem .75rem; }
}

/* ---------- Forms ---------- */
label.field { display: block; margin-bottom: .9rem; }
label.field > span {
  display: block; margin-bottom: .3rem;
  color: var(--ink); font-size: .8rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .04em;
}
input, select, textarea {
  font: inherit; width: 100%;
  padding: .65rem .85rem;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  box-shadow: inset 0 0 0 1px var(--border-soft);
}
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
}
/* Reset the form-control treatment for checkboxes and radios — the
   width:100% + padding + box-shadow above makes them stretch across
   their flex containers and drift away from their labels. Restore
   native sizing, kill the padding/border/shadow, and pin them so
   they sit flush against the adjacent label text. flex-shrink:0
   keeps the box from being squashed when the label wraps. */
input[type="checkbox"], input[type="radio"] {
  width: auto; flex: 0 0 auto;
  padding: 0; background: none; border: none; box-shadow: none;
  margin: 0; vertical-align: middle;
}
input[type="checkbox"]:focus, input[type="radio"]:focus {
  outline: 2px solid var(--accent); outline-offset: 2px;
  box-shadow: none;
}
textarea { min-height: 80px; resize: vertical; font-family: ui-monospace, monospace; }

/* ---------- Table ---------- */
.table {
  width: 100%;
  border-collapse: separate; border-spacing: 0;
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-soft);
}
.table th, .table td { padding: .7rem 1rem; text-align: left; vertical-align: middle; }
.table th {
  background: var(--surface-2); color: var(--ink);
  font-weight: 700; font-size: var(--ts-xs); text-transform: uppercase; letter-spacing: .06em;
  border-bottom: 1px solid var(--border);
}
.table tbody tr + tr td { border-top: 1px solid var(--border-soft); }
.table tbody tr:hover { background: var(--surface-2); }
.table tbody tr:nth-child(odd) { background: color-mix(in srgb, var(--surface-2) 45%, transparent); }
.table tbody tr:nth-child(odd):hover { background: var(--surface-2); }
.table td .row { display: flex; gap: .35rem; }
@media (max-width: 820px) {
  .table .hide-narrow { display: none; }
}

/* ---------- Bits ---------- */
.row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }
/* Header rows (a card title next to an action button) shouldn't carry
   the heading's default bottom margin — align-items:center would then
   nudge the title visually upward relative to the button. Zero it here
   and give the row itself a small bottom margin so it doesn't jam into
   the content that follows. */
.row > h1, .row > h2, .row > h3 { margin: 0; }
.card > .row.between { margin-bottom: .75rem; }
.muted { color: var(--muted); }
.err { color: var(--danger); }
.ok { color: var(--success); }
.mono { font-family: ui-monospace, SFMono-Regular, monospace; font-size: .9em; }

.pill {
  display: inline-flex; align-items: center;
  padding: .15rem .65rem;
  font-size: .7rem; font-weight: 700;
  border-radius: 999px;
  background: var(--surface-2); color: var(--muted);
  text-transform: uppercase; letter-spacing: .06em;
}
.pill.accent { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
.pill.danger { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }
.pill.success { background: color-mix(in srgb, var(--success) 15%, transparent); color: var(--success); }
.pill.warning { background: color-mix(in srgb, var(--warning) 18%, transparent); color: var(--warning); }

.chip {
  display: inline-flex; align-items: center; gap: .25rem;
  padding: .2rem .65rem; background: var(--surface-2);
  border: 1px solid var(--border-soft); border-radius: 999px;
  font-size: .8rem; font-weight: 600;
}
.chip button {
  background: none; border: none; cursor: pointer; padding: 0;
  color: var(--muted); font-size: 1rem; line-height: 1;
}
.chip button:hover { color: var(--danger); }
/* Semantic chip variants: tinted background + border so a green
   "HTTP 200" or red "HTTP 404" reads at a glance instead of looking
   neutral. Plain rgba (not color-mix) so older browsers — and any
   embedding that strips modern CSS — still render the tint. */
.chip.ok {
  color: var(--success) !important;
  background: rgba(66, 154, 63, 0.16) !important;
  border-color: rgba(66, 154, 63, 0.45) !important;
}
.chip.err {
  color: var(--danger) !important;
  background: rgba(255, 82, 82, 0.18) !important;
  border-color: rgba(255, 82, 82, 0.5) !important;
}
/* Unverified org member: amber tint so it stands out at a glance in
   a long member list, plus an inline "verify" action button. The
   action looks like a small text link rather than a destructive
   button (× style above) since manual verification is rare and
   should require deliberate action. */
.chip.chip-unverified {
  background: rgba(255, 196, 87, 0.18);
  border-color: rgba(255, 196, 87, 0.55);
}
.chip .chip-verify {
  font-size: .7rem; font-weight: 700;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: .04em;
  padding: 0 .25rem;
}
.chip .chip-verify:hover { color: var(--accent-deep, var(--accent)); text-decoration: underline; }

.empty {
  text-align: center; padding: 3rem 1rem; color: var(--muted);
  background: var(--surface-2); border-radius: var(--radius);
  border: 1px dashed var(--border);
}

/* ---------- Modal ----------
   Leaflet assigns its own layers z-index up to ~1000, so the modal and
   toasts have to sit clearly above that to stay on top of the event map. */
.modal-back {
  position: fixed; inset: 0; background: rgba(0,0,0,.45);
  display: flex; align-items: center; justify-content: center;
  z-index: 2000; padding: 1rem;
}
.modal {
  background: var(--surface); border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  width: 100%; max-width: 420px;
  padding: 1.5rem;
  max-height: calc(100vh - 2rem);
  overflow-y: auto;
  position: relative;
}
.modal.wide { max-width: 560px; }
.modal.xwide { max-width: 720px; }
.modal h2 { margin-top: 0; padding-right: 2rem; }
.modal-close {
  position: absolute;
  top: .5rem; right: .5rem;
  width: 2rem; height: 2rem;
  background: transparent;
  border: 0;
  border-radius: 999px;
  padding: 0;
  font-size: 1.5rem;
  line-height: 1;
  color: var(--muted);
  cursor: pointer;
  box-shadow: none;
  min-height: 0;
}
.modal-close:hover { background: var(--surface-2); color: var(--ink); }

/* Fullscreen-map overlay (.fsmap-*) styles live in the shared
   /assets/fsmap.css — pulled in via <link> at the top of the
   page so both arrange.html and play.html stay in lockstep. */

/* ---------- WYSIWYG puzzle editor ----------
   The preview card mirrors play.html's puzzle layout (title, images,
   prompt, hint, submit dock) so the arranger sees roughly what the
   player will see. The inputs look like plain text until hovered or
   focused, then show a dashed editable affordance. */
/* Markdown preview pane shown under textareas the player's client
   will render as rich text. Server-rendered via the /markdown/preview
   endpoint so layout matches the runtime exactly. The pane looks
   card-like and sits flush against the textarea above. */
.md-preview {
  margin-top: -.35rem;
  padding: .6rem .75rem;
  border: 1px solid var(--border-soft);
  border-radius: 8px;
  background: var(--surface-2);
  font-size: .95rem; line-height: 1.5;
  color: var(--ink);
  min-height: 2.25rem;
}
.md-preview p { margin: 0 0 .5rem; }
.md-preview p:last-child { margin-bottom: 0; }
.md-preview ul, .md-preview ol { padding-left: 1.2rem; margin: .25rem 0 .5rem; }
.md-preview li { margin: .15rem 0; }
.md-preview a { color: var(--accent); }
.md-preview code {
  background: var(--surface); border: 1px solid var(--border-soft);
  padding: .05em .3em; border-radius: 4px;
  font: .9em ui-monospace, SFMono-Regular, Menlo, monospace;
}
.md-preview h1, .md-preview h2, .md-preview h3 {
  margin: .25rem 0 .4rem; line-height: 1.2;
}
.md-preview h1 { font-size: 1.35rem; }
.md-preview h2 { font-size: var(--ts-lg); }
.md-preview h3 { font-size: 1rem; }
.md-preview.compact { padding: .4rem .55rem; font-size: .9rem; }

/* Click-to-edit markdown field. The view (.md-field-view) and the
   editor (.md-field-edit) share padding/font so swapping between
   them doesn't reflow the form. Only one is visible at a time —
   JS toggles style.display via enterEdit / leaveEdit. */
.md-field {
  position: relative;
  border: 1px solid var(--border-soft);
  border-radius: 8px;
  background: var(--surface-2);
  min-height: 2.5rem;
  transition: border-color .15s ease, background-color .15s ease;
}
.md-field:hover, .md-field:focus-within {
  border-color: var(--accent);
  background: var(--surface);
}
.md-field-view {
  padding: .6rem .75rem;
  cursor: text;
  font-size: .95rem; line-height: 1.5;
  color: var(--ink);
  min-height: 2.5rem;
}
/* Pencil affordance in the corner so authors discover that the
   rendered markdown is clickable to edit. Always faintly visible
   (touch devices have no hover state) and brightens on hover/focus
   for the same discoverability cue mouse users expect. The icon
   itself is just a unicode pencil — no dependency, no SVG to localise. */
.md-field-view::after {
  content: '✎';
  position: absolute;
  top: .35rem; right: .55rem;
  font-size: var(--ts-sm);
  color: var(--muted);
  opacity: .35;
  pointer-events: none;
  transition: opacity .15s ease;
}
.md-field:hover .md-field-view::after,
.md-field:focus-within .md-field-view::after { opacity: .8; }
.md-field-view p { margin: 0 0 .5rem; }
.md-field-view p:last-child { margin-bottom: 0; }
.md-field-view ul, .md-field-view ol { padding-left: 1.25rem; margin: .25rem 0 .5rem; }
.md-field-view li { margin: .15rem 0; }
.md-field-view a { color: var(--accent); }
.md-field-view code {
  background: var(--surface); border: 1px solid var(--border-soft);
  padding: .05em .3em; border-radius: 4px;
  font: .9em ui-monospace, SFMono-Regular, Menlo, monospace;
}
.md-field-view h1, .md-field-view h2, .md-field-view h3 {
  margin: .25rem 0 .4rem; line-height: 1.2;
}
.md-field-view h1 { font-size: 1.3rem; }
.md-field-view h2 { font-size: var(--ts-lg); }
.md-field-view h3 { font-size: 1rem; }
.md-field-view table { width: 100%; border-collapse: collapse; margin: .4rem 0; font-size: .92rem; }
.md-field-view th, .md-field-view td {
  border: 1px solid var(--border-soft);
  padding: .3rem .5rem; text-align: left;
}
.md-field-view th { background: var(--surface); font-weight: 700; }
/* Empty-state affordance: muted italic text invites a click. */
.md-field-placeholder { color: var(--muted); font-style: italic; }
/* Pre-wrap flash while the server renders the new content after an
   edit — preserves the author's newlines so the swap doesn't hop. */
.md-field-pending { white-space: pre-wrap; }
.md-field-edit {
  display: block; width: 100%;
  padding: .6rem .75rem; margin: 0;
  border: none; border-radius: 8px;
  background: transparent;
  font: inherit; color: inherit;
  font-size: .95rem; line-height: 1.5;
  resize: vertical;
  min-height: 2.5rem; overflow: hidden;
}
.md-field-edit:focus { outline: none; }
.md-field.compact .md-field-view, .md-field.compact .md-field-edit {
  padding: .4rem .55rem; font-size: .9rem;
}

/* Hint-list editor: one row per author-defined hint, stacked. Each
   row has a small numbered head with the unlock-delay input, a
   markdown textarea, and the shared md-preview underneath so the
   rendered output is visible at all times. */
.hint-rows { display: flex; flex-direction: column; gap: .5rem; margin-bottom: .5rem; }
.hint-row {
  border: 1px solid var(--border-soft);
  border-radius: 8px;
  padding: .55rem .65rem;
  background: var(--surface);
  display: flex; flex-direction: column; gap: .35rem;
}
.hint-row textarea {
  width: 100%; resize: vertical;
  font: inherit; color: inherit;
  padding: .4rem .55rem;
  border: 1px solid var(--border-soft); border-radius: 6px;
  background: var(--surface-2);
}
.hint-row-head {
  display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
}
.hint-row-num {
  display: inline-grid; place-items: center;
  width: 1.6rem; height: 1.6rem; border-radius: 50%;
  background: var(--accent); color: var(--accent-fg);
  font-weight: 700; font-size: var(--ts-sm);
  flex-shrink: 0;
}
.hint-row-delay {
  display: inline-flex; align-items: center; gap: .35rem;
  flex-wrap: wrap;
}
.hint-row-delay input {
  padding: .25rem .4rem;
  border: 1px solid var(--border-soft); border-radius: 6px;
  background: var(--surface-2);
  font: inherit; color: inherit;
}
.hint-row-head > button.btn { margin-left: auto; }
/* GFM tables — goldmark emits plain <table>/<th>/<td>, so give
   the editor pane a matching light-chrome treatment. */
.md-preview table { width: 100%; border-collapse: collapse; margin: .4rem 0; font-size: .92rem; }
.md-preview th, .md-preview td {
  border: 1px solid var(--border-soft);
  padding: .3rem .5rem; text-align: left;
}
.md-preview th { background: var(--surface); font-weight: 700; }

.puzzle-editor {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 1.25rem;
  border: 1px solid var(--border-soft);
  box-shadow: var(--shadow);
  margin-bottom: 1rem;
}
.puzzle-editor textarea.pe {
  display: block; width: 100%;
  background: transparent;
  /* Dashed outline is always visible so it's obvious the field is
     editable. Focus lifts it to the accent colour + a soft glow. */
  border: 1px dashed var(--border-soft);
  padding: .35rem .5rem; margin: 0;
  border-radius: 6px;
  /* Clear the inheritable globals from the form `textarea` block:
     ui-monospace font, 80px min-height, the inset box-shadow border. */
  font: inherit; color: inherit;
  min-height: 0;
  box-shadow: none;
  resize: none; overflow: hidden;
  transition: border-color 120ms, background 120ms, box-shadow 120ms;
}
.puzzle-editor textarea.pe:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--surface-2);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
}
/* The slot-specific rules use `textarea.pe-*` (not `.pe-*`) so they beat
   `.puzzle-editor textarea.pe`'s `font: inherit` on specificity. */
.puzzle-editor textarea.pe-title {
  /* Matches play.html's h3: 1.05rem, brand-secondary tint. Font-family is
     the body font (inherited via `font: inherit`), not the brand font. */
  font-size: 1.05rem; font-weight: 700;
  color: var(--accent-secondary);
  margin: 0 0 .5rem;
}
.puzzle-editor textarea.pe-prompt {
  /* Matches play.html's .prompt. */
  font-size: 1.1rem; line-height: 1.55;
  white-space: pre-wrap; color: var(--ink);
}
.puzzle-editor textarea.pe-hint {
  color: var(--muted);
}
.puzzle-editor .pe-hint-row {
  display: flex; gap: .35rem; align-items: flex-start; margin-top: .5rem;
}
.puzzle-editor .pe-hint-row .tag {
  color: var(--muted); font-weight: 600;
  padding: .35rem 0; flex-shrink: 0;
}
/* Image strip — shared between the puzzle prompt's images block
   and the per-hint images block. Originally scoped to
   .puzzle-editor; unscoped here so the same DOM shape lights up
   identically wherever it's mounted (the hint editor lives under
   .puzzle-settings, not .puzzle-editor, so it would otherwise
   render unstyled). */
.pe-images {
  display: grid; gap: .5rem; margin: .5rem 0;
}
.pe-image-wrap { position: relative; }
.pe-image {
  width: 100%; height: auto; display: block;
  border-radius: var(--radius);
  border: 1px solid var(--border-soft);
}
.pe-image-remove {
  position: absolute; top: .5rem; right: .5rem;
}
.pe-image-alt {
  width: 100%; margin-top: .35rem; padding: .35rem .55rem;
  font-size: .85rem; box-sizing: border-box;
  border: 1px solid var(--border-soft); border-radius: var(--radius);
  background: var(--surface);
}
/* Add-image tile. Used by both the puzzle prompt's image strip
   (rendered as a <label htmlFor=...>) and the per-hint image strip
   (rendered as a <button>) — selector is unscoped so both surfaces
   pick it up. The font/background/appearance resets cancel the
   UA's default button chrome so the <button> variant lines up
   pixel-for-pixel with the <label> variant. */
.pe-image-add {
  display: flex; align-items: center; justify-content: center; gap: .35rem;
  padding: .35rem .7rem;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  color: var(--muted); cursor: pointer;
  font: inherit; font-size: var(--ts-sm);
  background: transparent;
  appearance: none;
  -webkit-appearance: none;
  transition: background 120ms, border-color 120ms, color 120ms;
}
.pe-image-add svg {
  width: 14px; height: 14px;
}
.pe-image-add:hover {
  background: var(--surface-2);
  border-color: var(--accent);
  color: var(--accent);
}
.pe-image-add.disabled {
  cursor: not-allowed; opacity: .6;
}
.pe-image-add.disabled:hover {
  background: transparent; border-color: var(--border); color: var(--muted);
}

/* Audio strip — one row per attached clip. Native <audio controls>
   spans the available width and the description textarea sits
   beneath it as a transcript fallback for non-hearing users. The
   delete button anchors top-right just like .pe-image-remove. */
.pe-audio { display: flex; flex-direction: column; gap: .5rem; margin: .5rem 0; }
.pe-audio-wrap {
  position: relative;
  padding: .5rem .55rem .55rem;
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  background: var(--surface);
}
.pe-audio-wrap audio { width: 100%; }
.pe-audio-desc {
  width: 100%; margin-top: .35rem; padding: .35rem .55rem;
  font: inherit; font-size: .85rem; box-sizing: border-box;
  border: 1px solid var(--border-soft); border-radius: var(--radius);
  background: var(--surface);
  resize: vertical;
}
.pe-audio-remove {
  position: absolute; top: .5rem; right: .5rem;
}

/* Accepted-answers list: one row per literal-or-regex entry.
   The Regex toggle is intentionally inline rather than a separate
   tab so an arranger can flip a single answer to a pattern without
   leaving the row. Regex entries get monospaced text + a blue tint
   so the visual difference between "the player must type Kjell" and
   "the player must match this pattern" is unmissable while
   scanning the field. */
.pe-answers { display: flex; flex-direction: column; gap: .35rem; }
.pe-answer-row {
  display: flex; align-items: center; gap: .5rem;
}
.pe-answer-row .pe-answer-text { flex: 1 1 0; min-width: 0; }
.pe-answer-row .pe-answer-text.pe-answer-regex {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  background: color-mix(in srgb, var(--accent) 6%, var(--surface));
  border-color: color-mix(in srgb, var(--accent) 30%, var(--border));
}
.pe-answer-toggle {
  display: inline-flex; align-items: center; gap: .35rem;
  font-size: .8rem; color: var(--muted); white-space: nowrap;
  cursor: pointer; user-select: none;
}
.pe-answer-toggle input { width: auto; }
.pe-answers-wrap > .btn { margin-top: .35rem; }
/* Regex chip in puzzle-card listings: monospaced + accent border so
   the prefix `re:` reads as a label and the pattern reads as code. */
.chip.chip-regex {
  border-color: color-mix(in srgb, var(--accent) 35%, var(--border));
  background: color-mix(in srgb, var(--accent) 6%, var(--surface));
}
/* Library sub-nav: tabs across Adventures and Puzzles, shared by both
   views so you can jump between the two without going through the
   sidebar. Visually a thin strip sitting under the page heading. */
.lib-tabs {
  display: flex; gap: .25rem;
  border-bottom: 1px solid var(--border-soft);
  margin: 0 0 1rem;
  /* Phones routinely run out of width on tab strips with 4+ entries
     (Adventures / Catalog / Templates / etc.). Allowing horizontal
     scroll instead of wrapping keeps every tab a single row, with
     the active one easy to flick to. nowrap on the children
     prevents accidental wrapping on narrow viewports; the
     -webkit-overflow-scrolling kicks in momentum scrolling on
     iOS Safari which otherwise feels stuck. */
  flex-wrap: nowrap;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  /* Hide the scrollbar to match the chrome of slack-style tab
     strips — we still scroll, but the bar itself is invisible
     unless the user is actively dragging. */
  scrollbar-width: none;
}
.lib-tabs::-webkit-scrollbar { display: none; }
.lib-tab {
  display: inline-block;
  padding: .5rem .9rem;
  text-decoration: none;
  color: var(--muted);
  font-weight: 700; font-size: .9rem;
  border-bottom: 2px solid transparent;
  transition: color .15s, border-color .15s;
  /* Without explicit no-shrink the tab labels would compress on
     narrow viewports until the scrollbar never engages — every
     label squeezes into ellipsis territory instead. */
  flex: 0 0 auto;
  white-space: nowrap;
}
.lib-tab:hover { color: var(--text); }
.lib-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

/* Split-button pattern: a primary action with a chevron that reveals
   a small popover of alternate options. Used for "Add puzzle" where
   the secondary path is "Copy from library…". */
.split-btn { position: relative; display: inline-flex; }
.split-btn > .btn.primary { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.split-btn > .split-btn-toggle {
  border-top-left-radius: 0; border-bottom-left-radius: 0;
  padding-left: .4rem; padding-right: .4rem;
  border-left: 1px solid rgba(255,255,255,.2);
  min-width: 0;
}
.split-btn-menu {
  display: none;
  position: absolute; top: calc(100% + .25rem); right: 0;
  background: var(--surface); border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-lg);
  min-width: 12rem;
  padding: .25rem; z-index: 50;
}
.split-btn-menu.open { display: block; }
.split-btn-item {
  display: block; width: 100%; text-align: left;
  padding: .45rem .65rem;
  background: transparent; border: none; color: var(--text);
  font: inherit; cursor: pointer; border-radius: 6px;
}
.split-btn-item:hover { background: var(--surface-2); }

/* In-modal tabs: same feel as .lib-tabs but scoped to dialogs so we can
   break a crowded form (Details / Copy / Branding) into bite-sized
   panes without a tall scroll. */
.tab-strip {
  display: flex; gap: .25rem;
  border-bottom: 1px solid var(--border-soft);
  margin: 0 0 1rem;
  /* Same horizontal-scroll treatment as .lib-tabs — modals on
     phones run out of width even faster than the top-level page,
     and a wrapping tab strip with 5 entries breaks the dialog
     layout. */
  flex-wrap: nowrap;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.tab-strip::-webkit-scrollbar { display: none; }
.tab-btn {
  padding: .5rem .9rem;
  background: transparent; border: none;
  color: var(--muted);
  font: inherit; font-weight: 700; font-size: .9rem;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  transition: color .15s, border-color .15s;
  flex: 0 0 auto;
  white-space: nowrap;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}
.tab-pane { display: none; }
.tab-pane.active { display: block; }

/* Collapsible share-run card: disclosure chevron follows the open state.
   list-style:none on <summary> strips the default triangle so we can
   paint our own that matches the arrange surface colours. */
.share-bar > summary::-webkit-details-marker { display: none; }
.share-bar > summary::before {
  content: '▸';
  color: var(--muted);
  font-size: .8rem;
  transition: transform .15s;
  display: inline-block;
}
.share-bar[open] > summary::before { transform: rotate(90deg); }

/* Distribute-links panel: scroll region capped so 100 teams don't push
   the map + event log below the fold. Inline player links appear in a
   faintly-indented sub-block so the captain/member hierarchy reads at
   a glance. */
.tl-scroll {
  max-height: 24rem;
  overflow-y: auto;
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
}
.tl-row {
  padding: .45rem .6rem;
  border-bottom: 1px solid var(--border-soft);
}
.tl-row:last-child { border-bottom: none; }
.tl-head {
  display: flex; gap: .5rem; align-items: center;
}
.tl-sw {
  width: 10px; height: 10px; border-radius: 50%;
  flex: 0 0 auto;
  box-shadow: 0 0 0 1px var(--border-soft);
}
.tl-team {
  flex: 0 0 auto; min-width: 7rem; max-width: 12rem;
  font-weight: 600; font-size: .9rem;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tl-url {
  flex: 1 1 auto; min-width: 0;
  margin: 0; padding: .35rem .55rem;
  font-family: ui-monospace, SFMono-Regular, monospace;
  font-size: .8rem;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border-soft); border-radius: 6px;
  box-shadow: none;
}
.tl-url-sm { font-size: var(--ts-xs); padding: .25rem .45rem; }
.tl-toggle {
  flex: 0 0 auto;
  display: inline-flex; align-items: center; gap: .3rem;
  padding: .25rem .55rem;
  font-size: .8rem; font-variant-numeric: tabular-nums;
}
.tl-caret { font-size: var(--ts-xs); color: var(--muted); }
.tl-members { margin: .35rem 0 .1rem 1.2rem; }
.tl-member-row {
  display: flex; gap: .4rem; align-items: center;
  margin: .2rem 0;
}
.tl-member-name {
  flex: 0 0 auto; min-width: 5.5rem;
  font-size: .8rem;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.puzzle-settings { margin-top: 1rem; }
.puzzle-settings h3 {
  font-size: var(--ts-sm); margin: 0 0 .6rem;
  color: var(--muted); font-weight: 700;
  text-transform: uppercase; letter-spacing: .06em;
}

/* Location editor embedded in the puzzle-settings panel.
   The map itself is a Leaflet instance; the radius-drag handle is a
   divIcon styled to look like a resize grip. */
.pe-loc-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: .5rem; margin: 0 0 .5rem;
}
.pe-map {
  height: 260px;
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--border-soft);
  margin-bottom: .5rem;
}
.pe-loc-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: .5rem;
}
.pe-radius-handle {
  width: 22px; height: 22px;
  background: #ad1357; color: #fff;
  border: 2px solid #fff;
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 12px; font-weight: 800;
  box-shadow: 0 0 0 1px rgba(0,0,0,.25);
  cursor: ew-resize;
}

/* Floating action button for the Puzzles view. Sits above the content
   in the bottom-right corner so a phone-in-hand admin can tap it
   without scrolling. */
.fab {
  position: fixed;
  right: calc(1rem + env(safe-area-inset-right));
  bottom: calc(1rem + env(safe-area-inset-bottom));
  width: 56px; height: 56px;
  border-radius: 50%;
  background: var(--accent); color: var(--accent-fg);
  border: none; cursor: pointer;
  box-shadow: 0 8px 24px rgba(0,0,0,.25), 0 2px 8px rgba(0,0,0,.15);
  display: grid; place-items: center;
  z-index: 500;
}
.fab svg { width: 24px; height: 24px; }
.fab:hover { background: var(--accent-hover); }
.fab:disabled { opacity: .6; cursor: wait; }

/* Puzzle timeline: numbered pills at the top of the editor modal so an
   arranger can jump between puzzles without closing the dialog. The
   trailing "+" pill creates a new puzzle. */
.puzzle-timeline {
  display: flex; gap: .35rem; align-items: center; flex-wrap: wrap;
  margin: 0 0 1rem;
  padding-bottom: .75rem;
  border-bottom: 1px solid var(--border-soft);
}
.pt-pill {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 2rem; max-width: 14rem; height: 2rem; padding: 0 .75rem;
  border-radius: 999px;
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border-soft);
  font: inherit; font-weight: 700; font-variant-numeric: tabular-nums;
  cursor: pointer;
  overflow: hidden;
  transition: border-color 120ms, background 120ms, color 120ms;
}
.pt-pill .pt-label {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pt-pill.untitled .pt-label { font-style: italic; font-weight: 500; color: var(--muted); }
.pt-pill.current.untitled .pt-label { color: var(--accent-fg); }
.pt-pill:hover { border-color: var(--accent); }
.pt-pill.current {
  background: var(--accent); color: var(--accent-fg);
  border-color: var(--accent); cursor: default;
}
.pt-pill.current:hover { border-color: var(--accent); }
.pt-plus {
  color: var(--muted);
  border-style: dashed;
}
.pt-pill.disabled {
  opacity: .45;
  text-decoration: line-through;
  background: transparent;
  border-style: dashed;
}
.pt-pill.current.disabled { opacity: .7; }
/* Arrow between timeline pills — a pure-decoration sequence hint.
   pointer-events: none lets drag-over fall through to the pills. */
.pt-arrow {
  color: var(--muted);
  font-size: 1rem;
  line-height: 1;
  user-select: none;
  pointer-events: none;
}

/* Server logs terminal. Fills the remaining height of the content
   area and gets a subtle inset border so the dark xterm square looks
   like a mounted console rather than a floating blob. */
.zv-log-term {
  height: calc(100vh - 18rem);
  min-height: 320px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-soft);
  padding: .35rem;
  background: #0e1420;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.35);
  overflow: hidden;
}
.zv-log-sel {
  font: inherit; color: var(--text);
  padding: .3rem .5rem;
  background: var(--surface-2);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm);
  box-shadow: none; cursor: pointer;
}
.zv-log-sel:hover { border-color: var(--muted); }

/* Audit table — dense, monospaced timestamp/IP, status pill on
   success/failure. No fancy treatments; this is a forensics view. */
.audit-table {
  width: 100%;
  border-collapse: collapse;
  font-size: .92rem;
}
.audit-table thead th {
  text-align: left;
  padding: .35rem .55rem;
  border-bottom: 1px solid var(--border-soft);
  color: var(--muted);
  font-weight: 600;
  font-size: .82rem;
  text-transform: uppercase;
  letter-spacing: .04em;
}
.audit-table tbody td {
  padding: .45rem .55rem;
  border-bottom: 1px solid var(--border-soft);
  vertical-align: top;
}
.audit-table .mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: .86rem;
  color: var(--text);
  white-space: nowrap;
}
.audit-pill {
  display: inline-block;
  padding: .05rem .45rem;
  border-radius: 999px;
  font-size: .78rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .04em;
}
.audit-ok   { background: rgba(60, 180, 90, .15); color: #2c8048; }
.audit-fail { background: rgba(220, 70, 70, .14); color: #b03a3a; }

/* Magic-link expiry badge inside the team-link distribution panel.
   Sized so it stays readable next to the slot name without pushing
   the URL field around. */
.tl-expiry {
  font-size: .72rem;
  font-weight: 700;
  padding: 0 .4rem;
  border-radius: 999px;
  text-transform: uppercase;
  letter-spacing: .04em;
  margin-left: .25rem;
}
.tl-expiry.expired { background: rgba(220, 70, 70, .14); color: #b03a3a; }
.tl-expiry.soon    { background: rgba(220, 160, 60, .15); color: #8a5a1a; }

/* Unverified-email banner sits at the top of every content page until
   the user clicks the link in their inbox. Amber / muted so it doesn't
   distract from real errors but is plainly an "act on me" surface. */
.verify-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  margin: 0 0 1rem;
  padding: .55rem .85rem;
  border-radius: var(--radius-sm);
  background: rgba(220, 160, 60, .12);
  border: 1px solid rgba(220, 160, 60, .35);
  font-size: .92rem;
}
.verify-banner strong { color: #8a5a1a; }
.verify-banner .btn { white-space: nowrap; }
/* Deletion-pending banner uses the same shape as the verify banner
   but a red palette so the urgency is unambiguous. Shown until the
   user cancels deletion or the grace window expires. */
.delete-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  margin: 0 0 1rem;
  padding: .55rem .85rem;
  border-radius: var(--radius-sm);
  background: rgba(220, 70, 70, .12);
  border: 1px solid rgba(220, 70, 70, .4);
  font-size: .92rem;
}
.delete-banner strong { color: #a02a2a; }
.delete-banner .btn { white-space: nowrap; }

/* Default-password banner: same red palette as .delete-banner so
   the visual rhyme reads as "this is an account-integrity issue,
   handle it now". The link inside inherits the banner colour and
   carries an underline so it reads as the call-to-action. */
.banner.err {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: .5rem;
  margin: 0 0 1rem;
  padding: .55rem .85rem;
  border-radius: var(--radius-sm);
  background: rgba(220, 70, 70, .12);
  border: 1px solid rgba(220, 70, 70, .4);
  font-size: .92rem;
}
.banner.err strong { color: #a02a2a; }
.banner.err a { color: inherit; }

/* Account-settings cards: stacked in one column, comfortable padding,
   tight enough that the page reads as a list of related actions
   rather than a wall. The danger card gets a subtle red edge. */
.settings-card {
  margin: 0 0 1rem;
  padding: 1rem 1.25rem;
}
.settings-card h2 { margin: 0 0 .75rem; font-size: 1rem; }
.settings-card .field { margin-bottom: .6rem; }
.settings-card.danger-card { border-color: rgba(220, 70, 70, .35); }
.settings-card .ok  { color: #2c8048; }
.settings-card .err { color: #b03a3a; }

/* Session list rows in the Active Sessions settings card. Visually
   nested inside the parent card so the list reads as one block, not a
   bunch of separate cards. */
.session-row {
  display: flex; gap: .5rem; align-items: flex-start; justify-content: space-between;
  padding: .65rem .85rem; margin: .4rem 0;
  background: var(--surface-2);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm, 8px);
}
.session-row-info { min-width: 0; flex: 1; }
.session-row-name { font-weight: 700; font-size: .9rem; }
.session-row-meta { color: var(--muted); font-size: .78rem; margin-top: .2rem; }
.session-row .pill { margin-right: .4rem; }

/* Settings sub-callout: the email-revert "you can undo this" banner.
   Warm-amber tinted to read as informational, not destructive. */
.settings-callout-warn {
  margin: .25rem 0 .75rem;
  padding: .65rem .85rem;
  border-radius: var(--radius-sm, 8px);
  border: 1px solid color-mix(in srgb, var(--warning) 50%, transparent);
  background: color-mix(in srgb, var(--warning) 18%, var(--surface));
}
.settings-callout-warn .meta {
  color: var(--muted); font-size: .8rem; margin: .25rem 0;
}

/* Audit-details modal: two-column label/value grid so the long UA
   string wraps into a single contained area instead of pushing the
   modal wide. */
.audit-details {
  display: grid;
  grid-template-columns: 7rem 1fr;
  gap: .4rem .8rem;
  margin: .25rem 0;
}
.audit-details dt {
  color: var(--muted); font-size: .78rem;
  text-transform: uppercase; letter-spacing: .06em; font-weight: 700;
  margin: 0;
}
.audit-details dd {
  margin: 0;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: var(--ts-sm);
  word-break: break-all;
}

/* QR-scanner modal — same affordance as the player UI's scanner in
   play.html (the styles are intentionally identical). Used in the
   puzzle editor for "Test scan" so an arranger can verify a printed
   QR resolves to a string in their accept list before laminating it.
*/
.qr-modal {
  position: fixed; inset: 0; z-index: 100;
  background: #000;
  display: flex; flex-direction: column;
  align-items: stretch; justify-content: center;
}
.qr-modal video { width: 100%; height: 100%; object-fit: cover; }
.qr-modal .qr-frame {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}
.qr-modal .qr-frame::before {
  content: '';
  width: min(70vmin, 320px); height: min(70vmin, 320px);
  border: 3px solid rgba(255,255,255,.85);
  border-radius: 16px;
  box-shadow: 0 0 0 9999px rgba(0,0,0,.45);
}
.qr-modal .qr-status {
  position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 1rem);
  text-align: center; color: #fff;
  font-weight: 600; text-shadow: 0 2px 8px rgba(0,0,0,.6);
  padding: 0 1rem;
}
.qr-modal .qr-cancel {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom) + 1.25rem);
  padding: .75rem 1.5rem;
  background: rgba(255,255,255,.95); color: #111;
  border: 0; border-radius: 999px;
  font-weight: 700; cursor: pointer;
}
.qr-modal .qr-cancel:hover { background: #fff; }

/* Dragging feedback: the pill being dragged dims, and the drop target
   grows a coloured edge on whichever side the cursor is closer to so
   arrangers see the exact insertion point (same affordance as Slides). */
.pt-pill[draggable] { cursor: grab; }
.pt-pill[draggable]:active { cursor: grabbing; }
.pt-pill.drag-ghost { opacity: .3; }
.pt-pill.drop-before { box-shadow: inset 3px 0 0 0 var(--accent); }
.pt-pill.drop-after  { box-shadow: inset -3px 0 0 0 var(--accent); }

/* Puzzle list reorder. Each card on the adventure detail page is the
   drag source; the grip icon is the visual affordance. The reorder
   is "live": as the cursor crosses a sibling's midpoint we splice
   the dragged card to that DOM position, so the rest of the list
   visibly reflows around it (no separate drop-hint indicator). */
.puzzle-card .drag-handle {
  display: inline-flex; align-items: center; justify-content: center;
  width: 1.75rem; height: 1.75rem;
  margin-right: .5rem;
  color: var(--muted);
  cursor: grab;
  border-radius: 4px;
  flex-shrink: 0;
  touch-action: none; /* let the touch listeners hijack the gesture */
}
.puzzle-card .drag-handle:hover { color: var(--ink); background: var(--surface-2); }
.puzzle-card[draggable]:active .drag-handle { cursor: grabbing; }
.puzzle-card.drag-ghost { opacity: .35; }
/* Brief pulse applied to a freshly-duplicated puzzle card so the
   author can see where their click landed without scanning the
   whole list. Outline-only so the layout doesn't shift. */
.puzzle-card.puzzle-duplicated {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  animation: puzzle-pulse 1.4s ease-out;
}
@keyframes puzzle-pulse {
  0%   { outline-color: var(--accent); }
  100% { outline-color: transparent; }
}

/* Selectable chip grid used in the team-create modal. */
.chip-grid {
  display: flex; flex-wrap: wrap; gap: .4rem;
  max-height: 220px; overflow-y: auto;
  padding: .5rem; border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
}
.chip.selectable {
  cursor: pointer; user-select: none;
  transition: background var(--anim), color var(--anim), border-color var(--anim);
}
.chip.selectable:hover { border-color: var(--muted); }
.chip.selectable.selected {
  background: var(--accent); color: var(--accent-fg);
  border-color: var(--accent); font-weight: 700;
}
.chip.selectable.selected:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.chip.selectable.taken {
  opacity: .55; cursor: not-allowed; font-style: italic;
  border-style: dashed;
}
.chip.selectable.taken:hover { border-color: var(--border-soft); }

.inline-form {
  margin-top: .6rem; padding: .85rem;
  background: var(--surface-2); border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm);
}
.inline-form .row > input { flex: 1 1 0; min-width: 0; margin: 0; }
.inline-form .row { gap: .4rem; align-items: stretch; }

/* ---------- Map ---------- */
.map-host {
  width: 100%; height: 420px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-soft);
  overflow: hidden;
}
.puzzle-marker {
  width: 28px; height: 28px;
  background: var(--ink); color: #fff;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: .8rem;
  border: 2px solid #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,.35);
}
.puzzle-marker.gated { background: var(--accent); }
.puzzle-marker > span { transform: rotate(45deg); }
.team-dot {
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid #fff;
  box-shadow: 0 0 0 1px rgba(0,0,0,.25);
}
/* Team map marker = circular avatar with a coloured ring (the --team-col
   custom prop comes from inline style). Falls back to initials on the
   team colour when there's no uploaded image. */
.team-marker {
  width: 100%; height: 100%; border-radius: 50%;
  overflow: hidden;
  border: 3px solid var(--team-col, #e24080);
  background: var(--team-col, #e24080);
  box-shadow: 0 0 0 2px #fff, 0 2px 8px rgba(0,0,0,.35);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-size: 12px;
}
.team-marker img { width: 100%; height: 100%; object-fit: cover; display: block; }
.team-marker.no-img { /* initials variant keeps the background coloured */ }
.map-legend {
  display: flex; flex-wrap: wrap; gap: .75rem;
  margin-top: .75rem; font-size: .8rem;
}
.map-legend .sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: middle; margin-right: .35rem; }

/* ---------- Event feed ---------- */
.feed { list-style: none; padding: 0; margin: 0; max-height: 380px; overflow-y: auto; }
.feed li {
  display: grid; grid-template-columns: auto 1fr auto; gap: .75rem;
  align-items: start; padding: .6rem .3rem;
  border-bottom: 1px solid var(--border-soft);
}
.feed li:last-child { border-bottom: none; }
.feed .badge {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: .9rem; font-weight: 700;
  background: var(--surface-2); color: var(--ink);
}
.feed .badge.neutral { background: var(--surface-2); color: var(--ink); }
.feed .badge.good { background: color-mix(in srgb, var(--success) 22%, transparent); color: var(--success); }
.feed .badge.bad { background: color-mix(in srgb, var(--danger) 22%, transparent); color: var(--danger); }
.feed .badge.brand { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }
.feed .msg strong { font-weight: 700; }
.feed .meta { font-size: var(--ts-xs); color: var(--muted); margin-top: .1rem; }
.feed time { font-size: var(--ts-xs); color: var(--muted); white-space: nowrap; }

/* ---------- Toast ---------- */
.toasts {
  position: fixed; bottom: 1rem; right: 1rem; z-index: 2100;
  display: flex; flex-direction: column; gap: .5rem;
}
.toast {
  padding: .75rem 1rem; border-radius: var(--radius-sm);
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  box-shadow: var(--shadow-lg); min-width: 240px;
  animation: slideIn .2s ease;
}
.toast.err { border-color: var(--danger); color: var(--danger); }
.toast.ok { border-color: var(--success); color: var(--success); }
@keyframes slideIn { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- Login ---------- */
.login-wrap {
  min-height: 100vh; display: grid; place-items: center; padding: 1rem;
  background:
    radial-gradient(circle at 20% 0%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 50%),
    radial-gradient(circle at 80% 100%, color-mix(in srgb, var(--ink) 12%, transparent), transparent 50%),
    var(--bg);
}
.login {
  background: var(--surface); border: 1px solid var(--border-soft);
  border-radius: var(--radius); box-shadow: var(--shadow-lg);
  padding: 2rem; width: 100%; max-width: 380px;
}
.login .brand {
  font-size: 1.75rem; margin-bottom: 1.5rem;
  display: flex; flex-direction: column;
  align-items: flex-start;
  gap: 0;
  line-height: 1.1;
}
.login .brand small {
  font-family: var(--font-body);
  font-size: .7rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .08em;
  font-weight: 700;
  margin-top: .15rem;
}
/* SSO block on the login form. Sits above the username/password
   fields when the operator has configured OIDC. The button is a
   plain anchor so the browser handles the top-level navigation
   to the IdP without any JS — keeps the flow working even if the
   bootstrap script has a bug. */
.sso-block {
  display: flex;
  flex-direction: column;
  gap: .35rem;
  margin-bottom: 1rem;
}
.sso-btn {
  text-align: center;
  text-decoration: none;
}
.sso-hint {
  margin: 0;
  font-size: .8rem;
  text-align: center;
}
.sso-divider {
  position: relative;
  margin: .5rem 0 .25rem;
  text-align: center;
}
.sso-divider::before {
  content: '';
  position: absolute;
  top: 50%; left: 0; right: 0;
  border-top: 1px solid var(--border-soft);
  z-index: 0;
}
.sso-divider-label {
  position: relative;
  background: var(--surface);
  padding: 0 .65rem;
  color: var(--muted);
  font-size: .75rem;
  text-transform: uppercase;
  letter-spacing: .06em;
  z-index: 1;
}

/* Google's official "Sign in with Google" button. CSS lifted
   verbatim from developers.google.com/identity/branding-guidelines
   — any local restyling would break the brand recognition users
   learn across the web (and arguably the brand-guidelines license
   terms). Only painted when the OIDC provider is Google; non-Google
   IdPs use the generic .sso-btn above so the Google mark isn't
   misapplied to a different provider. */
.gsi-material-button {
  -moz-user-select: none;
  -webkit-user-select: none;
  -ms-user-select: none;
  -webkit-appearance: none;
  background-color: WHITE;
  background-image: none;
  border: 1px solid #747775;
  -webkit-border-radius: 20px;
  border-radius: 20px;
  -webkit-box-sizing: border-box;
  box-sizing: border-box;
  color: #1f1f1f;
  cursor: pointer;
  font-family: 'Roboto', arial, sans-serif;
  font-size: 14px;
  height: 40px;
  letter-spacing: 0.25px;
  outline: none;
  overflow: hidden;
  padding: 0 12px;
  position: relative;
  text-align: center;
  -webkit-transition: background-color .218s, border-color .218s, box-shadow .218s;
  transition: background-color .218s, border-color .218s, box-shadow .218s;
  vertical-align: middle;
  white-space: nowrap;
  width: auto;
  max-width: 400px;
  min-width: min-content;
}
.gsi-material-button .gsi-material-button-icon {
  height: 20px;
  margin-right: 12px;
  min-width: 20px;
  width: 20px;
}
.gsi-material-button .gsi-material-button-content-wrapper {
  -webkit-align-items: center;
  align-items: center;
  display: flex;
  -webkit-flex-direction: row;
  flex-direction: row;
  -webkit-flex-wrap: nowrap;
  flex-wrap: nowrap;
  height: 100%;
  justify-content: space-between;
  position: relative;
  width: 100%;
}
.gsi-material-button .gsi-material-button-contents {
  -webkit-flex-grow: 1;
  flex-grow: 1;
  font-family: 'Roboto', arial, sans-serif;
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  vertical-align: top;
}
.gsi-material-button .gsi-material-button-state {
  -webkit-transition: opacity .218s;
  transition: opacity .218s;
  bottom: 0;
  left: 0;
  opacity: 0;
  position: absolute;
  right: 0;
  top: 0;
}
.gsi-material-button:disabled {
  cursor: default;
  background-color: #ffffff61;
  border-color: #1f1f1f1f;
}
.gsi-material-button:disabled .gsi-material-button-contents {
  opacity: 38%;
}
.gsi-material-button:disabled .gsi-material-button-icon {
  opacity: 38%;
}
.gsi-material-button:not(:disabled):active .gsi-material-button-state,
.gsi-material-button:not(:disabled):focus .gsi-material-button-state {
  background-color: #303030;
  opacity: 12%;
}
.gsi-material-button:not(:disabled):hover {
  -webkit-box-shadow: 0 1px 2px 0 rgba(60, 64, 67, .30), 0 1px 3px 1px rgba(60, 64, 67, .15);
  box-shadow: 0 1px 2px 0 rgba(60, 64, 67, .30), 0 1px 3px 1px rgba(60, 64, 67, .15);
}
.gsi-material-button:not(:disabled):hover .gsi-material-button-state {
  background-color: #303030;
  opacity: 8%;
}
/* On the login card the SSO button spans the form width so it
   visually pairs with the primary "Log in" submit below the
   divider. Google's max-width:400px guard is still in force —
   when the card itself is narrower than 400px, the button
   matches the card; on wider layouts it caps at 400px. */
.sso-block .gsi-material-button { width: 100%; }

/* ---- Manual / arranger handbook ----
   Reading-optimised typography: narrower measure, larger line-height,
   spacious headings. The layout flows top-to-bottom (no TOC sidebar)
   so the manual works the same on phone and desktop without a separate
   responsive break. */
.manual {
  max-width: 50rem;
  line-height: 1.6;
}
.manual h1 { font-size: 1.9rem; margin: 0 0 .25rem; }
.manual h2 {
  margin: 2.5rem 0 .75rem; padding-bottom: .35rem;
  border-bottom: 1px solid var(--border-soft);
  font-size: 1.35rem;
}
.manual h3 { margin: 1.5rem 0 .5rem; font-size: 1.05rem; }
.manual p, .manual ul, .manual ol { margin: .5rem 0 .75rem; }
.manual ul, .manual ol { padding-left: 1.5rem; }
.manual li + li { margin-top: .25rem; }
.manual code {
  background: var(--surface-2);
  padding: .1rem .35rem;
  border-radius: 4px;
  font-size: .9em;
}
.manual pre {
  background: var(--surface-2);
  padding: .75rem 1rem;
  border-radius: 8px;
  overflow-x: auto;
  font-size: var(--ts-sm);
  line-height: 1.5;
}
/* Screenshot placeholder: a dashed-bordered box that says
   "[Screenshot: …]". Real screenshots get dropped in later by
   replacing the placeholder div with an <img>. */
.manual .shot {
  display: block;
  margin: 1rem 0;
  padding: 2rem 1rem;
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  background: var(--surface-2);
  color: var(--muted);
  text-align: center;
  font-size: var(--ts-sm);
  font-style: italic;
}
.manual .shot::before { content: '🖼  '; font-style: normal; }
/* Callout: highlights a tip or warning. Two variants — tip (accent)
   and warn (yellow). */
.manual .callout {
  margin: 1rem 0;
  padding: .75rem 1rem;
  border-radius: var(--radius);
  border-left: 4px solid var(--accent);
  background: color-mix(in srgb, var(--accent) 6%, var(--surface));
  font-size: .95rem;
}
.manual .callout.warn {
  border-left-color: #d99500;
  background: color-mix(in srgb, #d99500 8%, var(--surface));
}
.manual .toc {
  margin: 1.5rem 0 2rem;
  padding: 1rem 1.25rem;
  background: var(--surface-2);
  border-radius: var(--radius);
}
.manual .toc h2 {
  margin: 0 0 .5rem; padding: 0; border: 0; font-size: 1rem;
  text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
}
.manual .toc ol { margin: 0; padding-left: 1.5rem; }
.manual .toc a { text-decoration: none; }
.manual .toc a:hover { text-decoration: underline; }

/* Connection status banner for the event-detail subscription. Only
   shown while watchRun() has an active event; mid-event a stale
   leaderboard or team list misleads the arranger into making bad
   calls. Two tiers — warn + err — match the player banner. */
.ws-status {
  position: fixed;
  left: 0; right: 0;
  top: 0;
  z-index: 4000;
  padding: .35rem .75rem;
  text-align: center;
  font-size: .8rem; font-weight: 700;
  letter-spacing: .04em;
  background: var(--surface);
  color: var(--ink);
  border-bottom: 1px solid var(--border-soft);
  transform: translateY(-100%);
  transition: transform 180ms ease;
  pointer-events: none;
}
.ws-status.show { transform: translateY(0); }
.ws-status.warn {
  background: color-mix(in srgb, #f0a000 22%, var(--surface));
  color: #6b4500;
}
.ws-status.err {
  background: color-mix(in srgb, var(--danger) 22%, var(--surface));
  color: var(--danger);
}

/* ---------- OTP digit boxes ---------- */
/* Six-segment grouped input for TOTP codes. Each box is a separate
   <input maxlength=1> so caret behaviour matches user expectation
   (typing advances, Backspace retreats), and a paste-anywhere path
   distributes digits across boxes. */
.otp-row {
  display: flex; gap: .5rem; justify-content: center;
  margin: .25rem 0;
}
.otp-box {
  width: 2.75rem; height: 3.25rem;
  padding: 0;
  text-align: center;
  font-family: ui-monospace, SFMono-Regular, monospace;
  font-size: 1.5rem; font-weight: 600;
  letter-spacing: 0;
  flex: 0 0 auto;
}
@media (max-width: 420px) {
  .otp-row { gap: .35rem; }
  .otp-box { width: 2.25rem; height: 2.75rem; font-size: 1.25rem; }
}
</style>
