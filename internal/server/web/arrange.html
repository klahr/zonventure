<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zonventure · arranger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aclonica&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
/* ---------- Theme (Zonventure palette) ---------- */
:root {
  --accent:        #ad1357;  /* raspberry — brand */
  --accent-hover:  #951048;
  --accent-fg:     #ffffff;
  --ink:           #1f3349;  /* navy — headings */
  --success:       #429a3f;  /* brand green */
  --danger:        #ff5252;
  --danger-fg:     #ffffff;
  --warning:       #b45309;

  --bg:            #fbfbfd;
  --surface:       #ffffff;
  --surface-2:     #f6f6f6;
  --border:        #c6d2e1;
  --border-soft:   #c6d2e166;

  --text:          var(--ink);
  --muted:         #6b7f96;

  --shadow-soft:   0 1px 4px #00000014, 0 2px 8px #00000012;
  --shadow:        1px 1px 4px #00000033;
  --shadow-lg:     1px 1px 16px #00000047;

  --radius:        12px;
  --radius-sm:     8px;
  --radius-pill:   32px;

  --font-body:     'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-brand:    'Aclonica', 'Vollkorn', Georgia, serif;

  --anim:          200ms;
}
[data-theme="dark"] {
  --bg:          #14202e;
  --surface:     #1f3349;  /* the brand navy, used as primary surface */
  --surface-2:   #263d56;
  --border:      #3a5172;
  --border-soft: #3a517266;

  --text:        #e7ecf4;
  --muted:       #9db1cc;
  --ink:         #e7ecf4;

  --accent:      #e24080;   /* raspberry lifted for dark bg contrast */
  --accent-hover: #ad1357;
  --accent-fg:   #ffffff;
  --success:     #7fd17b;
  --danger:      #ff7b7b;
  --warning:     #fbbf24;

  --shadow-soft: 0 1px 4px #00000066, 0 2px 12px #00000077;
  --shadow:      2px 2px 8px #00000073;
  --shadow-lg:   0 16px 40px #000000aa;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --bg: #14202e; --surface: #1f3349; --surface-2: #263d56;
    --border: #3a5172; --border-soft: #3a517266;
    --text: #e7ecf4; --muted: #9db1cc; --ink: #e7ecf4;
    --accent: #e24080; --accent-hover: #ad1357; --accent-fg: #ffffff;
    --success: #7fd17b; --danger: #ff7b7b; --warning: #fbbf24;
    --shadow-soft: 0 1px 4px #00000066, 0 2px 12px #00000077;
    --shadow: 2px 2px 8px #00000073;
    --shadow-lg: 0 16px 40px #000000aa;
  }
}

/* ---------- Base ---------- */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3 { margin: 0 0 .5rem; line-height: 1.25; font-weight: 700; color: var(--ink); }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.1rem; }
h3 { font-size: .9rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
p { margin: 0 0 .5rem; }

/* ---------- App shell ---------- */
.app {
  display: grid;
  grid-template-columns: 240px minmax(0, 1fr);
  grid-template-rows: auto 1fr;
  grid-template-areas:
    "sidebar topbar"
    "sidebar content";
  min-height: 100vh;
  overflow-x: hidden;
}
.topbar {
  grid-area: topbar;
  display: flex;
  align-items: center;
  gap: .75rem;
  padding: 1rem 1.5rem;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 20;
}
.topbar .brand { display: none; font-size: 1.2rem; }
.topbar .crumb { font-weight: 700; font-size: 1rem; color: var(--ink); }
.topbar .spacer { flex: 1; }
.topbar .user {
  display: flex; align-items: center; gap: .6rem;
  color: var(--muted); font-size: .85rem;
}
.topbar .user strong { color: var(--text); font-weight: 700; }

.sidebar {
  grid-area: sidebar;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 1.5rem 0;
  display: flex; flex-direction: column;
}
.brand {
  font-family: var(--font-brand);
  font-weight: 400;
  color: var(--accent);
  letter-spacing: .01em;
}
.sidebar .brand {
  padding: 0 1.5rem 1.5rem;
  font-size: 1.55rem;
  display: flex; flex-direction: column;
  align-items: flex-start;
  gap: 0;
  line-height: 1.1;
}
.sidebar .brand small {
  font-family: var(--font-body);
  font-size: .7rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .08em;
  font-weight: 700;
  margin-top: .15rem;
}
.nav { display: flex; flex-direction: column; gap: 2px; padding: 0 .75rem; flex: 1; }
.sidebar-footer {
  margin-top: auto;
  padding: 1rem .75rem;
  border-top: 1px solid var(--border-soft);
  display: flex;
  flex-direction: column;
  gap: .4rem;
}
.sidebar-footer .btn {
  width: 100%;
  justify-content: flex-start;
  font-weight: 600;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sidebar-footer .btn:hover { color: var(--accent); border-color: transparent; background: var(--surface-2); }
.sidebar-footer .btn svg { stroke: currentColor; }
.nav a {
  display: flex; align-items: center; gap: .75rem;
  padding: .6rem .85rem; border-radius: var(--radius-pill);
  color: var(--text); text-decoration: none; font-weight: 600;
  transition: background var(--anim), color var(--anim);
}
.nav a:hover { background: var(--surface-2); text-decoration: none; }
.nav a.active { background: var(--accent); color: var(--accent-fg); box-shadow: var(--shadow-soft); }
.nav a.active svg { stroke: var(--accent-fg); }
.nav svg { width: 18px; height: 18px; stroke: var(--muted); stroke-width: 1.75; fill: none; flex-shrink: 0; }
.nav a:hover svg { stroke: var(--accent); }

.content {
  grid-area: content;
  padding: 1.5rem 2rem 3rem;
  min-width: 0;          /* let the grid track shrink below content's intrinsic width */
  overflow-x: hidden;    /* defense in depth — page itself never scrolls sideways */
}
.content > * + * { margin-top: 1.25rem; }

/* Mobile */
.btn.menu-btn { display: none; }
@media (max-width: 820px) {
  .app {
    grid-template-columns: 1fr;
    grid-template-areas: "topbar" "content";
  }
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: 260px; z-index: 1500;
    transform: translateX(-100%);
    transition: transform .2s ease;
    box-shadow: var(--shadow-lg);
  }
  .sidebar.open { transform: translateX(0); }
  .topbar .brand { display: inline-flex; align-items: baseline; gap: .4rem; font-weight: 700; }
  .btn.menu-btn { display: inline-flex; }
  .content { padding: 1rem; }
  .topbar .crumb { display: none; }
  .topbar .user-details { display: none; }
}
.backdrop {
  display: none;
  position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 1400;
}
.backdrop.show { display: block; }

/* ---------- Buttons (Zonventure-style rounded pills) ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
  font: inherit; font-weight: 700; cursor: pointer; user-select: none;
  padding: .6rem 1.1rem; border-radius: var(--radius-pill);
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text);
  transition: background var(--anim), border-color var(--anim), transform 60ms, box-shadow var(--anim);
}
.btn:hover { background: var(--surface-2); border-color: var(--muted); }
.btn:active { transform: translateY(1px); }
.btn.primary {
  background: var(--accent); border-color: var(--accent); color: var(--accent-fg);
  box-shadow: var(--shadow-soft);
}
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.danger:hover { background: var(--danger); color: var(--danger-fg); border-color: var(--danger); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: .4rem .6rem; }
.btn.ghost:hover { background: var(--surface-2); color: var(--accent); border-color: transparent; }
.btn.small { padding: .35rem .75rem; font-size: .8rem; }
.btn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.75; fill: none; }

/* ---------- Cards ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  box-shadow: var(--shadow-soft);
  padding: 1.25rem;
  /* Wide content (mainly tables) becomes a horizontal scroll area inside the
     card rather than pushing the viewport wider. */
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.card h2 { margin-top: 0; }
.card + .card { margin-top: 1rem; }
.card.clickable { cursor: pointer; transition: transform var(--anim), box-shadow var(--anim); }
.card.clickable:hover { transform: translateY(-2px) scale(1.015); box-shadow: var(--shadow-lg); }

.grid { display: grid; gap: 1rem; }
.grid.cols-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.grid.cols-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
/* stats are small enough to stay side-by-side even on very narrow phones */
.grid.stats { grid-template-columns: repeat(3, minmax(0,1fr)); gap: .5rem; }
@media (max-width: 820px) {
  .grid.cols-3, .grid.cols-2 { grid-template-columns: 1fr; }
}

.stat {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  padding: 1.1rem 1rem;
  box-shadow: var(--shadow-soft);
  text-align: center;
}
.stat .label {
  color: var(--muted);
  font-size: clamp(.6rem, 1.6vw, .75rem);
  text-transform: uppercase; letter-spacing: .07em; font-weight: 700;
  white-space: nowrap;
}
.stat .value {
  font-size: clamp(1.5rem, 6vw, 2.4rem);
  font-weight: 700; margin-top: .25rem; color: var(--ink);
  line-height: 1;
}
.stat.accent .value { color: var(--accent); }
@media (max-width: 560px) {
  .stat { padding: .85rem .5rem; }
}

/* ---------- Forms ---------- */
label.field { display: block; margin-bottom: .9rem; }
label.field > span {
  display: block; margin-bottom: .3rem;
  color: var(--ink); font-size: .8rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .04em;
}
input, select, textarea {
  font: inherit; width: 100%;
  padding: .65rem .85rem;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  box-shadow: inset 0 0 0 1px var(--border-soft);
}
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
}
textarea { min-height: 80px; resize: vertical; font-family: ui-monospace, monospace; }

/* ---------- Table ---------- */
.table {
  width: 100%;
  border-collapse: separate; border-spacing: 0;
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-soft);
}
.table th, .table td { padding: .7rem 1rem; text-align: left; vertical-align: middle; }
.table th {
  background: var(--surface-2); color: var(--ink);
  font-weight: 700; font-size: .75rem; text-transform: uppercase; letter-spacing: .06em;
  border-bottom: 1px solid var(--border);
}
.table tbody tr + tr td { border-top: 1px solid var(--border-soft); }
.table tbody tr:hover { background: var(--surface-2); }
.table tbody tr:nth-child(odd) { background: color-mix(in srgb, var(--surface-2) 45%, transparent); }
.table tbody tr:nth-child(odd):hover { background: var(--surface-2); }
.table td .row { display: flex; gap: .35rem; }
@media (max-width: 820px) {
  .table .hide-narrow { display: none; }
}

/* ---------- Bits ---------- */
.row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }
.muted { color: var(--muted); }
.err { color: var(--danger); }
.ok { color: var(--success); }
.mono { font-family: ui-monospace, SFMono-Regular, monospace; font-size: .9em; }

.pill {
  display: inline-flex; align-items: center;
  padding: .15rem .65rem;
  font-size: .7rem; font-weight: 700;
  border-radius: 999px;
  background: var(--surface-2); color: var(--muted);
  text-transform: uppercase; letter-spacing: .06em;
}
.pill.accent { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
.pill.danger { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }
.pill.success { background: color-mix(in srgb, var(--success) 15%, transparent); color: var(--success); }
.pill.warning { background: color-mix(in srgb, var(--warning) 18%, transparent); color: var(--warning); }

.chip {
  display: inline-flex; align-items: center; gap: .25rem;
  padding: .2rem .65rem; background: var(--surface-2);
  border: 1px solid var(--border-soft); border-radius: 999px;
  font-size: .8rem; font-weight: 600;
}
.chip button {
  background: none; border: none; cursor: pointer; padding: 0;
  color: var(--muted); font-size: 1rem; line-height: 1;
}
.chip button:hover { color: var(--danger); }

.empty {
  text-align: center; padding: 3rem 1rem; color: var(--muted);
  background: var(--surface-2); border-radius: var(--radius);
  border: 1px dashed var(--border);
}

/* ---------- Modal ----------
   Leaflet assigns its own layers z-index up to ~1000, so the modal and
   toasts have to sit clearly above that to stay on top of the run map. */
.modal-back {
  position: fixed; inset: 0; background: rgba(0,0,0,.45);
  display: flex; align-items: center; justify-content: center;
  z-index: 2000; padding: 1rem;
}
.modal {
  background: var(--surface); border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  width: 100%; max-width: 420px;
  padding: 1.5rem;
  max-height: calc(100vh - 2rem);
  overflow-y: auto;
}
.modal.wide { max-width: 560px; }
.modal h2 { margin-top: 0; }

/* Selectable chip grid used in the team-create modal. */
.chip-grid {
  display: flex; flex-wrap: wrap; gap: .4rem;
  max-height: 220px; overflow-y: auto;
  padding: .5rem; border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
}
.chip.selectable {
  cursor: pointer; user-select: none;
  transition: background var(--anim), color var(--anim), border-color var(--anim);
}
.chip.selectable:hover { border-color: var(--muted); }
.chip.selectable.selected {
  background: var(--accent); color: var(--accent-fg);
  border-color: var(--accent); font-weight: 700;
}
.chip.selectable.selected:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.chip.selectable.taken {
  opacity: .55; cursor: not-allowed; font-style: italic;
  border-style: dashed;
}
.chip.selectable.taken:hover { border-color: var(--border-soft); }

.inline-form {
  margin-top: .6rem; padding: .85rem;
  background: var(--surface-2); border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm);
}
.inline-form .row > input { flex: 1 1 0; min-width: 0; margin: 0; }
.inline-form .row { gap: .4rem; align-items: stretch; }

/* ---------- Map ---------- */
.map-host {
  width: 100%; height: 420px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-soft);
  overflow: hidden;
}
.puzzle-marker {
  width: 28px; height: 28px;
  background: var(--ink); color: #fff;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: .8rem;
  border: 2px solid #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,.35);
}
.puzzle-marker.gated { background: var(--accent); }
.puzzle-marker > span { transform: rotate(45deg); }
.team-dot {
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid #fff;
  box-shadow: 0 0 0 1px rgba(0,0,0,.25);
}
.map-legend {
  display: flex; flex-wrap: wrap; gap: .75rem;
  margin-top: .75rem; font-size: .8rem;
}
.map-legend .sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: middle; margin-right: .35rem; }

/* ---------- Event feed ---------- */
.feed { list-style: none; padding: 0; margin: 0; max-height: 380px; overflow-y: auto; }
.feed li {
  display: grid; grid-template-columns: auto 1fr auto; gap: .75rem;
  align-items: start; padding: .6rem .3rem;
  border-bottom: 1px solid var(--border-soft);
}
.feed li:last-child { border-bottom: none; }
.feed .badge {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: .9rem; font-weight: 700;
  background: var(--surface-2); color: var(--ink);
}
.feed .badge.neutral { background: var(--surface-2); color: var(--ink); }
.feed .badge.good { background: color-mix(in srgb, var(--success) 22%, transparent); color: var(--success); }
.feed .badge.bad { background: color-mix(in srgb, var(--danger) 22%, transparent); color: var(--danger); }
.feed .badge.brand { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }
.feed .msg strong { font-weight: 700; }
.feed .meta { font-size: .75rem; color: var(--muted); margin-top: .1rem; }
.feed time { font-size: .75rem; color: var(--muted); white-space: nowrap; }

/* ---------- Toast ---------- */
.toasts {
  position: fixed; bottom: 1rem; right: 1rem; z-index: 2100;
  display: flex; flex-direction: column; gap: .5rem;
}
.toast {
  padding: .75rem 1rem; border-radius: var(--radius-sm);
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  box-shadow: var(--shadow-lg); min-width: 240px;
  animation: slideIn .2s ease;
}
.toast.err { border-color: var(--danger); color: var(--danger); }
.toast.ok { border-color: var(--success); color: var(--success); }
@keyframes slideIn { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- Login ---------- */
.login-wrap {
  min-height: 100vh; display: grid; place-items: center; padding: 1rem;
  background:
    radial-gradient(circle at 20% 0%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 50%),
    radial-gradient(circle at 80% 100%, color-mix(in srgb, var(--ink) 12%, transparent), transparent 50%),
    var(--bg);
}
.login {
  background: var(--surface); border: 1px solid var(--border-soft);
  border-radius: var(--radius); box-shadow: var(--shadow-lg);
  padding: 2rem; width: 100%; max-width: 380px;
}
.login .brand {
  font-size: 1.75rem; margin-bottom: 1.5rem;
  display: flex; align-items: baseline; gap: .5rem;
}
.login .brand small {
  font-family: var(--font-body);
  font-size: .7rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .08em;
  font-weight: 700;
}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal-host"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script>
/* ========== API helper ========== */
async function api(path, opts = {}) {
  const res = await fetch(path, {
    credentials: 'same-origin',
    headers: opts.body ? { 'Content-Type': 'application/json' } : {},
    ...opts,
  });
  let body = null;
  if (res.status !== 204) {
    try { body = await res.json(); } catch {}
  }
  return { status: res.status, ok: res.ok, body };
}

/* ========== DOM helper ========== */
function h(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'on') for (const [ev, fn] of Object.entries(v)) e.addEventListener(ev, fn);
    else if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k in e && typeof e[k] !== 'function') {
      try { e[k] = v; } catch { e.setAttribute(k, v); }
    } else e.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c === null || c === undefined || c === false) continue;
    e.append(c?.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
const icon = (svg) => {
  const s = h('span');
  s.innerHTML = svg;
  return s.firstElementChild;
};

/* ========== Theme ========== */
function initTheme() {
  const saved = localStorage.getItem('zv-theme');
  if (saved === 'light' || saved === 'dark') {
    document.documentElement.setAttribute('data-theme', saved);
  }
}
function currentTheme() {
  const attr = document.documentElement.getAttribute('data-theme');
  if (attr) return attr;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function toggleTheme() {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('zv-theme', next);
  render();
}
initTheme();

/* ========== Toast ========== */
function toast(msg, kind = '') {
  const el = h('div', { class: 'toast ' + kind }, msg);
  document.getElementById('toasts').append(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; }, 2500);
  setTimeout(() => el.remove(), 2900);
}
const toastOk = (m) => toast(m, 'ok');
const toastErr = (m) => toast(m, 'err');

/* ========== Password-confirm prompt ==========
   Returns the typed password on success or null if cancelled. Pair this
   with requests that set X-Confirm-Password. */
async function promptPassword(title, message) {
  return modal(title, ({ body, close }) => {
    const input = h('input', { type: 'password', autocomplete: 'current-password', required: true });
    const err = h('p', { class: 'err', style: 'display:none' });
    const form = h('form', {},
      message ? h('p', { style: 'margin-bottom:.75rem' }, message) : null,
      h('label', { class: 'field' }, h('span', {}, 'Your password'), input),
      err,
      h('div', { class: 'row end' },
        h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, 'Cancel'),
        h('button', { class: 'btn danger', type: 'submit' }, 'Confirm')),
    );
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!input.value) { err.style.display = ''; err.textContent = 'password required'; return; }
      close(input.value);
    });
    body.append(form);
    setTimeout(() => input.focus(), 20);
  });
}

/* ========== Modal ========== */
function modal(title, bodyFn, opts = {}) {
  return new Promise((resolve) => {
    const host = document.getElementById('modal-host');
    const close = (value) => { host.replaceChildren(); resolve(value); };
    const body = h('div');
    const back = h('div', { class: 'modal-back', on: { click: (e) => { if (e.target === back) close(null); } } },
      h('div', { class: 'modal' + (opts.wide ? ' wide' : '') },
        h('h2', {}, title),
        body,
      ));
    host.replaceChildren(back);
    bodyFn({ body, close });
  });
}

/* ========== State ========== */
const state = {
  me: null,                // {username, role}
  route: location.hash || '#dashboard',

window.addEventListener('hashchange', () => {
  state.route = location.hash || '#dashboard';

/* ========== Router ========== */
async function refreshMe() {
  const r = await api('/api/auth/whoami');
  state.me = (r.status === 200) ? r.body : null;
}
function nav(hash) { location.hash = hash; }

async function render() {
  if (!state.me) await refreshMe();
  const root = document.getElementById('root');
  if (!state.me) { root.replaceChildren(renderLogin()); return; }
  if (state.me.role === 'player') {
    root.replaceChildren(h('div', { class: 'login-wrap' },
      h('div', { class: 'login' },
        h('div', { class: 'brand' }, 'zonventure'),
        h('p', {}, `Logged in as ${state.me.username} (player). This dashboard is for arrangers.`),
        h('p', {}, h('a', { href: '/play' }, 'Go to the player view →')),
        h('p', {}, h('button', { class: 'btn', on: { click: logout } }, 'Log out')),
      )));
    return;
  }
  root.replaceChildren(renderShell());
  await renderRoute();
}

function renderLogin(err) {
  const form = h('form', { class: 'login' },
    h('div', { class: 'brand' }, 'zonventure', h('small', {}, 'arranger')),
    h('label', { class: 'field' },
      h('span', {}, 'Username'),
      h('input', { name: 'u', autocomplete: 'username', required: true })),
    h('label', { class: 'field' },
      h('span', {}, 'Password'),
      h('input', { name: 'p', type: 'password', autocomplete: 'current-password', required: true })),
    err ? h('p', { class: 'err' }, err) : null,
    h('div', { class: 'row end', style: 'margin-top:1rem' },
      h('button', { class: 'btn primary', type: 'submit' }, 'Log in')),
  );
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const r = await api('/api/auth/login', {
      method: 'POST',

    });

    else document.getElementById('root').replaceChildren(renderLogin(r.body?.error || 'login failed'));
  });
  return h('div', { class: 'login-wrap' }, form);
}

function renderShell() {
  const role = state.me.role;
  const isAdmin = role === 'admin';
  const isOrgAdmin = role === 'org_admin';
  // Admin runs the multi-tenant plumbing (organizations, other admins).
  // Org users play the game: adventures, runs, players. Org admins also
  // manage their organization's members.
  let items;
  if (isAdmin) {
    items = [
      ['#dashboard', 'Dashboard', ICONS.dashboard],
      ['#organizations', 'Organizations', ICONS.shield],
      ['#library', 'Library', ICONS.map],
      ['#admins', 'Admins', ICONS.user],
    ];
  } else {
    items = [
      ['#dashboard', 'Dashboard', ICONS.dashboard],
      ['#adventures', 'Adventures', ICONS.map],
      ['#runs', 'Runs', ICONS.play],
    ];
    if (isOrgAdmin) items.push(['#members', 'Members', ICONS.shield]);
  }
  const active = state.route.split('/')[0];

  const nav = h('nav', { class: 'nav' }, items.map(([href, label, svg]) =>
    h('a', {
      href,
      class: active === href ? 'active' : '',
      on: { click: () => { document.querySelector('.sidebar')?.classList.remove('open'); document.querySelector('.backdrop')?.classList.remove('show'); } },
    }, icon(svg), label)));

  const isDark = currentTheme() === 'dark';
  const themeBtn = h('button', {
    class: 'btn',
    title: 'Toggle theme',
    on: { click: toggleTheme },
  }, icon(isDark ? ICONS.sun : ICONS.moon), isDark ? 'Light mode' : 'Dark mode');
  const logoutBtn = h('button', {
    class: 'btn',
    title: 'Log out',
    on: { click: logout },
  }, icon(ICONS.user), `Log out (${state.me.username})`);

  const sidebar = h('aside', { class: 'sidebar' },
    h('div', { class: 'brand' }, 'zonventure', h('small', {}, 'arranger')),
    nav,
    h('div', { class: 'sidebar-footer' }, themeBtn, logoutBtn));

  const backdrop = h('div', { class: 'backdrop', on: { click: () => {
    document.querySelector('.sidebar').classList.remove('open');
    backdrop.classList.remove('show');
  } } });

  const menuBtn = h('button', {
    class: 'btn ghost menu-btn',
    on: { click: () => {
      document.querySelector('.sidebar').classList.toggle('open');
      backdrop.classList.toggle('show');
    } },
  }, icon(ICONS.menu));

  const topbar = h('header', { class: 'topbar' },
    menuBtn,
    h('span', { class: 'brand' }, 'zonventure'),
    h('div', { class: 'crumb' }, currentCrumb()),
    h('div', { class: 'spacer' }),
  );

  return h('div', { class: 'app' },
    sidebar, topbar,
    h('main', { class: 'content', id: 'view' }),
    backdrop);
}

function currentCrumb() {
  const parts = state.route.replace(/^#/, '').split('/');
  const section = parts[0] || 'dashboard';
  const cap = (s) => s ? s[0].toUpperCase() + s.slice(1) : '';
  if (section === 'runs' && parts[1]) return `Runs / Run #${parts[1]}`;
  if (section === 'adventures' && parts[1]) return `Adventures / ${parts[1]}`;
  return cap(section);
}

async function renderRoute() {
  const view = document.getElementById('view');
  view.replaceChildren(h('p', { class: 'muted' }, 'Loading…'));
  const r = state.route.replace(/^#/, '');
  const [section, arg] = r.split('/');
  const role = state.me.role;
  const isAdmin = role === 'admin';
  const isOrgAdmin = role === 'org_admin';

  // Role-based route guards: admins can't visit org-user pages and vice versa.
  const adminOnly = ['organizations', 'admins', 'library'];
  const orgUserOnly = ['adventures', 'runs'];
  if (isAdmin && orgUserOnly.includes(section)) { nav('#organizations'); return; }
  if (!isAdmin && adminOnly.includes(section))   { nav('#dashboard');     return; }
  if (section === 'members' && !isOrgAdmin)      { nav('#dashboard');     return; }

  // Run-detail is the only view with real-time updates. Entering it opens a
  // watch on the arrange WebSocket; leaving it releases that watch so the
  // server stops publishing to this client.
  if (section === 'runs' && arg) {
    watchRun(parseInt(arg, 10));
  } else {
    unwatchRun();
  }

  try {
    switch (section) {
      case '':
      case 'dashboard':    return await viewDashboard(view);
      case 'adventures':   return arg ? await viewAdventureDetail(view, arg) : await viewAdventures(view);
      case 'runs':         return arg ? await viewRunDetail(view, arg) : await viewRuns(view);
      case 'members':      return await viewMembers(view);
      case 'organizations':return await viewOrganizations(view);
      case 'library':      return arg ? await viewLibraryEdit(view, arg) : await viewLibrary(view);
      case 'admins':       return await viewAdmins(view);
      default: view.replaceChildren(h('p', {}, 'Not found'));
    }
  } catch (err) {
    view.replaceChildren(h('p', { class: 'err' }, String(err)));
  }
}

/* ========== Arrange subscription stream ========== */
// arrangeWS is a single long-lived connection that pushes run-detail
// updates while an arranger has a run open. Mutations still ride HTTP;
// this socket only receives change notifications so the view stays in
// sync with player progress, team creates, etc., without polling.
let arrangeWS = null;
let arrangeWSBackoff = 500;
let watchedRunID = 0;
let arrangePushTimer = null;

function ensureArrangeWS() {
  if (arrangeWS && (arrangeWS.readyState === 0 || arrangeWS.readyState === 1)) return;
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  arrangeWS = new WebSocket(`${proto}//${location.host}/ws/arrange`);
  arrangeWS.onopen = () => {
    arrangeWSBackoff = 500;
    if (watchedRunID) arrangeWS.send(JSON.stringify({ kind: 'watch_run', data: { run_id: watchedRunID } }));
  };
  arrangeWS.onmessage = (ev) => {
    let msg; try { msg = JSON.parse(ev.data); } catch { return; }
    if (!msg || !msg.kind) return;
    // Any server push re-renders the current run-detail view. Debounced so
    // a burst of changes (eg. multiple position updates from players
    // pinging at once) collapses into a single re-render.
    if (msg.kind === 'positions' || msg.kind === 'tracks' ||
        msg.kind === 'events'   || msg.kind === 'run_detail') {
      if (arrangePushTimer) clearTimeout(arrangePushTimer);
      arrangePushTimer = setTimeout(() => {
        const r = state.route.replace(/^#/, '');
        const [section, arg] = r.split('/');
        if (section === 'runs' && arg) {
          const view = document.getElementById('view');
          if (view) viewRunDetail(view, parseInt(arg, 10));
        }
      }, 300);
    }
  };
  arrangeWS.onclose = () => {
    const delay = Math.min(arrangeWSBackoff, 10000);
    arrangeWSBackoff = Math.min(arrangeWSBackoff * 2, 10000);
    setTimeout(ensureArrangeWS, delay);
  };
}

function watchRun(runID) {
  if (!runID || runID === watchedRunID) { watchedRunID = runID; ensureArrangeWS(); return; }
  watchedRunID = runID;
  ensureArrangeWS();
  if (arrangeWS && arrangeWS.readyState === 1) {
    arrangeWS.send(JSON.stringify({ kind: 'watch_run', data: { run_id: runID } }));
  }
}

function unwatchRun() {
  if (!watchedRunID) return;
  watchedRunID = 0;
  if (arrangeWS && arrangeWS.readyState === 1) {
    arrangeWS.send(JSON.stringify({ kind: 'unwatch_run' }));
  }
}

async function logout() {
  await api('/api/auth/logout', { method: 'POST' });
  state.me = null;
  render();
}

/* ========== Dashboard ========== */
async function viewDashboard(view) {
  if (state.me.role === 'admin') return viewAdminDashboard(view);
  return viewArrangerDashboard(view);
}

async function viewArrangerDashboard(view) {
  const [runs, advs] = await Promise.all([
    api('/api/admin/runs'), api('/api/admin/adventures'),
  ]);
  const rs = runs.body?.runs || [];
  const counts = {
    total: rs.length,
    running: rs.filter(r => r.state === 'running').length,
    scheduled: rs.filter(r => r.state === 'scheduled').length,
  };

  view.replaceChildren(
    h('h1', {}, `Hello, ${state.me.username}`),
    h('p', { class: 'muted' },
      `You have ${ (advs.body?.adventures || []).length } adventure(s) you are allowed to arrange.`),
    h('div', { class: 'grid stats' },
      stat('Runs total', counts.total),
      stat('Running now', counts.running),
      stat('Scheduled', counts.scheduled),
    ),
    h('div', { class: 'card' },
      h('h2', {}, 'Recent runs'),
      runsTable(rs.slice(0, 5)),
    ),
  );
}

async function viewAdminDashboard(view) {
  const [orgsR, advsR] = await Promise.all([
    api('/api/admin/organizations'),
    api('/api/admin/adventures'),
  ]);
  const orgs = orgsR.body?.organizations || [];
  const adventures = advsR.body?.adventures || [];

  const totals = orgs.reduce((acc, o) => {
    acc.runsTotal   += o.runs_total   || 0;
    acc.runsRunning += o.runs_running || 0;
    acc.players     += o.players_total || 0;
    acc.members     += (o.members || []).length;
    return acc;
  }, { runsTotal: 0, runsRunning: 0, players: 0, members: 0 });

  view.replaceChildren(
    h('h1', {}, `Hello, ${state.me.username}`),
    h('p', { class: 'muted' },
      'Signed in as admin — you manage organizations, their assignments, and other admins.'),
    h('div', { class: 'grid stats' },
      stat('Organizations', orgs.length),
      stat('Org users', totals.members),
      stat('Active runs', totals.runsRunning),
    ),
    h('div', { class: 'card' },
      h('div', { class: 'row between' },
        h('h2', {}, 'Organizations'),
        h('button', { class: 'btn primary small', on: { click: () => nav('#organizations') } },
          icon(ICONS.shield), 'Manage')),
      orgs.length === 0
        ? h('div', { class: 'empty' },
            h('p', {}, 'No organizations yet.'),
            h('button', { class: 'btn primary', on: { click: () => openCreateOrg() } },
              icon(ICONS.plus), 'Create your first organization'))
        : h('table', { class: 'table' },
          h('thead', {}, h('tr', {},
            h('th', {}, 'Organization'),
            h('th', { class: 'hide-narrow' }, 'Users'),
            h('th', { class: 'hide-narrow' }, 'Players'),
            h('th', {}, 'Runs'),
            h('th', { class: 'hide-narrow' }, 'Active'))),
          h('tbody', {}, orgs.map((o) => h('tr', {},
            h('td', {}, o.name),
            h('td', { class: 'mono hide-narrow' }, (o.members || []).length),
            h('td', { class: 'mono hide-narrow' }, o.players_total || 0),
            h('td', { class: 'mono' }, o.runs_total || 0),
            h('td', { class: 'hide-narrow' },
              (o.runs_running || 0) > 0
                ? h('span', { class: 'pill success' }, `${o.runs_running} running`)
                : h('span', { class: 'muted' }, '—')),
          )))),
    ),
    h('p', { class: 'muted', style: 'font-size:.8rem; margin-top:.5rem' },
      `${adventures.length} adventure${adventures.length === 1 ? '' : 's'} loaded from disk.`),
  );
}

function stat(label, value) {
  return h('div', { class: 'stat' },
    h('div', { class: 'label' }, label),
    h('div', { class: 'value' }, value));
}

/* ========== Adventures ==========
   For arrangers this is really "your assignments" — each unused assignment
   is a one-shot licence to run an adventure with a fixed team cap. Used
   assignments are also shown (with a link to their run) so the arranger can
   see the full history at a glance. */
async function viewAdventures(view) {
  const r = await api('/api/admin/assignments');
  const assignments = r.body?.assignments || [];
  const unused = assignments.filter((a) => !a.run_id);
  const used = assignments.filter((a) => a.run_id);

  // Build as an array we can filter — passing a bare null to replaceChildren
  // makes it render the string "null".
  const children = [
    h('h1', {}, 'Adventures'),
    h('p', { class: 'muted' },
      `Each assignment lets you schedule the adventure once, with up to the number of teams agreed with the owner.`),
    unused.length === 0
      ? h('div', { class: 'empty' },
          h('p', {}, 'No assignments available right now.'),
          h('p', { class: 'muted' }, 'Contact the owner to get one.'))
      : h('div', { class: 'grid cols-2' }, unused.map((a) =>
        h('div', { class: 'card' },
          h('div', { class: 'row between' },
            h('h2', {}, a.adventure_title || a.adventure_slug),
            h('span', { class: 'pill accent' }, `up to ${a.max_teams} team${a.max_teams === 1 ? '' : 's'}`)),
          h('p', { class: 'muted mono' }, a.adventure_slug),
          h('div', { class: 'row end' },
            h('button', { class: 'btn small', on: { click: () => nav('#adventures/' + a.adventure_slug) } }, 'Preview'),
            h('button', { class: 'btn primary small', on: { click: () => scheduleRun(a.id) } },
              icon(ICONS.plus), 'Schedule run')),
        ))),
    used.length === 0 ? null : h('div', {},
      h('h3', {}, 'Already used'),
      h('div', { class: 'card' },
        h('table', { class: 'table' },
          h('thead', {}, h('tr', {},
            h('th', {}, 'Adventure'), h('th', {}, 'Teams cap'))),
          h('tbody', {}, used.map((a) => h('tr', {
              style: 'cursor:pointer',
              on: { click: () => nav('#runs/' + a.run_id) },
            },
            h('td', {}, a.adventure_title || a.adventure_slug),
            h('td', { class: 'mono' }, a.max_teams),
          )))),
      )),
  ].filter(Boolean);
  view.replaceChildren(...children);
}

async function viewAdventureDetail(view, slug) {
  const r = await api('/api/admin/adventures/' + encodeURIComponent(slug));
  if (!r.ok) { view.replaceChildren(h('p', { class: 'err' }, r.body?.error || 'not found')); return; }
  const a = r.body;
  view.replaceChildren(
    h('button', { class: 'btn ghost small', on: { click: () => nav('#adventures') } }, icon(ICONS.back), 'Back'),
    h('h1', {}, a.title),
    h('p', { class: 'muted' }, a.description || ''),
    h('p', { class: 'muted mono' }, `${a.slug} · ${a.page_count} puzzles${a.author ? ' · ' + a.author : ''}`),
    h('h2', { style: 'margin-top:1.5rem' }, 'Puzzles'),
    h('div', {}, a.pages.map((p, i) =>
      h('div', { class: 'card' },
        h('div', { class: 'row between' },
          h('strong', {}, `${i + 1}. ${p.title || '(untitled)'}`),
          p.gated ? h('span', { class: 'pill warning' }, 'gated') : null),
        h('p', { style: 'white-space:pre-wrap' }, p.prompt),

async function scheduleRun(assignmentID) {
  const body = await modal('Schedule run', ({ body, close }) => {
    const when = h('input', { type: 'datetime-local' });
    const form = h('form', {},
      h('p', { class: 'muted', style: 'font-size:.85rem; margin-bottom:.5rem' },
        'The run is created in the scheduled state. You can start it manually later, or pick a local time here to have the server auto-start it.'),
      h('label', { class: 'field' }, h('span', {}, 'Auto-start at (optional)'), when),
      h('div', { class: 'row end' },
        h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, 'Cancel'),
        h('button', { class: 'btn primary', type: 'submit' }, 'Create run')),
    );
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const req = { assignment_id: assignmentID };
      if (when.value) {
        // datetime-local is parsed as local time; toISOString emits UTC.
        const d = new Date(when.value);
        if (Number.isNaN(d.getTime())) { toastErr('Bad date'); return; }
        req.scheduled_at = d.toISOString();
      }
      close(req);
    });
    body.append(form);
  });
  if (!body) return;
  const r = await api('/api/admin/runs', { method: 'POST', body: JSON.stringify(body) });
  if (r.status === 201) { toastOk(`Run #${r.body.id} scheduled`); nav('#runs/' + r.body.id); }
  else toastErr(r.body?.error || `error ${r.status}`);
}

// Public share bar: shows the absolute /live/{token} URL (opaque) so the
// arranger can read/copy it and send it to whoever's running the TV
// screen.
function renderShareBar(run) {
  const url = `${location.origin}/live/${run.live_token}`;
  const urlBox = h('input', {
    readonly: '', value: url,
    style: 'flex:1; min-width:0; background:var(--surface-2); font-family:ui-monospace,SFMono-Regular,monospace; font-size:.9rem; box-shadow:none; border-color:var(--border-soft)',
    on: { click: (e) => e.target.select() },
  });
  const copyBtn = h('button', {
    class: 'btn small', type: 'button', title: 'Copy link',
    on: { click: async () => {
      try {
        await navigator.clipboard.writeText(url);
        toastOk('Link copied');
      } catch {
        urlBox.select();
        document.execCommand('copy');
        toastOk('Link copied');
      }
    } },
  }, 'Copy');
  const openBtn = h('a', {
    href: url, target: '_blank', rel: 'noopener', class: 'btn small primary',
  }, 'Open ↗');

  // Real-time map toggle — arrangers can enable/disable the audience map
  // at any time (default off: revealing team positions is effectively
  // cheating for most puzzle types).
  const mapToggle = h('input', { type: 'checkbox' });
  if (run.show_map) mapToggle.checked = true;
  mapToggle.addEventListener('change', async () => {
    const r = await api(`/api/admin/runs/${run.id}`, {
      method: 'PATCH',
      body: JSON.stringify({ show_map: mapToggle.checked }),
    });
    if (r.status === 204) {

    style: 'display:inline-flex; align-items:center; gap:.35rem; cursor:pointer; font-size:.85rem; color:var(--muted)',
  }, mapToggle, 'Show real-time map');

  return h('div', { class: 'card', style: 'padding:.85rem 1rem' },
    h('div', { class: 'row', style: 'gap:.75rem; align-items:center; flex-wrap:wrap' },
      h('div', { style: 'min-width:140px' },
        h('div', { style: 'font-size:.7rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)' }, 'Public live view'),
        h('div', { class: 'muted', style: 'font-size:.85rem' }, 'Share on a TV — token URL, no login needed'),
      ),
      urlBox,
      copyBtn,
      openBtn,

    h('div', { style: 'margin-top:.5rem' }, mapLabel),

// initRunMap mounts a Leaflet map inside host. Puzzle pins come from the
// adventure (all pages always have a location now); per-team polylines and
// latest-position dots come from the tracks payload.
function initRunMap(host, adventure, teams, tracks) {
  if (typeof L === 'undefined') {
    host.replaceChildren(h('div', { class: 'empty' }, 'Map library is still loading — refresh the page.'));
    return;
  }
  const map = L.map(host, { scrollWheelZoom: false }).setView([59.3293, 18.0686], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 19,
  }).addTo(map);

  const bounds = L.latLngBounds([]);

  // Puzzle markers.
  for (const p of (adventure.pages || [])) {
    const ll = [p.location.lat, p.location.lng];
    const marker = L.marker(ll, {
      icon: L.divIcon({
        className: '',
        html: `<div class="puzzle-marker ${p.gated ? 'gated' : ''}"><span>${p.index + 1}</span></div>`,
        iconSize: [28, 28],
        iconAnchor: [14, 28],
      }),
    }).addTo(map);
    marker.bindPopup(
      `<strong>${p.index + 1}. ${p.title || 'Puzzle'}</strong>` +
      (p.gated && p.location.radius_m ? `<br><em>Gated — ${p.location.radius_m} m</em>` : '') +
      `<br><small>${p.location.lat.toFixed(5)}, ${p.location.lng.toFixed(5)}</small>`
    );
    bounds.extend(ll);
  }

  // Team traces.
  const teamByID = new Map();
  teams.forEach((t, i) => teamByID.set(t.id, { team: t, i }));
  for (const track of tracks) {
    const info = teamByID.get(track.team_id);
    const colour = teamColor(track.team_id, info ? info.i : 0);
    if (track.points.length > 0) {
      const latlngs = track.points.map((p) => [p.lat, p.lng]);
      L.polyline(latlngs, { color: colour, weight: 3, opacity: .85 }).addTo(map);
      const latest = track.points[track.points.length - 1];
      L.marker([latest.lat, latest.lng], {
        icon: L.divIcon({
          className: '',
          html: `<div class="team-dot" style="background:${colour}"></div>`,
          iconSize: [14, 14],
          iconAnchor: [7, 7],
        }),
      }).bindPopup(`<strong>${track.team_name}</strong><br><small>${fmtLocal(latest.server_ts)}</small>`).addTo(map);
      for (const ll of latlngs) bounds.extend(ll);
    }
  }

  if (bounds.isValid()) {
    map.fitBounds(bounds, { padding: [24, 24] });
  }
}

// renderEventFeed turns the run_events JSON into a readable timeline.
function renderEventFeed(events, teams) {
  if (!events.length) return h('div', { class: 'empty' }, 'No activity yet.');
  const ul = h('ul', { class: 'feed' });
  for (const e of events) ul.append(renderEvent(e, teams));
  return ul;
}

function renderEvent(e, teams) {
  const p = e.payload || {};
  let badge = 'neutral', symbol = '•', msg, meta;
  switch (e.kind) {
    case 'run.created':
      badge = 'brand'; symbol = '+'; msg = h('span', { class: 'msg' }, 'Run created for ', h('strong', {}, p.adventure_slug || '')); break;
    case 'run.started': badge = 'good'; symbol = '▶'; msg = h('span', { class: 'msg' }, 'Run started'); break;
    case 'run.paused':  badge = 'neutral'; symbol = '‖'; msg = h('span', { class: 'msg' }, 'Run paused'); break;
    case 'run.resumed': badge = 'good'; symbol = '▶'; msg = h('span', { class: 'msg' }, 'Run resumed'); break;
    case 'team.created':
      badge = 'brand'; symbol = '+'; msg = h('span', { class: 'msg' }, 'Team ', h('strong', {}, e.team_name || p.name || ''), ' created');
      if ((p.members || []).length) meta = 'with ' + (p.members || []).join(', '); break;
    case 'team.renamed':
      badge = 'neutral'; symbol = '✎'; msg = h('span', { class: 'msg' }, 'Renamed ', h('strong', {}, p.from || ''), ' → ', h('strong', {}, p.to || '')); break;
    case 'team.deleted':
      badge = 'bad'; symbol = '×'; msg = h('span', { class: 'msg' }, 'Team ', h('strong', {}, p.name || ''), ' deleted'); break;
    case 'team.member.added':
      badge = 'good'; symbol = '+'; msg = h('span', { class: 'msg' }, 'Added ', h('strong', {}, p.username || ''), ' to ', h('strong', {}, e.team_name || '')); break;
    case 'team.member.removed':
      badge = 'neutral'; symbol = '−'; msg = h('span', { class: 'msg' }, 'Removed ', h('strong', {}, p.username || ''), ' from ', h('strong', {}, e.team_name || '')); break;
    case 'answer.wrong':
      badge = 'bad'; symbol = '✗'; msg = h('span', { class: 'msg' }, h('strong', {}, e.team_name || ''), ' wrong on puzzle ', (p.page_index ?? 0) + 1);
      if (p.submitted) meta = `submitted “${p.submitted}”`; break;
    case 'answer.right':
      badge = 'good'; symbol = '✓'; msg = h('span', { class: 'msg' }, h('strong', {}, e.team_name || ''), ' solved puzzle ', (p.page_index ?? 0) + 1); break;
    case 'team.completed':
      badge = 'good'; symbol = '★'; msg = h('span', { class: 'msg' }, h('strong', {}, e.team_name || ''), ' finished the adventure!'); break;
    case 'team.unlocked':
      badge = 'brand'; symbol = '⇨'; msg = h('span', { class: 'msg' },
        h('strong', {}, e.team_name || ''), ' skipped past puzzle ', (p.from_page_index ?? 0) + 1);
      if (p.by_arranger) meta = 'by arranger'; break;
    case 'gate.reached':
      badge = 'brand'; symbol = '⛳'; msg = h('span', { class: 'msg' }, h('strong', {}, e.team_name || ''), ' reached the puzzle location'); break;
    default:
      msg = h('span', { class: 'msg' }, e.kind);
  }
  return h('li', {},
    h('span', { class: 'badge ' + badge }, symbol),
    h('div', {},
      msg,
      e.actor ? h('div', { class: 'meta' }, `by ${e.actor}${meta ? ' · ' + meta : ''}`)
              : (meta ? h('div', { class: 'meta' }, meta) : null),
    ),
    h('time', { datetime: e.created_at }, formatEventTime(e.created_at)),
  );
}

// fmtLocal turns a server timestamp (SQLite "YYYY-MM-DD HH:MM:SS" UTC, or an
// RFC3339 string) into the viewer's local time. Returns '—' for empty input
// and the raw value when it can't be parsed, so we never show "Invalid Date".
function fmtLocal(s, opts) {
  if (!s) return '—';
  const iso = s.includes('T') ? s : s.replace(' ', 'T') + 'Z';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return s;
  return d.toLocaleString(undefined, opts || { dateStyle: 'medium', timeStyle: 'short' });
}

function formatEventTime(s) {
  if (!s) return '';
  // SQLite datetime('now') returns "YYYY-MM-DD HH:MM:SS" in UTC. Let users
  // see something friendlier; locale defaults are fine.
  const d = new Date(s.includes('T') ? s : s.replace(' ', 'T') + 'Z');
  if (Number.isNaN(d.getTime())) return s;
  const now = Date.now();
  const diff = (now - d.getTime()) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.round(diff / 60) + 'm ago';
  if (diff < 86400) return Math.round(diff / 3600) + 'h ago';
  return d.toLocaleString();
}

async function confirmStart(run) {

      h('p', {},
        `Starting the run opens the first puzzle to all teams. `,

async function openEditSchedule(run) {
  // Pre-fill the datetime-local input from the current UTC-stored value.
  // The input wants "YYYY-MM-DDTHH:MM" in local time; use the Date object to
  // convert without a chunky date library.
  let prefill = '';
  if (run.scheduled_at) {
    const iso = run.scheduled_at.includes('T') ? run.scheduled_at : run.scheduled_at.replace(' ', 'T') + 'Z';
    const d = new Date(iso);
    if (!Number.isNaN(d.getTime())) {
      const pad = (n) => String(n).padStart(2, '0');
      prefill = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
  }

  await modal(run.scheduled_at ? 'Change auto-start' : 'Set auto-start', ({ body, close }) => {
    const when = h('input', { type: 'datetime-local', value: prefill });
    const form = h('form', {},
      h('p', { class: 'muted', style: 'font-size:.85rem; margin-bottom:.5rem' },
        'The server will flip the run to running automatically at the time below. Leave empty and hit Clear to remove the auto-start.'),
      h('label', { class: 'field' }, h('span', {}, 'Auto-start at'), when),
      h('div', { class: 'row between', style: 'margin-top:.5rem' },
        run.scheduled_at
          ? h('button', { class: 'btn danger', type: 'button', on: { click: async () => {
              close(null);
              await patchSchedule(run.id, '');
            } } }, 'Clear')
          : h('span', {}),
        h('div', { class: 'row' },
          h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, 'Cancel'),
          h('button', { class: 'btn primary', type: 'submit' }, 'Save'))),
    );
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!when.value) { toastErr('Pick a date or use Clear'); return; }
      const d = new Date(when.value);
      if (Number.isNaN(d.getTime())) { toastErr('Bad date'); return; }
      close(null);
      await patchSchedule(run.id, d.toISOString());
    });
    body.append(form);
  });
}

async function patchSchedule(runID, iso) {
  const r = await api(`/api/admin/runs/${runID}`, {
    method: 'PATCH',
    body: JSON.stringify({ scheduled_at: iso }),
  });
  if (r.status === 204) {
    toastOk(iso ? 'Schedule updated' : 'Auto-start cleared');
    renderRoute();
  } else {
    toastErr(r.body?.error || `error ${r.status}`);
  }
}

async function openTeamDetail(runID, team, adventure) {
  // Fetch events filtered to this team.
  const evR = await api(`/api/admin/runs/${runID}/events?team_id=${team.id}`);
  const events = evR.body?.events || [];
  const page = adventure?.pages?.[team.page_index];
  const last = adventure?.pages ? adventure.pages.length : null;
  const finished = team.completed_at || (last !== null && team.page_index >= last);

  await modal(`Team · ${team.name}`, ({ body, close }) => {
    const summary = h('div', { class: 'row between', style: 'margin-bottom:.75rem' },
      h('div', {},
        h('div', { class: 'muted', style: 'font-size:.8rem; text-transform:uppercase; letter-spacing:.05em; font-weight:700' },
          finished ? 'Finished' : `Puzzle ${team.page_index + 1}${last ? ' of ' + last : ''}`),
        page && !finished ? h('div', {}, h('strong', {}, page.title || '(untitled)')) : null,
      ),
      h('div', {},
        (team.members || []).map((m) => h('span', { class: 'chip', style: 'margin-right:.25rem' }, m.name)),
      ),
    );

    const actions = h('div', { class: 'row', style: 'margin-bottom:.75rem; flex-wrap:wrap' });
    if (!finished) {
      actions.append(h('button', { class: 'btn primary', on: { click: () => skipPuzzle(team, close) } },
        icon(ICONS.key), 'Skip this puzzle'));
    }
    actions.append(h('button', { class: 'btn', on: { click: () => { close(null); openTeamModal(runID, team); } } },
      'Edit members'));
    actions.append(h('button', { class: 'btn danger', on: { click: async () => { close(null); await confirmDeleteTeam(team); } } },
      icon(ICONS.trash), 'Delete'));

    body.append(
      summary,
      actions,
      h('h3', {}, 'Activity'),
      renderEventFeed(events, [team]),
      h('div', { class: 'row end', style: 'margin-top:1rem' },
        h('button', { class: 'btn', on: { click: () => close(null) } }, 'Close')),

async function skipPuzzle(team, close) {

    body.append(
      h('p', {}, `This advances the team past their current puzzle without them submitting the answer. Useful when they're stuck. The action is recorded in the event log.`),

        h('button', { class: 'btn primary', on: { click: () => c(true) } }, 'Skip puzzle')),
    );
  });
  if (!ok) return;
  const r = await api(`/api/admin/teams/${team.id}/unlock`, { method: 'POST' });

    close(true);
    renderRoute();
  } else {
    toastErr(r.body?.error || `error ${r.status}`);

}

// openTeamModal handles both new-team and edit-team. For a new team the
// arranger types a team name plus one name per line; each line becomes a
// slot with its own magic-link token. For an existing team the modal lets
// the arranger rename, copy each slot's link, rotate a link, remove a
// slot, or add a new slot inline.
async function openTeamModal(runID, existing) {
  if (existing) return openEditTeamModal(runID, existing);
  return openNewTeamModal(runID);
}

async function openNewTeamModal(runID) {
  await modal('New team', ({ body, close }) => {
    const nameInput = h('input', { name: 'name', required: true, autofocus: true });
    const memberArea = h('textarea', {
      name: 'members', rows: 5,
      placeholder: 'alice\nbob\ncharlie',
      required: true,
    });
    const submitBtn = h('button', { class: 'btn primary', type: 'submit' }, 'Create team');
    const form = h('form', {},
      h('label', { class: 'field' }, h('span', {}, 'Team name'), nameInput),
      h('label', { class: 'field' },
        h('span', {}, 'Members — one name per line'),
        memberArea),
      h('p', { class: 'muted', style: 'font-size:.8rem' },
        'Each line becomes a player slot with its own magic-link token. ',
        'You can copy the per-player link after the team is created.'),
      h('div', { class: 'row end', style: 'margin-top:1rem' },
        h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, 'Cancel'),
        submitBtn));
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const names = (memberArea.value || '').split('\n')
        .map((s) => s.trim()).filter(Boolean);
      if (names.length === 0) { toastErr('Add at least one member'); return; }
      submitBtn.disabled = true;
      const rr = await api(`/api/admin/runs/${runID}/teams`, {
        method: 'POST',
        body: JSON.stringify({ name: nameInput.value.trim(), member_names: names }),
      });
      submitBtn.disabled = false;
      if (rr.status !== 201) { toastErr(rr.body?.error || `error ${rr.status}`); return; }
      toastOk('Team created');
      close(true);
      renderRoute();
    });
    body.append(form);
  }, { wide: true });
}

async function openEditTeamModal(runID, existing) {
  // Refresh the team detail so we pick up any changes since the page
  // rendered — tokens can rotate and we want the latest.
  const r = await api('/api/admin/runs/' + runID);
  const run = r.body || {};
  const freshTeam = (run.teams || []).find((t) => t.id === existing.id) || existing;

  await modal(`Edit team · ${freshTeam.name}`, ({ body, close }) => {
    const nameInput = h('input', { value: freshTeam.name, required: true });
    const renameBtn = h('button', { class: 'btn small', type: 'button' }, 'Save name');
    renameBtn.addEventListener('click', async () => {
      const name = nameInput.value.trim();
      if (!name || name === freshTeam.name) return;
      const rr = await api(`/api/admin/teams/${freshTeam.id}`, {
        method: 'PATCH', body: JSON.stringify({ name }),
      });
      if (rr.status === 204) { toastOk('Renamed'); close(true); renderRoute(); }
      else toastErr(rr.body?.error || `error ${rr.status}`);
    });

    const membersWrap = h('div', {});
    const rebuildMembers = () => {
      membersWrap.replaceChildren();
      const rows = (freshTeam.members || []).map((m) => renderSlotRow(freshTeam.id, m, reload));
      if (rows.length === 0) {
        membersWrap.append(h('p', { class: 'muted' }, 'No members yet. Add one below.'));
      } else {
        membersWrap.append(...rows);
      }
    };

    async function reload() {
      const rr = await api('/api/admin/runs/' + runID);
      const fresh = (rr.body?.teams || []).find((t) => t.id === freshTeam.id);
      if (!fresh) { close(true); renderRoute(); return; }
      freshTeam.members = fresh.members;
      freshTeam.name = fresh.name;
      rebuildMembers();
    }

    // Inline "add slot"
    const newName = h('input', { placeholder: 'New member name' });
    const addBtn = h('button', { class: 'btn primary small', type: 'button' }, icon(ICONS.plus), 'Add');
    const addRow = h('div', { class: 'row', style: 'gap:.4rem; margin-top:.75rem' }, newName, addBtn);
    addBtn.addEventListener('click', async () => {
      const name = newName.value.trim();
      if (!name) return;
      const rr = await api(`/api/admin/teams/${freshTeam.id}/slots`, {
        method: 'POST', body: JSON.stringify({ name }),
      });
      if (rr.status === 201) {
        newName.value = '';
        toastOk('Added ' + rr.body.name);
        await reload();
      } else {
        toastErr(rr.body?.error || `error ${rr.status}`);
      }
    });
    newName.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addBtn.click(); } });

    body.append(
      h('label', { class: 'field' }, h('span', {}, 'Team name'),
        h('div', { class: 'row', style: 'gap:.4rem' }, nameInput, renameBtn)),
      h('h3', { style: 'margin-top:1rem' }, 'Members'),
      membersWrap,
      addRow,
      h('div', { class: 'row end', style: 'margin-top:1rem' },
        h('button', { class: 'btn', on: { click: () => close(null) } }, 'Close')));
    rebuildMembers();
  }, { wide: true });
}

function renderSlotRow(teamID, slot, reload) {
  const url = `${location.origin}/play?t=${encodeURIComponent(slot.token)}`;
  const urlInput = h('input', {
    readonly: '', value: url,
    style: 'flex:1; min-width:0; font-family:ui-monospace,monospace; font-size:.8rem; box-shadow:none; border-color:var(--border-soft); margin:0',
    on: { click: (e) => e.target.select() },
  });
  const copyBtn = h('button', { class: 'btn small', type: 'button', title: 'Copy link' }, 'Copy');
  copyBtn.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(url); toastOk('Link copied'); }
    catch { urlInput.select(); document.execCommand('copy'); toastOk('Link copied'); }
  });
  const rotateBtn = h('button', { class: 'btn small', type: 'button', title: 'Rotate link' }, '↻');
  rotateBtn.addEventListener('click', async () => {
    const rr = await api(`/api/admin/teams/${teamID}/slots/${slot.id}/rotate`, { method: 'POST' });
    if (rr.status === 200) { toastOk('Link rotated'); reload(); }
    else toastErr(rr.body?.error || `error ${rr.status}`);
  });
  const removeBtn = h('button', { class: 'btn small danger', type: 'button', title: 'Remove slot' }, icon(ICONS.trash));
  removeBtn.addEventListener('click', async () => {
    const rr = await api(`/api/admin/teams/${teamID}/slots/${slot.id}`, { method: 'DELETE' });
    if (rr.status === 204) { toastOk('Removed'); reload(); }
    else toastErr(rr.body?.error || `error ${rr.status}`);
  });
  return h('div', { style: 'margin-bottom:.5rem' },
    h('div', { class: 'row', style: 'gap:.4rem; align-items:center' },
      h('strong', { style: 'min-width:8ch' }, slot.name),
      urlInput, copyBtn, rotateBtn, removeBtn),
    slot.last_login_at
      ? h('div', { class: 'muted', style: 'font-size:.75rem; margin-left:.5rem' },
          `last login ${fmtLocal(slot.last_login_at)}`)
      : null);
}

  const assignments = org.assignments || [];
  const unused = assignments.filter((x) => !x.run_id);
  const used = assignments.filter((x) => x.run_id);
  const members = org.members || [];

  return h('div', { class: 'card' },
    h('div', { class: 'row between' },
      h('div', {},
        h('h2', {}, org.name),
        h('p', { class: 'muted', style: 'font-size:.85rem' },
          `${members.length} user${members.length === 1 ? '' : 's'} · `,
          `${org.players_total || 0} player${org.players_total === 1 ? '' : 's'} · `,
          `${org.runs_total || 0} run${org.runs_total === 1 ? '' : 's'}`,
          (org.runs_running || 0) > 0 ? ` · ${org.runs_running} running` : '')),
      h('div', { class: 'row end' },
        h('button', { class: 'btn small', on: { click: () => openAssignAdventure(org, adventures) } },
          icon(ICONS.plus), 'Assign'),
        h('button', { class: 'btn small', on: { click: () => openAddOrgMember(org) } },
          icon(ICONS.plus), 'Add user'),
        h('button', { class: 'btn small', on: { click: () => openRenameOrg(org) } },
          'Rename'),
        h('button', { class: 'btn small danger', on: { click: () => confirmDeleteOrg(org) } },
          icon(ICONS.trash)))),

    h('h3', { style: 'margin-top:.75rem' }, `Users (${members.length})`),
    members.length === 0
      ? h('p', { class: 'muted', style: 'font-size:.85rem' }, 'No users yet — add one to get started.')
      : h('div', {}, members.map((m) => h('span', {
          class: 'chip', style: 'margin: 0 .35rem .35rem 0',
          title: `${m.role} · click ⓧ to remove`,
        }, `${m.username} (${m.role === 'org_admin' ? 'admin' : 'member'})`,
        h('button', { title: 'Remove', on: { click: () => confirmRemoveOrgMember(org, m) } }, '×')))),

    h('h3', { style: 'margin-top:.75rem' }, `Unused assignments (${unused.length})`),
    unused.length === 0
      ? h('p', { class: 'muted', style: 'font-size:.85rem' }, 'None — assign an adventure to let them schedule a run.')
      : h('div', {}, unused.map((x) => h('span', {
          class: 'chip selectable',
          style: 'margin: 0 .35rem .35rem 0',
          title: 'Click to edit',
          on: { click: () => openEditAssignment(org, x, adventures) },
        }, `${x.adventure_slug} · ${x.max_teams} team${x.max_teams === 1 ? '' : 's'}`))),

    ...(used.length === 0 ? [] : [h('div', { style: 'margin-top:.75rem' },
      h('h3', {}, `Used (${used.length})`),
      h('div', {}, used.map((x) => h('span', {
          class: 'chip selectable',
          style: 'margin: 0 .35rem .35rem 0; opacity:.75; font-style:italic',
          title: 'Click to edit team cap',
          on: { click: () => openEditAssignment(org, x, adventures) },
        }, `${x.adventure_slug} · run #${x.run_id} · max ${x.max_teams}`))))]),
  );
}

async function openEditAssignment(org, assignment, adventures) {
  const used = !!assignment.run_id;
  await modal(`Edit assignment · ${org.name}`, ({ body, close }) => {
    const advSel = h('select', { disabled: used ? '' : null },
      adventures.map((a) => h('option', {
        value: a.slug, selected: a.slug === assignment.adventure_slug ? '' : null,
      }, `${a.title} (${a.slug})`)));
    const count = h('input', {
      type: 'number', min: 1, step: 1, value: String(assignment.max_teams), required: true,
    });
    const form = h('form', {},
      h('label', { class: 'field' },
        h('span', {}, used ? 'Adventure (locked — already used)' : 'Adventure'),
        advSel),
      h('label', { class: 'field' }, h('span', {}, 'Maximum teams'), count),
      h('p', { class: 'muted', style: 'font-size:.8rem' },
        used
          ? `Linked to run #${assignment.run_id}. You may raise the cap; lowering below the current team count is rejected.`
          : 'This assignment has not yet been used.'),
      h('div', { class: 'row between', style: 'margin-top:.5rem' },
        used
          ? h('span', {})
          : h('button', {
              class: 'btn danger', type: 'button',
              on: { click: async () => { close(null); await revokeAssignment(org.id, assignment.id); } },
            }, icon(ICONS.trash), 'Revoke'),
        h('div', { class: 'row' },
          h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, 'Cancel'),
          h('button', { class: 'btn primary', type: 'submit' }, 'Save'))));
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {};
      const newMax = parseInt(count.value, 10);
      if (!(newMax > 0)) { toastErr('Max teams must be at least 1'); return; }
      if (newMax !== assignment.max_teams) payload.max_teams = newMax;
      if (!used && advSel.value !== assignment.adventure_slug) payload.adventure_slug = advSel.value;
      if (Object.keys(payload).length === 0) { close(null); return; }
      const r = await api(`/api/admin/organizations/${org.id}/assignments/${assignment.id}`, {
        method: 'PATCH', body: JSON.stringify(payload),
      });
      if (r.status === 200) { toastOk('Assignment updated'); close(true); renderRoute(); }
      else toastErr(r.body?.error || `error ${r.status}`);
    });
    body.append(form);
  });
