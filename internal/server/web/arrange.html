    h('a', {
      class: 'btn small ghost',
      href: '#adventures/' + encodeURIComponent(event.adventure_slug),
    }, t('View adventure'), ' →'));
}

// renderEventQuickStats packs the three numbers an arranger glances
// at most often: how many teams have finished, how many slots have
// actually been claimed (i.e. tapped their magic-link at least
// once), and elapsed runtime / scheduled-in countdown.
function renderEventQuickStats(event, teams) {
  const total = teams.length;
  const done = teams.filter((tm) => tm.completed_at).length;
  let claimed = 0, slots = 0;
  for (const tm of teams) {
    for (const m of (tm.members || [])) {
      slots++;
      if (m.last_login_at) claimed++;
    }
  }
  const tiles = [
    statBlock(`${done}/${total || 1}`, total === 1 ? t('team done') : t('teams done')),
    statBlock(`${claimed}/${slots || 0}`, t('slots claimed')),
  ];
  // Time tile: elapsed for running/paused/completed, "starts in" for
  // scheduled, blank for cancelled. fmtElapsed prints "1h 12m".
  //
  // For completed/cancelled events the elapsed counter is FROZEN at
  // the completion time — without that clamp, an arranger looking at
  // an event from yesterday would see "23h 14m" instead of the run
  // duration. Server emits completed_at / cancelled_at on the DTO;
  // we pick the earlier of the two non-empty timestamps as the end.
  if (event.started_at) {
    const parseTS = (ts) => Date.parse(ts.includes('T') ? ts : ts.replace(' ', 'T') + 'Z');
    const startMs = parseTS(event.started_at);
    if (Number.isFinite(startMs)) {
      let endMs = Date.now();
      const candidates = [event.completed_at, event.cancelled_at].filter(Boolean);
      for (const ts of candidates) {
        const ms = parseTS(ts);
        if (Number.isFinite(ms) && ms < endMs) endMs = ms;
      }
      const elapsedSec = Math.max(0, Math.floor((endMs - startMs) / 1000));
      tiles.push(statBlock(fmtElapsedShort(elapsedSec), t('elapsed')));
    }
  } else if (event.scheduled_at) {
    const sMs = Date.parse(event.scheduled_at.includes('T')
      ? event.scheduled_at : event.scheduled_at.replace(' ', 'T') + 'Z');
    if (Number.isFinite(sMs)) {
      const remaining = Math.max(0, Math.floor((sMs - Date.now()) / 1000));
      tiles.push(statBlock(remaining > 0 ? fmtElapsedShort(remaining) : t('now'),
        t('starts in')));
    }
  }
  return h('div', { class: 'adv-stats' }, ...tiles);
}

// fmtElapsedShort renders a duration as "Hh Mm" or "Mm Ss" — short
// enough to fit in a stat tile without truncation. Independent of
// formatDuration (which renders HH:MM:SS) because the stat tiles
// want the unit suffix for readability at a glance.
function fmtElapsedShort(sec) {
  if (sec <= 0) return '0m';
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m`;
  return `${s}s`;
}

// renderEventResultsCard is the post-event summary that surfaces
// once the event hits a terminal state. Lists teams in finishing
// order (or "didn't finish" at the bottom), a recap link per team,
// and a copy-all button so the arranger can paste the recap URLs
// into a follow-up email. Only emitted when event.state is
// completed/cancelled.
function renderEventResultsCard(event, teams) {
  if (event.state !== 'completed' && event.state !== 'cancelled') return null;
  const finished = teams.filter((tm) => tm.completed_at)
    .slice()
    .sort((a, b) => (a.completed_at || '').localeCompare(b.completed_at || ''));
  const unfinished = teams.filter((tm) => !tm.completed_at)
    .slice()
    .sort((a, b) => b.page_index - a.page_index);
  const recapURL = (tok) => `${location.origin}/recap/${encodeURIComponent(tok)}`;

  const list = h('ol', { class: 'results-list' });
  finished.forEach((tm, i) => {
    const li = h('li', {},
      h('span', { class: 'results-rank' }, '#' + (i + 1)),
      h('strong', { class: 'results-name' }, tm.name),
      h('span', { class: 'muted', style: 'font-size:.8rem' },
        ' · ', t('finished {{when}}', { when: fmtLocal(tm.completed_at) })));
    if (tm.recap_token) {
      li.append(' ',
        h('a', { class: 'results-recap', href: recapURL(tm.recap_token), target: '_blank', rel: 'noopener' },
          icon(ICONS.eye), t('Recap')));
    }
    list.append(li);
  });
  unfinished.forEach((tm) => {
    list.append(h('li', { class: 'results-dnf' },
      h('span', { class: 'results-rank muted' }, '—'),
      h('strong', { class: 'results-name' }, tm.name),
      h('span', { class: 'muted', style: 'font-size:.8rem' },
        ' · ', t('reached puzzle {{i}}', { i: tm.page_index + 1 }))));
  });

  const copyAllBtn = h('button', { class: 'btn small', type: 'button' },
    icon(ICONS.copy), t('Copy recap links'));
  copyAllBtn.addEventListener('click', async () => {
    const lines = teams
      .filter((tm) => tm.recap_token)
      .map((tm) => `${tm.name}\t${recapURL(tm.recap_token)}`);
    if (lines.length === 0) {
      toastErr(t('No recap links to copy'));
      return;
    }
    try {
      await navigator.clipboard.writeText(lines.join('\n'));
      toastOk(t('Copied {{n}} recap links', { n: lines.length }));
    } catch {
      toastErr(t('Could not copy.'));
    }
  });

  return h('div', { class: 'card results-card' },
    h('div', { class: 'row between', style: 'margin-bottom:.5rem' },
      h('h2', { style: 'margin:0' },
        event.state === 'cancelled' ? t('Final standings (cancelled)') : t('Results')),
      copyAllBtn),
    list);
}

async function viewRunDetail(view, runID) {
  // Fetch event/positions/tracks/activity in parallel; the adventure
  // depends on event.adventure_slug from detail, so it kicks off in
  // a second await once detail is in. The previous shape duplicated
  // the events fetch inside the Promise.all to avoid this dependency
  // — that was a wasted round-trip and silently dropped the
  // adventure on any HTTP-level error from the inner second call.
  // The live map + per-team tracks moved to /control — this page is
  // setup + wrap-up now, so we only fetch the structured detail and
  // the historical activity log.
  const [detail, eventsR] = await Promise.all([
    api('/api/admin/events/' + runID),
    api('/api/admin/events/' + runID + '/activity'),
  ]);
  if (!detail.ok) { view.replaceChildren(h('p', { class: 'err' }, detail.body?.error || t('not found'))); return; }
  const event = detail.body.event;
  const teams = detail.body.teams || [];
  const events = eventsR.body?.events || [];

  // Adventure: read after detail so we know the slug. ok-check
  // before unwrapping body — older paths blindly read `adventureR.body`
  // which on a 4xx is the error envelope (no title / no avatar_url),
  // explaining the "no icon" reports.
  const adventureR = await api('/api/admin/adventures/' + encodeURIComponent(event.adventure_slug));
  const adventure = adventureR.ok ? adventureR.body : null;

  // Lifecycle action lives at the top — during a live event this is
  // what the arranger reaches for, so it belongs above everything.
  const actions = h('div', { class: 'row', style: 'gap:.5rem; flex-wrap:wrap' });
  // Race control is the live cockpit. Surface it as primary while
  // the event is running/paused (where the arranger should be looking
  // at it), as a secondary affordance otherwise. Hidden on cancelled
  // events — there's nothing live to show.
  if (event.state !== 'cancelled') {
    const live = event.state === 'running' || event.state === 'paused';
    actions.append(h('button', {
      class: 'btn lifecycle-btn' + (live ? ' primary' : ''),
      on: { click: () => nav('#events/' + event.id + '/control') },
      title: t('Live leaderboard, map, and activity'),
    }, icon(ICONS.eye), t('Race control')));
  }
  if (event.state === 'scheduled') {
    const start = h('button', { class: 'btn primary lifecycle-btn', on: { click: () => confirmStart(event) } },
      icon(ICONS.play), t('Start now'));
    const sched = h('button', { class: 'btn lifecycle-btn', on: { click: () => openEditSchedule(event) } },
      icon(ICONS.schedule), t('Reschedule'));
    actions.append(start, sched);
  }
  // Pause / Resume live on the Race control view — that's where the
  // arranger watches the race in real time and would naturally reach
  // for them. Keeping them here too just doubled up the same control
  // surface in two places. Cancel stays because it's reachable from
  // a scheduled event too (no race-control entry until running).
  // Cancel is the escape hatch for an event that needs to end before
  // it has finished — equipment broke, weather, the venue dropped out.
  // Allowed from scheduled / running / paused; the server gates with
  // a password confirm because cancellation discards in-flight state.
  if (event.state === 'scheduled' || event.state === 'running' || event.state === 'paused') {
    const cancel = h('button', { class: 'btn danger lifecycle-btn', on: { click: () => confirmCancel(event) } },
      icon(ICONS.trash), t('Cancel event'));
    actions.append(cancel);
  }
  // Results export is always available once there are teams — arrangers
  // often want to grab mid-event standings too, not just post-mortem.
  // The PDF is the polished artifact for stakeholders (HR boss, the
  // participating team's Slack); the CSV is the spreadsheet drilldown
  // for finance / further analysis. Both off the same data so a
  // stakeholder cross-checking won't see disagreement.
  if (teams.length > 0) {
    const finishedN = teams.filter((tm) => tm.completed_at).length;
    const allDone   = finishedN === teams.length;
    const pdf = h('a', {
      class: 'btn lifecycle-btn' + (allDone ? ' primary' : ''),
      href: '/api/admin/events/' + event.id + '/recap.pdf',
      download: `event-${event.id}-recap.pdf`,
      title: t('Download a branded PDF report you can share with stakeholders'),
    }, icon(ICONS.copy), allDone ? t('Download report (PDF)') : t('Download report (PDF)'));
    actions.append(pdf);
    const csv = h('a', {
      class: 'btn lifecycle-btn',
      href: '/api/admin/events/' + event.id + '/results.csv',
      download: `run-${event.id}-results.csv`,
      title: t('Download CSV of the current standings'),
    }, icon(ICONS.copy), t('Download CSV'));
    actions.append(csv);
  }
  // Calendar invite — useful before AND during scheduling, so we
  // surface it whenever the event has a scheduled / started time.
  // Forwards the .ics to participants so the event drops into their
  // Google / Outlook calendar like any other meeting.
  if (event.scheduled_at || event.started_at) {
    const ics = h('a', {
      class: 'btn lifecycle-btn',
      href: '/api/admin/events/' + event.id + '/invite.ics',
      download: `event-${event.id}-invite.ics`,
      title: t('Download a calendar invite (.ics) you can forward to participants'),
    }, icon(ICONS.copy), t('Download calendar invite'));
    actions.append(ics);
  }
  // Proactive bulk-send: iterate the event's teams and mail each
  // their slot links + the .ics. Surfaced once at least one team
  // has a contact email so the button isn't a dead-end on events
  // where the arranger always plans to hand out links manually.
  const teamsWithEmail = teams.filter((tm) => tm.email && tm.email.trim()).length;
  if (teamsWithEmail > 0) {
    actions.append(h('button', {
      class: 'btn lifecycle-btn',
      type: 'button',
      title: t('Email each team their join links + calendar invite'),
      on: { click: () => sendEventInvitations(event, teamsWithEmail) },
    }, icon(ICONS.mail), t('Email invitations ({{n}})', { n: teamsWithEmail })));
  }

  // Last-activity-per-team: the newest event timestamp the team was
  // involved in. Used to highlight teams that look stuck.
  const lastEventByTeam = new Map();
  for (const ev of events) {
    if (!ev.team_id) continue;
    const prev = lastEventByTeam.get(ev.team_id);
    if (!prev || (ev.created_at > prev)) lastEventByTeam.set(ev.team_id, ev.created_at);
  }
  const STUCK_MS = 10 * 60 * 1000;

  // Build team → colour index up-front so the swatch next to each
  // team in the table matches the leaderboard colours on Race control.
  // (The legend + area map that used to live here moved to Race
  // control, which has the live positions and full-width map.)
  const teamIndex = new Map();
  teams.forEach((t, i) => teamIndex.set(t.id, i));

  // Sticky lifecycle bar — pins to the top of the scroll area so big
  // Start/Pause/Resume stay reachable while scrolling through teams.
  const titleEl = h('h1', {}, runLabel(event));
  const renameBtn = iconBtn('pencil', t('Rename event'), () => openRenameEvent(event));
  const lifecycleBar = h('div', { class: 'lifecycle-bar' },
    h('div', { class: 'lifecycle-left' },
      h('button', { class: 'btn ghost small', on: { click: () => nav('#events') } },
        icon(ICONS.back), t('Events')),
      titleEl, renameBtn,
      h('span', { class: 'pill ' + pillClassForState(event.state) }, stateGlyph(event.state) + t(event.state || '')),
      h('span', { class: 'muted', style: 'font-size:.85rem' },
        event.started_at
          ? t('Started {{when}}', { when: fmtLocal(event.started_at) })
          : event.scheduled_at
            ? t('Auto-start {{when}}', { when: fmtLocal(event.scheduled_at) })
            : t('Not scheduled')),
    ),
    actions,
  );

  // Teams card with search + filter chips + pending-slot indicator.
  // Wrapped in a closure so search/filter changes re-render only the
  // table body without rebuilding the whole event-detail page.
  const teamsTableHost = h('div');
  let teamsFilter = 'all';
  let teamsQuery = '';
  const teamsRender = () => {
    const filtered = teams.filter((tm) => {
      const lastEv = lastEventByTeam.get(tm.id);
      const lastMs = lastEv ? Date.parse(lastEv.includes('T') ? lastEv : lastEv.replace(' ', 'T') + 'Z') : null;
      // Withdrawn teams are intentionally inactive — they shouldn't
      // raise the "stuck?" flag or fall under the "unstarted" filter
      // (the race director already knows they're out).
      const stuck = event.state === 'running' && !tm.completed_at && !tm.withdrawn_at
        && lastMs != null && (Date.now() - lastMs) > STUCK_MS;
      // "Unstarted" — no slot has logged in yet. Distinct from
      // "stuck", which is "logged in but inactive for 10 min+".
      const claimed = (tm.members || []).some((m) => m.last_login_at);
      const matchFilter = (
        teamsFilter === 'all' ||
        (teamsFilter === 'done' && tm.completed_at) ||
        (teamsFilter === 'stuck' && stuck) ||
        (teamsFilter === 'unstarted' && !claimed && !tm.withdrawn_at)
      );
      if (!matchFilter) return false;
      if (!teamsQuery) return true;
      const q = teamsQuery.toLowerCase();
      return tm.name.toLowerCase().includes(q) ||
        (tm.email || '').toLowerCase().includes(q);
    });
    teamsTableHost.replaceChildren();
    if (filtered.length === 0) {
      teamsTableHost.append(h('div', { class: 'empty' },
        h('p', { class: 'muted' },
          teams.length === 0
            ? t('No teams yet.')
            : t('No teams match this filter.')),
        teams.length === 0 && canDo(event, 'create_team')
          ? h('button', { class: 'btn primary', on: { click: () => openTeamModal(event.id, null) } },
              icon(ICONS.plus), t('Add the first team'))
          : null));
      return;
    }
    teamsTableHost.append(h('table', { class: 'table' },
      h('thead', {}, h('tr', {},
        h('th', {}, t('Team')),
        h('th', {}, t('Puzzle')),
        h('th', { class: 'hide-narrow' }, t('Activity')),
        h('th', {}, ''))),
      h('tbody', {}, filtered.map((tm) => {
        const i = teamIndex.get(tm.id) ?? 0;
        const page = adventure?.pages?.[tm.page_index];
        const lastEv = lastEventByTeam.get(tm.id);
        const lastMs = lastEv ? Date.parse(lastEv.includes('T') ? lastEv : lastEv.replace(' ', 'T') + 'Z') : null;
        const stuck = event.state === 'running' && !tm.completed_at && lastMs != null && (Date.now() - lastMs) > STUCK_MS;
        // Per-team claimed-slot count — surfaces "3/4 claimed" when
        // not every player has tapped their magic link yet. Hidden
        // when every slot is either claimed or the team is done
        // (the data is no longer actionable).
        const slotsTotal   = (tm.members || []).length;
        const slotsClaimed = (tm.members || []).filter((m) => m.last_login_at).length;
        const showClaimed  = slotsTotal > 0 && slotsClaimed < slotsTotal && !tm.completed_at;
        return h('tr', { class: stuck ? 'row-stuck' : '' },
          h('td', {},
            h('span', {
              style: 'display:inline-flex; align-items:center; gap:.5rem; vertical-align:middle',
            },
              teamAvatar(tm, teamColor(tm.id, i), 26),
              h('a', { href: '#', on: { click: (e) => { e.preventDefault(); openTeamDetail(event.id, tm, adventure, event); } } }, tm.name)),
            tm.completed_at ? h('span', { class: 'pill success', style: 'margin-left:.5rem' }, '✓ ' + t('done')) : null,
            tm.withdrawn_at ? h('span', { class: 'pill', style: 'margin-left:.5rem' }, t('withdrew')) : null,
            stuck ? h('span', { class: 'pill warning', style: 'margin-left:.5rem' }, '⚠ ' + t('stuck?')) : null,
            showClaimed
              ? h('span', { class: 'pill', style: 'margin-left:.5rem; font-size:.7rem' },
                  t('{{n}}/{{m}} claimed', { n: slotsClaimed, m: slotsTotal }))
              : null,
            tm.email
              ? h('div', { class: 'muted', style: 'font-size:.78rem; margin-top:.15rem; padding-left:2.1rem' },
                  h('a', { href: 'mailto:' + tm.email, style: 'color:inherit; text-decoration:none' }, tm.email))
              : null),
          h('td', {},
            h('div', { class: 'mono' },
              adventure?.pages
                ? t('{{i}} / {{n}}', {
                    i: Math.min(tm.page_index + 1, adventure.pages.length),
                    n: adventure.pages.length,
                  })
                : tm.page_index),
            page && !tm.completed_at
              ? h('div', { class: 'muted', style: 'font-size:.85rem' }, page.title || t('(untitled)'))
              : null),
          h('td', { class: 'hide-narrow muted', style: 'font-size:.85rem' },
            lastEv ? fmtLocal(lastEv) : t('—')),
          h('td', {}, h('div', { class: 'row end' },
            // Email the team their join links + calendar invite.
            // Only meaningful when the team has a contact email;
            // existing tokens are sent verbatim (no re-mint), so an
            // accidental click can't kick a teammate out mid-game.
            // Confirm dialog spells out who and what before the
            // mail goes out so a stray tap doesn't surprise the
            // recipient.
            tm.email && tm.email.trim()
              ? iconBtn('mail', t('Email invitation to {{email}}', { email: tm.email }),
                  (e) => resendTeamInvitation(tm, e.target.closest('button')))
              : null,
            iconBtn('pencil', t('Edit team'),   () => openTeamModal(event.id, tm, event)),
            canDo(event, 'delete_team')
              ? iconBtn('trash', t('Delete team'), () => confirmDeleteTeam(tm), { danger: true })
              : null)),
        );
      }))));
  };
  // Search input + filter chips. Only wired when there's at least one
  // team — empty-state has its own CTA and no filter would do anything.
  const searchInput = h('input', {
    type: 'search', placeholder: t('Search by name or email'),
    style: 'flex:1; min-width:8rem; max-width:18rem',
  });
  searchInput.addEventListener('input', () => {
    teamsQuery = searchInput.value.trim();
    teamsRender();
  });
  const chipDef = [
    { key: 'all',       label: t('All') },
    { key: 'done',      label: t('Done') },
    { key: 'stuck',     label: t('Stuck') },
    { key: 'unstarted', label: t('Unstarted') },
  ];
  const chipBar = h('div', { class: 'row', style: 'gap:.25rem; flex-wrap:wrap' });
  chipDef.forEach((c) => {
    const btn = h('button', {
      class: 'btn small' + (teamsFilter === c.key ? ' primary' : ' ghost'),
      type: 'button',
    }, c.label);
    btn.addEventListener('click', () => {
      teamsFilter = c.key;
      // Re-render the chip bar to flip the active style.
      for (const child of chipBar.children) {
        const k = child.dataset.k;
        child.className = 'btn small' + (k === teamsFilter ? ' primary' : ' ghost');
      }
      teamsRender();
    });
    btn.dataset.k = c.key;
    chipBar.append(btn);
  });

  const teamsCard = h('div', { class: 'card' },
    h('div', { class: 'row between', style: 'flex-wrap:wrap; gap:.5rem' },
      h('h2', { style: 'margin:0' },
        t('Teams'),
        event.max_players > 0
          ? h('span', { class: 'muted', style: 'font-weight:400; margin-left:.4rem; font-size:.85rem' },
              t('({{slots}} / {{max}} players · {{teams}} teams)',
                { slots: event.player_slots_count || 0, max: event.max_players, teams: teams.length }))
          : null),
      h('button', {
        class: 'btn primary small',
        disabled: !canDo(event, 'create_team')
          || (event.max_players > 0 && (event.player_slots_count || 0) >= event.max_players)
          ? '' : null,
        title: !canDo(event, 'create_team')
          ? (event.state === 'completed' ? t('Event is completed — read-only.') : t('Event is active.'))
          : null,
        on: { click: () => openTeamModal(event.id, null) },
      }, icon(ICONS.plus), t('New team'))),
    teams.length > 0
      ? h('div', { class: 'row', style: 'gap:.5rem; align-items:center; flex-wrap:wrap; margin:.5rem 0 .75rem' },
          searchInput, chipBar)
      : null,
    teamsTableHost);
  teamsRender();

  // Event log — capped at 50vh on mobile so it doesn't dominate
  // the page below the teams table. The .event-log-body wrapper
  // owns the scroll so the heading and any future toolbar stay
  // pinned above.
  const eventLogCard = h('div', { class: 'card' },
    h('h2', { style: 'margin:0 0 .5rem' }, t('Event log')),
    h('div', { class: 'event-log-body' }, renderEventFeed(events, teams)));

  view.replaceChildren(...[
    lifecycleBar,
    renderEventAdventureStrip(adventure, event),
    renderEventQuickStats(event, teams),
    renderEventResultsCard(event, teams),
    renderTeamLinksPanel(event, teams),
    renderShareBar(event),
    h('div', { class: 'grid cols-2' }, teamsCard, eventLogCard),
  ].filter(Boolean));
}

// viewEventControl is the live "race control" cockpit — a verbose,
// realtime alternative to the public /live page. The route is
// `events/{id}/control`; arrangeWS pushes drive auto re-renders the
// same way they do on the setup detail page.
//
// Composition (all live, all filterable):
//   - Sticky header with elapsed timer + state pill + lifecycle controls
//   - Team filter bar (multi-select chips)
//   - Stats tiles (teams done / slots claimed / elapsed)
//   - Map (filtered to selected teams)
//   - Leaderboard table (filtered) + activity feed (filtered) side-by-side
//   - Lobby-TV share at the bottom
async function viewEventControl(view, runID) {
  const [detail, tracksR, eventsR] = await Promise.all([
    api('/api/admin/events/' + runID),
    api('/api/admin/events/' + runID + '/tracks'),
    api('/api/admin/events/' + runID + '/activity'),
  ]);
  if (!detail.ok) {
    view.replaceChildren(h('p', { class: 'err' }, detail.body?.error || t('not found')));
    return;
  }
  const event = detail.body.event;
  const teams = detail.body.teams || [];
  const tracks = tracksR.body?.tracks || [];
  const events = eventsR.body?.events || [];

  const advR = await api('/api/admin/adventures/' + encodeURIComponent(event.adventure_slug));
  const adventure = advR.ok ? advR.body : null;

  // Filter state, scoped per event. Mutated in place so chip clicks
  // immediately reflect on the next render() pass without re-fetching.
  let filterSet = arrangeUIState.controlFilter.get(event.id);
  if (!filterSet) {
    filterSet = new Set();
    arrangeUIState.controlFilter.set(event.id, filterSet);
  }
  // Drop stale team IDs (a team was deleted between renders) so the
  // chip bar doesn't render dead entries.
  for (const id of [...filterSet]) {
    if (!teams.some((tm) => tm.id === id)) filterSet.delete(id);
  }
  // Dynamic — must NOT be captured. The chip handlers mutate
  // filterSet in place and call renderControlBody(); a captured
  // `showAll` would still hold its initial value during that next
  // render and the leaderboard/map/feed would keep showing every
  // team regardless of which chips the arranger toggled.
  const teamMatches = (tm) => filterSet.size === 0 || filterSet.has(tm.id);

  // Team -> colour map shared by leaderboard, map traces and chips.
  const teamIndex = new Map();
  teams.forEach((tm, i) => teamIndex.set(tm.id, i));

  // === Header ===
  const back = h('button', {
    class: 'btn ghost small',
    on: { click: () => nav('#events/' + event.id) },
  }, icon(ICONS.back), t('Back to event'));

  // Elapsed clamps to completed_at / cancelled_at when set so the
  // counter freezes on a finished event.
  const parseTS = (ts) => Date.parse(ts.includes('T') ? ts : ts.replace(' ', 'T') + 'Z');
  const elapsedSeconds = () => {
    if (!event.started_at) return 0;
    const startMs = parseTS(event.started_at);
    if (!Number.isFinite(startMs)) return 0;
    let endMs = Date.now();
    for (const ts of [event.completed_at, event.cancelled_at].filter(Boolean)) {
      const ms = parseTS(ts);
      if (Number.isFinite(ms) && ms < endMs) endMs = ms;
    }
    return Math.max(0, Math.floor((endMs - startMs) / 1000));
  };
  const elapsedEl = h('span', { class: 'mono', style: 'font-weight:700' },
    fmtElapsedShort(elapsedSeconds()));
  // The elapsed counter ticks every second locally so the arranger
  // sees movement between server pushes (which can be several
  // seconds apart). Cleared when the view tears down.
  if (window._zvControlTick) clearInterval(window._zvControlTick);
  window._zvControlTick = setInterval(() => {
    if (!elapsedEl.isConnected) { clearInterval(window._zvControlTick); return; }
    elapsedEl.textContent = fmtElapsedShort(elapsedSeconds());
  }, 1000);

  const lifecycleActions = h('div', { class: 'row', style: 'gap:.5rem; flex-wrap:wrap' });
  if (event.state === 'running') {
    lifecycleActions.append(h('button', {
      class: 'btn warning small',
      on: { click: () => confirmPause(event) },
    }, icon(ICONS.moon), t('Pause')));
  }
  if (event.state === 'paused') {
    lifecycleActions.append(h('button', {
      class: 'btn primary small',
      on: { click: () => transition(event.id, 'resume') },
    }, icon(ICONS.play), t('Resume')));
  }
  if (event.state === 'running' || event.state === 'paused' || event.state === 'scheduled') {
    lifecycleActions.append(h('button', {
      class: 'btn danger small',
      on: { click: () => confirmCancel(event) },
    }, icon(ICONS.trash), t('Cancel event')));
  }
  // Live view share — copies the public /live URL to the clipboard
  // so the arranger can paste it on a screen for spectators.
  const liveURL = location.origin + '/live/' + encodeURIComponent(event.live_token || '');
  lifecycleActions.append(h('button', {
    class: 'btn ghost small',
    title: liveURL,
    on: { click: async () => {
      try {
        await navigator.clipboard.writeText(liveURL);
        toastOk(t('Live view link copied'));
      } catch {
        toastErr(t('Copy failed — paste from the address bar manually.'));
      }
    } },
  }, icon(ICONS.copy), t('Copy live view link')));

  const header = h('div', { class: 'lifecycle-bar' },
    h('div', { class: 'lifecycle-left' },
      back,
      h('h1', { style: 'margin:0; font-size:1.4rem' }, runLabel(event)),
      h('span', { class: 'pill ' + pillClassForState(event.state) },
        stateGlyph(event.state) + t(event.state || '')),
      h('span', { class: 'muted', style: 'font-size:.85rem' },
        event.started_at ? t('elapsed') + ' ' : t('—')),
      elapsedEl,
    ),
    lifecycleActions,
  );

  // === Team filter chips ===
  // Click "All" to clear the filter; click a team chip to toggle it.
  // The selected set persists across re-renders so a WS-triggered
  // refresh doesn't blow away the arranger's narrowed focus.
  const toggleTeam = (id) => {
    if (filterSet.has(id)) filterSet.delete(id);
    else filterSet.add(id);
    renderControlBody();
  };
  const clearFilter = () => { filterSet.clear(); renderControlBody(); };

  const filterChip = (label, active, onClick, swatch) => {
    const chip = h('button', {
      class: 'btn small' + (active ? ' primary' : ' ghost'),
      type: 'button',
      style: 'gap:.4rem',
      on: { click: onClick },
    });
    if (swatch) chip.append(h('span', { class: 'sw', style: `background:${swatch}` }));
    chip.append(h('span', {}, label));
    return chip;
  };
  const filterBar = h('div', {
    class: 'card',
    style: 'padding:.6rem .75rem; display:flex; align-items:center; gap:.4rem; flex-wrap:wrap',
  });
  const buildFilterBar = () => {
    filterBar.replaceChildren(
      h('span', { class: 'muted', style: 'font-size:.85rem; margin-right:.25rem' },
        t('Show:')),
      filterChip(t('All teams'), filterSet.size === 0, clearFilter),
      ...teams.map((tm) => {
        const i = teamIndex.get(tm.id) ?? 0;
        return filterChip(tm.name, filterSet.has(tm.id), () => toggleTeam(tm.id),
          teamColor(tm.id, i));
      }),
    );
  };

  // === Stats tiles ===
  const statsHost = h('div', { class: 'adv-stats' });
  const buildStats = () => {
    const visible = teams.filter(teamMatches);
    const total = visible.length;
    const done = visible.filter((tm) => tm.completed_at).length;
    let claimed = 0, slots = 0;
    for (const tm of visible) {
      for (const m of (tm.members || [])) {
        slots++;
        if (m.last_login_at) claimed++;
      }
    }
    statsHost.replaceChildren(
      statBlock(`${done}/${total || 0}`, total === 1 ? t('team done') : t('teams done')),
      statBlock(`${claimed}/${slots || 0}`, t('slots claimed')),
      statBlock(fmtElapsedShort(elapsedSeconds()), t('elapsed')),
    );
  };

  // === Leaderboard ===
  // Sorted by completion (finished first by completion time, then
  // unfinished by furthest page, then by team name as tiebreaker).
  const lbHost = h('div', { class: 'card' });
  const lastEventByTeam = new Map();
  for (const ev of events) {
    if (!ev.team_id) continue;
    const prev = lastEventByTeam.get(ev.team_id);
    if (!prev || (ev.created_at > prev)) lastEventByTeam.set(ev.team_id, ev.created_at);
  }
  const teamRank = (tm) => {
    if (tm.completed_at) return 0;          // finished: top group
    if (tm.withdrawn_at) return 2;          // withdrew: bottom group
    return 1;                                // still active: middle group
  };
  const canWithdraw = (event.allowed_ops || []).includes('withdraw_team');
  const buildLeaderboard = () => {
    const visible = teams.filter(teamMatches).slice().sort((a, b) => {
      const ra = teamRank(a), rb = teamRank(b);
      if (ra !== rb) return ra - rb;
      if (ra === 0) return (a.completed_at || '').localeCompare(b.completed_at || '');
      if (a.page_index !== b.page_index) return b.page_index - a.page_index;
      return a.name.localeCompare(b.name);
    });
    lbHost.replaceChildren(
      h('h2', { style: 'margin:0 0 .5rem' }, t('Leaderboard')),
      visible.length === 0
        ? h('p', { class: 'muted', style: 'margin:0' }, t('No teams match the current filter.'))
        : h('div', { class: 'control-scroll' }, h('table', { class: 'table' },
            h('thead', {}, h('tr', {},
              h('th', {}, '#'),
              h('th', {}, t('Team')),
              h('th', {}, t('Puzzle')),
              h('th', { class: 'hide-narrow' }, t('Last activity')),
              h('th', {}, ''))),
            h('tbody', {}, visible.map((tm, rank) => {
              const i = teamIndex.get(tm.id) ?? 0;
              const lastEv = lastEventByTeam.get(tm.id);
              const withdrawn = !!tm.withdrawn_at;
              const rowStyle = withdrawn ? 'opacity:.55' : '';
              return h('tr', { style: rowStyle },
                h('td', { class: 'mono' }, '#' + (rank + 1)),
                h('td', {},
                  h('span', { style: 'display:inline-flex; align-items:center; gap:.5rem' },
                    h('span', { class: 'sw', style: `background:${teamColor(tm.id, i)}` }),
                    tm.name),
                  tm.completed_at
                    ? h('span', { class: 'pill success', style: 'margin-left:.4rem' }, '✓ ' + t('done'))
                    : null,
                  withdrawn
                    ? h('span', { class: 'pill', style: 'margin-left:.4rem' }, t('withdrew'))
                    : null),
                h('td', { class: 'mono' },
                  adventure?.pages
                    ? t('{{i}} / {{n}}', {
                        i: Math.min(tm.page_index + 1, adventure.pages.length),
                        n: adventure.pages.length,
                      })
                    : tm.page_index),
                h('td', { class: 'hide-narrow muted', style: 'font-size:.85rem' },
                  lastEv ? fmtLocal(lastEv) : t('—')),
                // Withdraw / un-withdraw is the per-row action surface.
                // Hidden once the event hits a terminal state (server
                // rejects too) and on already-finished teams (a finisher
                // can't be retroactively withdrawn).
                h('td', { style: 'text-align:right' },
                  canWithdraw && !tm.completed_at
                    ? (withdrawn
                        ? iconBtn('back', t('Mark returned'),
                            () => unwithdrawTeam(event.id, tm))
                        : iconBtn('moon', t('Mark withdrawn'),
                            () => confirmWithdrawTeam(event.id, tm)))
                    : null),
              );
            }))))
    );
  };

  // === Activity feed (filtered) ===
  const feedHost = h('div', { class: 'card' });
  const buildFeed = () => {
    const visibleEvents = events.filter((ev) => {
      if (filterSet.size > 0 && ev.team_id && !filterSet.has(ev.team_id)) return false;
      // Drop noisy lifecycle rows from the feed — race control wants
      // the "what's happening to teams right now" stream, not setup
      // history. The setup-detail page's Event log keeps the full
      // record for after-action review.
      if (ev.kind === 'event_created' || ev.kind === 'team_created' ||
          ev.kind === 'event_started' || ev.kind === 'event_paused' ||
          ev.kind === 'event_resumed') return false;
      return true;
    });
    feedHost.replaceChildren(
      h('h2', { style: 'margin:0 0 .5rem' }, t('Activity')),
      visibleEvents.length === 0
        ? h('p', { class: 'muted', style: 'margin:0' }, t('No activity yet.'))
        : h('div', { class: 'control-scroll' }, renderEventFeed(visibleEvents, teams)),
    );
  };

  // === Map ===
  const mapHost = h('div', { class: 'map-host', id: 'control-map-' + event.id,
    style: 'min-height:340px' });
  const mapCard = h('div', { class: 'card' },
    h('h2', { style: 'margin:0 0 .5rem' }, t('Map')),
    mapHost);
  // Leaflet rejects L.map() on a host that already has a map attached,
  // so without an explicit teardown a filter-driven re-render would
  // silently fail and the map would freeze on whatever the first call
  // drew. We capture the instance and remove() it before each rebuild.
  let mapInstance = null;
  const buildMap = () => {
    if (!adventure) return;
    if (mapInstance) {
      try { mapInstance.remove(); } catch { /* leaflet teardown is best-effort */ }
      mapInstance = null;
    }
    // .remove() detaches the map but leaves Leaflet's _leaflet_id on
    // the host element; clearing children + removing that marker
    // gives the next L.map() a truly fresh container.
    mapHost.replaceChildren();
    delete mapHost._leaflet_id;
    const visibleTeams = teams.filter(teamMatches);
    const visibleIDs = new Set(visibleTeams.map((tm) => tm.id));
    const visibleTracks = tracks.filter((tr) => visibleIDs.has(tr.team_id));
    mapInstance = initRunMap(mapHost, adventure, visibleTeams, visibleTracks);
  };

  // === Compose + render ===
  const body = h('div', { class: 'grid', style: 'gap:1rem' });
  const renderControlBody = () => {
    buildFilterBar();
    buildStats();
    buildLeaderboard();
    buildFeed();
    buildMap();
  };
  body.append(
    statsHost,
    h('div', { class: 'control-grid' }, lbHost, feedHost),
    mapCard,
  );

  view.replaceChildren(header, filterBar, body);
  renderControlBody();
}

// initRunMap mounts a Leaflet map inside host. Puzzle pins come from the
// adventure (all pages always have a location now); per-team polylines and
// latest-position dots come from the tracks payload. Returns the map
// instance so callers can .remove() it before re-initialising — Leaflet
// rejects L.map() on a host that already has a map attached, and a
// silent failure is exactly what causes filter changes to look like
// they don't apply.
function initRunMap(host, adventure, teams, tracks) {
  if (typeof L === 'undefined') {
    host.replaceChildren(h('div', { class: 'empty' }, t('Map library is still loading — refresh the page.')));
    return null;
  }
  const map = L.map(host, { scrollWheelZoom: false }).setView([59.3293, 18.0686], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 19,
  }).addTo(map);

  const bounds = L.latLngBounds([]);

  // Puzzle markers.
  for (const p of (adventure.pages || [])) {
    const ll = [p.location.lat, p.location.lng];
    const marker = L.marker(ll, {
      icon: L.divIcon({
        className: '',
        html: `<div class="puzzle-marker ${p.gated ? 'gated' : ''}"><span>${p.index + 1}</span></div>`,
        iconSize: [28, 28],
        iconAnchor: [14, 28],
      }),
    }).addTo(map);
    marker.bindPopup(
      `<strong>${p.index + 1}. ${p.title || t('Puzzle')}</strong>` +
      (p.gated && p.location.radius_m
        ? `<br><em>${t('Gated — {{r}} m', { r: p.location.radius_m })}</em>`
        : '') +
      `<br><small>${p.location.lat.toFixed(5)}, ${p.location.lng.toFixed(5)}</small>`
    );
    bounds.extend(ll);
  }

  // Team traces.
  const teamByID = new Map();
  teams.forEach((t, i) => teamByID.set(t.id, { team: t, i }));
  for (const track of tracks) {
    const info = teamByID.get(track.team_id);
    const colour = teamColor(track.team_id, info ? info.i : 0);
    if (track.points.length > 0) {
      const latlngs = track.points.map((p) => [p.lat, p.lng]);
      L.polyline(latlngs, { color: colour, weight: 3, opacity: .85 }).addTo(map);
      const latest = track.points[track.points.length - 1];
      // Circular avatar marker — the uploaded picture when present,
      // initials-on-team-colour otherwise. A coloured ring keeps the
      // "which polyline is whose" legibility we had with the dot.
      const initials = teamInitials(track.team_name);
      const size = 30;
      const html = track.avatar_url
        ? `<div class="team-marker" style="--team-col:${colour}; width:${size}px; height:${size}px;">`
            + `<img src="${track.avatar_url}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:${JSON.stringify(initials)}}))"/>`
            + `</div>`
        : `<div class="team-marker no-img" style="--team-col:${colour}; width:${size}px; height:${size}px;">`
            + `<span>${initials}</span></div>`;
      L.marker([latest.lat, latest.lng], {
        icon: L.divIcon({
          className: '',
          html,
          iconSize: [size, size],
          iconAnchor: [size / 2, size / 2],
        }),
      }).bindPopup(`<strong>${track.team_name}</strong><br><small>${fmtLocal(latest.server_ts)}</small>`).addTo(map);
      for (const ll of latlngs) bounds.extend(ll);
    }
  }

  if (bounds.isValid()) {
    map.fitBounds(bounds, { padding: [24, 24] });
  }
  return map;
}

// renderEventFeed turns the run_events JSON into a readable timeline.
function renderEventFeed(events, teams) {
  if (!events.length) return h('div', { class: 'empty' }, t('No activity yet.'));
  const ul = h('ul', { class: 'feed' });
  for (const e of events) ul.append(renderEvent(e, teams));
  return ul;
}

function renderEvent(e, teams) {
  const p = e.payload || {};
  let badge = 'neutral', symbol = '•', msg, meta;
  const team = h('strong', {}, e.team_name || '');
  switch (e.kind) {
    case 'event.created':
      badge = 'brand'; symbol = '+'; msg = h('span', { class: 'msg' }, t('Event created for '), h('strong', {}, p.adventure_slug || '')); break;
    case 'event.started': badge = 'good'; symbol = '▶'; msg = h('span', { class: 'msg' }, t('Event started')); break;
    case 'event.paused':  badge = 'neutral'; symbol = '‖'; msg = h('span', { class: 'msg' }, t('Event paused')); break;
    case 'event.resumed': badge = 'good'; symbol = '▶'; msg = h('span', { class: 'msg' }, t('Event resumed')); break;
    case 'event.cancelled': badge = 'bad'; symbol = '✕'; msg = h('span', { class: 'msg' }, t('Event cancelled')); break;
    case 'team.created':
      badge = 'brand'; symbol = '+'; msg = h('span', { class: 'msg' }, t('Team '), h('strong', {}, e.team_name || p.name || ''), t(' created'));
      if ((p.members || []).length) meta = t('with {{names}}', { names: (p.members || []).join(', ') }); break;
    case 'team.renamed':
      badge = 'neutral'; symbol = '✎'; msg = h('span', { class: 'msg' }, t('Renamed '), h('strong', {}, p.from || ''), ' → ', h('strong', {}, p.to || '')); break;
    case 'team.deleted':
      badge = 'bad'; symbol = '×'; msg = h('span', { class: 'msg' }, t('Team '), h('strong', {}, p.name || ''), t(' deleted')); break;
    case 'team.member.added':
      badge = 'good'; symbol = '+'; msg = h('span', { class: 'msg' }, t('Added '), h('strong', {}, p.username || ''), t(' to '), h('strong', {}, e.team_name || '')); break;
    case 'team.member.removed':
      badge = 'neutral'; symbol = '−'; msg = h('span', { class: 'msg' }, t('Removed '), h('strong', {}, p.username || ''), t(' from '), h('strong', {}, e.team_name || '')); break;
    case 'answer.wrong':
      badge = 'bad'; symbol = '✗'; msg = h('span', { class: 'msg' }, team, t(' wrong on puzzle {{n}}', { n: (p.page_index ?? 0) + 1 }));
      if (p.submitted) meta = t('submitted “{{answer}}”', { answer: p.submitted }); break;
    case 'answer.right':
      badge = 'good'; symbol = '✓'; msg = h('span', { class: 'msg' }, team, t(' solved puzzle {{n}}', { n: (p.page_index ?? 0) + 1 })); break;
    case 'team.completed':
      badge = 'good'; symbol = '★'; msg = h('span', { class: 'msg' }, team, t(' finished the adventure!')); break;
    case 'team.unlocked':
      badge = 'brand'; symbol = '⇨'; msg = h('span', { class: 'msg' },
        team, t(' skipped past puzzle {{n}}', { n: (p.from_page_index ?? 0) + 1 }));
      if (p.by_arranger) meta = t('by arranger'); break;
    case 'gate.reached':
      badge = 'brand'; symbol = '⛳'; msg = h('span', { class: 'msg' }, team, t(' reached the puzzle location')); break;
    default:
      msg = h('span', { class: 'msg' }, e.kind);
  }
  return h('li', {},
    h('span', { class: 'badge ' + badge }, symbol),
    h('div', {},
      msg,
      e.actor ? h('div', { class: 'meta' }, t('by {{actor}}', { actor: e.actor }) + (meta ? ' · ' + meta : ''))
              : (meta ? h('div', { class: 'meta' }, meta) : null),
    ),
    h('time', { datetime: e.created_at }, formatEventTime(e.created_at)),
  );
}

// fmtLocal turns a server timestamp (SQLite "YYYY-MM-DD HH:MM:SS" UTC, or an
// RFC3339 string) into the viewer's local time. Returns '—' for empty input
// and the raw value when it can't be parsed, so we never show "Invalid Date".
// hour12:false forces a 24h clock regardless of locale; AM/PM is never the
// right answer in an arranger's ops UI (puzzle queues, sched/start times).
function fmtLocal(s, opts) {
  if (!s) return '—';
  const iso = s.includes('T') ? s : s.replace(' ', 'T') + 'Z';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return s;
  return d.toLocaleString(undefined, opts || { dateStyle: 'medium', timeStyle: 'short', hour12: false });
}

function formatEventTime(s) {
  if (!s) return '';
  // SQLite datetime('now') returns "YYYY-MM-DD HH:MM:SS" in UTC. Let users
  // see something friendlier; locale defaults are fine.
  const d = new Date(s.includes('T') ? s : s.replace(' ', 'T') + 'Z');
  if (Number.isNaN(d.getTime())) return s;
  const now = Date.now();
  const diff = (now - d.getTime()) / 1000;
  if (diff < 60) return t('just now');
  if (diff < 3600) return t('{{n}}m ago', { n: Math.round(diff / 60) });
  if (diff < 86400) return t('{{n}}h ago', { n: Math.round(diff / 3600) });
  return d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short', hour12: false });
}

function btn(label, cls, fn) {
  return h('button', { class: 'btn ' + (cls || ''), on: { click: fn } }, label);
}

async function transition(runID, action) {
  const r = await api(`/api/admin/events/${runID}/${action}`, { method: 'POST' });
  if (r.status === 204) {
    // Map each action verb to a localised past-tense confirmation so
    // toastOk doesn't end up as Swedish "Pause" + English "-ed".
    const TRANSITION_OK = {
      start:  t('Started'),
      pause:  t('Paused'),
      resume: t('Resumed'),
    };
    // Falling back to t('Done') keeps the toast in the user's locale
    // even if a future endpoint adds a transition we haven't mapped.
    toastOk(TRANSITION_OK[action] || t('Done'));
    renderRoute();
  } else {
    toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
  }
}

async function confirmStart(event) {
  // Empty-event guard: starting with zero teams is always a mistake
  // (the server returns a generic 4xx that lands as a vague toast),
  // so we catch it here with concrete copy and a path to the team
  // editor instead. event.teams_count is populated on every detail
  // load; treat missing as zero so a stale event payload is also
  // safely caught.
  const teamCount = Number(event?.teams_count ?? event?.teams?.length ?? 0);
  if (teamCount === 0) {
    await modal(t('Add at least one team first'), ({ body, close }) => {
      body.append(
        h('p', {},
          t('This event has no teams yet. A team is the unit that actually plays the adventure — without one, there\'s nothing for the first puzzle to open to.')),
        h('div', { class: 'row end', style: 'margin-top:1rem' },
          h('button', { class: 'btn primary', on: { click: () => close(true) } }, t('OK'))),
      );
    });
    return;
  }
  const ok = await modal(t('Start this event now?'), ({ body, close }) => {
    body.append(
      h('p', {},
        t('Starting the event opens the first puzzle to all teams. '),
        event.scheduled_at
          ? h('span', {},
              t('An auto-start is currently scheduled for '),
              h('strong', {}, fmtLocal(event.scheduled_at)),
              t('. Starting now will replace that.'))
          : t('You can pause it later if needed.')),
      h('div', { class: 'row end', style: 'margin-top:1rem' },
        h('button', { class: 'btn', on: { click: () => close(false) } }, t('Cancel')),
        h('button', { class: 'btn primary', on: { click: () => close(true) } }, t('Start event'))),
    );
  });
  if (!ok) return;
  await transition(event.id, 'start');
}

async function confirmPause(event) {
  // Pause was previously a one-tap action — easy to misclick on a
  // mobile dashboard. The confirmation is light (no password) but
  // the modal makes the player-side effect clear: pause shows a
  // distinct "paused, stand by" card on every team's screen, and
  // freezes hint timers + answer attempts until resume.
  const ok = await modal(t('Pause this event?'), ({ body, close }) => {
    body.append(
      h('p', {},
        t("Every team will see a 'paused — stand by' card on their next state push. Hint countdowns freeze and answer submissions are refused until you resume.")),
      h('div', { class: 'row end', style: 'margin-top:1rem; gap:.5rem' },
        h('button', { class: 'btn', on: { click: () => close(false) } }, t('Cancel')),
        h('button', { class: 'btn primary', on: { click: () => close(true) } }, t('Pause'))));
  });
  if (!ok) return;
  await transition(event.id, 'pause');
}

// sendEventInvitations confirms with the arranger, then POSTs to
// the bulk-send endpoint and reports the per-team result. Confirm
// step intentionally explicit — kicking off N emails is a real-
// world action with quotas and recipient-side noise; the arranger
// should consciously commit. Reports {sent, skipped, failed}
// rather than just "ok" so a partial outcome is visible.
async function sendEventInvitations(event, teamsWithEmailCount) {
  const ok = await modal(t('Send invitations to teams?'), ({ body, close }) => {
    body.append(
      h('p', {},
        teamsWithEmailCount === 1
          ? t('One team will receive an email with their player links + a calendar invite.')
          : t('{{n}} teams will receive an email with their player links + a calendar invite.', { n: teamsWithEmailCount })),
      h('p', { class: 'muted', style: 'font-size:.9rem' },
        t('Each link is single-use: opening it claims that player\'s slot. Teams without a contact email are skipped.')),
      h('div', { class: 'row end' },
        h('button', { class: 'btn', on: { click: () => close(false) } }, t('Cancel')),
        h('button', { class: 'btn primary', on: { click: () => close(true) } }, t('Send invitations'))));
  });
  if (!ok) return;
  const r = await api(`/api/admin/events/${event.id}/invitations/send`, {
    method: 'POST',
    body: JSON.stringify({}),
  });
  if (!r.ok) {
    toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
    return;
  }
  const sent = r.body?.sent || 0;
  const skipped = r.body?.skipped_no_email || 0;
  const failed = r.body?.failed || 0;
  if (failed > 0) {
    toastErr(t('Sent {{sent}}, failed {{failed}}, skipped {{skipped}}',
      { sent, failed, skipped }));
  } else if (skipped > 0) {
    toastOk(t('Sent {{sent}} (skipped {{skipped}} without email)',
      { sent, skipped }));
  } else {
    toastOk(t('Sent {{sent}} invitation(s)', { sent }));
  }
}

// resendTeamInvitation pops a confirm dialog spelling out who
// will receive the email and what's in it (player magic-links +
// the .ics calendar invite), then sends. Existing slot tokens
// are sent verbatim — no re-mint, so an accidental confirm can't
// kick a teammate out mid-game; if a player has lost their
// session entirely they should hit the public lost-magic-link
// recovery flow instead.
async function resendTeamInvitation(team, btn) {
  const slotsCount = (team.members || []).length;
  const ok = await modal(t('Email invitation to {{team}}?', { team: team.name }),
    ({ body, close }) => {
      body.append(
        h('p', {},
          t('We\'ll send one email to '),
          h('strong', {}, team.email || ''),
          t(' containing this team\'s join link(s) and a calendar invite (.ics) participants can drop into their calendar.')),
        h('ul', { class: 'muted', style: 'margin:.25rem 0 .5rem 1.25rem; padding:0; font-size:.85rem' },
          h('li', {}, slotsCount === 1
            ? t('1 player magic-link')
            : t('{{n}} player magic-links', { n: slotsCount })),
          h('li', {}, t('1 calendar invite (.ics)'))),
        h('p', { class: 'muted', style: 'font-size:.8rem' },
          t('Existing links keep working — this re-sends the same tokens, it does not invalidate any active sessions.')),
        h('div', { class: 'row end' },
          h('button', { class: 'btn', on: { click: () => close(false) } }, t('Cancel')),
          h('button', { class: 'btn primary', on: { click: () => close(true) } }, t('Send email'))));
    });
  if (!ok) return;
  if (btn) {
    btn.disabled = true;
    setTimeout(() => { if (btn) btn.disabled = false; }, 4000);
  }
  const r = await api(`/api/admin/teams/${team.id}/invitations/send`, {
    method: 'POST',
    body: JSON.stringify({}),
  });
  if (r.ok) {
    toastOk(t('Invitation re-sent to {{email}}', { email: team.email }));
    return;
  }
  toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
}

async function confirmCancel(event) {
  const pw = await promptPassword(

      ? t('The event will be marked cancelled and never start. Teams already invited keep their links but get a "cancelled" screen if they open the app. Enter your password to confirm.')
      : t('The event ends now. Live pings stop, the leaderboard freezes, and teams get a "cancelled" screen on their next refresh. Enter your password to confirm.'));

async function openEditSchedule(event) {
  // Pre-fill the datetime-local input from the current UTC-stored value.
  // The input wants "YYYY-MM-DDTHH:MM" in local time; use the Date object to
  // convert without a chunky date library.
  let prefill = '';
  if (event.scheduled_at) {
    const iso = event.scheduled_at.includes('T') ? event.scheduled_at : event.scheduled_at.replace(' ', 'T') + 'Z';
    const d = new Date(iso);
    if (!Number.isNaN(d.getTime())) {
      const pad = (n) => String(n).padStart(2, '0');
      prefill = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
  }

  await modal(event.scheduled_at ? t('Change auto-start') : t('Set auto-start'), ({ body, close }) => {
    const when = h('input', { type: 'datetime-local', value: prefill });
    const form = h('form', {},
      h('p', { class: 'muted', style: 'font-size:.85rem; margin-bottom:.5rem' },
        t('The server will start the event automatically at the time below. Leave empty and hit Clear to remove the auto-start.')),
      h('label', { class: 'field' }, h('span', {}, t('Auto-start at')), when),
      h('div', { class: 'row between', style: 'margin-top:.5rem' },
        event.scheduled_at
          ? h('button', { class: 'btn danger', type: 'button', on: { click: async () => {
              close(null);
              await patchSchedule(event.id, '');
            } } }, t('Clear'))
          : h('span', {}),
        h('div', { class: 'row' },
          h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, t('Cancel')),
          h('button', { class: 'btn primary', type: 'submit' }, t('Save')))),
    );
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!when.value) { toastErr(t('Pick a date or use Clear')); return; }
      const d = new Date(when.value);
      if (Number.isNaN(d.getTime())) { toastErr(t('Bad date')); return; }
      close(null);
      await patchSchedule(event.id, d.toISOString());
    });
    body.append(form);
  });
}

async function patchSchedule(runID, iso) {
  const r = await api(`/api/admin/events/${runID}`, {
    method: 'PATCH',
    body: JSON.stringify({ scheduled_at: iso }),
  });
  if (r.status === 204) {
    toastOk(iso ? t('Schedule updated') : t('Auto-start cleared'));
    renderRoute();
  } else {
    toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
  }
}

async function openTeamDetail(runID, team, adventure, event) {
  // Fetch events filtered to this team.
  const evR = await api(`/api/admin/events/${runID}/activity?team_id=${team.id}`);
  const events = evR.body?.events || [];
  const page = adventure?.pages?.[team.page_index];
  const last = adventure?.pages ? adventure.pages.length : null;
  const finished = team.completed_at || (last !== null && team.page_index >= last);

  await modal(t('Team · {{name}}', { name: team.name }), ({ body, close }) => {
    const summary = h('div', { class: 'row between', style: 'margin-bottom:.75rem' },
      h('div', {},
        h('div', { class: 'muted', style: 'font-size:.8rem; text-transform:uppercase; letter-spacing:.05em; font-weight:700' },
          finished
            ? t('Finished')
            : (last
                ? t('Puzzle {{i}} of {{n}}', { i: team.page_index + 1, n: last })
                : t('Puzzle {{i}}', { i: team.page_index + 1 }))),
        page && !finished ? h('div', {}, h('strong', {}, page.title || t('(untitled)'))) : null,
      ),
      h('div', {},
        (team.members || []).map((m) => h('span', { class: 'chip', style: 'margin-right:.25rem' }, m.name)),
      ),
    );

    const actions = h('div', { class: 'row', style: 'margin-bottom:.75rem; flex-wrap:wrap' });
    if (!finished && canDo(event, 'unlock_team')) {
      // Alt-click skips the confirmation modal — faster when the
      // arranger is actively unsticking a team mid-event. Normal
      // click still goes through the confirm so a mis-tap doesn't
      // silently advance a team.
      const skipBtn = h('button', {
        class: 'btn primary',
        title: t('Alt-click to skip the confirmation'),
      }, icon(ICONS.fastForward), t('Skip this puzzle'));
      skipBtn.addEventListener('click', (e) => {
        if (e.altKey) skipPuzzleNow(team, close); else skipPuzzle(team, close);
      });
      actions.append(skipBtn);
    }
    actions.append(h('button', { class: 'btn', on: { click: () => { close(null); openTeamModal(runID, team, event); } } },
      icon(ICONS.pencil), t('Edit members')));
    if (canDo(event, 'delete_team')) {
      actions.append(h('button', { class: 'btn danger', on: { click: async () => { close(null); await confirmDeleteTeam(team); } } },
        icon(ICONS.trash), t('Delete')));
    }

    body.append(
      summary,
      actions,
      h('h3', {}, t('Activity')),
      renderEventFeed(events, [team]),
      h('div', { class: 'row end', style: 'margin-top:1rem' },
        h('button', { class: 'btn', on: { click: () => close(null) } }, t('Close'))),
    );
  }, { wide: true });
}
