        '.')),
    err ? h('p', { class: 'err' }, err) : null,
    h('div', { class: 'row end', style: 'margin-top:1rem' },
      h('button', { class: 'btn primary', type: 'submit' }, t('Create account'))),
    h('p', { class: 'muted', style: 'margin-top:1rem; font-size:.85rem; text-align:center' },
      t('Already registered?'), ' ',
      h('a', { href: '#', on: { click: (e) => { e.preventDefault();
        document.getElementById('root').replaceChildren(renderLogin(null, 'login')); } } }, t('Log in'))),
  );
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const r = await api('/api/auth/signup', {
      method: 'POST',
      body: JSON.stringify({
        email: fd.get('email'),
        org_name: fd.get('org_name'),
        password: fd.get('password'),
        terms_accepted: fd.get('terms_accepted') === 'on',
      }),
    });
    if (r.status === 201) {
      await refreshMe();
      // Make sure the post-signup landing flashes the "check your inbox" toast.
      location.hash = '#dashboard';
      render();
      setTimeout(() => toastOk(t('Account created — check {{email}} for a verification link.', { email: fd.get('email') })), 50);
      return;
    }
    document.getElementById('root').replaceChildren(renderSignup(r.body?.error || t('signup failed')));
  });
  return h('div', { class: 'login-wrap' }, form);
}

function renderShell() {
  const role = state.me.role;
  const isAdmin = role === 'admin';
  const isOrgAdmin = role === 'org_admin';
  // Admin runs the multi-tenant plumbing (organizations, other admins).
  // Org users play the game: adventures, runs, players. Org admins also
  // manage their organization's members.
  let items;
  if (isAdmin) {
    items = [
      ['#dashboard',     t('Dashboard'),     ICONS.dashboard],
      ['#organizations', t('Organizations'), ICONS.shield],
      // "Library" is the single entry point for authored content — a
      // tab strip inside the view splits Adventures and Puzzles. Two
      // sidebar entries for what's essentially one catalog was noise.
      ['#library',       t('Library'),       ICONS.map],
      ['#admins',        t('Admins'),        ICONS.user],
      ...(state.me.features?.simulator_enabled
        ? [['#simulator', t('Simulator'), ICONS.play]]
        : []),
      ['#audit',         t('Audit'),         ICONS.shield],
      ['#logs',          t('Logs'),          ICONS.terminal],
      ['#settings',      t('Settings'),      ICONS.gear],
    ];
  } else {
    // Sidebar lists the daily-operational surfaces only. Adventures
    // (incl. its Catalog tab — was "Store"), Events, and per-role
    // surfaces. Configuration, integrations and the manual live one
    // click in via Settings so the daily nav stays calm.
    items = [
      ['#dashboard',  t('Dashboard'),  ICONS.dashboard],
      ['#adventures', t('Adventures'), ICONS.map],
      ['#events',     t('Events'),     ICONS.play],
    ];
    if (isOrgAdmin) {
      items.push(['#members', t('Members'), ICONS.users]);
      items.push(['#audit',   t('Audit'),   ICONS.shield]);
    }
    items.push(['#settings', t('Settings'), ICONS.gear]);
  }
  const active = state.route.split('/')[0];

  const nav = h('nav', { class: 'nav', 'aria-label': t('Primary') },
    items.map(([href, label, svg]) =>
    h('a', {
      href,
      class: active === href ? 'active' : '',
      'aria-current': active === href ? 'page' : null,
      on: { click: () => { document.querySelector('.sidebar')?.classList.remove('open'); document.querySelector('.backdrop')?.classList.remove('show'); } },
    }, icon(svg), label)));
  // Arrow-key navigation across the sidebar. We deliberately don't
  // adopt role="tab" / role="tablist" — these are real anchor links
  // (each one is a routable URL), and forcing tab semantics would
  // misrepresent them to screen readers. Just add focus movement so
  // keyboard-only users don't have to Tab through every entry.
  nav.addEventListener('keydown', (ev) => {
    if (ev.key !== 'ArrowDown' && ev.key !== 'ArrowUp') return;
    const links = Array.from(nav.querySelectorAll('a'));
    if (links.length === 0) return;
    const idx = links.indexOf(document.activeElement);
    const next = ev.key === 'ArrowDown'
      ? (idx < 0 ? 0 : Math.min(idx + 1, links.length - 1))
      : (idx <= 0 ? 0 : idx - 1);
    links[next].focus();
    ev.preventDefault();
  });

  const isDark = currentTheme() === 'dark';
  const themeBtn = h('button', {
    class: 'btn',
    title: isDark ? t('Use light theme') : t('Use dark theme'),
    on: { click: toggleTheme },
  }, icon(isDark ? ICONS.sun : ICONS.moon), isDark ? t('Use light theme') : t('Use dark theme'));
  const logoutBtn = h('button', {
    class: 'btn',
    title: t('Log out'),
    on: { click: logout },
  }, icon(ICONS.user), t('Log out ({{username}})', { username: state.me.username }));
  const langPicker = h('label', { class: 'sidebar-lang', title: t('Language') },
    h('span', { class: 'muted' }, t('Language')),
    zvI18n.makeLangPicker({ className: 'zv-lang-picker' }));

  const sidebar = h('aside', {
    class: 'sidebar', id: 'sidebar-nav',
    'aria-label': t('Sidebar'),
  },
    h('div', { class: 'brand' }, 'zonventure',
      h('small', {}, isAdmin ? t('administrator') : t('arranger'))),
    nav,
    h('div', { class: 'sidebar-footer' }, themeBtn, logoutBtn, langPicker, renderLegalFooter()));

  const backdrop = h('div', { class: 'backdrop', on: { click: () => {
    document.querySelector('.sidebar').classList.remove('open');
    backdrop.classList.remove('show');
  } } });

  const menuBtn = h('button', {
    class: 'btn ghost menu-btn',
    type: 'button',
    'aria-label': t('Open navigation menu'),
    'aria-controls': 'sidebar-nav',
    'aria-expanded': 'false',
    on: { click: () => {
      const sb = document.querySelector('.sidebar');
      const open = sb.classList.toggle('open');
      backdrop.classList.toggle('show', open);
      menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    } },
  }, icon(ICONS.menu));

  const topbar = h('header', { class: 'topbar', role: 'banner' },
    menuBtn,
    h('span', { class: 'brand' }, 'zonventure'),
    h('div', { class: 'crumb', 'aria-live': 'polite' }, currentCrumb()),
    h('div', { class: 'spacer' }),
  );

  // Unverified-email banner: shown for users with an email_verified
  // flag of false. Money-touching actions (CreateRun, CreatePurchase)
  // 403 with a verification_required code, so this banner gives them
  // the recovery action up front before they hit the wall.
  const verifyBanner = (state.me && state.me.email && state.me.email_verified === false)
    ? renderVerifyBanner(state.me.email)
    : null;

  // Skip-link is the first focusable element on the page so a
  // keyboard user lands on it before crawling through the sidebar +
  // topbar. Hidden until focused; jumps focus to <main> on click.
  const skip = h('a', { class: 'skip-link', href: '#main' }, t('Skip to main content'));
  return h('div', { class: 'app' },
    skip, sidebar, topbar,
    h('main', { class: 'content', id: 'main', tabindex: '-1' }, verifyBanner,
      h('div', { id: 'view' })),
    backdrop);
}

function renderVerifyBanner(email) {
  const banner = h('div', { class: 'verify-banner' },
    h('div', {},
      h('strong', {}, t('Verify your email')),
      ' — ',
      h('span', { class: 'muted' },
        t('We sent a link to {{email}}. Until you click it, events and purchases are disabled.', { email }))),
    h('button', {
      class: 'btn small',
      on: { click: async (e) => {
        e.target.disabled = true;
        const r = await api('/api/auth/resend-verification', { method: 'POST' });
        e.target.disabled = false;
        if (r.status === 200) toastOk(t('Verification email re-sent.'));
        else toastErr(r.body?.error || t('Could not resend; try again later.'));
      } },
    }, t('Resend email')),
  );
  return banner;
}

function currentCrumb() {
  const parts = state.route.replace(/^#/, '').split('/');
  const section = parts[0] || 'dashboard';
  // Map section slugs to their translated nav label so the top breadcrumb
  // tracks the sidebar. Falls through to a capitalised raw slug for
  // anything we don't recognise.
  const LABELS = {
    dashboard:     t('Dashboard'),
    adventures:    t('Adventures'),
    store:         t('Store'),
    events:         t('Events'),
    members:       t('Members'),
    organizations: t('Organizations'),
    library:       t('Library'),
    puzzles:       t('Puzzles'),
    admins:        t('Admins'),
    simulator:     t('Simulator'),
    logs:          t('Logs'),
    audit:         t('Audit'),
    webhooks:      t('Webhooks'),
    manual:        t('Manual'),
    settings:      t('Settings'),
  };
  const sectionLabel = LABELS[section] || (section ? section[0].toUpperCase() + section.slice(1) : '');
  if (section === 'events' && parts[1]) return t('{{section}} / Event #{{id}}', { section: sectionLabel, id: parts[1] });
  if (section === 'adventures' && parts[1]) return t('{{section}} / {{slug}}', { section: sectionLabel, slug: parts[1] });
  if (section === 'store' && parts[1]) return t('{{section}} / {{slug}}', { section: sectionLabel, slug: parts[1] });
  return sectionLabel;
}

async function renderRoute() {
  const view = document.getElementById('view');
  view.replaceChildren(h('p', { class: 'muted' }, t('Loading…')));
  const r = state.route.replace(/^#/, '');
  const [section, arg] = r.split('/');
  const role = state.me.role;
  const isAdmin = role === 'admin';
  const isOrgAdmin = role === 'org_admin';

  // Role-based route guards: admins can't visit org-user pages and vice versa.
  const adminOnly = ['organizations', 'admins', 'logs', 'simulator'];
  const orgUserOnly = ['adventures', 'events', 'store', 'webhooks'];
  if (isAdmin && orgUserOnly.includes(section)) { nav('#organizations'); return; }
  if (!isAdmin && adminOnly.includes(section))   { nav('#dashboard');     return; }
  if (section === 'members' && !isOrgAdmin)      { nav('#dashboard');     return; }
  // Audit is open to admin + org_admin only — org_member never sees the
  // sidebar entry, but a hand-typed URL would otherwise reach the view
  // shell before the API rejected it.
  if (section === 'audit' && !isAdmin && !isOrgAdmin) { nav('#dashboard'); return; }

  // Event-detail is the only view with real-time updates. Entering it opens a
  // watch on the arrange WebSocket; leaving it releases that watch so the
  // server stops publishing to this client.
  if (section === 'events' && arg) {
    watchRun(parseInt(arg, 10));
  } else {
    unwatchRun();
  }
  // Stop the webhook-log auto-refresh whenever we leave the log
  // view. viewWebhooksLog itself starts a fresh poll on entry.
  if (!(section === 'webhooks' && arg === 'log')) {
    stopWebhookLogPoll();
  }

  try {
    switch (section) {
      case '':
      case 'dashboard':    return await viewDashboard(view);
      case 'adventures':   return arg ? await viewAdventureDetail(view, arg) : await viewAdventures(view);
      case 'store':        return arg ? await viewStoreDetail(view, arg) : await viewStore(view);
      case 'events':         return arg ? await viewRunDetail(view, arg) : await viewRuns(view);
      case 'members':      return await viewMembers(view);
      case 'organizations':return await viewOrganizations(view);
      case 'library':      return arg ? await viewLibraryEdit(view, arg) : await viewLibrary(view);
      case 'puzzles':      return arg ? await viewPuzzleEditRoute(view, arg) : await viewPuzzles(view);
      case 'purchases':    return await viewPurchases(view);
      case 'admins':       return await viewAdmins(view);
      case 'simulator':    return await viewSimulator(view);
      case 'logs':         return await viewLogs(view);
      case 'audit':        return await viewAudit(view);
      case 'webhooks': {
        // Sub-route #webhooks/log/<endpointID> always carries the
        // endpoint id — the log only ever shows one endpoint's
        // deliveries (the dropdown was removed, log is reached from
        // the card it belongs to).
        if (arg === 'log') {
          const parts = r.split('/');
          const endpointID = parts[2] ? parseInt(parts[2], 10) : 0;
          if (!endpointID) { nav('#webhooks'); return; }
          return await viewWebhooksLog(view, endpointID);
        }
        return await viewWebhooks(view);
      }
      case 'manual':       return viewManual(view, arg);
      case 'settings':     return await viewSettings(view);
      default: view.replaceChildren(h('p', {}, t('Not found')));
    }
  } catch (err) {
    view.replaceChildren(h('p', { class: 'err' }, String(err)));
  }
}

/* ========== Arrange subscription stream ========== */
// arrangeWS is a single long-lived connection that pushes event-detail
// updates while an arranger has an event open. Mutations still ride HTTP;
// this socket only receives change notifications so the view stays in
// sync with player progress, team creates, etc., without polling.
let arrangeWS = null;
let arrangeWSBackoff = 500;
let watchedEventID = 0;
let arrangePushTimer = null;

// Arrange-side connection banner. Only shown while watchedEventID !=
// 0 — outside event detail the WS is idle and a banner would just be
// noise. Two tiers (warn/err) match play.html / live.html so the
// behaviour reads the same across surfaces.
let arrangeStatusEl = null;
let arrangeStatusTimer = null;
function setArrangeStatus(level, text) {
  if (!arrangeStatusEl) {
    arrangeStatusEl = document.createElement('div');
    arrangeStatusEl.className = 'ws-status';
    arrangeStatusEl.setAttribute('role', 'status');
    arrangeStatusEl.setAttribute('aria-live', 'polite');
    document.body.append(arrangeStatusEl);
  }
  arrangeStatusEl.classList.remove('warn', 'err', 'show');
  if (!level) return;
  arrangeStatusEl.classList.add(level, 'show');
  arrangeStatusEl.textContent = text;
}

function ensureArrangeWS() {
  if (arrangeWS && (arrangeWS.readyState === 0 || arrangeWS.readyState === 1)) return;
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  arrangeWS = new WebSocket(`${proto}//${location.host}/ws/arrange`);
  arrangeWS.onopen = () => {
    arrangeWSBackoff = 500;
    if (arrangeStatusTimer) { clearTimeout(arrangeStatusTimer); arrangeStatusTimer = null; }
    setArrangeStatus('', '');
    if (watchedEventID) arrangeWS.send(JSON.stringify({ kind: 'watch_run', data: { event_id: watchedEventID } }));
  };
  arrangeWS.onmessage = (ev) => {
    let msg; try { msg = JSON.parse(ev.data); } catch { return; }
    if (!msg || !msg.kind) return;
    // Any server push re-renders the current event-detail view. Debounced so
    // a burst of changes (eg. multiple position updates from players
    // pinging at once) collapses into a single re-render.
    if (msg.kind === 'positions' || msg.kind === 'tracks' ||
        msg.kind === 'activity'   || msg.kind === 'event_detail') {
      if (arrangePushTimer) clearTimeout(arrangePushTimer);
      arrangePushTimer = setTimeout(() => {
        const r = state.route.replace(/^#/, '');
        const [section, arg] = r.split('/');
        if (section === 'events' && arg) {
          const view = document.getElementById('view');
          if (view) viewRunDetail(view, parseInt(arg, 10));
        }
      }, 300);
    }
  };
  arrangeWS.onclose = () => {
    const delay = Math.min(arrangeWSBackoff, 10000);
    arrangeWSBackoff = Math.min(arrangeWSBackoff * 2, 10000);
    setTimeout(ensureArrangeWS, delay);
    // Suppress the banner when the user isn't on an event-detail view —
    // the WS has nothing useful to say there and the banner would
    // distract during catalog / settings work.
    if (arrangeStatusTimer) clearTimeout(arrangeStatusTimer);
    if (!watchedEventID) { setArrangeStatus('', ''); return; }
    arrangeStatusTimer = setTimeout(() => {
      if (!watchedEventID) return;
      setArrangeStatus('warn', t('Reconnecting — live updates paused.'));
      arrangeStatusTimer = setTimeout(() => {
        if (!watchedEventID) return;
        setArrangeStatus('err', t('Disconnected — event data may be stale.'));
      }, 13000);
    }, 2000);
  };
}

function watchRun(runID) {
  if (!runID || runID === watchedEventID) { watchedEventID = runID; ensureArrangeWS(); return; }
  watchedEventID = runID;
  ensureArrangeWS();
  if (arrangeWS && arrangeWS.readyState === 1) {
    arrangeWS.send(JSON.stringify({ kind: 'watch_run', data: { event_id: runID } }));
  }
}

function unwatchRun() {
  if (!watchedEventID) return;
  watchedEventID = 0;
  if (arrangeStatusTimer) { clearTimeout(arrangeStatusTimer); arrangeStatusTimer = null; }
  setArrangeStatus('', '');
  if (arrangeWS && arrangeWS.readyState === 1) {
    arrangeWS.send(JSON.stringify({ kind: 'unwatch_run' }));
  }
}

async function logout() {
  await api('/api/auth/logout', { method: 'POST' });
  state.me = null;
  render();
}

/* ========== Dashboard ========== */
async function viewDashboard(view) {
  if (state.me.role === 'admin') return viewAdminDashboard(view);
  return viewArrangerDashboard(view);
}

async function viewArrangerDashboard(view) {
  const [eventsR, advR, assignR] = await Promise.all([
    api('/api/admin/events'),
    api('/api/admin/adventures'),
    api('/api/admin/assignments'),
  ]);
  const newEventBtn = h('button', { class: 'btn primary', on: { click: () => openNewEventWizard() } },
    icon(ICONS.plus), t('Start a new event'));
  const rs = eventsR.body?.events || [];
  const advs = advR.body?.adventures || [];
  const assignments = assignR.body?.assignments || [];
  const mineAdvs    = advs.filter((a) => a.mine_to_edit);
  const unusedAssigns = assignments.filter((a) => !a.event_id);
  const runningNow  = rs.filter((r) => r.state === 'running');
  const scheduled   = rs.filter((r) => r.state === 'scheduled')
    .sort((a, b) => (a.scheduled_at || '').localeCompare(b.scheduled_at || ''));

  // Setup checklist for first-time arrangers. Hides itself once an event
  // exists so veterans don't see it.
  const setup = rs.length === 0
    ? buildDashboardSetup({ mineAdvs, unusedAssigns })
    : null;

  // DOM's replaceChildren coerces null arguments to the string "null"
  // and appends them as text nodes — unlike h(), which skips them. The
  // sections below are conditionally null (no runs, no scheduled, etc.),
  // so filter before handing off.
  const sections = [
    h('div', { class: 'row between' },
      h('h1', {}, t('Hello, {{username}}', { username: state.me.username })),
      newEventBtn,
    ),
    h('div', { class: 'grid stats' },
      stat(t('Live now'), runningNow.length),
      stat(t('Scheduled'), scheduled.length),
      stat(t('Unused assignments'), unusedAssigns.length),
    ),
    setup,
    // During a live event this is what the arranger wants to see first.
    runningNow.length === 0 ? null : h('div', { class: 'card' },
      h('h2', {}, t('Live now')),
      h('div', { class: 'grid cols-2' },
        runningNow.map((r) => h('div', {
          class: 'card clickable',
          on: { click: () => nav('#events/' + r.id) },
        },
          h('div', { class: 'row between' },
            h('strong', {}, runLabel(r)),
            h('span', { class: 'pill ' + pillClassForState(r.state) }, t(r.state || ''))),
          h('p', { class: 'muted', style: 'font-size:.8rem; margin:.1rem 0 .3rem' },
            r.adventure_title || r.adventure_slug),
          h('p', { class: 'muted', style: 'font-size:.85rem; margin:0' },
            r.started_at ? t('Started {{when}}', { when: fmtLocal(r.started_at) }) : ''))))),
    // "Starts soon" is actionable — one-click Start on scheduled events.
    scheduled.length === 0 ? null : h('div', { class: 'card' },
      h('h2', {}, t('Starts soon')),
      h('table', { class: 'table' },
        h('thead', {}, h('tr', {},
          h('th', {}, t('Event')),
          h('th', {}, t('Scheduled')),
          h('th', {}, ''))),
        h('tbody', {}, scheduled.slice(0, 10).map((r) => h('tr', {
            style: 'cursor:pointer',
            on: { click: () => nav('#events/' + r.id) },
          },
          h('td', {}, runLabel(r)),
          h('td', {}, fmtLocal(r.scheduled_at) || h('span', { class: 'muted' }, t('(no time set)'))),
          h('td', { style: 'text-align:right' },
            iconBtn('play', t('Start now'), () => confirmStart(r), { primary: true })),
        ))))),
    // Fallback for users between events.
    (runningNow.length === 0 && scheduled.length === 0 && rs.length > 0)
      ? h('div', { class: 'card' },
          h('h2', {}, t('Recent events')),
          runsTable(rs.slice(0, 5)))
      : null,
  ];
  view.replaceChildren(...sections.filter(Boolean));
}

// buildDashboardSetup drops a guided checklist for brand-new arrangers
// who haven't run any events yet — it meets them where they are and
// links to the next action.
function buildDashboardSetup({ mineAdvs, unusedAssigns }) {
  const stepDone = (done, label, cta, onClick) =>
    h('li', { style: 'display:flex; align-items:center; gap:.6rem; margin:.35rem 0' },
      h('span', {
        style: 'display:inline-grid; place-items:center; width:1.4rem; height:1.4rem; border-radius:50%; background:' +
          (done ? 'var(--accent)' : 'var(--surface-2)') + '; color:' + (done ? 'var(--accent-fg)' : 'var(--muted)') + '; font-weight:700; font-size:.85rem',
      }, done ? '✓' : '·'),
      h('span', { style: done ? 'color:var(--muted); text-decoration:line-through' : '' }, label),
      !done && cta
        ? h('button', { class: 'btn small primary', style: 'margin-left:auto', on: { click: onClick } }, cta)
        : null,
    );
  const haveAdvOrAssignment = mineAdvs.length > 0 || unusedAssigns.length > 0;
  return h('div', { class: 'card', style: 'border:1px dashed var(--accent); background:color-mix(in srgb, var(--accent) 5%, var(--surface))' },
    h('h2', {}, t('Getting started')),
    h('p', { class: 'muted' }, t('A few clicks to your first adventure.')),
    h('ol', { style: 'list-style:none; padding:0; margin:0' },
      stepDone(haveAdvOrAssignment,
        t('Pick an adventure — browse the Store or create your own'),
        t('Go'), () => nav('#store')),
      stepDone(unusedAssigns.length > 0,
        t('Have team slots ready — an assignment lets you schedule an event'),
        t('Go'), () => nav('#store')),
      stepDone(false,
        t('Schedule an event, add teams, share their links — and start!'),
        unusedAssigns.length > 0 ? t('Schedule') : null,
        unusedAssigns.length > 0 ? (() => scheduleRun(unusedAssigns[0].id)) : null),
    ),
  );
}

        h('h2', {}, t('Organizations')),

        : h('table', { class: 'table' },
          h('thead', {}, h('tr', {},
            h('th', {}, t('Organization')),
            h('th', { class: 'hide-narrow' }, t('Users')),
            h('th', { class: 'hide-narrow' }, t('Players')),

/* ========== Adventures ==========
   For arrangers this is really "your assignments" — each unused assignment
   is a one-shot licence to use an adventure for an event with a fixed team cap. Used
   assignments are also shown (with a link to their run) so the arranger can
   see the full history at a glance. */
async function viewAdventures(view) {
  // Post-checkout handoff: if sessionStorage carries a fresh
  // assignment id, open the scheduler for it right away. Cleared on
  // consume so refreshes don't reopen the dialog.
  const justPurchased = sessionStorage.getItem('zv-just-purchased');
  if (justPurchased) {
    sessionStorage.removeItem('zv-just-purchased');
    const id = parseInt(justPurchased, 10);
    if (id > 0) { toastOk(t('Payment received — let\'s schedule your event.')); scheduleRun(id); }
  }

  const [ar, advR] = await Promise.all([
    api('/api/admin/assignments'),
    api('/api/admin/adventures'),
  ]);
  const assignments = ar.body?.assignments || [];
  const advs = advR.body?.adventures || [];

  // Bucket assignments per adventure. unused = ready to schedule,
  // used = already materialised into an event (kept for context badges).
  const byAdv = new Map();
  for (const a of assignments) {
    if (!a.adventure_slug) continue;
    const b = byAdv.get(a.adventure_slug) || { unused: [], used: [] };
    (a.event_id ? b.used : b.unused).push(a);
    byAdv.set(a.adventure_slug, b);
  }

  // An adventure shows up on this page only if there's something the
  // arranger actually does with it — they author it, they hold at
  // least one assignment, or an admin has commissioned it for this
  // org via a share. Everything else lives in the Store.
  const runnable = advs
    .filter((a) => a.mine_to_edit || a.shared || byAdv.has(a.slug))
    .sort((a, b) => {
      // Mine first, then with unused assignments, then shared, then remainder.
      const score = (adv) => {
        const bk = byAdv.get(adv.slug) || { unused: [], used: [] };
        return (adv.mine_to_edit ? 8 : 0)
          + (bk.unused.length ? 4 : 0)
          + (adv.shared ? 2 : 0)
          + (bk.used.length ? 1 : 0);
      };
      return score(b) - score(a);
    });

  const renderCard = (adv) => {
    const bucket = byAdv.get(adv.slug) || { unused: [], used: [] };
    const actions = h('div', { class: 'row', style: 'gap:.5rem; flex-wrap:wrap; margin-top:.75rem' });
    if (adv.mine_to_edit) {
      actions.append(h('button', {
        class: 'btn',
        on: { click: () => nav('#library/' + adv.slug) },
      }, icon(ICONS.pencil), t('Edit')));
    }
    if (bucket.unused.length > 0) {
      actions.append(h('button', {
        class: 'btn primary',
        on: { click: () => pickAndScheduleRun(bucket.unused, adv) },
      }, icon(ICONS.play), t('Schedule event')));
    } else if (adv.shared || (adv.mine_to_edit && adv.org_id)) {
      // Commissioned by admin or authored in-house — either way the
      // org can schedule events freely, no assignment needed.
      actions.append(h('button', {
        class: 'btn primary',
        on: { click: () => scheduleRun({ slug: adv.slug }) },
      }, icon(ICONS.play), t('Schedule event')));
    } else if (adv.mine_to_edit) {
      // Own adventure with no unused assignments — offer the buy
      // path inline so "make this runnable" is one step away.
      actions.append(h('button', {
        class: 'btn',
        on: { click: () => openPurchaseModal(adv) },
      }, icon(ICONS.coins), t('Buy team slots')));
    }

    const tags = [
      h('span', { class: 'pill' }, adv.page_count === 1
        ? t('{{n}} puzzle', { n: adv.page_count })
        : t('{{n}} puzzles', { n: adv.page_count })),
      adv.mine_to_edit ? h('span', { class: 'pill accent' }, t('Yours')) : null,
      adv.mine_to_edit
        ? (adv.published
            ? h('span', { class: 'pill success' }, t('Published'))
            : h('span', { class: 'pill warning' }, t('Draft')))
        : null,
      !adv.mine_to_edit && adv.shared ? h('span', { class: 'pill accent' }, t('Shared')) : null,
      bucket.unused.length > 0
        ? h('span', { class: 'pill accent' }, bucket.unused.length === 1
            ? t('{{n}} assignment available', { n: bucket.unused.length })
            : t('{{n}} assignments available', { n: bucket.unused.length }))
        : bucket.used.length > 0
          ? h('span', { class: 'pill' }, bucket.used.length === 1
              ? t('{{n}} event held', { n: bucket.used.length })
              : t('{{n}} events held', { n: bucket.used.length }))
          : null,
    ].filter(Boolean);

    return h('div', { class: 'card' },
      h('div', { class: 'row between', style: 'align-items:flex-start; gap:.75rem' },
        h('div', { class: 'row', style: 'gap:.75rem; align-items:center; min-width:0' },
          adventureCover(adv, 56),
          h('h2', { style: 'margin:0' }, adv.title)),
        h('div', { class: 'row', style: 'gap:.35rem; flex-wrap:wrap' }, ...tags)),
      adv.description ? h('p', { class: 'muted', style: 'margin-top:.35rem' }, adv.description) : null,
      h('p', { class: 'muted mono', style: 'font-size:.8rem; margin:0' },
        adv.slug + (adv.author ? ' · ' + adv.author : '')),
      actions,
    );
  };

  view.replaceChildren(
    h('div', { class: 'row between' },
      h('h1', {}, t('Adventures')),
      h('button', { class: 'btn primary', on: { click: () => openCreateAdventure() } },
        icon(ICONS.plus), t('New adventure'))),
    renderAdventureTabs('yours'),
    runnable.length === 0
      ? h('div', { class: 'empty' },
          h('p', {}, t('No adventures you can use yet.')),
          h('p', { class: 'muted' }, t('Create your own or browse the Catalog for published adventures.')),
          h('div', { class: 'row', style: 'gap:.5rem; justify-content:center; margin-top:.5rem' },
            h('button', { class: 'btn primary', on: { click: () => openCreateAdventure() } },
              icon(ICONS.plus), t('New adventure')),
            h('button', { class: 'btn', on: { click: () => nav('#store') } },
              icon(ICONS.coins), t('Browse the Catalog'))))
      : h('div', { class: 'grid cols-2' }, runnable.map(renderCard)),
  );
}

// pickAndScheduleRun forwards straight to scheduleRun when there's a
// single assignment; when the arranger holds several for the same
// adventure it pops a tiny chooser so they know which one is spent.
async function pickAndScheduleRun(unusedAssignments, adv) {
  if (unusedAssignments.length === 1) {
    return scheduleRun(unusedAssignments[0].id);
  }
  const pick = await modal(t('Pick an assignment'), ({ body, close }) => {
    body.append(h('p', { class: 'muted' },
      t('You hold several assignments for {{title}}. Which one do you want to schedule?', { title: adv.title })));
    const list = h('div', { class: 'grid', style: 'gap:.4rem' });
    for (const a of unusedAssignments) {
      list.append(h('button', {
        class: 'btn',
        style: 'justify-content:flex-start; text-align:left',
        on: { click: () => close(a.id) },
      }, t('up to {{n}} teams · purchased {{when}}',
        { n: a.max_teams, when: fmtLocal(a.created_at) })));
    }
    body.append(list);
    body.append(h('div', { class: 'row end', style: 'margin-top:1rem' },
      h('button', { class: 'btn', on: { click: () => close(null) } }, t('Cancel'))));
  });
  if (pick) scheduleRun(pick);
}

// renderPurchaseActions returns per-row links/buttons:
//   - "Receipt" — Stripe-hosted invoice URL when present (paid only).
//   - "Refund"  — admin-only, paid Stripe purchases. Hidden for org
//                 users; they contact us out-of-band.
function renderPurchaseActions(p) {
  const out = [];
  if (p.invoice_url) {
    out.push(h('a', {
      href: p.invoice_url, target: '_blank', rel: 'noopener',
      class: 'btn small ghost',
    }, t('Receipt')));
  }
  if (state.me?.role === 'admin' && p.state === 'paid' && p.provider === 'stripe') {
    const btn = h('button', { class: 'btn small danger', type: 'button' }, t('Refund'));
    btn.addEventListener('click', async () => {
      if (!confirm(t('Refund {{amount}} to the customer? The state flips to "refunded" once Stripe confirms.', {
        amount: new Intl.NumberFormat(undefined, { style: 'currency', currency: p.currency || 'EUR' }).format(p.amount_cents / 100),
      }))) return;
      btn.disabled = true;
      const r = await api('/api/admin/purchases/' + p.id + '/refund', { method: 'POST' });
      if (r.status !== 202) {
        btn.disabled = false;
        toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
        return;
      }
      toastOk(t('Refund initiated. Confirming with Stripe…'));
      // The /refund endpoint fires the Stripe API call and returns
      // immediately; the actual state flip happens when the
      // charge.refunded webhook lands. Poll the purchase row every 2s
      // for up to 30s so we can give the operator a clean confirmation
      // (or a "still pending" warning) without forcing a full page
      // reload.
      const deadline = Date.now() + 30_000;
      const poll = async () => {
        if (Date.now() > deadline) {
          toastErr(t('Refund still processing — check Stripe and refresh in a minute.'));
          renderRoute();
          return;
        }
        const r2 = await api('/api/admin/purchases/' + p.id);
        if (r2.status === 200 && r2.body?.state === 'refunded') {
          toastOk(t('Refund confirmed.'));
          renderRoute();
          return;
        }
        setTimeout(poll, 2000);
      };
      setTimeout(poll, 2000);
    });
    out.push(btn);
  }
  return out;
}

// openPurchaseModal drives the buy-team-slots flow. The user picks a
// slot count, sees the total, and confirms. The server creates a
// pending purchase and returns a checkout_url — we redirect to it
// (simulated page now, Stripe Checkout later). On success the checkout
// page navigates the user back to #purchases so they see the fresh
// assignment.
async function openPurchaseModal(adv) {
  // Pricing rides on the /whoami response, so the bootstrap fetch
  // already has the canonical numbers. Falling back to defaults keeps
  // dev clones with old whoami payloads working.
  const PRICE_CENTS = (state.me?.pricing?.slot_cents) || 200;
  const CURRENCY    = (state.me?.pricing?.currency)   || 'EUR';
  const fmtMoney = (cents) => new Intl.NumberFormat(undefined,
    { style: 'currency', currency: CURRENCY }).format(cents / 100);
  await modal(t('Buy team slots'), ({ body, close }) => {
    const slots = h('input', { type: 'number', min: '1', max: '100', value: '10', required: true });
    const totalEl = h('strong', {}, '');
    const update = () => {
      const n = Math.max(1, parseInt(slots.value, 10) || 0);
      totalEl.textContent = fmtMoney(n * PRICE_CENTS);
    };
    slots.addEventListener('input', update);
    update();
    const form = h('form', {},
      h('p', {},
        t('Each team slot lets one team play "{{title}}".', { title: adv.title || adv.slug })),
      h('label', { class: 'field' },
        h('span', {}, t('Team slots')), slots),
      h('p', { class: 'muted' },
        t('Total: '), totalEl,
        ' ',
        h('span', { class: 'muted', style: 'font-size:.85rem' },
          t('({{price}} per slot)', { price: fmtMoney(PRICE_CENTS) }))),
      h('div', { class: 'row end' },
        h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, t('Cancel')),
        h('button', { class: 'btn primary', type: 'submit' }, t('Proceed to payment'))));
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const n = Math.max(1, parseInt(slots.value, 10) || 1);
      const r = await api('/api/admin/purchases', {
        method: 'POST',
        body: JSON.stringify({ adventure_slug: adv.slug, max_teams: n }),
      });
      if (r.status !== 201) {
        toastErr(r.body?.error || `error ${r.status}`);
        return;
      }
      close(true);
      location.href = r.body.checkout_url;
    });
    body.append(form);
  });
}

async function scheduleRun(source) {
  // `source` is either a number (assignment id — the Store purchase flow)
  // or an object with `{ slug }` — an admin-commissioned share or the
  // org's own-authored adventure, both of which skip the assignment and
  // run free.
  const baseReq = typeof source === 'number'
    ? { assignment_id: source }
    : { adventure_slug: source.slug };
  const body = await modal(t('New event'), ({ body, close }) => {
    const name = h('input', { placeholder: t('e.g. “Saturday Andersson party”') });
    // A newly created run stays scheduled until the arranger explicitly
    // hits Start on the event page — auto-starting on create robbed the
    // arranger of the chance to add teams and share links first.
    const modeManual = h('input', { type: 'radio', name: 'mode', value: 'manual', checked: true });
    const modeLater = h('input', { type: 'radio', name: 'mode', value: 'later' });
    const when = h('input', { type: 'datetime-local', disabled: '' });
    const refresh = () => { when.disabled = !modeLater.checked; };
    modeManual.addEventListener('change', refresh);
    modeLater.addEventListener('change', refresh);

    const attest = h('input', { type: 'checkbox', required: true });
    const form = h('form', {},
      h('label', { class: 'field' }, h('span', {}, t('Name (optional)')), name),
      h('label', { style: 'display:flex; gap:.5rem; align-items:center; margin:.5rem 0' },
        modeManual, h('span', {}, t('Start manually — I\'ll hit Start when we\'re ready'))),
      h('label', { style: 'display:flex; gap:.5rem; align-items:center; margin:.5rem 0' },
        modeLater, h('span', {}, t('Schedule for later'))),
      h('label', { class: 'field' }, h('span', {}, t('Auto-start at')), when),
      h('label', { style: 'display:flex; gap:.5rem; align-items:flex-start; margin:1rem 0 .5rem; font-size:.9rem' },
        attest,
        h('span', {}, t('I confirm no participants under 13 will play this adventure, or I have parental consent for any who will.'))),
      h('div', { class: 'row end' },
        h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, t('Cancel')),
        h('button', { class: 'btn primary', type: 'submit' }, t('Create event'))),
    );
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!attest.checked) { toastErr(t('Please confirm the player-age statement first.')); return; }
      const req = { ...baseReq, name: name.value.trim(), attest_no_minors: true };
      if (modeLater.checked) {
        if (!when.value) { toastErr(t('Pick an auto-start time')); return; }
        const d = new Date(when.value);
        if (Number.isNaN(d.getTime())) { toastErr(t('Bad date')); return; }
        req.scheduled_at = d.toISOString();
      }
      close({ req });
    });
    body.append(form);
  });
  if (!body) return;
  const r = await api('/api/admin/events', { method: 'POST', body: JSON.stringify(body.req) });
  if (r.status !== 201) { toastErr(r.body?.error || t('error {{status}}', { status: r.status })); return; }
  const runID = r.body.id;
  toastOk(t('Event ready'));
  nav('#events/' + runID);
}

// openNewEventWizard walks the arranger through every decision needed
// to get from "I want to host" to "here's the event with teams ready".
// Events inline (no checkout-page jump) by calling the purchase +
// confirm endpoints directly from the submit handler. The simulated
// checkout page still exists for the standalone "Buy team slots"
// flow on the Adventures catalog, but the wizard bypasses it.
async function openNewEventWizard() {
  const [advR, assignR] = await Promise.all([
    api('/api/admin/adventures'),
    api('/api/admin/assignments'),
  ]);
  const advs = advR.body?.adventures || [];
  if (advs.length === 0) {
    toastErr(t('Create or browse an adventure first')); return;
  }
  const assignments = (assignR.body?.assignments || []).filter((a) => !a.event_id);

  await modal(t('Start a new event'), ({ body, close }) => {
    // ---- 1. Adventure picker ----
    const advPick = h('div', { class: 'chip-grid', style: 'max-height:240px' });
    let pickedAdv = advs[0];
    const advChip = (a) => {
      const chip = h('div', {
        class: 'chip selectable' + (a.slug === pickedAdv.slug ? ' selected' : ''),
        style: 'display:flex; flex-direction:column; gap:.1rem; min-width:160px',
      },
        h('strong', {}, a.title),
        h('span', { class: 'muted', style: 'font-size:.75rem' },
          a.mine_to_edit ? t('yours') : t('catalog')));
      chip.addEventListener('click', () => {
        pickedAdv = a;
        for (const c of advPick.children) c.classList.remove('selected');
        chip.classList.add('selected');
        refreshAssignment();
      });
      return chip;
    };
    advs.forEach((a) => advPick.append(advChip(a)));

    // ---- 2. Capacity: reuse existing assignment or buy ----
    const buyCount = h('input', { type: 'number', min: '1', max: '100', value: '10' });
    const capacitySection = h('div', {});
    // Pricing rides on whoami; fallback values keep stale dev clones
    // running. Currency drives Intl formatting so $/€/kr render cleanly.
    const PRICE_CENTS = (state.me?.pricing?.slot_cents) || 200;
    const CURRENCY    = (state.me?.pricing?.currency)   || 'EUR';
    const fmtMoney = (cents) => new Intl.NumberFormat(undefined,
      { style: 'currency', currency: CURRENCY }).format(cents / 100);
    const refreshAssignment = () => {
      capacitySection.replaceChildren();
      const matching = assignments.filter((x) => x.adventure_slug === pickedAdv.slug);
      if (matching.length > 0) {
        capacitySection.append(
          h('p', { class: 'muted' }, t('You have an unused assignment for this adventure — no new purchase needed.')),
          h('p', {}, h('strong', {}, matching[0].max_teams === 1
            ? t('{{n}} team slot', { n: matching[0].max_teams })
            : t('{{n}} team slots', { n: matching[0].max_teams }))));
      } else {
        const total = () => fmtMoney((parseInt(buyCount.value, 10) || 0) * PRICE_CENTS);
        const totalEl = h('strong', {}, total());
        buyCount.addEventListener('input', () => { totalEl.textContent = total(); });
        capacitySection.append(
          h('p', { class: 'muted' },
            t('How many team slots do you need? ({{price}} each, simulated payment.)',
              { price: fmtMoney(PRICE_CENTS) })),
          h('div', { class: 'row', style: 'gap:.5rem; align-items:center' },
            h('label', { class: 'field', style: 'flex:0 0 auto; margin:0' },
              h('span', {}, t('Team slots')), buyCount),
            h('p', { style: 'margin:0' }, t('Total: '), totalEl)));
      }
    };
    refreshAssignment();

    // ---- 3. When ----
    // The default is manual start: the wizard leaves the event in
    // scheduled state so the arranger can share links and add teams
    // before tapping Start on the event page.
    const modeManual = h('input', { type: 'radio', name: 'ev-mode', value: 'manual', checked: true });
    const modeLater  = h('input', { type: 'radio', name: 'ev-mode', value: 'later' });
    const whenInput  = h('input', { type: 'datetime-local', disabled: '' });
    const toggleWhen = () => { whenInput.disabled = !modeLater.checked; };
    modeManual.addEventListener('change', toggleWhen);
    modeLater.addEventListener('change', toggleWhen);
    // datetime-local has no timezone selector, so a Stockholm arranger
    // typing "14:00" can't tell if the server stores it as 14:00 local
    // or 14:00 UTC. Make the user's resolved zone explicit so DST and
    // remote-server clocks aren't a guessing game.
    const localTZ = (() => {
      try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; }
      catch { return ''; }
    })();
    const tzHint = h('small', { class: 'muted', style: 'display:block; margin-top:.2rem' },
      localTZ ? t('Times are interpreted as your local timezone ({{tz}}).', { tz: localTZ })
              : t('Times are interpreted as your local timezone.'));
    const nameInput = h('input', { placeholder: t('e.g. “Saturday Andersson party”') });

    // ---- 4. Teams ----
    const teamCount = h('input', { type: 'number', min: '0', max: '50', value: '0' });
    const playerCount = h('input', { type: 'number', min: '1', max: '20', value: '3' });
    const teamPrefix   = h('input', { value: 'Team' });
    const playerPrefix = h('input', { value: 'Player' });

    const submitBtn = h('button', { class: 'btn primary', type: 'submit' }, t('Create event'));
    const attestWiz = h('input', { type: 'checkbox', required: true });
    const form = h('form', {},
      h('h3', { style: 'margin-top:0' }, t('Adventure')),
      advPick,
      h('h3', {}, t('Team capacity')),
      capacitySection,
      h('h3', {}, t('When')),
      h('label', { style: 'display:flex; gap:.5rem; align-items:center; margin:.25rem 0' },
        modeManual, h('span', {}, t('Start manually — I\'ll hit Start when we\'re ready'))),
      h('label', { style: 'display:flex; gap:.5rem; align-items:center; margin:.25rem 0' },
        modeLater, h('span', {}, t('Schedule for later'))),
      h('label', { class: 'field' }, h('span', {}, t('Auto-start at')), whenInput, tzHint),
      h('label', { class: 'field' }, h('span', {}, t('Event name (optional)')), nameInput),
      h('h3', {}, t('Teams (optional — add later if you prefer)')),
      h('div', { class: 'grid cols-2' },
        h('label', { class: 'field' }, h('span', {}, t('Number of teams')), teamCount),
        h('label', { class: 'field' }, h('span', {}, t('Players per team')), playerCount)),
      h('div', { class: 'grid cols-2' },
        h('label', { class: 'field' }, h('span', {}, t('Team name prefix')), teamPrefix),
        h('label', { class: 'field' }, h('span', {}, t('Player name prefix')), playerPrefix)),
      h('h3', {}, t('Player ages')),
      h('label', { style: 'display:flex; gap:.5rem; align-items:flex-start; margin:.25rem 0; font-size:.9rem' },
        attestWiz,
        h('span', {}, t('I confirm no participants under 13 will play this adventure, or I have parental consent for any who will.'))),
      h('div', { class: 'row end', style: 'margin-top:1rem' },
        h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, t('Cancel')),
        submitBtn));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!attestWiz.checked) { toastErr(t('Please confirm the player-age statement first.')); return; }
      submitBtn.disabled = true;
      try {
        // Resolve or mint an assignment.
        let assignmentID = null;
        const matching = assignments.filter((x) => x.adventure_slug === pickedAdv.slug);
        if (matching.length > 0) {
          assignmentID = matching[0].id;
        } else {
          const n = Math.max(1, parseInt(buyCount.value, 10) || 0);
          const pr = await api('/api/admin/purchases', {
            method: 'POST',
            body: JSON.stringify({ adventure_slug: pickedAdv.slug, max_teams: n }),
          });
          if (pr.status !== 201) { toastErr(pr.body?.error || t('Purchase failed')); return; }
          const cr = await api('/api/admin/purchases/' + pr.body.id + '/confirm', { method: 'POST' });
          if (cr.status !== 200) { toastErr(cr.body?.error || t('Payment failed')); return; }
          assignmentID = cr.body.assignment_id;
        }
        // Create the event.
        const runReq = { assignment_id: assignmentID, name: nameInput.value.trim(), attest_no_minors: true };
        if (modeLater.checked) {
          if (!whenInput.value) { toastErr(t('Pick an auto-start time')); return; }
          runReq.scheduled_at = new Date(whenInput.value).toISOString();
        }
        const rr = await api('/api/admin/events', { method: 'POST', body: JSON.stringify(runReq) });
        if (rr.status !== 201) { toastErr(rr.body?.error || t('Event creation failed')); return; }
        const runID = rr.body.id;
        // Bulk teams.
        const T = Math.max(0, parseInt(teamCount.value, 10) || 0);
        const P = Math.max(1, parseInt(playerCount.value, 10) || 0);
        const tp = teamPrefix.value.trim() || 'Team';
        const pp = playerPrefix.value.trim() || 'Player';
        for (let i = 1; i <= T; i++) {
          const members = Array.from({ length: P }, (_, j) => `${pp} ${j + 1}`);
          await api(`/api/admin/events/${runID}/teams`, {
            method: 'POST',
            body: JSON.stringify({ name: `${tp} ${i}`, member_names: members }),
          });
        }
        toastOk(t('Event ready'));
        close(true);
        nav('#events/' + runID);
      } finally {
        submitBtn.disabled = false;
      }
    });
    body.append(form);
  }, { wide: true });
}

// runLabel renders an event's display name — the human-set name if any,
// otherwise "Event #id". Used everywhere an event identifier is shown.
function runLabel(run) {
  if (!run) return '';
  return event.name ? event.name : 'Event #' + event.id;
}

async function openRenameEvent(run) {
  await modal(t('Rename event'), ({ body, close }) => {
    const input = h('input', { value: event.name || '', autofocus: true, placeholder: t('Event name') });
    const form = h('form', {},
      h('label', { class: 'field' }, h('span', {}, t('Event name')), input),
      h('p', { class: 'muted', style: 'font-size:.85rem' },
        t('Empty resets to "Event #{{id}}".', { id: event.id })),
      h('div', { class: 'row end' },
        h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, t('Cancel')),
        h('button', { class: 'btn primary', type: 'submit' }, t('Save'))));
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const r = await api(`/api/admin/events/${run.id}`, {
        method: 'PATCH', body: JSON.stringify({ name: input.value.trim() }),
      });
      if (r.status === 204) { toastOk(t('Renamed')); close(true); renderRoute(); }
      else toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
    });
    body.append(form);
  });
}
