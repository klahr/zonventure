// openTeamModal handles both new-team and edit-team. For a new team the
// arranger types a team name plus one name per line; each line becomes a
// slot with its own magic-link token. For an existing team the modal lets
// the arranger rename, copy each slot's link, rotate a link, remove a
// slot, or add a new slot inline.
async function openTeamModal(runID, existing, event) {
  if (existing) return openEditTeamModal(runID, existing, event);
  return openNewTeamModal(runID);
}

async function openNewTeamModal(runID) {
  // Fetch the event's current teams so bulk-create can skip over names
  // that already exist. Without this, running bulk twice (or running
  // it with a prefix that happens to collide with an existing team)
  // hits the UNIQUE(run_id, name) constraint on every POST and the
  // arranger sees "Created 0, N failed" with no explanation.
  const existingR = await api('/api/admin/events/' + runID);
  const existingNames = new Set(((existingR.body?.teams) || []).map((x) => x.name));
  await modal(t('Add teams'), ({ body, close, setBeforeClose }) => {
    // Two modes share this modal. Default is "single" — fill one team
    // with specific names. "Bulk" is the tournament-setup shortcut:
    // "I have 5 teams of 3 players, generate placeholders, we'll
    // rename later." Names are auto-generated; the magic-link share
    // page already works with whatever names are there.
    const modeSingle = h('input', { type: 'radio', name: 'mode', value: 'single', checked: true });
    const modeBulk   = h('input', { type: 'radio', name: 'mode', value: 'bulk' });
    const modeRoster = h('input', { type: 'radio', name: 'mode', value: 'roster' });
    const modeImport = h('input', { type: 'radio', name: 'mode', value: 'import' });
    const modeBar = h('div', { style: 'display:flex; gap:1rem; margin-bottom:1rem; flex-wrap:wrap' },
      h('label', { style: 'display:flex; gap:.4rem; align-items:center; cursor:pointer' },
        modeSingle, h('span', {}, t('One team'))),
      h('label', { style: 'display:flex; gap:.4rem; align-items:center; cursor:pointer' },
        modeBulk, h('span', {}, t('Many teams at once'))),
      h('label', { style: 'display:flex; gap:.4rem; align-items:center; cursor:pointer' },
        modeRoster, h('span', {}, t('Paste roster'))),
      h('label', { style: 'display:flex; gap:.4rem; align-items:center; cursor:pointer' },
        modeImport, h('span', {}, t('Upload file'))),
    );

    /* ---- single-team fields ---- */
    const nameInput = h('input', { name: 'name', autofocus: true });
    // Inline validation: blur surfaces "required", live input flags
    // collisions against existingNames before the server has to.
    // Catches the "I just made a team called Alpha, why is the second
    // one failing?" loop without waiting for the 409.
    const nameHint = h('p', { class: 'err',
      style: 'display:none; margin:.15rem 0 0; font-size:.8rem' });
    const checkName = (force) => {
      const v = nameInput.value.trim();
      if (!v) {
        if (force) { nameHint.textContent = t('Team name required.'); nameHint.style.display = ''; }
        else nameHint.style.display = 'none';
        return;
      }
      if (existingNames.has(v)) {
        nameHint.textContent = t('A team named "{{name}}" already exists in this event.', { name: v });
        nameHint.style.display = '';
      } else {
        nameHint.style.display = 'none';
      }
    };
    nameInput.addEventListener('input', () => checkName(false));
    nameInput.addEventListener('blur',  () => checkName(true));

    const memberArea = h('textarea', {
      name: 'members', rows: 5,
      placeholder: 'alice\nbob\ncharlie',
    });
    const memberHint = h('p', { class: 'err',
      style: 'display:none; margin:.15rem 0 0; font-size:.8rem' });
    const checkMembers = (force) => {
      const names = (memberArea.value || '').split(/[\n,;]+/)
        .map((s) => s.trim()).filter(Boolean);
      if (names.length === 0 && force) {
        memberHint.textContent = t('Add at least one member — each line becomes a player slot.');
        memberHint.style.display = '';
      } else {
        memberHint.style.display = 'none';
      }
    };
    memberArea.addEventListener('input', () => checkMembers(false));
    memberArea.addEventListener('blur',  () => checkMembers(true));

    // Optional captain-contact email. Stays purely arranger-side
    // (the team-share page never surfaces it); used for ops
    // contact and the post-event recap drop in the future. The
    // server validates shape; UI just gives an email-typed input
    // so mobile keyboards swap to the @ layout.
    const emailInputSingle = h('input', {
      type: 'email',
      placeholder: 'captain@example.org',
      autocomplete: 'off',
    });
    const singleFields = h('div', {},
      h('label', { class: 'field' }, h('span', {}, t('Team name')), nameInput),
      nameHint,
      h('label', { class: 'field' },
        h('span', {}, t('Members — one per line, or paste CSV')),
        memberArea),
      memberHint,
      h('p', { class: 'muted', style: 'font-size:.8rem' },
        t('Each line becomes a player slot with its own magic-link token.')),
      h('label', { class: 'field' },
        h('span', {}, t('Captain email (optional)')),
        emailInputSingle),
      h('p', { class: 'muted', style: 'font-size:.8rem; margin-top:-.25rem' },
        t('Used by the arranger only — never shown on the team\'s share page.')));

    /* ---- bulk-team fields ---- */
    const teamCount   = h('input', { type: 'number', min: '1', max: '50', value: '5' });
    const playerCount = h('input', { type: 'number', min: '1', max: '20', value: '3' });
    const teamPrefix   = h('input', { value: 'Team' });
    const playerPrefix = h('input', { value: 'Player' });
    const bulkPreview = h('p', { class: 'muted', style: 'font-size:.85rem' });
    const updatePreview = () => {
      const T = parseInt(teamCount.value, 10) || 0;
      const P = parseInt(playerCount.value, 10) || 0;
      bulkPreview.textContent = t('Creates {{t}} teams × {{p}} players = {{n}} magic links.',
        { t: T, p: P, n: T * P });
    };
    for (const el of [teamCount, playerCount]) el.addEventListener('input', updatePreview);
    updatePreview();
    const bulkFields = h('div', { style: 'display:none' },
      h('div', { class: 'grid cols-2' },
        h('label', { class: 'field' }, h('span', {}, t('Number of teams')), teamCount),
        h('label', { class: 'field' }, h('span', {}, t('Players per team')), playerCount)),
      h('div', { class: 'grid cols-2' },
        h('label', { class: 'field' }, h('span', {}, t('Team name prefix')), teamPrefix),
        h('label', { class: 'field' }, h('span', {}, t('Player name prefix')), playerPrefix)),
      bulkPreview);

    /* ---- roster-paste fields ---- */
    // One row per team. The first cell is the team name, everything
    // after it is a player name. Accepts comma, semicolon, tab, or
    // colon as the team-name separator so spreadsheet copy-paste
    // (typically tab) and "Team: alice, bob" both parse.
    const rosterArea = h('textarea', {
      rows: 8,
      // Untranslated example — names are placeholders so locale doesn't
      // change the shape, and the i18n completeness test treats embedded
      // newlines as a single hard-to-match key.
      placeholder: 'Alpha, alice, bob, carol\nBeta, dave, ezra\nGamma: fiona, gina, henry',
    });
    const rosterPreview = h('p', { class: 'muted', style: 'font-size:.85rem; min-height:1em' });
    const parseRoster = (text) => {
      const out = [];
      for (const raw of (text || '').split(/\r?\n/)) {
        const line = raw.trim();
        if (!line) continue;
        // Split on the first cell separator. After that the rest of
        // the cells are member names — themselves split on the same
        // set so "Alpha, alice, bob" and "Alpha\talice\tbob" both work.
        const parts = line.split(/[\t,;:]+/).map((s) => s.trim()).filter(Boolean);
        if (parts.length === 0) continue;
        const [name, ...members] = parts;
        out.push({ name, member_names: members });
      }
      return out;
    };
    // Live preview doubles as live validation: empty rows just show
    // an empty preview (the placeholder explains the format), but a
    // row missing player names switches the preview to an error tone
    // so the arranger fixes it before submit instead of bouncing off
    // a toast. parsed[].member_names.length is what the bulk endpoint
    // would reject anyway.
    const updateRosterPreview = () => {
      const parsed = parseRoster(rosterArea.value);
      const players = parsed.reduce((n, t) => n + t.member_names.length, 0);
      const offender = parsed.find((tm) => tm.member_names.length === 0);
      if (offender) {
        rosterPreview.textContent = t('"{{name}}" has no player names — add at least one after the team name.',
          { name: offender.name });
        rosterPreview.className = 'err';
        rosterPreview.style.cssText = 'font-size:.85rem; min-height:1em';
      } else if (parsed.length === 0) {
        rosterPreview.textContent = '';
        rosterPreview.className = 'muted';
        rosterPreview.style.cssText = 'font-size:.85rem; min-height:1em';
      } else {
        rosterPreview.textContent = t('{{t}} teams · {{p}} player slots',
          { t: parsed.length, p: players });
        rosterPreview.className = 'muted';
        rosterPreview.style.cssText = 'font-size:.85rem; min-height:1em';
      }
    };
    rosterArea.addEventListener('input', updateRosterPreview);
    const rosterFields = h('div', { style: 'display:none' },
      h('label', { class: 'field' },
        h('span', {}, t('Roster — one team per line')),
        rosterArea),
      h('p', { class: 'muted', style: 'font-size:.8rem; margin-top:.25rem' },
        t('First column is the team name; remaining columns become player slots. Comma, tab, semicolon and colon are all accepted as separators.')),
      rosterPreview);

    /* ---- file-import fields ---- */
    // The picker accepts the formats the server-side registry
    // supports today. The accept attribute is advisory — the
    // server still resolves by content + extension and 415s
    // anything it can't parse — so an exporter that writes a
    // weird MIME still gets through if its extension matches.
    const importFile = h('input', {
      type: 'file',
      accept: '.csv,.ods,.xlsx,.xml',
      style: 'width:100%',
    });
    const importStatus = h('p', { class: 'muted', style: 'font-size:.85rem; min-height:1em; margin:.4rem 0 0' });
    // importParsed holds the {teams: [...]} payload the server
    // returns from /import. Submit-time we forward it verbatim to
    // /teams/bulk — same shape the existing endpoint already
    // accepts, no second validation pass needed here.
    let importParsed = null;
    importFile.addEventListener('change', async () => {
      importParsed = null;
      if (!importFile.files?.[0]) {
        importStatus.textContent = '';
        importStatus.className = 'muted';
        return;
      }
      importStatus.textContent = t('Reading file…');
      importStatus.className = 'muted';
      const fd = new FormData();
      fd.append('file', importFile.files[0]);
      const res = await fetch(`/api/admin/events/${runID}/teams/import`, {
        method: 'POST', body: fd, credentials: 'same-origin',
        headers: { 'X-CSRF-Token': csrfToken() },
      });
      if (!res.ok) {
        const errTxt = (await res.text()).trim();
        importStatus.textContent = errTxt || t('error {{status}}', { status: res.status });
        importStatus.className = 'err';
        return;
      }
      const body = await res.json();
      importParsed = body;
      const teams = body.teams || [];
      const players = teams.reduce((n, tm) => n + (tm.member_names || []).length, 0);
      const head = (teams.slice(0, 3).map((tm) => tm.name)).join(', ');
      const tail = teams.length > 3
        ? t('{{head}}, +{{n}} more', { head, n: teams.length - 3 })
        : head;
      importStatus.textContent = t('Recognised as {{fmt}}: {{t}} teams · {{p}} player slots — {{names}}',
        { fmt: body.format, t: teams.length, p: players, names: tail });
      importStatus.className = 'muted';
    });
    const importFields = h('div', { style: 'display:none' },
      h('label', { class: 'field' },
        h('span', {}, t('Roster file')),
        importFile),
      h('p', { class: 'muted', style: 'font-size:.8rem; margin:.25rem 0 0' },
        t('Supported: CSV, Excel (.xlsx), OpenDocument (.ods), IOF XML. First column is the team name; the rest become player slots.')),
      importStatus);

    const refreshMode = () => {
      singleFields.style.display = modeSingle.checked ? '' : 'none';
      bulkFields.style.display   = modeBulk.checked   ? '' : 'none';
      rosterFields.style.display = modeRoster.checked ? '' : 'none';
      importFields.style.display = modeImport.checked ? '' : 'none';
    };
    modeSingle.addEventListener('change', refreshMode);
    modeBulk.addEventListener('change', refreshMode);
    modeRoster.addEventListener('change', refreshMode);
    modeImport.addEventListener('change', refreshMode);

    const submitBtn = h('button', { class: 'btn primary', type: 'submit' }, t('Create'));
    const form = h('form', {}, modeBar, singleFields, bulkFields, rosterFields, importFields,
      h('div', { class: 'row end', style: 'margin-top:1rem' },
        h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, t('Cancel')),
        submitBtn));

    if (typeof setBeforeClose === 'function') {
      setBeforeClose(() => {
        const dirty = !!(nameInput.value.trim() || memberArea.value.trim()
          || rosterArea.value.trim()
          || (importParsed && importParsed.teams && importParsed.teams.length));
        return !dirty || confirm(t('Discard the team(s) you were adding?'));
      });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      try {
        if (modeImport.checked) {
          // The user uploaded a file and saw a preview; submit
          // forwards the parsed teams to the existing /teams/bulk
          // endpoint so file-imported and pasted rosters land
          // through the same DB writer + audit path.
          if (!importParsed || !importParsed.teams || !importParsed.teams.length) {
            toastErr(t('Pick a file with at least one team first'));
            return;
          }
          const rr = await api(`/api/admin/events/${runID}/teams/bulk`, {
            method: 'POST',
            body: JSON.stringify({ teams: importParsed.teams }),
          });
          if (rr.status !== 200) {
            toastErr(rr.body?.error || t('error {{status}}', { status: rr.status }));
            return;
          }
          const created = rr.body?.created || 0;
          const failed  = rr.body?.failed  || 0;
          if (failed === 0) {
            toastOk(t('Imported {{n}} teams', { n: created }));
          } else {
            const firstErr = (rr.body?.results || []).find((r) => r.error)?.error || '';
            toastErr(t('Imported {{c}}, {{f}} failed: {{err}}', { c: created, f: failed, err: firstErr }));
          }
        } else if (modeRoster.checked) {
          const teams = parseRoster(rosterArea.value);
          if (teams.length === 0) {
            toastErr(t('Add at least one team line'));
            return;
          }
          for (const tm of teams) {
            if (tm.member_names.length === 0) {
              toastErr(t('“{{name}}” has no players', { name: tm.name }));
              return;
            }
          }
          const rr = await api(`/api/admin/events/${runID}/teams/bulk`, {
            method: 'POST',
            body: JSON.stringify({ teams }),
          });
          if (rr.status !== 200) {
            toastErr(rr.body?.error || t('error {{status}}', { status: rr.status }));
            return;
          }
          const created = rr.body?.created || 0;
          const failed  = rr.body?.failed  || 0;
          if (failed === 0) {
            toastOk(t('Created {{n}} teams', { n: created }));
          } else {
            // Surface the first error so the arranger has a thread to
            // pull on; the response carries per-row detail too if they
            // need to dig deeper.
            const firstErr = (rr.body?.results || []).find((r) => r.error)?.error || '';
            toastErr(t('Created {{c}}, {{f}} failed: {{err}}', { c: created, f: failed, err: firstErr }));
          }
        } else if (modeSingle.checked) {
          const names = (memberArea.value || '').split(/[\n,;]+/)
            .map((s) => s.trim()).filter(Boolean);
          const tName = nameInput.value.trim();
          // Force-show the inline hints so a tap-without-typing lands
          // on the offending field directly. Toast on the same misses
          // so users with the modal scrolled past the inputs still
          // get a top-level signal.
          if (!tName) {
            checkName(true);
            nameInput.focus();
            return;
          }
          if (existingNames.has(tName)) {
            checkName(false);
            nameInput.focus();
            return;
          }
          if (names.length === 0) {
            checkMembers(true);
            memberArea.focus();
            return;
          }
          const tEmail = (emailInputSingle.value || '').trim();
          const rr = await api(`/api/admin/events/${runID}/teams`, {
            method: 'POST',
            body: JSON.stringify({ name: tName, member_names: names, email: tEmail }),
          });
          if (rr.status !== 201) { toastErr(rr.body?.error || t('error {{status}}', { status: rr.status })); return; }
          toastOk(t('Team created'));
        } else {
          const T = Math.max(1, parseInt(teamCount.value, 10) || 0);
          const P = Math.max(1, parseInt(playerCount.value, 10) || 0);
          const tp = teamPrefix.value.trim() || 'Team';
          const pp = playerPrefix.value.trim() || 'Player';
          // Skip over names that already exist on this event (previous
          // bulk attempts, manually-renamed collisions, …) so we don't
          // just fail every POST with a 409.
          let created = 0, failed = 0, lastError = '';
          let idx = 1;
          const safetyCap = 10000;
          while (created < T && idx < safetyCap) {
            let name;
            do {
              name = `${tp} ${idx++}`;
            } while (existingNames.has(name) && idx < safetyCap);
            if (idx >= safetyCap) break;
            const members = Array.from({ length: P }, (_, j) => `${pp} ${j + 1}`);
            const rr = await api(`/api/admin/events/${runID}/teams`, {
              method: 'POST',
              body: JSON.stringify({ name, member_names: members }),
            });
            if (rr.status === 201) {
              created++;
              existingNames.add(name);
            } else {
              failed++;
              lastError = rr.body?.error || t('error {{status}}', { status: rr.status });
              // If the server rejected once for a non-collision reason
              // (e.g. run full, permission), stop hammering it.
              if (!/already used/i.test(lastError)) break;
            }
          }
          if (created === 0 && failed > 0) {
            toastErr(lastError || t('Could not create any teams'));
          } else if (failed) {
            toastErr(t('Created {{c}}, {{f}} failed: {{err}}', { c: created, f: failed, err: lastError }));
          } else {
            toastOk(t('Created {{n}} teams', { n: created }));
          }
        }
        close(true);
        renderRoute();
      } finally {
        submitBtn.disabled = false;
      }
    });
    body.append(form);
  }, { wide: true });
}

async function openEditTeamModal(runID, existing, event) {
  // Refresh the team detail so we pick up any changes since the page
  // rendered — tokens can rotate and we want the latest.
  const r = await api('/api/admin/events/' + runID);
  const run = r.body || {};
  if (!event && run.event) event = run.event;
  const freshTeam = (run.teams || []).find((t) => t.id === existing.id) || existing;

  const canRename = canDo(event, 'rename_team');
  // Email edit is permitted in every event state, including
  // completed/cancelled — it's pure arranger metadata that never
  // surfaces on a player page, and the recap-link follow-up is
  // exactly the case an arranger fills it in late for. Falls back
  // to canRename when the event-detail response predates the
  // edit_team_email op (older backends).
  const canEditEmail = canDo(event, 'edit_team_email') || canRename;
  const canAddSlot = canDo(event, 'add_slot');
  const canAvatar = canDo(event, 'set_team_avatar');

  await modal(t('Edit team · {{name}}', { name: freshTeam.name }), ({ body, close }) => {
    const nameInput = h('input', { value: freshTeam.name, required: true, disabled: !canRename ? '' : null });
    // Captain contact email — arranger-side metadata, never shown
    // on the player share page. Optional; clearing the field saves
    // an empty string.
    const emailInput = h('input', {
      type: 'email',
      value: freshTeam.email || '',
      placeholder: 'captain@example.org',
      autocomplete: 'off',
      disabled: !canEditEmail ? '' : null,
    });
    // Save is enabled whenever EITHER editable field is open. With
    // canRename=false the save still works for an email-only edit;
    // with both off there's nothing actionable so the button stays
    // disabled.
    const saveBtn = h('button', { class: 'btn small', type: 'button',
      disabled: (!canRename && !canEditEmail) ? '' : null }, t('Save'));
    saveBtn.addEventListener('click', async () => {
      const name = nameInput.value.trim();
      const email = emailInput.value.trim();
      const body = {};
      if (name && name !== freshTeam.name) body.name = name;
      if (email !== (freshTeam.email || '')) body.email = email;
      if (Object.keys(body).length === 0) { close(false); return; }
      const rr = await api(`/api/admin/teams/${freshTeam.id}`, {
        method: 'PATCH', body: JSON.stringify(body),
      });
      if (rr.status === 204) { toastOk(t('Saved')); close(true); renderRoute(); }
      else toastErr(rr.body?.error || t('error {{status}}', { status: rr.status }));
    });

    const membersWrap = h('div', {});
    const rebuildMembers = () => {
      membersWrap.replaceChildren();
      const rows = (freshTeam.members || []).map((m) => renderSlotRow(freshTeam.id, m, reload, event));
      if (rows.length === 0) {
        membersWrap.append(h('p', { class: 'muted' }, t('No members yet. Add one below.')));
      } else {
        membersWrap.append(...rows);
      }
    };

    async function reload() {
      const rr = await api('/api/admin/events/' + runID);
      const fresh = (rr.body?.teams || []).find((t) => t.id === freshTeam.id);
      if (!fresh) { close(true); renderRoute(); return; }
      freshTeam.members = fresh.members;
      freshTeam.name = fresh.name;
      rebuildMembers();
    }

    // Inline "add slot"
    const newName = h('input', { placeholder: t('New member name'), disabled: !canAddSlot ? '' : null });
    const addBtn = h('button', { class: 'btn primary small', type: 'button', disabled: !canAddSlot ? '' : null }, icon(ICONS.plus), t('Add'));
    const addRow = canAddSlot
      ? h('div', { class: 'row', style: 'gap:.4rem; margin-top:.75rem' }, newName, addBtn)
      : null;
    addBtn.addEventListener('click', async () => {
      const name = newName.value.trim();
      if (!name) return;
      const rr = await api(`/api/admin/teams/${freshTeam.id}/slots`, {
        method: 'POST', body: JSON.stringify({ name }),
      });
      if (rr.status === 201) {
        newName.value = '';
        toastOk(t('Added {{name}}', { name: rr.body.name }));
        await reload();
      } else {
        toastErr(rr.body?.error || t('error {{status}}', { status: rr.status }));
      }
    });
    newName.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addBtn.click(); } });

    // Team-share affordances. The team URL is meant for the captain —
    // they open it on a phone and every member taps their own name. The
    // "Copy all" dumps name+URL pairs for paste-into-Slack flows.
    const teamURL = `${location.origin}/team/${encodeURIComponent(freshTeam.token || '')}`;
    const teamURLInput = h('input', {
      readonly: '', value: teamURL,
      style: 'flex:1; min-width:0; font-family:ui-monospace,monospace; font-size:.8rem; box-shadow:none; border-color:var(--border-soft); margin:0',
      on: { click: (e) => e.target.select() },
    });
    const copyTeamBtn = iconBtn('copy', t('Copy team share link'), async () => {
      try { await navigator.clipboard.writeText(teamURL); toastOk(t('Team link copied')); }
      catch { teamURLInput.select(); document.execCommand('copy'); toastOk(t('Team link copied')); }
    });
    const openTeamBtn = iconBtn('eye', t('Open team page'), () => window.open(teamURL, '_blank', 'noopener'));
    const copyAllBtn = h('button', { class: 'btn small', type: 'button' },
      icon(ICONS.copy), t('Copy all as text'));
    copyAllBtn.addEventListener('click', async () => {
      const base = location.origin;
      const text = (freshTeam.members || [])
        .map((m) => `${m.name}: ${base}/play?t=${m.token}`)
        .join('\n');
      try { await navigator.clipboard.writeText(text); toastOk(t('Copied {{n}} links', { n: freshTeam.members.length })); }
      catch { toastErr(t('Clipboard blocked — select and copy by hand')); }
    });

    // Profile picture row: preview + upload + remove. The preview is
    // rebuilt in place after upload/remove so the arranger sees the
    // change immediately without reopening the modal.
    const avatarHost = h('div', {
      style: 'display:flex; align-items:center; gap:.75rem; margin:.25rem 0 1rem',
    });
    const fileInput = h('input', { type: 'file', accept: 'image/*', style: 'display:none' });
    const avatarActions = h('div', { class: 'row', style: 'gap:.4rem; flex-wrap:wrap' });
    const redrawAvatar = () => {
      avatarHost.replaceChildren();
      const teamIndex = (run.teams || []).findIndex((x) => x.id === freshTeam.id);
      const colour = teamColor(freshTeam.id, Math.max(0, teamIndex));
      avatarHost.append(
        teamAvatar(freshTeam, colour, 56),
        h('div', { style: 'display:flex; flex-direction:column; gap:.3rem' },
          h('span', { class: 'muted', style: 'font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; font-weight:700' },
            t('Team photo')),
          avatarActions),
      );
    };
    const uploadBtn = h('button', { class: 'btn small', type: 'button' },
      icon(ICONS.plus), t('Upload photo'));
    uploadBtn.addEventListener('click', () => fileInput.click());
    const removeBtn = h('button', { class: 'btn small danger', type: 'button' },
      icon(ICONS.trash), t('Remove photo'));
    removeBtn.addEventListener('click', async () => {
      const rr = await api(`/api/admin/teams/${freshTeam.id}/avatar`, { method: 'DELETE' });
      if (rr.status === 204) {
        freshTeam.avatar_url = '';
        toastOk(t('Team photo removed'));
        redrawActions();
        redrawAvatar();
        renderRoute();
      } else {
        toastErr(rr.body?.error || t('error {{status}}', { status: rr.status }));
      }
    });
    fileInput.addEventListener('change', async () => {
      const file = fileInput.files?.[0];
      if (!file) return;
      const shrunk = await downscaleImage(file);
      const fd = new FormData();
      fd.append('file', shrunk);
      const res = await fetch(`/api/admin/teams/${freshTeam.id}/avatar`, {
        method: 'POST', body: fd, credentials: 'same-origin',
        headers: { 'X-CSRF-Token': csrfToken() },
      });
      fileInput.value = '';
      if (res.ok) {
        const body = await res.json().catch(() => ({}));
        // Cache-bust the URL so the preview + map markers pick up the
        // new image instead of showing the browser-cached old one.
        freshTeam.avatar_url = (body.url || `/adventure-assets/team-avatar/${freshTeam.id}`) + '?v=' + Date.now();
        toastOk(t('Team photo updated'));

    body.append(...[

        t('Send this single link to the captain. Each member taps their own name there to pick up their personal magic link.')),

        h('button', { class: 'btn', on: { click: () => close(null) } }, t('Close'))),
    ].filter(Boolean));
    rebuildMembers();
  }, { wide: true });
}

function renderSlotRow(teamID, slot, reload, event) {
  const url = `${location.origin}/play?t=${encodeURIComponent(slot.token)}`;
  const urlInput = h('input', {
    readonly: '', value: url,
    style: 'flex:1; min-width:0; font-family:ui-monospace,monospace; font-size:.8rem; box-shadow:none; border-color:var(--border-soft); margin:0',
    on: { click: (e) => e.target.select() },
  });
  const copyBtn = iconBtn('copy', t('Copy link'), async () => {
    try { await navigator.clipboard.writeText(url); toastOk(t('Link copied')); }
    catch { urlInput.select(); document.execCommand('copy'); toastOk(t('Link copied')); }
  });
  // Mid-event guard: rotating or removing a slot kicks the player off
  // their current link with no second chance, so during a live event
  // we double-check. Pre-event/scheduled changes get the old click-to-
  // act behaviour because the arranger is still setting up.
  const liveEvent = event && (event.state === 'running' || event.state === 'paused');
  const rotateBtn = canDo(event, 'rotate_slot_token')
    ? iconBtn('key', t('Rotate link — invalidates the old one'), async () => {
        if (liveEvent && !confirm(t('Rotate {{slot}}\'s link mid-event? The current device will be signed out and need the new link to keep playing.', { slot: slot.name }))) return;
        const rr = await api(`/api/admin/teams/${teamID}/slots/${slot.id}/rotate`, { method: 'POST' });
        if (rr.status === 200) { toastOk(t('Link rotated')); reload(); }
        else toastErr(rr.body?.error || t('error {{status}}', { status: rr.status }));
      })
    : null;
  const removeBtn = canDo(event, 'remove_slot')
    ? iconBtn('trash', t('Remove slot'), async () => {
        if (liveEvent && !confirm(t('Remove {{slot}} mid-event? Their link stops working immediately and any answers they\'ve already submitted stay with the team.', { slot: slot.name }))) return;
        const rr = await api(`/api/admin/teams/${teamID}/slots/${slot.id}`, { method: 'DELETE' });
        if (rr.status === 204) { toastOk(t('Removed')); reload(); }
        else toastErr(rr.body?.error || t('error {{status}}', { status: rr.status }));
      }, { danger: true })
    : null;
  return h('div', { style: 'margin-bottom:.5rem' },
    h('div', { class: 'row', style: 'gap:.4rem; align-items:center' },
      h('strong', { style: 'min-width:8ch' }, slot.name),
      urlInput, copyBtn, rotateBtn, removeBtn),
    slot.last_login_at
      ? h('div', { class: 'muted', style: 'font-size:.75rem; margin-left:.5rem' },
          t('last login {{when}}', { when: fmtLocal(slot.last_login_at) }))
      : null);
}

/* ========== Organizations (admin only) ========== */
async function viewOrganizations(view) {
  const [orgsR, advsR, purR] = await Promise.all([
    api('/api/admin/organizations'),
    api('/api/admin/adventures'),
    api('/api/admin/purchases'),
  ]);
  const orgs = orgsR.body?.organizations || [];
  const adventures = advsR.body?.adventures || [];
  // Admin gets every purchase; bucket by org_id so each card can render
  // only the rows for its own tenant. Server already orders by created_at
  // DESC, so the per-org slice stays newest-first without re-sorting.
  const purchasesByOrg = new Map();
  for (const p of (purR.body?.purchases || [])) {
    const list = purchasesByOrg.get(p.org_id) || [];
    list.push(p);
    purchasesByOrg.set(p.org_id, list);
  }
  view.replaceChildren(
    h('div', { class: 'row between' },
      h('h1', {}, t('Organizations')),
      h('button', { class: 'btn primary', on: { click: () => openCreateOrg() } },
        icon(ICONS.plus), t('New organization'))),
    h('p', { class: 'muted' },
      t('Each organization is a tenant — its admins author adventures and manage members; its race directors run events and manage teams. Assign adventures to an organization to let them schedule events.')),
    orgs.length === 0
      ? h('div', { class: 'empty' }, t('No organizations yet.'))
      : h('div', {}, orgs.map((o) =>
          renderOrganizationCard(o, adventures, purchasesByOrg.get(o.id) || []))),
  );
}

// renderOrgLogoBlock builds the per-org brand-logo affordance:
// preview thumbnail (or placeholder), upload, remove. Admin-only —
// the parent card is already gated on the global-admin route.
//
// On upload success we mutate `org.has_logo` and rebuild the block
// in place so the operator sees the new image immediately, without
// a full Organizations-tab refetch. Cache-bust via a `?v=<ts>` query
// so the browser drops any stale copy of the previous logo.
function renderOrgLogoBlock(org) {
  const wrap = h('div', {
    class: 'org-logo-row',
    style: 'display:flex; align-items:center; gap:.85rem; margin:.5rem 0 .25rem; padding:.6rem .85rem; background:var(--surface-2); border-radius:8px',
  });
  let cacheBust = Date.now();
  const fileInput = h('input', {
    type: 'file',
    accept: 'image/png,image/jpeg,image/webp,image/svg+xml',
    style: 'display:none',
  });
  const preview = h('div', {
    style: 'width:64px; height:42px; display:flex; align-items:center; justify-content:center; background:var(--surface); border:1px solid var(--border-soft); border-radius:6px; overflow:hidden; flex:0 0 auto',
  });
  const actions = h('div', { class: 'row', style: 'gap:.4rem; flex-wrap:wrap; flex:1 1 auto' });
  const draw = () => {
    preview.replaceChildren();
    if (org.has_logo) {
      preview.append(h('img', {
        src: '/org-logo/' + org.id + '?v=' + cacheBust,
        alt: t('{{name}} logo', { name: org.name }),
        style: 'max-width:100%; max-height:100%; object-fit:contain',
      }));
    } else {
      preview.append(h('span', { class: 'muted', style: 'font-size:.7rem; text-align:center' }, t('No logo')));
    }
    actions.replaceChildren();
    actions.append(
      h('span', { class: 'muted', style: 'font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; font-weight:700' },
        t('Brand logo')),
      h('p', { class: 'muted', style: 'margin:0; font-size:.8rem' },
        t('Shown on the event-recap PDF. PNG, JPEG, WebP, or SVG — max 5 MB. SVGs are rasterised to PNG on upload; transparency is flattened to white on render.')),
      h('div', { class: 'row', style: 'gap:.4rem' },
        (() => {
          const b = h('button', { class: 'btn small', type: 'button' },
            icon(ICONS.plus), org.has_logo ? t('Replace logo') : t('Upload logo'));
          b.addEventListener('click', () => fileInput.click());
          return b;
        })(),
        org.has_logo ? (() => {
          const b = h('button', { class: 'btn small danger', type: 'button' },
            icon(ICONS.trash), t('Remove'));
          b.addEventListener('click', async () => {
            const r = await api(`/api/admin/organizations/${org.id}/logo`, { method: 'DELETE' });
            if (r.status === 204) {
              org.has_logo = false;
              cacheBust = Date.now();
              toastOk(t('Logo removed'));
              draw();
            } else {
              toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
            }
          });
          return b;
        })() : null,
      ),
    );
  };
  fileInput.addEventListener('change', async () => {
    const file = fileInput.files?.[0];
    if (!file) return;
    const fd = new FormData();
    fd.append('file', file);
    const res = await fetch(`/api/admin/organizations/${org.id}/logo`, {
      method: 'POST', body: fd, credentials: 'same-origin',
      headers: { 'X-CSRF-Token': csrfToken() },
    });
    fileInput.value = '';
    if (res.ok) {
      org.has_logo = true;
      cacheBust = Date.now();
      toastOk(t('Logo updated'));
      draw();
    } else {
      const txt = await res.text().catch(() => '');
      toastErr(txt || t('error {{status}}', { status: res.status }));
    }
  });
  wrap.append(preview, actions, fileInput);
  draw();
  return wrap;
}

function renderOrganizationCard(org, adventures, purchases) {
  const assignments = org.assignments || [];
  const unused = assignments.filter((x) => !x.event_id);
  const used = assignments.filter((x) => x.event_id);
  const members = org.members || [];
  purchases = purchases || [];

  const usersPart = members.length === 1
    ? t('{{n}} user', { n: members.length })
    : t('{{n}} users', { n: members.length });
  const playersCount = org.players_total || 0;
  const playersPart = playersCount === 1
    ? t('{{n}} player', { n: playersCount })
    : t('{{n}} players', { n: playersCount });
  const eventsCount = org.events_total || 0;
  const runsPart = eventsCount === 1
    ? t('{{n}} event', { n: eventsCount })
    : t('{{n}} events', { n: eventsCount });

  return h('div', { class: 'card' },
    h('div', { class: 'row between' },
      h('div', {},
        h('h2', {}, org.name),
        h('p', { class: 'muted', style: 'font-size:.85rem' },
          `${usersPart} · ${playersPart} · ${runsPart}`,
          (org.events_running || 0) > 0
            ? t(' · {{n}} running', { n: org.events_running })
            : '')),
      h('div', { class: 'card-actions' },
        iconBtn('key',    t('Assign adventure'),   () => openAssignAdventure(org, adventures)),
        iconBtn('user',   t('Add user'),           () => openAddOrgMember(org)),
        iconBtn('pencil', t('Rename'),             () => openRenameOrg(org)),
        iconBtn('trash',  t('Delete'),             () => confirmDeleteOrg(org), { danger: true }))),

    // Brand logo row — surfaced on the recap PDF cover (and, in the
    // future, the play / arrange chrome). PNG/JPEG/WebP only;
    // re-encoded server-side so a polyglot upload can't survive.
    renderOrgLogoBlock(org),

    // Trusted toggle — gives the org an "Add to invoice" option on
    // the buy-player-slots modal. Off-platform invoice generation; the
    // platform just tags the resulting purchase row with
    // provider='invoice' for the operator to reconcile.
    h('div', { class: 'row', style: 'gap:.5rem; align-items:center; margin:.5rem 0' },
      h('span', { class: org.trusted ? 'pill success' : 'pill' },
        org.trusted ? t('Invoice billing on') : t('Invoice billing off')),
      h('button', {
        class: 'btn small ghost',
        on: { click: () => toggleOrgTrusted(org) },
      }, org.trusted ? t('Disable invoice billing') : t('Enable invoice billing')),
      h('span', { class: 'muted', style: 'font-size:.8rem' },
        t('Lets the org add player slots to an invoice instead of paying via Stripe.'))),

    h('h3', { style: 'margin-top:.75rem' }, t('Users ({{n}})', { n: members.length })),
    members.length === 0
      ? h('p', { class: 'muted', style: 'font-size:.85rem' }, t('No users yet — add one to get started.'))
      : h('div', {}, members.map((m) => h('span', {
          class: 'chip' + (m.email_verified === false ? ' chip-unverified' : ''),
          style: 'margin: 0 .35rem .35rem 0',
          title: t('{{role}} · click ⓧ to remove', { role: m.role }),
        }, m.role === 'org_admin'
            ? t('{{username}} (admin)', { username: m.username })
            : t('{{username}} (race director)', { username: m.username }),
        // Manual verify button: shown only when the user hasn't
        // confirmed their email through the self-serve flow yet. Use
        // sparingly — it bypasses the deliverability check that
        // signup verification gives us, so the admin should already
        // have confirmed identity out-of-band.
        m.email_verified === false ? h('button', {
          title: t('Manually verify email (use only after confirming the user out-of-band)'),
          class: 'chip-verify',
          on: { click: (e) => { e.stopPropagation(); confirmVerifyMemberEmail(org, m); } },
        }, t('verify')) : null,
        h('button', { title: t('Remove'), on: { click: () => confirmRemoveOrgMember(org, m) } }, '×')))),

    h('h3', { style: 'margin-top:.75rem' }, t('Unused assignments ({{n}})', { n: unused.length })),
    unused.length === 0
      ? h('p', { class: 'muted', style: 'font-size:.85rem' }, t('None — assign an adventure to let them schedule an event.'))
      : h('div', {}, unused.map((x) => h('span', {
          class: 'chip selectable',
          style: 'margin: 0 .35rem .35rem 0',
          title: t('Click to edit'),
          on: { click: () => openEditAssignment(org, x, adventures) },
        }, x.max_players === 1
            ? t('{{slug}} · {{n}} player', { slug: x.adventure_slug, n: x.max_players })
            : t('{{slug}} · {{n}} players', { slug: x.adventure_slug, n: x.max_players })))),

    ...(used.length === 0 ? [] : [h('div', { style: 'margin-top:.75rem' },
      h('h3', {}, t('Used ({{n}})', { n: used.length })),
      h('div', {}, used.map((x) => h('span', {
          class: 'chip selectable',
          style: 'margin: 0 .35rem .35rem 0; opacity:.75; font-style:italic',
          title: t('Click to edit player cap'),
          on: { click: () => openEditAssignment(org, x, adventures) },
        }, t('{{slug}} · event #{{event}} · max {{max}}', {
          slug: x.adventure_slug, run: x.event_id, max: x.max_players,
        })))))]),

    h('h3', { style: 'margin-top:.75rem' }, t('Purchases ({{n}})', { n: purchases.length })),
    purchases.length === 0
      ? h('p', { class: 'muted', style: 'font-size:.85rem' }, t('No purchases.'))
      : h('table', { class: 'table', style: 'margin-top:.25rem' },
          h('thead', {}, h('tr', {},
            h('th', {}, t('Adventure')),
            h('th', {}, t('Slots')),
            h('th', {}, t('Total')),
            h('th', {}, t('State')),
            h('th', {}, t('Date')),
            h('th', {}, ''))),
          h('tbody', {}, purchases.map((p) => {
            const total = new Intl.NumberFormat(undefined, {
              style: 'currency', currency: p.currency || 'EUR',
            }).format(p.amount_cents / 100);
            return h('tr', {},
              h('td', {}, p.adventure_title || p.adventure_slug),
              h('td', { class: 'mono' }, p.max_players),
              h('td', { class: 'mono' }, total),
              h('td', {}, h('span', {
                class: 'pill ' + (p.state === 'paid' ? 'success'
                  : p.state === 'pending' ? 'warning'
                  : p.state === 'refunded' ? 'danger' : ''),
              }, stateGlyph(p.state) + p.state)),
              h('td', { class: 'muted mono', style: 'font-size:.8rem' }, p.created_at),
              h('td', { class: 'row', style: 'gap:.5rem; flex-wrap:wrap; justify-content:flex-end' },
                renderPurchaseActions(p)));
          }))),
  );
}

async function confirmDeleteOrg(org) {
  // The org list already carries counts so we can show the blast
  // radius up front rather than letting the admin discover the size
  // of the cascade after pressing delete. Refuse to even prompt when
  // an event is currently running — that's the case where a misclick
  // is most catastrophic.
  const members     = (org.members || []).length;
  const assignments = (org.assignments || []).length;
  const players     = org.players_total || 0;
  const events      = org.events_total || 0;
  const running     = org.events_running || 0;
  if (running > 0) {
    toastErr(t('Cannot delete: {{n}} event(s) currently running. Stop them first.', { n: running }));
    return;
  }
  const summary = t('You are about to delete: {{members}} user(s), {{assignments}} assignment(s), {{players}} player(s), {{events}} event(s). Cascades immediately and cannot be undone.',
    { members, assignments, players, events });
  const pw = await promptPassword(t('Delete organization “{{name}}”?', { name: org.name }),
    summary + ' ' + t('Enter your password to confirm.'));
  if (!pw) return;
  const r = await api(`/api/admin/organizations/${org.id}`, {
    method: 'DELETE', headers: { 'X-Confirm-Password': pw },
  });
  if (r.status === 204) { toastOk(t('Organization deleted')); renderRoute(); }
  else toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
}

async function openAddOrgMember(org) {
  await modal(t('Add user to {{name}}', { name: org.name }), ({ body, close }) => {
    // pickedUser tracks the operator-confirmed identity from the
    // suggestion list. Set when a suggestion row is clicked; cleared
    // by any keystroke that diverges from it. While set, the form is
    // in "add existing user" mode (password hidden, password not
    // required); when null and the username field has text, mode is
    // "create new account" (password required).
    let pickedUser = null;
    let searchTimer = null;
    let searchInFlight = null;
    let lastQuery = '';
    // Last-known matches from the typeahead. Mirrored as a JS array
    // so blur / submit can promote a typed-but-not-clicked username
    // to a pickedUser without re-rendering.
    let suggestions = [];

    const usernameEl = h('input', {
      name: 'u', autofocus: true, required: true,
      autocomplete: 'off', spellcheck: 'false',
      'aria-autocomplete': 'list',
    });
    const suggList = h('ul', {
      class: 'add-user-suggestions',
      role: 'listbox',
      style: 'list-style:none; padding:.25rem; margin:.25rem 0 0; border:1px solid var(--border-soft); border-radius:8px; max-height:14rem; overflow-y:auto; background:var(--surface); display:none',
    });
    const passwordEl = h('input', {
      name: 'p', type: 'password', autocomplete: 'new-password', minlength: 8,
    });
    const passwordRow = h('label', { class: 'field' },
      h('span', {}, t('Password')),
      passwordEl,
      h('small', { class: 'muted', style: 'display:block; margin-top:.2rem' },
        t('Minimum 8 characters.')));
    // Role labels: "Race director" matches what org_member actually
    // does (runs events, manages teams, no authoring) and anchors
    // Zonventure to the orienteering / adventure-event format
    // rather than generic SaaS workshop-host language. The wire
    // value stays org_member so the API + DB are unchanged.
    const roleEl = h('select', { name: 'r' },
      h('option', { value: 'org_member' }, t('Race director')),
      h('option', { value: 'org_admin' }, t('Admin')));
    const status = h('p', {
      class: 'muted',
      style: 'font-size:.85rem; min-height:1.2em; margin:.5rem 0 0',
      'aria-live': 'polite',
    });

    const setMode = () => {
      if (pickedUser) {
        passwordRow.style.display = 'none';
        passwordEl.required = false;
        status.textContent = t('Adding existing user — they keep their current password.');
        status.className = 'ok';
      } else if (usernameEl.value.trim()) {
        passwordRow.style.display = '';
        passwordEl.required = true;
        status.textContent = t('Will create a new account — set an initial password below.');
        status.className = 'muted';
      } else {
        passwordRow.style.display = '';
        passwordEl.required = false;
        status.textContent = '';
        status.className = 'muted';
      }
    };

    const closeList = () => { suggList.style.display = 'none'; };

    const renderSuggestions = (users) => {
      suggestions = users;
      if (users.length === 0) { closeList(); return; }
      suggList.replaceChildren(...users.map((u) => {
        const li = h('li', {
          role: 'option',
          tabindex: '-1',
          style: 'padding:.45rem .65rem; cursor:pointer; border-radius:4px',
          on: {
            // mousedown beats click — blur on the input fires before
            // a click would, and we'd race-close the list. Mousedown
            // fires first and lets us prevent the blur entirely.
            mousedown: (e) => {
              e.preventDefault();
              pickedUser = u;
              usernameEl.value = u.username;
              closeList();
              setMode();
            },
          },
        }, u.username);
        li.addEventListener('mouseenter', () => { li.style.background = 'var(--surface-2)'; });
        li.addEventListener('mouseleave', () => { li.style.background = ''; });
        return li;
      }));
      suggList.style.display = '';
    };

    const search = async () => {
      const q = usernameEl.value.trim();
      if (q.length < 2) { suggestions = []; closeList(); return; }
      if (q === lastQuery) return;
      lastQuery = q;
      const r = await api(
        `/api/admin/users/search?q=${encodeURIComponent(q)}&org_id=${org.id}`,
      );
      // The user may have typed more characters since this fetch
      // started — drop the result if it's stale.
      if (q !== usernameEl.value.trim()) return;
      if (r.status !== 200) return;
      renderSuggestions(r.body?.users || []);
    };

    // flushPendingSearch fires any debounced search NOW and waits.
    // Used by blur + submit so we never act on a known-stale
    // suggestion list — e.g. user types "alice" then immediately
    // tabs away within the 200ms debounce.
    const flushPendingSearch = async () => {
      if (searchTimer) {
        clearTimeout(searchTimer);
        searchTimer = null;
      }
      if (searchInFlight) await searchInFlight;
      const q = usernameEl.value.trim();
      if (q.length >= 2 && q !== lastQuery) {
        searchInFlight = search();
        await searchInFlight;
        searchInFlight = null;
      }
    };

    // tryAutoPick promotes the typed username to pickedUser when it
    // exactly matches one of the current suggestions. CITEXT makes
    // the lookup case-insensitive on the backend, so we compare the
    // same way here and snap the input to the canonical case so
    // e.g. "ALICE" displays as "alice" once locked in.
    const tryAutoPick = () => {
      if (pickedUser) return;
      const q = usernameEl.value.trim().toLowerCase();
      if (!q) return;
      const match = suggestions.find((u) => u.username.toLowerCase() === q);
      if (match) {
        pickedUser = match;
        usernameEl.value = match.username;
        setMode();
      }
    };

    usernameEl.addEventListener('input', () => {
      // Any keystroke invalidates the locked-in existing-user pick.
      pickedUser = null;
      setMode();
      clearTimeout(searchTimer);
      searchTimer = setTimeout(search, 200);
    });
    usernameEl.addEventListener('focus', () => {
      if (suggList.children.length > 0 && usernameEl.value.trim().length >= 2) {
        suggList.style.display = '';
      }
    });
    usernameEl.addEventListener('blur', async () => {
      // Defer so a click on a suggestion (mousedown handler above)
      // gets to run before the list disappears.
      setTimeout(closeList, 100);
      // If the typed text matches an existing user, treat it as if
      // the operator picked it from the list — saves them an extra
      // click in the common "I know the username already" case.
      await flushPendingSearch();
      tryAutoPick();
    });

    setMode();

    const form = h('form', {},
      h('label', { class: 'field' }, h('span', {}, t('Username')),
        usernameEl,
        suggList),
      status,
      passwordRow,
      h('label', { class: 'field' }, h('span', {}, t('Role')), roleEl),
      h('div', { class: 'row end' },
        h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, t('Cancel')),
        h('button', { class: 'btn primary', type: 'submit' }, t('Add'))));
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = usernameEl.value.trim();
      if (!username) return;
      // If the operator typed a username matching an existing user
      // and hit Enter without ever clicking a suggestion, promote
      // it now so they don't get a confusing "set a password" error.
      if (!pickedUser) {
        await flushPendingSearch();
        tryAutoPick();
      }
      const role = roleEl.value;
      const payload = { username: usernameEl.value.trim(), role };
      if (!pickedUser) {
        if (!passwordEl.value) {
          toastErr(t('Set a password for the new account, or pick an existing user from the suggestions.'));
          return;
        }
        payload.password = passwordEl.value;
      }
      const r = await api(`/api/admin/organizations/${org.id}/members`, {
        method: 'POST',
        body: JSON.stringify(payload),
      });
      if (r.status === 201) { toastOk(t('User added')); close(true); renderRoute(); }
      else toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
    });
    body.append(form);
  });
}

// openTransferOwnership lets the calling org_admin hand the org over
// to another member in one click — promotes the picked target to
// org_admin and demotes the caller to org_member atomically. Useful
// when a sole admin wants to step down without leaving the org
// admin-less, and when an admin wants to quit the team and have
// someone else take over the billing seat.
async function openTransferOwnership(org) {
  const others = (org.members || []).filter((m) => m.id !== state.me.id);
  if (others.length === 0) return;
  await modal(t('Transfer ownership of {{name}}', { name: org.name }), ({ body, close }) => {
    const select = h('select', { name: 'to', required: true });
    others.forEach((m) => {
      const label = m.username + (m.role === 'org_admin' ? ' (' + t('admin') + ')' : '');
      select.append(h('option', { value: String(m.id) }, label));
    });
    const form = h('form', {},
      h('p', { class: 'muted', style: 'font-size:.9rem' },
        t('The chosen user becomes an admin and you become a regular member. Both changes happen in one step.')),
      h('label', { class: 'field' },
        h('span', {}, t('Promote to admin')), select),
      h('div', { class: 'row end', style: 'gap:.5rem; margin-top:1rem' },
        h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, t('Cancel')),
        h('button', { class: 'btn primary', type: 'submit' }, t('Transfer ownership'))),
    );
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const toID = parseInt(select.value, 10);
      if (!Number.isFinite(toID)) return;
      // Password confirm reuses the existing prompt — same friction
      // bar as account deletion, which transfer is comparable to in
      // blast radius (caller permanently loses admin powers).
      const pw = await promptPassword(
        t('Confirm transfer'),
        t('Type your password to confirm. You\'ll lose admin permissions immediately.'));
      if (!pw) return;
      const r = await api(`/api/admin/organizations/${org.id}/transfer-ownership`, {
        method: 'POST',
        headers: { 'X-Confirm-Password': pw },
        body: JSON.stringify({ to_user_id: toID }),
      });
      if (r.status === 204) {
        toastOk(t('Ownership transferred.'));
        close(true);
        await refreshMe();
        renderRoute();
      } else {
        toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
      }
    });
    body.append(form);
  });
}

async function confirmRemoveOrgMember(org, member) {
  // Owned-events warning: removing a member who created scheduled
  // / running / paused events orphans those — the events remain
  // in the org's list (the FK is created_by_user_id but its
  // ownership was cosmetic), but the audit trail loses the
  // creator and the original owner can't manage them anymore.
  // Surface the count so the operator can transfer ownership or
  // cancel events first.
  const owned = Number(member.active_events_owned || 0);
  if (owned > 0) {
    const proceed = await modal(t('Remove member with active events?'), ({ body, close }) => {
      body.append(
        h('p', {},
          t('{{username}} created {{n}} active event(s) in {{org}}.',
            { username: member.username, n: owned, org: org.name })),
        h('p', { class: 'muted', style: 'font-size:.9rem' },
          t('Those events will keep running but lose their original creator from the audit trail. Consider cancelling or finishing them first, or transferring ownership of the org to a different admin who can manage them after removal.')),
        h('div', { class: 'row end', style: 'margin-top:1rem; gap:.5rem' },
          h('button', { class: 'btn', on: { click: () => close(false) } }, t('Cancel')),
          h('button', { class: 'btn danger', on: { click: () => close(true) } }, t('Remove anyway'))));
    });
    if (!proceed) return;
  }
  const pw = await promptPassword(t('Remove {{username}}?', { username: member.username }),
    t('Removes {{username}} from {{org}}. Enter your password to confirm.', { username: member.username, org: org.name }));
  if (!pw) return;
  const r = await api(`/api/admin/organizations/${org.id}/members/${member.id}`, {
    method: 'DELETE', headers: { 'X-Confirm-Password': pw },
  });
  if (r.status === 204) { toastOk(t('Removed')); renderRoute(); }
  else toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
}

// confirmVerifyMemberEmail bypasses the self-serve email-verification
// flow on behalf of an arranger who couldn't receive (or never
// received) their verification mail. Plain confirm() is enough — the
// action is reversible by simply asking the arranger to log in and
// re-trigger the verification flow if it turns out to be wrong.
async function confirmVerifyMemberEmail(org, member) {
  if (!confirm(t('Manually verify {{username}}\'s email? Only do this after confirming the user out-of-band — this bypasses the verification mail loop.',
      { username: member.username }))) return;
  const r = await api(`/api/admin/users/${member.id}/verify-email`, { method: 'POST' });
  if (r.status === 204) { toastOk(t('Email verified')); renderRoute(); }
  else toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
}

async function openEditAssignment(org, assignment, adventures) {
  const used = !!assignment.event_id;
  await modal(t('Edit assignment · {{name}}', { name: org.name }), ({ body, close }) => {
    const advSel = h('select', { disabled: used ? '' : null },
      adventures.map((a) => h('option', {
        value: a.slug, selected: a.slug === assignment.adventure_slug ? '' : null,
      }, `${a.title} (${a.slug})`)));
    const count = h('input', {
      type: 'number', min: 1, step: 1, value: String(assignment.max_players), required: true,
    });
    const form = h('form', {},
      h('label', { class: 'field' },
        h('span', {}, used ? t('Adventure (locked — already used)') : t('Adventure')),
        advSel),
      h('label', { class: 'field' }, h('span', {}, t('Maximum players')), count),
      h('p', { class: 'muted', style: 'font-size:.8rem' },
        used
          ? t('Linked to event #{{id}}. You may raise the cap; lowering below the current player-slot count is rejected.', { id: assignment.event_id })
          : t('This assignment has not yet been used.')),
      h('div', { class: 'row between', style: 'margin-top:.5rem' },
        used
          ? h('span', {})
          : h('button', {
              class: 'btn danger', type: 'button',
              on: { click: async () => { close(null); await revokeAssignment(org.id, assignment.id); } },
            }, icon(ICONS.trash), t('Revoke')),
        h('div', { class: 'row' },
          h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, t('Cancel')),
          h('button', { class: 'btn primary', type: 'submit' }, t('Save')))));
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {};
      const newMax = parseInt(count.value, 10);
      if (!(newMax > 0)) { toastErr(t('Max players must be at least 1')); return; }
      if (newMax !== assignment.max_players) payload.max_players = newMax;
      if (!used && advSel.value !== assignment.adventure_slug) payload.adventure_slug = advSel.value;
      if (Object.keys(payload).length === 0) { close(null); return; }
      const r = await api(`/api/admin/organizations/${org.id}/assignments/${assignment.id}`, {
        method: 'PATCH', body: JSON.stringify(payload),
      });
      if (r.status === 200) { toastOk(t('Assignment updated')); close(true); renderRoute(); }
      else toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
    });
    body.append(form);
  });
}

async function openAssignAdventure(org, adventures) {
  if (adventures.length === 0) { toastErr(t('No adventures loaded')); return; }
  await modal(t('Assign adventure to {{name}}', { name: org.name }), ({ body, close }) => {

      h('option', { value: a.slug }, `${a.title} (${a.slug})`)));
    const count = h('input', { type: 'number', min: 1, step: 1, value: 20, required: true });
    const form = h('form', {},

      h('label', { class: 'field' }, h('span', {}, t('Maximum players')), count),
      h('p', { class: 'muted', style: 'font-size:.8rem' },

        h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, t('Cancel')),

// libraryTabs renders the Adventures|Puzzles strip shown at the top of
// both library sub-views. Clicking a tab navigates; the active tab
// reflects the current #section so the strip looks identical no
// matter which deep-link you landed on.
function libraryTabs(active) {
  const mk = (href, label, isActive) => {
    const a = h('a', {
      href,
      class: 'lib-tab' + (isActive ? ' active' : ''),
    }, label);
    return a;
  };
  return h('div', { class: 'lib-tabs' },
    mk('#library',  t('Adventures'), active === 'library'),
    mk('#puzzles',  t('Puzzles'),    active === 'puzzles'));
}

async function viewPuzzles(view) {
  const r = await api('/api/admin/puzzles');

        h('p', {}, t('No puzzles yet.')),

    list,

// pendingQuickPuzzleGPS is the in-flight GPS fix kicked off by a
// quickPuzzle tap. The puzzle itself is created without waiting, so
// the editor opens immediately; when the fix eventually arrives, the
// matching editor applies it to the location — unless the author has
// set it manually in the meantime.
let pendingQuickPuzzleGPS = null; // { puzzleID, promise } | null

// quickPuzzle creates a stub via POST /api/admin/puzzles and navigates
// to the new puzzle's editor without waiting on GPS. A location fix is
// requested in the background and applied by the editor if one arrives
// before the author sets a location manually. Designed for the
// "standing somewhere, want to remember this spot" flow — one tap
// after the page is already loaded.
async function quickPuzzle(ev) {
  const btn = ev?.currentTarget;
  if (btn) btn.disabled = true;
  const gpsPromise = navigator.geolocation
    ? new Promise((resolve) => {
        navigator.geolocation.getCurrentPosition(
          (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
          () => resolve(null),
          { enableHighAccuracy: true, maximumAge: 10000, timeout: 30000 },
        );
      })
    : Promise.resolve(null);
  const r = await api('/api/admin/puzzles', {
    method: 'POST',
    body: JSON.stringify({}),
  });
  if (btn) btn.disabled = false;
  if (r.status !== 201) { toastErr(r.body?.error || t('error {{status}}', { status: r.status })); return; }
  toastOk(t('Puzzle captured'));
  pendingQuickPuzzleGPS = { puzzleID: r.body.id, promise: gpsPromise };
  nav('#puzzles/' + r.body.id);
}

function renderPuzzleLibraryCard(p) {
  const assignment = p.adventure_slug
    ? h('span', { class: 'pill accent', title: t('Assigned to adventure') },
        `${p.adventure_title} · #${(p.adventure_idx ?? 0) + 1}`)
    : h('span', { class: 'pill' }, t('library'));
  const subtitle = p.notes
    ? h('p', { class: 'muted', style: 'font-style:italic' }, p.notes)
    : p.prompt_html
      ? h('div', { class: 'md-preview compact muted', style: 'max-height:4.5em; overflow:hidden', html: p.prompt_html })
      : h('p', { class: 'muted' }, t('(no content yet)'));
  return h('div', {
    class: 'card clickable' + (p.disabled ? '' : ''),
    style: p.disabled ? 'opacity:.6' : '',
    on: { click: () => nav('#puzzles/' + p.id) },
  },
    h('div', { class: 'row between' },
      h('h3', {}, p.title || t('(untitled)')),
      h('div', { class: 'row' },
        p.disabled ? h('span', { class: 'pill' }, t('disabled')) : null,
        p.gated ? h('span', { class: 'pill warning' }, t('gated')) : null,
        assignment)),
    subtitle,
    h('p', { class: 'muted mono', style: 'font-size:.8rem' },
      `${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}`,
      p.radius_m ? t(' · gate {{r}} m', { r: p.radius_m }) : '',
      p.has_images ? t(' · has images') : ''),
  );
}

// viewPuzzleEditRoute supports deep-linking #puzzles/<id> straight into
// the editor. For an attached puzzle we also fetch the parent adventure
// so the timeline can render the siblings; for a library puzzle we pass
// adv=null and the editor renders in standalone mode.
//
// The Puzzles library is painted behind the modal so that when the
// editor closes (Cancel, backdrop click, Esc) the user lands on the
// list instead of a blank placeholder view.
async function viewPuzzleEditRoute(view, pageID) {
  await viewPuzzles(view);
  const r = await api('/api/admin/puzzles/' + encodeURIComponent(pageID));
  if (r.status !== 200) {
    toastErr(r.body?.error || t('puzzle not found'));
    return;
  }
  const page = r.body;
  let adv = null;
  if (page.adventure_slug) {
    const er = await api('/api/admin/adventures/' + encodeURIComponent(page.adventure_slug) + '/edit');
    if (er.ok) {
      adv = er.body;
      // Use the authoritative copy from the adventure so the editor
      // and timeline agree on sibling page identities.
      const fresh = adv.pages.find((pp) => pp.id === page.id);
      if (fresh) Object.assign(page, fresh);
    }
  }
  openEditPuzzle(adv, page);
}

// colorRow builds a labelled row with a type=color picker, a "use default"
// reset button, and a live text readout. Empty initial means "use the
// default theme" — the picker renders greyed so admins see the field is
// unset. get() returns "" (use default) or "#rrggbb".
function colorRow(label, initial) {
  const state = { value: initial || '' };
  const picker = h('input', { type: 'color', value: initial || '#808080' });
  const reset  = h('button', { class: 'btn small', type: 'button', title: t('Use default') }, t('Reset'));
  const show   = h('span', { class: 'muted mono', style: 'font-size:.8rem' },
    initial ? initial : t('(default)'));
  const refresh = () => {
    show.textContent = state.value || t('(default)');
    picker.style.opacity = state.value ? '1' : '.45';
  };
  picker.addEventListener('input', () => { state.value = picker.value; refresh(); });
  reset.addEventListener('click',  () => { state.value = ''; refresh(); });
  refresh();
  return {
    el: h('label', { class: 'field' },
      h('span', {}, label),
      h('div', { class: 'row', style: 'gap:.5rem; align-items:center' }, picker, reset, show)),
    get: () => state.value,
  };
}

async function openCreateAdventure() {
  await modal(t('New adventure'), ({ body, close, setBeforeClose }) => {
    const slug  = h('input', { required: true, placeholder: 'my-adventure', pattern: '[a-z0-9-]+' });
    const slugHint = h('small', { class: 'muted', style: 'display:block; margin-top:.2rem' }, '');
    const title = h('input', { required: true });
    const desc  = h('textarea', { rows: 2 });
    const author = h('input', {});
    const cAccent    = colorRow(t('Accent — buttons, progress'),      '');
    const cSecondary = colorRow(t('Secondary — titles, status pill'), '');
    const cBackground = colorRow(t('Background'),                     '');
    const cText      = colorRow(t('Text'),                            '');
    const cSubmitBg  = colorRow(t('Submit dock — answer bar at the bottom'), '');
    // Live slug validator: keeps the author from discovering at submit
    // time that "My-Adventure" isn't a legal slug. Echoes a small hint
    // beside the field as they type.
    const validateSlug = () => {
      const v = slug.value;
      if (!v) { slugHint.textContent = ''; slugHint.className = 'muted'; return; }
      if (/^[a-z0-9-]+$/.test(v)) {
        slugHint.textContent = '✓ ' + t('Looks good.');
        slugHint.className = 'ok';
      } else {
        slugHint.textContent = t('Lowercase a–z, digits, and hyphens only.');
        slugHint.className = 'err';
      }
    };
    slug.addEventListener('input', validateSlug);
    const form = h('form', {},
      h('label', { class: 'field' },
        h('span', {}, t('Slug — lowercase letters, digits, hyphens')), slug, slugHint),
      h('label', { class: 'field' }, h('span', {}, t('Title')), title),
      h('label', { class: 'field' }, h('span', {}, t('Description')), desc),
      h('label', { class: 'field' }, h('span', {}, t('Author')), author),
      h('h3', { style: 'margin-top:1rem' }, t('Brand colours (optional)')),
      cAccent.el, cSecondary.el, cBackground.el, cText.el, cSubmitBg.el,
      h('div', { class: 'row end' },
        h('button', { class: 'btn', type: 'button', on: { click: () => close(null) } }, t('Cancel')),
        h('button', { class: 'btn primary', type: 'submit' }, t('Create'))));
    // Dirty-check guard: backdrop click / Escape would otherwise lose
    // a half-typed adventure spec. We treat any non-empty input field
    // as dirty since blank-on-create is the common abandoned state.
    if (typeof setBeforeClose === 'function') {
      setBeforeClose(() => {
        const dirty = !!(slug.value || title.value || desc.value || author.value
          || cAccent.get() || cSecondary.get() || cBackground.get() || cText.get() || cSubmitBg.get());
        return !dirty || confirm(t('Discard this adventure?'));
      });
    }
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const r = await api('/api/admin/adventures', {
        method: 'POST', body: JSON.stringify({
          slug: slug.value.trim(), title: title.value.trim(),
          description: desc.value, author: author.value.trim(),
          accent_color:           cAccent.get(),
          accent_secondary_color: cSecondary.get(),
          background_color:       cBackground.get(),
          text_color:             cText.get(),
          submit_bg_color:        cSubmitBg.get(),
        }),
      });
      if (r.status === 201) { toastOk(t('Adventure created')); close(true); nav('#library/' + r.body.slug); }
      else toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
    });
    body.append(form);
  });
}

async function viewLibraryEdit(view, slug) {
  const r = await api('/api/admin/adventures/' + encodeURIComponent(slug) + '/edit');
  if (!r.ok) {
    view.replaceChildren(h('p', { class: 'err' }, r.body?.error || t('not found')));
    return;
  }
  const adv = r.body;
  renderLibraryEdit(view, adv);
}

function renderLibraryEdit(view, adv) {
  // Enabled index differs from adv.pages index once any puzzle is
  // disabled — the preview endpoint matches the player's view and
  // skips disabled pages, so we thread the enabled position to each
  // card's Preview button.
  let enabledIdx = 0;
  // List container; cards are appended below. Keeping the variable
  // here lets the drag handlers query it for drop-hint cleanup
  // without searching the whole DOM.
  const list = h('div', { class: 'puzzle-list' });
  const cards = adv.pages.map((p, i) => {
    const previewIdx = p.disabled ? null : enabledIdx;
    if (!p.disabled) enabledIdx++;
    return renderPuzzleCard(p, i, { mode: 'edit', adv, previewIdx });
  });
  cards.forEach((c) => list.append(c));

  // Drag-and-drop reorder. Live-shuffle: as the cursor crosses a
  // sibling's vertical midpoint we splice the dragged card to that
  // position in the DOM. Other cards reflow to fill, giving the
  // arranger a real preview of the final layout instead of an
  // abstract "drop hint" line. State is closure-scoped so a single
  // in-flight drag is shared across all cards.
  let dragFrom = -1; // original index, captured at dragstart
  let dragEl = null; // the card being dragged
  const indexOfCard = (card) => Array.from(list.children).indexOf(card);
  // moveOver places dragEl before/after `target` based on which half
  // of the target the cursor (clientY) is over. The midpoint gives
  // natural hysteresis: once dragEl crosses target's midpoint it
  // stays past it until the cursor crosses back the other way, so
  // small cursor jitter near a boundary doesn't oscillate. Tried
  // entry-based and central-zone variants — both flickered with
  // variable card heights. Midpoint + FLIP animation is what every
  // shipping reorder UI (Linear, Notion, Trello) uses.
  //
  // No-op when already in the desired slot, so dragover firing many
  // times stays cheap.
  //
  // FLIP animation: capture sibling rects pre-mutation, do the DOM
  // splice, then translate each moved sibling back to its old
  // position and animate the transform to 0. The dragged card itself
  // is excluded — it'd fight the browser's drag image, which is
  // already following the cursor.
  const moveOver = (target, clientY) => {
    if (!dragEl || target === dragEl) return;
    const rect = target.getBoundingClientRect();
    const before = (clientY - rect.top) < rect.height / 2;
    const desiredBefore = before ? target : target.nextSibling;
    if (dragEl.nextSibling === desiredBefore) return; // already in slot

    const siblings = Array.from(list.children).filter((el) => el !== dragEl);
    const firstRects = new Map();
    for (const el of siblings) firstRects.set(el, el.getBoundingClientRect());

    list.insertBefore(dragEl, desiredBefore);

    for (const el of siblings) {
      const old = firstRects.get(el);
      const now = el.getBoundingClientRect();
      const dy = old.top - now.top;
      if (dy === 0) continue;
      el.style.transition = 'none';
      el.style.transform = `translateY(${dy}px)`;
      // Force a reflow so the next transition runs from the inverted
      // start, not from the natural 0 (otherwise the browser folds
      // the two style mutations into one frame and skips the anim).
      void el.offsetHeight;
      el.style.transition = 'transform 0.18s ease';
      el.style.transform = '';
    }
  };
  const commitReorder = async () => {
    if (!dragEl || dragFrom < 0) return;
    const finalPos = indexOfCard(dragEl);
    dragEl.classList.remove('drag-ghost');
    const fromPos = dragFrom;
    dragFrom = -1;
    dragEl = null;
    if (finalPos === fromPos || finalPos < 0) return;
    // Optimistically reflect the new order on the data side; the
    // server is told via the reorder endpoint, and we re-render at
    // the end so the per-card position numbers ("1.", "2.", …)
    // refresh.
    const next = adv.pages.slice();
    const [moved] = next.splice(fromPos, 1);
    next.splice(finalPos, 0, moved);
    const r = await api(`/api/admin/adventures/${encodeURIComponent(adv.slug)}/pages/reorder`, {
      method: 'PATCH', body: JSON.stringify({ page_ids: next.map((p) => p.id) }),
    });
    if (r.status !== 204) {
      toastErr(r.body?.error || t('error {{status}}', { status: r.status }));
      // Server rejected — re-render from the unchanged adv.pages so
      // the DOM snaps back to the authoritative order.
      renderLibraryEdit(view, adv);
      return;
    }
    adv.pages = next.map((p, i) => ({ ...p, index: i }));
    renderLibraryEdit(view, adv);
  };
  cards.forEach((card, i) => wirePuzzleDrag(card, i,
    () => dragFrom, (from, el) => { dragFrom = from; dragEl = el; },
    moveOver, commitReorder,
    () => { if (dragEl) { dragEl.classList.remove('drag-ghost'); } dragFrom = -1; dragEl = null; },
  ));

  const hasEnabled = enabledIdx > 0;
  // .filter(Boolean) drops null/undefined ternary branches. Native
  // `replaceChildren` coerces non-Node args to strings — without the
  // filter the literal text "null" leaked in above the puzzle list
  // for non-admin viewers (the renderAdventureShares branch).
  view.replaceChildren(...[
    h('button', { class: 'btn ghost small', on: { click: () => nav(state.me.role === 'admin' ? '#library' : '#adventures') } },
      icon(ICONS.back), t('Back')),
    // Identity block: cover + title + status pill. Actions used to ride
    // alongside in a flex row, which on narrow viewports squeezed the
    // title against the buttons and forced unlabeled icons to carry the
    // load. Splitting identity from actions makes the "what is this"
    // read clean and gives each action a real text label below.
    h('div', { class: 'row', style: 'gap:1rem; align-items:center' },
      adventureCover(adv, 80),
      h('div', { style: 'min-width:0' },
        h('h1', { style: 'margin:0' }, adv.title),
        // Draft / Published only signals something on admin-owned (global
        // catalog) adventures. For org-owned ones the flag has no
        // visibility effect, so don't surface a misleading status pill.
        adv.org_id ? null
          : (adv.published === false
              ? h('span', { class: 'pill warning', style: 'margin-top:.35rem' }, '✎ ' + t('Draft'))
              : h('span', { class: 'pill success', style: 'margin-top:.35rem' }, '✓ ' + t('Published'))))),
    h('p', { class: 'muted mono' }, adv.slug, adv.author ? ` · ${adv.author}` : ''),
    adv.description ? h('p', { class: 'muted' }, adv.description) : null,
    h('div', { class: 'row', style: 'flex-wrap:wrap; gap:.5rem' },
      hasEnabled
        ? h('button', { class: 'btn small',
            title: t('Open the adventure in the player view'),
            on: { click: () => previewAdventure(adv.slug, 0, false) } },
            icon(ICONS.eye), t('Preview'))
        : null,
      // Publish/Unpublish toggles cross-org catalog visibility — but
      // the visibility query only consults `published` for admin-owned
      // (org_id IS NULL) rows. For org-owned adventures the flag is a
      // no-op, so hide the affordance instead of advertising an
      // action that does nothing.
      !adv.org_id && (adv.published
        ? h('button', { class: 'btn small',
            title: t('Hide from the Catalog'),
            on: { click: () => togglePublished(adv, false) } },
            icon(ICONS.globe), t('Unpublish'))
        : h('button', { class: 'btn small primary',
            title: t('Make available in the Catalog'),
            on: { click: () => togglePublished(adv, true) } },
            icon(ICONS.globe), t('Publish'))),
      h('button', { class: 'btn small',
        title: t('Edit title/slug/colours'),
        on: { click: () => openEditAdventureMeta(adv) } },
        icon(ICONS.pencil), t('Edit')),
      h('button', { class: 'btn icon small danger',
        title: t('Delete adventure'),
        'aria-label': t('Delete adventure'),
        on: { click: () => confirmDeleteAdventure(adv) } },
        icon(ICONS.trash))),
    state.me.role === 'admin' ? renderAdventureShares(adv) : null,
    h('div', { class: 'row between', style: 'margin-top:1rem' },
      h('h2', {}, t('Puzzles ({{n}})', { n: adv.pages.length })),
