<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- connect-src https: lets the vector map reach its style host; the server's
     Content-Security-Policy header narrows it to the configured map hosts. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' wss: ws: https:; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'">
<title>{{SITE_NAME}} | Recap</title>
<meta name="application-name" content="{{SITE_NAME}}">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<!-- Public-by-token. The recap is shared into chat apps and social
     networks, so the OG card stays generic — team data is rendered
     client-side and absent from the static body. -->
<meta property="og:title" content="{{SITE_NAME}} | Event Recap">
<meta property="og:description" content="A team's adventure recap on {{SITE_NAME}}.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<!-- Robots noindex on the page itself too. The HTTP handler also
     emits X-Robots-Tag on the JSON, but the meta tag covers
     crawlers that fetch HTML without setting Accept correctly. -->
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/assets/fontface.css">
<script src="/assets/map-config.js"></script>
<script src="/i18n.js"></script>
<style>
:root, :root[data-tone="light"] {
  --accent:       #ad1357;
  --accent-fg:    #ffffff;
  --ink:          #0b1220;
  --muted:        #4f6478;
  --bg:           #fafbfc;
  --surface:      #ffffff;
  --surface-2:    #f0f2f6;
  --border:       #d8dde6;
  --border-soft:  #e8eaf0;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink:         #e6ebf5;
    --muted:       #8b94a8;
    --bg:          #0b1220;
    --surface:     #131c2e;
    --surface-2:   #1b2640;
    --border:      #2a3550;
    --border-soft: #1f2940;
  }
}
/* A look with a page colour of its own picks the light or dark palette
   by that colour (data-tone, set by applyColors), whatever the system's
   scheme, so cards and text stay readable on it. */
:root[data-tone="dark"] {
  --ink: #e6ebf5; --muted: #8b94a8; --surface: #131c2e; --surface-2: #1b2640;
  --border: #2a3550; --border-soft: #1f2940;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Open Sans', 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', system-ui, -apple-system, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.5;
  min-height: 100vh;
  /* The look's two colours, as a band across the top. */
  border-top: 4px solid var(--accent); border-image: linear-gradient(90deg, var(--accent), var(--accent-2, var(--accent))) 1;
}
.wrap { max-width: 48rem; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
.brand {
  display: flex; align-items: baseline; gap: .35rem;
  font-family: 'Aclonica', sans-serif; font-size: 1.1rem;
  color: var(--accent); margin-bottom: 1rem;
}
.brand small {
  font-family: 'Open Sans', 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif; font-size: .7rem;
  color: var(--muted); font-weight: 600; text-transform: lowercase;
}
/* The look's cover picture, above the title. */
.cover {
  aspect-ratio: 16 / 7; margin: 0 0 1rem;
  border-radius: 16px; background: var(--surface-2) center / cover no-repeat;
  box-shadow: 0 8px 28px rgba(11, 18, 32, .14);
}
.head h1 {
  margin: 0 0 .25rem; font-size: 1.6rem; line-height: 1.2;
  font-family: var(--font-title, inherit);
}
.head .who {
  color: var(--muted); font-size: .95rem; margin-bottom: 1rem;
}
.receipt { margin: 1.5rem 0; padding: .6rem 1rem; border: 1px solid var(--border); border-radius: 12px; font-size: .9rem; }
.receipt summary:not(.bad) { color: var(--muted); }
.receipt summary { cursor: pointer; }
.receipt[open] summary { margin-bottom: .4rem; }
.receipt p { margin: .4rem 0; }
.receipt code { display: block; font-family: ui-monospace, monospace; font-size: .75rem; word-break: break-all; margin: .2rem 0 .5rem; }
.receipt .bad { color: #b3261e; font-weight: 600; }
.receipt .fp { color: var(--muted); font-size: .8rem; margin-bottom: 0; }
.receipt .btn.small { padding: .15rem .7rem; font-size: .75rem; margin-left: .3rem; }
.receipt .check { margin-top: .8rem; padding-top: .6rem; border-top: 1px solid var(--border); }
.receipt .check-row { display: flex; gap: .4rem; margin-top: .3rem; }
.receipt .check-row input { flex: 1; min-width: 0; font: .8rem ui-monospace, monospace; padding: .4rem .6rem;
  border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--ink); }
.receipt .check-out.ok { color: #1b6b43; }
.receipt .check-out.bad, .receipt p.bad { color: #b3261e; }
.outro {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: 12px; padding: 1rem 1.15rem; margin: 1rem 0 1.25rem;
  white-space: pre-wrap;
}
.stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: .55rem;
  margin: 0 0 1.25rem;
}
@media (min-width: 28rem) {
  .stats { grid-template-columns: repeat(4, 1fr); }
}
.stat {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: 10px;
  padding: .75rem .85rem;
  text-align: center;
}
.stat .v {
  font-size: 1.35rem; font-weight: 700; color: var(--accent);
  line-height: 1.1;
}
.stat .l {
  font-size: .75rem; color: var(--muted); text-transform: uppercase;
  letter-spacing: .04em; margin-top: .15rem;
}
/* Graph recap: the puzzles and stories the team reached, in the
   adventure's order. Same card surface as the stats above. */
.steps {
  list-style: none; margin: 0 0 1.25rem; padding: 0;
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: 12px;
}
.steps li {
  display: flex; align-items: baseline; gap: .6rem;
  padding: .55rem .85rem;
  border-top: 1px solid var(--border-soft);
}
.steps li:first-child { border-top: 0; }
.steps .mark { flex: 0 0 1.1rem; text-align: center; font-weight: 700; color: var(--accent); }
.steps .title { flex: 1 1 auto; min-width: 0; }
.steps .story .title, .steps .note { color: var(--muted); }
.steps .note { flex: 0 0 auto; font-size: .8rem; }
/* The team's approved photo challenges. */
.photos {
  display: grid; gap: .75rem; margin: 0 0 1.25rem;
  grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr));
}
.photos figure {
  margin: 0; background: var(--surface);
  border: 1px solid var(--border-soft); border-radius: 12px; overflow: hidden;
}
.photos img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.photos figcaption { padding: .45rem .65rem; font-size: .85rem; color: var(--muted); }
#map {
  width: 100%;
  height: 24rem;
  border-radius: 12px;
  border: 1px solid var(--border-soft);
  background: var(--surface-2);
}
/* Playback controls — sit directly under the map so the scrubber
   feels like part of the viewport rather than a detached widget. */
.playback {
  display: flex; align-items: center; gap: .65rem;
  margin-top: .65rem;
  padding: .5rem .65rem;
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: 10px;
}
.playback button.pp {
  /* WCAG 2.5.5: 44 px tap-target floor. Recap is shared into chat
     apps and opened on phones — 35 px was too small for outdoor /
     gloved use. */
  width: 2.75rem; height: 2.75rem;
  padding: 0;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--accent); color: var(--accent-fg);
  font-weight: 700; cursor: pointer; flex: 0 0 auto;
  display: inline-flex; align-items: center; justify-content: center;
}
.playback button.pp:disabled { opacity: .55; cursor: not-allowed; }
.playback input[type=range] {
  flex: 1 1 auto; min-width: 0; accent-color: var(--accent);
}
.playback .clock {
  font-variant-numeric: tabular-nums;
  font-size: .85rem; color: var(--muted); flex: 0 0 auto;
}
.actions {
  display: flex; gap: .5rem; flex-wrap: wrap;
  margin: 1rem 0 0;
}
.btn {
  appearance: none; -webkit-appearance: none;
  font: inherit; font-weight: 700;
  padding: .55rem 1rem; border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface); color: var(--ink);
  cursor: pointer;
}
.btn.primary {
  background: var(--accent); color: var(--accent-fg);
  border-color: var(--accent);
}
.btn:disabled { opacity: .55; cursor: not-allowed; }
.empty, .err {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--muted);
}
.err { color: #c0392b; }
.foot {
  margin-top: 2.5rem; padding-top: 1rem;
  border-top: 1px solid var(--border-soft);
  font-size: .8rem; color: var(--muted); text-align: center;
}
.foot a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="brand">{{SITE_WORDMARK}}<small id="brand-sub">recap</small></div>
  <div id="root">
    <p class="empty" id="loading">Loading…</p>
  </div>
  <div class="foot">
    <a href="/">{{SITE_NAME}}</a>
  </div>
</div>

<script>
/* Recap page — fetches the JSON document the public Recap handler
   serves, then renders stats + a Leaflet track. The page is
   read-only; no WebSocket, no slot session, no submit dock.
   Animation + scrubber land in a follow-up; this pass paints the
   static layout. */

// Read the share token out of the URL. The route is /recap/{token}
// so a single split() gets us the value without pulling in a router.
function recapToken() {
  const parts = location.pathname.split('/').filter(Boolean);
  return parts[parts.length - 1] || '';
}

const root = document.getElementById('root');
const t = (s, vars) => zvI18n.t(s, vars);
document.getElementById('brand-sub').textContent = t('Recap').toLocaleLowerCase();

function formatDistance(m) {
  if (!Number.isFinite(m) || m <= 0) return '—';
  if (m < 1000) {
    return new Intl.NumberFormat(undefined, { maximumFractionDigits: 0 })
      .format(Math.round(m)) + ' m';
  }
  const km = m / 1000;
  const digits = m >= 10000 ? 0 : 1;
  return new Intl.NumberFormat(undefined, {
    minimumFractionDigits: digits, maximumFractionDigits: digits,
  }).format(km) + ' km';
}
function formatDuration(sec) {
  if (!Number.isFinite(sec) || sec <= 0) return '—';
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  const pad = (n) => String(n).padStart(2, '0');
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v;
    else if (k === 'on') for (const [ev, fn] of Object.entries(v)) e.addEventListener(ev, fn);
    else if (k === 'html') e.innerHTML = v;
    else if (v != null) e.setAttribute(k, v);
  }
  for (const c of kids) {
    if (c == null) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}

// applyColors dresses the page in the adventure's look, as live.html
// does: accent (with readable text on it), second colour, page colour —
// which also picks the light or dark palette (data-tone) — and text.
function applyColors(c) {
  if (!c) return;
  const root = document.documentElement;
  const r = root.style;
  if (c.accent) {
    r.setProperty('--accent', c.accent);
    const L = luminance(c.accent);
    if (L != null) r.setProperty('--accent-fg', L > 0.179 ? '#000000' : '#ffffff');
  }
  if (c.accent_secondary || c.accent) r.setProperty('--accent-2', c.accent_secondary || c.accent);
  if (c.background) {
    const L = luminance(c.background);
    if (L != null) root.dataset.tone = L > 0.35 ? 'light' : 'dark';
    r.setProperty('--bg', c.background);
  }
  if (c.text) r.setProperty('--ink', c.text);
}

// applyLook shows the look's cover picture above the title and sets
// the title in its typeface.
function applyLook(look, head) {
  if (!look) return;
  if (look.cover_url) {
    const cover = el('div', { class: 'cover', 'aria-hidden': 'true' });
    cover.style.backgroundImage = 'url("' + encodeURI(look.cover_url) + '")';
    head.prepend(cover);
  }
  if (look.font_css) {
    document.head.append(el('link', { rel: 'stylesheet', href: look.font_css }));
    document.documentElement.style.setProperty('--font-title', '"' + look.heading_font + '", ' + "'Open Sans', sans-serif");
  }
}

// luminance is a #rrggbb / #rgb colour's WCAG relative luminance, null
// for anything else.
function luminance(hex) {
  let m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(hex).trim());
  if (!m) return null;
  let h = m[1];
  if (h.length === 3) h = h.split('').map((x) => x + x).join('');
  const n = parseInt(h, 16);
  const [r, g, b] = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => {
    const s = v / 255;
    return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}

async function load() {
  const tok = recapToken();
  if (!tok) {
    root.replaceChildren(el('p', { class: 'err' }, t('Recap link is missing — check the URL.')));
    return;
  }
  let data;
  try {
    const r = await fetch('/api/public/recap/' + encodeURIComponent(tok), { credentials: 'omit' });
    if (r.status === 404) {
      // Same shape whether the token is unknown or the team isn't
      // finished yet — server hides the distinction on purpose.
      root.replaceChildren(el('p', { class: 'empty' },
        t('This recap isn\'t available. Check the link — a recap appears once your team has finished.')));
      return;
    }
    if (!r.ok) {
      root.replaceChildren(el('p', { class: 'err' },
        t('Couldn\'t load this recap right now. Try again in a minute.')));
      return;
    }
    data = await r.json();
  } catch (e) {
    root.replaceChildren(el('p', { class: 'err' },
      t('Couldn\'t reach the server. Check your connection and reload.')));
    return;
  }
  render(data);
}

function statBox(value, label) {
  return el('div', { class: 'stat' },
    el('div', { class: 'v' }, value),
    el('div', { class: 'l' }, label));
}

// The team's receipt from the event's results record: the hash of its
// finish, which no one can change the results under without it showing.
// While it holds it stays a quiet, closed line at the foot of the recap —
// a team that never doubted its points shouldn't be told they're intact.
// Only a mismatch speaks up, opened and in red.
//
// The server's own word that it holds can't catch a record rewritten
// whole, hashes and all: it would hand out a new code and call it good.
// So this device keeps the first code it was shown, and a different one
// later is a mismatch; and a code saved anywhere else can be checked
// here against the record, which no longer holds a rewritten one.
function renderReceipt(d) {
  if (!d.receipt) return;
  const r = d.receipt;
  const key = 'zv-receipt:' + recapToken();
  let seen = null;
  try { seen = JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { /* no storage */ }
  if (!seen?.code) {
    seen = null;
    try { localStorage.setItem(key, JSON.stringify({ code: r.receipt, at: new Date().toISOString() })); } catch (e) { /* no storage */ }
  }
  const moved = !!seen && seen.code !== r.receipt;
  const ok = r.matches && !moved;
  const box = el('details', { class: 'receipt' + (ok ? '' : ' is-bad'), open: ok ? null : '' },
    el('summary', { class: ok ? '' : 'bad' },
      ok ? t('Receipt for your results') : t('Your results were changed after you finished')),
    el('p', {}, t('Proof that no one has changed your points or place afterwards. Save the code to check it later.')));
  if (moved) {
    box.append(el('p', { class: 'bad' },
      t('This device was shown a different code on {{date}}:', { date: new Date(seen.at).toLocaleDateString() })),
      el('code', {}, seen.code));
  }
  const copy = el('button', { class: 'btn small', type: 'button' }, t('Copy'));
  copy.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(r.receipt); copy.textContent = t('Copied!'); } catch (e) { /* select it by hand */ }
  });
  box.append(el('p', { class: 'fp' }, t('Your code'), ' ', navigator.clipboard?.writeText ? copy : null),
    el('code', {}, r.receipt));
  if (d.results_fingerprint) {
    box.append(el('p', { class: 'fp' }, t("The event's code")), el('code', {}, d.results_fingerprint));
  }
  box.append(checkForm());
  root.append(box);
}

// checkForm looks up a code saved earlier: the record still holds it,
// holds it no longer as it was, or doesn't hold it at all.
function checkForm() {
  const input = el('input', { type: 'text', spellcheck: 'false', autocomplete: 'off',
    placeholder: t('Paste a saved code'), 'aria-label': t('Check a saved code') });
  const out = el('p', { class: 'check-out', 'aria-live': 'polite' });
  const form = el('form', { class: 'check' },
    el('p', { class: 'fp' }, t('Check a saved code')),
    el('div', { class: 'check-row' }, input, el('button', { class: 'btn small', type: 'submit' }, t('Check'))),
    out);
  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const code = input.value.trim().toLowerCase();
    if (!/^[0-9a-f]{64}$/.test(code)) {
      out.className = 'check-out bad';
      out.textContent = t('A code is 64 letters and digits, 0–9 and a–f.');
      return;
    }
    out.className = 'check-out';
    out.textContent = t('Checking…');
    try {
      const res = await fetch('/api/public/results/' + code, { credentials: 'omit' });
      if (res.status === 404) {
        out.className = 'check-out bad';
        out.textContent = t('No results record holds this code. Either it was mistyped, the event was deleted, or the results were rewritten after it was given out.');
        return;
      }
      if (!res.ok) throw new Error(res.status);
      const h = await res.json();
      const who = [h.team_name, h.adventure_title].filter(Boolean).join(' · ');
      out.className = 'check-out ' + (h.matches ? 'ok' : 'bad');
      out.textContent = h.matches
        ? t('✓ This code holds: the results of {{who}} are as they were when the team finished.', { who })
        : t('The record holds this code, but the results of {{who}} were changed after the team finished.', { who });
    } catch (e) {
      out.className = 'check-out bad';
      out.textContent = t('Couldn\'t check the code right now. Try again in a minute.');
    }
  });
  return form;
}

function render(d) {
  applyColors(d.colors);
  root.replaceChildren();
  document.querySelector('.brand small').textContent = t('Recap');

  const head = el('div', { class: 'head' },
    el('h1', {}, d.adventure_title || t('Adventure')),
    el('div', { class: 'who' },
      [d.team_name, d.completed_at ? new Date(d.completed_at.replace(' ', 'T') + 'Z').toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short', hour12: false }) : '']
        .filter(Boolean).join(' · ')));
  applyLook(d.look, head);
  root.append(head);

  if (d.outro_text && d.outro_text.trim()) {
    // Server pre-renders the markdown via goldmark, so drop the HTML
    // straight into innerHTML.
    root.append(el('div', { class: 'outro', html: d.outro_text }));
  }

  renderGraphStats(d);
  renderPhotos(d);
  renderReceipt(d);

  // A game with nowhere on the map (a party's cards at home) has no map:
  // it would only show the map's default place.
  if (placed(d)) {
    const mapHost = el('div', { id: 'map' });
    root.append(mapHost);
    // Leaflet may not be ready yet on a slow network — defer one
    // frame so the script tag has a chance to evaluate.
    setTimeout(() => mountMap(mapHost, d), 0);
  }

  // Share button. Native share where available, clipboard fallback
  // otherwise. The share text leads with team + adventure so a
  // chat-app preview makes sense.
  if (navigator.share || navigator.clipboard?.writeText) {
    const url = location.href;
    const title = d.adventure_title || document.querySelector('meta[name="application-name"]').content;
    const text = (d.team_name ? d.team_name + ' — ' : '') + title;
    const shareBtn = el('button', { class: 'btn primary' }, t('Share this recap'));
    shareBtn.addEventListener('click', async () => {
      if (navigator.share) {
        try { await navigator.share({ title, text, url }); return; }
        catch (e) { if (e?.name === 'AbortError') return; }
      }
      if (navigator.clipboard?.writeText) {
        try {
          await navigator.clipboard.writeText(url);
          shareBtn.textContent = t('Copied!');
          shareBtn.disabled = true;
          setTimeout(() => {
            shareBtn.textContent = t('Share this recap');
            shareBtn.disabled = false;
          }, 1800);
          return;
        } catch {}
      }
      shareBtn.textContent = t('Sharing not available');
      shareBtn.disabled = true;
    });
    root.append(el('div', { class: 'actions' }, shareBtn));
  }
}

// renderGraphStats is the stats row and step list: the team's points
// and place, then every puzzle and story it reached.
function renderGraphStats(d) {
  const points = Number.isFinite(d.points)
    ? new Intl.NumberFormat(undefined, { maximumFractionDigits: 1 }).format(d.points)
    : '—';
  const rank = d.rank ? t('{{rank}} of {{n}}', { rank: d.rank, n: d.team_count }) : '—';
  // Time, points and place are for a game, not a walk, a party or one
  // played at home.
  const boxes = d.race ? [
    statBox(formatDuration(d.duration_seconds), t('Time')),
    statBox(points,                             t('Points')),
    statBox(rank,                               t('Rank')),
  ] : [];
  // No walk to measure (no track, or a game played at home): no Distance.
  if (d.distance_m > 0) boxes.splice(1, 0, statBox(formatDistance(d.distance_m), t('Distance')));
  if (d.quiz) boxes.push(statBox(d.quiz.right + '/' + d.quiz.total, t('Quiz')));
  if (boxes.length) root.append(el('div', { class: 'stats' }, ...boxes));
  if (d.outcome === 'fail') {
    root.querySelector('.head .who').append(' · ' + t('Did not finish'));
  }
  if (!(d.steps || []).length) return;
  const list = el('ol', { class: 'steps' });
  for (const s of d.steps) {
    // A story that asked quiz questions is ticked like a puzzle.
    const puzzle = s.kind === 'puzzle' || s.quiz;
    const misses = s.attempts === 1 ? t('1 miss')
      : s.attempts > 1 ? t('{{n}} misses', { n: s.attempts }) : '';
    list.append(el('li', { class: puzzle ? 'puzzle' : 'story' },
      el('span', { class: 'mark', 'aria-hidden': 'true' }, puzzle ? (s.solved ? '✓' : '○') : '·'),
      el('span', { class: 'title' }, (s.title || s.node) + (puzzle && !s.solved ? ' (' + t('not solved') + ')' : '')),
      misses ? el('span', { class: 'note' }, misses) : null));
  }
  root.append(list);
}

// renderPhotos shows the team's approved photo challenges, each served
// behind the same recap token as the page.
function renderPhotos(d) {
  if (!(d.photos || []).length) return;
  const tok = encodeURIComponent(recapToken());
  root.append(el('div', { class: 'photos' }, ...d.photos.map((p) =>
    el('figure', {},
      el('img', { src: '/api/public/recap/' + tok + '/photos/' + p.id, alt: p.prompt || t('Team photo'), loading: 'lazy' }),
      el('figcaption', {}, p.step || p.prompt || '')))));
}

// placed is whether the recap has anything to put on a map: a track,
// or a zone with a place.
function placed(d) {
  return (d.track || []).length > 0 || (d.zones || []).some((z) =>
    (z.polygon || []).length >= 3 || (Number.isFinite(z.lat) && Number.isFinite(z.lng) && !(z.lat === 0 && z.lng === 0)));
}

// mountMap draws the team's day on a vector map: its track, the zones
// (filled once a step there was done, hollow otherwise, so the team sees
// how far it got) and the playback under it. Ctrl or ⌘ with the wheel
// zooms, two fingers move it; the page scrolls past it otherwise.
async function mountMap(host, d) {
  let zvm, ml;
  try {
    zvm = await import('/assets/zv-maplibre.js');
    ml = await zvm.loadMapLibre();
  } catch (e) {
    console.warn('recap map unavailable', e);
    host.remove();
    return;
  }
  const accent = getComputedStyle(document.documentElement)
    .getPropertyValue('--accent').trim() || '#ad1357';

  const track = (d.track || []).map((p) => [p.lng, p.lat]);
  const zoneFeatures = [];
  const zonePoints = [];
  for (const z of (d.zones || [])) {
    const props = {
      solved: !!z.solved,
      label: (z.title || z.name || z.slug) + (z.solved ? '' : ' (' + t('not solved') + ')'),
    };
    if ((z.polygon || []).length >= 3) {
      const ring = z.polygon.map(([lat, lng]) => [lng, lat]);
      ring.push(ring[0]);
      zoneFeatures.push({ type: 'Feature', properties: props, geometry: { type: 'Polygon', coordinates: [ring] } });
      zonePoints.push(...ring);
      continue;
    }
    if (!Number.isFinite(z.lat) || !Number.isFinite(z.lng)) continue;
    if (z.lat === 0 && z.lng === 0) continue;
    zoneFeatures.push({ type: 'Feature', properties: props, geometry: { type: 'Point', coordinates: [z.lng, z.lat] } });
    zonePoints.push([z.lng, z.lat]);
  }

  const map = new ml.Map({
    container: host,
    style: zvm.mapStyle(),
    center: [18.0686, 59.3293],
    zoom: 13,
    cooperativeGestures: true,
    locale: zvm.gestureLocale(t('Use {{key}} + scroll to zoom the map', { key: '{key}' }), t('Use two fingers to move the map')),
    attributionControl: { compact: true },
  });
  map.addControl(new ml.NavigationControl({ showCompass: false }), 'top-right');
  // Fit the track and the zones, else stay on the Stockholm default so
  // the map never lands on the ocean.
  const all = track.concat(zonePoints);
  if (all.length) {
    const bounds = all.reduce((b, p) => b.extend(p), new ml.LngLatBounds(all[0], all[0]));
    map.fitBounds(bounds, { padding: 24, maxZoom: 17, duration: 0 });
  }

  map.on('load', () => {
    if (track.length >= 2) {
      map.addSource('track', { type: 'geojson', data: { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: track } } });
      map.addLayer({ id: 'track', type: 'line', source: 'track', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': accent, 'line-width': 4, 'line-opacity': 0.85 } });
    }
    map.addSource('zones', { type: 'geojson', data: { type: 'FeatureCollection', features: zoneFeatures } });
    map.addLayer({ id: 'zones-fill', type: 'fill', source: 'zones', filter: ['==', ['geometry-type'], 'Polygon'], paint: { 'fill-color': accent, 'fill-opacity': ['case', ['get', 'solved'], 0.35, 0] } });
    map.addLayer({ id: 'zones-line', type: 'line', source: 'zones', filter: ['==', ['geometry-type'], 'Polygon'], paint: { 'line-color': accent, 'line-width': 2 } });
    map.addLayer({ id: 'zones-pt', type: 'circle', source: 'zones', filter: ['==', ['geometry-type'], 'Point'], paint: { 'circle-radius': 7, 'circle-color': accent, 'circle-opacity': ['case', ['get', 'solved'], 1, 0], 'circle-stroke-color': accent, 'circle-stroke-width': 2 } });
    // A zone's name on hover, as a tooltip.
    const tip = new ml.Popup({ closeButton: false, closeOnClick: false, offset: 10 });
    for (const id of ['zones-fill', 'zones-pt']) {
      map.on('mousemove', id, (e) => {
        map.getCanvas().style.cursor = 'pointer';
        tip.setLngLat(e.lngLat).setText(e.features[0].properties.label).addTo(map);
      });
      map.on('mouseleave', id, () => { map.getCanvas().style.cursor = ''; tip.remove(); });
    }
    mountPlayback(host, map, d, accent);
  });
}

// parseTs accepts the wire formats the server emits:
//   "YYYY-MM-DD HH:MM:SS"  (UTC, space-separated)
//   "2026-04-29T12:34:56Z" (RFC3339)
// Returns epoch ms; 0 on parse failure so callers can detect bad
// timestamps without an explicit error path.
function parseTs(s) {
  if (!s) return 0;
  const iso = s.includes('T') ? s : s.replace(' ', 'T') + 'Z';
  const t = Date.parse(iso);
  return Number.isFinite(t) ? t : 0;
}

// mountPlayback inserts the play/pause + scrubber + clock controls
// directly under the map and animates a marker along the track at
// 60× real-time. Auto-plays on first paint; reaching the end
// flips the button to "Replay" so a second viewing is one tap
// away. No-ops when there's no track or no measurable duration —
// a /forget'd team's recap still shows stats + puzzle pins.
const PLAYBACK_SPEED = 60; // real-time-seconds per playback-second

function mountPlayback(mapHost, map, d, accent) {
  const points = (d.track || []).slice();
  if (points.length < 2) return;
  const t0 = parseTs(points[0].ts);
  const tN = parseTs(points[points.length - 1].ts);
  const totalMs = Math.max(0, tN - t0);
  if (totalMs <= 0) return;

  // Trail layer — the line of *covered* track from start to playhead.
  // Drawn over the full track so the part already walked stands out.
  // Updated every frame as the playhead moves; the head dot on top.
  const line = (pts) => ({ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: pts.map(([lat, lng]) => [lng, lat]) } });
  const dot = ([lat, lng]) => ({ type: 'Feature', properties: {}, geometry: { type: 'Point', coordinates: [lng, lat] } });
  map.addSource('trail', { type: 'geojson', data: line([[points[0].lat, points[0].lng]]) });
  map.addLayer({ id: 'trail', type: 'line', source: 'trail', layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': accent, 'line-width': 6 } });
  map.addSource('head', { type: 'geojson', data: dot([points[0].lat, points[0].lng]) });
  map.addLayer({ id: 'head', type: 'circle', source: 'head', paint: { 'circle-radius': 9, 'circle-color': accent, 'circle-stroke-color': '#ffffff', 'circle-stroke-width': 2 } });
  const trail = { setLatLngs: (pts) => map.getSource('trail').setData(line(pts)) };
  const marker = { setLatLng: (p) => map.getSource('head').setData(dot(p)) };

  const playBtn = el('button', { class: 'pp', type: 'button',
    'aria-label': t('Pause') }, '❚❚');
  const slider = el('input', { type: 'range', min: '0',
    max: String(totalMs), value: '0', step: '1' });
  const clock = el('span', { class: 'clock' }, formatDuration(0));
  const controls = el('div', { class: 'playback' }, playBtn, slider, clock);
  mapHost.parentNode.insertBefore(controls, mapHost.nextSibling);

  // positionAt walks the track linearly until it finds the segment
  // containing the target offset, then linearly interpolates lat/lng.
  // Tracks in this product run hundreds of points at most, so a
  // linear scan beats binary-search bookkeeping for code clarity.
  function positionAt(ms) {
    const target = t0 + ms;
    let lastIdx = 0;
    for (let i = 1; i < points.length; i++) {
      const a = parseTs(points[i - 1].ts);
      const b = parseTs(points[i].ts);
      if (target <= b) {
        const span = Math.max(1, b - a);
        const f = Math.max(0, Math.min(1, (target - a) / span));
        const lat = points[i - 1].lat + (points[i].lat - points[i - 1].lat) * f;
        const lng = points[i - 1].lng + (points[i].lng - points[i - 1].lng) * f;
        return { lat, lng, idx: i - 1 };
      }
      lastIdx = i;
    }
    return { lat: points[lastIdx].lat, lng: points[lastIdx].lng, idx: lastIdx };
  }

  let playheadMs = 0;
  let lastFrameAt = 0;
  // Auto-play unless the user has asked the OS for reduced motion —
  // then we land paused at the END of the track (full trail visible)
  // and the player can press Play to scrub. Same value WCAG asks
  // for: no animation runs without explicit user intent.
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let playing = !reducedMotion;
  let rafId = 0;

  function rebuildTrail(uptoIdx, head) {
    const pts = [];
    for (let i = 0; i <= uptoIdx; i++) pts.push([points[i].lat, points[i].lng]);
    pts.push([head.lat, head.lng]);
    trail.setLatLngs(pts);
  }

  function setPlayhead(ms, fromSlider) {
    playheadMs = Math.max(0, Math.min(totalMs, ms));
    if (!fromSlider) slider.value = String(playheadMs);
    const head = positionAt(playheadMs);
    marker.setLatLng([head.lat, head.lng]);
    rebuildTrail(head.idx, head);
    clock.textContent = formatDuration(Math.floor(playheadMs / 1000));
  }

  function tick(now) {
    if (!playing) { rafId = 0; return; }
    if (lastFrameAt) {
      const dt = (now - lastFrameAt) * PLAYBACK_SPEED;
      setPlayhead(playheadMs + dt, false);
    }
    lastFrameAt = now;
    if (playheadMs >= totalMs) {
      playing = false;
      playBtn.textContent = '↻';
      playBtn.setAttribute('aria-label', t('Replay'));
      rafId = 0;
      return;
    }
    rafId = requestAnimationFrame(tick);
  }

  playBtn.addEventListener('click', () => {
    if (!playing && playheadMs >= totalMs) {
      // Replay: rewind, then start.
      setPlayhead(0, false);
    }
    playing = !playing;
    if (playing) {
      playBtn.textContent = '❚❚';
      playBtn.setAttribute('aria-label', t('Pause'));
      lastFrameAt = 0;
      rafId = requestAnimationFrame(tick);
    } else {
      // Cancel the pending frame so a quick pause→play doesn't leave
      // two tick loops running (double-speed playback).
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      playBtn.textContent = '▶';
      playBtn.setAttribute('aria-label', t('Play'));
    }
  });

  slider.addEventListener('input', () => {
    setPlayhead(parseFloat(slider.value), true);
    // Resume auto-tick from the new position without skipping
    // forward by one frame's worth of accumulated delta.
    lastFrameAt = 0;
  });

  if (reducedMotion) {
    // Land at the end of the track with the full trail rendered, so
    // a vestibular-sensitive viewer sees the same final shape an
    // auto-played viewer would arrive at — without the motion. The
    // play button still works for an opt-in scrub.
    setPlayhead(totalMs, false);
    playBtn.textContent = '▶';
    playBtn.setAttribute('aria-label', t('Play'));
  } else {
    // Auto-play on first paint — the page is shown specifically to
    // watch the team's day, paused-at-start would be a stale
    // skeumorphism from desktop video players.
    rafId = requestAnimationFrame(tick);
  }
}

load();
</script>
</body>
</html>
