# Production overlay: run the image CI publishes to ghcr.io for each
# release tag instead of building on this host. Nothing is compiled
# here, so a small droplet is enough.
#
# Enable it once in .env (list compose.override.yaml too if you use it;
# COMPOSE_FILE replaces the automatic override merge):
#
#   COMPOSE_FILE=compose.yaml:compose.override.yaml:compose.prod.yaml
#
# `make upgrade` then pulls the newest tag and pins it as VERSION in
# .env, so a bare `docker compose up -d` keeps running it. Without that
# line it would run :latest as last pulled on this host, which may be
# far older than the newest release.
services:
  app:
    image: ghcr.io/klahr/zonventure:${VERSION:-latest}
