<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ad1357" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/app/play/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/app/play/apple-touch-icon.png" />
    <title>Zonventure</title>
    <script>
      // Applied before first paint so a dark-mode user never sees a
      // white flash. Mirrors the mechanism in zv-web/landing.html and
      // page-tokens.css: an explicit [data-theme] wins, otherwise the
      // OS preference decides. Inline and synchronous by necessity —
      // this is the one script the CSP allows by hash.
      (function () {
        try {
          var t = localStorage.getItem("zv-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.dataset.theme = t;
          }
        } catch (e) {
          /* private mode: fall through to the OS preference */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- The operator's map tile source (window.ZV_MAP); deferred, so it
         still runs before the app module below. -->
    <script defer src="/assets/map-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
