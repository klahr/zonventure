<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#ad1357" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Zonventure</title>
    <meta name="application-name" content="Zonventure" />
    <meta name="zv-currency" content="sek" />
    <script>
      // Applied before first paint so a dark-mode user never sees a
      // white flash; see the player app's index.html.
      (function () {
        try {
          var t = localStorage.getItem("zv-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.dataset.theme = t;
          }
        } catch (e) {
          /* private mode: fall through to the OS preference */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
