name: CI

on:
  push:
    branches: [main]
    # A pushed release tag also publishes the image to ghcr.io (see
    # the publish job), which production pulls.
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Setting CI makes internal/dbtest treat an unreachable Postgres as a
  # failure rather than a skip. Without it a broken service container
  # produces a green run that skipped ~200 DB-bound tests. See
  # internal/dbtest/dbtest.go.
  CI: "true"
  # CGO is set per step, not globally. The race detector needs it on;
  # the release binary needs it off so the distroless static image
  # works. The previous SourceHut config set CGO_ENABLED=0 globally and
  # also ran `go test -race`, which cannot have worked.

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest

    env:
      ZV_TEST_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable

    steps:
      # Postgres runs as a plain container rather than a service so it
      # can take server flags: data on tmpfs with fsync off. Nothing here
      # needs durability, and every test clones a database, which is
      # write-heavy. Started first so it boots while the toolchains and
      # frontend install.
      - name: start postgres
        run: |
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres \
            --tmpfs /var/lib/postgresql/data \
            postgres:16-alpine \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Built before the Go steps so the SPA embed tests assert rather
      # than skip. Those tests are the only thing that catches a binary
      # shipping an index.html whose chunks were never embedded — a
      # failure that is otherwise silent until a blank page in
      # production.
      #
      # build:assets is the bundle alone. The JS job already typechecks,
      # and repeating tsc here put ~40s on this job's critical path.
      - name: build frontend
        run: cd web && npm ci && npm run build:assets --workspaces --if-present

      # Gate on the database actually accepting connections; otherwise
      # the first test races the container's startup.
      - name: wait for postgres
        run: timeout 60 sh -c 'until docker exec postgres pg_isready -U postgres; do sleep 1; done'

      # One run, verbose, so the skip check below can read the same log
      # instead of running the whole suite a second time.
      #
      # Belt and braces alongside the CI guard in dbtest: if any test
      # reports a skip, the DB-bound surface is silently not running.
      - name: go test -race
        env:
          CGO_ENABLED: "1"
        run: |
          set -o pipefail
          go test -race -v ./... 2>&1 | tee /tmp/test.log
          skipped=$(grep -E '^ *--- SKIP' /tmp/test.log || true)
          if [ -n "$skipped" ]; then
            echo "Tests skipped in CI — the DB-bound surface is not running:" >&2
            echo "$skipped" >&2
            exit 1
          fi

  # Split from the test job so vet and the release build run alongside
  # the race suite rather than ahead of and after it. The build embeds
  # the committed placeholder frontend; the Docker job covers the real
  # embedded build.
  lint:
    name: Go lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # CGO off so the binary is fully static, matching what the
      # distroless runtime image in the Dockerfile requires.
      - name: build
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath \
            -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o /tmp/zonventure ./cmd/server

  js:
    name: JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        run: cd web && npm ci

      # Typecheck is separate from build so a type error is reported as
      # a type error rather than buried in a bundler failure.
      - name: typecheck
        run: cd web && npm run typecheck --workspaces --if-present

      - name: test
        run: cd web && npm run test --workspaces --if-present

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `git describe` needs tags and full history. actions/checkout
          # is shallow and tagless by default, which would otherwise
          # degrade every image's stamped version to a bare SHA.
          fetch-depth: 0

      - name: version
        id: version
        run: echo "version=$(git describe --tags --always 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Layers cached in the GitHub Actions cache, so a change that
      # touches only Go skips the npm install and frontend build stage,
      # and vice versa for go mod download.
      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: zonventure:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Release tags only, and only once every other job is green. Pushes
  # :X.Y.Z (what `make upgrade` pins) and :latest (what a bare
  # `docker compose up -d` with compose.prod.yaml runs).
  publish:
    name: Publish image
    if: startsWith(github.ref, 'refs/tags/')
    needs: [go, lint, js, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: log in to ghcr.io
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: build and push
        run: |
          VERSION="${GITHUB_REF_NAME}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          # The source label links the package to this repo.
          docker build --build-arg "VERSION=$VERSION" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
